1-10-title: Stopa siromaštva prema kriteriju od 6,85 dolara dnevno - zamjenski pokazatelj
1-10-definition: >-
  Procijenjeni procenat stanovništva svake zemlje koji živi ispod praga siromaštva od 6,85 USD dnevno prema paritetu kupovne moći (PPP) pri konstantnim cijenama iz 2011. godine.
1-10-intention: >-
  Siromaštvo i socijalna isključenost štetni su za živote pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal utječući na njihovo zdravlje i dobrobit te smanjujući obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez učinkovitog sustava obrazovanja, zdravstvene zaštite, socijalne zaštite, poreznih olakšica i zapošljavanja, rizik od siromaštva prenosi se s generacije na generaciju. To uzrokuje ustrajnost siromaštva i time stvara još veću nejednakost, što može dovesti do dugoročnog gubitka ekonomske produktivnosti cijelih skupina društva i ometati inkluzivni i održivi gospodarski rast.
1-10-methodology: >-
  Paritet kupovne moći (PPP) koristi se u procjeni globalnog siromaštva kako bi se prilagodile razlike u cijenama među zemljama. PPP su indeksi cijena koje objavljuje Međunarodni program za usporedbu (ICP) i koji mjere koliko košta kupnja košarice roba i usluga u jednoj zemlji u usporedbi s time koliko košta kupnja iste košarice roba i usluga u referentnoj zemlji, obično Sjedinjenim Američkim Državama. Faktori konverzije PPP-a poželjniji su od tržišnih deviznih tečajeva za mjerenje globalnog siromaštva jer ovi drugi precjenjuju siromaštvo u zemljama u razvoju, gdje su netrgovinske usluge relativno jeftine (fenomen poznat kao Balassa-Samuelson-Penn efekt).
1-10-long_term_objective: >-
  Smanjiti broj ljudi koji su u riziku od siromaštva ili socijalne isključenosti za 15 milijuna do 2030. godine u usporedbi s 2019. godinom (referenca politike: Akcijski plan za europski stup socijalnih prava)
1-20-title: Jaz siromaštva na 3,00 USD dnevno (PPP za 2021. godinu) (%) – zamjenski pokazatelj
1-20-definition: >-
  Jaz siromaštva na razini od 3,00 dolara dnevno (PPP iz 2021.) predstavlja prosječni deficit prihoda ili potrošnje u odnosu na granicu siromaštva od 3,00 dolara dnevno (pri čemu se uzima da nesiromašni nemaju deficita), izražen kao postotak te granice siromaštva. Ova mjera odražava kako dubinu siromaštva, tako i njegovu obuhvatnost.
1-20-intention: >-
  Za zemlje s aktivnim programom praćenja siromaštva, Svjetska banka — u suradnji s nacionalnim institucijama, drugim razvojnim agencijama i civilnim društvom — redovito provodi analitičke aktivnosti kako bi procijenila opseg i uzroke siromaštva i nejednakosti, ispitala utjecaj gospodarskog rasta i javnih politika te pregledala podatke iz anketa o kućanstvima i metode mjerenja.
1-20-methodology: >-
  Stope siromaštva procjenjuju se na temelju odabranih anketa o potrošnji kućanstava. Općenito, ankete ispituju reprezentativni uzorak kućanstava u nekoj zemlji o njihovoj potrošnji ili prihoda. Ove su ankete često službena istraživanja koja zemlje koriste za praćenje i izvješćivanje o stanju siromaštva.
1-20-long_term_objective: >-
  Tekst u izradi
1-31-title: Stopa teške materijalne i socijalne deprivacije prema dobroj grupi i spolu
1-31-definition: >-
  Područje „Dohodak i životni uvjeti” (EU-SILC) obuhvaća sljedeće teme: osobe u riziku od siromaštva ili socijalne isključenosti, nejednakost dohotka, raspodjelu dohotka i monetarno siromaštvo, životne uvjete i materijalnu deprivaciju. Obuhvaća i EU-SILC ad hoc module koji su organizirani u zbirke pokazatelja o određenim temama.
  Zbirka EU-SILC ključni je instrument za pružanje informacija koje se zahtijevaju u Europskom semestru ([1]) i Europskom stupu socijalnih prava. Također je glavni izvor podataka za potrebe mikrosimulacije i za izradu brzih procjena raspodjele dohotka i stopa siromaštva. 
  EU-SILC je 2024. godine, uz godišnje podatke, prikupio i trogodišnji modul o zdravlju djece, pristupu zdravstvenoj skrbi i specifičnoj deprivaciji djece te šestogodišnji modul o pristupu uslugama. Informacije prikupljene u EU-SILC-u odnose se na sljedeće vrste statističkih jedinica: privatna kućanstva i osobe koje žive u tim kućanstvima. Prilog II Uredbe EU 2019/2242  definira specifične statističke jedinice za svaku varijablu, dok Prilog IV iste Uredbe specificira sadržaj izvješća o kvaliteti organizacije uzorka ankete u domeni dohotka i životnih uvjeta, sukladno Uredbi EU 2019/1700 Europskog parlamenta i Vijeća.
1-31-intention: >-
  Zajednički okvir EU-SILC ima za cilj osigurati normizaciju na različitim razinama. Konceptualna standardizacija postiže se definiranjem i dokumentiranjem zajedničkih koncepata/definicija na kojima se temelji svaka mjera/varijabla, opsega i vremenske reference.
  U 2021. godini stupilo je na snagu novo zakonodavstvo o provedbi EU-SILC-a, revidirajući i poboljšavajući anketu (vidi odjeljak 3.4). Novim zakonodavstvom predviđene su višestruke promjene u prikupljanju podataka EU-SILC-a, a posebno:

  •	provodio je potrebu za sljedećim poboljšanjima: poboljšana pravovremenost, s kraćim rokovima za dostavu podataka EU-SILC-a;

  •	reformulirala je zahtjeve preciznosti na nacionalnoj i regionalnoj razini (NUTS2) za pokazatelj rizika od siromaštva ili socijalne isključenosti i stopu trajnog rizika od siromaštva;

  •	dodatne/promijenjene EU-SILC varijable;

  •	prikupljanje podataka s tri frekvencije: jezgra, trogodišnji modul i šestogodišnji modul te preporuka za proširenje uzdužnog panela.
1-31-methodology: >-
  Ciljana populacija su privatna kućanstva i sve osobe koje čine ta kućanstva s uobičajenim boravištem na državnom području. Privatnim kućanstvom smatra se osoba koja živi sama ili skupina osoba koje žive zajedno, osiguravajući sebi osnovne životne potrebe.
  Referentno razdoblje je godina istraživanja. Za sve zemlje referentno razdoblje za varijable dohotka u EU-SILC-u je prethodna kalendarska godina.
  Koncept točnosti odnosi se na preciznost procjena izračunatih iz uzorka, a ne iz cijele populacije. Točnost ovisi o veličini uzorka, učincima dizajna uzorkovanja i strukturi populacije koja se proučava. Osim toga, potrebno je uzeti u obzir pogreške uzorkovanja i pogreške koje nisu uzorkovane. Pogreška uzorkovanja znači varijabilnost koja se javlja nasumično zbog korištenja uzorka, a ne popisa, a pogreške koje nisu uzorkovane pogreške su koje se javljaju u svim fazama procesa prikupljanja i proizvodnje podataka.
  Od 2021
  Uredba EU-a 2019/1700 utvrđuje zahtjeve koji se odnose na zemljopisnu pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu s Prilogom III toj Uredbi, karakteristike uzorkovanja, zajednička razdoblja prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderiranje, procjenu i procjenu varijance.
1-31-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
1-40-title: Osobe koje žive u kućanstvima s vrlo niskim intenzitetom rada, po dobnim skupinama
1-40-definition: >-
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal utječući na njihovo zdravlje i dobrobit te smanjujući obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez učinkovitog obrazovanja, zdravstvenih, socijalnih, poreznih olakšica i sustava zapošljavanja, rizik od siromaštva prenosi se s jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih skupina društva i ometati uključiv i održiv gospodarski rast.
1-40-intention: >-
  Ljudi u dobi od 0 do 64 godine koji žive u kućanstvima u kojima su odrasli radili radno vrijeme jednako ili manje od 20 % njihovog ukupnog kombiniranog potencijala radnog vremena tijekom prethodne godine.
  Odrasli broje osobe u dobi od 18 do 64 godine. Studenti u dobi od 18 do 24 godine; osobe koje su u mirovini u skladu sa svojim samoodređenim trenutnim ekonomskim statusom ili koje primaju bilo kakvu mirovinu (osim mirovine za nadživjele članove obitelji); i osobe u dobnoj skupini od 60 do 64 godine koje su neaktivne i žive u kućanstvu u kojem je glavni dohodak mirovina, ne uzimaju se u obzir.
  Pokazatelj je dio višedimenzionalnog indeksa siromaštva.
1-40-methodology: >-
  Referentno razdoblje je godina istraživanja. Za sve zemlje referentno razdoblje za varijable dohotka u EU-SILC-u je prethodna kalendarska godina.
  Pokazatelj je uključen kao sekundarni pokazatelj u Pregled socijalnih pokazatelja za Europski stup socijalnih prava i Akcijski plan EPSR-a te je dio višedimenzionalnog indeksa siromaštva. Može se smatrati dijelom globalnog pokazatelja ciljeva održivog razvoja 1.2.2 „Udio muškaraca, žena i djece svih dobnih skupina koji žive u siromaštvu u svim njegovim dimenzijama prema nacionalnim definicijama“
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na zemljopisnu pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu s Prilogom III., zajednička razdoblja prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderiranje, procjenu i procjenu varijance.
1-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
1-41-title: Stopa zaposlenih u riziku od siromaštva
1-41-definition: >-
  Pokazatelj je dio skupa pokazatelja Ciljeva održivog razvoja EU (SDG), gdje se koristi za praćenje napretka prema cilju održivog razvoja 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje, što je ugrađeno u prioritete Evropske komisije u okviru „Ekonomije koja radi za ljude”.
  Pokazatelj je uključen kao sekundarni pokazatelj u Pregled socijalnih pokazatelja za Europski stup socijalnih prava i Akcijski plan EPSR-a.
  Udio osoba koje su zaposlene i imaju ekvivalentni raspoloživi dohodak ispod praga rizika od siromaštva, koji je postavljen na 60 % nacionalnog medijana ekvivalentnog raspoloživog dohotka (nakon socijalnih transfera). Za potrebe ovog pokazatelja smatra se da je pojedinac zaposlen ako je bio zaposlen više od polovice referentne godine. Pokazatelj se temelji na EU-SILC (statistika o dohotku, socijalnoj uključenosti i životnim uvjetima).
1-41-intention: >-
  Zaposlenost se često tvrdi da je najbolja zaštita od siromaštva, pa je jedan od ciljeva EU stvaranje više i boljih radnih mjesta. Stoga je važno izmjeriti udio siromašnih radnika, ljudi koji žive ispod granice siromaštva iako rade.
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal utječući na njihovo zdravlje i dobrobit te smanjujući obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez učinkovitog obrazovanja, zdravstvenih, socijalnih, poreznih olakšica i sustava zapošljavanja, rizik od siromaštva prenosi se s jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih skupina društva i ometati uključiv i održiv gospodarski rast.
1-41-methodology: >-
  Pokazatelj je izrađen u skladu s visokim standardima kvalitete europske statistike. Od 2005. nadalje, EU-SILC se temelji na zajedničkom okviru definiranom usklađenim popisima primarnih i sekundarnih varijabli, zajedničkim konceptima, preporučenom dizajnu, zajedničkim zahtjevima (kao što su postupci imputiranja, ponderiranje, izračun pogrešaka uzorkovanja) i klasifikacijama s ciljem maksimiziranja usporedivosti proizvedenih informacija.
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na zemljopisnu pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu s Prilogom III., zajednička razdoblja prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderiranje, procjenu i procjenu varijance.
1-41-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
1-50-title: Pristupačno stanovanje - zamjenski pokazatelj
1-50-definition: >-
  Stambena pristupačnost u BiH dostigla je kritičnu točku, gdje siromašna kućanstva troše preko 40% svojih prihoda na stanovanje. Mnogi čimbenici, poput potražnje dijaspore i stranih investitora, fragmentirane i loše koordinirane stambene politike, doveli su do toga da cijene budu izvan dosega stanovnika. Sustavi socijalnog stanovanja ostaju nerazvijeni, dok neformalna tržišta najma potiču ranjivost najmoprimaca i lišavaju vlade poreznih prihoda.
1-50-intention: >-
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal utječući na njihovo zdravlje i dobrobit te smanjujući obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez učinkovitog obrazovanja, zdravstvenih, socijalnih, poreznih olakšica i sustava zapošljavanja, rizik od siromaštva prenosi se s jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih skupina društva i ometati uključiv i održiv gospodarski rast.
1-50-methodology: >-
  Pored analize postojećih podataka/dokumenata, ovaj se rad oslanja na uvide iz osam polustrukturiranih intervjua provedenih sa zainteresiranim stranama u Bosni i Hercegovini, Crnoj Gori, Danskoj i Nizozemskoj. Među ispitanicima su bili predstavnici kantonalnih ministarstava, općinskih vlasti, nevladinih organizacija koje rade na pravima stanara i pristupačnosti stanovanja te istraživači specijalizirani za stambene sustave. Ovi su intervjui pružili praktične perspektive o izazovima socijalnog stanovanja, neformalnih tržišta najma, praznih nekretnina i pristupačnosti.
1-50-long_term_objective: >-
  Bosna i Hercegovina se ubraja među najmanje pristupačne zemlje u Europi za stanovanje, s prosječnim omjerom cijene i prihoda koji prelazi 13, što je znatno iznad, na primjer, Nizozemske sa 7,7 i Danske sa 6,6.
2-10-title: Stopa pretilosti prema indeksu tjelesne mase (BMI)
2-10-definition: >-
  Europsko istraživanje zdravstvenog stanja (EHIS) ima za cilj mjerenje zdravstvenog stanja (uključujući invaliditet), čimbenika koji utječu na zdravlje (stil života) građana EU, korištenje zdravstvenih usluga i ograničenja u pristupu tim uslugama, na harmoniziran način i s visokim stupnjem usporedivosti među državama članicama (DC). Opći obuhvat istraživanja odnosi se na populaciju stariju od 15 godina koja živi u privatnim kućanstvima na teritoriju zemlje. EHIS se sastoji od četiri modula: zdravstveno stanje, čimbenici koji utječu na zdravlje, zdravstvena zaštita i osnovne varijable (sociodemografske karakteristike populacije).
2-10-intention: >-
  EHIS ima za cilj postizanje standardizacije unosa podataka. Pripremljen je standardni model upitnika (pitanja, kategorije odgovora, filteri itd.), kao i konceptualne smjernice i objašnjenja. Zatražen je konceptualni prijevod na sve jezike EU. U metodološkom priručniku za EHIS val 3 pružena je procjena usporedivosti varijabli s onima iz vala 2 koristeći sljedeću ljestvicu: "identično pitanje"; "neznatno izmijenjeno pitanje"; "značajno izmijenjeno pitanje"; ili "nije dostupno: novo pitanje u EHIS valu 3."
2-10-methodology: >-
  EHIS ima za cilj postizanje standardizacije unosa podataka. Pripremljen je standardni model upitnika (pitanja, kategorije odgovora, filtri itd.), kao i konceptualne smjernice i objašnjenja. Zatražen je konceptualni prijevod na sve jezike EU.
  U metodološkom priručniku za EHIS val 3 pružena je procjena usporedivosti varijabli s onima iz vala 2 koristeći skalu: "identično pitanje"; "blago izmijenjeno pitanje"; "jako izmijenjeno pitanje"; ili "nije dostupno: novo pitanje u EHIS val 3."
2-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je BMI 3.
2-20-title: Realni faktorski dohodak poljoprivrede po godišnjoj radnoj jedinici (AWU)
2-20-definition: >-
  Pokazatelj se koristi za praćenje napretka prema SDG 2 o završetku gladi i pothranjenosti; koji je uključen u Prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom 'Održavanje naše kvalitete života: Sigurnost hrane, voda i priroda'.
  Realni prihod od poljoprivrednih faktora mjeri prihod ostvaren poljoprivredom, koji se koristi za plaćanje posuđenih, iznajmljenih ili vlastitih faktora proizvodnje (kapital, rad i zemljište).
  Godišnje jedinice rada (AWU) definirane su kao ekvivalent punog radnog vremena (odgovara broju radnih mjesta u punom radnom vremenu), što se izračunava dijeljenjem ukupnog broja odrađenih sati s prosječnim godišnjim brojem sati provedenih na poslovima u punom radnom vremenu unutar gospodarskog teritorija. To se može protumačiti kao mjera produktivnosti rada u poljoprivredi. Podaci potječu iz Ekonomske računovodstvene evidencije za poljoprivredu (EAA), koja pruža detaljne informacije o prihodima poljoprivrednog sektora.
2-20-intention: >-
  Cilj SDG 2 je osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Poboljšanje poljoprivredne produktivnosti i prihoda proizvođača hrane ključni su čimbenici za postizanje ovog cilja. 
  Jedan od pet općih ciljeva Zajedničke poljoprivredne politike (ZPP) je osigurati pravednu razinu života za poljoprivrednike. ZPP se financira iz dva fonda: Europskog poljoprivrednog jamstvenog fonda (EPJF), koji financira izravne potpore poljoprivrednicima, kao i tržišne mjere, i Europskog poljoprivrednog fonda za ruralni razvoj (EPFRR), putem kojeg se financiraju programi ruralnog razvoja. EU subvencije i izravne potpore postale su važan udio u prihodu od poljoprivrednih čimbenika.
2-20-methodology: >-
  Jedan od pet općih ciljeva Zajedničke poljoprivredne politike (ZPP) je osigurati pravednu razinu života za poljoprivrednike. ZPP financiraju dva fonda: Europski poljoprivredni jamstveni fond (EAGF), koji financira izravne uplate poljoprivrednicima kao i tržišne mjere, te Europski poljoprivredni fond za ruralni razvoj (EAFRD), putem kojeg se financiraju programi ruralnog razvoja. EU subvencije i izravne uplate postale su značajan udio u dohotku od poljoprivrednih čimbenika.
2-20-long_term_objective: >-
  povećati produktivnost i profitabilnost poljoprivrednog sektora kroz:

  - Povećanje stvarnog dohotka faktora

  - Smanjenje poljoprivrednog rada

  - Stabiliziranje poljoprivrednog dohotka
2-30-title: Državna potpora poljoprivrednom istraživanju i razvoju
2-30-definition: >-
  Pokazatelj se odnosi na državna proračunska izdvajanja za istraživanje i razvoj (GBARD) za poljoprivredu. Podaci GBARD-a mjere državnu potporu aktivnostima istraživanja i razvoja (R&R) ili, drugim riječima, koliko vlade daju prioritet javnom financiranju istraživanja i razvoja. Podaci GBARD-a sastavljaju se korištenjem smjernica utvrđenih u OECD-ovom Frascati priručniku iz 2015. i Europskom metodološkom priručniku za poslovnu statistiku za statistiku istraživanja i razvoja iz 2023. Podaci su izraženi u tekućim cijenama, što znači da na ukupni razvoj pokazatelja djelomično utječe i opća inflacija cijena.
2-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji su ugrađeni u prioritete Europske komisije za razdoblje 2024.-2029. u okviru programa „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“. 
  Cilj održivog razvoja 2 - između ostalog - ima za cilj osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Poboljšanje poljoprivredne produktivnosti i održavanje održivih i otpornih sustava proizvodnje hrane ključni su čimbenici u postizanju ovog cilja i uvelike ovise o povećanim ulaganjima u istraživanje i razvoj u poljoprivredi, hrani i prehrani.
2-30-methodology: >-
  Zemlje prikupljaju podatke GBARD-a slijedeći preporuke Frascati priručnika. Među nekoliko metodoloških pitanja koja mogu utjecati na usporedbe među zemljama su faza u proračunskom procesu iz koje se izvlače konačni podaci GBARD-a (konačna proračunska sredstva ili stvarni izdaci); uključivanje PDV-a ili sredstava EU za istraživanje i razvoj.
  Podaci GBARD-a raščlanjeni su prema:

  - Socioekonomskim ciljevima (SEO) u skladu s Nomenklaturom za analizu i usporedbu znanstvenih programa i proračuna (NABS 2007). - (Vidi Prilog 3 na dnu stranice).

  - Način financiranja: financiranje projekata i institucionalno financiranje (neobvezni podaci).
  Dio GBARD-a dodijeljen transnacionalnoj suradnji u istraživanju i razvoju dalje se dijeli na tri specifične kategorije: transnacionalni javni izvođači istraživanja i razvoja; transnacionalni javni programi istraživanja i razvoja na europskoj razini; i bilateralni ili multilateralni javni programi istraživanja i razvoja uspostavljeni između vlada država članica ili s EFTA-om i zemljama kandidatkinjama.
2-30-long_term_objective: >-
  Jačanje tržišne orijentacije i konkurentnosti (kratkoročna ocjena 2018. – 2023. 4,9%; dugoročna ocjena 2008. – 2023. 1,5%)
2-40-title: Površina pod organskom poljoprivredom
2-40-definition: >-
  Ovaj pokazatelj definiran je kao udio ukupne korištene poljoprivredne površine (KPP) koju zauzima organska poljoprivreda (postojeća organski obrađena područja i područja u prenamjeni). Organska poljoprivreda je metoda proizvodnje koja stavlja najveći naglasak na zaštitu okoliša i divljih životinja, a u pogledu stočarstva i na dobrobit životinja. Izbjegava ili uvelike smanjuje upotrebu sintetičkih kemijskih dodataka, poput gnojiva, pesticida, aditiva i medicinskih proizvoda.
2-40-intention: >-
  Ekološka poljoprivreda u Bosni i Hercegovini počela se razvijati 1990-ih godina. Unatoč osmerostrukom povećanju površina pod ekološkom proizvodnjom između 2014. i 2022. godine, ukupno poljoprivredno zemljište pod ovim uzgojem dostiglo je skromnih 2.495 ha u 2022. godini. Jedan od ciljeva strategija ruralnog razvoja za razdoblje 2021.–2027. jest ostvarivanje značajnog rasta ekološke poljoprivrede.
2-40-methodology: >-
  Pokazatelj se može smatrati dijelom globalnog pokazatelja ciljeva održivog razvoja 2.4.1 "Udio poljoprivrednog područja pod produktivnom i održivom poljoprivredom". Iako organska poljoprivreda nije izričito spomenuta u Agendi 2030, EU smatra organsku poljoprivredu metodom proizvodnje koja stavlja najveći naglasak na zaštitu okoliša i divljih životinja, a u pogledu stočarstva i na dobrobit životinja. Izbjegava ili uvelike smanjuje upotrebu sintetičkih kemijskih inputa poput gnojiva, pesticida, aditiva i medicinskih proizvoda. Proizvodnja genetski modificiranih organizama (GMO) i njihova upotreba u stočnoj hrani su zabranjeni.
  Strategija bioraznolikosti za 2030. ključna je komponenta Europskog zelenog plana. Cilj strategije je smanjiti upotrebu i rizik kemijskih pesticida, smanjiti gubitke hranjivih tvari te smanjiti upotrebu gnojiva i antibiotika. Strategija bioraznolikosti postavlja cilj postizanja 25 % ukupnog poljoprivrednog zemljišta EU pod organskom poljoprivredom do 2030. godine.
2-40-long_term_objective: >-
  Najmanje 25 % poljoprivrednog zemljišta EU trebalo bi biti pod organskom poljoprivredom do 2030. godine
2-53-title: Uporaba i rizik kemijskih pesticida
2-53-definition: >-
  Pokazatelj prati trendove u upotrebi i riziku kemijskih pesticida u EU i njezinim državama članicama. Upotreba pesticida sa sobom nosi rizike i utjecaje na ljudsko zdravlje i okoliš. Pokazatelj se temelji na količinama kemijski aktivnih tvari sadržanih u pesticidima koji se stavljaju na tržište (prodaju), a time i koriste, u svakoj državi članici, te na opasnim svojstvima tih aktivnih tvari. Podaci su prikazani kao indeks u odnosu na prosječne rezultate za razdoblje od 2015. do 2017. godine.
2-53-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. u okviru programa „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“.
  Cilj održivog razvoja 2 ima za cilj osigurati pristup sigurnoj, hranjivoj i dovoljnoj količini hrane. Održivi i otporni sustavi proizvodnje hrane ključni su čimbenik u postizanju ovog cilja. Uz promicanje organske poljoprivrede, integrirano suzbijanje štetočina (IPM) jedan je od alata za naglašavanje rasta zdravih usjeva poticanjem prirodnih mehanizama suzbijanja štetočina i smanjenjem ili minimiziranjem rizika za ljudsko zdravlje i okoliš.
  Cilj „Akcijskog plana za nulto onečišćenje“ EU-a je smanjiti upotrebu i rizik kemijskih pesticida i upotrebu opasnijih pesticida za 50% do 2030. godine.
2-53-methodology: >-
  Izračun se temelji na količinama kemijski aktivnih tvari koje su odobrene kao kandidati za zamjenu u skladu s člankom 24. Uredbe (EZ) br. 1107/2009, sadržanih u sredstvima za zaštitu bilja koja se stavljaju na tržište u sredstvima za zaštitu bilja svake godine prijavljenim prema Uredbi (EZ) br. 1185/2009 u skladu s Uredbom (EZ) br. 1107/2009 i dostavljenim u skladu s Prilogom I. Uredbe (EZ) br. 1185/2009.
2-53-long_term_objective: >-
  Smanjiti upotrebu i rizik kemijskih pesticida za 50 % do 2030. u usporedbi s trogodišnjom početnom vrijednošću (prosjek za razdoblje od 2015. do 2017.)
2-60-title: Emisije amonijaka iz poljoprivrede
2-60-definition: >-
  Količina emisija amonijaka (NH3) kao rezultat poljoprivredne proizvodnje. Emisije amonijaka po hektaru izračunavaju se korištenjem ukupne korištene poljoprivredne površine (UAA) odgovarajuće godine kao nazivnika.
  Podaci za ovaj pokazatelj potječu iz popisa onečišćenja zraka EU-a koji je sastavila Europska agencija za okoliš (EEA) u okviru Konvencije o prekograničnom onečišćenju zraka na velike udaljenosti (LRTAP) i u potpunosti su u skladu s nacionalnim popisima onečišćenja zraka koje su sastavile države članice EU-a.
  Podaci o korištenoj poljoprivrednoj površini (UAA) potječu iz godišnje statistike usjeva Eurostata. Definicija ovog pokazatelja temelji se na pokazatelju CAP-a C45 Emisije iz poljoprivrede
2-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. u okviru programa „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“.
  Cilj održivog razvoja 2 teži održivim i otpornim sustavima proizvodnje hrane. Amonijak (NH3) je bezbojan, oštrog mirisa i korozivan plin koji nastaje raspadanjem organske biljne tvari te iz izmeta ljudi i životinja. Kada se ispusti u atmosferu, amonijak doprinosi razini onečišćenja zraka. Poljoprivredni sektor i dalje je najveći uzrok emisija amonijaka u EU.
2-60-methodology: >-
  Pokazatelj prati trendove u korištenju i riziku kemijskih pesticida u EU i njezinim državama članicama. Upotreba pesticida nosi rizike i utjecaje na ljudsko zdravlje i okoliš. Pokazatelj se temelji na količinama kemijski aktivnih tvari sadržanih u pesticidima koji se stavljaju na tržište (prodaju), a time i koriste, u svakoj državi članici, te na opasnim svojstvima tih aktivnih tvari. Podaci su prikazani kao indeks u odnosu na prosječne rezultate za razdoblje od 2015. do 2017. godine.
  Mjere provedene u okviru Zajedničke poljoprivredne politike (ZPP) i Okvirne direktive o vodama dovele su do smanjenja emisija amonijaka iz poljoprivrede u EU od 1990-ih. Konkretno, mjere za promjenu poljoprivrednih praksi dovele su do smanjenja upotrebe dušičnih gnojiva i smanjenja gustoće stoke po hektaru diljem EU.
  Direktiva o nacionalnim obvezama smanjenja emisija (Direktiva NEC) postavlja nacionalne obveze smanjenja emisija za države članice i EU za pet važnih onečišćujućih tvari u zraku, uključujući amonijak.
2-60-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 8 po hektaru.
3-12-title: Očekivano trajanje života u dobrom zdravlju na temelju samoprocjene zdravlja
3-12-definition: >-
  Ovaj pokazatelj procjenjuje broj godina koliko se očekuje da će osoba živjeti u dobrom percipiranom zdravlju. Temelji se na podacima o smrtnosti u kombinaciji s podacima o samoprocjeni zdravlja kako je navedeno u Statistici EU o dohotku i životnim uvjetima (EU-SILC).
3-12-intention: >-
  Pokazatelj je dio skupa pokazatelja Ciljeva održivog razvoja EU (SDG). Koristi se za praćenje napretka prema cilju 3 o dobrom zdravlju i blagostanju te cilju 1 o uklanjanju siromaštva kao višenamjenski pokazatelj (MPI); koji su ugrađeni u prioritete Europske komisije za razdoblje 2024.-2029. u okviru „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“.
3-12-methodology: >-
  Dobro zdravlje nije vrijedno samo za pojedinca kao glavna odrednica kvalitete života, blagostanja i društvenog sudjelovanja, već je i osnovni preduvjet za opći gospodarski rast. Praćenje cilja održivog razvoja 3 u kontekstu EU usmjereno je na teme zdravog života, odrednica zdravlja, uzroka smrti i zdravstvene skrbi.
3-12-long_term_objective: >-
  Nema opisa
3-20-title: Udio ljudi sa dobrim ili vrlo dobrim percipiranim zdravljem prema spolu
3-20-definition: >-
  Pokazatelj je subjektivna mjera o tome kako ljudi procjenjuju svoje zdravlje općenito na ljestvici od "vrlo dobro" do "vrlo loše". Izražava se kao udio populacije u dobi od 16 ili više godina koja sebe doživljava kao "dobro" ili "vrlo dobro" zdravlje.
  Utvrđeno je da su pokazatelji percipiranog općeg zdravlja dobar prediktor budućeg korištenja zdravstvene zaštite i smrtnosti ljudi. Podaci proizlaze iz Statistike EU-a o dohotku i životnim uvjetima (EU SILC).
3-20-intention: >-
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na zemljopisnu pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu s Prilogom III, zajednička razdoblja prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderiranje, procjenu i procjenu varijance.
3-20-methodology: >-
  Od 2021. nadalje, EU-SILC se temelji na zajedničkom okviru definiranom usklađenim popisima primarnih i sekundarnih varijabli, zajedničkim konceptima, preporučenom dizajnu, zajedničkim zahtjevima (kao što su postupci imputiranja, ponderiranje, izračun pogrešaka uzorkovanja) i klasifikacijama s ciljem maksimiziranja usporedivosti proizvedenih informacija. Pojedinosti se mogu pronaći u metapodacima izvornih skupova podataka.
3-20-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 80.
3-30-title: Prevalencija pušenja prema spolu
3-30-definition: >-
  Ovaj pokazatelj mjeri postotak stanovništva starijeg od 15 godina koje izvještava da trenutno puši cigarete, cigare, cigarilose ili lulu. Ne uključuje uporabu drugih duhanskih i srodnih proizvoda kao što su elektroničke cigarete i snuf. Podaci se prikupljaju putem istraživanja Eurobarometra i temelje se na osobnoj upotrebi tijekom razgovora uživo u domovima ljudi.
3-30-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”.
3-30-methodology: >-
  Pokazatelj se može smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 3.a.1 „Starosno standardizirana prevalencija trenutne uporabe duhana kod osoba u dobi od 15 godina i starijih“.
  Nekoliko direktiva EU-a ima za cilj zaštititi građane od opasnih učinaka pušenja, uključujući Direktivu o duhanskim proizvodima, Direktivu o oglašavanju duhana i Direktivu o oporezivanju duhana.
3-30-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 12
3-42-title: Standardizirani mortalitet koji se može spriječiti i liječiti
3-42-definition: >-
  Smrtnost koja se može izbjeći obuhvaća uzroke smrtnosti koji se mogu spriječiti i liječiti. Smrtnost koja se može spriječiti odnosi se na smrtnost koja se uglavnom može izbjeći učinkovitim javnozdravstvenim i primarnim preventivnim intervencijama (koje se provode prije pojave bolesti/ozljeda kako bi se smanjila incidencija). Smrtnost koja se može liječiti uglavnom se može izbjeći pravovremenim i učinkovitim zdravstvenim intervencijama, uključujući sekundarnu prevenciju i liječenje (nakon pojave bolesti).
3-42-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”. 
  Glavni preduvjet za postizanje tih ciljeva je univerzalna zdravstvena pokrivenost; pristup uslugama seksualnog i reproduktivnog zdravlja te sigurnim, pristupačnim i učinkovitim lijekovima i cjepivima za sve. Standardizirane stope smrtnosti koje se koriste za ovaj pokazatelj uzimaju u obzir da zemlje s većim udjelom starijih stanovnika također imaju veće stope smrtnosti.
3-42-methodology: >-
  Ukupna stopa smrtnosti koja se može izbjeći uključuje niz zaraznih bolesti, nekoliko vrsta karcinoma, endokrinih i metaboličkih bolesti, kao i neke bolesti živčanog, krvožilnog, dišnog, probavnog i genitourinarnog sustava, neke bolesti povezane s trudnoćom, porođajem i perinatalnim razdobljem, niz kongenitalnih malformacija, štetnih učinaka medicinske i kirurške skrbi, popis ozljeda i poremećaja povezanih s alkoholom i lijekovima.
  Smrtnost koja se može liječiti uglavnom se može izbjeći pravovremenim i učinkovitim zdravstvenim intervencijama, uključujući sekundarnu prevenciju i liječenje (nakon pojave bolesti kako bi se smanjila smrtnost). Podaci su prikazani kao standardizirane stope smrtnosti, što znači da su prilagođeni standardnoj dobnoj raspodjeli kako bi se izmjerile stope smrtnosti neovisno o različitim dobnim strukturama populacija kako bi se smanjila smrtnost).
3-42-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 150.
3-60-title: Samoprijavljena nezadovoljena potreba za liječničkim pregledom i skrbi prema spolu
3-60-definition: >-
  Ovaj pokazatelj mjeri udio stanovništva u dobi od 16 i više godina koje prijavljuje nezadovoljene potrebe za medicinskom skrbi iz jednog od sljedećih razloga: ‘financijski razlozi’, ‘lista čekanja’ i ‘predaleko za putovanje’. Samoprijavljene nezadovoljene potrebe odnose se na vlastitu procjenu osobe o tome treba li liječnički pregled ili liječenje (isključujući stomatološku skrb), ali ga nije imala ili ga nije tražila.
  Budući da društvene norme i očekivanja mogu utjecati na odgovore na pitanja o nezadovoljenim potrebama skrbi, potreban je oprez pri usporedbi razlika u izvješćivanju o nezadovoljenim liječničkim pregledima u različitim zemljama. Osim toga, različita organizacija zdravstvenih usluga još je jedan čimbenik koji treba uzeti u obzir prilikom analize podataka. Konačno, postoje i neke razlike u anketnim pitanjima među zemljama i tijekom vremena.
3-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti i cilju održivog razvoja 1 o siromaštvu kao višenamjenskom pokazatelju (MPI); koji su ugrađeni u prioritete Europske komisije za razdoblje 2024. - 2029. pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”.
3-60-methodology: >-
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
  Univerzalna zdravstvena pokrivenost cilj je Povelje EU-a o temeljnim pravima. Jedan od tri prioriteta zdravstvene politike EU-a je povećanje dostupnosti zdravstvene zaštite. Osim toga, jedno od 20 načela europskog stupa socijalnih prava je da svatko ima pravo na pravovremeni pristup pristupačnoj, preventivnoj i kurativnoj zdravstvenoj zaštiti dobre kvalitete.
3-70-title: Potrošnja antibiotika u zajednici i bolničkom sektoru – definirane dnevne doze (DDD) dnevno
3-70-definition: >-
  Ovaj pokazatelj mjeri ukupnu potrošnju antimikrobnih sredstava (AMC) u zajednici i bolničkom sektoru. AMC se izražava kao broj definiranih dnevnih doza (DDD) na 1000 stanovnika dnevno. Podaci se odnose na klasifikacijsku oznaku Anatomsko-terapijsko-kemijske (ATC) J01 ‘Antibakterijski lijekovi za sistemsku primjenu’. Podaci za EU agregat prikazani su kao populacijski ponderirana srednja vrijednost i uključuju imputacije i prilagodbe.
3-70-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”.
3-70-methodology: >-
  Glavni preduvjet za postizanje tih ciljeva je univerzalna zdravstvena pokrivenost; pristup uslugama seksualnog i reproduktivnog zdravlja te sigurnim, pristupačnim i učinkovitim lijekovima i cjepivima za sve. Standardizirane stope smrtnosti koje se koriste za ovaj pokazatelj uzimaju u obzir da zemlje s većim udjelom starijih stanovnika također imaju veće stope smrtnosti.
  Pokazatelj je sličan globalnom pokazatelju SDG 3.d.2 „Postotak infekcija krvotoka zbog odabranih antimikrobno rezistentnih organizama“.
3-70-long_term_objective: >-
  Smanjiti ukupnu potrošnju antibiotika kod ljudi za 20% do 2030. godine u odnosu na 2019. godinu.
4-10-title: Rano napuštanje obrazovanja i obuke po spolu
4-10-definition: >-
  Pokazatelj mjeri udio stanovništva u dobi od 18 do 24 godine s najviše nižim srednjoškolskim obrazovanjem koje nije bilo uključeno u bilo kakvo (formalno ili neformalno) obrazovanje ili osposobljavanje tijekom četiri tjedna koji su prethodili istraživanju.
4-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju i cilju održivog razvoja 5 o ravnopravnosti spolova, koji su ugrađeni u prioritete Europske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Europe“.
  Vijeće Europske unije 26. veljače 2021. donijelo je Rezoluciju o strateškom okviru za europsku suradnju u obrazovanju i osposobljavanju prema Europskom obrazovnom prostoru i šire (2021.-2030.), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvalitete, jednakosti, uključenosti i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje europskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u obrazovanju i osposobljavanju i kroz njih.
4-10-methodology: >-
  Rezolucijom Vijeća postavlja se cilj na razini EU-a da udio osoba koje rano napuštaju obrazovanje i osposobljavanje, mjeren ovim pokazateljem ciljeva održivog razvoja, bude manji od 9% do 2030. Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
  Obrazovanje i osposobljavanje ključni su pokretači rasta i zapošljavanja jer pomažu u poboljšanju zapošljivosti, produktivnosti, inovacija i konkurentnosti. Nastavak obrazovanja nakon osnovne razine važan je jer ljudi s višim kvalifikacijama imaju veću vjerojatnost da će biti zaposleni i manje je vjerojatno da će se suočiti sa siromaštvom u gospodarstvu temeljenom na znanju. Osobe s niskom razinom obrazovanja ne samo da se mogu suočiti s većim poteškoćama na tržištu rada, već imaju i veći rizik od siromaštva i socijalne isključenosti.
4-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 4.
4-20-title: Visoko obrazovanje prema spolu
4-20-definition: >-
  Pokazatelj mjeri udio stanovništva u dobi od 25 do 34 godine koje je uspješno završilo tercijarni studij (npr. na sveučilištu ili visokoj tehničkoj ustanovi). Postignuto tercijarno obrazovanje odnosi se na ISCED (Međunarodna standardna klasifikacija obrazovanja) razine 5–8 2011. za podatke od 2014. nadalje i na ISCED razine 5–6 1997. za podatke do 2013. Pokazatelj se temelji na Anketi o radnoj snazi EU-a (EU-LFS).
4-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju i cilju održivog razvoja 5 o ravnopravnosti spolova, koji su ugrađeni u prioritete Europske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Europe“.
  Vijeće Europske unije 26. veljače 2021. donijelo je Rezoluciju o strateškom okviru za europsku suradnju u obrazovanju i osposobljavanju prema Europskom obrazovnom prostoru i šire (2021.-2030.), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvalitete, jednakosti, uključenosti i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje europskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u obrazovanju i osposobljavanju i kroz njih.
4-20-methodology: >-
  Obrazovanje i osposobljavanje ključni su pokretači rasta i zapošljavanja jer pomažu u poboljšanju zapošljivosti, produktivnosti, inovacija i konkurentnosti. Nastavak obrazovanja nakon osnovne razine važan je jer ljudi s višim kvalifikacijama imaju veću vjerojatnost da će biti zaposleni i manje je vjerojatno da će se suočiti sa siromaštvom u gospodarstvu temeljenom na znanju. Osobe s niskom razinom obrazovanja ne samo da se mogu suočiti s većim poteškoćama na tržištu rada, već imaju i veći rizik od siromaštva i socijalne isključenosti.
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
4-20-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 52
4-31-title: Sudjelovanje u obrazovanju u ranom djetinjstvu prema spolu (djeca u dobi od 3 godine i više)
4-31-definition: >-
  Pokazatelj mjeri udio djece u dobi od tri godine do početne dobi obveznog osnovnog obrazovanja koja su sudjelovala u odgoju i obrazovanju u ranom djetinjstvu (ECEC) koji se može klasificirati kao ISCED razina 0 prema Međunarodnoj standardnoj klasifikaciji za obrazovanje (ISCED 2011). Da bi se programi ECEC-a klasificirali kao ISCED razina 0, moraju biti namjerno osmišljeni kako bi podržali djetetov kognitivni, fizički i socio-emocionalni razvoj. Početna dob obveznog osnovnog obrazovanja razlikuje se od zemlje do zemlje. Sudjelovanje djece u programima koji nisu namjerno osmišljeni za potporu razvoju djeteta (kao što su programi samo za skrb o djeci) nije uključeno u ovaj pokazatelj.
4-31-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe”, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela” i „Zaštita naše demokracije, održavanje naših vrijednosti”.
  Vijeće Europske unije 26. veljače 2021. donijelo je Rezoluciju o strateškom okviru za europsku suradnju u obrazovanju i osposobljavanju prema Europskom obrazovnom prostoru i šire (2021.-2030.), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvalitete, jednakosti, uključenosti i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje europskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u obrazovanju i osposobljavanju i kroz njih.
4-31-methodology: >-
  Budući da se rani i predškolski odgoj i obrazovanje sve više prepoznaju kao sastavni dio sustava obrazovanja i osposobljavanja, Rezolucija Vijeća postavlja cilj EU-a za sudjelovanje u ranom i predškolskom odgoju i obrazovanju na najmanje 96% djece u dobi od tri godine do početne dobi za obvezno osnovno obrazovanje do 2030. godine.
4-31-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 100.
4-40-title: Petnaestogodišnjaci s niskim rezultatima u čitanju, matematici ili prirodnim znanostima
4-40-definition: >-
  Pokazatelj mjeri udio 15-godišnjih učenika koji ne uspijevaju dosegnuti razinu 2 (‘razina osnovnih vještina’) na PISA ljestvici za tri osnovna školska predmeta čitanja, matematike i znanosti. Podaci proizlaze iz Programa za međunarodnu procjenu učenika (PISA), redovito provedenog međunarodnog istraživanja čiji je cilj vrednovanje obrazovnih sustava testiranjem vještina i znanja 15-godišnjih učenika.
4-40-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe”, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela” i „Zaštita naše demokracije, održavanje naših vrijednosti”.
  Vijeće Europske unije 26. veljače 2021. donijelo je Rezoluciju o strateškom okviru za europsku suradnju u obrazovanju i osposobljavanju prema Europskom obrazovnom prostoru i šire (2021.-2030.), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvalitete, jednakosti, uključenosti i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje europskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u obrazovanju i osposobljavanju i kroz njih.
4-40-methodology: >-
  Rezolucija Vijeća postavlja cilj EU-a da udio 15-godišnjaka s niskim postignućima u čitanju, matematici i prirodnim znanostima, mjeren ovim pokazateljem ciljeva održivog razvoja, bude manji od 15% do 2030. godine.
4-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
4-60-title: Sudjelovanje odraslih u učenju po spolu
4-60-definition: >-
  Pokazatelj mjeri udio osoba u dobi od 25 do 64 godine koje su izjavile da su stekle formalno ili neformalno obrazovanje i osposobljavanje u četiri tjedna koji su prethodili istraživanju (brojnik). Nazivnik se sastoji od ukupne populacije iste dobne skupine, isključujući one koji nisu odgovorili na pitanje 'sudjelovanje u obrazovanju i osposobljavanju'. Obrazovanje odraslih obuhvaća formalne i neformalne aktivnosti učenja povezane s poslom i one koje nisu povezane s poslom. Obično se odnosi na aktivnosti učenja nakon završetka inicijalnog obrazovanja.
4-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Europske komisije u okviru „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novog plana za održivi prosperitet i konkurentnost Europe“.
  Vijeće Europske unije 26. veljače 2021. donijelo je Rezoluciju o strateškom okviru za europsku suradnju u obrazovanju i osposobljavanju prema Europskom obrazovnom prostoru i šire (2021.-2030.), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvalitete, jednakosti, uključenosti i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje europskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u obrazovanju i osposobljavanju i kroz njih.
4-60-methodology: >-
  Učenje odraslih obuhvaća najduže razdoblje u životnom vijeku osobe. To uključuje poboljšanje i razvoj vještina, prilagodbu tehnološkom razvoju, napredovanje u karijeri osobe ili pomoć pri povratku na tržište rada (usavršavanje i prekvalifikacija). Štoviše, ključno je za održavanje dobrog zdravlja, ostajanje aktivnim u zajednici i potpuno uključivanje u sve aspekte društva.
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
4-60-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 28.
4-70-title: Udio pojedinaca koji posjeduju barem osnovne digitalne vještine, po spolu
4-70-definition: >-
  Ovaj pokazatelj mjeri udio osoba u dobi od 16 do 74 godine koje imaju barem osnovne digitalne vještine. To je kompozitni pokazatelj koji se temelji na odabranim aktivnostima koje pojedinci obavljaju na internetu u određenim područjima: informacijska i podatkovna pismenost, komunikacija i suradnja, stvaranje digitalnih sadržaja, sigurnost i rješavanje problema. Pokazatelj ocjenjuje digitalne vještine klasificirane u šest razina, od kojih dvije najviše čine osnovnu ili iznad osnovne razine digitalnih vještina. Pokazatelj se temelji na podacima iz EU istraživanja o korištenju IKT-a u kućanstvima i od strane pojedinaca.
4-70-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe”, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela” i „Zaštita naše demokracije, održavanje naših vrijednosti”.
4-70-methodology: >-
  Cilj održivog razvoja 4 nastoji osigurati ljudima pristup ravnopravnom i kvalitetnom obrazovanju u svim fazama života, kao i povećati broj mladih i odraslih koji imaju relevantne vještine za zapošljavanje, pristojne poslove i poduzetništvo. Cilj predviđa i otklanjanje rodnih i dohodovnih nejednakosti u pristupu obrazovanju.
  Digitalne vještine od ključne su vrijednosti za rad, učenje i socijalnu interakciju.
4-70-long_term_objective: >-
  Europski stup akcijskog plana za socijalna prava i Digitalni kompas do 2030.: europski put do digitalnog desetljeća postavili su EU-u cilj povećanja udjela osoba u dobi od 16 do 74 godine koje imaju barem osnovne digitalne vještine na 80 % do 2030.
5-11-title: Fizičko i seksualno nasilje nad ženama po dobnim skupinama
5-11-definition: >-
  Pokazatelj mjeri udio žena u dobi od 18 i više godina koje su odgovorile s "da" na pitanje jesu li doživjele fizičko i/ili seksualno nasilje od strane partnera ili nepartnera u 12 mjeseci prije intervjua. Istraživanje je provedeno u proljeće/ljeto 2018. godine.
5-11-intention: >-
  Ovi podaci prikazuju rasprostranjenost fizičkog i seksualnog nasilja nad ženama u dobi od 18 do 74 godine u Bosni i Hercegovini, prikupljeni u svrhu praćenja pokazatelja Cilja održivog razvoja 5 (SDG 5: Rodna ravnopravnost), s naglaskom na indikator EU SDG 5.11. Prikazane stope obuhvaćaju nasilje od strane intimnih partnera i nepartnera, uključujući prevalenciju tijekom života (od 15. godine) i u posljednjih 12 mjeseci.
5-11-methodology: >-
  Ova studija se zasniva na metodologiji koju je Agencija EU za osnovna prava (FRA) koristila u svom istraživanju o nasilju nad ženama u 28 država članica Evropske unije iz 2012. godine, pa je s njom i uporediva. Evropski institut za ravnopravnost spolova (EIGE) u svom radu koristi podatke iz studije FRA, a studija OSI obuhvata odabrana pitanja Eurobarometra o stavovima prema nasilju nad ženama. Dizajn uzorka i ponderi zasnovani su na popisu stanovništva iz 2013. godine i obuhvataju populaciju žena starosne dobi od 18 do 74 godine koje žive u Bosni i Hercegovini.
5-11-long_term_objective: >-
  Osigurati pouzdanu, međunarodno usporedivu i na dokazima utemeljenu empirijsku osnovu za praćenje pokazatelja EU SDG 5.11 u skladu s metodološkim standardima Eurostata. Krajnji cilj prikupljanja ovih podataka jest usmjeravanje javnih politika i zakonodavstva prema potpunom iskorjenjivanju rodno uvjetovanog nasilja, jačanju kapaciteta službi za podršku žrtvama te osiguravanju potpunog blagostanja i sigurnosti žena i djevojčica u javnoj i privatnoj sferi.
5-20-title: Razlika u plaćama između spolova u neprilagođenom obliku
5-20-definition: >-
  Pokazatelj mjeri razliku između prosječne bruto plaće po satu zaposlenih muškaraca i zaposlenih žena kao postotak prosječne bruto plaće po satu zaposlenih muškaraca. Pokazatelj je definiran kao neprilagođen, jer daje cjelokupnu sliku rodnih nejednakosti u smislu plaće i mjeri koncept koji je širi od koncepta jednake plaće za jednak rad. Uključeni su svi zaposlenici koji rade u tvrtkama s deset i više zaposlenika, bez ograničenja po dobi i satima rada. Razlika u plaćama između spolova zasniva se na metodologiji istraživanja o strukturi zarada (SES), koje se provodi svake četiri godine.
5-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 5 o ravnopravnosti spolova, koji je ugrađen u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”.
  Pokazatelj se može smatrati sličnim globalnom SDG pokazatelju 8.5.1 „Prosječna satnica zaposlenih žena i muškaraca, prema zanimanju, dobi i osobama s invaliditetom“. Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
5-20-methodology: >-
  Strategija EU-a za ravnopravnost spolova obvezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i mjere za postizanje značajnog napretka do 2025. prema Europi ravnopravnosti spolova, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni slijediti svoj odabrani životni put i imati jednake mogućnosti za napredak. Ključni su ciljevi iskorjenjivanje rodno uvjetovanog nasilja; izazivanje rodnih stereotipa; smanjenje rodnih razlika na tržištu rada; postizanje ravnopravnog sudjelovanja u različitim sektorima gospodarstva; rješavanje rodnog jaza u plaćama i mirovinama; smanjenje rodnih razlika u skrbi i postizanje rodne ravnoteže u donošenju odluka i u politici.
  Jednaka plaća za jednak rad jedno je od temeljnih načela Europske unije, ugrađeno u Ugovore od 1957. godine. Člankom 157. Ugovora o funkcioniranju Europske unije predviđeno je da svaka država članica osigurava primjenu načela. Direktiva 2006/54/EZ sadrži načelo jednake plaće. Uklanjanje razlika u plaćama između spolova također je jedan od ciljeva strateškog angažmana Komisije za ravnopravnost spolova, kao i europskog stupa socijalnih prava.
5-20-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
5-30-title: Razlika u zaposlenosti među spolovima, prema vrsti zaposlenja
5-30-definition: >-
  Pokazatelj mjeri razliku između stopa zaposlenosti muškaraca i žena u dobi od 20 do 64 godine. Stopa zaposlenosti izračunava se dijeljenjem broja zaposlenih osoba u dobi od 20 do 64 godine s ukupnim brojem stanovnika iste dobne skupine. 
  Pokazatelj prikazuje djelatnost i radni status za četiri skupine osoba: zaposlene osobe koje rade puno radno vrijeme, zaposlene osobe koje rade s nepunim radnim vremenom, zaposlene osobe s ugovorom o radu na određeno vrijeme i podzaposlene osobe koje rade s nepunim radnim vremenom.
5-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 5 o ravnopravnosti spolova, koji je ugrađen u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela”.
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
5-30-methodology: >-
  Povećanje sudjelovanja žena na tržištu rada i jednaka ekonomska neovisnost žena i muškaraca jedan je od prioriteta Strategije EU-a za ravnopravnost spolova, koja se obvezuje na postizanje Unije ravnopravnosti. Strategija EU-a za ravnopravnost spolova obvezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i mjere za postizanje značajnog napretka do 2025. prema Europi ravnopravnosti spolova, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni slijediti svoj odabrani životni put i imati jednake mogućnosti za napredak. Ključni su ciljevi iskorjenjivanje rodno uvjetovanog nasilja; izazivanje rodnih stereotipa; smanjenje rodnih razlika na tržištu rada; postizanje ravnopravnog sudjelovanja u različitim sektorima gospodarstva; rješavanje rodnog jaza u plaćama i mirovinama; smanjenje rodnih razlika u skrbi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-30-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
5-40-title: Osobe izvan radne snage zbog obveza brige o drugima po spolu
5-40-definition: >-
  Stanovništvo izvan radne snage obuhvaća pojedince koji nisu zaposleni i koji ili aktivno ne traže posao ili nisu dostupni za rad (čak i ako su pronašli posao koji će započeti u budućnosti). Stoga nisu ni zaposleni ni nezaposleni. 
  Ova definicija koja se koristi u Anketi o radnoj snazi EU-a (EU-LFS) temelji se na rezolucijama Međunarodne konferencije statističara rada (ICLS) koju je organizirala Međunarodna organizacija rada (ilo). Razlog zbog kojeg se nalazi izvan radne snage obuhvaćene ovim pokazateljem uključuje ‘skrb o odraslim osobama s invaliditetom ili djeci’. Razmatraju se samo ljudi koji izražavaju spremnost za rad, unatoč tome što su izvan radne snage.
5-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti i cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji su ugrađeni u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
   Europski stup socijalnih prava, koji su 2017. zajednički proglasili Europska komisija, Europski parlament i Europsko vijeće, utvrđuje 20 ključnih načela i prava bitnih za pravedna i dobro funkcionirajuća tržišta rada i sustave socijalne skrbi.
5-40-methodology: >-
  Strategija EU-a za ravnopravnost spolova obvezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i mjere za postizanje značajnog napretka do 2025. prema Europi ravnopravnosti spolova, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni slijediti svoj odabrani životni put i imati jednake mogućnosti za napredak. Ključni su ciljevi iskorjenjivanje rodno uvjetovanog nasilja; izazivanje rodnih stereotipa; smanjenje rodnih razlika na tržištu rada; postizanje ravnopravnog sudjelovanja u različitim sektorima gospodarstva; rješavanje rodnog jaza u plaćama i mirovinama; smanjenje rodnih razlika u skrbi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-40-long_term_objective: >-
  Bez opisa
5-50-title: Mjesta koja zauzimaju žene u nacionalnim parlamentima i vladama
5-50-definition: >-
  Pokazatelj mjeri udio žena u nacionalnim parlamentima i nacionalnim vladama.
  Nacionalni parlament je nacionalna zakonodavna skupština, a pokazatelj se odnosi na oba doma (donji dom i gornji dom, gdje je to relevantno). Broj članova parlamenta uključuje predsjednika/predsjednika/vođu parlamenta.
5-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti i cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji su ugrađeni u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 5.5.1 „Udio žena u nacionalnim parlamentima i lokalnim samoupravama“.
5-50-methodology: >-
  Strategija EU-a za ravnopravnost spolova obvezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i mjere za postizanje značajnog napretka do 2025. prema Europi ravnopravnosti spolova, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni slijediti svoj odabrani životni put i imati jednake mogućnosti za napredak. Ključni su ciljevi iskorjenjivanje rodno uvjetovanog nasilja; izazivanje rodnih stereotipa; smanjenje rodnih razlika na tržištu rada; postizanje ravnopravnog sudjelovanja u različitim sektorima gospodarstva; rješavanje rodnog jaza u plaćama i mirovinama; smanjenje rodnih razlika u skrbi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-50-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 50.
5-61-title: Pozicije koje zauzimaju žene na višim rukovodećim pozicijama
5-61-definition: >-
  Pokazatelj mjeri udio žena članova uprava i rukovoditelja u najvećim društvima koja kotiraju na burzi.
5-61-intention: >-
  Obuhvat podataka 2003. – 2023. Javno kotirano znači da se dionicama društva trguje na burzi. "Najvećim" tvrtkama smatraju se članovi (maks. 50) primarnog blue-chip indeksa, koji je indeks koji održava burza i pokriva najveće tvrtke prema tržišnoj kapitalizaciji i/ili tržišnim trgovanjima. Računaju se samo društva koja su registrirana u dotičnoj zemlji. Članovi Uprave obuhvaćaju sve članove najvišeg tijela za donošenje odluka u svakom društvu (tj. predsjednika, neizvršne direktore, više rukovoditelje i predstavnike zaposlenika, ako su prisutni). Rukovoditelji se odnose na više rukovoditelje u dva najviša tijela za donošenje odluka najvećih (maks. 50) nacionalno registriranih tvrtki koje kotiraju na nacionalnoj burzi.
5-61-methodology: >-
  Strategija EU-a za ravnopravnost spolova obvezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i mjere za postizanje značajnog napretka do 2025. prema Europi ravnopravnosti spolova, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni slijediti svoj odabrani životni put i imati jednake mogućnosti za napredak
5-61-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 50.
6-20-title: Stanovništvo spojeno na barem sekundarni sustav otpadnih voda
6-20-definition: >-
  Pokazatelj mjeri postotak stanovništva priključenog na sustave za pročišćavanje otpadnih voda s barem sekundarnim pročišćavanjem. Time se otpadne vode iz urbanih ili drugih izvora obrađuju postupkom koji općenito uključuje biološko pročišćavanje sekundarnim naseljem ili drugim postupkom kojim se uklanja organski materijal i smanjuje njegova biokemijska potrošnja kisika (BPK) za najmanje 70 % i kemijska potrošnja kisika (KPK) za najmanje 75 %
6-20-intention: >-
  Pokazatelj  se koristi za praćenje napretka prema cilju održivog razvoja br. 6 o čistoj vodi i odvodnji, koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Održavanje naše kvalitete života: sigurnost hrane, voda i priroda”.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 6.3.1 „Udio sigurno pročišćenih otpadnih voda“.
6-20-methodology: >-
  Zaštita vodnih resursa, vodnih ekosustava te vode za piće i kupanje temelj je politike zaštite okoliša EU-a, što je potvrđeno u predloženom 8. Akcijskom programu za okoliš. Vodna politika EU-a pruža okvir za sveobuhvatno rješavanje zaštite voda i postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Politika EU-a o zdravlju i sigurnosti hrane također doprinosi visokim standardima u pogledu vode i odvodnje u smislu sprečavanja širenja zaraznih bolesti. Direktiva o pročišćavanju komunalnih otpadnih voda uređuje prikupljanje, pročišćavanje i ispuštanje komunalnih i industrijskih otpadnih voda.
6-20-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 100.
6-30-title: Udio vodnih tijela s dobrom kvalitetom površinskih i podzemnih voda - zamjenski pokazatelj
6-30-definition: >-
  Indikator se definira kao udio vodnih tijela u zemlji koja imaju dobru kvalitetu vode u okolišu. Kvaliteta vode u okolišu odnosi se na prirodnu, neprečišćenu vodu u rijekama, jezerima i podzemnim vodama te predstavlja kombinaciju prirodnih utjecaja i utjecaja svih antropogenih aktivnosti. Indikator se oslanja na podatke o kvalitetu vode dobijene iz mjerenja na licu mjesta i analize uzoraka prikupljenih iz površinskih i podzemnih voda. Kvaliteta vode procjenjuje se pomoću osnovnih fizikalnih i kemijskih parametara koji odražavaju prirodnu kvalitetu vode povezanu s klimatološkim i geološkim čimbenicima, zajedno s glavnim utjecajima na kvalitetu vode.
6-30-intention: >-
  Tekst u izradi
6-30-methodology: >-
  Tekst u izradi
6-30-long_term_objective: >-
  Do 2030. godine poboljšati kvalitetu vode smanjenjem onečišćenja, eliminacijom nekontroliranog odlaganja otpada i svođenjem ispuštanja opasnih kemikalija i materijala na minimum, prepoloviti udio nepročišćenih otpadnih voda te značajno povećati recikliranje i sigurnu ponovnu uporabu na globalnoj razini.
6-40-title: Nitrati u podzemnim vodama
6-40-definition: >-
  Ovaj pokazatelj prikazuje koncentracije nitrata (NO3) u tijelima podzemnih voda mjerene kao miligrami po litri (mg NO3/L). Pokazatelj se može koristiti za ilustraciju geografskih varijacija u trenutnim koncentracijama i vremenskim trendovima. Veliki unosi dušika u vodna tijela iz urbanih područja, industrije i poljoprivrednih područja mogu imati negativne utjecaje na korištenje vode za ljudsku potrošnju i druge namjene.
6-40-intention: >-
  Pokazatelj  se koristi za praćenje napretka prema cilju održivog razvoja br. 6 o čistoj vodi i odvodnji, koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Održavanje naše kvalitete života: sigurnost hrane, voda i priroda”.
  Zaštita vodnih resursa, vodnih ekosustava te vode za piće i kupanje temelj je politike zaštite okoliša EU-a. Vodna politika EU-a pruža okvir za sveobuhvatno rješavanje zaštite voda i postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Prema Direktivi o vodi za piće, dopuštena je maksimalna koncentracija od 50 mg/L nitrata u podzemnim vodama koje se koriste za pitku vodu. Direktiva o nitratima zahtijeva određivanje osjetljivih područja na temelju ovog praga za sve vode, uključujući podzemne vode.
6-40-methodology: >-
  Okvirna direktiva o vodama glavno je europsko zakonodavstvo koje ima za cilj spriječiti onečišćenje vode. Strategija EU-a za bioraznolikost do 2030. podupire provedbu cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosustave.
  Osmi program djelovanja za okoliš postavlja program politike zaštite okoliša za godine od 2021. do 2030. i izričito spominje pitanja povezana s vodom u dva od svojih šest prioritetnih ciljeva. Ta su dva cilja: (1) ostvarivanje ambicije nultog onečišćenja za toksični slobodni okoliš, uključujući zrak, vodu i tlo, te zaštita zdravlja i dobrobiti građana od rizika i utjecaja povezanih s okolišem; i (2) zaštita, očuvanje i obnova biološke raznolikosti i jačanje prirodnog kapitala, posebno zraka, vode, tla i šuma, slatkovodnih, močvarnih i morskih ekosustava.
6-40-long_term_objective: >-
  Dugoročni cilj je smanjenje razine nitrata ispod utvrđene maksimalne razine onečišćenja (MCL) od 10 mg/L (kao N, dušik) ili 45 mg/L (kao NO3−).
6-50-title: Fosfat u rijekama
6-50-definition: >-
  Ovaj pokazatelj mjeri koncentraciju fosfata (PO4) po litri u otopljenoj fazi iz uzoraka vode iz riječnih stanica i agregirano na godišnje prosječne vrijednosti. U visokim koncentracijama fosfat može uzrokovati probleme s kvalitetom vode, kao što je eutrofikacija, pokretanjem rasta vodenih biljaka, uključujući alge. Pokazatelj se može koristiti za ilustraciju geografskih varijacija u trenutnim koncentracijama i vremenskim trendovima.
6-50-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i sanitaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati dijelom globalnog pokazatelja ciljeva održivog razvoja 6.3.2 „Udio vodnih tijela s dobrom kvalitetom okolne vode“.
  Zaštita vodnih resursa, vodnih ekosustava te vode za piće i kupanje temelj je politike zaštite okoliša EU-a. Vodna politika EU-a pruža okvir za sveobuhvatno rješavanje zaštite voda i postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Okvirna direktiva o vodama glavno je europsko zakonodavstvo koje ima za cilj spriječiti onečišćenje vode. Strategija EU-a za bioraznolikost do 2030. podupire provedbu cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosustave.
6-50-methodology: >-
  Osmi program djelovanja za okoliš postavlja program politike zaštite okoliša za godine od 2021. do 2030. i izričito spominje pitanja povezana s vodom u dva od svojih šest prioritetnih ciljeva. Ta su dva cilja: (1) ostvarivanje ambicije nultog onečišćenja za toksični slobodni okoliš, uključujući zrak, vodu i tlo, te zaštita zdravlja i dobrobiti građana od rizika i utjecaja povezanih s okolišem; i (2) zaštita, očuvanje i obnova biološke raznolikosti i jačanje prirodnog kapitala, posebno zraka, vode, tla i šuma, slatkovodnih, močvarnih i morskih ekosustava.
6-50-long_term_objective: >-
  Nema opisa
6-60-title: Indeks iskorištenosti vode, plus (WEI+)
6-60-definition: >-
  Indeks iskorištavanja vode (WEI+) pruža mjeru ukupne potrošnje vode kao postotak obnovljivih slatkovodnih resursa dostupnih za određeni teritorij i razdoblje. Kvantificira količinu zahvaćene vode i količinu vode koju gospodarski sektori vraćaju u okoliš prije ili nakon uporabe. Razlika između zahvaćanja vode i povrata vode smatra se "potrošnjom vode". U nedostatku dogovorenih formalnih ciljeva na razini Europe, vrijednosti iznad 20 % općenito se smatraju znakom nestašice vode, dok vrijednosti jednake ili veće od 40 % ukazuju na situacije ozbiljne nestašice vode, što znači da je uporaba slatkovodnih resursa neodrživa.
6-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i sanitaciji; koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru programa „Održavanje kvalitete života: sigurnost hrane, voda i priroda“. 
  Pokazatelj proizvodi EEA na temelju podataka iz baze podataka WISE SoE-Water quantity (WISE 3) i drugih otvorenih izvora (Eurostat, OECD), uključujući metode popunjavanja praznina.
  Pokazatelj se može smatrati globalnim pokazateljem ciljeva održivog razvoja 6.4.2 "Razina vodnog stresa: povlačenje slatke vode kao udio dostupnih slatkovodnih resursa".
  Okvirna direktiva o vodama glavno je europsko zakonodavstvo čiji je cilj - između ostalog - promicanje održivog korištenja vode na temelju dugoročne zaštite dostupnih vodnih resursa. Strategija EU-a za bioraznolikost do 2030. podupire provedbu cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosustave.
6-60-methodology: >-
  Osmi program djelovanja za okoliš postavlja program politike zaštite okoliša za godine od 2021. do 2030. i izričito spominje pitanja povezana s vodom u dva od svojih šest prioritetnih ciljeva. Ta su dva cilja: (1) ostvarivanje ambicije nultog onečišćenja za toksični slobodni okoliš, uključujući zrak, vodu i tlo, te zaštita zdravlja i dobrobiti građana od rizika i utjecaja povezanih s okolišem; i (2) zaštita, očuvanje i obnova biološke raznolikosti i jačanje prirodnog kapitala, posebno zraka, vode, tla i šuma, slatkovodnih, močvarnih i morskih ekosustava.
6-60-long_term_objective: >-
  Dugoročni cilj pokazatelja SDG_06_60 je osigurati dostupnost i održivo upravljanje vodom i odvodnjom za sve. To uključuje postizanje univerzalnog pristupa sigurnoj i pristupačnoj vodi za piće, sanitarijama i higijeni, kao i poboljšanje kvalitete vode i održivo upravljanje vodnim resursima. Pokazatelj je dio ciljeva održivog razvoja EU-a i koristi se za praćenje napretka prema tim ciljevima
6-70-title: Pesticidi u rijekama
6-70-definition: >-
  Ovaj pokazatelj mjeri udio prijavljenih vodnih tijela s pesticidima koji prelaze pragove na temelju Standarda kvalitete okoliša (SKO) za toksičnost izmjerenih pesticida. Pesticidi uključuju i aktivne tvari iz sredstava za zaštitu bilja i biocida, kao i njihove relevantne metabolite, čime se odražavaju tvari koje su stvarno prisutne u vodi i utječu na vodeni svijet. Uključene su samo tvari s definiranim SKO-ima.
6-70-intention: >-
  Ovaj pokazatelj može se smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 6.3.2 "Udio vodenih tijela s dobrom kvalitetom vode u okolišu".
  Zaštita vodnih resursa, vodnih ekosustava te vode za piće i kupanje temelj je politike EU o zaštiti okoliša. Politika EU o vodama pruža okvir za sveobuhvatno rješavanje zaštite voda i postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Okvirna direktiva o vodama glavni je europski zakon kojim se želi spriječiti onečišćenje vode, a Strategija EU o biološkoj raznolikosti za 2030. podržava provedbu cilja Okvirne direktive o vodama tako što od država članica zahtijeva da obnove slatkovodne ekosustave.
6-70-methodology: >-
  Osmi akcijski program za okoliš utvrđuje agendu politike zaštite okoliša za razdoblje od 2021. do 2030. i izričito spominje pitanja vezana uz vodu u dva od svojih šest prioritetnih ciljeva. Ta dva cilja su: (1) ostvarivanje ambicije nultog onečišćenja za okoliš bez toksina, uključujući zrak, vodu i tlo, te zaštita zdravlja i dobrobiti građana od rizika i utjecaja povezanih s okolišem; i (2) zaštita, očuvanje i obnova bioraznolikosti te poboljšanje prirodnog kapitala, posebno zraka, vode, tla te šumskih, slatkovodnih, močvarnih i morskih ekosustava.
6-70-long_term_objective: >-
  Nema opisa
7-10-title: Primarna potrošnja energije
7-10-definition: >-
  Pokazatelj mjeri ukupne energetske potrebe zemlje isključujući svu neenergetsku upotrebu nositelja energije (npr. prirodni plin koji se ne koristi za izgaranje, već za proizvodnju kemikalija).
  „Potrošnja primarne energije“ obuhvaća potrošnju energije od strane krajnjih korisnika kao što su industrija, promet, kućanstva, usluge i poljoprivreda, plus potrošnju energije samog energetskog sektora za proizvodnju i transformaciju energije, gubitke koji nastaju tijekom transformacije energije (npr. učinkovitost proizvodnje električne energije iz gorivih goriva) te gubitke prijenosa i distribucije energije.
7-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  EU provodi međusobno povezani skup mjera "Fit for 55" kako bi postigla nove klimatske ciljeve za 2030. godinu i slijedila je novi strateški plan REPowerEU za smanjenje ovisnosti EU-a o uvozu energije.
7-10-methodology: >-
  Europski zeleni plan uključuje energetsku učinkovitost kao ključnu mjeru za smanjenje međusektorskih emisija stakleničkih plinova. Direktive o energetskoj učinkovitosti i energiji iz obnovljivih izvora postavljaju ambiciozne ciljeve EU-a koje treba postići do 2030.
7-10-long_term_objective: >-
  Nema opisa
7-11-title: Krajnja potrošnja energije
7-11-definition: >-
  Pokazatelj mjeri krajnju potrošnju energije u zemlji, isključujući svu neenergetsku upotrebu energenata (npr. prirodni plin koji se ne koristi za izgaranje, već za proizvodnju kemikalija). „Krajnja potrošnja energije“ obuhvaća samo energiju koju troše krajnji korisnici, kao što su industrija, promet, kućanstva, usluge i poljoprivreda; isključuje potrošnju energije samog energetskog sektora i gubitke koji nastaju tijekom transformacije i distribucije energije.
7-11-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  EU provodi međusobno povezani skup mjera "Fit for 55" kako bi postigla nove klimatske ciljeve za 2030. godinu i slijedila je novi strateški plan REPowerEU za smanjenje ovisnosti EU-a o uvozu energije.
7-11-methodology: >-
  Europski zeleni plan uključuje energetsku učinkovitost kao ključnu mjeru za smanjenje međusektorskih emisija stakleničkih plinova. Direktive o energetskoj učinkovitosti i energiji iz obnovljivih izvora postavljaju ambiciozne ciljeve EU-a koje treba postići do 2030.
7-11-long_term_objective: >-
  Nema opisa
7-20-title: Konačna potrošnja energije u kućanstvima po stanovniku
7-20-definition: >-
  Pokazatelj mjeri koliko energije svaki građanin troši kod kuće, isključujući energiju koja se koristi za prijevoz. Budući da se pokazatelj odnosi na krajnju potrošnju energije, uzima se u obzir samo energija koju koriste krajnji potrošači. Isključena je povezana potrošnja samog energetskog sektora.
7-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
7-20-methodology: >-
  Cilj održivog razvoja 7 poziva na osiguravanje univerzalnog pristupa modernim energetskim uslugama, poboljšanje energetske učinkovitosti i povećanje udjela obnovljive energije. Kako bi ubrzale prijelaz na pristupačan, pouzdan i održiv energetski sustav, zemlje moraju olakšati pristup istraživanju čiste energije, promicati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. Kućanstva čine oko četvrtinu finalne potrošnje energije. Kod kuće ljudi koriste električnu energiju i goriva, posebno za grijanje, hlađenje, toplu vodu, rasvjetu i uređaje.
7-20-long_term_objective: >-
  Nema opisa
7-30-title: Produktivnost energije
7-30-definition: >-
  Pokazatelj mjeri količinu ekonomske proizvodnje koja se proizvodi po jedinici bruto raspoložive energije. Bruto raspoloživa energija predstavlja količinu energenata potrebnu za zadovoljavanje svih potreba subjekata na razmatranom zemljopisnom području. Ekonomska proizvodnja daje se ili u jedinici eura u lančanim količinama u odnosu na referentnu 2010. godinu po tečajevima iz 2010. godine ili u jedinici PPS (Standard kupovne moći).
7-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji i cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje.
  Ovaj pokazatelj može se smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 7.3.1 „Energetski intenzitet mjeren u smislu primarne energije i BDP-a“.
  Povećanje energetske produktivnosti, tj. odvajanje gospodarskog rasta od potrošnje energije, ključno je za postizanje 7. cilja održivog razvoja bez ugrožavanja gospodarskog razvoja.
7-30-methodology: >-
  SDG 7 ugrađen je u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Cilj održivog razvoja 7 poziva na osiguravanje univerzalnog pristupa modernim energetskim uslugama, poboljšanje energetske učinkovitosti i povećanje udjela obnovljive energije. Kako bi ubrzale prijelaz na pristupačan, pouzdan i održiv energetski sustav, zemlje moraju olakšati pristup istraživanju čiste energije, promicati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. Cilj održivog razvoja 12 poziva na sveobuhvatan skup mjera poduzeća, donositelja politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Njime se predviđa održiva proizvodnja i potrošnja temeljena na naprednim tehnološkim kapacitetima, učinkovitoj upotrebi resursa i smanjenju globalnog otpada.
7-30-long_term_objective: >-
7-40-title: Udio obnovljive energije u bruto konačnoj potrošnji energije
7-40-definition: >-
  Pokazatelj mjeri udio potrošnje energije iz obnovljivih izvora u bruto konačnoj potrošnji energije prema Direktivi o obnovljivim izvorima energije. Bruto krajnja potrošnja energije je energija koju koriste krajnji potrošači (krajnja potrošnja energije) plus gubici mreže i vlastita potrošnja elektrana.
7-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji i cilju održivog razvoja 13 o klimatskim aktivnostima; koji su ugrađeni u prioritete Europske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela” i „Održavanje naše kvalitete života: sigurnost hrane, vode i prirode”.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju ciljeva održivog razvoja 7.2.1 „Udio obnovljivih izvora energije u ukupnoj konačnoj potrošnji energije“.
7-40-methodology: >-
  EU provodi međusobno povezani skup mjera "Fit for 55" kako bi postigla nove klimatske ciljeve za 2030. godinu i slijedila je novi strateški plan REPowerEU za smanjenje ovisnosti EU-a o uvozu energije. Europski zeleni plan predviđa dekarbonizaciju europskih energetskih sustava kako bi se postigla klimatska neutralnost do 2050. godine. U tu svrhu EU će se okrenuti potpuno integriranom, međusobno povezanom i digitaliziranom sustavu obnovljive energije, istovremeno osiguravajući sigurnost opskrbe po pristupačnim cijenama. Štoviše, fondovi kohezijske politike EU-a (2021. - 2027.), uključujući plan oporavka „Next Generation EU”, osiguravaju financiranje ulaganja u obnovljive izvore energije. Revidiranim direktivama o energiji iz obnovljivih izvora postavljen je ambiciozan cilj EU-a koji treba postići do 2030.
7-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 50.
7-50-title: Ovisnost o uvozu energije
7-50-definition: >-
  Pokazatelj pokazuje udio ukupnih energetskih potreba zemlje pokrivenih uvozom iz drugih zemalja. Izračunava se kao neto uvoz podijeljen s bruto raspoloživom energijom. Energetska ovisnost = (uvoz – izvoz) / bruto raspoloživa energija.
7-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Kako bi ubrzale prijelaz na pristupačan, pouzdan i održiv energetski sustav, zemlje moraju olakšati pristup istraživanju čiste energije, promicati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. Energetska ovisnost o uvozu energetskih prijevoznika izlaže europsko gospodarstvo promjenjivim cijenama na svjetskom tržištu i riziku od nestašice opskrbe, primjerice zbog geopolitičkih sukoba. Rizici se povećavaju s ovisnošću o pojedinim zemljama, npr. određenim infrastrukturom opskrbe.
7-50-methodology: >-
  Postoji nekoliko relevantnih politika EU-a za ovaj pokazatelj. Strategija energetske sigurnosti navodi potrebu za poboljšanjem domaće proizvodnje energije, uključujući potrebu za povećanjem lokalne proizvodnje obnovljive energije, energetske učinkovitosti i osiguranjem infrastrukture koja nedostaje. Štoviše, fondovi kohezijske politike EU-a (2021. - 2027.), uključujući plan oporavka „Next Generation EU”, osiguravaju financiranje ulaganja u obnovljive izvore energije. REPowerEU je novi strateški plan za smanjenje ovisnosti EU-a o uvozu energije, posebno iz Rusije, zbog nesigurnosti i visokih cijena nakon ruske invazije na Ukrajinu. Direktive o energetskoj učinkovitosti i energiji iz obnovljivih izvora postavljaju ambiciozne ciljeve EU-a koje treba postići do 2030.
7-50-long_term_objective: >-
  Nema opisa
7-60-title: Stanovništvo koje nije u stanju da zagrije dom adekvatno
7-60-definition: >-
  Pokazatelj mjeri udio stanovništva koje si ne može priuštiti adekvatno grijanje doma. Podaci za ovaj pokazatelj prikupljaju se u okviru Statistike Europske unije o dohotku i životnim uvjetima (EU-SILC) za praćenje razvoja siromaštva i socijalne uključenosti u EU. Prikupljanje podataka temelji se na anketi, što znači da se vrijednosti pokazatelja samostalno prijavljuju.
7-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Kako bi ubrzale prijelaz na pristupačan, pouzdan i održiv energetski sustav, zemlje moraju olakšati pristup istraživanju čiste energije, promicati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. 
  Europski stup socijalnih prava navodi energiju među osnovnim uslugama kojima bi svi trebali imati pristup. EU-ov Opservatorij za energetsko siromaštvo nastoji pomoći državama članicama u njihovim naporima za smanjenje energetskog siromaštva i osiguravanje pristupa pristupačnoj energiji.
7-60-methodology: >-
  Akcijskim planom za pristupačnu energiju predlažu se mjere za stabilizaciju cijena energije, osiguranje sigurnosti opskrbe i pokretanje energetske tranzicije. Europski stup socijalnih prava navodi energiju među osnovnim uslugama kojima bi svi trebali imati pristup. Europski gospodarski i socijalni odbor (EESC) ocjenjuje njegovo stanje. Savjetodavni centar EU-a za energetsko siromaštvo inicijativa je koja pruža središnju platformu za stručno znanje o energetskom siromaštvu za lokalne vlasti i druge dionike.
7-60-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
8-10-title: Stvarni BDP po stanovniku
8-10-definition: >-
  Pokazatelj se izračunava kao omjer realnog BDP-a (BDP prilagođen inflaciji) i prosječnog stanovništva određene godine, gdje se BDP izražava u milijunima, a stanovništvo u tisućama. Realni BDP objavljuje se bez decimala.
8-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe” i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju ciljeva održivog razvoja 8.1.1 „Godišnja stopa rasta realnog BDP-a po stanovniku“.
8-10-methodology: >-
  BDP mjeri vrijednost ukupne konačne proizvodnje dobara i usluga koje je proizvelo gospodarstvo u određenom vremenskom razdoblju. Uključuje robu i usluge koje imaju tržišta (ili koje bi mogle imati tržišta) i proizvode koje proizvode opća država i neprofitne institucije. To je mjera gospodarske aktivnosti i obično se koristi kao zamjena za razvoj materijalnog životnog standarda zemlje. Međutim, to nije potpuna mjera ekonomske dobrobiti. Primjerice, BDP ne uključuje većinu neplaćenih kućanskih poslova. BDP također ne uzima u obzir negativne učinke gospodarske aktivnosti, kao što je degradacija okoliša.
8-10-long_term_objective: >-
  Dugoročni cilj Indikatora je jačanje kapaciteta domaćih financijskih institucija za poticanje i širenje pristupa bankarstvu, osiguranju i financijskim uslugama za sve.
8-11-title: Udio ulaganja u BDP
8-11-definition: >-
  Pokazatelj se izračunava kao omjer realnog BDP-a (BDP prilagođen inflaciji) i prosječnog stanovništva određene godine, gdje se BDP izražava u milijunima, a stanovništvo u tisućama. Realni BDP objavljuje se bez decimala.
8-11-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe” i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju ciljeva održivog razvoja 8.1.1 „Godišnja stopa rasta realnog BDP-a po stanovniku“.
8-11-methodology: >-
  BDP mjeri vrijednost ukupne konačne proizvodnje dobara i usluga koje je proizvelo gospodarstvo u određenom vremenskom razdoblju. Uključuje robu i usluge koje imaju tržišta (ili koje bi mogle imati tržišta) i proizvode koje proizvode opća država i neprofitne institucije. To je mjera gospodarske aktivnosti i obično se koristi kao zamjena za razvoj materijalnog životnog standarda zemlje. Međutim, to nije potpuna mjera ekonomske dobrobiti. Primjerice, BDP ne uključuje većinu neplaćenih kućanskih poslova. BDP također ne uzima u obzir negativne učinke gospodarske aktivnosti, kao što je degradacija okoliša.
8-11-long_term_objective: >-
  Dugoročni cilj pokazatelja SDG_08_11 je mjerenje udjela ulaganja u BDP-u.
8-20-title: Mladi koji nisu zaposleni niti uključeni u obrazovanje ili osposobljavanje
8-20-definition: >-
  Pokazatelj mjeri udio stanovništva u dobi od 15 do 29 godina koje nije zaposleno i nije uključeno u obrazovanje ili osposobljavanje.
  Brojilac pokazatelja odnosi se na osobe koje ispunjavaju sljedeća dva uvjeta: (a) nisu zaposlene (tj. nezaposlene ili izvan radne snage prema definiciji Međunarodne organizacije rada) i (b) nisu stekle nikakvo obrazovanje ili osposobljavanje (tj. ni formalno ni neformalno) u četiri tjedna prije Ankete o radnoj snazi (LFS).
8-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu te 4. cilju održivog razvoja o osiguravanju uključivog i kvalitetnog obrazovanja za sve, koji su ugrađeni u prioritete Europske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela” i „Novi plan za održivi prosperitet i konkurentnost Europe”.
  Ovaj pokazatelj može se smatrati identičnim globalnom pokazatelju ciljeva održivog razvoja 8.6.1 "Udio mladih (u dobi od 15 do 24 godine) koji nisu u obrazovanju, zapošljavanju ili osposobljavanju". Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
8-20-methodology: >-
  Europski stup socijalnih prava, koji su 2017. zajednički proglasili Europska komisija, Europski parlament i Europsko vijeće, utvrđuje 20 ključnih načela i prava bitnih za pravedna i dobro funkcionirajuća tržišta rada i sustave socijalne skrbi. Europski akcijski plan za stup socijalnih prava, donesen 2021., pretvara načela u konkretne mjere u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78 % stanovništva u dobi od 20 do 64 godine koji bi EU trebao ostvariti do 2030. godine. U prilog tome, Akcijski plan predlaže da se do 2030. prepolovi razlika u zaposlenosti između spolova u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili osposobljavanju (NEET) u dobi od 15 do 29 do 9 %.
8-20-long_term_objective: >-
  Dugoročni cilj pokazatelja 0 je osigurati da 8% stanovništva u dobi od 15 do 29 godina nije zaposleno niti uključeno u obrazovanje ili osposobljavanje.
8-30-title: Stopa zaposlenosti
8-30-definition: >-
  Pokazatelj mjeri udio stanovništva u dobi od 20 do 64 godine koje je zaposleno. Zaposlene osobe definiraju se kao osobe koje su tijekom referentnog tjedna radile najmanje jedan sat za plaću ili dobit ili nisu radile, ali su imale poslove s kojih su bile privremeno odsutne.
8-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe” i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”. Cilj održivog razvoja 8 poziva, između ostalog, na pružanje mogućnosti za puno i produktivno zapošljavanje i dostojanstven rad za sve.
  Zapošljavanje i druga pitanja povezana s tržištem rada u središtu su društvene i političke rasprave u EU-u. Plaćeno zaposlenje ključno je za osiguravanje dovoljnog životnog standarda i pruža potrebne temelje ljudima za postizanje njihovih osobnih ciljeva i težnji. Štoviše, zapošljavanje doprinosi gospodarskoj uspješnosti, kvaliteti života i socijalnoj uključenosti, čineći ga kamenom temeljcem društveno-gospodarskog razvoja i dobrobiti.
8-30-methodology: >-
  Europski stup socijalnih prava utvrđuje 20 ključnih načela i prava bitnih za pravedna i dobro funkcionirajuća tržišta rada i sustave socijalne zaštite. Europski akcijski plan za stup socijalnih prava, donesen 2021., pretvara načela u konkretne mjere u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78 % stanovništva u dobi od 20 do 64 godine koji bi EU trebao ostvariti do 2030. godine. U prilog tome, Akcijski plan predlaže da se do 2030. prepolovi razlika u zaposlenosti između spolova u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili osposobljavanju (NEET) u dobi od 15 do 29 do 9 %.
8-30-long_term_objective: >-
  Povećati stopu zaposlenosti stanovništva u dobi od 20 do 64 godine na najmanje 78% do 2030. (Akcijski plan Europskog stupa socijalnih prava)
8-40-title: Stopa dugotrajne nezaposlenosti
8-40-definition: >-
  Pokazateljem se mjeri udio stanovništva u radnoj snazi u dobi od 15 do 74 godine koje je nezaposleno 12 mjeseci ili više. Stanovništvo u radnoj snazi su oni koji su ili zaposleni ili nezaposleni. Nezaposlene osobe definirane su kao osobe u dobi od 15 do 74 godine koje su bile bez posla tijekom referentnog tjedna, trenutno su bile dostupne za početak rada u sljedeća dva tjedna i aktivno su tražile posao u posljednja četiri tjedna ili su već pronašle posao za početak rada u sljedeća tri mjeseca. Razdoblje nezaposlenosti definira se kao trajanje traženja posla ili kao vrijeme od zadnjeg zaposlenja (ako je kraće od vremena provedenog na traženju posla).
8-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu, koji je ugrađen u prioritete Europske komisije pod „Novi plan za održivi prosperitet i konkurentnost Europe” i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava.
  Europski stup socijalnih prava utvrđuje niz ključnih načela i prava za potporu pravednim i dobro funkcionirajućim tržištima rada i sustavima socijalne skrbi. Služi kao kompas za obnovljeni proces konvergencije prema boljim radnim i životnim uvjetima među državama članicama sudionicama. Prvenstveno je zamišljen za europodručje, ali je primjenjiv na sve države članice koje žele sudjelovati. Pristup aktivnog uključivanja preporuka je Komisije kako bi se svakom građaninu, posebno onima u najnepovoljnijem položaju, omogućilo potpuno sudjelovanje u društvu, uključujući zapošljavanje.
8-40-methodology: >-
  Europski stup socijalnih prava utvrđuje 20 ključnih načela i prava bitnih za pravedna i dobro funkcionirajuća tržišta rada i sustave socijalne zaštite. Europski akcijski plan za stup socijalnih prava, donesen 2021., pretvara načela u konkretne mjere u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78 % stanovništva u dobi od 20 do 64 godine koji bi EU trebao ostvariti do 2030. godine. U prilog tome, Akcijski plan predlaže da se do 2030. prepolovi razlika u zaposlenosti između spolova u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili osposobljavanju (NEET) u dobi od 15 do 29 do 9 %.
8-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj iznosi 3.
8-60-title: Smrtonosne nesreće na radu na 100 000 radnika
8-60-definition: >-
  Pokazatelj mjeri broj nesreća sa smrtnim ishodom koje se dogode tijekom rada i dovedu do smrti žrtve u roku od jedne godine od nesreće. Stopa incidencije odnosi se na broj nesreća sa smrtnim ishodom na 100 000 zaposlenih osoba.
8-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema 8. cilju održivog razvoja o dostojanstvenom radu i gospodarskom rastu te 3. cilju održivog razvoja o dobrom zdravlju i dobrobiti.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju ciljeva održivog razvoja 8.8.1 „Smrtonosne i nefatalne ozljede na radu na 100.000 radnika, prema spolu i migrantskom statusu“.
8-60-methodology: >-
  Nacionalni izvori „Europske statistike o nesrećama na radu (ESAW)” su izjave poslodavaca o nesrećama na radu, bilo relevantnim osiguravajućim društvima, nacionalnom sustavu socijalne sigurnosti, inspekcijama rada ili sličnim nacionalnim tijelima.
  Direktiva o transparentnim i predvidljivim radnim uvjetima u Europskoj uniji postavlja minimalne standarde o radnim uvjetima. Strateškim okvirom EU-a za zdravlje i sigurnost na radu za razdoblje 2021. - 2027. utvrđuju se ključni prioriteti za poboljšanje zdravlja i sigurnosti radnika.
8-60-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0
9-10-title: 'Bruto domaća potrošnja za istraživanje i razvoj (R&D)'
9-10-definition: >-
  Pokazatelj mjeri bruto domaće rashode za istraživanje i razvoj (GERB) kao postotak bruto domaćeg proizvoda (BDP) — naziva se i intenzitet istraživanja i razvoja. OECD-ov Frascati priručnik: Smjernice za prikupljanje i izvješćivanje o podacima o istraživanju i eksperimentalnom razvoju definira istraživanje i eksperimentalni razvoj (R&D) kao kreativan i sustavan rad koji se poduzima kako bi se povećala zaliha znanja — uključujući znanje o čovječanstvu, kulturi i društvu — i osmislile nove primjene dostupnog znanja.
9-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije i poticanju inovacija koje su ugrađene u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Novo doba za europsku obranu i sigurnost”.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju SDG 9.5.1 „Izdaci za istraživanje i razvoj kao udio BDP-a“.
9-10-methodology: >-
  Nova vizija Europskog istraživačkog prostora (ERA) ima za cilj izgradnju zajedničkog znanstvenog i tehnološkog prostora za EU, davanjem prioriteta ulaganjima i reformama, poboljšanjem pristupa izvrsnosti, prevođenjem rezultata istraživanja i inovacija u gospodarstvo i produbljivanjem ERA-E. EU ima dugogodišnji cilj povećanja intenziteta istraživanja i razvoja na 3 % BDP-a, što je potvrđeno u Preporuci Vijeća o Paktu za istraživanje i inovacije u Europi iz studenoga 2021.
9-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 3.3
9-30-title: 'Osoblje za istraživanje i razvoj (R&R)'
9-30-definition: >-
  Pokazateljem se mjeri udio osoblja za istraživanje i razvoj u sljedećim institucionalnim sektorima: poslovno poduzeće (bes), vlada (gov), visoko obrazovanje (Hes) i privatna neprofitna organizacija (PNP). Podaci su prikazani u ekvivalentima punog radnog vremena kao udio radne snage.
9-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije i poticanju inovacija koje su ugrađene u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Novo doba za europsku obranu i sigurnost”.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju SDG-a 9.5.2 "Istraživači (u ekvivalentu punog radnog vremena) na milijun stanovnika"
9-30-methodology: >-
  Istraživanje i razvoj te inovacije glavni su pokretači konkurentnosti i zapošljavanja u gospodarstvu temeljenom na znanju. Veća ulaganja u istraživanje i razvoj osiguravaju nova radna mjesta u poslovanju i akademskoj zajednici, povećavajući potražnju za znanstvenicima i istraživačima na tržištu rada.
9-30-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 2.
9-40-title: Prijave patenata Europskom patentskom uredu
9-40-definition: >-
  Ovaj pokazatelj mjeri zahtjeve za zaštitu izuma podnesene Europskom patentnom uredu (EPO) bez obzira na to jesu li odobreni ili ne. Prijave se raspoređuju prema zemlji prebivališta prvog podnositelja prijave koji je naveden na obrascu prijave (načelo prvoimenovanog podnositelja prijave) kao i prema zemlji prebivališta izumitelja.
  Podaci pokazuju ukupan broj prijava po zemlji i na milijun stanovnika (koristeći prosječno stanovništvo referentne godine kao nazivnik).
9-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije i poticanju inovacija koje su ugrađene u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Novo doba za europsku obranu i sigurnost”.
  Zahtjevi za zaštitu izuma upućeni izravno Europskom patentnom uredu (EPO) ili podneseni prema Ugovoru o suradnji na području patenata i imenovanju EPO-a (Euro-PCT), bez obzira na to jesu li odobreni ili ne. Prijave patenata dodjeljuju se prema zemlji prebivališta podnositelja prijave navedenoj na obrascu prijave. U slučajevima kada je na obrascu zahtjeva navedeno više podnositelja zahtjeva, primjenjuje se država boravišta prvog navedenog podnositelja zahtjeva. Zemlja prebivališta (prvog) podnositelja zahtjeva nije nužno ista kao i županija prebivališta izumitelja.
9-40-methodology: >-
  Patenti odražavaju inventivnu aktivnost zemlje. Patenti također pokazuju sposobnost zemalja i njihovih poduzeća da iskoriste znanje i rezultate istraživanja te ih pretvore u potencijalne ekonomske koristi. U tom kontekstu, pokazatelji koji se temelje na statistici patenata pružaju vrijednu mjeru inventivnog učinka zemalja.
9-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 240.
9-50-title: Udio autobusa i vlakova u unutarnjem putničkom prometu
9-50-definition: >-
  Ovaj pokazatelj mjeri udio autobusa, uključujući autobuse i trolejbuse, te vlakova u kopnenom putničkom prijevozu, izražen u putničkim kilometrima (pkm). Prijevoz putnika ovdje uključuje prijevoz osobnim automobilima, autobusima i vlakovima, ali ne uključuje prijevoz unutarnjim plovnim putovima, zračni i pomorski prijevoz. Svi se podaci temelje na kretanjima unutar nacionalnih teritorija, bez obzira na nacionalnost vozila. Podaci o cestama proizlaze iz dobrovoljnog prikupljanja i nisu u potpunosti usklađeni na razini EU-a. Tramvajski i metro sustavi nisu uključeni jer metodologija prikupljanja podataka za ta prijevozna sredstva nije dovoljno usklađena među državama članicama.
9-50-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije i poticanju inovacija te prema cilju održivog razvoja 11 o postizanju uključivosti, sigurnosti, otpornosti i održivosti gradova i ljudskih naselja, koji su ugrađeni u prioritete Europske komisije 2024.-2029. pod „Novo doba za europsku obranu i sigurnost”, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”, „Održavanje naše kvalitete života: sigurnost opskrbe hranom, voda i priroda” i „Zaštita naše demokracije, očuvanje naših vrijednosti”.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju SDG 9.1.2 „Količine putnika i tereta, prema načinu prijevoza“.
9-50-methodology: >-
  Preispitivanje buduće mobilnosti uključuje optimizaciju korištenja svih načina prijevoza, dijeljenje automobila i multimodalnu integraciju između različitih načina kolektivnog prijevoza kao što su vlak, tramvaj, metro, autobus i taksi.
  Komisija je 2020. godine donijela „Strategiju održive i pametne mobilnosti” zajedno s akcijskim planom od 82 inicijative. Ova strategija postavlja temelje kako prometni sustav EU-a može ostvariti svoju zelenu i digitalnu transformaciju i postati otporniji na buduće krize. Kao što je navedeno u europskom zelenom planu, cilj će biti smanjenje emisija od 90% do 2050. godine, koje će se postići pametnim, konkurentnim, sigurnim, pristupačnim i pristupačnim prometnim sustavom.
9-50-long_term_objective: >-
  Nema opisa
9-60-title: Udio željeznice i unutarnjih plovnih putova u unutarnjem transportu tereta
9-60-definition: >-
  Ovaj pokazatelj mjeri udio željeznice i unutarnjih plovnih putova u unutarnjem teretnom prometu, izražen u tonskim kilometrima (tkm).
  Unutarnji teretni promet uključuje cestovni, željeznički i unutarnji plovni put. Svi podaci temelje se na kretanjima na nacionalnom teritoriju; željeznički prijevoz i prijevoz unutarnjim plovnim putovima prikupljaju se na temelju kretanja na nacionalnom teritoriju, bez obzira na nacionalnost vlaka ili plovila.
  Djelatnost cestovnog prijevoza prikuplja se prema zemlji registracije vozila, bez obzira na teritorij na kojem se djelatnost obavlja. Aktivnost se preraspodjeljuje na područje na kojem se aktivnost zapravo obavlja modeliranjem vjerojatnog plana putovanja na europskoj cestovnoj mreži. Trenutno nisu uključeni ni pomorski ni zračni prijevoz tereta.
9-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije i poticanju inovacija koje su ugrađene u prioritete Europske komisije za razdoblje 2024.-2029. pod naslovom „Novo doba za europsku obranu i sigurnost”.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju SDG 9.1.2 „Količine putnika i tereta, prema načinu prijevoza“.
9-60-methodology: >-
  Iako je slobodno kretanje robe bitna komponenta unutarnjeg tržišta EU-a i važno za održavanje konkurentnosti europske industrije i usluga, prijevoz bi trebao biti organiziran na ekološki prihvatljiv način.
  Ova strategija postavlja temelje kako prometni sustav EU-a može ostvariti svoju zelenu i digitalnu transformaciju i postati otporniji na buduće krize. Kao što je navedeno u europskom zelenom planu, cilj će biti smanjenje emisija od 90% do 2050. godine, koje će se postići pametnim, konkurentnim, sigurnim, pristupačnim i pristupačnim prometnim sustavom.
9-60-long_term_objective: >-
  Nema opisa
9-70-title: Intenzitet emisija u zrak u industriji
9-70-definition: >-
  Ovaj pokazatelj mjeri intenzitet emisija lebdećih čestica (PM10 i PM2.5) iz proizvodnog sektora (NACE Rev. 2 sektor „C“). Emisije u zrak definiraju se kao tokovi plinovitih i lebdećih čestica koje se emitiraju u atmosferu. 
  Sitne i krupne čestice (PM10) promjera su manje od 10 mikrometara i mogu se prenijeti duboko u pluća, gdje mogu uzrokovati upalu i pogoršati stanje osoba koje pate od bolesti srca i pluća. Sitne čestice (PM2.5) su promjera manjeg od 2,5 mikrometara i stoga su podskup čestica PM10. Njihovi negativni utjecaji na zdravlje ozbiljniji su od PM10 jer se mogu uvući dalje u pluća i mogu biti toksičniji. 
  Intenzitet emisije izračunava se dijeljenjem emisija PM-a sektora s njegovom bruto dodanom vrijednošću (BDV), koja se definira kao proizvodnja (u osnovnim cijenama) umanjena za intermedijarnu potrošnju (u kupovnim cijenama)
9-70-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 9 u industriji, inovacijama i infrastrukturi, koji je ugrađen u prioritete Europske komisije za razdoblje 2024.-2029. pod nazivom „Novo doba za europsku obranu i sigurnost”.
9-70-methodology: >-
  Cilj održivog razvoja 9 prepoznaje važnost tehnološkog napretka i inovacija za pronalaženje trajnih rješenja za društvene, gospodarske i ekološke izazove kao što su stvaranje novih radnih mjesta i promicanje resursne i energetske učinkovitosti. Kako bi se potaknule inovacije i poduzetništvo, SDG 9 također nastoji povećati pristup financijskim uslugama za mala poduzeća i premostiti digitalni jaz povećanjem pristupa informacijskim i komunikacijskim tehnologijama.
  Svojim Čistim industrijskim dogovorom iz veljače 2025. Europska komisija iznosi konkretne mjere za pretvaranje dekarbonizacije u pokretač rasta europskih industrija. To uključuje snižavanje cijena energije, stvaranje kvalitetnih radnih mjesta i prave uvjete za napredak tvrtki.
9-70-long_term_objective: >-
  Dugoročni cilj pokazatelja je mjerenje napretka prema cilju osiguravanja zdravog života i promicanja dobrobiti za sve u svim dobnim skupinama.
10-10-title: BDP po stanovniku prilagođen kupovnoj moći
10-10-definition: >-
  Bruto domaći proizvod (BDP) mjera je gospodarske aktivnosti. Odnosi se na vrijednost ukupne proizvodnje dobara i usluga koje proizvodi gospodarstvo, umanjenu za intermedijarnu potrošnju, plus neto poreze na proizvode i uvoz. BDP po stanovniku izračunava se kao omjer BDP-a i prosječnog stanovništva u određenoj godini. Osnovne brojke izražene su u standardima kupovne moći (SKM), što predstavlja zajedničku valutu koja eliminira razlike u razinama cijena između zemalja kako bi se omogućile smislene usporedbe obujma BDP-a.
10-10-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i među zemljama; što je ugrađeno u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju ciljeva održivog razvoja 8.1.1 „Godišnja stopa rasta realnog BDP-a po stanovniku“. Nadalje, pokazatelj je i pokazatelj učinka za Strateški plan 2020. - 2024. koji se odnosi na 10 prioriteta Komisije.
10-10-methodology: >-
  Pokazatelj je također relevantan u kontekstu nedavno usvojenog europskog stupa socijalnih prava, koji utvrđuje niz ključnih načela za potporu pravednim i dobro funkcionirajućim tržištima rada i sustavima socijalne skrbi. Ta se načela bave temama povezanim s nejednakošću, rješavanjem nejednakosti ishoda (nejednakost prihoda i bogatstva) i nejednakosti mogućnosti: od određivanja plaća do sustava socijalne zaštite (uključujući minimalni dohodak), ravnopravnosti spolova, omogućavanja socijalnih usluga, skrbi o djeci i podrške djeci, dohotka od starosti, zdravstvene skrbi i pristupa stanovanju.
10-10-long_term_objective: >-
  Dugoročni cilj pokazatelja je progresivno postizanje i održavanje rasta dohotka najnižih 40 posto stanovništva po stopi višoj od nacionalnog prosjeka do 2030. godine.
10-20-title: Nejednakosti u dohotku kućanstava po stanovniku
10-20-definition: >-
  Pokazatelj odražava kupovnu moć kućanstava i njihovu sposobnost ulaganja u dobra i usluge ili štednje za budućnost, obračunavanjem poreza i socijalnih doprinosa te novčanih socijalnih naknada u naravi. Izračunava se kao prilagođeni bruto raspoloživi dohodak kućanstava i neprofitnih institucija koje služe kućanstvima (NPISH) podijeljen s paritetima kupovne moći (PPP) stvarne individualne potrošnje kućanstava i ukupnom rezidentnom populacijom.
10-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 10 o smanjenju nejednakosti unutar i među zemljama te cilju održivog razvoja 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje, koji je ugrađen u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
10-20-methodology: >-
  Pokazatelj je uključen kao glavni pokazatelj u Pregled socijalnih pokazatelja za europski stup socijalnih prava. Evropski stub za socijalna prava, usvojen 2017. godine, postavlja niz ključnih principa za podršku pravednim i dobro funkcionirajućim tržištima rada i sustavima socijalne skrbi. Ta se načela bave temama povezanim s nejednakošću, rješavanjem nejednakosti ishoda (nejednakost prihoda i bogatstva) i nejednakosti mogućnosti: od određivanja plaća do sustava socijalne zaštite (uključujući minimalni dohodak), ravnopravnosti spolova, omogućavanja socijalnih usluga, skrbi o djeci i podrške djeci, dohotka od starosti, zdravstvene skrbi i pristupa stanovanju.
  Dok se BDP po glavi stanovnika koristi za mjerenje ekonomskih rezultata zemlje, bruto raspoloživi dohodak kućanstva pruža pokazatelj prosječnog materijalnog blagostanja ljudi. Pokazatelj stoga mjeri približavaju li se države članice EU-a u smislu prihoda ljudi.
10-20-long_term_objective: >-
  Nema opisa
10-30-title: Relativni medijan rizika od siromaštva
10-30-definition: >-
  Pokazatelj se izračunava kao udaljenost između medijana ekvivalentnog ukupnog neto dohotka osoba ispod praga rizika od siromaštva i samog praga rizika od siromaštva, izraženog kao postotak praga rizika od siromaštva. Taj je prag postavljen na 60 % nacionalnog medijana ekvivalentnog raspoloživog dohotka svih ljudi u zemlji, a ne za EU u cjelini.
10-30-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i među zemljama; što je ugrađeno u prioritete Europske komisije pod naslovom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela”.
   Europski stup socijalnih prava utvrđuje 20 ključnih načela za potporu pravednim i dobro funkcionirajućim tržištima rada i sustavima socijalne skrbi. Ova načela bave se temama povezanim s nejednakošću rješavanjem nejednakosti ishoda i nejednakosti mogućnosti: od određivanja plaća do sustava socijalne zaštite, ravnopravnosti spolova, omogućavanja socijalnih usluga, skrbi o djeci i podrške djeci, dohotka od starosti, zdravstvene zaštite i pristupa stanovanju.
10-30-methodology: >-
  U Akcijskom planu za europski stup socijalnih prava načela europskog stupa socijalnih prava pretvaraju se u konkretne mjere u korist građana. U njemu se predlažu glavni ciljevi u pogledu stope zaposlenosti, sudjelovanja odraslih u učenju i rizika od siromaštva i socijalne isključenosti koje EU treba postići do 2030.
  Europski semestar ključni je alat za provedbu stupa i koordinira ekonomske i fiskalne politike država članica EU-a. Kao dio svog Zelenog plana, Europska komisija najavila je da će se europski semestar preusmjeriti na integraciju ciljeva održivog razvoja i stavljanje održivosti i dobrobiti građana u središte ekonomske politike.
10-30-long_term_objective: >-
  SDG 10 poziva nacije da prilagode politike i zakonodavstvo kako bi povećale dohodak donjih 40 % stanovništva i smanjile nejednakosti na temelju dohotka, spola, dobi, invaliditeta, rase, klase, etničke pripadnosti, vjere i mogućnosti.
10-41-title: Raspodjela prihoda - zamjenski pokazatelj
10-41-definition: >-
  Postotni udio prihoda ili potrošnje predstavlja udio koji pripada podskupinama stanovništva podijeljenima na decile ili kvintile. Postotni udjeli po kvintilima možda neće iznositi točno 100% zbog zaokruživanja brojeva. Podaci se temelje na primarnim podacima iz anketa o potrošnji kućanstava, prikupljenima od državnih zavoda za statistiku i odjela Svjetske banke za pojedine zemlje.
10-41-intention: >-
  Unatoč napretku u posljednjem desetljeću, izazovi u mjerenju siromaštva i dalje postoje. Pravodobnost, učestalost, kvaliteta i usporedivost anketa kućanstava moraju se znatno povećati, osobito u najsiromašnijim zemljama. Ankete sadrže detaljna pitanja o izvorima prihoda i načinu na koji su utrošeni, što obučeno osoblje mora pažljivo bilježiti. Prihode je općenito teže precizno izmjeriti, dok je potrošnja bliža samom pojmu životnog standarda. Većina podataka iz anketa danas uključuje i procjene vrijednosti potrošnje ili prihoda iz vlastite proizvodnje, no metode vrednovanja se razlikuju.
10-41-methodology: >-
  Nejednakost u raspodjeli dohotka ogleda se u udjelu dohotka ili potrošnje koji pripada dijelu stanovništva rangiranom prema razini dohotka ili potrošnje. Dijelovi stanovništva koji su najniže rangirani po osobnome dohotku ostvaruju najmanje udjele u ukupnome dohotku. Podatci o raspodjeli dohotka ili potrošnje potječu iz nacionalno reprezentativnih anketa kućanstava. Ondje gdje su originalni podatci iz ankete kućanstava bili dostupni, upotrijebljeni su za izravno izračunavanje udjela dohotka ili potrošnje po kvintilima. U suprotnome, udjeli su procijenjeni na temelju najboljih dostupnih grupiranih podataka. Podatci o raspodjeli prilagođeni su veličini kućanstva, čime se osigurava dosljednija mjera dohotka ili potrošnje po stanovniku. Godina istraživanja je godina u kojoj su prikupljeni osnovni podatci iz ankete kućanstava ili, kada razdoblje prikupljanja podataka obuhvaća dvije kalendarske godine, godina u kojoj je prikupljena većina podataka. Postotni udjeli po kvintilima možda neće iznositi 100% zbog zaokruživanja.
10-41-long_term_objective: >-
  Cilj Grupe Svjetske banke o promicanju zajedničkog prosperiteta definiran je kao poticanje rasta dohotka najsiromašnijih 40 posto stanovništva prema raspodjeli blagostanja u svakoj zemlji. Podatci o raspodjeli dohotka i Ginijev koeficijent mjere nejednakost u dohotku ili potrošnji te predstavljaju važne pokazatelje za mjerenje zajedničkog prosperiteta.
10-50-title: Udio prihoda donjih 40% stanovništva
10-50-definition: >-
  Pokazatelj mjeri udio dohotka koji je primilo donjih 40 % stanovništva. Korišteni koncept dohotka je ukupni raspoloživi dohodak kućanstva.
10-50-intention: >-
  Cilj održivog razvoja 10 usmjeren je na smanjenje nejednakosti unutar i između zemalja, što je ugrađeno u prioritete Europske komisije u okviru inicijative „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“. Pokazatelj se može smatrati sličnim globalnom pokazatelju SDG 10.1.1 „Stope rasta rashoda kućanstava ili dohotka po stanovniku među najsiromašnijih 40 posto stanovništva u usporedbi s ukupnim stanovništvom“. Pokazatelj je relevantan za mjerenje ukupne promjene životnog standarda osoba s najnižim prihodima tijekom više godina. Europski stup socijalnih prava utvrđuje 20 ključnih načela za podršku pravednim i dobro funkcionirajućim tržištima rada i sustavima socijalne zaštite. Ta se načela bave pitanjima vezanim uz nejednakost rješavanjem nejednakosti ishoda i nejednakosti mogućnosti: od određivanja plaća do sustava socijalne zaštite, ravnopravnosti spolova, pružanja socijalnih usluga, skrbi o djeci i potpore djeci, mirovinskih prihoda, zdravstvene zaštite te pristupa stanovanju.
10-50-methodology: >-
  U Akcijskom planu za europski stup socijalnih prava načela europskog stupa socijalnih prava pretvaraju se u konkretne mjere u korist građana. U njemu se predlažu glavni ciljevi u pogledu stope zaposlenosti, sudjelovanja odraslih u učenju i rizika od siromaštva i socijalne isključenosti koje EU treba postići do 2030. Europski semestar ključni je alat za provedbu stupa i koordinira ekonomske i fiskalne politike država članica EU-a. Kao dio svog Zelenog plana, Europska komisija najavila je da će se europski semestar preusmjeriti na integraciju ciljeva održivog razvoja i stavljanje održivosti i dobrobiti građana u središte ekonomske politike. Europski socijalni fond (ESF) glavni je instrument EU-a za ulaganje u ljude od donošenja Ugovora iz Rima. Pomaže u rješavanju nejednakosti, kako u smislu ishoda tako i mogućnosti, financiranjem mjera u područjima zapošljavanja, socijalne uključenosti, obrazovanja, osposobljavanja i reformi administrativnih kapaciteta. Revidirani Europski socijalni fond plus (ESF+), s proračunom od 101 milijarde EUR u okviru višegodišnjeg financijskog okvira za razdoblje 2021. - 2027., dodatno će pomoći u smanjenju nejednakosti.
10-50-long_term_objective: >-
  Nema opisa
10-60-title: Zahtjevi za azil
10-60-definition: >-
  Ovaj pokazatelj prikazuje broj podnositelja zahtjeva za azil koji to čine prvi put i broj pozitivnih prvostupanjskih odluka na milijun stanovnika. Podnositelj zahtjeva za međunarodnu zaštitu koji to čini prvi put osoba je koja je po prvi put podnijela zahtjev za azil. Prvostupanjske odluke su odluke koje donosi nadležno tijelo u svojstvu prve instance u upravnom ili sudskom postupku azila u zemlji primateljici. Potreban je oprez pri usporedbi ovih dviju vrijednosti, budući da se zahtjevi primljeni u određenoj godini možda neće obraditi sve do neke od sljedećih godina. UNHCR surađuje s vlastima u BiH i civilnim društvom na poboljšanju rane identifikacije osoba kojima je potrebna zaštita te na jačanju postupaka azila. Operativno djelovanje UNHCR-a u BiH preusmjerava fokus na aktivnosti iz svog temeljnog mandata koje se odnose na azil, inkluziju i apatridiju te na proširenje napora zagovaranja. Zajedno s vlastima i partnerskim nevladinim organizacijama, UNHCR radi na rješavanju svih poznatih slučajeva apatridije i na sprječavanju pojave novih slučajeva.
10-60-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“. SDG 10, između ostalog, nastoji da promoviše socijalnu inkluziju na globalnom nivou kroz olakšavanje sigurne, uredne i regularne migracije i smanjenje transakcionih troškova doznaka migranata. Centar znanja Evropske komisije za migracije i demografiju pruža analizu znanja i dokaza za razvoj politika i odluke u vezi sa spašavanjem života migranata i osiguranjem vanjskih granica, jačanjem zajedničke politike azila i razvojem nove politike o zakonitoj migraciji. Fond za azil, migracije i integraciju pruža finansijsku podršku ovim aktivnostima.
10-60-methodology: >-
  Fond za evropsku pomoć najugroženijima (FEAD) pruža podršku tražiocima azila pružajući im trenutnu pomoć (hranu, odjeću i druge bitne predmete za ličnu upotrebu). Predložene Evropske snage solidarnosti će omogućiti mladim ljudima širom EU da volontiraju svoju pomoć za prihvat i integraciju izbjeglica.
  10-60-long_term_objective: >-
  Nema opisa
11-11-title: Stupanj ozbiljnog stambenog zaostatka
11-11-definition: >-
  Stopa teške stambene deprivacije definirana je kao postotak stanovništva koje živi u stambenoj jedinici koja se smatra prenapučenom i istovremeno pokazuje barem jednu od sljedećih mjera stambene deprivacije: i) prokišnjavanje krova, ii) nedostatak kade/tuša i unutarnjeg WC-a, iii) smatra se pretamnom.
11-11-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu uključivi, sigurni, otporni i održivi, ​​te prema Cilju održivog razvoja 1 o višedimenzionalnom siromaštvu. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije „Novo doba za europsku obranu i sigurnost“, „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje naše kvalitete života: sigurnost hrane, voda i priroda“ te „Zaštita naše demokracije, poštivanje naših vrijednosti“. Cilj održivog razvoja 1 ugrađen je u prioritete Europske komisije „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“.
11-11-methodology: >-
  „Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude prilike za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i još mnogo toga, uz poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Cilj održivog razvoja 1, između ostalog, poziva na iskorjenjivanje ekstremnog siromaštva i smanjenje relativnog siromaštva te je ugrađen u prioritete Europske komisije u okviru „Gospodarstva koje radi za ljude“.“
11-11-long_term_objective: >-
  Nema opisa
11-20-title: Stanovništvo koje živi u kućanstvima pogođenim bukom
11-20-definition: >-
  Pokazatelj mjeri udio stanovništva koji izjavljuje da je pogođen bukom od susjeda ili s ulice.
  Budući da je procjena buke subjektivna, treba napomenuti da pokazatelj uzima u obzir i razinu buke i standarde ljudi o tome što smatraju prihvatljivim razinama. Stoga, povećanje vrijednosti pokazatelja ne mora nužno ukazivati ​​na sličan porast razine buke, već i na smanjenje razina koje su europski građani spremni tolerirati i obrnuto. Zapravo, postoje empirijski dokazi da percipirana kvaliteta okoliša od strane pojedinaca nije uvijek u skladu sa stvarnom kvalitetom okoliša procijenjenom pomoću 'objektivnih' pokazatelja, posebno za buku.
11-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu uključivi, sigurni, otporni i održivi, ​​te Cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije „Novo doba za europsku obranu i sigurnost“, „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje naše kvalitete života: sigurnost hrane, voda i priroda“ te „Zaštita naše demokracije, poštivanje naših vrijednosti“. Cilj održivog razvoja 3 ugrađen je u prioritete Europske komisije „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“.
11-20-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i više, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Cilj održivog razvoja 3 ima za cilj osigurati zdravlje i dobrobit za sve u svim dobnim skupinama poboljšanjem reproduktivnog, majčinog i dječjeg zdravlja; okončanjem epidemija glavnih zaraznih bolesti; smanjenjem nezaraznih i mentalnih bolesti. Također poziva na smanjenje čimbenika rizika za zdravlje u ponašanju i okolišu.
  Direktiva o buci u okolišu glavni je instrument EU-a za identificiranje i borbu protiv onečišćenja bukom. Usredotočuje se na tri područja djelovanja: određivanje izloženosti buci u okolišu; osiguravanje da su informacije o buci u okolišu i njezinim utjecajima dostupne javnosti; sprječavanje i smanjenje buke u okolišu gdje je to potrebno, posebno tamo gdje razine izloženosti mogu uzrokovati štetne učinke na ljudsko zdravlje, te očuvanje kvalitete buke u okolišu gdje je ona dobra.
11-20-long_term_objective: >-
  Nema opisa
11-32-title: Indeks prekrivanja tla
11-32-definition: >-
  Ovaj pokazatelj mjeri pokrivenost površine tla nepropusnim materijalima, što ukazuje na nepropusnost. Agregacija vrijednosti nepropusnosti s referentnim jedinicama, kao što su urbana područja, poplavne ravnice, obalne zone ili zaštićena područja, vrši se korištenjem integrirane platforme prostornih podataka EEA-e.
11-32-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu uključivi, sigurni, otporni i održivi, ​​te prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost", "Potpora ljudima, jačanje naših društava i našeg socijalnog modela", "Održavanje kvalitete života: sigurnost hrane, voda i priroda" i "Zaštita naše demokracije, održavanje naših vrijednosti". Cilj održivog razvoja 15 ugrađen je u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
11-32-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i još mnogo toga, uz poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutarnjih vodenih i planinskih ekosustava. To uključuje napore za održivo gospodarenje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka bioraznolikosti i zaštitu ugroženih vrsta.
11-32-long_term_objective: >-
  Strategija za tlo 2030 postavila je cilj nulte neto eksploatacije zemljišta do 2050. godine.
11-40-title: Smrtnost u cestovnom prometu
11-40-definition: >-
  Pokazatelj mjeri broj smrtnih slučajeva uzrokovanih prometnim nesrećama, uključujući vozače i putnike motornih vozila i bicikala, kao i pješake. Osobe koje umru u prometnim nesrećama do 30 dana nakon što se nesreća dogodila računaju se kao smrtni slučajevi u prometnim nesrećama.
11-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu uključivi, sigurni, otporni i održivi, ​​te Cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije u okviru „Novo doba europske obrane i sigurnosti“, „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje kvalitete života: sigurnost hrane, vode i prirode“ te „Zaštita naše demokracije, poštivanje naših vrijednosti“. Cilj održivog razvoja 3 ugrađen je u prioritete Europske komisije u okviru „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju Cilja održivog razvoja 3.6.1 „Stopa smrtnosti u prometnim nesrećama“.
11-40-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude prilike za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i više, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Uz dobro, o riziku informirano i pametno planiranje i upravljanje, Cilj održivog razvoja 11 zamišlja gradove kao ekološki otporna ljudska naselja koja potiču osobnu sigurnost.
  Cilj održivog razvoja 3 ima za cilj osigurati zdravlje i dobrobit za sve u svim dobnim skupinama poboljšanjem reproduktivnog, majčinog i dječjeg zdravlja; okončanjem epidemija glavnih zaraznih bolesti; smanjenjem nezaraznih i mentalnih bolesti. Također poziva na smanjenje čimbenika rizika za zdravlje u ponašanju i okolišu.
  Strateški akcijski plan sigurnosti u prometu i Okvir politike sigurnosti u prometu EU 2021.-2030. postavili su cilj smanjenja smrtnih slučajeva i teških ozljeda za 50% do 2030. u usporedbi s 2019. i ambiciozne planove sigurnosti u prometu za postizanje nula smrtnih slučajeva u prometu do 2050. („Vizija nula“).
11-40-long_term_objective: >-
  Nema opisa
11-52-title: Prerane smrti zbog izloženosti finim česticama (PM2,5)
11-52-definition: >-
  Ovaj pokazatelj procjenjuje broj prijevremenih smrti koje se mogu pripisati dugotrajnoj izloženosti koncentracijama PM2.5 iznad 5µg/m3 (smjernice WHO-a). PM2.5 su čestice čiji je promjer manji od 2,5 mikrometara i koje mogu dospjeti duboko u pluća gdje mogu uzrokovati upalu i pogoršati stanje osoba koje pate od srčanih i plućnih bolesti.
11-52-intention: >-
  Koristi se za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu uključivi, sigurni, otporni i održivi, ​​te Cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije pod nazivom „Novo doba za europsku obranu i sigurnost“, „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje naše kvalitete života: sigurnost hrane, voda i priroda“ te „Zaštita naše demokracije, poštivanje naših vrijednosti“. Cilj održivog razvoja 3 ugrađen je u prioritete Europske komisije pod nazivom „Potpora ljudima, jačanje naših društava i našeg socijalnog modela“.
11-52-methodology: >-
  EU se bavi onečišćenjem zraka putem svog specifičnog zakonodavstva o kvaliteti zraka i industrijskim emisijama, kao što su Paket za čisti zrak i direktive koje su usvojili Vijeće i Europski parlament o kvaliteti ambijentalnog zraka, kao i kroz suučesne koristi provedbe određenih klimatskih politika.
  Akcijski plan za nulto onečišćenje zraka, vode i tla uključuje cilj smanjenja utjecaja onečišćenja zraka na zdravlje za 55% do 2030. u usporedbi s 2005. godinom.
  Okvir za praćenje 8. Akcijskog programa za okoliš koristi broj prijevremenih smrti kao ključni pokazatelj s ciljem smanjenja broja trajnih smrti uzrokovanih PM2.5 za 55% do 2030. u usporedbi s 2005. godinom.
11-52-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost 5.
11-60-title: Postotak recikliranja komunalnog otpada
11-60-definition: >-
  Pokazatelj mjeri količinu recikliranog komunalnog otpada podijeljenu s ukupnom količinom proizvedenog komunalnog otpada. Recikliranje uključuje recikliranje materijala, kompostiranje, pripremu za ponovnu upotrebu i anaerobnu digestiju. Komunalni otpad uglavnom se sastoji od otpada koji proizvode kućanstva, ali može uključivati ​​i sličan otpad koji proizvode mala poduzeća i javne ustanove, a koji prikuplja općina. Ovaj potonji dio komunalnog otpada može varirati od općine do općine i od zemlje do zemlje, ovisno o lokalnom sustavu gospodarenja otpadom. Za područja koja nisu obuhvaćena programom prikupljanja komunalnog otpada, procjenjuje se količina proizvedenog otpada.
11-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja postanu uključivi, sigurni, otporni i održivi, ​​što je ugrađeno u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost", "Potpora ljudima, jačanje naših društava i našeg socijalnog modela", "Održavanje naše kvalitete života: sigurnost hrane, voda i priroda" te "Zaštita naše demokracije, očuvanje naših vrijednosti".
11-60-methodology: >-
  Akcijski plan za kružno gospodarstvo iz 2015. podržava prijelaz na jače i kružnije gospodarstvo. Direktiva (EU) 2018/851 od 30. svibnja 2018. postavila je nove, ambicioznije pravno obvezujuće ciljeve za recikliranje i ponovnu upotrebu komunalnog otpada. Zemlje EU-a sada će morati reciklirati najmanje 55 % svog komunalnog otpada do 2025., 60 % do 2030. i 65 % do 2035. Prijedlog paketa mjera za kružno gospodarstvo iz 2022. za Direktivu o ambalaži i ambalažnom otpadu ima za cilj smanjenje ambalažnog otpada i povećanje recikliranja.
11-60-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 62.
12-10-title: Potrošnja opasnih kemikalija
12-10-definition: >-
  Ovaj pokazatelj mjeri potrošnju otrovnih kemikalija, izraženu u milijunima tona. Potrošnja kemikalija izračunava se kao zbroj proizvodnje (PRODCOM) i neto uvoza kemikalija (COMEXT) prema jednadžbi: Potrošnja = proizvodnja + uvoz – izvoz.
  Podaci o opasnim i neopasnim kemikalijama pokazuju ukupnu potrošnju svih kemikalija. Dvije potkategorije opasnih kemikalija – opasne za ljudsko zdravlje i opasne za okoliš – preklapaju se po definiciji i kao rezultat toga njihov zbroj nije jednak ukupnoj potrošnji opasnih kemikalija.
12-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, koji je ugrađen u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
12-10-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane poduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju temeljenu na naprednim tehnološkim mogućnostima, učinkovitosti resursa i smanjenju globalnog otpada.
  Okvir za registraciju, evaluaciju, autorizaciju i ograničavanje kemikalija (REACH) ima za cilj poboljšati zaštitu ljudskog zdravlja i okoliša boljom identifikacijom i upravljanjem opasnim kemikalijama. Okvir će se ažurirati, uz podršku Strategije za kemikalije za održivost, čiji je cilj poboljšati zaštitu okoliša i našeg zdravlja od rizika koje predstavljaju kemikalije i podržati inovacije za sigurne i održive kemikalije.
12-10-long_term_objective: >-
  Nema opisa
12-21-title: Materijalni otisak
12-21-definition: >-
  Materijalni otisak, također poznat kao potrošnja sirovina (RMC), predstavlja globalnu potražnju za ekstrakcijom materijala (minerala, metalnih ruda, biomase, fosilnih energetskih materijala) potaknutu potrošnjom roba i usluga unutar referentnog geografskog područja. Podaci o materijalnom otisku potječu iz računa tokova materijala, koji modeliraju tokove prirodnih resursa iz okoliša u gospodarstvo. Uključuju domaću eksploataciju materijala mjerenu u tonama bruto materijala (na primjer, bruto ruda ili bruto žetva), kao i uvoz i izvoz mjeren u smislu procijenjenih ekvivalenata sirovina trgovanih proizvoda (domaća i strana eksploatacija potrebna za proizvodnju trgovanih proizvoda). RMC stoga pokazuje količinu eksploatacije potrebnu za proizvodnju robe koju traže krajnji korisnici u referentnom geografskom području, bez obzira na to gdje se u svijetu eksploatacija materijala odvijala.
12-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, koji je ugrađen u Prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, vode i prirode“.
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane poduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju temeljenu na naprednim tehnološkim mogućnostima, učinkovitosti resursa i smanjenju globalnog otpada.
  Cilj održivog razvoja 8, između ostalog, poziva na promicanje radnih prava i sigurnih i zaštićenih radnih okruženja.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju Ciljeva održivog razvoja 8.4.1 i 12.2.1 za element „Materijalni otisak“.
12-21-methodology: >-
  Osmi akcijski program za okoliš (EAP), usvojen u ožujku 2022., ima za cilj ubrzati prijelaz na klimatski neutralno, resursno učinkovito i regenerativno gospodarstvo, prepoznajući da ljudska dobrobit ovisi o zdravim ekosustavima. Njegovi prioritetni ciljevi uključuju postizanje klimatske neutralnosti do 2050. i obnovu bioraznolikosti.
  Akcijski plan za kružno gospodarstvo, usvojen 2020., ima za cilj udvostručiti stopu korištenja kružnih materijala u EU tijekom sljedećeg desetljeća kako bi se podržalo postizanje klimatske neutralnosti do 2050., odvojio gospodarski rast od korištenja resursa i stvaranja otpada te potrošnja resursa ostala unutar ekoloških granica. U ožujku 2022. Europska komisija usvojila je paket mjera o kružnom gospodarstvu kako bi održivi proizvodi postali norma u EU i potaknula kružne poslovne modele.
12-21-long_term_objective: >-
  Nema opisa
12-31-title: Otisak potrošnje
12-31-definition: >-
  Potrošački otisak (KP) je model procjene životnog ciklusa (LCA) koji se koristi za razvoj skupa od 16 pokazatelja okoliša za procjenu utjecaja obrazaca potrošnje EU i njezinih država članica na okoliš, a provodi se kombiniranjem podataka o intenzitetu potrošnje s procjenom utjecaja reprezentativnih proizvoda na okoliš. Procjena KP temelji se na kombinaciji: (a) emisija u zrak, tlo i vodu, kao i resursa korištenih tijekom životnog ciklusa 164 reprezentativna proizvoda, koji pripadaju pet područja potrošnje (hrana, mobilnost, stanovanje, kućanski aparati i uređaji), (b) godišnje potrošnje (tj. intenziteta potrošnje) tih proizvoda, izračunate iz statistike potrošnje, i (c) metode procjene utjecaja ekološkog otiska (EP), koja emisije i potrošnju resursa prevodi u 16 potencijalnih utjecaja na okoliš, koji se mogu agregirati u jedan rezultat, gdje je to prikladno. Pokazatelji utjecaja EP-a mogu se usporediti sa skupom pragova na temelju okvira planetarnih granica. Dakle, određeni pokazatelj KP-a (na primjer, klimatske promjene ili eutrofikacija mora) mjeri koliko je puta utjecaj potrošnje premašio povezanu planetarnu granicu. Slično tome, individualni ponderirani CF rezultat mjeri broj puta kada je ponderirana granica prekoračena.
12-31-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, koji je ugrađen u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
12-31-methodology: >-
  Europska komisija usvojila je Akcijski plan za kružno gospodarstvo (CEAP) u ožujku 2020. Prijelaz EU-a na kružno gospodarstvo smanjit će pritisak na prirodne resurse te stvoriti održivi rast i radna mjesta. Novi akcijski plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promiče procese kružnog gospodarstva, potiče održivu potrošnju i ima za cilj osigurati sprječavanje nastanka otpada i da korišteni resursi ostanu u gospodarstvu EU što je dulje moguće. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket mjera za kružno gospodarstvo utvrđuje akcijski program s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do gospodarenja otpadom. Paket uključuje obveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambiciozne kvantitativne ciljeve za povećanje recikliranja i smanjenje odlaganja otpada, obveze za poboljšanje odvojenog prikupljanja otpada, kao i promicanje učinkovitog korištenja bioresursa.
12-31-long_term_objective: >-
  Nema opisa
12-41-title: Stopa kružne upotrebe materijala
12-41-definition: >-
  Potrošački otisak (KP) je model procjene životnog ciklusa (LCA) koji se koristi za razvoj skupa od 16 pokazatelja okoliša za procjenu utjecaja obrazaca potrošnje EU i njezinih država članica na okoliš, a provodi se kombiniranjem podataka o intenzitetu potrošnje s procjenom utjecaja reprezentativnih proizvoda na okoliš. Procjena KP temelji se na kombinaciji: (a) emisija u zrak, tlo i vodu, kao i resursa korištenih tijekom životnog ciklusa 164 reprezentativna proizvoda, koji pripadaju pet područja potrošnje (hrana, mobilnost, stanovanje, kućanski aparati i uređaji), (b) godišnje potrošnje (tj. intenziteta potrošnje) tih proizvoda, izračunate iz statistike potrošnje, i (c) metode procjene utjecaja ekološkog otiska (EP), koja emisije i potrošnju resursa prevodi u 16 potencijalnih utjecaja na okoliš, koji se mogu agregirati u jedan rezultat, gdje je to prikladno. Pokazatelji utjecaja EP-a mogu se usporediti sa skupom pragova na temelju okvira planetarnih granica. Dakle, određeni pokazatelj KP-a (na primjer, klimatske promjene ili eutrofikacija mora) mjeri koliko je puta utjecaj potrošnje premašio povezanu planetarnu granicu. Slično tome, individualni ponderirani CF rezultat mjeri broj puta kada je ponderirana granica prekoračena.
12-41-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, što je ugrađeno u prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane“. Pokazatelj se može smatrati dijelom globalnog pokazatelja za Cilj održivog razvoja 11.6.1 „Udio krutog komunalnog otpada koji se redovito prikuplja i ima odgovarajuće konačno zbrinjavanje u ukupnom proizvedenom komunalnom otpadu, u gradovima“.
  Povećanje kružnosti europskog gospodarstva ključni je prioritet nove industrijske strategije EU usvojene 2020. godine i jedan je od ključnih elemenata Europskog zelenog plana.
12-41-methodology: >-
  Europska komisija usvojila je Akcijski plan za kružno gospodarstvo (CEAP) u ožujku 2020. Prijelaz EU-a na kružno gospodarstvo smanjit će pritisak na prirodne resurse te stvoriti održivi rast i radna mjesta. Novi akcijski plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promiče procese kružnog gospodarstva, potiče održivu potrošnju i ima za cilj osigurati sprječavanje nastanka otpada i da korišteni resursi ostanu u gospodarstvu EU što je dulje moguće. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket za kružno gospodarstvo utvrđuje akcijski program s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do gospodarenja otpadom. Paket uključuje obveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambicioznim kvantitativnim ciljevima za povećanje recikliranja i smanjenje odlaganja otpada, obveze za poboljšanje odvojenog prikupljanja otpada, kao i promicanje učinkovitog korištenja bioresursa.
  Akcijski plan za održivu potrošnju i proizvodnju te održivu industrijsku politiku (SCP/SIP) uključuje niz prijedloga o održivoj potrošnji i proizvodnji koji će doprinijeti poboljšanju ekološke učinkovitosti proizvoda i povećanju potražnje za održivijom robom i proizvodnim tehnologijama. Osmi program djelovanja za okoliš (EAP), usvojen u ožujku 2022., ima za cilj ubrzati prijelaz na klimatski neutralno, resursno učinkovito i regenerativno gospodarstvo, prepoznajući da ljudska dobrobit ovisi o zdravim ekosustavima. Među njegovim prioritetnim ciljevima su postizanje klimatske neutralnosti do 2050. i obnova bioraznolikosti. Ovaj pokazatelj također je uključen kao glavni pokazatelj i postavlja cilj udvostručenja kružnosti korištenja materijala do 2030. u usporedbi s 2020. godinom.
12-41-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 30
12-51-title: Nastajanje otpada
12-51-definition: >-
  Ovaj pokazatelj definira se kao sav otpad nastao u nekoj zemlji. Uključuje otpad nastao industrijskom proizvodnjom (uključujući i sam sektor gospodarenja otpadom) i otpad koji nastaju u kućanstvima. Uključeni su glavni mineralni otpad, iskopani materijal i tlo. To dovodi do velikih količina otpada u nekim zemljama sa značajnim gospodarskim aktivnostima poput rudarstva i građevinarstva.
12-51-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, što je ugrađeno u prioritete Europske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, vode i prirode“.
  Pokazatelj se može smatrati dijelom globalnog pokazatelja za Cilj održivog razvoja 11.6.1 „Udio krutog komunalnog otpada koji se redovito prikuplja i odlaže u odgovarajućem konačnom obliku u ukupnom krutom komunalnom otpadu koji proizvode gradovi“.
  Povećanje kružnosti europskog gospodarstva ključni je prioritet nove industrijske strategije EU usvojene 2020. godine i jedan je od ključnih elemenata Europskog zelenog plana.
12-51-methodology: >-
  Europska komisija usvojila je novi Akcijski plan za kružno gospodarstvo (CEAP) u ožujku 2020. Prijelaz EU-a na kružno gospodarstvo smanjit će pritisak na prirodne resurse te stvoriti održivi rast i radna mjesta. Novi akcijski plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promiče procese kružnog gospodarstva, potiče održivu potrošnju i ima za cilj osigurati sprječavanje nastanka otpada i da korišteni resursi ostanu u gospodarstvu EU što je dulje moguće. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket kružnog gospodarstva uspostavlja akcijski program s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do gospodarenja otpadom. Paket uključuje obveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambicioznim kvantitativnim ciljevima za povećanje recikliranja i smanjenje odlaganja otpada, obveze za poboljšanje odvojenog prikupljanja otpada, kao i promicanje učinkovitog korištenja bioresursa.
  Akcijski plan za održivu potrošnju i proizvodnju te održivu industrijsku politiku (SCP/SIP) uključuje niz prijedloga o održivoj potrošnji i proizvodnji koji će doprinijeti poboljšanju ekološke učinkovitosti proizvoda i povećati potražnju za održivijom robom i proizvodnim tehnologijama.
12-51-long_term_objective: >-
  Nema opisa
12-61-title: Bruto dodana vrijednost u sektoru ekoloških dobara i usluga
12-61-definition: >-
  Sektor ekoloških dobara i usluga (EGSS) definiran je kao dio gospodarstva neke zemlje koji proizvodi dobra i usluge koje se koriste u aktivnostima zaštite okoliša i upravljanja resursima, bilo na domaćem ili međunarodnom nivou. Bruto dodana vrijednost u EGSS-u predstavlja doprinos sektora ekoloških dobara i usluga BDP-u.
  Ekološki proizvodi sprječavaju, smanjuju i uklanjaju onečišćenje ili bilo koju drugu degradaciju okoliša te uključuju mjere poduzete za obnovu degradiranih staništa i ekosustava. Primjeri uključuju električna vozila, katalizatore i filtere za smanjenje emisija onečišćujućih tvari, usluge obrade otpadnih voda i otpada ili radove na izolaciji buke. Proizvodi za upravljanje resursima štite zalihe prirodnih resursa od iscrpljivanja. Primjeri uključuju proizvodnju obnovljive energije, energetski učinkovite i pasivne zgrade, desalinizaciju morske vode ili prikupljanje kišnice.
12-61-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje te Cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promicanju uključive i održive industrijalizacije te poticanju inovacija, koji su ugrađeni u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
12-61-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane poduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju temeljenu na naprednim tehnološkim mogućnostima, učinkovitosti resursa i smanjenju globalnog otpada. Cilj održivog razvoja 9 poziva na izgradnju otporne i održive infrastrukture te promicanje uključive i održive industrijalizacije. Također prepoznaje važnost istraživanja i inovacija u pronalaženju trajnih rješenja za društvene, ekonomske i ekološke izazove.
12-61-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 5,5.
13-10-title: Domaće neto emisije stakleničkih plinova
13-10-definition: >-
  Pokazatelj mjeri ukupne nacionalne emisije (iz oba sektora, ESD i ETS) tzv. "Kyotske košarice" stakleničkih plinova, uključujući ugljikov dioksid (CO2), metan (CH4), dušikov oksid (N2O) i tzv. F-plinove (hidrofluorougljike, perfluorougljike, dušikov trifluorid (NF3) i sumporov heksafluorid (SF6)) iz svih sektora inventara emisija stakleničkih plinova. Procijenjene emisije iz međunarodnog zrakoplovstva i pomorskog prometa isključene su za pojedinačne zemlje. Pokazatelj je prikazan u dva oblika: kao neto emisije koje uključuju korištenje zemljišta, promjene u korištenju zemljišta i šumarstvo (LULUCF) i isključujući LULUCF. Koristeći individualni potencijal globalnog zatopljenja (GWP) svakog plina, integrirane su u jedinstveni pokazatelj izražen u jedinicama ekvivalenta CO2. Inventare emisija stakleničkih plinova države članice EU godišnje dostavljaju Okvirnoj konvenciji Ujedinjenih naroda o promjeni klime (UNFCCC).
13-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Europski klimatski zakon postavlja okvir za klimatske akcije i povećava ambicije EU-a za 2030. godinu, s novim ciljem smanjenja neto emisija stakleničkih plinova (GHG) za najmanje 55% do te godine (u usporedbi s 1990.) i postizanja klimatske neutralnosti do 2050. Europska komisija također je uvela paket novog i revidiranog zakonodavstva EU-a o klimi i energetici – takozvani paket „Fit for 55“ – kako bi povećala svoje ambicije za ublažavanje klimatskih promjena. Paket obuhvaća međusobno povezan skup mjera u područjima energije, prometa, oporezivanja i klimatskih politika te uključuje ojačano i prošireno određivanje cijena ugljika, ciljeve, standarde i mjere podrške. Također postavlja cilj za prirodne ponore ugljika od 310 milijuna tona ekvivalenta CO2.
13-10-methodology: >-
  Plan oporavka NextGenerationEU ekonomski je odgovor Unije na krizu uzrokovanu COVID-om-19. Uključuje Mehanizam za oporavak i otpornost vrijedan 672,5 milijardi eura, od čega najmanje 37% mora ići na klimatske akcije. Svaki nacionalni plan oporavka i otpornosti morat će ispuniti ovaj cilj od najmanje 37% rashoda povezanih s klimom, a sve reforme i ulaganja država članica kao dio fonda za oporavak moraju biti u skladu s načelom „ne nanositi značajnu štetu“ i stoga izbjegavati značajan negativan utjecaj na klimatske i ekološke ciljeve EU-a.
  Nova kohezijska politika EU-a (2021. – 2027.) uključuje „zeleniju Europu bez ugljika“ kao jedan od svojih pet glavnih ciljeva, koji primaju 65% do 85% dostupnih sredstava, uz cilj „pametnije Europe“.
13-10-long_term_objective: >-
  Smanjenje od 55% od nivoa iz 1990.
13-21-title: Neto emisije stakleničkih plinova u sektoru LULUCF
13-21-definition: >-
  Ovaj pokazatelj mjeri neto uklanjanje ugljika iz sektora korištenja zemljišta, promjene korištenja zemljišta i šumarstva (LULUCF), uzimajući u obzir i emisije i uklanjanje iz sektora. Podaci o LULUCF-u obuhvaćaju godišnje tokove CO2, CH4 i N2O sa svih upravljanih zemljišta u EU. Pokazatelj se izražava kao ekvivalent CO2 korištenjem potencijala globalnog zagrijavanja (GWP) svakog plina.
  Podaci o emisijama i uklanjanjima, poznati kao inventar stakleničkih plinova, godišnje se izvještavaju od strane država članica EU-a i Okvirne konvencije Ujedinjenih naroda o promjeni klime (UNFCCC). Europska agencija za okoliš (EEA) prikuplja agregirane podatke EU-a i objavljuje podatke za EU i sve države članice. Eurostat ponovno objavljuje podatke EEA-e.
13-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je uključen u prioritete Europske komisije pod nazivom "Održavanje kvalitete života: sigurnost hrane, voda i priroda". Cilj održivog razvoja 13 nastoji provesti obvezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama da se do sredine stoljeća postigne klimatski neutralan svijet kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem postizanja 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj ojačati otpornost i sposobnost prilagodbe zemalja na prirodne opasnosti povezane s klimom i rezultirajuće katastrofe.
13-21-methodology: >-
  Europski klimatski zakon postavlja okvir za djelovanje u području klime i povećava ambiciju EU-a za 2030. godinu, s novim ciljem smanjenja neto emisija stakleničkih plinova (GHG) za najmanje 55% do te godine (u usporedbi s 1990.) i postizanja klimatske neutralnosti do 2050. Europska komisija također je uvela paket novog i revidiranog zakonodavstva EU-a o klimi i energetici – takozvani paket „Fit for 55“ – kako bi povećala svoju ambiciju za ublažavanje klimatskih promjena. Paket obuhvaća međusobno povezan skup mjera u područjima energije, prometa, oporezivanja i klimatskih politika te uključuje ojačano i prošireno određivanje cijena ugljika, ciljeve, standarde i mjere potpore. Također postavlja cilj za prirodne ponore ugljika od 310 milijuna tona ekvivalenta CO2.
13-21-long_term_objective: >-
  Nema opisa
13-31-title: Prosječne emisije CO2 po km novih putničkih automobila
13-31-definition: >-
  Pokazatelj se definira kao prosječna emisija ugljičnog dioksida (CO2) po km za nove osobne automobile u određenoj godini. Prijavljene emisije temelje se na homologaciji i mogu se razlikovati od stvarnih emisija CO2 novih automobila. Pri praćenju automobila i kombija, podaci o emisijama prijavljuju se korištenjem protokola Novog europskog ciklusa vožnje (NEDC) do 2019., korištenjem protokola NEDC i Worldwide Harmonized Light Vehicle Test Procedure (WLTP) u 2020., a od 2021. samo WLTP protokol.
13-31-intention: >-
  Pokazatelji korišteni za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje te prema Cilju održivog razvoja 13 o poduzimanju hitnih mjera za borbu protiv klimatskih promjena i njihovih utjecaja. Ovi ciljevi održivog razvoja uključeni su u prioritete Europske komisije u okviru programa "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
13-31-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane poduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju temeljenu na naprednim tehnološkim mogućnostima, učinkovitosti resursa i smanjenju globalnog otpada.
  Cilj održivog razvoja 13 nastoji provesti obvezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama da se do sredine stoljeća postigne klimatski neutralan svijet kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem od 1,5°C (u usporedbi s predindustrijskim razinama). Također ima za cilj ojačati otpornost i sposobnost prilagodbe zemalja na prirodne opasnosti povezane s klimom i rezultirajuće katastrofe.
  Paket "Spremni za 55" uključuje međusobno povezani skup zakonodavstva EU o klimi i energiji, uključujući ažurirane standarde emisije CO2 za nova vozila.
13-31-long_term_objective: >-
  Nema opisa
13-40-title: Ekonomski gubici povezani s klimom
13-40-definition: >-
  Pokazatelj mjeri ekonomske gubitke uzrokovane vremenskim i klimatskim događajima. Vremenski i klimatski događaji definirani su kao meteorološki događaji (oluje, lavine), hidrološki događaji (poplave) i klimatološki događaji (toplinski valovi, hladni valovi, suše, šumski požari) na temelju klasifikacije Međunarodnog vijeća za znanost (ICSU).
  Osim godišnjih podataka, prikazan je i izglađeni vremenski niz temeljen na 30-godišnjim prosjekima. U skladu s normalnim klimatskim razdobljem kako ga je definirala Svjetska meteorološka organizacija, ovi 30-godišnji prosjeci odražavaju trendove isključujući značajnu klimatsku varijabilnost na kraćim vremenskim skalama zbog prirodnih čimbenika. Pokazatelj se temelji na podacima iz CATDAT RiskLayer.
13-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je uključen u prioritete Europske komisije pod nazivom "Održavanje kvalitete života: sigurnost hrane, voda i priroda". Cilj održivog razvoja 13 nastoji provesti obvezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama da se do sredine stoljeća postigne klimatski neutralan svijet kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem od 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj ojačati otpornost i sposobnost prilagodbe zemalja na prirodne opasnosti povezane s klimom i katastrofe koje iz njih proizlaze.
  Ovaj pokazatelj može se smatrati sličnim globalnim pokazateljima Ciljeva održivog razvoja 1.5.2 i 11.5.2 "Izravni ekonomski gubitak zbog katastrofa u odnosu na globalni BDP" (povezano s pokazateljem Sendai).
13-40-methodology: >-
  EU otpornost na katastrofe i klimatske promjene postavlja kao središnji cilj svoje humanitarne pomoći. EU-ov pokazatelj otpornosti koristi se u svim humanitarnim projektima za definiranje načina smanjenja rizika od katastrofa i jačanje sposobnosti ljudi za suočavanje s katastrofama i krizama. Akcijski plan za Sendaijski okvir za smanjenje rizika od katastrofa 2015.-2030. uključuje snažan fokus na prilagodbu klimatskim promjenama, povezujući je sa strategijama smanjenja rizika od katastrofa i njihovom koherentnom provedbom u zemljama partnerima EU-a.
  Nova Strategija prilagodbe EU-a potiče pametniju, bržu i sustavniju prilagodbu kako bi se ispunila vizija da će EU 2050. biti društvo otporno na klimatske promjene, u potpunosti prilagođeno neizbježnim utjecajima klimatskih promjena.
13-40-long_term_objective: >-
  Strategija EU-a za prilagodbu 2021; Referenca politike: CLIM039; 8. Akcijski program za okoliš; Osiguranje od klimatskih gubitaka; Ekonomski gubici; Katastrofe; Prirodne opasnosti.
13-50-title: Doprinos međunarodnoj obvezi od 100 milijardi USD za izdatke vezane uz klimu
13-50-definition: >-
  Pokazatelj mjeri ukupan iznos potrošen iz godišnjeg proračuna država članica EU-a, kao i Europske komisije i Europske investicijske banke, za doprinos međunarodnoj obvezi od 100 milijardi američkih dolara za financiranje klimatskih promjena u skladu s Okvirnom konvencijom Ujedinjenih naroda o promjeni klime (UNFCCC).
13-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Europske komisije pod nazivom „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju za Cilj održivog razvoja 13.a.1 „Iznosi osigurani i mobilizirani u američkim dolarima godišnje za tekući kolektivni cilj mobilizacije obveza od 100 milijardi američkih dolara do 2025. godine“.
13-50-methodology: >-
  Cilj održivog razvoja 13 nastoji provesti obvezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama da se do sredine stoljeća postigne klimatski neutralan svijet, s ciljem ograničavanja globalnog zagrijavanja na znatno ispod 2°C, s ciljem postizanja 1,5°C (u usporedbi s predindustrijskim razdobljem). Također ima za cilj ojačati otpornost i sposobnost prilagodbe zemalja na prirodne opasnosti povezane s klimom i rezultirajuće katastrofe.
13-50-long_term_objective: >-
13-70-title: Izdavanje zelenih obveznica
13-70-definition: >-
  Zelene obveznice su zajmovi koje investitor daje zajmoprimcu, a koriste se za financiranje projekata ili aktivnosti koje promiču ublažavanje ili prilagodbu klimatskim promjenama ili druge ekološke ciljeve. Iako se definicija zelene obveznice može razlikovati, ovaj pokazatelj uključuje obveznice koje su usklađene s četiri ključne komponente Načela zelenih obveznica Međunarodnog udruženja tržišta kapitala (ICMA) ili su certificirane od strane Inicijative za klimatske obveznice (CBI). Izdavatelji uključuju korporacije poput tvrtki ili financijskih korporacija i izdavatelje državnih obveznica koji su nacionalne vlade. Državne obveznice koje izdaju vlade uključene su samo ako imaju rok dospijeća dulji od jedne godine.
13-70-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je uključen u prioritete Europske komisije pod nazivom "Održavanje kvalitete života: sigurnost hrane, voda i priroda". Cilj održivog razvoja 13 nastoji provesti obvezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama da se do sredine stoljeća postigne klimatski neutralan svijet kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem postizanja 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj ojačati otpornost i sposobnost prilagodbe zemalja na prirodne opasnosti povezane s klimom i rezultirajuće katastrofe.
13-70-methodology: >-
  Kao dio tranzicije prema klimatskoj neutralnosti i otpornosti na klimatske promjene, EU nastoji preusmjeriti javna i privatna ulaganja u područja u kojima će podržati taj cilj. Iz tog razloga, EU je usvojio Taksonomiju EU-a kao klasifikacijski sustav za održive gospodarske aktivnosti i Europski standard zelenih obveznica kao dobrovoljni „zlatni“ standard za tržište zelenih obveznica. Na razini EU-a, ublažavanje klimatskih promjena i prilagodba njima integrirani su u sve glavne programe potrošnje, a EU se također obvezao podržati međunarodne klimatske akcije.
  Ovaj pokazatelj glavni je pokazatelj za praćenje napretka prema ciljevima Osmog programa djelovanja za okoliš (8. EAP).
13-70-long_term_objective: >-
  Nema opisa
14-10-title: Zaštićena morska područja
14-10-definition: >-
  Ovaj pokazatelj mjeri opseg zaštićenih morskih područja (MPA) u morskim vodama EU. MPA su žarišta bioraznolikosti i mogu služiti raznim ciljevima, uključujući zaštitu vrsta i staništa, očuvanje i obnovu bioraznolikosti te korištenje resursa unutar definiranih ekoloških granica. MPA također mogu imati pozitivan utjecaj na susjedna područja.
14-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
  Pokazatelj se može smatrati sličnim globalnom pokazatelju Cilja održivog razvoja 14.5.1 "Pokrivenost zaštićenih područja u odnosu na morska područja".
14-10-methodology: >-
  Direktiva EU o pticama i Direktiva o staništima imaju za cilj održavanje ili obnovu povoljnog stanja očuvanosti zaštićenih staništa i vrsta te zaštitu njihovog održivog korištenja i upravljanja. Direktiva o staništima ima za cilj doprinijeti osiguravanju bioraznolikosti EU-a, uključujući morski okoliš, te navodi devet tipova morskih staništa i 16 vrsta za koje je potrebno proglašenje morskog područja, dok Direktiva o pticama navodi dodatnih 60 vrsta ptica čije očuvanje zahtijeva zaštitu morskog područja.
  Strategija EU o bioraznolikosti ima za cilj zaštititi najmanje 30% europskog kopna i mora, uključujući nacionalno određena područja i područja Natura 2000.
  Zaštićena morska područja mogu služiti raznim svrhama, uključujući zaštitu vrsta i staništa, očuvanje i obnovu bioraznolikosti te korištenje resursa unutar definiranih ekoloških granica. Specifični ciljevi upravljanja postavljeni su za sva zaštićena morska područja (MPA), koja se često sastoje od različitih zona s dopuštenom i zabranjenom upotrebom.
  EU je također uključen u rasprave na Općoj skupštini Ujedinjenih naroda o međunarodnom pravno obvezujućem sporazumu o očuvanju bioraznolikosti u područjima izvan nacionalne jurisdikcije (BBNJ).
14-10-long_term_objective: >-
  Nema opisa
14-21-title: Procijenjeni trendovi u biomasi ribljeg fonda
14-21-definition: >-
  Biomasa ribljeg fonda funkcija je bioloških karakteristika poput brojnosti i težine te može ukazivati na status ribljeg fonda kada se mjeri u odnosu na referentne vrijednosti. Ovo je pokazatelj temeljen na modelu koji se izračunava korištenjem rezultata kvantitativnih procjena fonda pojedinačnih vrsta. Prikazuje prosječnu vrijednost biomase ribljeg fonda u usporedbi s 2003. godinom. Puni vremenski niz ažurira se godišnje, ponekad uključujući nova sredstva zbog novo dostupnih kvantitativnih procjena, što može rezultirati malim razlikama od jedne godine puštanja do sljedeće.
14-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 14.4.1 "Udio ribljih stokova unutar biološki održivih razina".
14-21-methodology: >-
  Zajednička ribarstvena politika ima za cilj osigurati dugoročnu održivost sektora održavanjem reprodukcije ribljeg fonda za visoke dugoročne prinose, poboljšanjem raspodjele ribolovnih mogućnosti, očuvanjem morskih resursa i podržavanjem profitabilnosti industrije. Okvirna direktiva o morskoj strategiji zauzima sveobuhvatan i integrirani pristup zaštiti morskog okoliša i prirodnih resursa s ciljem postizanja dobrog ekološkog stanja morskih voda EU koje su ekološki raznolike, čiste, zdrave i produktivne.
14-21-long_term_objective: >-
  Nema opisa
14-30-title: Procenjeni trend pritiska ribolova
14-30-definition: >-
  Pokazatelj predstavlja modelski temeljeni prosječni ribolovni pritisak (F/Fmsy) u morskim vodama EU sjeveroistočnog Atlantika i susjednih mora (područje FAO 27) te Sredozemnog i Crnog mora (područje FAO 37) za koje trenutna ribolovna smrtnost (F) premašuje procijenjenu ribolovnu smrtnost u skladu s postizanjem maksimalnog održivog prinosa (Fmsy). Ribolovna smrtnost je mjera uginuća ili uklanjanja ribe iz populacije zbog ribolova. Ribolovna smrtnost u skladu s postizanjem maksimalnog održivog prinosa određena je dugoročnom prosječnom veličinom stoka koja omogućuje ribolov na ovoj razini. Da bi ribolov bio održiv, F ne bi trebao prelaziti Fmsy – točku u kojoj se najveći ulov može uzeti iz ribljeg stoka neograničeno vrijeme bez nanošenja štete.
14-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 14.4.1 "Udio ribljih stokova unutar biološki održivih razina".
14-30-methodology: >-
  Zajednička ribarstvena politika ima za cilj osigurati dugoročnu održivost sektora održavanjem reprodukcije ribljeg fonda za visoke dugoročne prinose, poboljšanjem raspodjele ribolovnih mogućnosti, očuvanjem morskih resursa i podržavanjem profitabilnosti industrije. Okvirna direktiva o morskoj strategiji zauzima sveobuhvatan i integrirani pristup zaštiti morskog okoliša i prirodnih resursa s ciljem postizanja dobrog ekološkog stanja morskih voda EU koje su ekološki raznolike, čiste, zdrave i produktivne.
14-30-long_term_objective: >-
  Nema opisa
14-40-title: Mjesta za kupanje s izvrsnim kvalitetom vode
14-40-definition: >-
  Pokazatelj prikazuje udio kopnenih i obalnih kupališta s izvrsnom kvalitetom vode u EU i drugim europskim zemljama. Kvaliteta vode za kupanje procjenjuje se prema standardima za mikrobiološke parametre (crijevne enterokoke i Escherichia coli). Pokazatelj se izračunava na temelju pomičnog prosjeka od najmanje 16 uzorkovanja u četiri godine kako bi se osigurala realna klasifikacija vode za kupanje.
  Direktiva o vodama za kupanje (BWD) zahtijeva od država članica da identificiraju i procijene kvalitetu svih kopnenih i morskih voda za kupanje te da klasificiraju te vode kao „loše“, „dovoljne“, „dobre“ ili „izvrsne“ ovisno o razini otkrivenih fekalnih bakterija.
14-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj te prema Cilju održivog razvoja 6 o osiguravanju dostupnosti i održivog upravljanja vodom i sanitarnim uvjetima za sve, što je ugrađeno u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
14-40-methodology: >-
  Direktiva EU o vodama za kupanje jedna je od uspješnih priča u vodnoj politici EU, usmjerena na zaštitu ljudskog zdravlja i okoliša dopunjavanjem Okvirne direktive o vodama.
14-40-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 100.
14-50-title: Globalna prosječna kiselost površinske morske vode
14-50-definition: >-
  Ovaj pokazatelj prikazuje prosječnu godišnju koncentraciju vodikovih iona u površinskoj morskoj vodi sjeveroistočnog Atlantika i susjednih mora, izraženu u nanomolima po litri (nmol/l). Povećanje koncentracije vodikovih iona odgovara smanjenju pH vrijednosti i povećanju kiselosti morske vode.
  Ovaj trend je potaknut povećanjem atmosferskog ugljikovog dioksida (CO2), što povećava unos CO2 u ocean. Copernicus Marine Service rekonstruirao je trendove u globalnoj zakiseljenosti oceana od 1985. godine.
14-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 14.3.1 „Prosječna kiselost mora (pH) izmjerena na dogovorenom skupu reprezentativnih postaja za uzorkovanje“.
14-50-methodology: >-
  Cilj održivog razvoja 14 ima za cilj zaštititi i osigurati održivo korištenje oceana. To uključuje smanjenje onečišćenja mora i utjecaja zakiseljavanja oceana, okončanje prekomjernog izlova te očuvanje morskih i obalnih područja i ekosustava. Cilj održivog razvoja 14 ima snažnu međuovisnost s nizom drugih ciljeva održivog razvoja, budući da oceani održavaju obalna gospodarstva i izvore prihoda, doprinose proizvodnji hrane i funkcioniraju kao ponor ugljika. Prepoznajući ograničenja u rješavanju upravljanja oceanima na razini država članica ili na europskoj razini, EU radi na osiguravanju jačeg sustava upravljanja oceanima kako bi se postiglo očuvanje i održivo korištenje regionalnih i međunarodnih voda. EU također ima niz strategija usmjerenih na ublažavanje klimatskih promjena i smanjenje emisija stakleničkih plinova, uključujući CO2.
14-50-long_term_objective: >-
  Nema opisa
14-60-title: Morske vode pogođene eutrofikacijom
14-60-definition: >-
  Pokazatelj prikazuje udio eutrofnih morskih voda u isključivom gospodarskom pojasu (IEZ). Područje se klasificira kao eutrofno ako su u više od 25% dana promatranja u određenoj godini koncentracije klorofila a, kao zamjene za eutrofikaciju, iznad 90. percentila referentne početne vrijednosti iz razdoblja 1998. – 2017.
  Eutrofikacija je proces kojim višak hranjivih tvari – uglavnom fosfora i dušika – dovodi do povećanog rasta biljnog materijala, posebno cvjetanja algi, u vodenom tijelu, što rezultira smanjenjem kvalitete vode. To pak može uzrokovati smrt vodenih organizama zbog hipoksije. Antropogene aktivnosti, poput poljoprivrede, akvakulture, industrije i kanalizacije, glavni su izvori unosa hranjivih tvari u problematična područja.
14-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 14 o očuvanju i održivom korištenju oceana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Europske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 14.1.1: (a) „Indeks eutrofikacije obale“.
14-60-methodology: >-
  Cilj održivog razvoja 14 ima za cilj očuvanje i održivo korištenje oceana, mora i morskih resursa, što zahtijeva, između ostalog, sprječavanje i smanjenje onečišćenja mora i utjecaja zakiseljavanja oceana.
  Okvirna direktiva o morskoj strategiji (MSFD) zahtijeva od država članica da izvještavaju o eutrofikaciji za svoja regionalna mora svakih 6 godina.
14-60-long_term_objective: >-
  Nema opisa
15-11-title: Šumska površina
15-11-definition: >-
 Pokazatelj mjeri udio šumskih površina u usporedbi s ukupnom površinom zemlje. Podaci korišteni za ovaj pokazatelj potječu iz Europskih šumskih računa (EFA) i u skladu su s FAO definicijom šuma.
15-11-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta, koji je ugrađen u prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“. Pokazatelj se može smatrati identičnim globalnom pokazatelju cilja održivog razvoja 15.1.1 „Šumska površina kao udio ukupne površine kopna“.
15-11-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promicati očuvanje i održivo korištenje kopnenih, kopnenih i planinskih ekosustava. To uključuje napore za održivo gospodarenje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka bioraznolikosti i zaštitu ugroženih vrsta.
15-11-long_term_objective: >-
  Strategija Europske komisije za šume do 2030. godine fokusira se na sadnju najmanje 3 milijarde dodatnih stabala do 2030. godine.
15-20-title: Kopnena zaštićena područja
15-20-definition: >-
  Ovaj pokazatelj mjeri opseg i udio kopnenih zaštićenih područja, koja uključuju nacionalno određena zaštićena područja i područja Natura 2000. Nacionalno određeno područje je područje zaštićeno nacionalnim zakonodavstvom.
  Područja Natura 2000 određena su radi zaštite europskih vrsta i staništa, kako je navedeno u direktivama EU o staništima i pticama.
15-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta, koji je uključen u Prioritete Europske komisije u okviru 'Održavanja kvalitete života: sigurnost hrane, voda i priroda'.
  Pokazatelj se može smatrati sličnim globalnim pokazateljima Ciljeva održivog razvoja 15.1.2 "Udio važnih lokacija za kopnenu i slatkovodnu bioraznolikost koje su pokrivene zaštićenim područjima, prema vrsti ekosustava" i 15.4.1 "Pokrivenost važnih lokacija za planinsku bioraznolikost zaštićenim područjima".
15-20-methodology: >-
  Direktiva EU o pticama i Direktiva o staništima imaju za cilj održavanje ili obnovu povoljnog stanja zaštićenih staništa i vrsta te zaštitu njihovog održivog korištenja i upravljanja. Direktiva o pticama štiti sve vrste divljih ptica i njihova staništa. Direktiva o staništima štiti više od 1300 drugih rijetkih, ugroženih ili endemskih vrsta divljih životinja i biljaka te 233 vrste prirodnih staništa. Osim toga, mreža zaštićenih područja Natura 2000 uključuje područja koja su države članice EU odredile u skladu s Direktivama o pticama i Direktivom o staništima.
15-20-long_term_objective: >-
  Strategija EU-a za biološku raznolikost ima za cilj zaštititi najmanje 30 % europskog kopna i mora, uključujući nacionalno određena područja i područja Natura 2000.
15-42-title: Utjecaj suše na ekosustave
15-42-definition: >-
  Ovaj pokazatelj prikazuje područje pogođeno sušom praćenjem negativnih anomalija u produktivnosti vegetacije u područjima s jakim deficitom vlage u tlu tijekom vegetacijske sezone (više od jedne standardne devijacije od dugogodišnjeg prosjeka - promatrano putem podataka daljinskog istraživanja u rezoluciji od 500 × 500 metara iz Copernicus EMS Europskog opservatorija za sušu Zajedničkog istraživačkog centra Europske komisije.
  Pokazatelj obuhvaća samo poljoprivredne suše s deficitom vlage u tlu koji uzrokuje smanjenu produktivnost vegetacije zbog nedovoljne količine oborina, za razliku od hidroloških suša, koje se javljaju kada niske zalihe vode postanu očite u potocima, akumulacijama i razinama podzemnih voda, obično nakon višemjesečne meteorološke suše.
15-42-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta, koji je ugrađen u prioritete Europske komisije u okviru "Održavanja kvalitete života: sigurnost hrane, voda i priroda".
15-42-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutarnjih vodenih i planinskih ekosustava. To uključuje napore za održivo upravljanje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka bioraznolikosti i zaštitu ugroženih vrsta.
15-42-long_term_objective: >-
  Strategija za tlo 2030 postavila je cilj nulte neto eksploatacije zemljišta do 2050. godine.
15-50-title: Područje ugroženo teškom erozijom tla vodom
15-50-definition: >-
  Pokazatelj procjenjuje područje potencijalno pogođeno jakom erozijom tla vodom, poput prskanja kiše, topljenja snijega i potoka (gubitak tla > 10 tona/hektar/godina). Ovo područje izražava se u km2 i kao postotak ukupnog nerazmjestivog, erozivnog područja u zemlji. Tamo gdje nema zemljišta koje je u opasnosti od erozije tla vodom većom od 10 tona po hektaru, zemlja će imati vrijednost nula. Erozija tla i dalje se može pojaviti u područjima tih zemalja, ali brzinom manjom od 10 tona po hektaru.
  Ovi brojevi procjenjuju se korištenjem modificirane verzije Revidirane univerzalne jednadžbe gubitka tla (RUSLE 2015), koja daje procjene u rezoluciji od 100 m na temelju recenziranih ulaznih slojeva erozivnosti oborina, erodibilnosti tla, topografije, korištenja zemljišta i upravljanja. Uključene su sljedeće klase nomenklature CORINE Land Cover (CLC): Poljoprivredna područja (2), šumska i poluprirodna područja (3) isključujući plaže, dine, pješčane ravnice (3.3.1), gole stijene (3.3.2), ledenjake i trajni snijeg (3.3.5). Općenito, umjetne, pjeskovite, stjenovite i smrznute površine, kao i močvare i vodena tijela, nisu uključene.
15-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta te prema Cilju održivog razvoja 2 o iskorjenjivanju gladi, postizanju sigurnosti hrane i poboljšane prehrane te promicanju održive poljoprivrede, koji su ugrađeni u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
15-50-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutarnjih vodenih i planinskih ekosustava. To uključuje napore za održivo gospodarenje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka bioraznolikosti i zaštitu ugroženih vrsta.
  Cilj održivog razvoja 2 nastoji okončati glad i pothranjenost te osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Postizanje ovog cilja uvelike će ovisiti o promicanju održivih proizvodnih sustava i povećanju ulaganja u ruralnu infrastrukturu te poljoprivredna istraživanja i razvoj.
  Strategija za tlo do 2030. prepoznaje eroziju kao prijetnju tlu u EU. Zajednička poljoprivredna politika Europe postavlja zahtjeve za zaštitu korištenih poljoprivrednih površina od erozije i uspostavlja okvir standarda koji, između ostalog, imaju za cilj doprinijeti sprječavanju erozije tla.
15-50-long_term_objective: >-
  Nema opisa
15-60-title: Indeks ptica
15-60-definition: >-
  Pokazatelj je složeni viševrstni indeks koji mjeri relativnu brojnost odabranih uobičajenih vrsta ptica povezanih sa specifičnim staništima. Rijetke vrste su isključene. Zastupljene su tri skupine vrsta ptica: uobičajene vrste s poljoprivrednog zemljišta (39 vrsta), uobičajene šumske vrste (34 vrste) i sve uobičajene vrste ptica (168 vrsta; uključujući vrste s poljoprivrednog zemljišta i šuma).
15-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta te prema Cilju održivog razvoja 2 o iskorjenjivanju gladi, postizanju sigurnosti hrane i poboljšane prehrane te promicanju održive poljoprivrede, koji su ugrađeni u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
15-60-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutarnjih vodenih i planinskih ekosustava. To uključuje napore za održivo gospodarenje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka bioraznolikosti i zaštitu ugroženih vrsta.
  Cilj održivog razvoja 2 nastoji okončati glad i pothranjenost te osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Postizanje ovog cilja uvelike će ovisiti o promicanju održivih proizvodnih sustava i povećanju ulaganja u ruralnu infrastrukturu te poljoprivredna istraživanja i razvoj.
  Ptice i staništa ugroženih i migratornih vrsta ptica zaštićeni su Direktivom o pticama. Mnoga staništa koja koriste ptice također su zaštićena Direktivom o staništima. Strategija EU o biološkoj raznolikosti za 2030. godinu posebno navodi da bi se ove Direktive o prirodi trebale u potpunosti provesti u nastojanju da se zaustave i preokrenu trendovi gubitka bioraznolikosti.
15-60-long_term_objective: >-
  Nema opisa
15-61-title: Indeks livadskih leptira
15-61-definition: >-
  Indeks leptira travnjaka EU integrira trendove populacije 17 vrsta leptira koje se prate diljem EU i izračunava se korištenjem podataka iz svih 27 država članica EU. Početna godina nacionalnog vremenskog niza kreće se od 1990. do 2023., stoga je indeks trenutno prikazan kao agregirani podaci EU s izglađenim vrijednostima. Podatke je integrirao i osigurao Butterfly Conservation Europe, partnerstvo Europskog programa praćenja leptira, projekta EMBRACE.
15-61-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promicanju održivog korištenja zemljišta, koji je ugrađen u prioritete Europske komisije u okviru "Održavanja kvalitete života: sigurnost hrane, voda i priroda".
15-61-methodology: >-
  Strategija EU za biološku raznolikost do 2030. ima za cilj obnovu degradiranih ekosustava te zaustavljanje i preokretanje trenda smanjenja broja oprašivača. Direktiva o staništima i Direktiva o pticama igraju središnju ulogu u postizanju tih ciljeva. U lipnju 2018. Europska komisija usvojila je prvu inicijativu EU o oprašivačima, uključujući leptire. Inicijativa postavlja okvir za integrirani pristup rješavanju problema smanjenja broja oprašivača u EU i za učinkovitije korištenje postojećih alata i politika.
15-61-long_term_objective: >-
  Nema opisa
16-10-title: Standardizirana stopa smrtnosti zbog ubojstava
16-10-definition: >-
  Pokazatelj mjeri standardiziranu stopu smrtnosti od ubojstava i ozljeda koje je nanijela druga osoba s namjerom da na bilo koji način ozlijedi ili ubije, uključujući „kasne posljedice“ napada (kodovi Međunarodne klasifikacije bolesti (MKB) X85 do Y09 i Y87.1). Ne uključuje smrti uzrokovane pravnim intervencijama ili ratom (kodovi MKB Y35 i Y36).
  Podaci o uzroku smrti (UZS) odnose se na temeljni uzrok, koji je - prema Svjetskoj zdravstvenoj organizaciji (WHO) - „bolest ili ozljeda koja je pokrenula niz morbidnih događaja koji su izravno doveli do smrti ili okolnosti nesreće ili nasilja koje je uzrokovalo smrtonosnu ozljedu“. Podaci o UZS-u izvedeni su iz smrtnih listova.
16-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Europske komisije u okviru „Nove ere za europsku obranu i sigurnost“ i „Zaštite naših demokracija, održavanja naših vrijednosti“.
  Pokazatelj se može smatrati dijelom globalnog pokazatelja Cilja održivog razvoja 16.1.2 „Smrti povezane sa sukobima na 100.000 stanovnika, prema spolu, dobi i uzroku“.
16-10-methodology: >-
  Dana 24. srpnja 2020. Europska komisija usvojila je Strategiju sigurnosne unije EU-a za razdoblje 2020.-2025. Kao ključnu komponentu strategije, Komisija je definirala novi put naprijed u području unutarnje sigurnosti s djelovanjem u ključnim područjima: organizirani kriminal; terorizam i sprječavanje nasilne radikalizacije; otpornost naše kritične infrastrukture i javnih prostora; kibernetički kriminal, uključujući borbu protiv seksualnog zlostavljanja djece; suradnja u provedbi zakona i razmjena informacija; te istraživanje i inovacije.
  Sigurnost je ključni aspekt života ljudi. Nesigurnost bilo koje vrste izvor je straha i brige, što negativno utječe na kvalitetu života. Fizička nesigurnost uključuje sve vanjske čimbenike koji bi potencijalno mogli ugroziti fizički integritet pojedinca. Kaznena djela jedna su od najočitijih zlouporaba nesigurnosti. Analize fizičke nesigurnosti obično kombiniraju i subjektivne i objektivne aspekte - subjektivnu percepciju nesigurnosti i objektivni nedostatak sigurnosti mjeren statistikama kriminala. Kao takav, ovaj pokazatelj doprinosi razumijevanju sigurnosti društva.
16-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 0,3.
16-20-title: Stanovništvo koje prijavljuje kriminal, nasilje ili vandalizam u svojoj zajednici
16-20-definition: >-
  Pokazatelj prikazuje udio stanovništva koji je prijavio problem s kriminalom, nasiljem ili vandalizmom u svom lokalnom području. Ovo opisuje situaciju u kojoj ispitanik vjeruje da su kriminal, nasilje ili vandalizam u tom području problem za kućanstvo, iako ta percepcija nije nužno utemeljena na osobnom iskustvu.
16-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji su ugrađeni u prioritete Europske komisije u okviru „Nove ere za europsku obranu i sigurnost“ i „Zaštite naših demokracija, održavanja naših vrijednosti“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 16.1.4 „Udio stanovništva koji se osjeća sigurno hodajući sam u svom susjedstvu nakon mraka“.
16-20-methodology: >-
  Sigurnost je ključni aspekt u životima ljudi. Nesigurnost bilo koje vrste izvor je straha i brige, što negativno utječe na kvalitetu života. Fizička nesigurnost uključuje sve vanjske čimbenike koji potencijalno mogu ugroziti fizički integritet pojedinca. Kaznena djela jedna su od najočitijih zlouporaba nesigurnosti. Analize fizičke nesigurnosti obično kombiniraju subjektivne i objektivne aspekte - subjektivnu percepciju nesigurnosti i objektivni nedostatak sigurnosti mjeren statistikama kriminala. Ovaj pokazatelj stoga nadopunjuje pokazatelj stope ubojstava fokusirajući se na percepciju nesigurnosti.
  Strategija ProtectEU Europske komisije ima za cilj povećati kapacitet država članica EU-a za zaštitu društava i demokracija od online i offline prijetnji terorista, kriminalaca i neprijateljskih stranih aktera. Nadalje, osigurat će da se sigurnosne implikacije uzmu u obzir u svim budućim politikama EU-a.
16-20-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost 4.
16-30-title: Ukupni izdaci opće vlade za sudove
16-30-definition: >-
  Pokazatelj mjeri ukupne državne rashode za sudove prema Klasifikaciji funkcija vlade (COFOG). To uključuje rashode za administraciju, rad ili podršku građanskim i kaznenim sudovima i pravosudnom sustavu, uključujući provedbu novčanih kazni i pravnih nagodbi koje izriču sudovi te rad sustava uvjetnog otpusta i probacije; pravno zastupanje i savjetovanje u ime vlade ili u ime drugih koje vlada pruža u gotovini ili naturi. Sudovi uključuju upravne sudove, ombudsmane i slično, a isključuju zatvorske uprave.
  Pri izračunu pokazatelja po glavi stanovnika, kao nazivnik se koriste podaci o prosječnom broju stanovnika iz Nacionalnih računa (NA) referentne godine (izračunato kao aritmetička sredina broja stanovnika na dan 1. siječnja dvije uzastopne godine).
16-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 16 o miru, pravdi i snažnim institucijama, koji je ugrađen u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost" i "Zaštite naših demokracija, održavanja naših vrijednosti".
16-30-methodology: >-
  Dobro funkcioniranje pravosudnih sustava važan je strukturni uvjet na kojem države članice EU-a temelje svoje politike za održivi rast i socijalnu stabilnost. Bez obzira na model nacionalnog pravosudnog sustava ili pravnu tradiciju na kojoj se on temelji, kvaliteta, neovisnost i učinkovitost među bitnim su parametrima „učinkovitog pravosudnog sustava“. Poboljšanje učinkovitosti pravosudnih sustava u državama članicama identificirano je kao ključna komponenta strukturnih reformi u Europskom semestru, godišnjem ciklusu za koordinaciju ekonomskih politika na razini EU-a. Izvješće o vladavini prava procjenjuje stanje pravosudnih sustava država članica, a Pločica rezultata EU-a nadopunjuje je praćenjem učinkovitosti, kvalitete i neovisnosti pravosudnih sustava država članica. Kao ključni dio Pločice rezultata EU-a, ovaj pokazatelj pomaže u procjeni kvalitete pravosudnog sustava.
16-30-long_term_objective: >-
  Nema opisa
16-40-title: 'Percipirana neovisnost pravosudnog sustava: vrlo ili prilično dobra'
16-40-definition: >-
  Pokazatelj je osmišljen kako bi se istražila percepcija ispitanika o neovisnosti pravosuđa u državama članicama EU-a, s posebnim naglaskom na percipiranu neovisnost sudova i sudaca u nekoj zemlji. Podaci o percipiranoj neovisnosti pravosudnog sustava potječu iz godišnjih istraživanja Flash Eurobarometra, koja su započela 2016. godine u ime Glavne uprave za pravosuđe i potrošače Europske komisije. U ovom istraživanju od ispitanika se traži da odgovore na sljedeće pitanje: „Na temelju onoga što znate, kako biste ocijenili pravosudni sustav u (OVOJ ZEMLJI) u smislu neovisnosti sudova i sudaca? Biste li rekli da je vrlo dobar, prilično dobar, prilično loš ili vrlo loš?“
16-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 16 o miru, pravdi i snažnim institucijama, koji je ugrađen u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost" i "Zaštite naših demokracija, održavanja naših vrijednosti".
16-40-methodology: >-
  Uz dovoljna financijska sredstva, suci na sudovima moraju biti u mogućnosti donositi odluke bez uplitanja ili pritiska politike ili drugih gospodarskih aktera, kako bi se osiguralo da pojedinci i poduzeća mogu u potpunosti uživati svoja prava. Poštovanje vladavine prava preduvjet je za zaštitu svih temeljnih vrijednosti utkanih u Ugovore EU-a, uključujući demokraciju i temeljna prava. Poboljšanje učinkovitosti pravosudnih sustava u državama članicama utvrđeno je kao ključna komponenta strukturnih reformi u Europskom semestru. Izvješće o vladavini prava procjenjuje stanje pravosudnih sustava država članica, a Pregled stanja u pravosuđu EU-a nadopunjuje ga praćenjem učinkovitosti, kvalitete i neovisnosti pravosudnih sustava država članica.
16-40-long_term_objective: >-
  Nema opisa
16-50-title: Indeks percepcije korupcije
16-50-definition: >-
  Pokazatelj je složeni indeks temeljen na kombinaciji anketa i procjena korupcije iz 13 različitih izvora, te ocjenjuje i rangira zemlje na temelju toga koliko se javni sektor u nekoj zemlji percipira kao korumpiran, pri čemu ocjena 0 predstavlja vrlo visoku razinu korupcije, a ocjena 100 predstavlja vrlo čistu zemlju. CPI uključuje samo izvore koji daju ocjenu za skup zemalja/teritorija i koji mjere percepciju korupcije u javnom sektoru. Da bi se uključila u rangiranje, zemlja/teritorij mora biti uključen u najmanje tri izvora podataka CPI-ja. CPI objavljuje Transparency International.
16-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Europske komisije u okviru „Nove ere za europsku obranu i sigurnost“ i „Zaštite naših demokracija, održavanja naših vrijednosti“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju za Cilj održivog razvoja 16.5.2 „Udio poduzeća koja su imala barem jedan kontakt s javnim dužnosnikom i koja su platila mito javnom dužnosniku ili im je javni dužnosnik tražio mito u prethodnih 12 mjeseci“.
16-50-methodology: >-
  Korupcija uzrokuje financijsku štetu smanjenjem razine ulaganja, narušavanjem poštenog funkcioniranja unutarnjeg tržišta i iscrpljivanjem javnih financija. Također uzrokuje društvenu štetu jer organizirane kriminalne skupine koriste korupciju za počinjenje drugih teških kaznenih djela, poput trgovine drogom i ljudima. Budući da ne postoji smislen način za procjenu apsolutne razine korupcije u zemljama ili teritorijima na temelju čvrstih empirijskih podataka, prikupljanje percepcija korupcije od onih koji su u poziciji ponuditi procjene korupcije u javnom sektoru do sada je najpouzdanija metoda usporedbe relativnih razina korupcije u različitim zemljama.
16-50-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost od 88.
16-70-title: Žrtve trgovine ljudima prema spolu
16-70-definition: >-
  Pokazatelj je složeni indeks temeljen na kombinaciji anketa i procjena korupcije iz 13 različitih izvora, te ocjenjuje i rangira zemlje na temelju toga koliko se javni sektor u nekoj zemlji percipira kao korumpiran, pri čemu ocjena 0 predstavlja vrlo visoku razinu korupcije, a ocjena 100 predstavlja vrlo čistu zemlju. CPI uključuje samo izvore koji daju ocjenu za skup zemalja/teritorija i koji mjere percepciju korupcije u javnom sektoru. Da bi se uključila u rangiranje, zemlja/teritorij mora biti uključen u najmanje tri izvora podataka CPI-ja. CPI objavljuje Transparency International.
