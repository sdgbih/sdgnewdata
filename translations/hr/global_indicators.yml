  Strategija ProtectEU Europske komisije ima za cilj povećati kapacitet država članica EU-a za zaštitu društava i demokracija od online i offline prijetnji terorista, kriminalaca i neprijateljskih stranih aktera. Nadalje, osigurat će da se sigurnosne implikacije uzmu u obzir u svim budućim politikama EU-a.
16-70-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je vrijednost 0.
17-10-title: Službena razvojna pomoć kao udio u bruto nacionalnom dohotku
17-10-definition: >-
  Službena razvojna pomoć (ODA) sastoji se od bespovratnih sredstava, zajmova i ulaganja u kapital koje provodi službeni sektor s ciljem promicanja gospodarskog razvoja i blagostanja u zemljama u razvoju. Isplate bilježe stvarni međunarodni prijenos financijskih sredstava ili roba ili usluga procijenjenih po trošku donatora. ODA se ovdje prikazuje kao udio bruto nacionalnog dohotka (BND). BND po tržišnim cijenama jednak je bruto domaćem proizvodu (BDP) umanjenom za primarni dohodak koji rezidentne jedinice plaćaju nerezidentnim jedinicama, plus primarni dohodak koji rezidentne jedinice primaju od ostatka svijeta. Popis zemalja i teritorija koji ispunjavaju uvjete za ODA određuje Odbor za razvojnu pomoć OECD-a.
17-10-intention: >-
  Neto primljena službena razvojna pomoć (% BND-a) u Bosni i Hercegovini iznosila je 1,1206% u 2023. godini, prema zbirci pokazatelja razvoja Svjetske banke, prikupljenih iz službeno priznatih izvora. Izvješće objedinjuje pet stupova statističke učinkovitosti: korištenje podataka, podatkovne usluge, podatkovne proizvode, izvore podataka i podatkovnu infrastrukturu.
17-10-methodology: >-
  Europski konsenzus o razvoju iz lipnja 2017. ističe potrebu za visokim udjelom službene razvojne pomoći koja će se dodijeliti najmanje razvijenim zemljama i drugim zemljama s niskim prihodima. Stoga bi se 0,15-0,20% BND-a trebalo dodijeliti najmanje razvijenim zemljama u kratkom roku, a taj bi se iznos povećao na 0,20% do 2030. Konsenzus zauzima sveobuhvatan pristup provedbi, kombinirajući pomoć s drugim resursima, s dobrim politikama i ojačanim pristupom koherentnosti politika za razvoj.
17-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je 0,7% bruto nacionalnog dohotka (BND).
17-20-title: Financiranje EU-a zemljama u razvoju prema izvoru financiranja
17-20-definition: >-
  Pokazatelj prikazuje ukupno službeno i privatno financiranje EU-a zemljama u razvoju. Sastoji se od neto isplata službene razvojne pomoći (ODA), ostalih službenih tokova (OOF), privatnih tokova (uglavnom izravnih stranih ulaganja, FDI) i bespovratnih sredstava privatnih agencija i nevladinih organizacija.
  ODA se sastoji od bespovratnih sredstava ili koncesijskih zajmova koje odobrava službeni sektor s glavnim ciljem promicanja gospodarskog razvoja i blagostanja u zemljama primateljicama. OOF su transakcije koje se ne kvalificiraju kao ODA, bilo zato što nisu prvenstveno orijentirane na razvoj ili zato što imaju element bespovratnih sredstava manji od 25%. Privatni tokovi uključuju izravna ulaganja, obveznice, izvozne kredite i multilateralne privatne tokove.
  Bespovratna sredstva privatnih agencija i nacionalnih nevladinih organizacija sastoje se od razvojne pomoći i sredstava za pomoć, zajedno sa svim dodatnim doprinosima u naturi, uključujući, na primjer, prihode od prodaje božićnih čestitki u dobrotvorne svrhe ili posebne apele (na primjer, za pomoć u katastrofama).
17-20-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost" i "Zaštite naših demokracija, očuvanja naših vrijednosti".
17-20-methodology: >-
  Cilj 17, Službena razvojna pomoć i drugi financijski resursi, javni ili privatni, domaći ili međunarodni, bit će potrebni.
  EU primjenjuje koherentan i podržavajući pristup razvoju, gdje svi financijski tokovi prema zemljama u razvoju, uključujući pomoć, ulaganja i trgovinu, djeluju zajedno s mobilizacijom domaćih resursa i dobrim politikama kako bi se pomoglo u izgradnji kapaciteta i podršci samostalnosti u tim zemljama. Pokazatelj stoga nadopunjuje pokazatelj o razvojnoj pomoći.
17-20-long_term_objective: >-
  Nema opisa
17-31-title: Uvoz EU-a iz najmanje razvijenih zemalja
17-31-definition: >-
  Ovaj pokazatelj definiran je kao udio ukupnog uvoza izvan EU-a koji dolazi iz zemalja koje UN klasificira kao najmanje razvijene. Pokazuje u kojoj mjeri proizvodi iz tih zemalja pristupaju tržištu EU-a. Informacije za ovaj pokazatelj pružaju tvrtke s obujmom trgovine iznad određenog praga i prikupljaju se na temelju carinskih deklaracija. Države članice zatim prilagođavaju te informacije kako bi uzele u obzir utjecaj trgovine ispod tog praga.
17-31-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Europske komisije u okviru „Nove ere za europsku obranu i sigurnost“ i „Zaštite naših demokracija, očuvanja naših vrijednosti“.
  Potencijalni doprinos trgovine održivom razvoju odavno je prepoznat. EU predvodi put prema pravednijem globalnom partnerstvu sa zemljama u razvoju zauzimanjem odgovornog pristupa trgovinskoj i investicijskoj politici, na primjer kroz strategiju „Trgovina za sve“ (2015.) koja ima za cilj pomoći zemljama u razvoju da potpunije sudjeluju na globalnom tržištu. Nadalje, EU olakšava uvoz iz zemalja u razvoju odobravanjem smanjenja carina u okviru svoje Općeg sustava povlastica i pružanjem „Pomoći za trgovinu“ usmjerene na potporu trgovinskoj infrastrukturi, pomoći vezanoj uz trgovinu i razvoju privatnog sektora. Konačno, Sporazum iz Cotonoua uređuje odnose EU-a sa 79 afričkih, karipskih i pacifičkih (AKP) zemalja, s naglaskom na razvojnu suradnju, političku suradnju, kao i gospodarsku i trgovinsku suradnju.
17-31-methodology: >-
  EU je 2017. ažurirao svoju Strategiju pomoći za trgovinu kako bi odrazio značajne promjene politika na globalnoj razini - posebno Agendu 2030. - i na razini EU-a, uključujući novi Europski konsenzus o razvoju i trgovini za sve. Ažurirana strategija ima za cilj poboljšati usklađenost pomoći za trgovinu s drugim politikama i instrumentima EU-a, uključujući trgovinske sporazume EU-a i jednostrane programe preferencija. Naglasak na najmanje razvijene zemlje ključni je dio ažurirane strategije. EU je 2021. revidirao svoju trgovinsku strategiju s ciljem da odrazi svoj novi, održiviji model rasta, kao i Ciljeve održivog razvoja.
17-31-long_term_objective: >-
  Nema opisa
17-40-title: Bruto dug opće države
17-40-definition: >-
  Pokazatelj je definiran u konsolidiranoj verziji Ugovora o funkcioniranju Europske unije iz 2012. i dalje razrađen u Uredbi Vijeća (EZ) br. 479/2009, s izmjenama i dopunama, te Uredbi (EU) br. 549/2013 Europskog parlamenta i Vijeća (ESA 2010) i naknadnim zakonskim izmjenama, dopunjen daljnjim tumačenjima i smjernicama Eurostata, posebno Priručnikom o državnom deficitu i dugu kao omjeru ukupnog bruto državnog duga po nominalnoj vrijednosti na kraju godine i BDP-a po tekućim tržišnim cijenama.
  Državni dug definiran je kao ukupni konsolidirani bruto dug po nominalnoj vrijednosti na kraju godine u sljedećim kategorijama državnih obveza (kako je definirano u ESA 2010): gotovina i depoziti (AF.2), dužničke vrijednosnice (AF.3) i krediti (AF.4). Sektor opće države uključuje podsektore središnje države, državne vlade, lokalne uprave i fondova socijalnog osiguranja.
17-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost" i "Zaštite naših demokracija, održavanja naših vrijednosti".
17-40-methodology: >-
  Kako bi se pomoglo drugima da poboljšaju svoja gospodarstva, ključno je održati vlastita gospodarstva EU-a na održivom putu. Makroekonomsko upravljanje, kojemu je cilj osigurati financijsku stabilnost u EU-u, stoga je jedan od stupova doprinosa EU-a provedbi Ciljeva održivog razvoja. Javni dug stoga bi trebao biti ograničen na upravljivu razinu i ne bi trebao prelaziti 60% BDP-a, kako je utvrđeno u Ugovoru o funkcioniranju Europske unije. To čini osnovu Pakta o stabilnosti i rastu te postupka u slučaju prekomjernog deficita (EDP), koji osigurava fiskalnu održivost.
  Ambiciozna reforma okvira ekonomskog upravljanja EU-a stupila je na snagu 2024. godine, s ciljem jačanja održivosti duga država članica i promicanja održivog i uključivog rasta u svim državama članicama.
17-40-long_term_objective: >-
  Nema opisa
17-50-title: Udio poreza na okoliš u ukupnim poreznim prihodima
17-50-definition: >-
  Pokazatelj mjeri udio poreza na okoliš u ukupnim prihodima od poreza i socijalnih doprinosa. Porezi na okoliš definirani su kao porezi čija je porezna osnovica fizička jedinica (ili njezina zamjena) nečega što ima dokazan, specifičan negativan utjecaj na okoliš. Prihodi od poreza na okoliš dolaze iz četiri vrste poreza: poreza na energiju (koji doprinose oko tri četvrtine ukupnog iznosa), poreza na promet (oko jedne petine ukupnog iznosa) i poreza na onečišćenje i resurse (oko 4% ukupnog iznosa).
17-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Europske komisije u okviru "Nove ere za europsku obranu i sigurnost" i "Zaštite naših demokracija, održavanja naših vrijednosti".
17-50-methodology: >-
  U globalnom kontekstu, gdje obrasci potrošnje u jednoj regiji mogu ozbiljno utjecati na obrasce proizvodnje u drugim dijelovima svijeta, posebno je važno da cijene odražavaju stvarne troškove potrošnje i proizvodnje. Stoga bi trebale uključivati i plaćanja za štetu koju aktivnosti uzrokuju ljudskom zdravlju i okolišu. Politike EU-a, poput Europskog zelenog plana, pozivaju na prelazak s poreza na rad na poreze na energiju i okoliš kao dio „ozelenjavanja“ poreznih sustava, što znači da bi se prihodi od poreza na okoliš trebali povećati u odnosu na poreze na rad. Europski semestar prati napredak prema ciljevima postavljenim u europskim strategijama.
17-50-long_term_objective: >-
  Nema opisa
17-60-title: Pokrivenost brzim internetom, prema vrsti područja
17-60-definition: >-
  Pokazatelj mjeri udio kućanstava s fiksnim priključkom na mrežu vrlo visokog kapaciteta (VHCN). Mreža vrlo visokog kapaciteta je ili elektronička komunikacijska mreža koja se u potpunosti sastoji od optičkih vlakana barem do distribucijske točke na lokaciji usluge ili elektronička komunikacijska mreža koja je sposobna pružiti, pod normalnim uvjetima vršnog opterećenja, slične mrežne performanse u smislu dostupne nizvodne i uzvodne propusnosti, otpornosti, parametara povezanih s pogreškama te latencije i njezinih varijacija.
  Podaci se odnose i na optičko vlakno do prostorija (FTTP) i na specifikaciju sučelja za prijenos podataka putem kabela (DOCSIS) 3.1. DOCSIS omogućuje dodavanje prijenosa podataka velike propusnosti postojećim sustavima kabelske televizije.
  „Ruralna područja“ definirana su kao ona s manje od 100 ljudi po km2.
17-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj i Cilju održivog razvoja 9 o industriji, inovacijama i infrastrukturi. Ciljevi održivog razvoja 9 i 17 ugrađeni su u prioritet Europske komisije „Novo doba za europsku obranu i sigurnost“. Cilj održivog razvoja 17 također je ugrađen u prioritet Europske komisije „Zaštita naših demokracija, održavanje naših vrijednosti“. Priprema Europe za digitalno doba stoga je jedan od šest prioriteta Komisije za razdoblje 2019. – 2024. Cilj je učiniti digitalnu transformaciju funkcionalnom za ljude i poduzeća, a istovremeno pomoći u postizanju cilja klimatski neutralne Europe do 2050. Cilj održivog razvoja 17 prepoznaje važnost pristupa znanosti, tehnologiji i inovacijama za održivi razvoj. Broj pretplata na širokopojasni internet na 100 stanovnika jedan je od pokazatelja koje UN koristi za mjerenje napretka prema povezanom cilju. U svojoj Digitalnoj strategiji za 2020. godinu, Europska komisija istaknula je predanost EU-a razvoju Globalne strategije za digitalnu suradnju, koja će odražavati Ciljeve održivog razvoja.
17-60-methodology: >-
  U svojoj Komunikaciji iz 2016. pod nazivom „Povezivanje za konkurentno jedinstveno digitalno tržište – prema europskom gigabitnom društvu“, Europska komisija postavila je viziju za europsko gigabitno društvo, operacionaliziranu kroz tri cilja za 2025. EU teži gigabitnoj povezivosti za mjesta koja potiču socioekonomski razvoj, 5G pokrivenosti za sva urbana područja i sve glavne kopnene prometne rute te pristupu internetskoj povezivosti od najmanje 100 Mbps za sva europska kućanstva. Strategija „Od farme do stola“ potvrdila je ovaj cilj pozivajući na ubrzanje uvođenja brzog širokopojasnog interneta u ruralnim područjima kako bi se postigao cilj od 100% pristupa do 2025.
  U ožujku 2021. Komisija je – u svom Digitalnom kompasu 2030. – predstavila viziju i putove za digitalnu transformaciju Europe do 2030., usredotočujući se na četiri glavna područja: (1) vještine, (2) sigurna i održiva digitalna infrastruktura, (3) digitalna transformacija poduzeća i (4) digitalizacija javnih usluga.
17-60-long_term_objective: >-
  Nadovezujući se na Komunikaciju iz 2016., Digitalni kompas definira cilj da do 2030. sva europska kućanstva budu pokrivena gigabitnom mrežom, a sva naseljena područja 5G mrežom.
