1-1-1-title: Osobe u riziku od siromaštva ili socijalne isključenosti
1-1-1-definition: >-
  Ovaj pokazatelj odgovara zbroju osoba koje su: u riziku od siromaštva nakon 
  socijalnih transfera, teško materijalno i socijalno ugrožene ili žive u 
  kućanstvima s vrlo niskim intenzitetom rada. Pojedinci se broje samo jednom, 
  čak i ako je na njih utjecalo više od jednog od tih događaja. Smatra se da 
  su ljudi izloženi riziku od siromaštva ako je njihov dohodak ispod 60% 
  nacionalnog medijana ekvivalentnog raspoloživog dohotka.
1-1-1-intention: >-
  Siromaštvo i socijalna isključenost ograničavaju mogućnosti ljudi da ostvare 
  svoj puni potencijal utječući na njihovo zdravlje i obrazovne ishode. Bez 
  učinkovite socijalne zaštite, rizik od siromaštva prenosi se s generacije 
  na generaciju, stvarajući nejednakost i ometajući održivi gospodarski rast. 
  Dugoročni cilj za ovaj pokazatelj je vrijednost 0.
1-1-1-methodology: >-
  Podaci se temelje na usklađenom godišnjem istraživanju o dohotku i životnim 
  uvjetima (EU-SILC). Od 2020. godine podaci nisu izravno usporedivi s 
  prethodnim godinama zbog opsežnih metodoloških revizija i integracije u 
  mikrocenzus u skladu s Uredbom (EU) 2019/1700.
