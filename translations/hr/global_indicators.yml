1-1-1-title: Osobe u riziku od siromaštva ili socijalne isključenosti
1-1-1-definition: >-
  Ovaj pokazatelj odgovara zbroju osoba koje su: u riziku od siromaštva nakon 
  socijalnih transfera, teško materijalno i socijalno ugrožene ili žive u 
  kućanstvima s vrlo niskim intenzitetom rada. Pojedinci se broje samo jednom, 
  čak i ako je na njih utjecalo više od jednog od tih događaja. Smatra se da 
  su ljudi izloženi riziku od siromaštva ako je njihov dohodak ispod 60% 
  nacionalnog medijana ekvivalentnog raspoloživog dohotka.
1-1-1-intention: >-
  Siromaštvo i socijalna isključenost ograničavaju mogućnosti ljudi da ostvare 
  svoj puni potencijal utječući na njihovo zdravlje i obrazovne ishode. Bez 
  učinkovite socijalne zaštite, rizik od siromaštva prenosi se s generacije 
  na generaciju, stvarajući nejednakost i ometajući održivi gospodarski rast. 
  Dugoročni cilj za ovaj pokazatelj je vrijednost 0.
1-1-1-methodology: >-
  Podaci se temelje na usklađenom godišnjem istraživanju o dohotku i životnim 
  uvjetima (EU-SILC). Od 2020. godine podaci nisu izravno usporedivi s 
  prethodnim godinama zbog opsežnih metodoloških revizija i integracije u 
  mikrocenzus u skladu s Uredbom (EU) 2019/1700.
1-2-1-title: Osobe u opasnosti od monetarnog siromaštva nakon socijalnih transfera
1-2-1-definition: >-
  Omjer dohotka kvintila (S80/S20) je omjer ukupnog ekvivalentnog raspoloživog
  dohotka koji prima najbogatijih 20% stanovništva prema dohotku koji prima
  najsiromašnijih 20%. Viša vrijednost ukazuje na veću nejednakost u dohotku.
  Podaci su preuzeti iz EU ankete o dohotku i životnim uvjetima (EU-SILC).
1-2-1-intention: >-
  Nejednakost u dohotku podriva društvenu koheziju i ograničava životne
  mogućnosti onih na dnu raspodjele dohotka. Smanjenje nejednakosti preduvjet je
  za održivi i uključivi rast. Napredak znači smanjenje omjera S80/S20 tijekom
  vremena.
1-2-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Ekvivalentni raspoloživi dohodak
  je ukupni prihod kućanstva nakon poreza i odbitaka, podijeljen ekvivalentnom
  veličinom kućanstva. Anketa se provodi godišnje u svim zemljama sudionicama.
1-3-1-title: Stopa teške materijalne i socijalne deprivacije prema dobnoj grupi i spolu
1-3-1-definition: >-
  Ovaj pokazatelj mjeri udio stanovništva obuhvaćenog barem jednom naknadom
  socijalne zaštite, uključujući naknade vezane za starost, invalidnost, bolest,
  nezaposlenost, obitelj i stanovanje. Izražava se kao postotak ukupnog
  stanovništva. Podaci se temelje na EU-SILC anketi.
1-3-1-intention: >-
  Učinkoviti sustavi socijalne zaštite sprečavaju siromaštvo i smanjuju utjecaj
  ekonomskih šokova na pojedince i obitelji. Široka pokrivenost osigurava da oni
  kojima je potrebna pomoć dobiju podršku na vrijeme. Napredak znači proširenje
  učinkovite pokrivenosti na sve segmente stanovništva.
1-3-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete, koja prikuplja informacije o
  socijalnim transferima primljenim u kućanstvima. Pokazatelj obuhvaća i
  doprinsone i nedoprinosne naknade u svim kategorijama socijalne zaštite.
1-4-1-title: Osobe koje žive u kućanstvima s vrlo niskim intenzitetom rada, po dobnim skupinama
1-4-1-definition: >-
  Stopa opterećenosti troškovima stanovanja je udio stanovništva koje živi u
  kućanstvima gdje ukupni troškovi stanovanja (umanjeni za stambene naknade)
  predstavljaju više od 40% ukupnog raspoloživog dohotka kućanstva. Izražava se
  kao postotak. Podaci se temelje na EU anketi o dohotku i životnim uvjetima
  (EU-SILC).
1-4-1-intention: >-
  Previsoki troškovi stanovanja smanjuju raspoloživi dohodak za ostale životne
  nužnosti i povećavaju rizik od siromaštva i socijalne isključenosti. Praćenje
  ovog pokazatelja pomaže identificirati kućanstva pod financijskim pritiskom
  troškova stanovanja. Napredak znači smanjenje udjela osoba opterećenih
  troškovima stanovanja.
1-4-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Troškovi stanovanja uključuju
  najamninu, otplatu hipoteke, komunalne usluge i održavanje. Stambene naknade
  oduzimaju se i od troškova i od dohotka prije izračunavanja praga od 40%.
1-4-2-title: Stopa zaposlenih u riziku od siromaštva
1-4-2-definition: >-
  Stopa teške stambene deprivacije je udio stanovništva koje živi u prenaseljenim
  stanovima koji ujedno nemaju barem jedno od sljedećeg: kadu ili tuš, unutarnji
  zahod s ispiranjem, ili imaju propuštajući krov ili vlažne zidove. Izražava se
  kao postotak. Podaci se temelje na EU-SILC anketi.
1-4-2-intention: >-
  Primjereno stanovanje temeljna je ljudska potreba i ključna odrednica zdravlja
  i dobrobiti. Teška stambena deprivacija izravno negativno utječe na fizičko i
  mentalno zdravlje, obrazovne ishode i socijalnu participaciju. Napredak znači
  trajno smanjenje stope teške stambene deprivacije.
1-4-2-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Prenapučenost se procjenjuje u
  odnosu na veličinu i sastav kućanstva. Deprivacija kvalitete stanovanja
  obuhvaća strukturne probleme (propuštajući krov, vlažni zidovi) i nedostatak
  osnovnih sadržaja (kupaonica, unutarnji zahod).
1-5-1-title: Stopa prekomjernog opterećenja troškovima stanovanja prema statusu siromaštva
1-5-1-definition: >-
  Ovaj pokazatelj prati smrtne slučajeve i gospodarske gubitke pripisane
  katastrofama, uključujući prirodne hazarde poput poplava, oluja, suša i
  ekstremnih temperatura. Koristi se za procjenu otpornosti stanovništva na
  klimatske i druge katastrofalne događaje. Podaci se kompiliraju iz nacionalnih
  tijela civilne zaštite i međunarodnih baza podataka.
1-5-1-intention: >-
  Izgradnja otpornosti na katastrofe ključna je za zaštitu života, izvora
  prihoda i razvojnih dostignuća. Zemlje s učinkovitim strategijama smanjenja
  rizika od katastrofa bilježe manji broj smrtnih slučajeva i manje gospodarske
  gubitke. Napredak znači smanjenje smrtnosti i gubitaka uzrokovanih katastrofama.
1-5-1-methodology: >-
  Podaci se prikupljaju od nacionalnih tijela civilne zaštite, uz dopunu
  međunarodnim bazama podataka poput EM-DAT. Pokazatelj obuhvaća katastrofalne
  događaje koji zahtijevaju hitnu reakciju i rezultiraju ljudskim ili značajnim
  gospodarskim gubicima.
2-1-1-title: Indeks potrošačkih cijena hrane
2-1-1-definition: >-
  Indeks potrošačkih cijena hrane mjeri promjene cijena koje potrošači plaćaju
  za hranu i bezalkoholna pića tijekom vremena. Izražava se kao indeks s
  referentnim razdobljem jednakim 100. Rast cijena hrane može povećati
  prehrambenu nesigurnost, posebno u kućanstvima s nižim prihodima. Podaci se
  kompiliraju od strane Eurostata iz nacionalnih statističkih tijela.
2-1-1-intention: >-
  Stabilne i pristupačne cijene hrane ključne su za osiguranje pristupa
  adekvatnoj prehrani za sve segmente stanovništva. Nagli rast cijena hrane
  nerazmjerno pogađa kućanstva s nižim prihodima i može dovesti do prehrambene
  nesigurnosti. Praćenje ovog pokazatelja pridonosi širem cilju eliminacije gladi.
2-1-1-methodology: >-
  Podaci se temelje na harmoniziranom indeksu potrošačkih cijena (HICP),
  podindeks hrane, koji prikupljaju nacionalna statistička tijela koristeći
  standardiziranu Eurostat metodologiju. Indeks pokriva svu hranu i bezalkoholna
  pića prema COICOP klasifikaciji.
2-2-1-title: Stopa prekomjerne tjelesne mase i pretilosti u odraslih
2-2-1-definition: >-
  Ovaj pokazatelj mjeri udio odraslih osoba u dobi od 18 i više godina
  klasificiranih kao osobe s prekomjernom tjelesnom masom ili pretilih na
  temelju indeksa tjelesne mase (ITM). Prekomjerna tjelesna masa definirana je
  kao ITM ≥ 25 kg/m², a pretilost kao ITM ≥ 30 kg/m². Izražava se kao
  postotak odraslog stanovništva. Podaci se prikupljaju putem Europskog
  zdravstvenog intervjunog istraživanja (EHIS).
2-2-1-intention: >-
  Prekomjerna tjelesna masa i pretilost glavni su čimbenici rizika za nezarazne
  bolesti, uključujući kardiovaskularne bolesti, dijabetes tipa 2 i određene
  vrste raka. Rastuće stope pretilosti stvaraju značajno opterećenje
  zdravstvenim sustavima. Napredak znači stabilizaciju ili smanjenje prevalencije
  prekomjerne tjelesne mase i pretilosti.
2-2-1-methodology: >-
  Podaci se prikupljaju putem Europskog zdravstvenog intervjunog istraživanja
  (EHIS), koje se provodi otprilike svakih pet godina. ITM se izračunava iz
  samoprijavljene visine i tjelesne mase. EHIS primjenjuje harmoniziranu
  metodologiju u svim zemljama sudionicama, omogućavajući međunarodne usporedbe.
2-3-1-title: Indeks ptica poljoprivrednog zemljišta
2-3-1-definition: >-
  Indeks ptica poljoprivrednog zemljišta mjeri promjene u populaciji vrsta ptica
  vezanih za poljoprivredna staništa, koristeći 1990. godinu kao baznu (indeks =
  100). Pad populacije ptica poljoprivrednog zemljišta ukazuje na gubitak
  bioraznolikosti uzrokovan intenziviranjem poljoprivrede. Podaci se prikupljaju
  iz nacionalnih programa praćenja ptica.
2-3-1-intention: >-
  Raznolikost populacija ptica u poljoprivrednim krajolicima pokazatelj je
  ekološkog zdravlja poljoprivrednih sustava. Stabilne ili rastuće populacije
  ptica signaliziraju da poljoprivredne prakse podržavaju bioraznolikost.
  Zaustavljanje i preokret pada populacije ptica ključni su za održive
  prehrambene sustave.
2-3-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih istraživanja gniježđenja ptica i dostavljaju
  Eurostatu. Indeks agregira trendove populacija reprezentativnih vrsta ptica
  tipičnih za poljoprivredna staništa. Rezultati se zaglađuju radi uzimanja u
  obzir godišnje varijabilnosti u brojanju.
2-4-1-title: Površina pod ekološkom poljoprivredom
2-4-1-definition: >-
  Ovaj pokazatelj mjeri ukupnu poljoprivrednu površinu pod ekološkom
  poljoprivredom, uključujući i potpuno certificirano ekološko zemljište i
  zemljište u prijelaznom razdoblju. Izražava se kao postotak ukupne
  iskorištene poljoprivredne površine. Podaci se temelje na nacionalnim
  statistikama ekološke poljoprivrede koje kompilira Eurostat.
2-4-1-intention: >-
  Ekološka poljoprivreda promiče bioraznolikost, smanjuje upotrebu sintetičkih
  pesticida i gnojiva te podržava održivo upravljanje tlom i vodama. Povećanje
  udjela ekološke poljoprivredne površine važan je korak prema održivijim i
  otpornijim sustavima prehrambene proizvodnje.
2-4-1-methodology: >-
  Podaci se prikupljaju putem nacionalnih anketa o farmama i agrarnih statistika
  usklađenih s EU propisima o ekološkoj poljoprivredi. Podaci uključuju površine
  potpuno certificirane kao ekološke i površine u prijelaznom razdoblju, koje
  tipično traje dvije do tri godine.
2-5-3-title: Bruto bilans dušika na poljoprivrednom zemljištu
2-5-3-definition: >-
  Bruto bilans dušika (GNB) na poljoprivrednom zemljištu procjenjuje višak dušika
  u tlu, izračunat kao razlika između unosa dušika (mineralna gnojiva, gnoj,
  atmosferska depozicija, biološka fiksacija i biljni ostaci) i izlaza dušika
  (usjevi i požnjevena trava). Izražava se u kilogramima dušika po hektaru
  poljoprivrednog zemljišta.
2-5-3-intention: >-
  Višak dušika u poljoprivrednim tlima pridonosi zagađenju voda ispiranjem
  nitrata, emisijama stakleničkih plinova i gubitku bioraznolikosti. Smanjenje
  viška dušika ključno je za održive poljoprivredne prakse koje štite vodna
  tijela i okoliš.
2-5-3-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih agrarnih statistika o
  korištenju gnojiva, broju stoke i proizvodnji usjeva. Metodologija GNB-a slijedi
  OECD/Eurostat pristup izračunavanju bilanse hranjivih tvari i ažurira se godišnje.
2-6-0-title: Emisije stakleničkih plinova iz poljoprivrede
2-6-0-definition: >-
  Ovaj pokazatelj mjeri ukupne emisije stakleničkih plinova (GHG) iz
  poljoprivrednog sektora, izražene u milijunima tona ekvivalenta CO₂.
  Poljoprivredne emisije uključuju metan iz stoke i upravljanja gnojem, dušikov
  oksid iz tla i ugljikov dioksid iz potrošnje energije na farmama.
2-6-0-intention: >-
  Poljoprivreda značajno pridonosi ukupnim emisijama stakleničkih plinova.
  Smanjenje poljoprivrednih emisija uz održavanje prehrambene proizvodnje ključni
  je izazov za ispunjavanje klimatskih ciljeva. Napredak znači smanjenje ukupnih
  GHG emisija iz poljoprivrede bez ugrožavanja prehrambene sigurnosti.
2-6-0-methodology: >-
  Podaci se dostavljaju od strane nacionalnih tijela u okviru UN Okvirne
  konvencije o klimatskim promjenama (UNFCCC) i kompiliraju od strane Eurostata.
  Emisije se procjenjuju IPCC metodologijom i pokrivaju sve izvore poljoprivrednih
  emisija uključujući enteričnu fermentaciju, upravljanje gnojem i
  poljoprivredna tla.
3-1-1-title: Godine zdravog života pri rođenju
3-1-1-definition: >-
  Godine zdravog života (HLY) pri rođenju pokazuju broj godina koje se očekuje
  da će novorođenče živjeti u dobrom zdravlju, bez dugotrajne bolesti ili
  invalidnosti. HLY se izračunavaju kombiniranjem dobno-specifičnih stopa
  smrtnosti s dobno-specifičnim udjelima osoba koje prijavljuju dugotrajno
  ograničavajuću bolest. Pokazatelj se izražava u godinama i razlaže po spolu.
3-1-1-intention: >-
  Godine zdravog života nadilaze očekivano trajanje života mjerenjem kvalitete
  kao i duljine života. Povećanje HLY znači da ljudi ne samo dulje žive već i
  provode više godina u dobrom zdravlju. Napredak znači trajno povećanje godina
  zdravog života za muškarce i žene.
3-1-1-methodology: >-
  HLY se izračunavaju Sullivanovom metodom, kombinirajući podatke o smrtnosti s
  podacima o samoprijavljenoj invalidnosti iz EU-SILC ankete. Globalni pokazatelj
  ograničenja aktivnosti (GALI) pita ispitanike jesu li bili ograničeni u
  aktivnostima zbog zdravstvenih problema u trajanju od najmanje šest mjeseci.
3-2-1-title: Stopa smrtnosti djece mlađe od pet godina
3-2-1-definition: >-
  Stopa smrtnosti djece mlađe od pet godina je vjerojatnost da će dijete rođeno
  u određenoj godini umrijeti prije navršenih pet godina, izražena na 1.000
  živorođenih. Odražava kumulativni utjecaj čimbenika koji utječu na preživljavanje
  djece, uključujući prehranu, pristup zdravstvenoj skrbi, sanitaciju i životne
  uvjete. Podaci se kompiliraju iz nacionalnih vitalnih statistika.
3-2-1-intention: >-
  Smanjenje smrtnosti djece temeljno je mjerilo ljudskog razvoja i učinkovitosti
  zdravstvenih i socijalnih sustava. Visoke stope smrtnosti djece mlađe od pet
  godina odražavaju nedovoljan pristup zdravstvenoj skrbi i loše životne uvjete.
  Napredak znači trajno smanjenje preventabilnih smrtnih slučajeva djece mlađe
  od pet godina.
3-2-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih sustava registracije i vitalnih statistika.
  Stopa se izračunava iz dobno-specifičnih stopa smrtnosti za djecu mlađu od pet
  godina. Eurostat kompilira i validira podatke od nacionalnih statističkih tijela
  prema harmoniziranim definicijama.
3-3-1-title: Prevalencija pušenja u odraslih
3-3-1-definition: >-
  Ovaj pokazatelj mjeri udio odraslih osoba u dobi od 15 i više godina koje
  trenutno puše duhanske proizvode (uključujući cigarete, cigare i lule)
  svakodnevno ili povremeno. Izražava se kao postotak ukupnog odraslog
  stanovništva. Podaci se prikupljaju putem Europskog zdravstvenog intervjunog
  istraživanja (EHIS).
3-3-1-intention: >-
  Upotreba duhana vodeći je preventabilni uzrok smrti na globalnoj razini,
  uzrokujući rak, kardiovaskularne bolesti i kronične respiratorne bolesti.
  Smanjenje prevalencije pušenja ključni je prioritet javnog zdravlja. Napredak
  znači trajni pad udjela odraslih koji puše duhan.
3-3-1-methodology: >-
  Podaci se prikupljaju putem Europskog zdravstvenog intervjunog istraživanja
  (EHIS), koje se provodi otprilike svakih pet godina. Status pušenja je
  samoprijavljen. Istraživanje koristi standardizirani upitnik koji omogućava
  međunarodne usporedbe u svim državama članicama EU i zemljama sudionicama.
3-4-1-title: Standardizirana stopa smrtnosti od kroničnih bolesti
3-4-1-definition: >-
  Ovaj pokazatelj mjeri standardiziranu stopu smrtnosti od nezaraznih kroničnih
  bolesti, uključujući kardiovaskularne bolesti, rak, dijabetes i kronične
  respiratorne bolesti. Izražava se kao broj smrtnih slučajeva na 100.000 osoba,
  standardiziran prema Europskoj standardnoj populaciji (ESP 2013). Podaci se
  kompiliraju od strane Eurostata iz nacionalnih statistika uzroka smrti.
3-4-1-intention: >-
  Nezarazne bolesti vodeći su uzrok prijevremene smrtnosti u Europi. Smanjenje
  prijevremenih smrtnih slučajeva od kroničnih bolesti zahtijeva učinkovitu
  prevenciju, rano otkrivanje i pristup kvalitetnoj zdravstvenoj skrbi za sve.
  Napredak znači smanjenje standardizirane stope smrtnosti od tih bolesti.
3-4-1-methodology: >-
  Podaci se temelje na statistikama uzroka smrti iz nacionalnih matičnih knjiga
  umrlih. Standardizirana stopa smrtnosti eliminira utjecaj različitih dobnih
  struktura pri usporedbi populacija, koristeći Europsku standardnu populaciju
  (ESP 2013) kao referencu. Podaci se godišnje dostavljaju Eurostatu.
3-6-1-title: Stopa smrtnosti u prometnim nesrećama
3-6-1-definition: >-
  Ovaj pokazatelj mjeri broj osoba poginulih u prometnim nesrećama na milijun
  stanovnika. Osoba se klasificira kao žrtva prometne nesreće ako umre u roku od
  30 dana od nesreće kao posljedica zadobivenih ozljeda. Podaci se kompiliraju od
  strane Eurostata iz nacionalnih baza podataka o sigurnosti u prometu.
3-6-1-intention: >-
  Prometne ozljede vodeći su uzrok smrti, posebno među mladima. Smanjenje broja
  poginulih zahtijeva ulaganja u infrastrukturu, standarde sigurnosti vozila,
  upravljanje brzinom i primjenu prometnih propisa. Napredak znači značajno i
  trajno smanjenje broja prometnih smrtnih slučajeva na milijun stanovnika.
3-6-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih baza podataka o prometnim nesrećama.
  Definicija smrtnosti u roku od 30 dana standardizirana je radi harmonizacije
  brojanja u zemljama sudionicama. Podaci se godišnje dostavljaju Eurostatu i
  verificiraju u odnosu na demografske statistike.
3-7-1-title: Stopa fertiliteta adolescentica
3-7-1-definition: >-
  Stopa fertiliteta adolescentica je broj živorođenih na 1.000 žena u dobi od 15
  do 19 godina. Mjeri prevalenciju tinejdžerskih trudnoća i odražava pristup
  obrazovanju i uslugama spolnog i reproduktivnog zdravlja. Podaci se kompiliraju
  iz nacionalnih vitalnih statistika od strane Eurostata.
3-7-1-intention: >-
  Visoke stope fertiliteta adolescentica povezane su s povećanim zdravstvenim
  rizicima za majku i dijete te smanjenim obrazovnim i gospodarskim mogućnostima
  za mlade žene. Smanjenje stope fertiliteta adolescentica zahtijeva pristup
  sveobuhvatnom spolnom obrazovanju i uslugama reproduktivnog zdravlja. Napredak
  znači trajno smanjenje porođaja kod adolescentnih žena.
3-7-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih registracija rođenja i demografskih
  statistika. Stopa se izračunava dijeljenjem živorođenih ženama u dobi 15–19
  godina s ukupnom ženskom populacijom u toj dobi, pomnoženo s 1.000. Podaci se
  godišnje dostavljaju Eurostatu od strane nacionalnih statističkih tijela.
17-5-1-title: Korisnici interneta kao udio stanovništva
17-5-1-definition: >-
  Udio osoba koje su koristile internet u posljednja tri mjeseca, izražen kao postotak ukupnog stanovništva. Podaci se prikupljaju putem godišnjeg EU IKT istraživanja.
17-5-1-intention: >-
  Pristup internetu omogućava sudjelovanje u digitalnom gospodarstvu. Napredak znači rastući udio stanovništva koje koristi internet.
17-5-1-methodology: >-
  Podaci iz godišnjeg EU IKT istraživanja u kućanstvima. Objavljuju se godišnje od strane Eurostata.
17-4-1-title: Otvorenost trgovine
17-4-1-definition: >-
  Ukupan izvoz i uvoz roba i usluga kao postotak BDP-a. Pokazuje stupanj integracije u globalni trgovinski sustav.
17-4-1-intention: >-
  Otvoreni trgovinski sustavi potiču gospodarski rast. Napredak znači otvorenost u podršci ciljevima održivog razvoja.
17-4-1-methodology: >-
  Podaci iz nacionalnih računa prema ESA 2010. Pokriva robu i usluge. Objavljuju se godišnje.
17-3-1-title: Javni dug kao udio BDP-a
17-3-1-definition: >-
  Konsolidirani bruto dug opće uprave kao postotak BDP-a. Odražava fiskalnu održivost. Podaci od Eurostata iz EDP obavijesti.
17-3-1-intention: >-
  Održive javne financije ključne su za dugoročna razvojna ulaganja. Napredak znači dug u skladu s fiskalnom održivošću.
17-3-1-methodology: >-
  Podaci od Eurostata prema EDP proceduri. Objavljuju se dva puta godišnje.
17-2-1-title: Porezni prihodi kao udio BDP-a
17-2-1-definition: >-
  Ukupni porezni prihodi uključujući socijalne doprinose kao postotak BDP-a. Odražava kapacitet vlada za mobilizaciju domaćih resursa.
17-2-1-intention: >-
  Adekvatna mobilizacija domaćih resursa financira održivi razvoj. Napredak znači stabilan porezni prihod.
17-2-1-methodology: >-
  Podaci iz nacionalnih računa prema ESA 2010. Uključuje sve obvezne namete. Objavljuju se godišnje.
17-1-1-title: Službena razvojna pomoć kao udio bruto nacionalnog dohotka
17-1-1-definition: >-
  Neto službena razvojna pomoć (ODA) zemalja donatora kao postotak bruto nacionalnog dohotka. Međunarodni cilj je 0,7% BND-a. Podaci od OECD DAC-a i Eurostata.
17-1-1-intention: >-
  ODA je ključni izvor financiranja razvoja za siromašnije zemlje. Napredak znači povećanje omjera ODA/BND.
17-1-1-methodology: >-
  Podaci od OECD DAC-a. Pokriva bilateralne i multilateralne tokove. Objavljuju se godišnje.
16-5-1-title: Percipirana neovisnost pravosudnog sustava
16-5-1-definition: >-
  Udio stanovništva koji smatra sudove poštenima ili vrlo neovisnima. Odražava povjerenje javnosti u pravosudne institucije.
16-5-1-intention: >-
  Povjerenje u neovisnost pravosuđa temelj je vladavine prava. Napredak znači rastući udio građana koji percipiraju pravosuđe kao neovisno.
16-5-1-methodology: >-
  Podaci godišnjim Eurobarometrom. Objavljuju se u EU Justice Scoreboardu.
16-4-1-title: Stopa zatvorske populacije
16-4-1-definition: >-
  Broj osoba u zatvoru na 100.000 stanovnika. Odražava prakse kaznenog pravosuđa. Podaci od Eurostata iz penalnih statistika.
16-4-1-intention: >-
  Praćenje zatvorske populacije daje uvid u kazneno pravosuđe. Zatvaranje treba biti proporcionalno.
16-4-1-methodology: >-
  Podaci iz penalnih administracija. Ukupan broj u zatvoru na referentni datum. Objavljuju se godišnje.
16-3-1-title: Stanovništvo koje prijavljuje kriminal ili nasilje u susjedstvu
16-3-1-definition: >-
  Udio stanovništva koji prijavljuje iskustvo kriminala ili nasilja u svom susjedstvu. Odražava percepciju sigurnosti. Podaci iz EU-SILC.
16-3-1-intention: >-
  Osjećaj sigurnosti dimenzija je kvalitete života. Napredak znači smanjenje udjela koji prijavljuje kriminal.
16-3-1-methodology: >-
  Podaci iz EU-SILC ankete. Objavljuju se godišnje.
16-2-1-title: Indeks percepcije korupcije
16-2-1-definition: >-
  Percipirana razina korupcije u javnom sektoru, bodovana od 0 do 100. Temelji se na stručnim procjenama. Sastavlja ga Transparency International.
16-2-1-intention: >-
  Korupcija podriva javne institucije. Napredak znači poboljšanje rezultata indeksa percepcije korupcije.
16-2-1-methodology: >-
  Sastavlja se godišnje od Transparency International. Normalizirano na skali 0–100.
16-1-1-title: Stopa namjernih ubojstava
16-1-1-definition: >-
  Broj namjernih ubojstava na 100.000 stanovnika. Nezakonita smrt nanesena s namjerom. Podaci od Eurostata iz policijskih statistika.
16-1-1-intention: >-
  Stopa ubojstava pouzdan je pokazatelj nasilnog kriminala. Napredak znači trajno smanjenje stope ubojstava.
16-1-1-methodology: >-
  Podaci iz policijskih statistika prema UNODC definicijama. Objavljuju se godišnje.
15-5-1-title: Invazivne strane vrste
15-5-1-definition: >-
  Broj invazivnih stranih vrsta od interesa za EU utvrđenih u državama članicama. Vodeći su uzrok gubitka bioraznolikosti.
15-5-1-intention: >-
  Invazivne strane vrste ugrožavaju autohtonu bioraznolikost. Napredak znači ograničavanje njihovog širenja.
15-5-1-methodology: >-
  Podaci od EEA na temelju nacionalnih izvještaja prema EU uredbi o invazivnim vrstama.
15-4-1-title: Erozija tla vodom
15-4-1-definition: >-
  Stopa gubitka tla vodom u tonama po hektaru godišnje. Smanjuje produktivnost tla. Procjenjuje se RUSLE2015 modelom.
15-4-1-intention: >-
  Tlo je neobnovljivi resurs. Napredak znači smanjenje stope gubitka tla erozijom.
15-4-1-methodology: >-
  Procjenjuje se RUSLE2015 modelom od strane JRC-a. Objavljuje se od strane JRC-a i Eurostata.
15-3-1-title: Indeks uobičajenih ptica
15-3-1-definition: >-
  Indeks koji prati populacije uobičajenih ptica u Europi s 1990. kao baznom godinom (= 100). Ptice su pokazatelji zdravlja ekosustava.
15-3-1-intention: >-
  Pad populacija ptica signalizira degradaciju staništa. Napredak znači zaustavljanje pada populacija.
15-3-1-methodology: >-
  Podaci iz nacionalnih istraživanja ptica putem PECBMS sheme. Objavljuju se godišnje.
15-2-1-title: Zaštićena kopnena i slatkovodna područja
15-2-1-definition: >-
  Udio kopnenih i slatkovodnih površina zaštićenih kao postotak kopna. Uključuje Natura 2000 i nacionalno zaštićena područja.
15-2-1-intention: >-
  Zaštićena područja temelj su zaštite bioraznolikosti. Napredak znači rastući udio kopna pod zaštitom.
15-2-1-methodology: >-
  Podaci iz nacionalnih oznaka dostavljenih EEA-i. Pokriva kopnena i slatkovodna staništa. Objavljuju se godišnje.
15-1-1-title: Šumska površina kao udio ukupne površine kopna
15-1-1-definition: >-
  Površina šuma kao postotak ukupne površine kopna. Prati promjene zbog promjene namjene zemljišta.
15-1-1-intention: >-
  Šume su ključne za bioraznolikost i sekvestraciju ugljika. Napredak znači održavanje ili povećanje šumske površine.
15-1-1-methodology: >-
  Podaci iz šumarskih statistika prema JFSQ. Definicija prema FAO. Objavljuju se periodično.
14-4-1-title: Erozija obale
14-4-1-definition: >-
  Udio obalne linije izložene eroziji kao postotak procijenjene ukupne linije. Kompilira EEA satelitskim praćenjem.
14-4-1-intention: >-
  Obalna erozija ubrzava se. Napredak znači ograničavanje udjela obale izložene eroziji.
14-4-1-methodology: >-
  Podaci od EEA koristeći Copernicus praćenje i EUROSION bazu. Objavljuju se periodično.
14-3-1-title: Koncentracija klorofila-a u obalnim vodama
14-3-1-definition: >-
  Koncentracija klorofila-a u obalnim i prijelaznim vodama kao proxy za eutrofikaciju.
14-3-1-intention: >-
  Eutrofikacija degradira morske ekosustave. Napredak znači stabilne ili opadajuće koncentracije.
14-3-1-methodology: >-
  Podaci iz morskih programa praćenja i satelitskog istraživanja. Kompilira EEA.
14-2-1-title: Ribni fondovi unutar održivih razina
14-2-1-definition: >-
  Udio komercijalnih ribnih fondova u EU vodama koji se love unutar MSY, kao postotak. Podaci od ICES-a.
14-2-1-intention: >-
  Prekomjerni ribolov iscrpljuje fondove. Napredak znači rastući udio fondova unutar održivih granica.
14-2-1-methodology: >-
  Temelji se na ICES procjenama. Objavljuje se godišnje.
14-1-1-title: Morska zaštićena područja
14-1-1-definition: >-
  Udio mora u nacionalnoj jurisdikciji označenih kao MPA, kao postotak. Podaci od EEA.
14-1-1-intention: >-
  MPA štite morsku bioraznolikost. Napredak znači rastući udio mora pod zaštitom.
14-1-1-methodology: >-
  Podaci iz nacionalnih oznaka prema Natura 2000 i konvencijama. Objavljuju se godišnje.
13-4-1-title: Intenzitet emisija stakleničkih plinova energetske potrošnje
13-4-1-definition: >-
  Emisije GHG iz energetske potrošnje podijeljene s bruto potrošnjom energije u g CO₂ eq/kgoe. Odražava ugljični sadržaj energetskog miksa.
13-4-1-intention: >-
  Dekarbonizacija energetskog sustava ključna je za klimatsko djelovanje. Napredak znači smanjenje GHG intenziteta energije.
13-4-1-methodology: >-
  Kompilira Eurostat iz energetskih bilanci i inventara GHG. Objavljuje se godišnje.
13-3-1-title: Gospodarski gubici vezani uz klimu
13-3-1-definition: >-
  Gospodarski gubici od ekstremnih klimatskih događaja kao postotak BDP-a. Uključuje poplave, oluje i suše.
13-3-1-intention: >-
  Klimatske promjene povećavaju gubitke. Napredak znači ograničavanje gubitaka od klimatskih događaja.
13-3-1-methodology: >-
  Podaci iz CATDAT baze i reosiguravajućih izvora. Objavljuje se periodično.
13-2-1-title: Emisije stakleničkih plinova - energetski sektor
13-2-1-definition: >-
  Ukupne GHG emisije iz energetskog sektora u Mt CO₂ eq. Pokriva izgaranje u elektranama i energetskim industrijama.
13-2-1-intention: >-
  Energetski sektor najveći je izvor GHG emisija. Napredak znači trajno smanjenje emisija sektora.
13-2-1-methodology: >-
  Podaci od nacionalnih vlasti prema UNFCCC. Objavljuje se godišnje.
13-1-1-title: Indeks emisija stakleničkih plinova
13-1-1-definition: >-
  Ukupne nacionalne GHG emisije indeksirane na baznu godinu. Prati ukupni napredak u smanjenju emisija.
13-1-1-intention: >-
  Smanjenje ukupnih emisija središnji je cilj klimatske politike. Napredak znači opadajući trend indeksa.
13-1-1-methodology: >-
  Podaci od nacionalnih vlasti prema UNFCCC. Pokriva sve sektore. Objavljuje se godišnje.
12-5-1-title: Stopa kružnog korištenja materijala
12-5-1-definition: >-
  Udio materijala oporavljenih i vraćenih u gospodarstvo u ukupnoj upotrebi materijala. Pokazuje napredak prema kružnom gospodarstvu.
12-5-1-intention: >-
  Povećanje kružnog korištenja smanjuje ekstrakciju resursa. Napredak znači rastući postotak kružnog korištenja.
12-5-1-methodology: >-
  Izračunava se kao reciklirani materijali u inputu podijeljeni ukupnom upotrebom. Kompilira Eurostat godišnje.
12-4-1-title: Intenzitet emisija stakleničkih plinova proizvodnje
12-4-1-definition: >-
  Ukupne GHG emisije po jedinici BDP-a u kg CO₂ eq. Prati odvajanje rasta od emisija.
12-4-1-intention: >-
  Smanjenje GHG intenziteta ključno je za održivu proizvodnju. Napredak znači pad emisija po jedinici BDP-a.
12-4-1-methodology: >-
  Kompilira Eurostat iz inventara GHG i nacionalnih računa. Objavljuje se godišnje.
12-3-1-title: Stopa recikliranja komunalnog otpada
12-3-1-definition: >-
  Udio komunalnog otpada koji se reciklira kao postotak ukupno generiranog otpada. Pokriva materijalno recikliranje i kompostiranje.
12-3-1-intention: >-
  Povećanje recikliranja smanjuje odlaganje. Napredak znači rastući udio koji se reciklira.
12-3-1-methodology: >-
  Kompilira Eurostat iz nacionalnih statistika otpada. Uključuje recikliranje i kompostiranje. Objavljuje se godišnje.
12-2-1-title: Komunalni otpad generiran po stanovniku
12-2-1-definition: >-
  Ukupni komunalni otpad generiran po stanovniku godišnje u kilogramima. Uključuje kućanski otpad i slične izvore.
12-2-1-intention: >-
  Smanjenje generiranja otpada prvi je korak u hijerarhiji otpada. Napredak znači opadajući otpad po stanovniku.
12-2-1-methodology: >-
  Kompilira Eurostat iz nacionalnih statistika otpada. Objavljuje se godišnje.
12-1-1-title: Produktivnost resursa
12-1-1-definition: >-
  BDP podijeljen s domaćom potrošnjom materijala (DMC) u eurima po kilogramu. Viša vrijednost znači veći output po jedinici materijala.
12-1-1-intention: >-
  Poboljšanje produktivnosti resursa odvaja rast od potrošnje materijala. Napredak znači trajno povećanje produktivnosti.
12-1-1-methodology: >-
  Izračunava se koristeći BDP i DMC iz računa materijalnih tokova. Kompilira Eurostat godišnje.
11-5-1-title: Udio željezničkog prometa u putničkom prijevozu
11-5-1-definition: >-
  Udio željeznice u kopnenom putničkom prijevozu kao postotak putničkih kilometara. Odražava korištenje održivih alternativa privatnom autu.
11-5-1-intention: >-
  Željeznica je energetski učinkovitija od automobila. Napredak znači rastući udio željeznice u putničkom prijevozu.
11-5-1-methodology: >-
  Podaci od Eurostata iz nacionalnih statistika prometa. Mjeri se u putničkim kilometrima. Objavljuje se godišnje.
11-4-1-title: Izloženost stanovništva zagađenju zraka PM2,5
11-4-1-definition: >-
  Populacijski ponderirana godišnja izloženost PM2,5 u µg/m³. PM2,5 uzrokuje respiratorne i kardiovaskularne bolesti.
11-4-1-intention: >-
  Zagađenje zraka vodeći je okolišni uzrok smrtnosti. Napredak znači smanjenje izloženosti PM2,5.
11-4-1-methodology: >-
  Kompilira EEA iz mreža za praćenje zraka. Populacijski ponderirano. Objavljuje se godišnje.
11-3-1-title: Stopa recikliranja komunalnog otpada (urbano)
11-3-1-definition: >-
  Stopa recikliranja komunalnog otpada u urbanim područjima kao postotak generiranog otpada.
11-3-1-intention: >-
  Održivi gradovi trebaju učinkovito upravljanje otpadom. Napredak znači rastući udio urbanog otpada koji se reciklira.
11-3-1-methodology: >-
  Kompilira Eurostat iz nacionalnih statistika otpada. Uključuje recikliranje i kompostiranje. Objavljuje se godišnje.
11-2-1-title: Stopa prenapučenosti stambenog prostora
11-2-1-definition: >-
  Udio stanovništva u prenapučenim stanovima kao postotak. Odražava neadekvatne stambene uvjete, posebno u gradovima.
11-2-1-intention: >-
  Prenapučenost utječe na zdravlje i kvalitetu života. Napredak znači smanjenje udjela koji žive u prenapučenim stanovima.
11-2-1-methodology: >-
  Podaci iz EU-SILC koristeći standardizirani omjer soba i osoba. Objavljuju se godišnje.
11-1-1-title: Stanovništvo koje živi u gradovima
11-1-1-definition: >-
  Udio ukupnog stanovništva koje živi u gradovima, izražen kao postotak. Prati trendove urbanizacije.
11-1-1-intention: >-
  Gradovi su motori rasta s izazovima zagušenja i nejednakosti. Napredak zahtijeva urbanizaciju s adekvatnom infrastrukturom.
11-1-1-methodology: >-
  Kompilira se DEGURBA metodologijom. Gradovi ≥50.000 stanovnika, gustoća ≥1.500/km². Objavljuje se periodično.
10-5-1-title: Gini koeficijent ekvivalentnog raspoloživog dohotka
10-5-1-definition: >-
  Gini koeficijent mjeri nejednakost raspodjele dohotka od 0 (savršena jednakost) do 100 (maksimalna nejednakost). Podaci iz EU-SILC.
10-5-1-intention: >-
  Dohodovna nejednakost ograničava mogućnosti i socijalnu mobilnost. Napredak znači opadajući Gini koeficijent.
10-5-1-methodology: >-
  Podaci iz EU-SILC. Izračunava se iz cjelokupne raspodjele dohotka. Objavljuje se godišnje.
10-4-1-title: Podnositelji zahtjeva za azil na milijun stanovnika
10-4-1-definition: >-
  Broj osoba koje podnose zahtjev za azil na milijun stanovnika. Odražava migracijske pritiske i potrebe zaštite.
10-4-1-intention: >-
  Osiguranje zaštite dimenzija je smanjenja nejednakosti. Napredak zahtijeva humano upravljanje azilnim sustavima.
10-4-1-methodology: >-
  Podaci iz azilnih tijela prema EU azilnim propisima. Objavljuju se mjesečno i godišnje.
10-3-1-title: Udio dohotka najsiromašnijih 40% stanovništva
10-3-1-definition: >-
  Udio ukupnog ekvivalentnog raspoloživog dohotka koji prima najsiromašnijih 40% raspodjele, izražen kao postotak.
10-3-1-intention: >-
  Praćenje udjela najsiromašnijih 40% izravno mjeri uključivi rast. Napredak znači rastući udio za najsiromašnije.
10-3-1-methodology: >-
  Podaci iz EU-SILC. Kumulativni udio najsiromašnijih 40% iz raspodjele. Objavljuje se godišnje.
10-2-1-title: Relativni medijalni jaz rizika od siromaštva
10-2-1-definition: >-
  Razlika između medijanskog dohotka siromašnih i praga siromaštva, kao postotak praga. Mjeri dubinu siromaštva.
10-2-1-intention: >-
  Jaz siromaštva pokazuje koliko su siromašni ispod praga. Napredak znači smanjenje jaza.
10-2-1-methodology: >-
  Prag siromaštva 60% medijanskog dohotka. Jaz kao postotak praga. Objavljuje se godišnje.
10-1-1-title: Omjer dohotka kvintila (S80/S20)
10-1-1-definition: >-
  Omjer ukupnog ekvivalentnog dohotka najbogatijih 20% i najsiromašnijih 20%. Mjeri dohodovnu nejednakost. Podaci iz EU-SILC.
10-1-1-intention: >-
  Dohodovna nejednakost ograničava socijalnu mobilnost. Napredak znači opadajući omjer S80/S20.
10-1-1-methodology: >-
  Podaci iz EU-SILC. Dijeli ukupni dohodak gornjeg kvintila s donjim. Objavljuje se godišnje.
9-6-1-title: Udio željeznice i unutarnjih plovnih putova u teretnom prometu
9-6-1-definition: >-
  Ovaj pokazatelj mjeri udio željeznice i unutarnjih plovnih putova u ukupnom kopnenom teretnom prometu, izražen kao postotak ukupnih tona-kilometara. Podaci se kompiliraju od strane Eurostata iz nacionalnih statistika prometa.
9-6-1-intention: >-
  Prelazak teretnog prometa s cesta na željeznice i plovne putove smanjuje emisije, zagušenje i nesreće. Napredak znači povećanje udjela ovih održivih načina prijevoza u ukupnom teretnom prometu.
9-6-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih statistika prometa. Teretni promet mjeri se u tona-kilometrima. Podaci se godišnje objavljuju od strane Eurostata.
9-5-1-title: Kućanstva s pristupom širokopojasnom internetu
9-5-1-definition: >-
  Ovaj pokazatelj mjeri udio kućanstava s pristupom širokopojasnom internetu, izražen kao postotak svih kućanstava. Širokopojasni pristup uključuje fiksne i mobilne širokopojasne veze. Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a.
9-5-1-intention: >-
  Širokopojasni pristup internetu sve je neophodnije za sudjelovanje u digitalnom gospodarstvu i socijalnu uključenost. Napredak znači povećanje udjela kućanstava priključenih na širokopojasni internet.
9-5-1-methodology: >-
  Podaci se prikupljaju putem godišnjeg EU istraživanja o korištenju IKT-a u kućanstvima. Podaci se godišnje objavljuju od strane Eurostata.
9-4-1-title: Udio visokotehnološkog izvoza u ukupnom izvozu
9-4-1-definition: >-
  Ovaj pokazatelj mjeri udio visokotehnoloških proizvoda u ukupnom izvozu prerađenih dobara, izražen kao postotak. Visokotehnološki proizvodi imaju visok intenzitet istraživanja i razvoja. Podaci se kompiliraju iz statistika vanjske trgovine.
9-4-1-intention: >-
  Visok udio visokotehnološkog izvoza odražava tehnološku konkurentnost i inovativni kapacitet. Napredak znači povećanje udjela visokotehnoloških proizvoda u ukupnom izvozu.
9-4-1-methodology: >-
  Podaci se kompiliraju iz COMEXT baze podataka koristeći OECD definiciju visokotehnoloških sektora. Podaci se godišnje objavljuju od strane Eurostata.
9-3-1-title: Prijave patenata Europskom uredu za patente
9-3-1-definition: >-
  Ovaj pokazatelj mjeri broj prijava patenata podnesenih EPO-u na milijun stanovnika. Patenti štite izume i ključni su pokazatelj inovacijskih outputa. Podaci se kompiliraju iz EPO evidencija.
9-3-1-intention: >-
  Prijave patenata najšire se koriste kao proxy za inovacijski output. Napredak znači trajno povećanje prijava patenata na milijun stanovnika.
9-3-1-methodology: >-
  Podaci se kompiliraju na temelju mjesta stanovanja izumitelja iz EPO evidencija. Podaci se godišnje objavljuju od strane Eurostata.
9-2-1-title: Istraživači u ekvivalentu punog radnog vremena na milijun stanovnika
9-2-1-definition: >-
  Ovaj pokazatelj mjeri broj istraživača u FTE ekvivalentu na milijun stanovnika. Istraživači su stručnjaci koji stvaraju novo znanje, proizvode, procese i sustave. Podaci se kompiliraju iz nacionalnih I&R statistika.
9-2-1-intention: >-
  Istraživači su ključni input u inovacijski proces. Napredak znači povećanje broja istraživača na milijun stanovnika u svim sektorima gospodarstva.
9-2-1-methodology: >-
  Podaci se prikupljaju putem nacionalnih I&R anketa prema OECD Frascati priručniku. Istraživači se broje u FTE ekvivalentima. Podaci pokrivaju poslovni, vladini i visokoškolski sektor.
9-1-1-title: Rashodi za istraživanje i razvoj kao udio BDP-a
9-1-1-definition: >-
  Ovaj pokazatelj mjeri bruto domaće rashode za istraživanje i razvoj (GERD) kao postotak BDP-a. Pokriva sav kreativni i sustavni rad za povećanje znanja i razvoj novih primjena. Podaci se kompiliraju iz nacionalnih I&R anketa.
9-1-1-intention: >-
  Ulaganje u I&R ključni je pokretač inovacija, konkurentnosti i dugoročnog rasta produktivnosti. Napredak znači trajno povećanje rashoda za I&R kao udjela BDP-a.
9-1-1-methodology: >-
  Podaci se prikupljaju putem nacionalnih I&R anketa prema OECD Frascati priručniku. GERD pokriva sav I&R proveden na nacionalnom teritoriju. Podaci se godišnje objavljuju od strane Eurostata.
8-6-1-title: Smrtne nesreće na radu
8-6-1-definition: >-
  Ovaj pokazatelj mjeri broj smrtnih nesreća na radu na 100.000 zaposlenih
  osoba. Smrtna nesreća na radu definira se kao nesreća koja dovodi do smrti
  žrtve u roku od jedne godine od nesreće. Podaci se prikupljaju putem
  Europske statistike o nesrećama na radu (ESAW).
8-6-1-intention: >-
  Osiguranje sigurnih i zdravih radnih uvjeta temeljna je dimenzija dostojnog
  rada. Smrtne nesreće na radu predstavljaju preventabilni gubitak života s
  teškim posljedicama za radnike, obitelji i društvo. Napredak znači trajno
  smanjenje stope smrtnih nesreća na radu.
8-6-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata putem metodologije ESAW. Pokazatelj
  pokriva sve nesreće na radu koje rezultiraju smrću žrtve u roku od jedne
  godine. Podaci se objavljuju godišnje.
8-5-1-title: Mladi koji nisu zaposleni, ne obrazuju se niti osposobljavaju (NEET)
8-5-1-definition: >-
  NEET stopa mjeri udio mladih osoba u dobi od 15 do 29 godina koji nisu
  zaposleni, ne obrazuju se niti osposobljavaju, izražen kao postotak ukupnog
  stanovništva u toj dobnoj skupini. Identificira mlade izložene riziku
  isključivanja s tržišta rada i socijalne marginalizacije. Podaci se temelje
  na Anketi o radnoj snazi EU.
8-5-1-intention: >-
  Mladi u NEET kategoriji suočavaju se s dugoročnim rizicima po zapošljavanje,
  zarade i socijalnu integraciju. Smanjenje NEET stope zahtijeva ulaganja u
  obrazovanje, strukovno osposobljavanje i aktivne politike tržišta rada.
  Napredak znači trajno smanjenje udjela mladih izvan zaposlenja, obrazovanja
  i osposobljavanja.
8-5-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). NEET status
  kombinira informacije o statusu zaposlenosti i sudjelovanju u obrazovanju ili
  osposobljavanju u četiri tjedna prije ankete. Podaci se godišnje objavljuju.
8-4-1-title: Stopa dugotrajne nezaposlenosti
8-4-1-definition: >-
  Stopa dugotrajne nezaposlenosti je udio osoba koje su nezaposlene 12 ili više
  mjeseci, izražen kao postotak aktivne radne snage. Dugotrajna nezaposlenost
  ukazuje na strukturni problem tržišta rada povezan s erozijom vještina i
  socijalnom isključenošću. Podaci se temelje na Anketi o radnoj snazi EU.
8-4-1-intention: >-
  Dugotrajna nezaposlenost narušava vještine, smanjuje zapošljivost i povećava
  rizik od siromaštva i socijalne isključenosti. Njezino rješavanje zahtijeva
  aktivne politike tržišta rada i programe prekvalifikacije. Napredak znači
  trajno smanjenje stope dugotrajne nezaposlenosti.
8-4-1-methodology: >-
  Podaci se prikupljaju putem EU-LFS ankete. Nezaposlenost se definira prema
  ILO standardima: osobe bez posla, dostupne za rad i aktivno traže zaposlenje.
  Dugotrajno nezaposleni su oni nezaposleni 12 ili više mjeseci.
8-3-1-title: Stopa zaposlenosti
8-3-1-definition: >-
  Stopa zaposlenosti je udio osoba u dobi od 20 do 64 godine koje su zaposlene,
  izražen kao postotak ukupnog stanovništva u toj dobnoj skupini. Jedan je od
  najšire korištenih pokazatelja performansi tržišta rada. Podaci se temelje na
  Anketi o radnoj snazi EU (EU-LFS).
8-3-1-intention: >-
  Visoka stopa zaposlenosti ključna je za gospodarski prosperitet, socijalnu
  uključenost i održivost sustava socijalne zaštite. Povećanje zaposlenosti
  zahtijeva politike koje podržavaju stvaranje radnih mjesta i razvoj vještina.
  Napredak znači trajno povećanje stope zaposlenosti.
8-3-1-methodology: >-
  Podaci se prikupljaju putem EU-LFS ankete. Zaposlenost se definira prema ILO
  standardima: osobe koje su radile barem jedan sat uz naknadu ili dobit tijekom
  referentnog tjedna. Podaci se objavljuju godišnje i tromjesečno.
8-2-1-title: Bruto investicije u fiksni kapital kao udio BDP-a
8-2-1-definition: >-
  Ovaj pokazatelj mjeri bruto investicije u fiksni kapital (ulaganja u fizičku
  imovinu poput strojeva, zgrada i infrastrukture) kao postotak BDP-a. Odražava
  razinu ulaganja u gospodarstvu i kapacitet za budući rast. Podaci se
  kompiliraju od strane Eurostata iz nacionalnih računa.
8-2-1-intention: >-
  Ulaganja u fizički kapital ključni su pokretač rasta produktivnosti i
  dugoročnog gospodarskog razvoja. Primjerene razine ulaganja podržavaju
  inovacije, stvaranje radnih mjesta i poboljšanja infrastrukture. Napredak
  znači održavanje ili povećanje investicijskog udjela BDP-a.
8-2-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih računa prema Europskom sustavu računa
  (ESA 2010). Bruto investicije u fiksni kapital pokrivaju nabave fiksne imovine
  umanjene za otuđenja rezidentnih proizvođača. Podaci se objavljuju godišnje.
8-1-1-title: Realni BDP po stanovniku
8-1-1-definition: >-
  Realni BDP po stanovniku je bruto domaći proizvod po tržišnim cijenama
  podijeljen s brojem stanovnika sredinom godine, izražen u lančanim volumenima.
  Najšire je korišteni pokazatelj ekonomskog outputa i životnog standarda.
  Stope rasta odražavaju ekonomske performanse korigirane za inflaciju.
8-1-1-intention: >-
  Trajni, uključivi i održivi gospodarski rast ključan je za smanjenje
  siromaštva i poboljšanje životnog standarda. Rast realnog BDP-a po stanovniku
  odražava poboljšanja produktivnosti i ekonomske dobrobiti. Napredak znači
  pozitivna i trajna stopa rasta realnog BDP-a po stanovniku.
8-1-1-methodology: >-
  Podaci se kompiliraju iz nacionalnih računa prema ESA 2010. Realni BDP koristi
  lančane volumenske mjere za uklanjanje učinka promjena cijena. Podaci po
  stanovniku koriste procjene stanovništva sredinom godine. Objavljuju se
  godišnje od strane Eurostata.
7-6-1-title: Stanovništvo koje ne može adekvatno grijati dom
7-6-1-definition: >-
  Ovaj pokazatelj mjeri udio stanovništva koje nije u mogućnosti adekvatno
  grijati svoj dom, kao udio ukupnog stanovništva. Jedan je od ključnih
  pokazatelja energetskog siromaštva u Europi. Podaci se prikupljaju putem
  EU ankete o dohotku i životnim uvjetima (EU-SILC).
7-6-1-intention: >-
  Energetsko siromaštvo utječe na zdravlje, dobrobit i kvalitetu života,
  posebno za kućanstva s nižim prihodima. Osiguranje da si sve osobe mogu
  priuštiti grijanje doma temeljna je dimenzija pristupačne i čiste energije.
  Napredak znači trajno smanjenje udjela stanovništva koje se suočava s
  energetskim siromaštvom.
7-6-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete, koja pita ispitanike mogu li
  si priuštiti adekvatno grijanje doma. Pokazatelj se izražava kao postotak
  ukupnog stanovništva. Podaci se prikupljaju godišnje i objavljuju od strane
  Eurostata.
7-5-1-title: Ovisnost o uvozu energije
7-5-1-definition: >-
  Stopa ovisnosti o uvozu energije pokazuje u kojoj mjeri se gospodarstvo
  oslanja na uvoz energije kako bi zadovoljilo svoje energetske potrebe.
  Izračunava se kao neto uvoz energije podijeljen s bruto potrošnjom energije
  u zemlji, izražen kao postotak. Viša stopa znači veću ovisnost o uvezenoj
  energiji.
7-5-1-intention: >-
  Visoka ovisnost o uvozu energije izlaže gospodarstva riziku prekida opskrbe
  i volatilnosti cijena. Smanjenje ovisnosti kroz energetsku učinkovitost i
  razvoj obnovljivih izvora podržava energetsku sigurnost. Napredak znači
  smanjenje stope ovisnosti o uvozu energije.
7-5-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih energetskih
  statistika dostavljenih prema EU propisima. Bruto potrošnja energije u
  zemlji pokriva svu energiju potrebnu za zadovoljenje domaće potražnje.
  Neto uvoz izračunava se kao uvoz minus izvoz i promjene zaliha.
7-4-1-title: Krajnja potrošnja energije
7-4-1-definition: >-
  Krajnja potrošnja energije mjeri ukupnu energiju koju troše krajnji korisnici
  (industrija, promet, kućanstva, usluge i poljoprivreda), isključujući energiju
  koju koristi sam energetski sektor. Izražava se u milijunima tona ekvivalenta
  nafte (Mtoe). Podaci se kompiliraju od strane Eurostata iz nacionalnih
  energetskih bilanci.
7-4-1-intention: >-
  Smanjenje krajnje potrošnje energije ključno je za ispunjavanje klimatskih
  ciljeva i poboljšanje energetske sigurnosti. Poboljšanja energetske
  učinkovitosti omogućavaju gospodarski rast odvojen od potrošnje energije.
  Napredak znači trajno smanjenje krajnje potrošnje energije uz održavanje
  gospodarske aktivnosti.
7-4-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih energetskih bilanci
  izvještenih prema EU propisima. Krajnja potrošnja energije isključuje
  neenergetsku upotrebu i energiju potrošenu od strane sektora transformacije
  energije. Podaci se godišnje izvještavaju u tonama ekvivalenta nafte.
7-3-1-title: Primarna potrošnja energije
7-3-1-definition: >-
  Primarna potrošnja energije mjeri ukupnu energetsku potražnju zemlje,
  pokrivajući potrošnju svih oblika energije prije bilo kakvog procesa
  transformacije. Izražava se u milijunima tona ekvivalenta nafte (Mtoe).
  Uključuje energiju koju koristi energetski sektor, gubitke u distribuciji
  i krajnju potrošnju svih sektora.
7-3-1-intention: >-
  Smanjenje primarne potrošnje energije uz održavanje gospodarskog rasta ključno
  je za poboljšanje energetske učinkovitosti i ispunjavanje klimatskih ciljeva.
  Odvajanje gospodarskog rasta od potrošnje energije centralni je aspekt
  održivog razvoja. Napredak znači opadajući trend primarne potrošnje energije.
7-3-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih energetskih bilanci
  dostavljenih prema EU propisima o energetskim statistikama. Primarna potrošnja
  energije izračunava se metodom supstitucije za nuklearnu i obnovljivu
  električnu energiju. Podaci se objavljuju godišnje.
7-2-1-title: Udio obnovljivih izvora energije u bruto krajnjoj potrošnji energije
7-2-1-definition: >-
  Ovaj pokazatelj mjeri udio energije iz obnovljivih izvora (vjetar, sunce,
  hidroenergija, geotermalna, oceanska, biomasa i biogoriva) u bruto krajnjoj
  potrošnji energije, izražen kao postotak. Pokriva obnovljivu energiju
  korištenu u elektrici, grijanju i hlađenju te prometu. Podaci se kompiliraju
  od strane Eurostata iz nacionalnih energetskih statistika.
7-2-1-intention: >-
  Povećanje udjela obnovljivih izvora energije ključno je za smanjenje emisija
  stakleničkih plinova iz energetskog sektora i postizanje klimatskih ciljeva.
  Obnovljivi izvori pridonose i energetskoj sigurnosti i dugoročnom smanjenju
  troškova. Napredak znači trajno povećanje udjela obnovljive energije u
  ukupnoj potrošnji.
7-2-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih energetskih statistika
  izvještenih prema Direktivi o obnovljivim izvorima energije. Bruto krajnja
  potrošnja energije uključuje energiju isporučenu krajnjim korisnicima plus
  gubitke u elektroenergetskoj mreži i distributivnim mrežama toplinarstava.
7-1-1-title: Energetska produktivnost
7-1-1-definition: >-
  Energetska produktivnost mjeri koliko ekonomskog outputa se generira po
  jedinici potrošene energije. Izračunava se kao BDP podijeljen s bruto
  potrošnjom energije u zemlji i izražava u eurima po kilogramu ekvivalenta
  nafte (EUR/kgoe). Viša vrijednost ukazuje na učinkovitije korištenje energije
  za generiranje ekonomskog outputa.
7-1-1-intention: >-
  Poboljšanje energetske produktivnosti centralno je za odvajanje gospodarskog
  rasta od potrošnje energije i smanjenje pritisaka na okoliš. Produktivnije
  korištenje energije snižava troškove za poduzeća i kućanstva i smanjuje
  emisije. Napredak znači trajno povećanje energetske produktivnosti tijekom
  vremena.
7-1-1-methodology: >-
  Energetska produktivnost izračunava se od strane Eurostata koristeći BDP
  podatke (lančani volumeni, referentna godina 2010) i bruto potrošnju energije
  iz nacionalnih energetskih bilanci. Oba pokazatelja kompiliraju se prema EU
  propisima o energetskim statistikama. Podaci se objavljuju godišnje.
6-5-1-title: Vodna tijela s dobrim ekološkim statusom
6-5-1-definition: >-
  Ovaj pokazatelj mjeri udio površinskih vodnih tijela (rijeke, jezera, prijelazne
  i priobalne vode) koja postižu dobar ili visok ekološki status ili potencijal,
  kako je definirano Okvirnom direktivom o vodama EU. Izražava se kao postotak
  svih procijenjenih vodnih tijela. Podaci se izvještavaju od strane država
  članica svakih šest godina.
6-5-1-intention: >-
  Ekološki status vodnih tijela odražava cjelokupno zdravlje vodenih ekosustava
  i pritiske kojima su izloženi od ljudskih aktivnosti. Postizanje dobrog
  ekološkog statusa središnji je cilj Okvirne direktive o vodama. Napredak znači
  povećanje udjela površinskih vodnih tijela koja postižu dobar ili visok
  ekološki status.
6-5-1-methodology: >-
  Podaci se izvještavaju od strane država EU Europskoj agenciji za okoliš (EEA)
  u okviru Okvirne direktive o vodama (2000/60/EC). Ekološki status procjenjuje
  se na temelju bioloških, hidromorfoloških i fizikalno-kemijskih elemenata
  kvalitete. Ciklusi izvještavanja traju šest godina.
6-4-1-title: Koncentracija nitrata u podzemnim vodama
6-4-1-definition: >-
  Ovaj pokazatelj mjeri udio postaja za praćenje podzemnih voda gdje prosječna
  koncentracija nitrata prelazi 50 miligrama po litri (EU prag prema Direktivi
  o nitratima). Izražava se kao postotak svih praćenih postaja. Podaci se
  izvještavaju od strane država članica u okviru Direktive o nitratima.
6-4-1-intention: >-
  Zagađenje podzemnih voda nitratima, primarno iz poljoprivrednih izvora,
  predstavlja rizik za kvalitetu pitke vode i vodene ekosustave. Smanjenje
  koncentracija nitrata zahtijeva poboljšano upravljanje hranjivim tvarima u
  poljoprivredi. Napredak znači smanjenje udjela postaja koje prelaze prag od
  50 mg/l.
6-4-1-methodology: >-
  Podaci se prikupljaju od strane država članica prema Direktivi Vijeća
  91/676/EEZ o zaštiti voda od onečišćenja nitratima iz poljoprivrednih izvora
  i izvještavaju Europskoj komisiji svake četiri godine. Eurostat kompilira i
  objavljuje podatke.
6-3-1-title: Biokemijska potrošnja kisika u rijekama
6-3-1-definition: >-
  Ovaj pokazatelj mjeri biokemijsku potrošnju kisika (BPK) u rijekama, koja
  odražava količinu kisika potrošenu biološkim procesima pri razgradnji organske
  tvari u vodi. Niže vrijednosti BPK-a ukazuju na bolju kvalitetu vode. Izražava
  se u miligramima kisika po litri i temelji se na podacima s postaja za praćenje
  rijeka.
6-3-1-intention: >-
  Visoke razine organskog onečišćenja u rijekama smanjuju otopljeni kisik, štete
  vodenim organizmima i mogu učiniti vodu neupotrebljivom za ljude. Smanjenje
  BPK-a u rijekama ključno je za poboljšanje kvalitete vode i zaštitu slatkovodnih
  ekosustava. Napredak znači smanjenje prosječnih razina BPK-a na praćenim
  postajama.
6-3-1-methodology: >-
  Podaci se prikupljaju iz nacionalnih mreža za praćenje rijeka i kompiliraju
  od strane Eurostata u suradnji s Europskom agencijom za okoliš (EEA). BPK se
  mjeri na standardiziranim postajama i predstavlja kisik potrošen tijekom pet
  dana na 20°C (BPK5). Podaci se izvještavaju godišnje.
6-2-1-title: Stanovništvo priključeno na pročišćavanje otpadnih voda
6-2-1-definition: >-
  Ovaj pokazatelj mjeri udio stanovništva čije se otpadne vode prikupljaju i
  obrađuju u postrojenjima za pročišćavanje komunalnih otpadnih voda, izražen
  kao postotak. Pokriva najmanje sekundarni (biološki) tretman. Podaci se
  izvještavaju od strane država članica u okviru Direktive o komunalnim otpadnim
  vodama i kompiliraju od strane Eurostata.
6-2-1-intention: >-
  Pristup odgovarajućem pročišćavanju otpadnih voda temeljan je za zaštitu
  kvalitete vode i javnog zdravlja. Nepročišćene otpadne vode onečišćuju rijeke,
  jezera i priobalne vode. Napredak znači povećanje udjela stanovništva
  priključenog na najmanje sekundarno pročišćavanje otpadnih voda.
6-2-1-methodology: >-
  Podaci se izvještavaju od strane država članica svake dvije godine prema
  Direktivi Vijeća 91/271/EEZ o pročišćavanju komunalnih otpadnih voda.
  Pokazatelj pokriva aglomeracije koje generiraju više od 2.000 ekvivalenata
  stanovnika. Eurostat kompilira i objavljuje podatke kao postotak ukupnog
  stanovništva.
6-1-1-title: Indeks eksploatacije vode
6-1-1-definition: >-
  Indeks eksploatacije vode (WEI+) mjeri zahvaćanje slatke vode kao udio
  dostupnih obnovljivih slatkovodnih resursa (dugoročni prosječni godišnji
  obnovljivi slatkovodni resursi umanjeni za zahtjeve ekološkog protoka).
  Izražava se kao postotak. Vrijednosti iznad 20% ukazuju na vodni stres;
  iznad 40% na ozbiljan vodni stres.
6-1-1-intention: >-
  Nestašica vode sve je veća prijetnja ekosustavima, gospodarstvima i ljudskoj
  dobrobiti. Praćenje zahvaćanja slatke vode u odnosu na dostupne resurse ključno
  je za održivo upravljanje vodama. Napredak znači održavanje indeksa eksploatacije
  ispod pragova stresa kroz učinkovito korištenje vode.
6-1-1-methodology: >-
  Podaci se kompiliraju od strane Eurostata iz nacionalnih statistika o vodama
  koje izvještavaju države članice. Zahvaćanje slatke vode obuhvaća vodu zahvaćenu
  iz rijeka, jezera, akumulacija i podzemnih voda za sve namjene. Dostupni resursi
  procjenjuju se iz dugoročnih hidroloških podataka korigiranih za zahtjeve
  ekološkog protoka.
5-6-1-title: Rodna razlika u korištenju interneta
5-6-1-definition: >-
  Ovaj pokazatelj mjeri razliku između udjela muškaraca i žena u dobi od 16 do
  74 godine koji su koristili internet u posljednja tri mjeseca, izraženu u
  postotnim bodovima. Pozitivna vrijednost ukazuje na veće korištenje interneta
  od strane muškaraca. Podaci se prikupljaju putem EU istraživanja o korištenju
  IKT-a u kućanstvima i od strane pojedinaca.
5-6-1-intention: >-
  Digitalni rodni jaz odražava šire nejednakosti u pristupu tehnologiji,
  informacijama i ekonomskim prilikama. Zatvaranje jaza zahtijeva ciljane
  politike za poboljšanje digitalnog pristupa, vještina i samopouzdanja žena.
  Napredak znači smanjenje razlike između stopa korištenja interneta muškaraca
  i žena.
5-6-1-methodology: >-
  Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a u kućanstvima
  i od strane pojedinaca, koje se provodi godišnje. Korištenje interneta odnosi
  se na bilo kakvu upotrebu interneta u tri mjeseca prije ankete. Rodna razlika
  izračunava se kao razlika između stopa korištenja interneta muškaraca i žena,
  izražena u postotnim bodovima.
5-5-1-title: Mjesta koja zauzimaju žene u nacionalnim parlamentima
5-5-1-definition: >-
  Ovaj pokazatelj mjeri udio mjesta koja zauzimaju žene u nacionalnim
  parlamentima (jednodomnim ili donjim domovima), izražen kao postotak svih
  popunjenih mjesta. Podaci se dobivaju od Međuparlamentarne unije (IPU) i
  kompiliraju od strane Eurostata.
5-5-1-intention: >-
  Ravnopravno sudjelovanje žena i muškaraca u političkom odlučivanju temeljni je
  aspekt ravnopravnosti spolova i demokratskog upravljanja. Povećanje
  zastupljenosti žena u parlamentu osigurava da se perspektive i interesi žena
  odražavaju u zakonodavstvu i politikama. Napredak znači povećanje udjela
  parlamentarnih mjesta koja zauzimaju žene.
5-5-1-methodology: >-
  Podaci se dobivaju od Međuparlamentarne unije (IPU) i odnose se na stanje na
  1. siječnja svake godine. Pokazatelj pokriva jednodomne parlamente i donje
  domove dvodomnih parlamenata. Podaci se odnose na postotak žena među svim
  zastupnicima s važećim mandatom.
5-4-1-title: Žene u upravnim odborima velikih listiranih društava
5-4-1-definition: >-
  Ovaj pokazatelj mjeri udio žena među članovima upravnih odbora najvećih
  javno listiranih društava, izražen kao postotak svih članova odbora.
  Obuhvaća i izvršne i neizvršne članove odbora. Podaci se prikupljaju od
  strane Eurostata u suradnji s Europskim institutom za ravnopravnost spolova.
5-4-1-intention: >-
  Žene su i dalje nedovoljno zastupljene na višim rukovodećim pozicijama u
  korporativnom sektoru. Povećanje udjela žena u upravnim odborima promiče
  ravnopravnost spolova i povezano je s boljim upravljanjem i poslovnim
  rezultatima. Napredak znači trajno povećanje udjela žena u odborima.
5-4-1-methodology: >-
  Podaci se prikupljaju iz nacionalnih izvora od strane Eurostata u suradnji s
  Europskim institutom za ravnopravnost spolova (EIGE). Pokazatelj pokriva
  najveća javno listirana društva registrirana u svakoj zemlji. Članovi odbora
  uključuju i članove nadzornih i upravljačkih odbora.
5-3-1-title: Jaz u mirovinama između spolova
5-3-1-definition: >-
  Jaz u mirovinama između spolova je razlika između prosječnih mirovina koje
  primaju muškarci i žene u dobi od 65 do 79 godina, izražena kao postotak
  prosječnih mirovina muškaraca. Odražava nakupljene nejednakosti s tržišta
  rada, uključujući razlike u stopama zaposlenosti, radnom vremenu, plaćama
  i prekidima karijere. Podaci se temelje na EU-SILC anketi.
5-3-1-intention: >-
  Jaz u mirovinama između spolova posljedica je nejednakosti u zapošljavanju i
  zaradama tijekom cijelog radnog vijeka. Zatvaranje jaza zahtijeva rješavanje
  temeljnih uzroka, uključujući prekide karijere zbog skrbi, rad s nepunim
  radnim vremenom i profesionalnu segregaciju. Napredak znači trajno smanjenje
  jaza u mirovinskim prihodima između muškaraca i žena.
5-3-1-methodology: >-
  Podaci se prikupljaju putem EU ankete o dohotku i životnim uvjetima (EU-SILC).
  Mirovinski prihodi uključuju starosne mirovine i mirovine preživjelih. Jaz u
  mirovinama između spolova izračunava se kao razlika između prosječnih
  mirovinskih prihoda muškaraca i žena, izražena kao postotak prosječnih
  mirovinskih prihoda muškaraca, za osobe u dobi od 65 do 79 godina.
5-2-1-title: Jaz u plaćama između spolova
5-2-1-definition: >-
  Nekorigirani jaz u plaćama između spolova je razlika između prosječnih bruto
  satnih zarada zaposlenih muškaraca i žena, izražena kao postotak prosječnih
  bruto satnih zarada muškaraca. Temelji se na zaposlenicima u tvrtkama s
  deset ili više zaposlenih. Podaci se prikupljaju putem Istraživanja o
  strukturi zarada (SES).
5-2-1-intention: >-
  Jaz u plaćama između spolova odražava trajne nejednakosti između muškaraca i
  žena na tržištu rada, uključujući razlike u sektorima, zanimanjima, radnom
  vremenu i prekidima karijere. Zatvaranje jaza zahtijeva rješavanje
  profesionalne segregacije i diskriminacije. Napredak znači trajno smanjenje
  jaza u plaćama između spolova.
5-2-1-methodology: >-
  Podaci se prikupljaju putem Istraživanja o strukturi zarada (SES), koje se
  provodi svake četiri godine, s godišnjim procjenama koje izrađuje Eurostat.
  Pokazatelj pokriva sve gospodarske aktivnosti osim javne uprave i temelji se
  na bruto satnim zaradama u tvrtkama s deset ili više zaposlenih.
5-1-1-title: Jaz u zaposlenosti između spolova
5-1-1-definition: >-
  Jaz u zaposlenosti između spolova je razlika između stopa zaposlenosti
  muškaraca i žena u dobi od 20 do 64 godine, izražena u postotnim bodovima.
  Pozitivna vrijednost znači da muškarci imaju višu stopu zaposlenosti od žena.
  Podaci se temelje na Anketi o radnoj snazi EU (EU-LFS).
5-1-1-intention: >-
  Jaz u zaposlenosti između spolova odražava strukturne nejednakosti na tržištu
  rada. Zatvaranje jaza zahtijeva politike koje podržavaju sudjelovanje žena u
  zapošljavanju, uključujući pristupačnu skrb za djecu, fleksibilne radne
  aranžmane i jednake mogućnosti. Napredak znači trajno smanjenje razlike između
  stopa zaposlenosti muškaraca i žena.
5-1-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Stopa
  zaposlenosti izračunava se kao postotak zaposlenih osoba u ukupnom stanovništvu
  u dobi od 20 do 64 godine. Jaz u zaposlenosti između spolova je razlika između
  stopa zaposlenosti muškaraca i žena, izražena u postotnim bodovima.
4-6-1-title: Sudjelovanje odraslih u učenju
4-6-1-definition: >-
  Ovaj pokazatelj mjeri udio odraslih u dobi od 25 do 64 godine koji su
  sudjelovali u formalnom ili neformalnom obrazovanju i osposobljavanju u
  četiri tjedna koja su prethodila anketi. Izražava se kao postotak ukupnog
  stanovništva u dobi od 25 do 64 godine. Podaci se temelje na Anketi o
  radnoj snazi EU.
4-6-1-intention: >-
  Cjeloživotno učenje ključno je za prilagodbu promjenljivom tržištu rada i
  održavanje zapošljivosti. Veće sudjelovanje odraslih u učenju smanjuje
  neusklađenost vještina i podržava socijalnu uključenost. Cilj je povećati
  udio odraslih koji se kontinuirano obrazuju tijekom svog života.
4-6-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Formalno
  obrazovanje odnosi se na obrazovanje u redovnom sustavu škola, sveučilišta
  i drugih formalnih obrazovnih institucija. Neformalno obrazovanje uključuje
  sve organizirane obrazovne aktivnosti izvan formalnog sustava.
4-5-1-title: Osobe s barem osnovnim digitalnim vještinama
4-5-1-definition: >-
  Ovaj pokazatelj mjeri udio osoba u dobi od 16 do 74 godine koje posjeduju
  barem osnovne digitalne vještine u četiri područja: informacijska i podatkovna
  pismenost, komunikacija i suradnja, rješavanje problema i stvaranje digitalnih
  sadržaja. Izražava se kao postotak ukupnog stanovništva u dobi od 16 do 74.
4-5-1-intention: >-
  Digitalne vještine sve su više neophodne za sudjelovanje na tržištu rada i
  u društvu. Osiguranje digitalno kompetentnog stanovništva podržava gospodarski
  rast, inovacije i socijalnu uključenost. Napredak znači povećanje udjela
  osoba s barem osnovnim digitalnim kompetencijama.
4-5-1-methodology: >-
  Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a u kućanstvima
  i od strane pojedinaca. Kompozitni pokazatelj digitalnih vještina temelji se
  na EU Okviru digitalnih kompetencija (DigComp) i pokriva aktivnosti obavljene
  u 3 mjeseca prije ankete.
4-4-1-title: Učenici s niskim postignućima u čitanju, matematici i prirodnim znanostima
4-4-1-definition: >-
  Ovaj pokazatelj mjeri udio 15-godišnjih učenika koji ne dostignu razinu 2
  (minimalnu razinu kompetentnosti) u čitanju, matematici i prirodnim
  znanostima, na temelju OECD Programa za međunarodnu procjenu učenika (PISA).
  Izražava se kao postotak svih procijenjenih učenika.
4-4-1-intention: >-
  Osiguranje minimalnih kompetencija pismenosti i matematike za sve mlade
  temeljno je za kvalitetno obrazovanje. Visoke stope slabih postignuća
  ograničavaju buduće mogućnosti zapošljavanja i ekonomskog sudjelovanja.
  Napredak znači smanjenje udjela učenika s niskim postignućima u sva tri
  područja.
4-4-1-methodology: >-
  Podaci potječu iz OECD PISA istraživanja koje se provodi svake tri godine
  među učenicima od 15 godina. Razina 2 kompetentnosti je osnovna razina na
  kojoj učenici počinju pokazivati kompetencije koje im omogućuju aktivno
  sudjelovanje u modernom društvu. Istraživanje pokriva čitanje, matematiku
  i prirodne znanosti.
4-3-1-title: Sudjelovanje u ranom dječjem obrazovanju
4-3-1-definition: >-
  Ovaj pokazatelj mjeri udio djece u dobi od 3 godine do početka obaveznog
  školovanja koja sudjeluju u programima ranog dječjeg obrazovanja. Izražava
  se kao postotak stanovništva u istoj dobnoj skupini. Podaci se prikupljaju
  iz nacionalnih administrativnih izvora.
4-3-1-intention: >-
  Rano dječje obrazovanje ključno je za pripremu djece za osnovnu školu i
  cjeloživotno učenje. Visoke stope sudjelovanja smanjuju nejednakosti i
  podržavaju kognitivni, emocionalni i socijalni razvoj od najranije dobi.
  Dugoročni cilj je maksimizirati sudjelovanje sve djece u kvalitetnom ranom
  obrazovanju.
4-3-1-methodology: >-
  Podatke kompilira Eurostat iz nacionalnih administrativnih izvora. Odnose
  se na djecu upisanu u programe ISCED 2011 razine 0 (rano dječje obrazovanje).
  Pokrivenost uključuje javne i privatne ustanove. Referentna populacija su
  djeca od 3 godine do početka obaveznog školovanja.
4-2-1-title: Tercijarna obrazovna razina (25–34 godine)
4-2-1-definition: >-
  Ovaj pokazatelj mjeri udio osoba u dobi od 25 do 34 godine koje su uspješno
  završile tercijarne obrazovanje (ISCED 2011 razine 5–8). Izražava se kao
  postotak ukupnog stanovništva u toj dobnoj skupini. Podaci se temelje na
  Anketi o radnoj snazi EU.
4-2-1-intention: >-
  Povećanje udjela osoba s tercijarnim obrazovanjem ključno je za razvoj
  kvalificirane radne snage sposobne za poticanje inovacija i gospodarskog
  rasta. Više razine obrazovanja povezane su s boljim izgledima za
  zapošljavanje, višim prihodima i većim građanskim sudjelovanjem. Napredak
  znači kontinuirani rast udjela mladih koji završavaju tercijarne studije.
4-2-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Tercijarne
  obrazovanje odgovara ISCED 2011 razinama 5 do 8, koje obuhvaćaju kratke
  tercijarne programe, preddiplomske studije, diplomske studije i doktorske
  programe. Dobna skupina 25–34 odabrana je jer je većina osoba u tom rasponu
  završila inicijalno obrazovanje.
4-1-1-title: Rano napuštanje obrazovanja i osposobljavanja
4-1-1-definition: >-
  Rano napuštanje obrazovanja i osposobljavanja odnosi se na osobe u dobi od
  18 do 24 godine koje su stekle najviše niže srednje obrazovanje i nisu
  uključene u daljnje obrazovanje ili osposobljavanje. Pokazatelj se izražava
  kao postotak ukupnog stanovništva u dobi od 18 do 24 godine. Podaci se
  temelje na Anketi o radnoj snazi EU.
4-1-1-intention: >-
  Smanjenje ranog napuštanja obrazovanja ključno je za osiguranje da svi
  mladi steknu znanja i vještine potrebne za zapošljavanje i aktivno
  građanstvo. Visoke stope ranog napuštanja povezane su s nižim prihodima,
  višom nezaposlenošću i većom ovisnošću o sustavima socijalne skrbi.
  Dugoročni cilj je smanjiti udio onih koji rano napuštaju školovanje.
4-1-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS), velikog
  istraživanja kućanstava koje pruža tromjesečne statistike o sudjelovanju
  na tržištu rada. Pokazatelj obuhvaća osobe od 18 do 24 godine čija je
  najviša razina obrazovanja ISCED 2011 razina 0, 1 ili 2, i koje su izjavile
  da nisu sudjelovale ni u kakvom obrazovanju ili osposobljavanju u četiri
  tjedna koja su prethodila anketi.
