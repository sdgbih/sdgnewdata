intro_title: Za mjerenje napretka u ostvarivanju Ciljeva održivog razvoja na europskoj razini (EU SDG) razvijen je skup indikatora
intro_body: <a href="https://ec.europa.eu/eurostat/web/sdi/database/">Skup indikatora</a> sastoji se od oko 100 indikatora strukturiranih prema 17 ciljeva Agende 2030, šest indikatora po svakom cilju održivosti, kako bi svi ciljevi imali istu važnost i omogućili uravnoteženo mjerenje napretka svih dimenzija održivosti. Pojedinačni indikatori, takozvani višenamjenski indikatori, također se koriste za praćenje više od jednog cilja održivog razvoja. Skup EU SDG indikatora predstavlja osnovu za godišnje izvješće Eurostata o napretku u ostvarivanju SDG-ova u kontekstu Europske unije. Ovaj portal omogućuje pregled trenutnog stanja dostupnosti i razvoja EU SDG indikatora u Bosni i Hercegovini.
