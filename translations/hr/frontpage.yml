intro_title: Ciljevi održivog razvoja na europskoj razini (EU SDG)
intro_body: '<a href="https://ec.europa.eu/eurostat/web/sdi/database/">Skup indikatora</a> sastoji se od oko 100 indikatora strukturiranih prema 17 ciljeva Agende 2030, šest indikatora po svakom cilju održivosti, kako bi svi ciljevi imali istu važnost i omogućili uravnoteženo mjerenje napretka svih dimenzija održivosti. Ovaj portal omogućuje pregled trenutnog stanja dostupnosti i razvoja EU SDG indikatora u Bosni i Hercegovini.'
