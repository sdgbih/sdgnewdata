1-10-title: Osobe u riziku od siromaštva ili socijalne isključenosti
1-10-definition: >-
  Indikator je dio skupa indikatora ciljeva održivog razvoja EU (SDG). Koristi se za praćenje napretka prema cilju održivog razvoja 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje i cilju održivog razvoja 10 o smanjenju nejednakosti unutar zemalja i među njima, koji su ugrađeni u prioritet Evropske komisije pod nazivom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Ovaj indikator odgovara zbiru ljudi koji su: u riziku od siromaštva nakon socijalnih transfera, teško materijalno i socijalno uskraćeni ili žive u domaćinstvima s vrlo niskim intenzitetom rada. Pojedinci se broje samo jednom, čak i ako su pogođeni s više od jedne od ovih pojava.

  •	Smatra se da su ljudi izloženi riziku od siromaštva nakon socijalnih transfera ako njihov ekvivalentni raspoloživi dohodak nije veći od praga rizika od siromaštva, koji je postavljen na 60% nacionalne medijane ekvivalentnog raspoloživog dohotka.

  •	Stopa teške materijalne i socijalne deprivacije je udio stanovništva koje doživljava prisilni nedostatak od najmanje 7 od 13 stavki deprivacije (6 se odnosi na pojedinca, a 7 na domaćinstvo)
1-10-intention: >-
  Siromaštvo i socijalna isključenost su štetni za živote pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal tako što utiču na njihovo zdravlje i blagostanje i smanjuju obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez efikasnog sistema obrazovanja, zdravstvene zaštite, socijalne zaštite, poreskih olakšica i zapošljavanja, rizik od siromaštva se prenosi sa jedne generacije na drugu. To uzrokuje postojanost siromaštva i time stvara još veću nejednakost, što može dovesti do dugoročnog gubitka ekonomske produktivnosti cijelih grupa društva i ometati inkluzivni i održivi ekonomski rast.
1-10-methodology: >-
  Podaci koji se koriste za ovaj indikator zasnivaju se na usaglašenom godišnjem istraživanju o prihodima i uslovima života (EU-SILC) širom Evrope. U 2020. godini istraživanja, EU-SILC je prošao opsežne metodološke revizije i integrisan je u mikrocenzus kao odgovor na sve veće zahtjeve za ažuriranim podacima i pružanje detaljnijih regionalnih rezultata. Kao rezultat ovog usklađivanja, podaci od 2020. godine nadalje nisu uporedivi sa podacima iz prethodnih godina.
  Od 2021. godine, Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-10-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost  0
1-20-title: Osobe u opasnosti od monetarnog siromaštva nakon socijalnih transfera
1-20-definition: >-
  Statistika Evropske unije o prihodima i životnim uslovima (EU-SILC) prikuplja pravovremene i uporedive multidimenzionalne mikropodatke o prihodima, siromaštvu, socijalnoj isključenosti i životnim uslovima. Statistički koncepti i definicije za EU-SILC navedeni su u Uredbi EU 2019/1700, Uredbi EU2019/2181 i Uredbi EU 2019/2242. Osnovna uredba i njeni implementacioni i delegirani akti predviđali su višestruke izmjene u prikupljanju podataka EU-SILC počevši od 2021. godine.
  Zemlje moraju slijediti Aneks II Uredbe EU  2019/2242, gdje je navedena lista varijabli, uključujući njihove modalitete, zastave, jedinicu i referentni period.
1-20-intention: >-
  Indikator osoba u riziku od siromaštva ili socijalne isključenosti (AROPE) ostaje ključan za praćenje evropskih socijalnih politika, posebno za praćenje cilja EU za 2030. godinu o siromaštvu i socijalnoj isključenosti. Za više informacija pogledajte socijalne indikatore EU.
  EU-SILC instrument pruža dvije vrste podataka:

  •	presječni podaci koji se odnose na određeno vrijeme ili određeni vremenski period sa varijablama o prihodima, siromaštvu, socijalnoj isključenosti i drugim životnim uslovima;
  longitudinalni podaci koji se odnose na promjene na individualnom nivou tokom vremena, koji se periodično posmatraju sa šemom rotacije od četiri ili više godina (Aneks III(2) Uredbe EU 2019/1700).
1-20-methodology: >-
  Ciljna populacija su privatna domaćinstva i sve osobe koje sačinjavaju ova domaćinstva koja imaju svoje uobičajeno prebivalište na nacionalnoj teritoriji. Privatno domaćinstvo je osoba koja živi sama ili grupa osoba koje žive zajedno, pružajući sebi osnovne životne potrebe.
  Koncept tačnosti se odnosi na preciznost procjena izračunatih iz uzorka, a ne iz cijele populacije. Tačnost zavisi od veličine uzorka, efekata dizajna uzorkovanja i strukture populacije koja se proučava. Pored toga, potrebno je uzeti u obzir greške u uzorkovanju i greške koje nisu u uzorkovanju. Greška uzorkovanja znači varijabilnost koja se javlja nasumično zbog upotrebe uzorka, a ne popisa, a greške koje nisu uzorkovane su greške koje se javljaju u svim fazama procesa prikupljanja i proizvodnje podataka.
  Od 2021
  Uredba EU 2019/1700 utvrđuje zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III te uredbe, karakteristike uzorkovanja, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
1-31-title: Stopa teške materijalne i socijalne uskraćenosti prema starosnoj grupi i spolu
1-31-definition: >-
  Domen „Dohodak i životni uslovi“ (EU-SILC) obuhvata sljedeće teme: osobe u riziku od siromaštva ili socijalne isključenosti, nejednakost prihoda, raspodjelu prihoda i monetarno siromaštvo, životne uslove i materijalnu deprivaciju. Obuhvata i EU-SILC ad hoc module, koji su organizovani u kolekcije indikatora o određenim temama.
  Prikupljanje EU-SILC je ključni instrument za pružanje informacija potrebnih u okviru Evropskog semestra ([1]) i Evropskog stuba socijalnih prava. Također je glavni izvor podataka za potrebe mikrosimulacije i za izradu brzih procjena distribucije prihoda i stopa siromaštva. 
  EU-SILC je 2024. godine, pored godišnjih podataka, prikupio i trogodišnji modul o zdravlju djece, pristupu zdravstvenoj zaštiti i specifičnoj deprivaciji djece i šestogodišnji modul o pristupu uslugama. Informacije prikupljene u EU-SILC odnose se na sljedeće vrste statističkih jedinica: privatna domaćinstva i osobe koje žive u tim domaćinstvima. Aneks II Regulative EU 2019/2242  definiše specifične statističke jedinice za svaku varijablu, dok Aneks IV iste Regulative precizira sadržaj izvještaja o kvalitetu organizacije uzorka istraživanja u domenu prihoda i uslova života, u skladu sa Regulativom EU 2019/1700  Evropskog parlamenta i Vijeća.
1-31-intention: >-
  Zajednički okvir EU-SILC ima za cilj da osigura standardizaciju na različitim nivoima. Konceptualna standardizacija se postiže definisanjem i dokumentovanjem zajedničkih koncepata/definicija na kojima se zasniva svaka mjera/varijabla, obima i vremenske reference.
  U 2021. godini stupilo je na snagu novo zakonodavstvo o implementaciji EU-SILC, revidirajući i poboljšavajući anketu (vidi odjeljak 3.4). Novim zakonodavstvom predviđene su višestruke izmjene u prikupljanju podataka EU-SILC, a posebno:

  •	sproveo je potrebu za sljedećim poboljšanjima: poboljšana pravovremenost, sa kraćim rokovima za dostavljanje podataka EU-SILC;

  •	reformulisala je zahtjeve preciznosti na nacionalnom i regionalnom nivou (NUTS2) za indikator rizika od siromaštva ili socijalne isključenosti i stopu trajnog rizika od siromaštva;

  •	dodatne/izmijenjene EU-SILC varijable;

  •	prikupljanje podataka sa tri frekvencije: jezgro, trogodišnji modul i šestogodišnji modul, te preporuka za proširenje uzdužnog panela.
1-31-methodology: >-
  Ciljna populacija su privatna domaćinstva i sve osobe koje sačinjavaju ova domaćinstva koja imaju svoje uobičajeno prebivalište na nacionalnoj teritoriji. Privatno domaćinstvo je osoba koja živi sama ili grupa osoba koje žive zajedno, pružajući sebi osnovne životne potrebe.
  Referentni period je godina istraživanja. Za sve zemlje, referentni period za varijable prihoda u EU-SILC je prethodna kalendarska godina.
  Koncept tačnosti se odnosi na preciznost procjena izračunatih iz uzorka, a ne iz cijele populacije. Tačnost zavisi od veličine uzorka, efekata dizajna uzorkovanja i strukture populacije koja se proučava. Pored toga, potrebno je uzeti u obzir greške u uzorkovanju i greške koje nisu u uzorkovanju. Greška uzorkovanja znači varijabilnost koja se javlja nasumično zbog upotrebe uzorka, a ne popisa, a greške koje nisu uzorkovane su greške koje se javljaju u svim fazama procesa prikupljanja i proizvodnje podataka.
  Od 2021
  Regulativa EU 2019/1700utvrđuje zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III te uredbe, karakteristike uzorkovanja, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-31-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
1-40-title: Osobe koje žive u domaćinstvu sa veoma niskim intenzitetom rada, po starosnoj grupi
1-40-definition: >-
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal tako što utiču na njihovo zdravlje i dobrobit i smanjuju obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez efikasnog obrazovanja, zdravstvenih, socijalnih, poreskih olakšica i sistema zapošljavanja, rizik od siromaštva se prenosi sa jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih grupa društva i ometati inkluzivni i održivi ekonomski rast.
1-40-intention: >-
  Ljudi u dobi od 0 do 64 godine koji žive u domaćinstvima u kojima su odrasli radili radno vrijeme jednako ili manje od 20% njihovog ukupnog kombinovanog potencijala radnog vremena tokom prethodne godine.
  Odrasli broj ljudi u dobi od 18 do 64 godine. Studenti u dobi od 18 do 24 godine; osobe koje su penzionisane u skladu sa svojim samo-definisanim trenutnim ekonomskim statusom ili koje primaju bilo koju penziju (osim porodične penzije); i osobe u starosnoj grupi od 60 do 64 godine koje su neaktivne i žive u domaćinstvu u kojem su glavni prihodi penzije, ne uzimaju se u obzir.
  Indikator je dio multidimenzionalnog indeksa siromaštva.
1-40-methodology: >-
  Referentni period je godina istraživanja. Za sve zemlje, referentni period za varijable prihoda u EU-SILC je prethodna kalendarska godina.
  Indikator je uključen kao sekundarni indikator u Pregled socijalnih pokazatelja za Evropski stub socijalnih prava i Akcioni plan EPSR-a, a dio je multidimenzionalnog indeksa siromaštva. Može se smatrati dijelom globalnog SDG indikatora 1.2.2 „Udio muškaraca, žena i djece svih uzrasta koji žive u siromaštvu u svim njegovim dimenzijama prema nacionalnim definicijama“
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-40-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
1-41-title: Stopa zaposlenih u riziku od siromaštva
1-41-definition: >-
  Indikator je dio indikatora Ciljeva održivog razvoja EU (SDG) postavljenog tamo gdje se koristi za praćenje napretka prema SDG 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje, što je ugrađeno u prioritete Evropske komisije pod "Ekonomije koja radi za ljude“.
  Indikator je uključen kao sekundarni indikator u Pregled socijalnih pokazatelja za Evropski stub socijalnih prava i Akcioni plan EPSR-a.
  Udio osoba koje su zaposlene i imaju ekvivalentni raspoloživi dohodak ispod praga rizika od siromaštva, koji je postavljen na 60% nacionalnog medijana ekvivalentnog raspoloživog dohotka (nakon socijalnih transfera). Za potrebe ovog indikatora, smatra se da je pojedinac zaposlen ako je bio zaposlen više od polovine referentne godine. Indikator se zasniva na EU-SILC (statistika o prihodima, socijalnoj inkluziji i uslovima života).
1-41-intention: >-
  Zaposlenost se često tvrdi da je najbolja zaštita od siromaštva, tako da je jedan od ciljeva EU stvaranje više i boljih radnih mjesta. Stoga je važno izmjeriti udio siromašnih radnika, ljudi koji žive ispod granice siromaštva iako rade.
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal tako što utiču na njihovo zdravlje i dobrobit i smanjuju obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez efikasnog obrazovanja, zdravstvenih, socijalnih, poreskih olakšica i sistema zapošljavanja, rizik od siromaštva se prenosi sa jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih grupa društva i ometati inkluzivni i održivi ekonomski rast.
1-41-methodology: >-
  Indikator je proizveden u skladu sa standardima kvaliteta na visokom nivou evropske statistike. Od 2005. godine nadalje, EU-SILC se zasniva na zajedničkom okviru definisanom usklađenim listama primarnih i sekundarnih varijabli, zajedničkim konceptima, preporučenom dizajnu, zajedničkim zahtjevima (kao što su postupci imputacije, ponderisanje, izračunavanje grešaka u uzorkovanju) i klasifikacijama s ciljem maksimiziranja uporedivosti proizvedenih informacija.
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-41-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
1-50-title: Stopa prekomernog opterećenja troškovima stanovanja prema statusu siromaštva
1-50-definition: >-
  Indikator je dio indikatora Ciljeva održivog razvoja EU (SDG) postavljenog tamo gdje se koristi za praćenje napretka prema SDG 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje, što je ugrađeno u prioritete Evropske komisije pod "Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator je uključen kao sekundarni indikator u Pregled socijalnih pokazatelja za Evropski stub socijalnih prava i Akcioni plan EPSR-a, a dio je multidimenzionalnog indeksa siromaštva. Može se smatrati dijelom globalnog SDG indikatora 1.2.2 „Udio muškaraca, žena i djece svih uzrasta koji žive u siromaštvu u svim njegovim dimenzijama prema nacionalnim definicijama“
1-50-intention: >-
  Siromaštvo i socijalna isključenost štete životima pojedinaca i ograničavaju mogućnosti ljudi da ostvare svoj puni potencijal tako što utiču na njihovo zdravlje i dobrobit i smanjuju obrazovne ishode. To zauzvrat smanjuje mogućnosti za uspješan život i dodatno povećava rizik od siromaštva. Bez efikasnog obrazovanja, zdravstvenih, socijalnih, poreskih olakšica i sistema zapošljavanja, rizik od siromaštva se prenosi sa jedne generacije na drugu. To uzrokuje opstanak siromaštva i stoga stvara više nejednakosti, što može dovesti do dugoročnog gubitka ekonomske produktivnosti od cijelih grupa društva i ometati inkluzivni i održivi ekonomski rast.
1-50-methodology: >-
  Indikator mjeri udio stanovništva koje živi u domaćinstvima koja troše 40% ili više raspoloživog dohotka domaćinstva na stanovanje („neto“ naknade za stanovanje). Troškovi stanovanja uključuju plaćanje kamata za iznajmljivanje ili hipoteku, ali i troškove komunalnih usluga kao što su voda, struja, plin ili grijanje.
  Od 2021. godine Uredba (EU) 2019/1700 predviđa zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
1-50-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
2-10-title: Stopa gojaznosti prema indeksu tjelesne mase (BMI)
2-10-definition: >-
  Evropsko istraživanje zdravstvenog stanja (EHIS) ima za cilj mjerenje zdravstvenog stanja (uključujući invaliditet), faktora koji utiču na zdravlje (stil života) građana EU, korištenje zdravstvenih usluga i ograničenja u pristupu tim uslugama, na harmonizovan način i sa visokim stepenom uporedivosti među državama članicama (DC). 
  Opšti obuhvat istraživanja odnosi se na populaciju stariju od 15 godina koja živi u privatnim domaćinstvima na teritoriji zemlje.
  EHIS se sastoji od četiri modula: zdravstveno stanje, faktori koji utiču na zdravlje, zdravstvena zaštita i osnovne varijable (sociodemografske karakteristike populacije).
2-10-intention: >-
  Podaci se prikupljaju putem nacionalnih anketa. EHIS se može provesti kao zasebna nacionalna anketa ili se može integrirati u postojeću nacionalnu anketu (npr. nacionalna anketa o zdravlju, anketa o radnoj snazi, druga anketa domaćinstava). Na taj način zemlje članice su imale maksimalnu fleksibilnost u provedbi. Međutim, širom EU prikupljeni su isti podaci prema zajedničkom popisu varijabli i kategorija odgovora.
2-10-methodology: >-
  EHIS ima za cilj postizanje standardizacije unosa. Pripremljen je standardni model upitnika (pitanja, kategorije odgovora, filteri itd.) kao i konceptualne smjernice i obrazloženja. Zatražen je konceptualni prijevod na sve jezike EU.  
  U metodološkom priručniku za EHIS talas 3, pružena je evaluacija usporedivosti varijabli s onima iz talasa 2 koristeći skalu: "identično pitanje"; "blaga izmjena pitanja"; "snažna izmjena pitanja"; ili "nema: novo pitanje u EHIS talasu 3".
2-10-long_term_objective: >-
  Dugoročni cilj za ovaj pokazatelj je BMI 3.
2-20-title: Realni faktorski dohodak poljoprivrede po godišnjoj radnoj jedinici (AWU)
2-20-definition: >-
  Indikator se koristi za praćenje napretka prema Cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u Prioritete Europske komisije za 2024-2029 pod 'Održavanje naše kvalitete života: Sigurnost hrane, voda i priroda'.
  Poljoprivredni realni faktorski prihod mjeri prihod koji stvara poljoprivreda, a koristi se za naknadu za posuđene, iznajmljene ili vlastite proizvodne faktore (kapital, rad i zemlju).
  Godišnje radne jedinice (AWU) definiraju se kao puno radno vrijeme (odgovara broju radnih mjesta s punim radnim vremenom), a izračunavaju se dijeljenjem ukupnog broja odrađenih sati sa prosječnim godišnjim brojem sati rada na poslovima s punim radnim vremenom unutar ekonomske teritorije. To se može interpretirati kao mjera produktivnosti rada u poljoprivredi. Podaci potiču iz Ekonomske evidencije poljoprivrede (EAA), koja pruža detaljne informacije o prihodima poljoprivrednog sektora.
2-20-intention: >-
  Cilj SDG 2 je osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Povećanje poljoprivredne produktivnosti i prihoda proizvođača hrane ključni su faktori za postizanje ovog cilja. Izvor podataka su Ekonomski računi za poljoprivredu (EAA), koji koriste poljoprivrednu statistiku i administrativne informacije. EAA su satelitski računi Europskog sustava računa, koji pružaju komplementarne informacije i koncepte prilagođene specifičnosti poljoprivredne industrije. Iako njihova struktura vrlo blisko odgovara nacionalnim računima, njihovo sastavljanje zahtijeva formuliranje odgovarajućih pravila i metoda.
2-20-methodology: >-
  Jedan od pet općih ciljeva Zajedničke poljoprivredne politike (ZPP) je osigurati pravedan životni standard za poljoprivrednike. ZPP se finansira iz dva fonda: Europskog poljoprivrednog jamstvenog fonda (EAGF), koji finansira direktne isplate poljoprivrednicima kao i mjere na tržištu, i Europskog poljoprivrednog fonda za ruralni razvoj (EAFRD) putem kojeg se finansiraju programi ruralnog razvoja. EU subvencije i direktne isplate postale su značajan udio u dohotku faktora u poljoprivredi.
2-20-long_term_objective: >-
  povećanje produktivnosti i profitabilnosti poljoprivrednog sektora kroz:

  - Povećanje stvarnog prihoda faktora

  - Smanjenje poljoprivredne radne snage

  - Stabilizaciju poljoprivrednog prihoda
2-30-title: Državna podrška poljoprivrednom istraživanju i razvoju
2-30-definition: >-
  Indikator se odnosi na izdvajanja iz državnog budžeta za istraživanje i razvoj (GBARD) za poljoprivredu. Podaci GBARD-a mjere državnu podršku aktivnostima istraživanja i razvoja (R&D), ili, drugim riječima, koliko vlade daju prioritet javnom finansiranju R&D-a. Podaci GBARD-a se sastavljaju korištenjem smjernica utvrđenih u OECD-ovom Frascati priručniku iz 2015. godine i Evropskom metodološkom priručniku za poslovnu statistiku za statistiku istraživanja i razvoja iz 2023. godine. Podaci su izraženi u tekućim cijenama, što znači da na ukupni razvoj pokazatelja djelimično utiče i opšta inflacija cijena.
2-30-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji su ugrađeni u prioritete Evropske komisije za period 2024-2029 u okviru programa „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“. 
  Cilj održivog razvoja 2, između ostalog, ima za cilj osigurati pristup sigurnoj, hranjivoj i dovoljnoj količini hrane. Poboljšanje poljoprivredne produktivnosti i održavanje održivih i otpornih sistema proizvodnje hrane ključni su faktori u postizanju ovog cilja i u velikoj mjeri zavise od povećanih ulaganja u istraživanje i razvoj u oblasti poljoprivrede, hrane i ishrane.
2-30-methodology: >-
  Zemlje prikupljaju podatke GBARD-a slijedeći preporuke Frascati priručnika. Među nekoliko metodoloških pitanja koja mogu utjecati na poređenja između zemalja su faza u budžetskom procesu iz koje se izvlače konačni podaci GBARD-a (konačna budžetska sredstva ili stvarni izdaci); uključivanje PDV-a ili sredstava EU za istraživanje i razvoj.
  Podaci GBARD-a su raščlanjeni po:

  -Socio-ekonomskim ciljevima (SEO) u skladu s Nomenklaturom za analizu i poređenje naučnih programa i budžeta (NABS 2007). - (Vidi Aneks 3 na dnu stranice).

  -Način finansiranja: finansiranje projekata i institucionalno finansiranje (neobavezni podaci).
  Dio GBARD-a dodijeljen transnacionalnoj saradnji u istraživanju i razvoju dalje je podijeljen u tri specifične kategorije: transnacionalni javni izvođači istraživanja i razvoja; transnacionalni javni programi istraživanja i razvoja na nivou Evrope; i bilateralni ili multilateralni javni programi istraživanja i razvoja uspostavljeni između vlada država članica ili sa EFTA-om i zemljama kandidatima.
2-30-long_term_objective: >-
  Jačanje tržišne orijentacije i konkurentnosti
2-40-title: Površina pod organskom poljoprivredom
2-40-definition: >-
  Ovaj indikator se definiše kao udio ukupne korištene poljoprivredne površine (UAA) koju zauzima organska poljoprivreda (postojeća organski obrađena područja i područja koja su u procesu konverzije). Organska poljoprivreda je metoda proizvodnje koja stavlja najveći naglasak na zaštitu okoliša i divljih životinja, a u pogledu stočarske proizvodnje i na pitanja dobrobiti životinja. Izbjegava ili uveliko smanjuje upotrebu sintetičkih hemijskih inputa, kao što su gnojiva, pesticidi, aditivi i medicinski proizvodi.
2-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“.
  Cilj održivog razvoja 2 ima za cilj osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Održivi i otporni sistemi proizvodnje hrane ključni su faktor u postizanju ovog cilja. Organska poljoprivreda je metoda proizvodnje koja stavlja najveći naglasak na zaštitu okoliša i, u pogledu stočarstva, na razmatranje dobrobiti životinja. Izbjegava ili uveliko smanjuje upotrebu sintetičkih hemijskih inputa kao što su gnojiva, pesticidi, aditivi i medicinski proizvodi.
  Indikator se može smatrati dijelom globalnog pokazatelja cilja održivog razvoja 2.4.1 „Udio poljoprivrednog područja pod produktivnom i održivom poljoprivredom“.
2-40-methodology: >-
  Indikator se može smatrati dijelom globalnog pokazatelja ciljeva održivog razvoja 2.4.1 "Udio poljoprivrednog područja pod produktivnom i održivom poljoprivredom". Iako organska poljoprivreda nije eksplicitno spomenuta u Agendi 2030, EU smatra organsku poljoprivredu metodom proizvodnje koja stavlja najveći naglasak na zaštitu okoliša i divljih životinja, a u pogledu stočarstva i na pitanja dobrobiti životinja. Izbjegava ili uveliko smanjuje upotrebu sintetičkih hemijskih inputa kao što su gnojiva, pesticidi, aditivi i medicinski proizvodi. Proizvodnja genetski modificiranih organizama (GMO) i njihova upotreba u stočnoj hrani su zabranjeni.
  Strategija biodiverziteta za 2030. godinu ključna je komponenta Evropskog zelenog plana. Cilj strategije je smanjiti upotrebu i rizik od hemijskih pesticida, smanjiti gubitke hranjivih tvari i smanjiti upotrebu gnojiva i antibiotika. Strategija biodiverziteta postavlja cilj da se do 2030. godine 25% ukupnog poljoprivrednog zemljišta EU podvrgne organskoj poljoprivredi.
2-40-long_term_objective: >-
  Najmanje 25% poljoprivrednog zemljišta EU trebalo bi biti pod organskom poljoprivredom do 2030. godine
2-53-title: Upotreba i rizik od hemijskih pesticida
2-53-definition: >-
  Opis hemijskih pesticida u EU i njenim državama članicama. Upotreba pesticida nosi rizike i uticaje na ljudsko zdravlje i okolinu. Indikator se zasniva na količinama hemijskih aktivnih supstanci sadržanih u pesticidima koji se stavljaju na tržište (prodaju), a time i koriste, u svakoj državi članici, i na opasnim svojstvima tih aktivnih supstanci. Podaci su prikazani kao indeks u odnosu na prosječne rezultate za period od 2015. do 2017. godine.
2-53-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru 'Održavanje kvalitete našeg života: Sigurnost hrane, voda i priroda'.
  Cilj održivog razvoja 2 ima za cilj osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Održivi i otporni sistemi proizvodnje hrane ključni su faktor u postizanju ovog cilja. Uz promociju organske poljoprivrede, integrirano upravljanje štetočinama (IPM) jedan je od alata za naglašavanje rasta zdravih usjeva poticanjem prirodnih mehanizama suzbijanja štetočina i smanjenjem ili minimiziranjem rizika po ljudsko zdravlje i okoliš.
  "Akcijski plan za nulto zagađenje" EU ima za cilj smanjiti upotrebu i rizik od hemijskih pesticida i upotrebu opasnijih pesticida za 50% do 2030. godine.
2-53-methodology: >-
  Izračun se zasniva na količinama hemijskih aktivnih supstanci koje su odobrene kao kandidati za zamjenu u skladu s članom 24. Uredbe (EZ) br. 1107/2009, sadržanih u sredstvima za zaštitu bilja koja se stavljaju na tržište u sredstvima za zaštitu bilja svake godine prijavljenim prema Uredbi (EZ) br. 1185/2009 u skladu s Uredbom (EZ) br. 1107/2009 i dostavljenim u skladu s Prilogom I Uredbe (EZ) br. 1185/2009.
2-53-long_term_objective: >-
  Smanjiti upotrebu i rizik od hemijskih pesticida za 50% do 2030. godine u poređenju sa trogodišnjom baznom linijom (prosjek za period od 2015. do 2017. godine)
2-60-title: Emisije amonijaka iz poljoprivrede
2-60-definition: >-
  Količina emisija amonijaka (NH3) kao rezultat poljoprivredne proizvodnje. Emisije amonijaka po hektaru izračunavaju se korištenjem ukupne korištene poljoprivredne površine (UAA) relevantne godine kao nazivnika.
  Podaci za ovaj indikator potiču iz inventara EU o zagađenju zraka koji je sastavila Evropska agencija za okoliš (EEA) u okviru Konvencije o prekograničnom zagađenju zraka na velike udaljenosti (LRTAP) i u potpunosti su u skladu s nacionalnim inventarima zagađenja zraka koje su sastavile države članice EU.
  Podaci o korištenoj poljoprivrednoj površini (UAA) potiču iz godišnje statistike usjeva Eurostata. Definicija ovog indikatora zasniva se na indikatoru CAP C45 Emisije iz poljoprivrede
2-60-intention: >-
  Indikator se koristi za praćenje napretka ka cilju održivog razvoja 2 o iskorjenjivanju gladi i pothranjenosti; koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru "Održavanje kvalitete života: Sigurnost hrane, voda i priroda".
  Cilj održivog razvoja 2 teži održivim i otpornim sistemima proizvodnje hrane. Amonijak (NH3) je bezbojan, oštrog mirisa i korozivan plin koji nastaje raspadanjem organske biljne tvari i iz izmeta ljudi i životinja. Kada se ispusti u atmosferu, amonijak doprinosi nivou zagađenja zraka. Poljoprivredni sektor i dalje je najveći doprinos emisijama amonijaka u EU.
2-60-methodology: >-
  Indikator prati trendove u upotrebi i riziku hemijskih pesticida u EU i njenim državama članicama. Upotreba pesticida sa sobom nosi rizike i uticaje na ljudsko zdravlje i okolinu. Indikator se zasniva na količinama hemijskih aktivnih supstanci sadržanih u pesticidima koji se stavljaju na tržište (prodaju), a time i koriste, u svakoj državi članici, te na opasnim svojstvima tih aktivnih supstanci. Podaci su predstavljeni kao indeks u odnosu na prosječne rezultate za period od 2015. do 2017. godine.
  Mjere provedene u okviru Zajedničke poljoprivredne politike (ZPP) i Okvirne direktive o vodama dovele su do smanjenja emisija amonijaka iz poljoprivrede u EU od 1990-ih. Konkretno, mjere za promjenu poljoprivrednih praksi dovele su do smanjenja upotrebe dušičnih gnojiva i smanjenja gustoće stoke po hektaru širom EU.
  Direktiva o nacionalnim obavezama smanjenja emisija (NEC Direktiva) postavlja nacionalne obaveze smanjenja emisija za države članice i EU za pet važnih zagađivača zraka, uključujući amonijak.
2-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 8 po hektaru.
3-12-title: Godine zdravog života zasnovane na samopercepciji zdravlja
3-12-definition: >-
  Ovaj indikator procjenjuje broj godina koliko se očekuje da će osoba živjeti u dobrom percipiranom zdravlju. Zasnovan je na podacima o smrtnosti u kombinaciji s podacima o samoprocjeni zdravlja, kako je navedeno u Statistici EU o prihodima i životnim uslovima (EU-SILC).
3-12-intention: >-
  Ovaj indikator je dio skupa indikatora Ciljeva održivog razvoja EU (SDG). Koristi se za praćenje napretka prema cilju 3 o dobrom zdravlju i blagostanju i cilju 1 o eliminaciji siromaštva kao višenamjenski indikator (MPI); koji su ugrađeni u prioritete Evropske komisije za period 2024-2029 u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
3-12-methodology: >-
  Dobro zdravlje nije vrijedno samo za pojedinca kao glavni faktor kvalitete života, blagostanja i društvenog sudjelovanja, već je i osnovni preduslov za opšti ekonomski rast. Praćenje Cilja održivog razvoja 3 u kontekstu EU fokusira se na teme zdravog života, determinanti zdravlja, uzroka smrti i zdravstvene zaštite.
3-12-long_term_objective: >- 
3-20-title: Udio ljudi sa dobrim ili vrlo dobrim percipiranim zdravljem prema spolu
3-20-definition: >-
  Indikator je subjektivna mjera o tome kako ljudi generalno procjenjuju svoje zdravlje na skali od "vrlo dobro" do "vrlo loše". Izražava se kao udio populacije u dobi od 16 ili više godina koja sebe doživljava kao "dobro" ili "vrlo dobro" zdravlje.
  Utvrđeno je da su indikatori percipiranog opšteg zdravlja dobar prediktor buduće upotrebe zdravstvene zaštite i smrtnosti ljudi. Podaci potiču iz Statistike EU o prihodima i uslovima života (EU SILC).
3-20-intention: >-
  Od 2021. godine Regulativa (EU) 2019/1700 predviđa zahtjeve koji se odnose na geografsku pokrivenost, detaljne karakteristike uzorka, uključujući poduzorkovanje, u skladu sa Aneksom III, zajedničke periode prikupljanja podataka, zajedničke standarde za uređivanje i imputaciju, ponderisanje, procjenu i procjenu varijanse.
3-20-methodology: >-
  Od 2021. godine nadalje, EU-SILC se zasniva na zajedničkom okviru definisanom usklađenim listama primarnih i sekundarnih varijabli, zajedničkim konceptima, preporučenom dizajnu, zajedničkim zahtjevima (kao što su postupci imputacije, ponderisanje, izračunavanje grešaka u uzorkovanju) i klasifikacijama s ciljem maksimiziranja uporedivosti proizvedenih informacija. Detalji se mogu naći u metapodacima izvornih skupova podataka.
3-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 80.
3-30-title: Prevalencija pušenja prema spolu
3-30-definition: >-
  Ovaj indikator mjeri procenat stanovništva starijeg od 15 godina koje izvještava da trenutno puši cigarete, cigare, cigarilose ili lulu. Ne uključuje upotrebu drugih duhanskih i srodnih proizvoda kao što su elektronske cigarete i snuf. Podaci se prikupljaju putem istraživanja Eurobarometra i zasnivaju se na samoprijavljenoj upotrebi tokom intervjua licem u lice u domovima ljudi.
3-30-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela“.
3-30-methodology: >-
  Indikator se može smatrati sličnim globalnom indikatoru SDG 3.a.1 "Starosno standardizirana prevalencija trenutne upotrebe duhana među osobama u dobi od 15 godina i starijim".
  Nekoliko direktiva EU ima za cilj zaštitu građana od opasnih efekata pušenja, uključujući Direktivu o duhanskim proizvodima, Direktivu o oglašavanju duhana i Direktivu o oporezivanju duhana.
3-30-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 12
3-42-title: Standardizovana smrtnost koja se može sprečiti i liječiti
3-42-definition: >-
  Smrtnost koja se može izbjeći pokriva uzroke smrtnosti koji se mogu spriječiti i liječiti. Smrtnost koja se može spriječiti odnosi se na smrtnost koja se uglavnom može izbjeći efikasnim intervencijama javnog zdravlja i primarne prevencije (koje se provode prije pojave bolesti/povreda kako bi se smanjila incidencija). Smrtnost koja se može liječiti uglavnom se može izbjeći pravovremenim i efikasnim zdravstvenim intervencijama, uključujući sekundarnu prevenciju i liječenje (nakon pojave bolesti).
3-42-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela“. 
  Glavni preduslov za postizanje ovih ciljeva je univerzalna zdravstvena pokrivenost; pristup uslugama seksualnog i reproduktivnog zdravlja i sigurnim, pristupačnim i efikasnim lijekovima i vakcinama za sve. Standardizovane stope smrtnosti koje se koriste za ovaj indikator uzimaju u obzir da zemlje s većim udjelom starijih stanovnika također imaju veće stope smrtnosti.
3-42-methodology: >-
  Ukupna stopa smrtnosti koja se može izbjeći uključuje niz zaraznih bolesti, nekoliko vrsta karcinoma, endokrinih i metaboličkih bolesti, kao i neke bolesti nervnog, cirkulatornog, respiratornog, probavnog i genitourinarnog sistema, neke bolesti vezane za trudnoću, porođaj i perinatalni period, niz urođenih malformacija, štetnih efekata medicinske i hirurške njege, popis povreda i poremećaja povezanih s alkoholom i lijekovima.
  Smrtnost koja se može liječiti uglavnom se može izbjeći pravovremenim i efikasnim intervencijama zdravstvene zaštite, uključujući sekundarnu prevenciju i liječenje (nakon pojave bolesti kako bi se smanjila smrtnost). Podaci su predstavljeni kao standardizovane stope smrtnosti, što znači da su prilagođeni standardnoj starosnoj distribuciji kako bi se izmjerile stope smrtnosti nezavisno od različitih starosnih struktura populacija kako bi se smanjila smrtnost od slučaja).
3-42-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 150.
3-60-title: Samoprijavljena nezadovoljena potreba za medicinskim pregledom i njegom prema spolu
3-60-definition: >-
  Ovaj indikator mjeri udio stanovništva u dobi od 16 i više godina koje izvještava o nezadovoljenim potrebama za medicinskom njegom iz jednog od sljedećih razloga: ‘finansijski razlozi’, ‘lista čekanja’ i ‘predaleko za putovanje’. Samoprijavljene nezadovoljene potrebe odnose se na vlastitu procjenu osobe o tome da li joj je potreban ljekarski pregled ili liječenje (bez stomatološke njege), ali ga nije imala ili ga nije tražila.
  Budući da društvene norme i očekivanja mogu uticati na odgovore na pitanja o nezadovoljenim potrebama za njegom, potreban je oprez prilikom upoređivanja razlika u izvještavanju o nezadovoljenim ljekarskim pregledima u različitim zemljama. Pored toga, različita organizacija zdravstvenih usluga je još jedan faktor koji treba uzeti u obzir prilikom analize podataka. Konačno, postoje i neke varijacije u anketnim pitanjima u različitim zemljama i tokom vremena.
3-60-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti i cilju održivog razvoja 1 o siromaštvu kao višenamjenskom indikatoru (MPI); koji su ugrađeni u prioritete Evropske komisije 2024-2029. godine pod „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela“.
3-60-methodology: >-
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
  Univerzalna zdravstvena pokrivenost je cilj Povelje EU o osnovnim pravima. Jedan od tri prioriteta zdravstvene politike EU je povećanje dostupnosti zdravstvene zaštite. Pored toga, jedan od 20 principa Evropskog stuba socijalnih prava je da svako ima pravo na pravovremeni pristup pristupačnoj, preventivnoj i kurativnoj zdravstvenoj zaštiti dobrog kvaliteta.
3-70-title: Potrošnja antibiotika u zajednici i bolničkom sektoru – definisane dnevne doze (DDD) dnevno
3-70-definition: >-
  Ovaj indikator mjeri ukupnu potrošnju antimikrobnih sredstava (AMC) u zajednici i bolničkom sektoru. AMC se izražava kao broj definisanih dnevnih doza (DDD) na 1000 stanovnika dnevno. Podaci se odnose na klasifikacijsku oznaku Anatomsko-terapijsko-hemijski (ATC) J01 ‘Antibakterijski proizvodi za sistemsku upotrebu’. Podaci za agregat EU prikazani su kao populacijski ponderirana srednja vrijednost i uključuju imputacije i korekcije.
3-70-intention: >-
  Koristi se za praćenje napretka prema cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod naslovom „Podrška ljudima, jačanje našeg društva i našeg socijalnog modela“.
3-70-methodology: >-
  Glavni preduslov za postizanje ovih ciljeva je univerzalna zdravstvena pokrivenost; pristup uslugama seksualnog i reproduktivnog zdravlja i sigurnim, pristupačnim i efikasnim lijekovima i vakcinama za sve. Standardizovane stope smrtnosti koje se koriste za ovaj indikator uzimaju u obzir da zemlje s većim udjelom starijih stanovnika također imaju veće stope smrtnosti.
  Indikator je sličan globalnom SDG indikatoru 3.d.2 "Procenat infekcija krvotoka zbog odabranih antimikrobno rezistentnih organizama".
3-70-long_term_objective: >-
  Dugoročni cilj je postizanje univerzalne zdravstvene pokrivenosti. To uključuje zaštitu od finansijskog rizika, pristup kvalitetnim osnovnim zdravstvenim uslugama i pristup sigurnim, efikasnim, kvalitetnim i pristupačnim osnovnim lijekovima i vakcinama za sve. 
  Do 2030. godine, cilj je osigurati da svi ljudi imaju pristup uslugama seksualnog i reproduktivnog zdravlja, uključujući planiranje porodice, informacije i obrazovanje, te integrirati reproduktivno zdravlje u nacionalne strategije i programe.
4-10-title: Rano napuštanje obrazovanja i obuke po spolu
4-10-definition: >-
  Indikator mjeri udio stanovništva u dobi od 18 do 24 godine sa najviše nižim srednjim obrazovanjem koje nije bilo uključeno u bilo kakvo (formalno ili neformalno) obrazovanje ili obuku tokom četiri sedmice koje su prethodile istraživanju.
4-10-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju i cilju održivog razvoja 5 o rodnoj ravnopravnosti, koji su ugrađeni u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Evrope“.
  Vijeće Evropske unije 26. februara 2021. godine usvojilo je Rezoluciju o strateškom okviru za evropsku saradnju u obrazovanju i obuci prema Evropskom obrazovnom prostoru i šire (2021–2030), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvaliteta, jednakosti, inkluzije i uspjeha za sve u obrazovanju i obuci; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje evropskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u i kroz obrazovanje i obuku.
4-10-methodology: >-
  Rezolucija Vijeća postavlja cilj na nivou EU da udio osoba koje rano napuštaju obrazovanje i obuku, mjereno ovim indikatorom ciljeva održivog razvoja, bude manji od 9% do 2030. godine. Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
  Obrazovanje i obuka su ključni pokretači rasta i zapošljavanja jer pomažu u poboljšanju zaposlenosti, produktivnosti, inovacija i konkurentnosti. Nastavak obrazovanja nakon osnovnog nivoa je važan jer je veća vjerovatnoća da će ljudi sa višim kvalifikacijama biti zaposleni i manje je vjerovatno da će se suočiti sa siromaštvom u ekonomiji zasnovanoj na znanju. Osobe sa niskim nivoom obrazovanja ne samo da se mogu suočiti sa većim poteškoćama na tržištu rada, već imaju i veći rizik od siromaštva i socijalne isključenosti.
4-10-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 4
4-20-title: Visoko obrazovanje prema spolu
4-20-definition: >-
  Indikator mjeri udio stanovništva u dobi od 25 do 34 godine koje je uspješno završilo tercijarne studije (npr. na univerzitetu ili višoj tehničkoj ustanovi). Postizanje visokog obrazovanja odnosi se na ISCED (Međunarodna standardna klasifikacija obrazovanja) nivoe 5–8 2011. za podatke od 2014. godine nadalje i na ISCED nivoe 5–6 iz 1997. godine za podatke do 2013. godine. Indikator se zasniva na Anketi o radnoj snazi EU (EU-LFS).
4-20-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju i cilju održivog razvoja 5 o rodnoj ravnopravnosti, koji su ugrađeni u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Evrope“.
  Vijeće Evropske unije 26. februara 2021. godine usvojilo je Rezoluciju o strateškom okviru za evropsku saradnju u obrazovanju i obuci prema Evropskom obrazovnom prostoru i šire (2021–2030), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvaliteta, jednakosti, inkluzije i uspjeha za sve u obrazovanju i obuci; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje evropskog visokog obrazovanja; i (5) Podrška zelenim i digitalnim tranzicijama u i kroz obrazovanje i obuku.
4-20-methodology: >-
  Obrazovanje i obuka su ključni pokretači rasta i zapošljavanja jer pomažu u poboljšanju zaposlenosti, produktivnosti, inovacija i konkurentnosti. Nastavak obrazovanja nakon osnovnog nivoa je važan jer je veća vjerovatnoća da će ljudi sa višim kvalifikacijama biti zaposleni i manje je vjerovatno da će se suočiti sa siromaštvom u ekonomiji zasnovanoj na znanju. Osobe sa niskim nivoom obrazovanja ne samo da se mogu suočiti sa većim poteškoćama na tržištu rada, već imaju i veći rizik od siromaštva i socijalne isključenosti.
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
4-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 52
4-31-title: Učešće u obrazovanju u ranom djetinjstvu prema spolu (djeca od 3 i više godina)
4-31-definition: >-
  Indikator mjeri udio djece u dobi između tri godine i početne dobi obaveznog osnovnog obrazovanja koja su učestvovala u obrazovanju i njezi u ranom djetinjstvu (ECEC) koja se mogu klasifikovati kao ISCED nivo 0 prema Međunarodnoj standardnoj klasifikaciji za obrazovanje (ISCED 2011). Da bi se ECEC programi klasifikovali kao ISCED nivo 0, moraju biti namjerno dizajnirani tako da podržavaju kognitivni, fizički i socio-emocionalni razvoj djeteta. Početna dob obaveznog osnovnog obrazovanja razlikuje se od zemlje do zemlje. Učešće djece u programima koji nisu namjerno osmišljeni da podrže razvoj djeteta (kao što su programi samo za brigu o djeci) nije uključeno u ovaj indikator.
4-31-intention: >-
  Indikatori koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Zaštita naše demokratije, podržavanje naših vrijednosti“.
  Vijeće Evropske unije je 26. februara 2021. godine usvojilo  Rezoluciju o strateškom okviru za evropsku saradnju u obrazovanju i osposobljavanju prema Evropskom obrazovnom prostoru i šire (2021–2030), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvaliteta, jednakosti, inkluzije i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje evropskog visokog obrazovanja; i (5) Podrška zelenoj i digitalnoj tranziciji u obrazovanju i osposobljavanju i kroz njih.
4-31-methodology: >-
  Kako se obrazovanje i briga u ranom djetinjstvu sve više prepoznaju kao sastavni dio sistema obrazovanja i obuke, Rezolucija Vijeća postavlja cilj EU za učešće u obrazovanju i njezi u ranom djetinjstvu da do 2030. godine bude najmanje 96% djece između tri godine i početne dobi za obavezno osnovno obrazovanje.
4-31-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 100.
4-40-title: Petnaestogodišnjaci sa slabim uspjehom u čitanju, matematici ili prirodnim naukama
4-40-definition: >-
  Indikator mjeri udio 15-godišnjih učenika koji ne dostižu nivo 2 (‘nivo osnovnih vještina’) na PISA skali za tri osnovna školska predmeta čitanja, matematike i nauke. Podaci potiču iz Programa za međunarodnu procjenu učenika (PISA), redovno sprovedenog međunarodnog istraživanja čiji je cilj evaluacija obrazovnih sistema testiranjem vještina i znanja 15-godišnjih učenika.
4-40-intention: >-
  Indikatori koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Zaštita naše demokratije, podržavanje naših vrijednosti“.
  Vijeće Evropske unije je 26. februara 2021. godine usvojilo  Rezoluciju o strateškom okviru za evropsku saradnju u obrazovanju i osposobljavanju prema Evropskom obrazovnom prostoru i šire (2021–2030), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvaliteta, jednakosti, inkluzije i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje evropskog visokog obrazovanja; i (5) Podrška zelenoj i digitalnoj tranziciji u obrazovanju i osposobljavanju i kroz njih.
4-40-methodology: >-
  Rezolucija Vijeća postavlja cilj EU da udio 15-godišnjaka s niskim postignućima u čitanju, matematici i nauci, mjeren ovim indikatorom ciljeva održivog razvoja, bude manji od 15% do 2030. godine.
4-40-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 525,6
4-60-title: Učešće odraslih u učenju po spolu
4-60-definition: >-
  Indikator mjeri udio ljudi u dobi od 25 do 64 godine koji su izjavili da su dobili formalno ili neformalno obrazovanje i obuku u četiri sedmice koje su prethodile istraživanju (brojilac). Imenilac se sastoji od ukupne populacije iste starosne grupe, isključujući one koji nisu odgovorili na pitanje „učešće u obrazovanju i obuci“. Učenje odraslih obuhvata aktivnosti formalnog i neformalnog učenja koje se odnose na posao i koje se ne odnose na posao. Obično se odnosi na aktivnosti učenja nakon završetka inicijalnog obrazovanja.
4-60-intention: >-
  Indikatorse koristi za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Evrope“.
  Vijeće Evropske unije je 26. februara 2021. godine usvojilo  Rezoluciju o strateškom okviru za evropsku saradnju u obrazovanju i osposobljavanju prema Evropskom obrazovnom prostoru i šire (2021–2030), okvir koji se bavi pet strateških prioriteta: (1) Poboljšanje kvaliteta, jednakosti, inkluzije i uspjeha za sve u obrazovanju i osposobljavanju; (2) Ostvarivanje cjeloživotnog učenja i mobilnosti za sve; (3) Jačanje kompetencija i motivacije u obrazovnoj profesiji; (4) Jačanje evropskog visokog obrazovanja; i (5) Podrška zelenoj i digitalnoj tranziciji u obrazovanju i osposobljavanju i kroz njih.
4-60-methodology: >-
  Učenje odraslih pokriva najduži period u životnom vijeku osobe. To uključuje poboljšanje i razvoj vještina, prilagođavanje tehnološkom razvoju, unapređenje karijere osobe ili pomaganje njenom povratku na tržište rada (usavršavanje i prekvalifikacija). Štaviše, od ključnog je značaja za održavanje dobrog zdravlja, ostajanje aktivnim u zajednici i potpuno uključivanje u sve aspekte društva.
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
4-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 28
4-70-title: Udio pojedinaca koji posjeduju barem osnovne digitalne vještine, po spolu
4-70-definition: >-
  Ovaj indikator mjeri udio ljudi u dobi od 16 do 74 godine koji imaju barem osnovne digitalne vještine. To je kompozitni indikator zasnovan na odabranim aktivnostima koje pojedinci obavljaju na internetu u određenim oblastima: informaciona i podatkovna pismenost, komunikacija i saradnja, kreiranje digitalnih sadržaja, sigurnost i rješavanje problema. Indikator ocjenjuje digitalne vještine klasificirane u šest nivoa, od kojih dva najviša čine osnovni ili iznad osnovnog nivoa digitalnih vještina. Indikator se zasniva na podacima iz istraživanja EU o upotrebi IKT u domaćinstvima i od strane pojedinaca.
4-70-intention: >-
  Indikatori koji se koriste za praćenje napretka prema cilju održivog razvoja 4 o kvalitetnom obrazovanju, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Zaštita naše demokratije, podržavanje naših vrijednosti“.
4-70-methodology: >-
  Cilj održivog razvoja 4 nastoji osigurati da ljudi imaju pristup ravnopravnom i kvalitetnom obrazovanju u svim fazama života, kao i povećati broj mladih i odraslih koji imaju relevantne vještine za zapošljavanje, pristojne poslove i poduzetništvo. Cilj predviđa i eliminaciju rodnih i dohodovnih nejednakosti u pristupu obrazovanju.
  Digitalne vještine su od kritične vrijednosti za rad, učenje i socijalnu interakciju.
4-70-long_term_objective: >-
  Akcioni plan za evropski stub socijalnih prava i Digitalni kompas za 2030. godinu: evropski put u digitalnu deceniju postavili su cilj za EU da poveća udio ljudi u dobi od 16 do 74 godine koji imaju barem osnovne digitalne vještine na 80% u 2030. godini.
5-10-title: Fizičko i seksualno nasilje nad ženama po starosnim grupama (podaci iz 2012. godine)
5-10-definition: >-
  Indikator mjeri udio žena u dobi od 15 godina koje su odgovorile „da“ kada su upitane da li su doživjele fizičko i/ili seksualno nasilje od strane partnera ili ne-partnera u 12 mjeseci prije intervjua.
5-10-intention: >-
  Obuhvat podataka 2012 - 2012
5-10-methodology: >-
  Bez opisa
5-10-long_term_objective: >-
  Bez opisa
5-20-title: Razlika u platama između spolova u neprilagođenom obliku
5-20-definition: >-
  Indikator mjeri razliku između prosječne bruto satnice zaposlenih muškaraca i zaposlenih žena kao procenat prosječne bruto satnice zaposlenih muškaraca. Indikator je definisan kao neprilagođen, jer daje ukupnu sliku rodnih nejednakosti u pogledu plate i mjeri koncept koji je širi od koncepta jednake plate za jednak rad. Uključeni su svi zaposleni koji rade u firmama sa deset ili više zaposlenih, bez ograničenja za starost i radno vrijeme. Razlika u plaćama između spolova zasniva se na metodologiji istraživanja o strukturi zarada (SES), koje se provodi svake četiri godine.
5-20-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti, koji je ugrađen u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator se može smatrati sličnim globalnom SDG indikatoru 8.5.1 „Prosječna zarada po satu zaposlenih žena i muškaraca, prema zanimanju, starosti i osobama sa invaliditetom“. Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
5-20-methodology: >-
  Strategija EU za rodnu ravnopravnost obavezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i akcije za postizanje značajnog napretka do 2025. godine prema Evropi rodne ravnopravnosti, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni da slijede svoj izabrani životni put i imaju jednake mogućnosti za napredak. Ključni ciljevi su zaustavljanje rodno zasnovanog nasilja; izazivanje rodnih stereotipa; zatvaranje rodnih razlika na tržištu rada; postizanje ravnopravnog učešća u različitim sektorima ekonomije; rješavanje rodnih razlika u plaćama i penzijama; zatvaranje rodne razlike u brizi i postizanje rodne ravnoteže u donošenju odluka i u politici.
  Jednaka plata za jednak rad je jedan od temeljnih principa Evropske unije, ugrađen u Ugovore od 1957. godine. Član 157 Ugovora o funkcionisanju Evropske unije predviđa da svaka država članica osigurava primjenu tog principa. Direktiva 2006/54/EZ sadrži princip jednake plate. Uklanjanje rodne razlike u platama je takođe jedan od ciljeva Strateškog angažmana Komisije za rodnu ravnopravnost, kao i Evropskog stuba socijalnih prava.
5-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
5-30-title: Razlika u zaposlenosti među spolovima, prema vrsti zaposlenja
5-30-definition: >-
  Indikator mjeri razliku između stopa zaposlenosti muškaraca i žena u dobi od 20 do 64 godine. Stopa zaposlenosti izračunava se dijeljenjem broja lica u dobi od 20 do 64 godine u radnom odnosu sa ukupnom populacijom iste starosne grupe. 
  Indikatorj prikazuje aktivnost i radni status za četiri grupe lica: zaposlena lica koja rade puno radno vrijeme, zaposlena lica koja rade sa nepunim radnim vremenom, zaposlena lica sa ugovorom o radu na određeno vrijeme i podzaposlena lica koja rade sa nepunim radnim vremenom.
5-30-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti, koji je ugrađen u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
5-30-methodology: >-
  Povećanje učešća žena na tržištu rada i jednaka ekonomska nezavisnost žena i muškaraca jedan je od prioriteta Strategije EU za rodnu ravnopravnost, koja se obavezuje na ostvarivanje Unije ravnopravnosti. Strategija EU za rodnu ravnopravnost obavezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i akcije za postizanje značajnog napretka do 2025. godine prema Evropi rodne ravnopravnosti, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni da slijede svoj izabrani životni put i imaju jednake mogućnosti za napredak. Ključni ciljevi su zaustavljanje rodno zasnovanog nasilja; izazivanje rodnih stereotipa; zatvaranje rodnih razlika na tržištu rada; postizanje ravnopravnog učešća u različitim sektorima ekonomije; rješavanje rodnih razlika u plaćama i penzijama; zatvaranje rodne razlike u brizi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-30-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
5-40-title: Osobe izvan radne snage zbog obaveza brige o drugima po spolu
5-40-definition: >-
  Stanovništvo izvan radne snage obuhvata pojedince koji nisu zaposleni i koji ili aktivno ne traže posao ili nisu dostupni za rad (čak i ako su pronašli posao koji će početi u budućnosti). Dakle, oni nisu ni zaposleni ni nezaposleni. 
  Ova definicija koja se koristi u Anketi o radnoj snazi EU (EU-LFS) zasniva se na rezolucijama Međunarodne konferencije statističara rada (ICLS) koju je organizovala Međunarodna organizacija rada (ILO). Razlog za odsustvo radne snage obuhvaćene ovim indikatorom uključuje „brigu o odraslima sa invaliditetom ili djeci“. Razmatraju se samo ljudi koji izražavaju spremnost za rad, uprkos tome što su izvan radne snage.
5-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti i cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji su ugrađeni u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
   Evropski stub socijalnih prava, koji su zajednički proglasili Evropska komisija, Evropski parlament i Evropsko vijeće 2017. godine, utvrđuje 20 ključnih principa i prava od suštinskog značaja za pravedna i dobro funkcionišuća tržišta rada i sisteme socijalne zaštite.
5-40-methodology: >-
  Strategija EU za rodnu ravnopravnost obavezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i akcije za postizanje značajnog napretka do 2025. godine prema Evropi rodne ravnopravnosti, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni da slijede svoj izabrani životni put i imaju jednake mogućnosti za napredak. Ključni ciljevi su zaustavljanje rodno zasnovanog nasilja; izazivanje rodnih stereotipa; zatvaranje rodnih razlika na tržištu rada; postizanje ravnopravnog učešća u različitim sektorima ekonomije; rješavanje rodnih razlika u plaćama i penzijama; zatvaranje rodne razlike u brizi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-40-long_term_objective: >-
   Bez opisa
5-50-title: Mjesta koja zauzimaju žene u nacionalnim parlamentima i vladama
5-50-definition: >-
  Indikator mjeri udio žena u nacionalnim parlamentima i nacionalnim vladama.
  Nacionalni parlament je nacionalna zakonodavna skupština, a indikator se odnosi na oba doma (donji i gornji dom, gdje je to relevantno). Broj članova parlamenta uključuje predsjednika/predsjednika/lidera parlamenta.
5-50-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 5 o rodnoj ravnopravnosti i cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji su ugrađeni u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator se može smatrati sličnim globalnom indikatoru SDG 5.5.1 "Udio mjesta koje imaju žene u nacionalnim parlamentima i lokalnim samoupravama".
5-50-methodology: >-
  Strategija EU za rodnu ravnopravnost obavezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i akcije za postizanje značajnog napretka do 2025. godine prema Evropi rodne ravnopravnosti, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni da slijede svoj izabrani životni put i imaju jednake mogućnosti za napredak. Ključni ciljevi su zaustavljanje rodno zasnovanog nasilja; izazivanje rodnih stereotipa; zatvaranje rodnih razlika na tržištu rada; postizanje ravnopravnog učešća u različitim sektorima ekonomije; rješavanje rodnih razlika u plaćama i penzijama; zatvaranje rodne razlike u brizi i postizanje rodne ravnoteže u donošenju odluka i u politici.
5-50-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 50.
5-60-title: Pozicije koje zauzimaju žene na višim rukovodećim pozicijama
5-60-definition: >-
  Indikator mjeri udio žena članova odbora i rukovodilaca u najvećim kompanijama koje kotiraju na berzi.
5-60-intention: >-
  Obuhvat podataka 2003 – 2023. Javno kotirano znači da se dionicama društva trguje na berzi. „Najvećim“ kompanijama smatraju se članovi (maks. 50) primarnog blue-chip indeksa, koji je indeks koji održava berza i pokriva najveće kompanije prema tržišnoj kapitalizaciji i/ili tržišnoj trgovini. Računaju se samo kompanije koje su registrovane u dotičnoj zemlji. Članovi odbora pokrivaju sve članove najvišeg tijela za donošenje odluka u svakom društvu (tj. predsjednika, neizvršne direktore, više rukovodioce i predstavnike zaposlenika, gdje su prisutni). Rukovodioci se odnose na više rukovodioce u dva najviša organa odlučivanja najvećih (maks. 50) nacionalno registrovanih kompanija koje kotiraju na nacionalnoj berzi.
5-60-methodology: >-
  Strategija EU za rodnu ravnopravnost obavezuje se na postizanje Unije ravnopravnosti i predstavlja ciljeve politike i akcije za postizanje značajnog napretka do 2025. godine prema Evropi rodne ravnopravnosti, u kojoj su žene i muškarci, djevojčice i dječaci, slobodni da slijede svoj izabrani životni put i imaju jednake mogućnosti za napredak
5-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 50.
6-20-title: Stanovništvo povezano sa najmanje sekundarnim tretmanom otpadnih voda
6-20-definition: >-
  Indikator mjeri procenat stanovništva povezan sa sistemima za prečišćavanje otpadnih voda sa najmanje sekundarnim prečišćavanjem. Pri tome se otpadne vode iz urbanih ili drugih izvora prečišćavaju procesom koji generalno uključuje biološko prečišćavanje sa sekundarnim naseljem ili drugim procesom koji uklanja organski materijal i smanjuje njegovu biohemijsku potrebu za kisikom (BPK) za najmanje 70% i hemijsku potrebu za kisikom (KPK) za najmanje 75%.
6-20-intention: >-
  Indikator  se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i kanalizaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod „Održavanje našeg kvaliteta života: Sigurnost hrane, voda i priroda“.
  Indikator se može smatrati sličnim globalnom indikatoru SDG 6.3.1 "Udio sigurno prečišćenih otpadnih voda".
6-20-methodology: >-
  Zaštita vodnih resursa, vodnih ekosistema i vode za piće i kupanje je kamen temeljac ekološke politike EU, što je potvrđeno u predloženom 8. Akcionom programu za životnu sredinu. Vodna politika EU pruža okvir za sveobuhvatno rješavanje zaštite voda i za postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Politika EU u oblasti zdravlja i bezbjednosti hrane takođe doprinosi visokim standardima u pogledu vode i sanitarnih uslova u smislu sprečavanja širenja zaraznih bolesti. Direktiva o prečišćavanju komunalnih otpadnih voda reguliše sakupljanje, prečišćavanje i ispuštanje kućnih i industrijskih komunalnih otpadnih voda.
6-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 100.
6-30-title: Biohemijske potrebe za kiseonikom u rijekama
6-30-definition: >-
  Biohemijska potrošnja kisika (BOD) se koristi za mjerenje kvaliteta vode. Odnosi se na količinu kiseonika potrebnu aerobnim mikroorganizmima za razgradnju organskih supstanci u uzorku vode tokom perioda od pet dana u mraku na 20°C (BPK5), mjereno kao miligrami po litru (mg O2/L) i ponderisano brojem mjernih stanica. Visoke vrijednosti BPK5 su obično znak organskog zagađenja, što utiče na kvalitet vode. Najčišće rijeke imaju vrijednosti BPK5 manje od 1 mg O2/L, umjereno i jako zagađene rijeke pokazuju vrijednosti u rasponu od 2 do 8 mg O2/L.
6-30-intention: >-
  Indikator  se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i kanalizaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod „Održavanje našeg kvaliteta života: Sigurnost hrane, voda i priroda“. Ovaj indikator se može smatrati sličnim globalnom indikatoru SDG 6.3.2 "Udio vodnih tijela sa dobrim kvalitetom ambijentalne vode".
  Zaštita vodnih resursa, vodnih ekosistema i vode za piće i kupanje je kamen temeljac ekološke politike EU. Vodna politika EU pruža okvir za sveobuhvatno rješavanje zaštite voda i za postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Okvirna direktiva o vodama je glavno evropsko zakonodavstvo koje ima za cilj sprečavanje zagađenja vode, a Strategija EU za biodiverzitet do 2030. godine podržava implementaciju cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosisteme.
6-30-methodology: >-
  Osmi akcioni program za životnu sredinu postavlja agendu politike zaštite životne sredine za godine od 2021. do 2030. godine i izričito spominje pitanja vezana za vodu u dva od svojih šest prioritetnih ciljeva. Ova dva cilja su: (1) ostvarivanje ambicije nultog zagađenja za toksično okruženje bez zagađenja, uključujući vazduh, vodu i zemljište i zaštitu zdravlja i dobrobiti građana od rizika i uticaja vezanih za životnu sredinu; i (2) zaštita, očuvanje i obnavljanje biodiverziteta i unapređenje prirodnog kapitala, posebno vazduha, vode, zemljišta i šuma, slatkovodnih, močvarnih i morskih ekosistema.
6-30-long_term_objective: >-
  Dugoročni cilj za biohemijsku potražnju za kisikom (bod) u rijekama je postizanje vrijednosti od 1 mg O2/L. Ovaj cilj je dio cilja održivog razvoja EU i ima za cilj obnovu slatkovodnih ekosistema i osiguranje okruženja bez toksičnosti.
6-40-title: Nitrati u podzemnim vodama
6-40-definition: >-
  Ovaj indikator prikazuje koncentracije nitrata (NO3) u tijelima podzemnih voda mjerene kao miligrami po litru (mg NO3/L). Indikator se može koristiti za ilustraciju geografskih varijacija u trenutnim koncentracijama i vremenskim trendovima. Veliki unosi azota u vodna tijela iz urbanih područja, industrije i poljoprivrednih područja mogu imati negativne uticaje na korištenje vode za ljudsku potrošnju i druge svrhe.
6-40-intention: >-
  Indikator  se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i kanalizaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod „Održavanje našeg kvaliteta života: Sigurnost hrane, voda i priroda“.
  Zaštita vodnih resursa, vodnih ekosistema i vode za piće i kupanje je kamen temeljac ekološke politike EU. Vodna politika EU pruža okvir za sveobuhvatno rješavanje zaštite voda i za postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Prema Direktivi o vodi za piće, dozvoljena je maksimalna koncentracija od 50 mg/L nitrata u podzemnim vodama koje se koriste za vodu za piće. Direktiva o nitratima zahtijeva određivanje ranjivih zona na osnovu ovog praga za sve vode, uključujući podzemne vode.
6-40-methodology: >-
  Okvirna direktiva o vodama je glavno evropsko zakonodavstvo koje ima za cilj sprečavanje zagađenja vode. Strategija EU za biodiverzitet do 2030. godine podržava implementaciju cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosisteme.
  Osmi akcioni program za životnu sredinu postavlja agendu politike zaštite životne sredine za godine od 2021. do 2030. godine i izričito spominje pitanja vezana za vodu u dva od svojih šest prioritetnih ciljeva. Ova dva cilja su: (1) ostvarivanje ambicije nultog zagađenja za toksično okruženje bez zagađenja, uključujući vazduh, vodu i zemljište i zaštitu zdravlja i dobrobiti građana od rizika i uticaja vezanih za životnu sredinu; i (2) zaštita, očuvanje i obnavljanje biodiverziteta i unapređenje prirodnog kapitala, posebno vazduha, vode, zemljišta i šuma, slatkovodnih, močvarnih i morskih ekosistema.
6-40-long_term_objective: >-
  Dugoročni cilj je smanjenje nivoa nitrata ispod utvrđenog maksimalnog nivoa zagađivača (MCL) od 10 mg/L (kao N, azot) ili 45 mg/L (kao NO3−).
6-50-title: Fosfat u rijekama
6-50-definition: >-
  Ovaj indikator mjeri koncentraciju fosfata (PO4) po litru u rastvorenoj fazi iz uzoraka vode iz riječnih stanica i agregirano na godišnje prosječne vrijednosti. U visokim koncentracijama fosfat može izazvati probleme sa kvalitetom vode, kao što je eutrofikacija, pokretanjem rasta vodenih biljaka, uključujući alge. Indikator se može koristiti za ilustraciju geografskih varijacija u trenutnim koncentracijama i vremenskim trendovima.
6-50-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i sanitaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“.
  Indikator se može smatrati dijelom globalnog indikatora SDG 6.3.2 „Udio vodnih tijela sa dobrim kvalitetom ambijentalne vode“.
  Zaštita vodnih resursa, vodnih ekosistema i vode za piće i kupanje je kamen temeljac ekološke politike EU. Vodna politika EU pruža okvir za sveobuhvatno rješavanje zaštite voda i za postizanje dobrog stanja kopnenih površinskih voda, prijelaznih voda, obalnih voda i podzemnih voda. Okvirna direktiva o vodama je glavno evropsko zakonodavstvo koje ima za cilj sprečavanje zagađenja vode. Strategija EU za biodiverzitet do 2030. godine podržava implementaciju cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosisteme.
6-50-methodology: >-
  Osmi akcioni program za životnu sredinu postavlja agendu politike zaštite životne sredine za godine od 2021. do 2030. godine i izričito spominje pitanja vezana za vodu u dva od svojih šest prioritetnih ciljeva. Ova dva cilja su: (1) ostvarivanje ambicije nultog zagađenja za toksično okruženje bez zagađenja, uključujući vazduh, vodu i zemljište i zaštitu zdravlja i dobrobiti građana od rizika i uticaja vezanih za životnu sredinu; i (2) zaštita, očuvanje i obnavljanje biodiverziteta i unapređenje prirodnog kapitala, posebno vazduha, vode, zemljišta i šuma, slatkovodnih, močvarnih i morskih ekosistema.
6-50-long_term_objective: >-
6-60-title: Indeks eksploatacije vode, plus (WEI+)
6-60-definition: >-
  Indeks eksploatacije vode (WEI+) daje mjeru ukupne potrošnje vode kao procenat obnovljivih slatkovodnih resursa dostupnih za datu teritoriju i period. On kvantifikuje koliko se vode zahvata i koliko se vode vraća u životnu sredinu od strane ekonomskih sektora prije ili nakon upotrebe. Razlika između zahvatanja vode i povrata vode smatra se ‘potrošnjom vode’. U nedostatku dogovorenih formalnih ciljeva širom Evrope, vrijednosti iznad 20% se generalno smatraju znakom nestašice vode, dok vrijednosti jednake ili veće od 40% ukazuju na situacije teške nestašice vode, što znači da je korištenje slatkovodnih resursa neodrživo.
6-60-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 6 o čistoj vodi i sanitaciji, koji je ugrađen u prioritete Evropske komisije za period 2024-2029 u okviru „Održavanje kvalitete života: Sigurnost hrane, voda i priroda“. 
  Indikator proizvodi EEA na osnovu podataka iz baze podataka WISE SoE-Water quantity (WISE 3) i drugih otvorenih izvora (Eurostat, OECD), uključujući metode popunjavanja praznina.
  Indikator se može smatrati globalnim SDG indikatorom 6.4.2 "Nivo vodnog stresa: povlačenje slatke vode kao udio dostupnih slatkovodnih resursa".
  Okvirna direktiva o vodama je glavno evropsko zakonodavstvo koje ima za cilj - između ostalog - promovisanje održivog korištenja vode na osnovu dugoročne zaštite dostupnih vodnih resursa. Strategija EU za biodiverzitet do 2030. godine podržava implementaciju cilja Okvirne direktive o vodama zahtijevajući od država članica da obnove slatkovodne ekosisteme.
6-60-methodology: >-
  Osmi akcioni program za životnu sredinu postavlja agendu politike zaštite životne sredine za godine od 2021. do 2030. godine i izričito spominje pitanja vezana za vodu u dva od svojih šest prioritetnih ciljeva. Ova dva cilja su: (1) ostvarivanje ambicije nultog zagađenja za toksično okruženje bez zagađenja, uključujući vazduh, vodu i zemljište i zaštitu zdravlja i dobrobiti građana od rizika i uticaja vezanih za životnu sredinu; i (2) zaštita, očuvanje i obnavljanje biodiverziteta i unapređenje prirodnog kapitala, posebno vazduha, vode, zemljišta i šuma, slatkovodnih, močvarnih i morskih ekosistema.
6-60-long_term_objective: >-
  Dugoročni cilj indikatora SDG_06_60 je osigurati dostupnost i održivo upravljanje vodom i kanalizacijom za sve. To uključuje postizanje univerzalnog pristupa sigurnoj i pristupačnoj vodi za piće, sanitarijama i higijeni, kao i poboljšanje kvaliteta vode i održivo upravljanje vodnim resursima. Indikator je dio ciljeva održivog razvoja EU i koristi se za praćenje napretka ka ovim ciljevima
6-70-title: Pesticidi u rijekama
6-70-definition: >-
  Ovaj indikator mjeri udio prijavljenih vodenih tijela s pesticidima koji prelaze pragove na osnovu Standarda kvalitete okoliša (EQS) za toksičnost izmjerenih pesticida. Pesticidi uključuju i aktivne tvari iz sredstava za zaštitu bilja i biocida, kao i njihove relevantne metabolite, čime se odražavaju tvari koje su stvarno prisutne u vodi i utječu na vodeni svijet. Uključene su samo tvari s definiranim EQS-om.
6-70-intention: >-
  Ovaj indikator se može smatrati sličnim globalnom indikatoru ciljeva održivog razvoja 6.3.2 "Udio vodenih tijela s dobrim kvalitetom vode u okolini".
  Zaštita vodnih resursa, vodnih ekosistema i vode za piće i kupanje je temelj politike EU o zaštiti okoliša. Politika EU o vodama pruža okvir za sveobuhvatno rješavanje zaštite voda i postizanje dobrog statusa kopnenih površinskih voda, prijelaznih voda, priobalnih voda i podzemnih voda. Okvirna direktiva o vodama je glavni evropski zakon koji ima za cilj sprječavanje zagađenja vode, a Strategija EU o biodiverzitetu za 2030. godinu podržava provedbu cilja Okvirne direktive o vodama tako što od država članica zahtijeva da obnove slatkovodne ekosisteme.
6-70-methodology: >-
  Osmi akcioni program za okoliš postavlja agendu politike zaštite okoliša za period od 2021. do 2030. godine i eksplicitno spominje pitanja vezana za vodu u dva od svojih šest prioritetnih ciljeva. Ta dva cilja su: (1) težnja ka nultom zagađenju za okoliš bez toksina, uključujući zrak, vodu i tlo, te zaštita zdravlja i dobrobiti građana od rizika i utjecaja povezanih s okolišem; i (2) zaštita, očuvanje i obnavljanje biodiverziteta i unapređenje prirodnog kapitala, posebno zraka, vode, tla te šumskih, slatkovodnih, močvarnih i morskih ekosistema.
6-70-long_term_objective: >-
7-10-title: Primarna i finalna potrošnja energije
7-10-definition: >-
  Indikator mjeri ukupne energetske potrebe zemlje, isključujući svu neenergetsku upotrebu energenata (npr. prirodni plin koji se ne koristi za sagorijevanje, već za proizvodnju hemikalija).
  „Potrošnja primarne energije“ obuhvata potrošnju energije od strane krajnjih korisnika kao što su industrija, saobraćaj, domaćinstva, usluge i poljoprivreda, plus potrošnju energije samog energetskog sektora za proizvodnju i transformaciju energije, gubitke koji se javljaju tokom transformacije energije (npr. efikasnost proizvodnje električne energije iz zapaljivih goriva) i gubitke prenosa i distribucije energije.
7-10-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  EU provodi međusobno povezani skup mjera "Fit for 55" za postizanje novih klimatskih ciljeva za 2030. godinu i slijedila je novi strateški plan REPowerEU za smanjenje zavisnosti EU od uvoza energije.
7-10-methodology: >-
  Evropski zeleni plan uključuje energetsku efikasnost kao ključnu mjeru za smanjenje međusektorskih emisija stakleničkih plinova. Direktive o energetskoj efikasnosti i obnovljivim izvorima energije postavljaju ambiciozne ciljeve EU koje treba postići do 2030. godine.
7-10-long_term_objective: >-
  Bez opisa
7-20-title: Konačna potrošnja energije u domaćinstvima po stanovniku
7-20-definition: >-
  Indikator mjeri koliko energije svaki građanin troši kod kuće, isključujući energiju koja se koristi za transport. Budući da se indikator odnosi na finalnu potrošnju energije, razmatra se samo energija koju koriste krajnji potrošači. Isključena je povezana potrošnja samog energetskog sektora.
7-20-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji, koji je ugrađen u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
7-20-methodology: >-
  Cilj održivog razvoja 7 poziva na obezbjeđivanje univerzalnog pristupa savremenim energetskim uslugama, poboljšanje energetske efikasnosti i povećanje udjela obnovljive energije. Da bi ubrzale prelazak na pristupačan, pouzdan i održiv energetski sistem, zemlje moraju olakšati pristup istraživanju čiste energije, promovisati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. Domaćinstva čine oko četvrtinu finalne potrošnje energije. Kod kuće ljudi koriste električnu energiju i goriva, posebno za grijanje, hlađenje, toplu vodu, rasvjetu i uređaje
7-20-long_term_objective: >-
  Bez opisa 
7-30-title: Energetska produktivnost
7-30-definition: >-
  Indikator mjeri količinu ekonomske proizvodnje koja se proizvodi po jedinici bruto raspoložive energije. Bruto raspoloživa energija predstavlja količinu energenata neophodnu za zadovoljavanje svih potreba subjekata u razmatranom geografskom području. Ekonomska proizvodnja se daje ili u jedinici eura u lančanim količinama u odnosu na referentnu 2010. godinu po kursevima iz 2010. godine ili u jedinici PPS (Standard kupovne moći).
7-30-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji i cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje.
  Ovaj indikator se može smatrati sličnim globalnom SDG indikatoru 7.3.1 „Energetski intenzitet mjeren u smislu primarne energije i BDP-a“.
  Povećanje energetske produktivnosti, tj. odvajanje ekonomskog rasta od potrošnje energije, ključno je za postizanje cilja održivog razvoja 7 bez nanošenja štete ekonomskom razvoju.
7-30-methodology: >-
  SDG7 je ugrađen u prioritete Evropske komisije pod nazivom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Cilj održivog razvoja 7 poziva na obezbjeđivanje univerzalnog pristupa savremenim energetskim uslugama, poboljšanje energetske efikasnosti i povećanje udjela obnovljive energije. Da bi ubrzale prelazak na pristupačan, pouzdan i održiv energetski sistem, zemlje moraju olakšati pristup istraživanju čiste energije, promovisati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. SDG 12 poziva na sveobuhvatan skup akcija preduzeća, kreatora politika, istraživača i potrošača da se prilagode održivim praksama. Predviđa održivu proizvodnju i potrošnju zasnovanu na naprednim tehnološkim kapacitetima, efikasnosti resursa i smanjenju globalnog otpada.
7-30-long_term_objective: >-
  Bez opisa
7-40-title: Udio obnovljive energije u bruto konačnoj potrošnji energije
7-40-definition: >-
  Indikator mjeri udio potrošnje obnovljive energije u bruto finalnoj potrošnji energije prema Direktivi o obnovljivoj energiji. Bruto finalna potrošnja energije je energija koju koriste krajnji potrošači (finalna potrošnja energije) plus gubici mreže i vlastita potrošnja elektrana.
7-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 7 o pristupačnoj i čistoj energiji i cilju održivog razvoja 13 o klimatskim akcijama; koji su ugrađeni u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Održavanje našeg kvaliteta života: sigurnost hrane, vode i prirode“.
  Indikator se može smatrati identičnim globalnom indikatoru SDG 7.2.1 „Udio obnovljive energije u ukupnoj finalnoj potrošnji energije“.
7-40-methodology: >-
  EU provodi međusobno povezani skup mjera "Fit for 55" za postizanje novih klimatskih ciljeva za 2030. godinu i slijedila je novi strateški plan REPowerEU za smanjenje zavisnosti EU od uvoza energije. Evropski zeleni plan predviđa dekarbonizaciju evropskih energetskih sistema kako bi se postigla klimatska neutralnost do 2050. godine. U tu svrhu EU će se okrenuti potpuno integrisanom, međusobno povezanom i digitalizovanom sistemu obnovljive energije, istovremeno osiguravajući sigurnost snabdijevanja po pristupačnim cijenama. Štaviše, fondovi kohezijske politike EU (2021–2027), uključujući plan oporavka „Next Generation EU“, obezbjeđuju finansiranje investicija u obnovljive izvore energije. Revidirane Direktive o obnovljivim izvorima energije postavljaju ambiciozan cilj EU koji treba postići do 2030. godine.
7-40-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 50.
7-50-title: Ovisnost o uvozu energije
7-50-definition: >-
  Indikator prikazuje udio ukupnih energetskih potreba jedne zemlje pokrivenih uvozom iz drugih zemalja. Izračunava se kao neto uvoz podijeljen sa bruto raspoloživom energijom. Energetska zavisnost = (uvoz – izvoz) / bruto raspoloživa energija.
7-50-intention: >-
  Indikator se koristi za praćenje napretka ka ostvarivanju cilja održivog razvoja 7 o pristupačnoj i čistoj energiji; koji je ugrađen u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Da bi ubrzale prelazak na pristupačan, pouzdan i održiv energetski sistem, zemlje moraju olakšati pristup istraživanju čiste energije, promovisati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije. Energetska zavisnost od uvoza energenata izlaže evropsku ekonomiju nestabilnim cijenama na svjetskom tržištu i riziku od nestašice u snabdijevanju, na primer, zbog geopolitičkih sukoba. Rizici se povećavaju zavisnošću od pojedinačnih zemalja, npr. određenih infrastrukturom za snabdijevanje.
7-50-methodology: >-
  Postoji nekoliko relevantnih politika EU za ovaj indikator. Strategija energetske sigurnosti navodi potrebu za unapređenjem domaće proizvodnje energije, uključujući potrebu za povećanjem lokalne proizvodnje obnovljive energije, energetske efikasnosti i obezbjeđenjem nedostajuće infrastrukture. Štaviše, fondovi kohezijske politike EU (2021–2027), uključujući plan oporavka „Next Generation EU“, obezbjeđuju finansiranje investicija u obnovljive izvore energije. REPowerEU je novi strateški plan za smanjenje zavisnosti EU od uvoza energije, posebno iz Rusije, zbog nesigurnosti i visokih cijena nakon ruske invazije na Ukrajinu. Direktive o energetskoj efikasnosti i obnovljivim izvorima energije postavljaju ambiciozne ciljeve EU koje treba postići do 2030. godine.
7-50-long_term_objective: >-
  Bez opisa
7-60-title: Stanovništvo koje ne može adekvatno zagrijati svoj dom
7-60-definition: >-
  Indikator meri udio stanovništva koje nije u mogućnosti da priušti adekvatno grijanje doma. Podaci za ovaj indikator prikupljaju se u okviru Statistike Evropske unije o prihodima i uslovima života (EU-SILC) za praćenje razvoja siromaštva i socijalne inkluzije u EU. Prikupljanje podataka se zasniva na anketi, što znači da se vrijednosti indikatora prijavljuju samostalno.
7-60-intention: >-
  Indikator se koristi za praćenje napretka ka ostvarivanju cilja održivog razvoja 7 o pristupačnoj i čistoj energiji; koji je ugrađen u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Da bi ubrzale prelazak na pristupačan, pouzdan i održiv energetski sistem, zemlje moraju olakšati pristup istraživanju čiste energije, promovisati ulaganja u energetsku infrastrukturu i tehnologiju čiste energije.
  Evropski stub socijalnih prava navodi energiju među osnovnim uslugama kojima bi svi trebali imati pristup. Sa Opservatorijom EU za energetsko siromaštvo, EU nastoji pomoći državama članicama u njihovim naporima da smanje energetsko siromaštvo i osiguraju pristup pristupačnoj energiji.
7-60-methodology: >-
  Akcioni plan za pristupačnu energiju predlaže mjere za stabilizaciju cijena energije, osiguranje sigurnosti snabdijevanja i pokretanje energetske tranzicije. Evropski stub socijalnih prava navodi energiju među osnovnim uslugama kojima bi svi trebali imati pristup. Evropski ekonomski i socijalni odbor (EESC) procjenjuje njegovo stanje. Savjetodavni centar EU za energetsko siromaštvo je inicijativa koja pruža centralnu platformu stručnosti za energetsko siromaštvo za lokalne vlasti i druge zainteresovane strane.
7-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0.
8-10-title: Realni BDP po glavi stanovnika
8-10-definition: >-
  Indikator se izračunava kao odnos realnog BDP-a (BDP prilagođen inflaciji) i prosječnog stanovništva određene godine, gdje se BDP izražava u milionima, a stanovništvo u hiljadama. Realni BDP se objavljuje bez decimala.
8-10-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“ i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator se može smatrati identičnim globalnom indikatoru SDG 8.1.1 "Godišnja stopa rasta realnog BDP-a po glavi stanovnika".
8-10-methodology: >-
  BDP mjeri vrijednost ukupne konačne proizvodnje dobara i usluga koje je proizvela neka ekonomija u određenom vremenskom periodu. Uključuje robu i usluge koje imaju tržišta (ili koje bi mogle imati tržišta) i proizvode koje proizvode opšta vlada i neprofitne institucije. To je mjera ekonomske aktivnosti i obično se koristi kao zamjena za razvoj materijalnog životnog standarda zemlje. Međutim, to nije potpuna mjera ekonomskog blagostanja. Na primjer, BDP ne uključuje većinu neplaćenih poslova u domaćinstvu. BDP također ne uzima u obzir negativne efekte ekonomske aktivnosti, kao što je degradacija okoliša.
8-10-long_term_objective: >-
  Dugoročni cilj Indikatora je jačanje kapaciteta domaćih finansijskih institucija da podstaknu i prošire pristup bankarskim, osiguravajućim i finansijskim uslugama za sve.
8-11-title: Udio investicija u BDP-u
8-11-definition: >-
  Indikator se izračunava kao odnos realnog BDP-a (BDP prilagođen inflaciji) i prosječnog stanovništva određene godine, gdje se BDP izražava u milionima, a stanovništvo u hiljadama. Realni BDP se objavljuje bez decimala.
8-11-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“ i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator se može smatrati identičnim globalnom indikatoru SDG 8.1.1 "Godišnja stopa rasta realnog BDP-a po glavi stanovnika".
8-11-methodology: >-
  BDP mjeri vrijednost ukupne konačne proizvodnje dobara i usluga koje je proizvela neka ekonomija u određenom vremenskom periodu. Uključuje robu i usluge koje imaju tržišta (ili koje bi mogle imati tržišta) i proizvode koje proizvode opšta vlada i neprofitne institucije. To je mjera ekonomske aktivnosti i obično se koristi kao zamjena za razvoj materijalnog životnog standarda zemlje. Međutim, to nije potpuna mjera ekonomskog blagostanja. Na primjer, BDP ne uključuje većinu neplaćenih poslova u domaćinstvu. BDP također ne uzima u obzir negativne efekte ekonomske aktivnosti, kao što je degradacija okoliša.
8-11-long_term_objective: >-
  Dugoročni cilj indikatora SDG_08_11 je mjerenje učešća investicija u BDP-u.
8-20-title: Mladi koji nisu zaposleni niti uključeni u obrazovanje ili obuku
8-20-definition: >-
  Indikator mjeri udio stanovništva u dobi od 15 do 29 godina koje nije zaposleno i nije uključeno u obrazovanje ili obuku.
  Brojilac indikatora odnosi se na osobe koje ispunjavaju sljedeća dva uslova: (a) nisu zaposlene (tj. nezaposlene ili izvan radne snage prema definiciji Međunarodne organizacije rada) i (b) nisu stekle nikakvo obrazovanje ili obuku (tj. ni formalno ni neformalno) u četiri sedmice koje prethode Anketi o radnoj snazi (LFS).
8-20-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu i cilju održivog razvoja 4 o osiguravanju inkluzivnog i kvalitetnog obrazovanja za sve, koji su ugrađeni u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“ i „Novi plan za održivi prosperitet i konkurentnost Evrope“.
  Ovaj indikator se može smatrati identičnim globalnom indikatoru SDG 8.6.1 "Udio mladih (u dobi od 15-24 godine) koji nisu u obrazovanju, zapošljavanju ili obuci". Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
8-20-methodology: >-
  Evropski stub socijalnih prava, koji su zajednički proglasili Evropska komisija, Evropski parlament i Evropsko vijeće 2017. godine, utvrđuje 20 ključnih principa i prava od suštinskog značaja za pravedna i dobro funkcionišuća tržišta rada i sisteme socijalne zaštite. Evropski akcioni plan za stub socijalnih prava, usvojen 2021. godine, pretvara principe u konkretne akcije u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78% stanovništva u dobi od 20 do 64 godine koji EU treba postići do 2030. godine. U prilog tome, Akcioni plan predlaže da se do 2030. godine prepolovi jaz u zaposlenosti među spolovima u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili obuci (NEET) u dobi od 15 do 29 do 9%.
8-20-long_term_objective: >-
  Dugoročni cilj indikatora 0 je osigurati da 8% stanovništva u dobi od 15 do 29 godina nije zaposleno niti uključeno u obrazovanje ili obuku.
8-30-title: Stopa zaposlenosti
8-30-definition: >-
  Indikator mjeri udio stanovništva u dobi od 20 do 64 godine koje je zaposleno. Zaposlena lica su definisana kao lica koja su tokom referentne sedmice radila najmanje jedan sat za platu ili profit ili nisu radila, ali su imala poslove sa kojih su bila privremeno odsutna.
8-30-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“ i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“. SDG 8 poziva, između ostalog, na pružanje mogućnosti za puno i produktivno zapošljavanje i pristojan rad za sve.
  Zapošljavanje i druga pitanja vezana za tržište rada su u središtu društvene i političke rasprave u EU. Plaćeno zaposlenje je ključno za osiguranje dovoljnog životnog standarda i pruža neophodnu osnovu ljudima za postizanje njihovih ličnih ciljeva i težnji. Štaviše, zapošljavanje doprinosi ekonomskim performansama, kvalitetu života i socijalnoj inkluziji, što ga čini kamenom temeljcem društveno-ekonomskog razvoja i blagostanja.
8-30-methodology: >-
  Evropski stub socijalnih prava postavlja 20 ključnih principa i prava od suštinskog značaja za pravedna i dobro funkcionišuća tržišta rada i sisteme socijalne zaštite. Evropski akcioni plan za stub socijalnih prava, usvojen 2021. godine, pretvara principe u konkretne akcije u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78% stanovništva u dobi od 20 do 64 godine koji EU treba postići do 2030. godine. U prilog tome, Akcioni plan predlaže da se do 2030. godine prepolovi jaz u zaposlenosti među spolovima u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili obuci (NEET) u dobi od 15 do 29 do 9%.
8-30-long_term_objective: >-
8-40-title: Stopa dugotrajne nezaposlenosti
8-40-definition: >-
  Indikator mjeri udio stanovništva u radnoj snazi u dobi od 15 do 74 godine koje je nezaposleno 12 mjeseci ili više. Stanovništvo u radnoj snazi su oni koji su ili zaposleni ili nezaposleni. Nezaposlene osobe su definisane kao osobe u dobi od 15 do 74 godine koje su bile bez posla tokom referentne sedmice, trenutno su bile dostupne za početak rada u naredne dvije sedmice i ili su aktivno tražile posao u posljednje četiri sedmice ili su već pronašle posao za početak rada u naredna tri mjeseca. Period nezaposlenosti se definiše kao trajanje traženja posla, odnosno kao vrijeme koje je proteklo od zadnjeg zaposlenja (ako je kraće od vremena provedenog na traženju posla).
8-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu, koji je ugrađen u prioritete Evropske komisije pod „Novi plan za održivi prosperitet i konkurentnost Evrope“ i „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
  Evropski stub socijalnih prava postavlja niz ključnih principa i prava za podršku pravednim i dobro funkcionirajućim tržištima rada i sistemima socijalne zaštite. Služi kao kompas za obnovljeni proces konvergencije ka boljim radnim i životnim uslovima među državama članicama učesnicama. Prvenstveno je zamišljen za eurozonu, ali je primjenjiv na sve države članice koje žele učestvovati. Pristup aktivnog uključivanja je preporuka Komisije da se svakom građaninu, posebno onima u najnepovoljnijem položaju, omogući da u potpunosti učestvuje u društvu, uključujući i zapošljavanje.
8-40-methodology: >-
  Evropski stub socijalnih prava postavlja 20 ključnih principa i prava od suštinskog značaja za pravedna i dobro funkcionišuća tržišta rada i sisteme socijalne zaštite. Evropski akcioni plan za stub socijalnih prava, usvojen 2021. godine, pretvara principe u konkretne akcije u korist građana. Također predlaže ambiciozan cilj zapošljavanja od 78% stanovništva u dobi od 20 do 64 godine koji EU treba postići do 2030. godine. U prilog tome, Akcioni plan predlaže da se do 2030. godine prepolovi jaz u zaposlenosti među spolovima u odnosu na 2019. godinu i da se do 2030. godine smanji stopa mladih koji nisu zaposleni niti u obrazovanju ili obuci (NEET) u dobi od 15 do 29 do 9%.
8-40-long_term_objective: >-
8-60-title: Smrtonosne nesreće na radu na 100 000 radnika
8-60-definition: >-
  Indikator mjeri broj nesreća sa smrtnim ishodom koje se dogode tokom rada i dovedu do smrti žrtve u roku od jedne godine od nesreće. Stopa incidencije odnosi se na broj nesreća sa smrtnim ishodom na 100 000 zaposlenih osoba.
8-60-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 8 o dostojanstvenom radu i ekonomskom rastu i cilju održivog razvoja 3 o dobrom zdravlju i dobrobiti.
  Indikator se može smatrati sličnim globalnom SDG indikatoru 8.8.1 „Povrede na radu sa smrtnim ishodom i bez smrtnog ishoda na 100.000 radnika, prema spolu i migrantskom statusu“.
8-60-methodology: >-
  Nacionalni izvori „Evropske statistike o nesrećama na radu (ESAW)“ su izjave poslodavaca o nesrećama na radu, bilo relevantnim osiguravajućim društvima, nacionalnom sistemu socijalne sigurnosti, inspekcijama rada ili sličnim nacionalnim organima.
  Direktiva o transparentnim i predvidivim uslovima rada u Evropskoj uniji postavlja minimalne standarde o uslovima rada. Strateški okvir EU za zdravlje i sigurnost na radu 2021-2027. godine utvrđuje ključne prioritete za poboljšanje zdravlja i sigurnosti radnika.
8-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0
9-10-title: 'Bruto domaća potrošnja za istraživanje i razvoj (R&D)'
9-10-definition: >-
  Indikator mjeri bruto domaće troškove za istraživanje i razvoj (GERB) kao procenat bruto domaćeg proizvoda (BDP) — koji se naziva i intenzitet istraživanja i razvoja. OECD-ov Frascati priručnik: Smjernice za prikupljanje i izvještavanje o podacima o istraživanju i eksperimentalnom razvoju definiše istraživanje i eksperimentalni razvoj (R&D) kao kreativan i sistematičan rad koji se preduzima u cilju povećanja zaliha znanja — uključujući znanje o čovječanstvu, kulturi i društvu — i osmišljavanja novih primjena dostupnog znanja.
9-10-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 9 na izgradnji otporne infrastrukture, promovisanju inkluzivne i održive industrijalizacije i podsticanju inovacija koje su ugrađene u prioritete Evropske komisije 2024-2029 u okviru „Nove ere za evropsku odbranu i sigurnost“.
  Indikator se može smatrati identičnim globalnom indikatoru SDG 9.5.1 „Izdaci za istraživanje i razvoj kao udio BDP-a“.
9-10-methodology: >-
  Nova vizija Evropskog istraživačkog prostora (ERA) ima za cilj izgradnju zajedničkog naučnog i tehnološkog prostora za EU, davanjem prioriteta ulaganjima i reformama, poboljšanjem pristupa izvrsnosti, prevođenjem rezultata istraživanja i inovacija u ekonomiju i produbljivanjem ERA-E. EU ima dugogodišnji cilj povećanja intenziteta istraživanja i razvoja na 3% BDP-a, što je potvrđeno u Preporuci Vijeća o Paktu za istraživanje i inovacije u Evropi iz novembra 2021. godine.
9-10-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 3.3
9-30-title: 'Osoblje za istraživanje i razvoj (R&D)'
9-30-definition: >-
  Indikator mjeri udio osoblja za istraživanje i razvoj u sljedećim institucionalnim sektorima: poslovno preduzeće (BES), vlada (GOV), visoko obrazovanje (HES) i privatna neprofitna organizacija (PNP). Podaci su prikazani u ekvivalentima punog radnog vremena kao udio radne snage.
9-30-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 9 na izgradnji otporne infrastrukture, promovisanju inkluzivne i održive industrijalizacije i podsticanju inovacija koje su ugrađene u prioritete Evropske komisije 2024-2029 u okviru „Nove ere za evropsku odbranu i sigurnost“.
  Indikator se može smatrati sličnim globalnom SDG indikatoru 9.5.2 "Istraživači (u ekvivalentu punog radnog vremena) na milion stanovnika"
9-30-methodology: >-
  Istraživanje i razvoj i inovacije su glavni pokretači konkurentnosti i zapošljavanja u ekonomiji zasnovanoj na znanju. Veća ulaganja u istraživanje i razvoj pružaju nova radna mjesta u poslovanju i akademskoj zajednici, povećavajući potražnju za naučnicima i istraživačima na tržištu rada.
9-30-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 2.
9-40-title: Prijave patenata Evropskom uredu za patente
9-40-definition: >-
  Ovaj indikator mjeri zahtjeve za zaštitu izuma podnesene Evropskom patentnom uredu (EPO) bez obzira na to da li su odobreni ili ne. Prijave se dodjeljuju prema zemlji prebivališta prvog podnosioca prijave navedenog na obrascu prijave (princip prvoimenovanog podnosioca prijave), kao i prema zemlji prebivališta pronalazača.
  Podaci pokazuju ukupan broj prijava po zemlji i na milion stanovnika (koristeći prosječno stanovništvo referentne godine kao nazivnik).
9-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 9 na izgradnji otporne infrastrukture, promovisanju inkluzivne i održive industrijalizacije i podsticanju inovacija koje su ugrađene u prioritete Evropske komisije 2024-2029 u okviru „Nove ere za evropsku odbranu i sigurnost“.
  Zahtjevi za zaštitu pronalaska upućeni ili direktno Evropskom patentnom uredu (EPO) ili podneseni prema Ugovoru o saradnji na području patenata i imenovanju EPO-a (Euro-PCT), bez obzira na to da li su odobreni ili ne. Prijave patenata se dodjeljuju prema zemlji prebivališta podnosioca prijave navedenoj na obrascu prijave. U slučajevima kada je na obrascu zahtjeva navedeno nekoliko podnosilaca zahtjeva, primjenjuje se zemlja prebivališta prvog navedenog podnosioca zahtjeva. Zemlja prebivališta (prvog) podnosioca prijave nije nužno ista kao i zemlja prebivališta pronalazača.
9-40-methodology: >-
  Patenti odražavaju inventivnu aktivnost zemlje. Patenti također pokazuju sposobnost zemalja i njihovih preduzeća da iskoriste znanje i rezultate istraživanja i pretoče ih u potencijalne ekonomske koristi. U tom kontekstu, indikatori zasnovani na statistici patenata pružaju vrijednu mjeru inventivnog učinka zemalja.
9-40-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 240.
9-50-title: Udio autobusa i vozova u unutrašnjem putničkom saobraćaju
9-50-definition: >-
  Ovaj indikator mjeri udio autobusa, uključujući autobuse i trolejbuse, i vozova u unutrašnjem putničkom saobraćaju, izražen u putničkim kilometrima (pkm). Putnički prevoz ovdje uključuje prevoz putničkim automobilima, autobusima i vozovima, ali ne uključuje unutrašnje plovne puteve, vazdušni i pomorski prevoz. Svi podaci se zasnivaju na kretanjima unutar nacionalnih teritorija, bez obzira na nacionalnost vozila. Podaci o putevima potiču iz dobrovoljnog prikupljanja i nisu u potpunosti usklađeni na nivou EU. Sistemi tramvaja i metroa nisu uključeni jer metodologija prikupljanja podataka za ova prevozna sredstva nije dovoljno usklađena između država članica.
9-50-intention: >-
  Indikatori koji se koriste za praćenje napretka ka cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promovisanju inkluzivne i održive industrijalizacije i podsticanju inovacija i ka cilju održivog razvoja 11 o stvaranju gradova i ljudskih naselja inkluzivnim, sigurnim, otpornim i održivim, koji su ugrađeni u prioritete Evropske komisije 2024-2029. godine pod „Nova era za evropsku odbranu i sigurnost“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje našeg kvaliteta života: sigurnost hrane, voda i priroda“ i „Zaštita naše demokratije, održavanje naših vrijednosti“.
  Indikator se može smatrati sličnim globalnom indikatoru SDG 9.1.2 "Količine putnika i tereta, prema načinu transporta".
9-50-methodology: >-
  Preispitivanje buduće mobilnosti uključuje optimizaciju upotrebe svih vidova transporta, dijeljenje automobila i multimodalnu integraciju između različitih vidova kolektivnog transporta kao što su voz, tramvaj, metro, autobus i taksi.
  Komisija je 2020. godine usvojila „Strategiju održive i pametne mobilnosti“ zajedno sa Akcionim planom od 82 inicijative. Ova strategija postavlja temelje kako transportni sistem EU može postići svoju zelenu i digitalnu transformaciju i postati otporniji na buduće krize. Kao što je navedeno u Evropskom zelenom planu, cilj će biti smanjenje emisija od 90% do 2050. godine, koje će se ostvariti pametnim, konkurentnim, sigurnim, pristupačnim i pristupačnim transportnim sistemom.
9-50-long_term_objective: >-
9-60-title: Udio željeznice i unutrašnjih plovnih puteva u unutrašnjem transportu tereta
9-60-definition: >-
  Ovaj indikator mjeri udio željeznice i unutrašnjih plovnih puteva u unutrašnjem teretnom saobraćaju, izražen u tonskim kilometrima (tkm).
  Unutrašnji teretni saobraćaj obuhvata cestovni, željeznički i unutrašnji plovni put. Svi podaci se zasnivaju na kretanjima na nacionalnoj teritoriji; železnički i unutrašnji plovni putevi se prikupljaju na osnovu kretanja na nacionalnoj teritoriji, bez obzira na nacionalnost voza ili plovila.
  Djelatnost cestovnog saobraćaja prikuplja se prema zemlji registracije vozila, bez obzira na teritoriju na kojoj se djelatnost obavlja. Aktivnost se preraspodjeljuje na teritoriju na kojoj se aktivnost zapravo obavlja modeliranjem vjerovatnog itinerera putovanja na evropskoj putnoj mreži. Trenutno nije uključen ni pomorski ni vazdušni teretni saobraćaj.
9-60-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 9 na izgradnji otporne infrastrukture, promovisanju inkluzivne i održive industrijalizacije i podsticanju inovacija koje su ugrađene u prioritete Evropske komisije 2024-2029 u okviru „Nove ere za evropsku odbranu i sigurnost“.
  Indikator se može smatrati sličnim globalnom indikatoru SDG 9.1.2 "Količine putnika i tereta, prema načinu transporta".
9-60-methodology: >-
  Iako je slobodno kretanje robe bitna komponenta unutrašnjeg tržišta EU i važno za održavanje konkurentnosti evropske industrije i usluga, transport treba organizovati na ekološki prihvatljiv način.
  Ova strategija postavlja temelje kako transportni sistem EU može postići svoju zelenu i digitalnu transformaciju i postati otporniji na buduće krize. Kao što je navedeno u Evropskom zelenom planu, cilj će biti smanjenje emisija od 90% do 2050. godine, koje će se ostvariti pametnim, konkurentnim, sigurnim, pristupačnim i pristupačnim transportnim sistemom.
9-60-long_term_objective: >-
9-70-title: Intenzitet emisije u zrak u industriji
9-70-definition: >-
  Ovaj indikator mjeri intenzitet emisija čestica (PM10 i PM2.5) iz proizvodnog sektora (NACE Rev. 2 sektor „C“). Emisije u zrak se definišu kao tokovi gasovitih i čestica materijala koji se emituju u atmosferu. 
  Sitne i krupne čestice (PM10) su manje od 10 mikrometara u prečniku i mogu se nositi duboko u pluća, gdje mogu izazvati upalu i pogoršati stanje ljudi koji pate od bolesti srca i pluća. Fine čestice (PM2.5) su manje od 2,5 mikrometara u prečniku i stoga su podskup čestica PM10. Njihovi negativni uticaji na zdravlje su ozbiljniji od PM10 jer se mogu uvući dalje u pluća i mogu biti toksičniji. 
  Intenzitet emisije se izračunava dijeljenjem emisija PM sektora sa njegovom bruto dodanom vrijednošću (BDV), koja se definiše kao proizvodnja (u osnovnim cijenama) umanjena za intermedijarnu potrošnju (u kupovnim cijenama)
9-70-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 9 u industriji, inovacijama i infrastrukturi, koji je ugrađen u prioritete Evropske komisije za period 2024-2029. godine pod nazivom „Nova era za evropsku odbranu i sigurnost“.
9-70-methodology: >-
  SDG 9 prepoznaje važnost tehnološkog napretka i inovacija za pronalaženje trajnih rješenja za društvene, ekonomske i ekološke izazove kao što su otvaranje novih radnih mjesta i promocija resursne i energetske efikasnosti. Da bi se podstakle inovacije i preduzetništvo, SDG 9 takođe nastoji da poveća pristup finansijskim uslugama za mala preduzeća i da premosti digitalni jaz povećanjem pristupa informacionim i komunikacionim tehnologijama.
  Sa svojim Čistim industrijskim dogovorom iz februara 2025. godine, Evropska komisija iznosi konkretne akcije za pretvaranje dekarbonizacije u pokretač rasta evropskih industrija. To uključuje snižavanje cijena energije, stvaranje kvalitetnih radnih mjesta i prave uslove za napredak kompanija.
9-70-long_term_objective: >-
  Dugoročni cilj indikatora je mjerenje napretka ka cilju osiguranja zdravog života i promovisanja dobrobiti za sve u svim uzrastima.
10-10-title: BDP po glavi stanovnika prilagođen kupovnoj moći
10-10-definition: >-
  Bruto domaći proizvod (BDP) je mjera ekonomske aktivnosti. Odnosi se na vrijednost ukupne proizvodnje robe i usluga koje proizvodi ekonomija, umanjenu za intermedijarnu potrošnju, plus neto poreze na proizvode i uvoz. BDP po glavi stanovnika se izračunava kao odnos BDP-a i prosječnog stanovništva u određenoj godini. Osnovne brojke izražene su u standardima kupovne moći (PPS), koji predstavljaju zajedničku valutu koja eliminiše razlike u nivoima cijena između zemalja kako bi se omogućilo smisleno poređenje obima BDP-a.
10-10-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
  Indikator se može smatrati identičnim globalnom indikatoru SDG 8.1.1 "Godišnja stopa rasta realnog BDP-a po glavi stanovnika". Nadalje, indikator je i indikator uticaja za Strateški plan 2020-2024 koji se odnosi na 10 prioriteta Komisije.
10-10-methodology: >-
  Indikator je relevantan i u kontekstu nedavno usvojenog Evropskog stuba za socijalna prava, koji postavlja niz ključnih principa za podršku pravednim i dobro funkcionišućim tržištima rada i sistemima socijalne zaštite. Ti principi se bave temama vezanim za nejednakost, rješavanjem i nejednakosti ishoda (nejednakost prihoda i bogatstva) i nejednakosti mogućnosti: od određivanja plaća do sistema socijalne zaštite (uključujući minimalni dohodak), rodne ravnopravnosti, omogućavanja socijalnih usluga, brige o djeci i podrške djeci, prihoda od starosti, zdravstvene zaštite i pristupa stanovanju.
10-10-long_term_objective: >-
  Dugoročni cilj indikatora je progresivno postizanje i održavanje rasta prihoda najnižih 40 posto stanovništva po stopi većoj od nacionalnog prosjeka do 2030. godine.
10-20-title: Nejednakosti u dohotku domaćinstava po stanovniku
10-20-definition: >-
  Indikator odražava kupovnu moć domaćinstava i njihovu sposobnost da ulažu u dobra i usluge ili štede za budućnost, uzimajući u obzir poreze i socijalne doprinose i novčana socijalna davanja u naturi. Izračunava se kao prilagođeni bruto raspoloživi dohodak domaćinstava i neprofitnih institucija koje služe domaćinstvima (NPISH) podijeljen sa paritetima kupovne moći (PPP) stvarne individualne potrošnje domaćinstava i ukupnom rezidentnom populacijom.
10-20-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 10 o smanjenju nejednakosti unutar i između zemalja i cilju održivog razvoja 1 o iskorjenjivanju siromaštva u svim njegovim oblicima svugdje, koji je ugrađen u prioritete Evropske komisije pod "Podrška ljudima, jačanje naših društava i našeg socijalnog modela".
10-20-methodology: >-
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava. Evropski stub za socijalna prava, usvojen 2017. godine, utvrđuje niz ključnih principa za podršku pravednim i dobro funkcionalnim tržištima rada i sistemima socijalne zaštite. Ti principi se bave temama vezanim za nejednakost, rješavanjem i nejednakosti ishoda (nejednakost prihoda i bogatstva) i nejednakosti mogućnosti: od određivanja plaća do sistema socijalne zaštite (uključujući minimalni dohodak), rodne ravnopravnosti, omogućavanja socijalnih usluga, brige o djeci i podrške djeci, prihoda od starosti, zdravstvene zaštite i pristupa stanovanju.
  Dok se BDP po glavi stanovnika koristi za mjerenje ekonomskih performansi zemlje, bruto raspoloživi prihod domaćinstava pruža indikaciju prosječnog materijalnog blagostanja ljudi. Indikator stoga mjeri da li se države članice EU konvergiraju u smislu prihoda ljudi.
10-20-long_term_objective: >-
10-30-title: Relativni medijan jaza rizika od siromaštva
10-30-definition: >-
  Indikator se izračunava kao udaljenost između medijana ekvivalentnog ukupnog neto dohotka osoba ispod praga rizika od siromaštva i samog praga rizika od siromaštva, izraženog kao procenat praga rizika od siromaštva. Ovaj prag je postavljen na 60% nacionalnog medijana ekvivalentnog raspoloživog dohotka svih ljudi u zemlji, a ne za EU u cjelini.
10-30-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
   Evropski stub socijalnih prava postavlja 20 ključnih principa za podršku pravednim i dobro funkcionirajućim tržištima rada i sistemima socijalne zaštite. Ovi principi se bave temama vezanim za nejednakost rješavanjem i nejednakosti ishoda i nejednakosti mogućnosti: od određivanja plaća do sistema socijalne zaštite, rodne ravnopravnosti, omogućavanja socijalnih usluga, brige o djeci i podrške djeci, prihoda od starosti, zdravstvene zaštite i pristupa stanovanju.
10-30-methodology: >-
  Akcioni plan za evropski stub socijalnih prava pretvara principe evropskog stuba socijalnih prava u konkretne akcije u korist građana. Predlaže glavne ciljeve u vezi sa stopom zaposlenosti, učešćem odraslih u učenju i rizikom od siromaštva i socijalne isključenosti koje EU treba da postigne do 2030. godine.
  Evropski semestar je ključni alat za ostvarivanje Stuba i koordinira ekonomske i fiskalne politike država članica EU. U okviru svog Zelenog plana, Evropska komisija je najavila da će se evropski semestar preusmjeriti na integraciju ciljeva održivog razvoja i stavljanje održivosti i dobrobiti građana u središte ekonomske politike.
10-30-long_term_objective: >-
  SDG 10 poziva nacije da prilagode politike i zakonodavstvo kako bi povećale prihod donjih 40% stanovništva i smanjile nejednakosti na osnovu prihoda, spola, starosti, invaliditeta, rase, klase, etničke pripadnosti, religije i mogućnosti.
10-41-title: Nejednakost u dohotku - omjer udjela dohotka po kvintilima
10-41-definition: >-
  Indikator je mjera nejednakosti raspodjele dohotka. Izračunava se kao odnos ukupnog dohotka koji prima 20% stanovništva s najvišim dohotkom (gornji kvintil) i onog koji prima 20% stanovništva s najnižim dohotkom (donji kvintil).
  Svi prihodi se sastavljaju kao ekvivalentni raspoloživi prihodi.
10-41-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“. SDG 10 poziva nacije da prilagode politike i zakonodavstvo kako bi povećale prihod donjih 40% stanovništva i smanjile nejednakosti na osnovu prihoda, spola, starosti, invaliditeta, rase, klase, etničke pripadnosti, religije i mogućnosti.
  Indikator je uključen kao glavni indikator u Pregled socijalnih indikatora za Evropski stub socijalnih prava.
10-41-methodology: >-
  Jedan od ciljeva socijalnih politika u EU je smanjenje nejednakosti pružanjem jednakih mogućnosti za sve. Analiza nejednakosti raspodjele dohotka jedan je od načina mjerenja nejednakosti unutar zemalja EU. Kao mjera nejednakosti raspodjele dohotka unutar zemlje, indikator nadopunjuje indikatore o udjelu dohotka najnižih 40% i o riziku od jaza u siromaštvu.
10-41-long_term_objective: >-
10-50-title: Udio prihoda donjih 40% stanovništva
10-50-definition: >-
  Indikator mjeri udio prihoda koji je primilo donjih 40% stanovništva. Koncept prihoda koji se koristi je ukupni raspoloživi dohodak domaćinstva.
10-50-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“. 
  Indikator se može smatrati sličnim globalnom indikatoru SDG 10.1.1 "Stope rasta rashoda domaćinstava ili prihoda po glavi stanovnika među donjih 40 posto stanovništva i ukupnog stanovništva".
  Indikator je relevantan za mjerenje ukupne promjene životnog standarda onih sa najnižim prihodima tokom niza godina.
   Evropski stub socijalnih prava postavlja 20 ključnih principa za podršku pravednim i dobro funkcionirajućim tržištima rada i sistemima socijalne zaštite. Ovi principi se bave temama vezanim za nejednakost rješavanjem i nejednakosti ishoda i nejednakosti mogućnosti: od određivanja plaća do sistema socijalne zaštite, rodne ravnopravnosti, omogućavanja socijalnih usluga, brige o djeci i podrške djeci, prihoda od starosti, zdravstvene zaštite i pristupa stanovanju.
10-50-methodology: >-
  Akcioni plan za evropski stub socijalnih prava pretvara principe evropskog stuba socijalnih prava u konkretne akcije u korist građana. Predlaže glavne ciljeve u vezi sa stopom zaposlenosti, učešćem odraslih u učenju i rizikom od siromaštva i socijalne isključenosti koje EU treba da postigne do 2030. godine.
  Evropski semestar je ključni alat za ostvarivanje Stuba i koordinira ekonomske i fiskalne politike država članica EU. U okviru svog Zelenog plana, Evropska komisija je najavila da će se evropski semestar preusmjeriti na integraciju ciljeva održivog razvoja i stavljanje održivosti i dobrobiti građana u središte ekonomske politike.
  Evropski socijalni fond (ESF) je glavni instrument EU za ulaganje u ljude od usvajanja Rimskog ugovora. Pomaže u rješavanju nejednakosti, kako u smislu ishoda tako i mogućnosti, finansiranjem akcija u oblastima zapošljavanja, socijalne inkluzije, obrazovanja, obuke i reformi administrativnih kapaciteta. Revidirani Evropski socijalni fond plus (ESF+), sa budžetom od 101 milijarde eura u okviru Višegodišnjeg finansijskog okvira 2021–2027, dodatno će pomoći u smanjenju nejednakosti.
10-50-long_term_objective: >-
10-60-title: Zahtjevi za azil
10-60-definition: >-
  Indikator prikazuje broj podnosilaca zahtjeva za azil po prvi put na milion stanovnika i broj pozitivnih prvostepenih odluka na milion stanovnika. Imajte na umu da je potreban oprez prilikom poređenja ove dvije vrijednosti, jer prijave primljene u određenoj godini možda neće biti obrađene do kasnije godine.
10-60-intention: >-
  Cilj održivog razvoja 10 ima za cilj smanjenje nejednakosti unutar i između zemalja; što je ugrađeno u prioritete Evropske komisije pod „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“. SDG 10, između ostalog, nastoji da promoviše socijalnu inkluziju na globalnom nivou kroz olakšavanje sigurne, uredne i regularne migracije i smanjenje transakcionih troškova doznaka migranata.
  Centar znanja Evropske komisije za migracije i demografiju pruža analizu znanja i dokaza za razvoj politika i odluke u vezi sa spašavanjem života migranata i osiguranjem vanjskih granica, jačanjem zajedničke politike azila i razvojem nove politike o zakonitoj migraciji. Fond za azil, migracije i integraciju pruža finansijsku podršku ovim aktivnostima.
10-60-methodology: >-
  Fond za evropsku pomoć najugroženijima (FEAD) pruža podršku tražiocima azila pružajući im trenutnu pomoć (hranu, odjeću i druge bitne predmete za ličnu upotrebu).
  Predložene Evropske snage solidarnosti će omogućiti mladim ljudima širom EU da volontiraju svoju pomoć za prihvat i integraciju izbjeglica.
10-60-long_term_objective: >-
11-11-title: Stepen ozbiljnog stambenog nedostatka
11-11-definition: >-
  Stopa teške stambene deprivacije definira se kao postotak stanovništva koje živi u stambenom objektu koji se smatra prenaseljenim, a istovremeno pokazuje barem jednu od sljedećih mjera stambene deprivacije: i) krov koji prokišnjava, ii) nema kade/tuša i nema toaleta u zatvorenom prostoru, iii) smatra se previše mračnim.
11-11-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​te prema Cilju održivog razvoja 1 o višedimenzionalnom siromaštvu. Cilj održivog razvoja 11 ugrađen je u prioritete Evropske komisije pod nazivom „Novo doba za evropsku odbranu i sigurnost“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje našeg kvaliteta života: sigurnost hrane, voda i priroda“ i „Zaštita naše demokratije, poštovanje naših vrijednosti“. Cilj održivog razvoja 1 ugrađen je u prioritete Evropske komisije pod nazivom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
11-11-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i drugim, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš.
  Cilj održivog razvoja 1, između ostalog, poziva na iskorjenjivanje ekstremnog siromaštva i na smanjenje relativnog siromaštva i ugrađen je u prioritete Evropske komisije u okviru "Ekonomije koja radi za ljude".
11-11-long_term_objective: >-
11-20-title: Stanovništvo koje živi u kućanstvima pogođenim bukom
11-20-definition: >-
  Indikator mjeri udio stanovništva koji izjavljuje da je pogođen bukom od susjeda ili s ulice.
  Budući da je procjena buke subjektivna, treba napomenuti da indikator uzima u obzir i nivoe buke, kao i standarde ljudi o tome koji nivo smatraju prihvatljivim. Stoga, povećanje vrijednosti indikatora ne mora nužno ukazivati ​​na sličan porast nivoa buke, već i na smanjenje nivoa koje su evropski građani spremni tolerisati i obrnuto. U stvari, postoje empirijski dokazi da percipirani kvalitet okoliša od strane pojedinaca nije uvijek u skladu sa stvarnim kvalitetom okoliša procijenjenim korištenjem 'objektivnih' indikatora, posebno za buku.
11-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​te Cilju održivog razvoja 3 o dobrom zdravlju i blagostanju. Cilj održivog razvoja 11 ugrađen je u prioritete Evropske komisije pod nazivom „Nova era za evropsku odbranu i sigurnost“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje našeg kvaliteta života: sigurnost hrane, voda i priroda“ i „Zaštita naše demokratije, poštovanje naših vrijednosti“. Cilj održivog razvoja 3 ugrađen je u prioritete Evropske komisije pod nazivom „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
11-20-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i drugim, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Cilj održivog razvoja 3 ima za cilj osigurati zdravlje i dobrobit za sve u svim uzrastima poboljšanjem reproduktivnog, majčinog i dječjeg zdravlja; okončanjem epidemija glavnih zaraznih bolesti; smanjenjem nezaraznih i mentalnih bolesti. Također poziva na smanjenje faktora rizika za zdravlje u ponašanju i okolišu.
  Direktiva o buci u okolišu glavni je instrument EU za identifikaciju i borbu protiv zagađenja bukom. Fokusira se na tri područja djelovanja: utvrđivanje izloženosti buci u okolišu; osiguravanje da su informacije o buci u okolišu i njenim utjecajima dostupne javnosti; sprječavanje i smanjenje buke u okolišu gdje je to potrebno, a posebno tamo gdje nivoi izloženosti mogu izazvati štetne učinke na ljudsko zdravlje i očuvanje kvalitete buke u okolišu tamo gdje je ona dobra.
11-20-long_term_objective: >-
11-32-title: Indeks pokrivenosti tla
11-32-definition: >-
  Ovaj indikator mjeri pokrivenost površine tla nepropusnim materijalima, što ukazuje na nepropusnost. Agregacija vrijednosti nepropusnosti s referentnim jedinicama, kao što su urbana područja, poplavne ravnice, obalne zone ili zaštićena područja, vrši se korištenjem integrirane platforme prostornih podataka EEA.
11-32-intention: >-
  Indikator se koristi za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​te prema Cilju održivog razvoja 15 o zaštiti, obnovi i promoviranju održivog korištenja zemljišta. Cilj održivog razvoja 11 ugrađen je u prioritete Europske komisije u okviru "Nova era za europsku obranu i sigurnost", "Podrška ljudima, jačanje naših društava i našeg socijalnog modela", "Održavanje kvalitete života: sigurnost hrane, voda i priroda" i "Zaštita naše demokracije, održavanje naših vrijednosti". Cilj održivog razvoja 15 ugrađen je u prioritete Europske komisije u okviru "Održavanje kvalitete života: sigurnost hrane, voda i priroda".
11-32-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i drugim, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš.
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutrašnjih vodenih i planinskih ekosistema. To uključuje napore za održivo upravljanje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka biodiverziteta i zaštitu ugroženih vrsta.
11-32-long_term_objective: >-
  Strategija za tlo za 2030. godinu postavila je cilj nulte neto eksploatacije zemljišta do 2050. godine.
11-40-title: Smrtnost u cestovnom saobraćaju
11-40-definition: >-
  Indikator mjeri broj smrtnih slučajeva uzrokovanih saobraćajnim nesrećama, uključujući vozače i putnike motornih vozila i bicikala, kao i pješake. Osobe koje su poginule u saobraćajnim nesrećama do 30 dana nakon što se nesreća dogodila računaju se kao smrtni slučajevi u saobraćajnim nesrećama.
11-40-intention: >-
  Indikator se koristi za praćenje napretka prema cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​te cilju održivog razvoja 3 o dobrom zdravlju i blagostanju. Cilj održivog razvoja 11 ugrađen je u prioritete Evropske komisije u okviru 'Nova era za evropsku odbranu i sigurnost', 'Podrška ljudima, jačanje naših društava i našeg socijalnog modela', 'Održavanje kvalitete života: sigurnost hrane, voda i priroda' i 'Zaštita naše demokratije, poštovanje naših vrijednosti'. Cilj održivog razvoja 3 ugrađen je u prioritete Evropske komisije u okviru 'Podrška ljudima, jačanje naših društava i našeg socijalnog modela'.
  Indikator se može smatrati sličnim globalnom indikatoru ciljeva održivog razvoja 3.6.1 "Stopa smrtnosti zbog povreda u saobraćaju".
11-40-methodology: >-
  Cilj održivog razvoja 11 ima za cilj obnovu i planiranje gradova i drugih ljudskih naselja tako da nude mogućnosti za sve, s pristupom osnovnim uslugama, energiji, stanovanju, prijevozu, zelenim javnim površinama i drugim, uz istovremeno poboljšanje korištenja resursa i smanjenje utjecaja na okoliš. Uz zdravo, o riziku informirano i pametno planiranje i upravljanje, Cilj održivog razvoja 11 zamišlja gradove kao ekološki otporna ljudska naselja koja potiču ličnu sigurnost.
  Cilj održivog razvoja 3 ima za cilj osigurati zdravlje i dobrobit za sve u svim uzrastima poboljšanjem reproduktivnog, majčinog i dječjeg zdravlja; okončanjem epidemija glavnih zaraznih bolesti; smanjenjem nezaraznih i mentalnih bolesti. Također poziva na smanjenje faktora rizika za zdravlje u ponašanju i okolišu.
  Strateški akcijski plan o sigurnosti na cestama i okvir politike sigurnosti na cestama EU 2021–2030. postavili su cilj smanjenja smrtnih slučajeva i teških ozljeda za 50% do 2030. u odnosu na 2019. i ambiciozne planove sigurnosti na cestama za postizanje nulte stope smrtnih slučajeva na cestama do 2050. („Vizija nula“).
11-40-long_term_objective: >-
11-52-title: Prerane smrti zbog izloženosti finim česticama (PM2,5)
11-52-definition: >-
  Ovaj indikator procjenjuje broj prijevremenih smrti koje se mogu pripisati dugotrajnoj izloženosti koncentracijama PM2.5 iznad 5µg/m3 (smjernica Svjetske zdravstvene organizacije). PM2.5 su čestice čiji je promjer manji od 2,5 mikrometara i koje se mogu duboko unijeti u pluća gdje mogu izazvati upalu i pogoršati stanje osoba koje pate od srčanih i plućnih bolesti.
11-52-intention: >-
  Koristi se za praćenje napretka prema Cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​te Cilju održivog razvoja 3 o dobrom zdravlju i blagostanju. Cilj održivog razvoja 11 ugrađen je u prioritete Evropske komisije u okviru „Nova era za evropsku odbranu i sigurnost“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje našeg kvaliteta života: sigurnost hrane, voda i priroda“ i „Zaštita naše demokratije, poštovanje naših vrijednosti“. Cilj održivog razvoja 3 ugrađen je u prioritete Evropske komisije u okviru „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“.
11-52-methodology: >-
  EU se bavi problemom zagađenja zraka putem svojih specifičnih zakona o kvaliteti zraka i industrijskim emisijama, kao što su Paket za čisti zrak i direktive koje su usvojili Vijeće i Evropski parlament u vezi s kvalitetom ambijentalnog zraka, kao i putem dodatnih koristi koje proizlaze iz provedbe određenih klimatskih politika.
  Akcijski plan za nulto zagađenje zraka, vode i tla uključuje cilj smanjenja utjecaja na zdravlje uzrokovanog zagađenjem zraka za 55% do 2030. godine, u usporedbi s 2005. godinom.
  Okvir za praćenje 8. Akcionog programa za okoliš koristi broj prijevremenih smrti kao glavni pokazatelj s ciljem smanjenja broja trajnih smrti uzrokovanih PM2.5 za 55% do 2030. godine, u usporedbi s 2005. godinom.
11-52-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost 5.
11-60-title: Postotak recikliranja komunalnog otpada
11-60-definition: >-
  Indikator mjeri tonažu recikliranog komunalnog otpada podijeljenu s ukupnom količinom nastalog komunalnog otpada. Recikliranje uključuje recikliranje materijala, kompostiranje, pripremu za ponovnu upotrebu i anaerobnu digestiju. Komunalni otpad se uglavnom sastoji od otpada koji proizvode domaćinstva, ali može uključivati ​​i sličan otpad koji proizvode mala preduzeća i javne institucije, a koji prikuplja opština. Ovaj posljednji dio komunalnog otpada može varirati od opštine do opštine i od zemlje do zemlje, ovisno o lokalnom sistemu upravljanja otpadom. Za područja koja nisu obuhvaćena programom sakupljanja komunalnog otpada, procjenjuje se količina proizvedenog otpada.
11-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 11 o tome da gradovi i ljudska naselja budu inkluzivni, sigurni, otporni i održivi, ​​što je ugrađeno u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“, „Podrška ljudima, jačanje naših društava i našeg socijalnog modela“, „Održavanje našeg kvaliteta života: sigurnost hrane, voda i priroda“ i „Zaštita naše demokratije, očuvanje naših vrijednosti“.
11-60-methodology: >-
  Akcioni plan za kružnu ekonomiju iz 2015. godine podržava prelazak na jaču i kružniju ekonomiju. Direktiva (EU) 2018/851 od 30. maja 2018. godine uspostavila je nove ambicioznije pravno obavezujuće ciljeve za recikliranje i ponovnu upotrebu komunalnog otpada. Zemlje EU će sada morati reciklirati najmanje 55% svog komunalnog otpada do 2025. godine, 60% do 2030. godine i 65% do 2035. godine. Prijedlog paketa mjera za kružnu ekonomiju iz 2022. godine za Direktivu o ambalaži i ambalažnom otpadu ima za cilj smanjenje ambalažnog otpada i povećanje recikliranja.
11-60-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 62.
12-10-title: Potrošnja opasnih hemikalija
12-10-definition: >-
  Ovaj indikator mjeri potrošnju toksičnih hemikalija, izraženu u milionima tona. Potrošnja hemikalija izračunava se kao zbir obima proizvodnje (PRODCOM) i neto obima uvoza hemikalija (COMEXT) prema jednačini: Potrošnja = proizvodnja + uvoz – izvoz.
  Podaci o opasnim i neopasnim hemikalijama pokazuju ukupnu potrošnju svih hemikalija. Dvije podkategorije opasnih hemikalija – opasne po ljudsko zdravlje i opasne po okoliš – preklapaju se po definiciji i kao rezultat toga njihov zbir nije jednak ukupnoj potrošnji opasnih hemikalija.
12-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
12-10-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane preduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju zasnovanu na naprednim tehnološkim kapacitetima, efikasnosti resursa i smanjenju globalnog otpada.
  Okvir za registraciju, evaluaciju, autorizaciju i ograničavanje hemikalija (REACH) ima za cilj poboljšanje zaštite ljudskog zdravlja i okoliša kroz bolju identifikaciju i upravljanje opasnim hemikalijama. Okvir će biti ažuriran, uz podršku Strategije za hemikalije za održivost, koja ima za cilj poboljšanje zaštite okoliša i našeg zdravlja od rizika koje predstavljaju hemikalije i podršku inovacijama za sigurne i održive hemikalije.
12-10-long_term_objective: >-
12-21-title: Materijalni otisak
12-21-definition: >-
  Materijalni otisak, također poznat kao potrošnja sirovina (RMC), predstavlja globalnu potražnju za ekstrakcijom materijala (minerala, metalne rude, biomase, fosilnih energetskih materijala) izazvanu potrošnjom roba i usluga unutar geografskog referentnog područja. Podaci o materijalnim otiscima potiču iz računa tokova materijala, koji modeliraju tokove prirodnih resursa iz okoliša u ekonomiju. Oni uključuju domaću ekstrakciju materijala mjerenu u tonama bruto materijala (na primjer, bruto ruda ili bruto žetva), kao i uvoz i izvoz mjeren procjenama ekvivalenata sirovina proizvoda kojima se trguje (domaća i strana ekstrakcija potrebna za proizvodnju proizvoda kojima se trguje). RMC stoga pokazuje količinu ekstrakcije potrebnu za proizvodnju robe koju traže krajnji korisnici u geografskom referentnom području, bez obzira na to gdje se u svijetu ekstrakcija materijala odvijala.
12-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, što je ugrađeno u Prioritetima Evropske komisije u okviru 'Održavanje kvalitete našeg života: sigurnost hrane, voda i priroda'.
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane preduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju zasnovanu na naprednim tehnološkim kapacitetima, efikasnosti resursa i smanjenju globalnog otpada.
  Cilj održivog razvoja 8, između ostalog, poziva na promociju radnih prava i sigurnog i bezbjednog radnog okruženja.
  Pokazatelj se može smatrati sličnim globalnom indikatoru Cilja održivog razvoja 8.4.1 i 12.2.1 elementu "Materijalni otisak".
12-21-methodology: >-
  Osmi akcioni program za okoliš (EAP), usvojen u martu 2022. godine, ima za cilj ubrzanje prelaska na klimatski neutralnu, resursno efikasnu i regenerativnu ekonomiju, prepoznajući da ljudsko blagostanje zavisi od zdravih ekosistema. Među njegovim prioritetnim ciljevima su postizanje klimatske neutralnosti do 2050. godine i obnova biodiverziteta.
  Akcioni plan za kružnu ekonomiju, usvojen 2020. godine, ima za cilj udvostručiti stopu korištenja kružnih materijala u EU u narednoj deceniji kako bi se podržalo postizanje klimatske neutralnosti do 2050. godine, odvojio ekonomski rast od korištenja resursa i stvaranja otpada i održala potrošnja resursa unutar ekoloških granica. U martu 2022. godine, Evropska komisija je usvojila paket mjera o kružnoj ekonomiji kako bi održivi proizvodi postali norma u EU i podstakli kružne poslovne modele.
12-21-long_term_objective: >-
12-31-title: Otisak potrošnje
12-31-definition: >-
  Potrošnjački otisak (CF) je model zasnovan na procjeni životnog ciklusa (LCA) koji se koristi za izradu skupa od 16 ekoloških indikatora za procjenu uticaja obrazaca potrošnje EU i njenih država članica na okoliš, a provodi se kombinovanjem podataka o intenzitetu potrošnje s procjenom uticaja reprezentativnih proizvoda na okoliš. Procjena CF-a zasniva se na kombinaciji: (a) emisija u zrak, tlo i vodu, kao i resursa korištenih tokom životnog ciklusa 164 reprezentativna proizvoda, koji pripadaju pet područja potrošnje (hrana, mobilnost, stanovanje, kućanski aparati i uređaji), (b) godišnje potrošnje (tj. intenziteta potrošnje) tih proizvoda, koji se izračunavaju na osnovu statistike potrošnje, i (c) metode procjene uticaja ekološkog otiska (EF), koja prevodi emisije i potrošnju resursa u 16 potencijalnih uticaja na okoliš, koje je moguće agregirati u jedan rezultat, gdje je to prikladno. Indikatori uticaja EF-a mogu se uporediti sa skupom pragova koji se zasnivaju na okviru planetarnih granica. Dakle, dati CF indikator (na primjer, klimatske promjene ili eutrofikacija mora) mjeri broj puta koliko je utjecaj potrošnje prekoračio povezanu planetarnu granicu. Također, pojedinačni ponderirani rezultat CF-a mjeri broj puta koliko je prekoračena ponderirana granica.
12-31-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
12-31-methodology: >-
  Evropska komisija je u martu 2020. godine usvojila Akcioni plan za kružnu ekonomiju (CEAP). Prelazak EU na kružnu ekonomiju smanjit će pritisak na prirodne resurse i stvoriti održivi rast i radna mjesta. Novi akcioni plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promovira procese kružne ekonomije, potiče održivu potrošnju i ima za cilj osigurati da se spriječi nastanak otpada i da se korišteni resursi što duže zadrže u ekonomiji EU. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket kružne ekonomije uspostavlja program djelovanja s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do upravljanja otpadom. Paket uključuje obaveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambiciozne kvantitativne ciljeve za povećanje recikliranja i smanjenje odlaganja otpada na deponije, obaveze za poboljšanje odvojenog prikupljanja otpada, kao i promociju efikasnog korištenja bioresursa.
12-31-long_term_objective: >-
12-41-title: Stopa kružne upotrebe materijala
12-41-definition: >-
  Potrošnjački otisak (CF) je model zasnovan na procjeni životnog ciklusa (LCA) koji se koristi za izradu skupa od 16 ekoloških indikatora za procjenu uticaja obrazaca potrošnje EU i njenih država članica na okoliš, a provodi se kombinovanjem podataka o intenzitetu potrošnje s procjenom uticaja reprezentativnih proizvoda na okoliš. Procjena CF-a zasniva se na kombinaciji: (a) emisija u zrak, tlo i vodu, kao i resursa korištenih tokom životnog ciklusa 164 reprezentativna proizvoda, koji pripadaju pet područja potrošnje (hrana, mobilnost, stanovanje, kućanski aparati i uređaji), (b) godišnje potrošnje (tj. intenziteta potrošnje) tih proizvoda, koji se izračunavaju na osnovu statistike potrošnje, i (c) metode procjene uticaja ekološkog otiska (EF), koja prevodi emisije i potrošnju resursa u 16 potencijalnih uticaja na okoliš, koje je moguće agregirati u jedan rezultat, gdje je to prikladno. Indikatori uticaja EF-a mogu se uporediti sa skupom pragova koji se zasnivaju na okviru planetarnih granica. Dakle, dati CF indikator (na primjer, klimatske promjene ili eutrofikacija mora) mjeri broj puta koliko je utjecaj potrošnje prekoračio povezanu planetarnu granicu. Također, pojedinačni ponderirani rezultat CF-a mjeri broj puta koliko je prekoračena ponderirana granica.
12-41-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane“. Pokazatelj se može smatrati dijelom globalnog pokazatelja cilja održivog razvoja 11.6.1 „Udio gradskog čvrstog otpada koji se redovno prikuplja i ima odgovarajuće konačno ispuštanje u ukupnom generiranom gradskom čvrstom otpadu, od strane gradova“.
  Povećanje kružnosti evropske ekonomije ključni je prioritet nove industrijske strategije EU usvojene 2020. godine i jedan je od ključnih elemenata Evropskog zelenog plana.
12-41-methodology: >-
  Evropska komisija je u martu 2020. godine usvojila Akcioni plan za kružnu ekonomiju (CEAP). Prelazak EU na kružnu ekonomiju smanjit će pritisak na prirodne resurse i stvoriti održivi rast i radna mjesta. Novi akcioni plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promovira procese kružne ekonomije, potiče održivu potrošnju i ima za cilj osigurati da se spriječi nastanak otpada i da se korišteni resursi što duže zadrže u ekonomiji EU. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket kružne ekonomije uspostavlja program djelovanja s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do upravljanja otpadom. Paket uključuje obaveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambiciozne kvantitativne ciljeve o povećanju recikliranja i smanjenju odlaganja otpada, obaveze za poboljšanje odvojenog prikupljanja otpada, kao i promociju efikasne upotrebe bioresursa.
  Akcioni plan za održivu potrošnju i proizvodnju i održivu industrijsku politiku (SCP/SIP) uključuje niz prijedloga o održivoj potrošnji i proizvodnji koji će doprinijeti poboljšanju ekoloških performansi proizvoda i povećati potražnju za održivijom robom i proizvodnim tehnologijama.
  Osmi akcioni program za okoliš (EAP), usvojen u martu 2022. godine, ima za cilj ubrzanje prelaska na klimatski neutralnu, resursno efikasnu i regenerativnu ekonomiju, prepoznajući da ljudsko blagostanje zavisi od zdravih ekosistema. Među njegovim prioritetnim ciljevima su postizanje klimatske neutralnosti do 2050. godine i obnova biodiverziteta. Ovaj indikator je također uključen kao glavni indikator i postavlja cilj udvostručenja omjera cirkularne upotrebe materijala do 2030. godine u poređenju sa 2020. godinom.
12-41-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 30
12-51-title: Nastajanje otpada
12-51-definition: >-
  Ovaj indikator se definiše kao sav otpad generisan u nekoj zemlji. Obuhvata otpad generisan industrijskom proizvodnjom (uključujući i sam sektor upravljanja otpadom) i otpad generisan domaćinstvima. Uključeni su glavni mineralni otpad, iskopani materijal i zemljište. To dovodi do velikih količina otpada u nekim zemljama sa značajnim ekonomskim aktivnostima kao što su rudarstvo i građevinarstvo.
12-51-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati dijelom globalnog pokazatelja cilja održivog razvoja 11.6.1 „Udio gradskog čvrstog otpada koji se redovno prikuplja i ispušta u odgovarajućem konačnom obliku u ukupnom generiranom gradskom čvrstom otpadu, od strane gradova“.
  Povećanje kružnosti evropske ekonomije ključni je prioritet nove industrijske strategije EU usvojene 2020. godine i jedan je od ključnih elemenata Evropskog zelenog plana.
12-51-methodology: >-
  Evropska komisija je u martu 2020. godine usvojila novi akcioni plan za kružnu ekonomiju (CEAP). Prelazak EU na kružnu ekonomiju smanjit će pritisak na prirodne resurse i stvoriti održivi rast i radna mjesta. Novi akcioni plan najavljuje inicijative duž cijelog životnog ciklusa proizvoda. Cilja na način na koji su proizvodi dizajnirani, promovira procese kružne ekonomije, potiče održivu potrošnju i ima za cilj osigurati da se spriječi nastanak otpada i da se korišteni resursi što duže zadrže u ekonomiji EU. Nadovezujući se na postojeće politike i zakonodavstvo EU, Paket kružne ekonomije uspostavlja akcijski program s mjerama koje pokrivaju cijeli ciklus od proizvodnje i potrošnje do upravljanja otpadom. Paket uključuje obaveze o ekodizajnu, sprječavanju nastanka otpada i ponovnoj upotrebi, ciklusima čistih materijala i ambiciozne kvantitativne ciljeve o povećanju recikliranja i smanjenju odlaganja otpada, obaveze za poboljšanje odvojenog prikupljanja otpada, kao i promociju efikasne upotrebe bioresursa.
  Akcioni plan za održivu potrošnju i proizvodnju i održivu industrijsku politiku (SCP/SIP) uključuje niz prijedloga o održivoj potrošnji i proizvodnji koji će doprinijeti poboljšanju ekoloških performansi proizvoda i povećati potražnju za održivijom robom i proizvodnim tehnologijama.
12-51-long_term_objective: >-
12-61-title: Bruto dodana vrijednost u sektoru ekoloških dobara i usluga
12-61-definition: >-
  Sektor ekoloških dobara i usluga (EGSS) definiše se kao onaj dio ekonomije neke zemlje koji se bavi proizvodnjom dobara i usluga koje se koriste u aktivnostima zaštite okoliša i upravljanja resursima, bilo u zemlji ili inostranstvu. Bruto dodana vrijednost u EGSS-u predstavlja doprinos sektora ekoloških dobara i usluga BDP-u.
  Proizvodi za zaštitu okoliša sprječavaju, smanjuju i eliminišu zagađenje ili bilo koju drugu degradaciju okoliša i uključuju mjere koje se preduzimaju za obnovu degradiranih staništa i ekosistema. Primjeri su električna vozila, katalizatori i filteri za smanjenje emisija zagađivača, usluge tretmana otpadnih voda i otpada ili radovi na izolaciji buke. Proizvodi za upravljanje resursima štite zalihe prirodnih resursa od iscrpljivanja. Primjeri su proizvodnja obnovljive energije, energetski efikasne i pasivne zgrade, desalinizacija morske vode ili iskorištavanje kišnice.
12-61-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje i cilju održivog razvoja 9 o izgradnji otporne infrastrukture, promoviranju inkluzivne i održive industrijalizacije i poticanju inovacija, koji su ugrađeni u prioritete Europske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
12-61-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane preduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju zasnovanu na naprednim tehnološkim kapacitetima, efikasnosti resursa i smanjenju globalnog otpada.
  Cilj održivog razvoja 9 poziva na izgradnju otporne i održive infrastrukture i promoviše inkluzivnu i održivu industrijalizaciju. Također prepoznaje važnost istraživanja i inovacija za pronalaženje trajnih rješenja za društvene, ekonomske i ekološke izazove.
12-61-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 5,5.
13-10-title: Domaće neto emisije stakleničkih plinova
13-10-definition: >-
  Indikator mjeri ukupne nacionalne emisije (iz oba sektora, ESD i ETS) takozvane „Kjoto korpe“ stakleničkih plinova, uključujući ugljikov dioksid (CO2), metan (CH4), dušikov oksid (N2O) i takozvane F-gasove (hidrofluorougljike, perfluorougljike, dušikov trifluorid (NF3) i sumpor heksafluorid (SF6)) iz svih sektora inventara emisija stakleničkih plinova. Procijenjene emisije iz međunarodnog zrakoplovstva i pomorskog prometa isključene su za pojedinačne zemlje. Indikator je predstavljen u dva oblika: kao neto emisije koje uključuju korištenje zemljišta, promjene korištenja zemljišta i šumarstvo (LULUCF), kao i isključujući LULUCF. Koristeći pojedinačni potencijal globalnog zagrijavanja (GWP) svakog plina, oni se integriraju u jedinstveni indikator izražen u jedinicama ekvivalenta CO2. Inventare emisija stakleničkih plinova države članice EU dostavljaju godišnje Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama (UNFCCC).
13-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Evropski zakon o klimi postavlja okvir za klimatske akcije i povećava ambicije EU za 2030. godinu, s novim ciljem smanjenja neto emisija stakleničkih plinova (GHG) za najmanje 55% do te godine (u usporedbi s 1990. godinom) i postizanja klimatske neutralnosti do 2050. godine. Evropska komisija je također uspostavila paket novog i revidiranog zakonodavstva EU o klimi i energetici – tzv. paket „Fit for 55“ – kako bi povećala svoje ambicije u pogledu ublažavanja klimatskih promjena. Paket obuhvaća međusobno povezan skup mjera u području energetike, transporta, oporezivanja i klimatskih politika, te uključuje ojačano i prošireno određivanje cijena ugljika, ciljeve, standarde i mjere podrške. Također postavlja cilj za prirodne ponore ugljika od 310 milijuna tona ekvivalenta CO2.
13-10-methodology: >-
  Plan oporavka NextGenerationEU je ekonomski odgovor Unije na krizu izazvanu COVID-19. Uključuje Mehanizam za oporavak i otpornost vrijedan 672,5 milijardi eura, od čega najmanje 37% mora ići na klimatske akcije. Svaki nacionalni plan oporavka i otpornosti morat će ispuniti ovaj cilj od najmanje 37% rashoda vezanih za klimu, a sve reforme i ulaganja država članica kao dio fonda za oporavak moraju biti u skladu s principom „ne nanosi značajnu štetu“ i stoga izbjegavati značajan negativan utjecaj na klimatske i okolišne ciljeve EU.
  Nova kohezijska politika EU (2021. do 2027.) uključuje „zeleniju Evropu bez ugljika“ kao jedan od svojih pet glavnih ciljeva, koji primaju 65% do 85% raspoloživih sredstava, zajedno s ciljem „pametnije Evrope“.
13-10-long_term_objective: >-
13-21-title: Neto emisije stakleničkih plinova sektora LULUCF
13-21-definition: >-
  Ovaj indikator mjeri neto uklanjanje ugljika iz sektora korištenja zemljišta, promjene korištenja zemljišta i šumarstva (LULUCF), uzimajući u obzir i emisije i uklanjanje iz sektora. Podaci o LULUCF-u obuhvataju godišnje tokove CO2, CH4 i N2O sa svih upravljanih zemljišta u EU. Indikator se izražava kao ekvivalent CO2 koristeći potencijal globalnog zagrijavanja (GWP) svakog plina.
  Podaci o emisijama i uklanjanju, poznati kao inventari stakleničkih plinova, dostavljaju se svake godine od strane država članica EU i Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama (UNFCCC). Evropska agencija za okoliš (EEA) sastavlja agregirane podatke EU i objavljuje podatke za EU i sve države članice. Eurostat ponovo objavljuje podatke EEA.
13-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“. Cilj održivog razvoja 13 nastoji provesti obavezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama za postizanje klimatski neutralnog svijeta do sredine stoljeća kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem da se dostigne 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj jačanje otpornosti i sposobnosti prilagođavanja zemalja prirodnim opasnostima povezanim s klimom i rezultirajućim katastrofama.
13-21-methodology: >-
  Evropski zakon o klimi postavlja okvir za djelovanje u oblasti klime i povećava ambicije EU za 2030. godinu, s novim ciljem smanjenja neto emisija stakleničkih plinova (GHG) za najmanje 55% do te godine (u poređenju s 1990. godinom) i postizanja klimatske neutralnosti do 2050. godine. Evropska komisija je također uspostavila paket novog i revidiranog zakonodavstva EU o klimi i energetici – takozvani paket „Fit for 55“ – kako bi povećala svoje ambicije u pogledu ublažavanja klimatskih promjena.
  Paket obuhvata međusobno povezan skup mjera u oblasti energetike, transporta, oporezivanja i klimatskih politika, te uključuje ojačano i prošireno određivanje cijena ugljika, ciljeve, standarde i mjere podrške. Također postavlja cilj za prirodne ponore ugljika od 310 miliona tona ekvivalenta CO2.
13-21-long_term_objective: >-
13-31-title: Prosječne CO2 emisije po kilometru novih putničkih automobila
13-31-definition: >-
  Pokazatelj se definira kao prosječna emisija ugljičnog dioksida (CO2) po km za nove putničke automobile u datoj godini. Prijavljene emisije zasnivaju se na homologaciji i mogu odstupati od stvarnih emisija CO2 novih automobila. U praćenju automobila i kombija, podaci o emisijama se prijavljuju korištenjem protokola „Novi evropski ciklus vožnje“ (NEDC) do 2019. godine, korištenjem oba protokola, NEDC i „Svjetski usklađeni postupak ispitivanja lakih vozila“ (WLTP) u 2020. godini, a od 2021. godine samo WLTP protokol.
13-31-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 12 o osiguravanju održivih obrazaca potrošnje i proizvodnje i prema cilju održivog razvoja 13 o poduzimanju hitnih mjera za borbu protiv klimatskih promjena i njihovih utjecaja. Ovi ciljevi održivog razvoja ugrađeni su u prioritete Europske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
13-31-methodology: >-
  Cilj održivog razvoja 12 poziva na sveobuhvatan skup akcija od strane preduzeća, kreatora politika, istraživača i potrošača kako bi se prilagodili održivim praksama. Predviđa održivu proizvodnju i potrošnju zasnovanu na naprednim tehnološkim kapacitetima, efikasnosti resursa i smanjenju globalnog otpada.
  Cilj održivog razvoja 13 nastoji da sprovede obavezu prema Okvirnoj konvenciji Ujedinjenih nacija o klimatskim promjenama za postizanje klimatski neutralnog svijeta do sredine stoljeća kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, a cilj mu je 1,5°C (u poređenju sa predindustrijskim periodom). Također ima za cilj jačanje otpornosti i adaptivnog kapaciteta zemalja na prirodne opasnosti povezane s klimom i rezultirajuće katastrofe.
  Paket "Spremni za 55" obuhvata međusobno povezan skup zakonodavstva EU o klimi i energiji, uključujući ažurirane standarde emisije CO2 za nova vozila.
13-31-long_term_objective: >-
13-40-title: Ekonomski gubici povezani s klimom
13-40-definition: >-
  Indikator mjeri ekonomske gubitke uzrokovane vremenskim i klimatskim događajima. Vremenski i klimatski događaji definirani su kao meteorološki događaji (oluje, lavine), hidrološki događaji (poplave) i klimatološki događaji (toplotni valovi, hladni valovi, suše, šumski požari) na osnovu klasifikacije Međunarodnog vijeća za nauku (ICSU).
  Pored godišnjih podataka, predstavljen je i izglađeni vremenski niz zasnovan na 30-godišnjim prosjekima. U skladu s normalnim klimatskim periodom kako ga definira Svjetska meteorološka organizacija, ovi 30-godišnji prosječni podaci odražavaju trendove isključujući značajnu klimatsku varijabilnost na kraćim vremenskim skalama zbog prirodnih faktora. Indikator se zasniva na podacima iz CATDAT-a RiskLayer-a.
13-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“. Cilj održivog razvoja 13 nastoji provesti obavezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama za postizanje klimatski neutralnog svijeta do sredine stoljeća kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, a cilj je 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj jačanje otpornosti i adaptivnih kapaciteta zemalja na prirodne opasnosti povezane s klimom i katastrofe koje iz toga proizlaze.
  Ovaj pokazatelj može se smatrati sličnim globalnim pokazateljima Ciljeva održivog razvoja 1.5.2 i 11.5.2 „Direktni ekonomski gubitak uslijed katastrofa u odnosu na globalni BDP“ (vezano za pokazatelj Sendai).
13-40-methodology: >-
  EU stavlja otpornost na katastrofe i klimatske promjene kao centralni cilj svoje humanitarne pomoći. Marker otpornosti EU koristi se u svim humanitarnim projektima za definiranje načina smanjenja rizika od katastrofa i jačanje kapaciteta ljudi za suočavanje s katastrofama i krizama. Akcioni plan za Sendai okvir za smanjenje rizika od katastrofa 2015-2030 uključuje snažan fokus na prilagođavanje klimatskim promjenama, povezujući ga sa strategijama smanjenja rizika od katastrofa i njihovom koherentnom provedbom u zemljama partnerima EU.
  Nova Strategija prilagođavanja EU potiče pametnije, brže i sistematičnije prilagođavanje kako bi se ispunila vizija da će EU 2050. godine biti društvo otporno na klimatske promjene, u potpunosti prilagođeno neizbježnim utjecajima klimatskih promjena.
13-40-long_term_objective: >-
13-50-title: Doprinos međunarodnoj obavezi od 100 milijardi USD za izdatke povezane s klimom
13-50-definition: >-
  Pokazatelj mjeri ukupan iznos potrošen iz godišnjeg budžeta država članica EU, kao i Evropske komisije i Evropske investicijske banke, kako bi se doprinijelo međunarodnoj obavezi od 100 milijardi američkih dolara za finansiranje klimatskih promjena u okviru Okvirne konvencije Ujedinjenih nacija o klimatskim promjenama (UNFCCC).
13-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati identičnim globalnom pokazatelju cilja održivog razvoja 13.a.1 „Iznosi obezbijeđeni i mobilizirani u američkim dolarima godišnje u odnosu na kontinuirani postojeći cilj kolektivne mobilizacije obaveze od 100 milijardi dolara do 2025. godine“.
13-50-methodology: >-
  Cilj održivog razvoja 13 nastoji implementirati obavezu prema Okvirnoj konvenciji Ujedinjenih nacija o klimatskim promjenama za postizanje klimatski neutralnog svijeta do sredine stoljeća, s ciljem ograničavanja globalnog zagrijavanja na znatno ispod 2°C, s ciljem da se dostigne 1,5°C (u poređenju s predindustrijskim periodom). Također ima za cilj jačanje otpornosti i sposobnosti prilagođavanja zemalja prirodnim opasnostima povezanim s klimom i katastrofama koje iz toga proizlaze.
13-50-long_term_objective: >-
13-70-title: Izdavanje zelenih obveznica
13-70-definition: >-
  Zelene obveznice su krediti koje investitor daje zajmoprimcu, a koji se koriste za finansiranje projekata ili aktivnosti koje promoviraju ublažavanje ili prilagođavanje klimatskim promjenama ili druge ekološke ciljeve. Iako definicija zelene obveznice može varirati, ovaj pokazatelj uključuje obveznice koje su usklađene s četiri osnovne komponente principa zelenih obveznica Međunarodnog udruženja tržišta kapitala (ICMA) ili su certificirane od strane Inicijative za klimatske obveznice (CBI). Izdavatelji uključuju korporacije poput kompanija ili finansijskih korporacija i izdavatelje državnih obveznica koje su nacionalne vlade. Državne obveznice koje izdaju vlade uključene su samo ako imaju rok dospijeća duži od jedne godine.
13-70-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 13 o klimatskim akcijama, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“. Cilj održivog razvoja 13 nastoji provesti obavezu prema Okvirnoj konvenciji Ujedinjenih naroda o klimatskim promjenama za postizanje klimatski neutralnog svijeta do sredine stoljeća kako bi se globalno zagrijavanje ograničilo na znatno ispod 2°C, s ciljem da se dostigne 1,5°C (u usporedbi s predindustrijskim vremenom). Također ima za cilj jačanje otpornosti i sposobnosti prilagođavanja zemalja prirodnim opasnostima povezanim s klimom i rezultirajućim katastrofama.
13-70-methodology: >-
  Kao dio tranzicije ka klimatskoj neutralnosti i otpornosti na klimatske promjene, EU nastoji preusmjeriti javna i privatna ulaganja u područja gdje će podržati ovaj cilj. Iz tog razloga, EU je usvojila taksonomiju EU kao sistem klasifikacije za održive ekonomske aktivnosti i evropski standard zelenih obveznica kao dobrovoljni „zlatni“ standard za tržište zelenih obveznica. Na nivou EU, ublažavanje klimatskih promjena i prilagođavanje njima integrirani su u sve glavne programe potrošnje, a EU se također obavezala da će podržati međunarodne klimatske akcije.
  Ovaj pokazatelj je glavni pokazatelj za praćenje napretka u ispunjavanju ciljeva Osmog programa djelovanja za okoliš (8. EAP).
13-70-long_term_objective: >-
14-10-title: Marine protected areas
14-10-definition: >-
  Ovaj indikator mjeri obim zaštićenih morskih područja (MPA) u morskim vodama EU. MPA su „vruće tačke“ biodiverziteta i mogu služiti različitim ciljevima, uključujući zaštitu vrsta i staništa, očuvanje i obnovu biodiverziteta, ali i korištenje resursa unutar definiranih ekoloških granica. MPA također mogu pozitivno utjecati na susjedna područja.
14-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 14.5.1 „Pokrivenost zaštićenih područja u odnosu na morska područja“.
14-10-methodology: >-
  Direktiva EU o pticama i Direktiva o staništima imaju za cilj održavanje ili obnavljanje povoljnog statusa očuvanja zaštićenih staništa i vrsta, te zaštitu njihovog održivog korištenja i upravljanja. Direktiva o staništima ima za cilj doprinijeti osiguranju biodiverziteta EU, uključujući i morski okoliš, te navodi devet tipova morskih staništa i 16 vrsta za koje je potrebno proglašenje morskog područja, dok Direktiva o pticama navodi dodatnih 60 vrsta ptica čije očuvanje zahtijeva zaštitu morskog područja.
  Strategija EU za biodiverzitet ima za cilj zaštititi najmanje 30% kopna i mora u Evropi, uključujući i nacionalno određena područja i područja Natura 2000.
  Morska zaštićena područja mogu služiti različitim ciljevima, uključujući zaštitu vrsta i staništa, očuvanje i obnovu biodiverziteta, ali i korištenje resursa unutar definiranih ekoloških granica. Za sva zaštićena morska područja (MPA) postavljeni su specifični ciljevi upravljanja, koji se često sastoje od različitih zona s dozvoljenom i nedozvoljenom upotrebom.
  EU je također uključena u rasprave na Generalnoj skupštini Ujedinjenih naroda o međunarodnom pravno obavezujućem sporazumu o očuvanju biodiverziteta u područjima izvan nacionalne jurisdikcije (BBNJ).
14-10-long_term_objective: >-
14-21-title: Estimated trends in fish stock biomass
14-21-definition: >-
  Biomasa ribljeg fonda je funkcija bioloških karakteristika kao što su brojnost i težina i može ukazivati na status ribljeg fonda kada se mjeri u odnosu na referentne vrijednosti. Ovo je indikator zasnovan na modelu koji se izračunava korištenjem rezultata kvantitativnih procjena fonda pojedinačnih vrsta. Prikazuje srednju vrijednost biomase ribljeg fonda u odnosu na 2003. godinu. Puni vremenski niz se ažurira svake godine, ponekad uključujući nove fonde zbog novo dostupnih kvantitativnih procjena, što može rezultirati malim razlikama od jedne godine puštanja do sljedeće.
14-21-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 14.4.1 „Udio ribljih stokova unutar biološki održivih nivoa“.
14-21-methodology: >-
  Zajednička ribarstvena politika ima za cilj osigurati dugoročnu održivost sektora očuvanjem reprodukcije ribljeg fonda za visok dugoročni prinos, poboljšanjem raspodjele ribolovnih mogućnosti, očuvanjem morskih resursa i podržavanjem profitabilnosti industrije. Okvirna direktiva o morskoj strategiji zauzima sveobuhvatan i integrirani pristup zaštiti morskog okoliša i prirodnih resursa s ciljem postizanja dobrog ekološkog statusa morskih voda EU koje su ekološki raznolike, čiste, zdrave i produktivne.
14-21-long_term_objective: >-
14-30-title: Estimated trend in fishing pressure
14-30-definition: >-
  Indikator predstavlja modelski zasnovanu srednju vrijednost ribolovnog pritiska (F/Fmsy) u morskim vodama EU sjeveroistočnog Atlantika i susjednih mora (FAO područje 27) te Sredozemnog i Crnog mora (FAO područje 37) za koje trenutna ribolovna smrtnost (F) premašuje procijenjenu ribolovnu smrtnost u skladu s postizanjem maksimalnog održivog prinosa (Fmsy). Ribolovna smrtnost je mjera za uginuće ili uklanjanje ribe iz populacije zbog ribolova. Ribolovna smrtnost u skladu s postizanjem maksimalnog održivog prinosa određena je dugoročnom prosječnom veličinom stoka koja omogućava ribolov na ovom nivou. Da bi ribarstvo bilo održivo, F ne bi trebao biti veći od Fmsy – tačke u kojoj se najveći ulov može uzeti iz ribljeg stoka tokom neograničenog perioda bez nanošenja štete.
14-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 14.4.1 „Udio ribljih stokova unutar biološki održivih nivoa“.
14-30-methodology: >-
  Zajednička ribarstvena politika ima za cilj osigurati dugoročnu održivost sektora očuvanjem reprodukcije ribljeg fonda za visok dugoročni prinos, poboljšanjem raspodjele ribolovnih mogućnosti, očuvanjem morskih resursa i podržavanjem profitabilnosti industrije. Okvirna direktiva o morskoj strategiji zauzima sveobuhvatan i integriran pristup zaštiti morskog okoliša i prirodnih resursa s ciljem postizanja dobrog ekološkog statusa morskih voda EU koje su ekološki raznolike, čiste, zdrave i produktivne.
14-30-long_term_objective: >-
14-40-title: Bathing sites with excellent water quality
14-40-definition: >-
  Pokazatelj pokazuje udio kopnenih i obalnih kupališta s izvrsnim kvalitetom vode u EU i drugim evropskim zemljama. Kvalitet vode za kupanje procjenjuje se prema standardima za mikrobiološke parametre (crijevne enterokoke i Escherichia coli). Pokazatelj se izračunava na osnovu pomičnog prosjeka najmanje 16 uzorkovanja u četiri godine kako bi se osiguralo da se postigne realna klasifikacija vode za kupanje.
  Direktiva o vodama za kupanje (BWD) zahtijeva od država članica da identificiraju i procijene kvalitet svih kopnenih i morskih voda za kupanje i da klasificiraju te vode kao „loše“, „dovoljne“, „dobre“ ili „odlične“ ovisno o nivou otkrivenih fekalnih bakterija.
14-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, te prema cilju održivog razvoja 6 o osiguravanju dostupnosti i održivog upravljanja vodom i sanitacijom za sve, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
14-40-methodology: >-
  Direktiva EU o vodama za kupanje jedna je od uspješnih priča u politici EU o vodama, usmjerena na zaštitu ljudskog zdravlja i okoliša dopunjavanjem Okvirne direktive o vodama.
14-40-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 100.
14-50-title: Global mean surface seawater acidity
14-50-definition: >-
  Ovaj indikator pokazuje prosječnu godišnju koncentraciju vodikovih iona u površinskoj morskoj vodi sjeveroistočnog Atlantika i susjednih mora, izraženu u nanomolima po litri (nmol/l). Povećanje koncentracije vodikovih iona odgovara padu pH vrijednosti i povećanju kiselosti morske vode.
  Ovaj trend je uzrokovan povećanjem koncentracije atmosferskog ugljikovog dioksida (CO2), što povećava unos CO2 u okean. Copernicus Marine Service rekonstruisao je trendove u globalnoj zakiseljenosti okeana od 1985. godine nadalje.
14-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 14.3.1 „Prosječna kiselost mora (pH) mjerena na dogovorenom nizu reprezentativnih stanica za uzorkovanje“.
14-50-methodology: >-
  Cilj održivog razvoja 14 ima za cilj zaštitu i osiguranje održivog korištenja okeana. To uključuje smanjenje zagađenja mora i utjecaja zakiseljavanja okeana, okončanje prekomjernog ribolova i očuvanje morskih i obalnih područja i ekosistema. Cilj održivog razvoja 14 ima snažnu međuzavisnost sa širokim spektrom drugih ciljeva održivog razvoja, jer okeani održavaju obalne ekonomije i egzistenciju, doprinose proizvodnji hrane i funkcioniraju kao ponor ugljika.
  Prepoznajući ograničenja u rješavanju upravljanja okeanima na nivou država članica ili na nivou Evrope, EU radi na osiguravanju jačeg sistema upravljanja okeanima kako bi se postiglo očuvanje i održivo korištenje regionalnih i međunarodnih voda. EU također ima niz strategija koje imaju za cilj ublažavanje klimatskih promjena i smanjenje emisija stakleničkih plinova (GHG), uključujući CO2.
14-50-long_term_objective: >-
14-60-title: Morske vode pogođene eutrofikacijom
14-60-definition: >-
  Indikator pokazuje udio eutrofnih morskih voda u isključivoj ekonomskoj zoni (IEZ). Područje se klasificira kao eutrofno ako su tokom više od 25% dana posmatranja u datoj godini koncentracije hlorofila kao zamjene za eutrofikaciju iznad 90. percentila referentne bazne linije iz perioda 1998–2017.
  Eutrofikacija je proces kojim višak hranjivih tvari – uglavnom fosfora i dušika – dovodi do povećanog rasta biljnog materijala, posebno cvjetanja algi, u vodenom tijelu, što rezultira smanjenjem kvalitete vode. To, zauzvrat, može uzrokovati smrt vodenih organizama usljed hipoksije. Antropogene aktivnosti, poput poljoprivrede, akvakulture, industrije i kanalizacije, glavni su izvor unosa hranjivih tvari u problematična područja.
14-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 14 o očuvanju i održivom korištenju okeana, mora i morskih resursa za održivi razvoj, što je ugrađeno u prioritete Evropske komisije u okviru „Održavanje kvalitete života: sigurnost hrane, voda i priroda“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 14.1.1: (a) „Indeks eutrofikacije obala“.
14-60-methodology: >-
  Cilj održivog razvoja 14 ima za cilj očuvanje i održivo korištenje okeana, mora i morskih resursa, što između ostalog zahtijeva i sprječavanje i smanjenje zagađenja mora i utjecaja zakiseljavanja okeana.
  Okvirna direktiva o morskoj strategiji (MSFD) zahtijeva od država članica da izvještavaju o eutrofikaciji za svoja regionalna mora svakih 6 godina.
14-60-long_term_objective: >-
15-10-title: Udio šumskog pokrivača
15-10-definition: >-
15-10-intention: >-
15-10-methodology: >-
15-10-long_term_objective: >-
15-20-title: Zaštićena kopnena područja
15-20-definition: >-
  Ovaj indikator mjeri obim i udio kopnenih zaštićenih područja, koja obuhvataju nacionalno određena zaštićena područja i područja Natura 2000. Nacionalno određeno područje je područje zaštićeno nacionalnim zakonodavstvom.
  Područja Natura 2000 su određena radi zaštite evropskih vrsta i staništa, navedenih u direktivama EU o staništima i pticama.
15-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 15 o zaštiti, obnovi i promociji održivog korištenja zemljišta, koji je ugrađen u Prioritete Evropske komisije u okviru 'Održavanje kvalitete života: sigurnost hrane, voda i priroda'.
  Pokazatelj se može smatrati sličnim globalnim pokazateljima Ciljeva održivog razvoja 15.1.2 "Udio važnih lokacija za kopneni i slatkovodni biodiverzitet koji su pokriveni zaštićenim područjima, prema tipu ekosistema" i 15.4.1 "Pokrivenost zaštićenim područjima važnih lokacija za planinski biodiverzitet".
15-20-methodology: >-
  Direktiva EU o pticama i Direktiva o staništima imaju za cilj održavanje ili obnavljanje povoljnog statusa očuvanja zaštićenih staništa i vrsta, te zaštitu njihovog održivog korištenja i upravljanja. Direktiva o pticama štiti sve vrste divljih ptica i njihova staništa. Direktiva o staništima štiti više od 1300 drugih rijetkih, ugroženih ili endemskih vrsta divljih životinja i biljaka i 233 tipa prirodnih staništa. Osim toga, mreža zaštićenih područja Natura 2000 obuhvata područja koja su države članice EU odredile prema Direktivama o pticama i staništima.
15-20-long_term_objective: >-
  Strategija EU za biodiverzitet ima za cilj zaštitu najmanje 30% kopna i mora u Evropi, uključujući i nacionalno određena područja i područja Natura 2000.
15-42-title: Uticaj suše na ekosisteme
15-42-definition: >-
  Ovaj indikator pokazuje područje pogođeno sušom praćenjem negativnih anomalija u produktivnosti vegetacije u područjima s ozbiljnim deficitom vlažnosti tla tokom vegetacijske sezone (više od jedne standardne devijacije od dugogodišnjeg prosjeka - posmatrano putem podataka daljinskog istraživanja u rezoluciji od 500×500 metara Copernicus EMS Evropske opservatorije za sušu Zajedničkog istraživačkog centra Evropske komisije.
  Indikator pokriva samo poljoprivredne suše s deficitom vlažnosti tla koji uzrokuje smanjenu produktivnost vegetacije zbog nedovoljnih padavina, za razliku od hidroloških suša, koje se javljaju kada niske zalihe vode postanu očigledne u potocima, akumulacijama i nivoima podzemnih voda, obično nakon mnogo mjeseci meteorološke suše.
15-42-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 15 o zaštiti, obnovi i promociji održivog korištenja zemljišta, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
15-42-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutrašnjih vodenih i planinskih ekosistema. To uključuje napore za održivo upravljanje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka biodiverziteta i zaštitu ugroženih vrsta.
15-42-long_term_objective: >-
  Strategija za tlo za 2030. godinu postavila je cilj nulte neto eksploatacije zemljišta do 2050. godine.
15-50-title: Područje ugroženo teškom erozijom tla vodom
15-50-definition: >-
  Indikator procjenjuje površinu potencijalno pogođenu ozbiljnom erozijom tla vodom, kao što su prskanje kišom, spiranje snijega i potočići (gubitak tla > 10 tona/hektar/godišnje). Ova površina se izražava u km2 i kao postotak ukupne neumjesne, erozivne površine u zemlji. Tamo gdje ne postoji zemljište koje je u riziku od erozije tla vodom većom od 10 tona po hektaru, zemlja će imati nultu vrijednost. Erozija tla se i dalje može javljati u područjima tih zemalja, ali brzinom manjom od 10 tona po hektaru.
  Ovi brojevi se procjenjuju korištenjem modificirane verzije modela Revidirane univerzalne jednačine gubitka tla (RUSLE 2015), koja daje procjene na rezoluciji od 100 m na osnovu recenziranih ulaznih slojeva erozivnosti padavina, erodibilnosti tla, topografije, korištenja zemljišta i upravljanja. Sljedeće klase nomenklature CORINE Land Cover (CLC) su uključene: Poljoprivredna područja (2), šumska i poluprirodna područja (3) isključujući plaže, dine, pješčane ravnice (3.3.1), gole stijene (3.3.2), glečere i vječni snijeg (3.3.5). Generalno, vještačke, pjeskovite, kamenite i zaleđene površine, kao i močvare i vodena tijela, nisu uključene.
15-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 15 o zaštiti, obnovi i promociji održivog korištenja zemljišta i prema cilju održivog razvoja 2 o iskorjenjivanju gladi, postizanju sigurnosti hrane i poboljšane prehrane te promociji održive poljoprivrede, koji su ugrađeni u prioritete Europske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
15-50-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutrašnjih vodenih i planinskih ekosistema. To uključuje napore za održivo upravljanje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka biološke raznolikosti i zaštitu ugroženih vrsta.
  Cilj održivog razvoja 2 nastoji okončati glad i pothranjenost te osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Ostvarenje ovog cilja uveliko će ovisiti o promoviranju održivih proizvodnih sistema i povećanju ulaganja u ruralnu infrastrukturu te poljoprivredna istraživanja i razvoj.
  Strategija za tlo za 2030. godinu prepoznaje eroziju kao prijetnju tlu u EU. Zajednička poljoprivredna politika Evrope postavlja zahtjeve za zaštitu korištenih poljoprivrednih površina od erozije i uspostavlja okvir standarda koji, između ostalog, imaju za cilj doprinijeti sprječavanju erozije tla.
15-50-long_term_objective: >-
15-60-title: Indeks ptica
15-60-definition: >-
  Indikator je kompozitni indeks više vrsta, koji mjeri relativnu brojnost odabranih uobičajenih vrsta ptica povezanih sa specifičnim staništima. Rijetke vrste su isključene. Zastupljene su tri grupe vrsta ptica: uobičajene vrste poljoprivrednog zemljišta (39 vrsta), uobičajene šumske vrste (34 vrste) i sve uobičajene vrste ptica (168 vrsta; uključujući vrste poljoprivrednog zemljišta i šume).
15-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 15 o zaštiti, obnovi i promociji održivog korištenja zemljišta i prema cilju održivog razvoja 2 o iskorjenjivanju gladi, postizanju sigurnosti hrane i poboljšane prehrane te promociji održive poljoprivrede, koji su ugrađeni u prioritete Europske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
15-60-methodology: >-
  Cilj održivog razvoja 15 nastoji zaštititi, obnoviti i promovirati očuvanje i održivo korištenje kopnenih, unutrašnjih vodenih i planinskih ekosistema. To uključuje napore za održivo upravljanje šumama i zaustavljanje deforestacije, borbu protiv dezertifikacije, obnovu degradiranog zemljišta i tla, zaustavljanje gubitka biodiverziteta i zaštitu ugroženih vrsta.
  Cilj održivog razvoja 2 nastoji okončati glad i pothranjenost te osigurati pristup sigurnoj, hranjivoj i dovoljnoj hrani. Ostvarenje ovog cilja uveliko će ovisiti o promoviranju održivih proizvodnih sistema i povećanju ulaganja u ruralnu infrastrukturu te poljoprivredna istraživanja i razvoj.
  Ptice i staništa ugroženih i migratornih vrsta ptica zaštićeni su Direktivom o pticama. Mnoga staništa koja koriste ptice također su zaštićena Direktivom o staništima. Strategija EU o biodiverzitetu za 2030. godinu posebno navodi da ove Direktive o prirodi treba u potpunosti implementirati u nastojanju da se zaustave i preokrenu trendovi gubitka biodiverziteta.
15-60-long_term_objective: >-
15-61-title: Indeks livadskih leptira
15-61-definition: >-
  Indeks leptira travnjaka EU integriše trendove populacije 17 vrsta leptira koje se prate širom EU i izračunava se na osnovu podataka iz svih 27 država članica EU. Početna godina nacionalnih vremenskih serija kreće se od 1990. do 2023. godine, stoga je indeks trenutno predstavljen kao agregirani podatak EU sa izglađenim vrijednostima. Podaci su integrisani i obezbeđeni od strane Butterfly Conservation Europe, partnerstva Evropske šeme za praćenje leptira, projekta EMBRACE.
15-61-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 15 o zaštiti, obnovi i promociji održivog korištenja zemljišta, koji je ugrađen u prioritete Evropske komisije u okviru „Održavanja kvalitete života: sigurnost hrane, voda i priroda“.
15-61-methodology: >-
  Strategija EU za biodiverzitet do 2030. godine ima za cilj obnovu degradiranih ekosistema i zaustavljanje i preokretanje trenda smanjenja broja oprašivača. Direktiva o staništima i Direktiva o pticama igraju centralnu ulogu u postizanju ovih ciljeva. U junu 2018. godine, Evropska komisija je usvojila prvu inicijativu EU o oprašivačima, uključujući leptire. Inicijativa postavlja okvir za integrirani pristup rješavanju problema smanjenja broja oprašivača u EU i za efikasnije korištenje postojećih alata i politika.
15-61-long_term_objective: >-
16-10-title: Standardizovana stopa smrtnosti zbog ubistava
16-10-definition: >-
  Indikator mjeri standardiziranu stopu smrtnosti od ubistava i povreda koje je nanijela druga osoba s namjerom da povrijedi ili ubije na bilo koji način, uključujući „kasne posljedice“ napada (šifre Međunarodne klasifikacije bolesti (MKB) X85 do Y09 i Y87.1). Ne uključuje smrtne slučajeve uzrokovane pravnim intervencijama ili ratom (šifre MKB Y35 i Y36).
  Podaci o uzrocima smrti (UZS) odnose se na osnovni uzrok koji je - prema Svjetskoj zdravstvenoj organizaciji (SZO) - „bolest ili povreda koja je pokrenula niz morbidnih događaja koji su direktno doveli do smrti ili okolnosti nesreće ili nasilja koje je prouzrokovalo smrtonosnu povredu“. Podaci o UZS-u se izvode iz smrtovnica.
16-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
  Pokazatelj se može smatrati dijelom globalnog pokazatelja cilja održivog razvoja 16.1.2 „Smrti povezane sa sukobima na 100.000 stanovnika, po spolu, dobi i uzroku“.
16-10-methodology: >-
  Evropska komisija je 24. jula 2020. godine utvrdila Strategiju sigurnosne unije EU za period od 2020. do 2025. godine. Kao ključnu komponentu strategije, Komisija je definirala novi put naprijed u oblasti unutrašnje sigurnosti s akcijama u ključnim oblastima: organizovani kriminal; terorizam i sprečavanje nasilne radikalizacije; otpornost naše kritične infrastrukture i javnih prostora; sajber kriminal, uključujući borbu protiv seksualnog zlostavljanja djece; saradnja u provođenju zakona i razmjena informacija; te istraživanje i inovacije.
  Sigurnost je ključni aspekt u životima ljudi. Nesigurnost bilo koje vrste izvor je straha i brige, što negativno utiče na kvalitet života. Fizička nesigurnost uključuje sve vanjske faktore koji bi potencijalno mogli ugroziti fizički integritet pojedinca. Kriminalne radnje su jedna od najočitijih zloupotreba nesigurnosti. Analize fizičke nesigurnosti obično kombinuju i subjektivne i objektivne aspekte - subjektivnu percepciju nesigurnosti i objektivni nedostatak sigurnosti mjeren statistikom kriminala. Kao takav, ovaj indikator doprinosi razumijevanju sigurnosti društva.
16-10-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 0,3.
16-20-title: Stanovništvo koje prijavljuje kriminal, nasilje ili vandalizam u svojoj zajednici
16-20-definition: >-
  Indikator pokazuje udio stanovništva koji je prijavio suočavanje s problemom kriminala, nasilja ili vandalizma u svom lokalnom području. Ovo opisuje situaciju u kojoj ispitanik smatra da kriminal, nasilje ili vandalizam u tom području predstavljaju problem za domaćinstvo, iako ta percepcija nije nužno zasnovana na ličnom iskustvu.
16-20-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji su ugrađeni u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 16.1.4 „Udio stanovništva koji se osjeća sigurno šetajući sam po području u kojem živi nakon mraka“.
16-20-methodology: >-
  Sigurnost je ključni aspekt u životima ljudi. Nesigurnost bilo koje vrste izvor je straha i brige, što negativno utiče na kvalitet života. Fizička nesigurnost uključuje sve vanjske faktore koji potencijalno mogu ugroziti fizički integritet pojedinca. Kriminalne radnje su jedna od najočitijih zloupotreba nesigurnosti. Analize fizičke nesigurnosti obično kombinuju i subjektivne i objektivne aspekte - subjektivnu percepciju nesigurnosti i objektivni nedostatak sigurnosti mjeren statistikom kriminala. Ovaj indikator stoga dopunjuje indikator o stopama ubistava fokusirajući se na percepciju nesigurnosti.
  Strategija ProtectEU Evropske komisije ima za cilj povećanje sposobnosti država članica EU da zaštite društva i demokratije od online i offline prijetnji terorista, kriminalaca i neprijateljskih stranih aktera. Nadalje, garantovat će da se sigurnosne implikacije uzmu u obzir u svim budućim politikama EU.
16-20-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost 4.
16-30-title: Ukupna potrošnja opće vlade na sudove
16-30-definition: >-
  Indikator mjeri ukupne državne rashode za sudove prema klasifikaciji funkcija vlade (COFOG). To uključuje rashode za administraciju, rad ili podršku sudovima građanskog i krivičnog prava i pravosudnom sistemu, uključujući izvršenje novčanih kazni i pravnih poravnanja koje izriču sudovi i rad sistema uslovnog otpusta i probacije; pravno zastupanje i savjetovanje u ime vlade ili u ime drugih koje vlada pruža u gotovini ili uslugama. Sudovi uključuju upravne tribunale, ombudsmane i slično, a isključuju zatvorske uprave.
  Pri izračunavanju indikatora po glavi stanovnika, prosječni podaci o stanovništvu Nacionalnih računa (NA) referentne godine koriste se kao nazivnik (izračunati kao aritmetička sredina stanovništva na dan 1. januara dvije uzastopne godine).
16-30-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
16-30-methodology: >-
  Dobro funkcionisanje pravosudnih sistema je važan strukturni uslov na kojem države članice EU zasnivaju svoje politike održivog rasta i socijalne stabilnosti. Bez obzira na model nacionalnog pravosudnog sistema ili pravnu tradiciju na kojoj je zasnovan, kvalitet, nezavisnost i efikasnost su među bitnim parametrima „efikasnog pravosudnog sistema“. Poboljšanje efikasnosti pravosudnih sistema u državama članicama identifikovano je kao ključna komponenta za strukturne reforme u Evropskom semestru, godišnjem ciklusu za koordinaciju ekonomskih politika na nivou EU. Izvještaj o vladavini prava procjenjuje stanje pravosudnih sistema država članica, a Tabela stanja u pravosuđu EU dopunjuje je praćenjem efikasnosti, kvaliteta i nezavisnosti pravosudnih sistema država članica. Kao ključni dio Tabele stanja u pravosuđu EU, ovaj pokazatelj pomaže u procjeni kvaliteta pravosudnog sistema.
16-30-long_term_objective: >-
16-40-title: 'Percipirana nezavisnost pravosudnog sistema: vrlo ili prilično dobra'
16-40-definition: >-
  Indikator je osmišljen kako bi istražio percepciju ispitanika o nezavisnosti pravosuđa u državama članicama EU, posebno se fokusirajući na percipiranu nezavisnost sudova i sudija u nekoj zemlji. Podaci o percipiranoj nezavisnosti pravosudnog sistema potiču iz godišnjih istraživanja Flash Eurobarometra, koja su započela 2016. godine u ime Generalne direkcije za pravosuđe i potrošače Evropske komisije. U ovom istraživanju, od ispitanika se traži da odgovore na sljedeće pitanje: „Na osnovu onoga što znate, kako biste ocijenili pravosudni sistem u (OVOJ ZEMLJI) u smislu nezavisnosti sudova i sudija? Biste li rekli da je vrlo dobar, prilično dobar, prilično loš ili vrlo loš?“
16-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
16-40-methodology: >-
  Pored dovoljnih finansijskih sredstava, sudije na sudovima moraju biti u mogućnosti donositi odluke bez miješanja ili pritiska od strane politike ili drugih ekonomskih aktera, kako bi se osiguralo da pojedinci i preduzeća mogu u potpunosti uživati svoja prava. Poštovanje vladavine prava je preduslov za zaštitu svih temeljnih vrijednosti navedenih u Ugovorima EU, uključujući demokratiju i temeljna prava. Poboljšanje efikasnosti pravosudnih sistema u državama članicama identifikovano je kao ključna komponenta za strukturne reforme u Evropskom semestru. Izvještaj o vladavini prava procjenjuje stanje pravosudnih sistema država članica, a Tabela stanja u pravosuđu EU dopunjuje ga praćenjem efikasnosti, kvaliteta i nezavisnosti pravosudnih sistema država članica.
16-40-long_term_objective: >-
16-50-title: Indeks percipirane korupcije
16-50-definition: >-
  Indikator je kompozitni indeks zasnovan na kombinaciji anketa i procjena korupcije iz 13 različitih izvora, te ocjenjuje i rangira zemlje na osnovu toga koliko se percipira korumpirani javni sektor u nekoj zemlji, pri čemu ocjena 0 predstavlja vrlo visok nivo korupcije, a ocjena 100 predstavlja vrlo čistu zemlju. CPI uključuje samo izvore koji daju ocjenu za skup zemalja/teritorija i koji mjere percepciju korupcije u javnom sektoru. Da bi se zemlja/teritorija uvrstila u rang listu, mora biti uključena u najmanje tri izvora podataka CPI-ja. CPI objavljuje Transparency International.
16-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju cilja održivog razvoja 16.5.2 „Udio preduzeća koja su imala barem jedan kontakt s javnim službenikom i koja su platila mito javnom službeniku ili su im ti javni službenici tražili mito tokom prethodnih 12 mjeseci“.
16-50-methodology: >-
  Korupcija nanosi finansijsku štetu snižavanjem nivoa investicija, ometanjem pravednog funkcionisanja unutrašnjeg tržišta i smanjenjem javnih finansija. Također uzrokuje društvenu štetu jer organizirane kriminalne grupe koriste korupciju za činjenje drugih teških krivičnih djela, poput trgovine drogom i ljudima. Budući da ne postoji smislen način za procjenu apsolutnih nivoa korupcije u zemljama ili teritorijama na osnovu čvrstih empirijskih podataka, prikupljanje percepcija korupcije onih koji su u poziciji da ponude procjene korupcije u javnom sektoru do sada je najpouzdanija metoda poređenja relativnih nivoa korupcije u različitim zemljama.
16-50-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost od 88.
16-70-title: Žrtve trgovine ljudima prema spolu
16-70-definition: >-
  Indikator je kompozitni indeks zasnovan na kombinaciji anketa i procjena korupcije iz 13 različitih izvora, te ocjenjuje i rangira zemlje na osnovu toga koliko se percipira korumpirani javni sektor u nekoj zemlji, pri čemu ocjena 0 predstavlja vrlo visok nivo korupcije, a ocjena 100 predstavlja vrlo čistu zemlju. CPI uključuje samo izvore koji daju ocjenu za skup zemalja/teritorija i koji mjere percepciju korupcije u javnom sektoru. Da bi se zemlja/teritorija uvrstila u rang listu, mora biti uključena u najmanje tri izvora podataka CPI-ja. CPI objavljuje Transparency International.
16-70-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 16 o miru, pravdi i jakim institucijama, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
16-70-methodology: >-
  Sigurnost je ključni aspekt u životima ljudi. Nesigurnost bilo koje vrste izvor je straha i brige, što negativno utiče na kvalitet života. Fizička nesigurnost uključuje sve vanjske faktore koji potencijalno mogu ugroziti fizički integritet pojedinca. Kriminalna djela su jedan od najočitijih uzroka nesigurnosti. Analize fizičke nesigurnosti obično kombinuju i subjektivne i objektivne aspekte - subjektivnu percepciju nesigurnosti i objektivni nedostatak sigurnosti mjeren statistikom kriminala. Ovaj indikator stoga dopunjuje indikator o stopama ubistava fokusirajući se na percepciju nesigurnosti.
  Strategija ProtectEU Evropske komisije ima za cilj povećanje sposobnosti država članica EU da zaštite društva i demokratije od online i offline prijetnji terorista, kriminalaca i neprijateljskih stranih aktera. Nadalje, garantovat će da se sigurnosne implikacije uzmu u obzir u svim budućim politikama EU.
16-70-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost 0.
17-10-title: Službena razvojna pomoć
17-10-definition: >-
  Zvanična razvojna pomoć (ODA) sastoji se od grantova, kredita i investicija u kapital koje provodi zvanični sektor s ciljem promovisanja ekonomskog razvoja i blagostanja u zemljama u razvoju. Isplate evidentiraju stvarni međunarodni transfer finansijskih sredstava ili robe ili usluga procijenjenih po trošku donatora. ODA je ovdje predstavljena kao udio bruto nacionalnog dohotka (BND). BND po tržišnim cijenama jednak je bruto domaćem proizvodu (BDP) umanjen za primarni dohodak koji rezidentne jedinice plaćaju nerezidentnim jedinicama, plus primarni dohodak koji rezidentne jedinice primaju od ostatka svijeta. Spisak zemalja i teritorija koje ispunjavaju uslove za primanje ODA određuje Odbor za razvojnu pomoć OECD-a.
17-10-intention: >-
  Pokazatelj se koristi za praćenje napretka prema Cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, očuvanja naših vrijednosti“.
  Pokazatelj se može smatrati sličnim globalnom pokazatelju Cilja održivog razvoja 17.2.1 „Neto službena razvojna pomoć, ukupna i najmanje razvijenim zemljama, kao udio BND-a donatora OECD-DAC-a“.
  Napredne ekonomije poput EU mogu podržati zemlje u razvoju da pređu na održive – i od strane zemalja vođene – razvojne puteve na različite načine. To uključuje pružanje službene razvojne pomoći (ODA). Iz tog razloga postoji dugoročni cilj izdvajanja 0,7% bruto nacionalnog dohotka (BND) za ODA.
17-10-methodology: >-
  Evropski konsenzus  o razvoju iz juna 2017. godine ističe potrebu da se visok udio službene razvojne pomoći dodijeli najmanje razvijenim zemljama (LDC) i drugim zemljama s niskim prihodima. Stoga bi 0,15-0,20% BND-a trebalo biti dodijeljeno LDC-ima u kratkom roku, a taj iznos bi se do 2030. godine povećao na 0,20%. Konsenzus zauzima sveobuhvatan pristup implementaciji, kombinirajući pomoć s drugim resursima, uz dobre politike i ojačani pristup koherentnosti politika za razvoj.
17-10-long_term_objective: >-
  Dugoročni cilj za ovaj indikator je vrijednost 1.
17-20-title: Finansiranje EU-a zemljama u razvoju
17-20-definition: >-
  Indikator prikazuje ukupno zvanično i privatno finansiranje EU zemljama u razvoju. To se sastoji od neto isplata zvanične razvojne pomoći (ODA), ostalih zvaničnih tokova (OOF), privatnih tokova (uglavnom stranih direktnih investicija, FDI) i grantova privatnih agencija i nevladinih organizacija.
  ODA se sastoji od grantova ili koncesijskih kredita koje odobrava zvanični sektor s glavnim ciljem promocije ekonomskog razvoja i blagostanja u zemljama primateljima. OOF su transakcije koje ne ispunjavaju uslove za kvalifikovanje kao ODA, bilo zato što nisu prvenstveno usmjerene na razvoj, bilo zato što imaju element granta manji od 25%. Privatni tokovi uključuju direktne investicije, obveznice, izvozne kredite i multilateralne privatne tokove.
  Grantovi privatnih agencija i nacionalnih nevladinih organizacija sastoje se od sredstava za razvojnu pomoć i pomoć, zajedno sa svim dodatnim doprinosima u naturi, uključujući, na primjer, prihode od prodaje božićnih čestitki u dobrotvorne svrhe ili posebne apele (na primjer, za pomoć u katastrofama).
17-20-intention: >-
  Pokazatelji koji se koriste za praćenje napretka prema cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
17-20-methodology: >-
  Cilj 17, Zvanična razvojna pomoć i drugi finansijski resursi, bilo javni ili privatni, domaći ili međunarodni, bit će potrebni.
  EU primjenjuje koherentan i podržavajući pristup razvoju, gdje svi finansijski tokovi prema zemljama u razvoju, uključujući pomoć, investicije i trgovinu, djeluju zajedno s mobilizacijom domaćih resursa i dobrim politikama kako bi se pomoglo u izgradnji kapaciteta i podršci samostalnosti u tim zemljama. Stoga, indikator dopunjuje indikator o razvojnoj pomoći.
17-20-long_term_objective: >-
17-31-title: Uvoz EU-a iz najmanje razvijenih zemalja
17-31-definition: >-
  Ovaj pokazatelj se definiše kao udio ukupnog uvoza izvan EU koji dolazi iz zemalja koje UN klasifikuje kao najmanje razvijene. Pokazuje u kojoj mjeri proizvodi iz tih zemalja pristupaju tržištu EU. Informacije za ovaj pokazatelj daju preduzeća s obimom trgovine iznad utvrđenog praga i prikupljaju se na osnovu carinskih deklaracija. Ove informacije zatim prilagođavaju države članice kako bi uzele u obzir uticaj trgovine ispod ovog praga.
17-31-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, očuvanja naših vrijednosti“.
  Potencijalni doprinos trgovine održivom razvoju je odavno priznat. EU predvodi put ka ravnopravnijem globalnom partnerstvu sa zemljama u razvoju zauzimanjem odgovornog pristupa trgovinskoj i investicijskoj politici, na primjer kroz strategiju „Trgovina za sve“ (2015) koja ima za cilj da pomogne zemljama u razvoju da potpunije učestvuju na globalnom tržištu. Nadalje, EU olakšava uvoz iz zemalja u razvoju odobravanjem smanjenja carina u okviru svoje Opšte šeme preferencijala i pružanjem „Pomoći za trgovinu“ usmjerene na podršku trgovinskoj infrastrukturi, pomoći vezanoj za trgovinu i razvoju privatnog sektora. Konačno, Sporazum iz Cotonoua reguliše odnose EU sa 79 zemalja iz Afrike, Kariba i Pacifika (AKP), fokusirajući se na razvojnu saradnju, političku saradnju, kao i ekonomsku i trgovinsku saradnju.
17-31-methodology: >-
  EU je ažurirala svoju Strategiju pomoći za trgovinu 2017. godine, kako bi odrazila značajne političke promjene i na globalnom nivou - posebno Agendu 2030 - i na nivou EU, uključujući novi Evropski konsenzus o razvoju i trgovini za sve. Ažurirana strategija ima za cilj poboljšanje koherentnosti pomoći za trgovinu s drugim politikama i instrumentima EU, uključujući trgovinske sporazume EU i jednostrane sheme preferencijala. Fokus na najmanje razvijene zemlje predstavlja ključni dio ažurirane strategije. EU je 2021. godine provela reviziju svoje trgovinske strategije, s ciljem da odrazi svoj novi, održiviji model rasta, kao i ciljeve održivog razvoja.
17-31-long_term_objective: >-
17-40-title: Bruto dug opće vlade
17-40-definition: >-
  Pokazatelj je definiran u konsolidovanoj verziji Ugovora o funkcioniranju Evropske unije iz 2012. godine i dalje razrađen u Uredbi Vijeća (EZ) br. 479/2009, s izmjenama i dopunama, i Uredbi (EU) br. 549/2013 Evropskog parlamenta i Vijeća (ESA 2010) i naknadnim zakonskim izmjenama, dopunjen daljnjim tumačenjima i smjernicama Eurostata, posebno Priručnikom o državnom deficitu i dugu kao omjeru ukupnog bruto državnog duga po nominalnoj vrijednosti na kraju godine i BDP-a po tekućim tržišnim cijenama.
  Državni dug se definira kao ukupni konsolidovani bruto dug po nominalnoj vrijednosti na kraju godine u sljedećim kategorijama državnih obaveza (kako je definirano u ESA 2010): gotovina i depoziti (AF.2), dužničke vrijednosne papire (AF.3) i krediti (AF.4). Sektor opće države obuhvata podsektore centralne vlade, državne vlade, lokalne vlade i fondova socijalnog osiguranja.
17-40-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
17-40-methodology: >-
  Da bi se pomoglo drugima da unaprijede svoje ekonomije, ključno je održati vlastite ekonomije EU na putu održivog razvoja. Makroekonomsko upravljanje, koje ima za cilj osigurati financijsku stabilnost u EU, stoga je jedan od stubova doprinosa EU provedbi ciljeva održivog razvoja. Državni dug bi stoga trebao biti ograničen na upravljiv nivo i ne bi trebao prelaziti 60% BDP-a, kako je utvrđeno u Ugovoru o funkcioniranju Evropske unije. To čini osnovu Pakta o stabilnosti i rastu i Procedure u slučaju prekomjernog deficita (EDP), koja osigurava fiskalnu održivost.
  2024. godine stupila je na snagu ambiciozna reforma okvira ekonomskog upravljanja EU, usmjerena na jačanje održivosti duga država članica i promoviranje održivog i inkluzivnog rasta u svim državama članicama.
17-40-long_term_objective: >-
17-50-title: Udio poreza na zaštitu okoliša u ukupnim poreznim prihodima
17-50-definition: >-
  Indikator mjeri udio poreza na okoliš u ukupnim prihodima od poreza i socijalnih doprinosa. Porezi na okoliš definiraju se kao porezi čija je porezna osnovica fizička jedinica (ili njezina zamjena) nečega što ima dokazan, specifičan negativan utjecaj na okoliš. Prihodi od poreza na okoliš potiču od četiri vrste poreza: porezi na energiju (koji doprinose oko tri četvrtine ukupnog iznosa), porezi na transport (oko jedne petine ukupnog iznosa) i porezi na zagađenje i resurse (oko 4% ukupnog iznosa).
17-50-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj, koji je ugrađen u prioritete Evropske komisije u okviru „Nove ere za evropsku odbranu i sigurnost“ i „Zaštite naše demokratije, podržavajući naše vrijednosti“.
17-50-methodology: >-
  U globalnom kontekstu, gdje obrasci potrošnje u jednoj regiji mogu ozbiljno utjecati na obrasce proizvodnje u drugim dijelovima svijeta, posebno je važno da cijene odražavaju stvarne troškove potrošnje i proizvodnje. Stoga bi trebale uključivati i plaćanja za štetu koju aktivnosti uzrokuju ljudskom zdravlju i okolišu. Politike EU, poput Evropskog zelenog plana, pozivaju na prelazak s poreza na rad na poreze na energiju i okoliš kao dio „ozelenjavanja“ poreskih sistema, što znači da bi prihodi od poreza na okoliš trebali porasti u odnosu na poreze na rad. Evropski semestar prati napredak prema ciljevima utvrđenim u evropskim strategijama.
17-50-long_term_objective: >-
17-60-title: Udio domaćinstava sa brzom internet vezom
17-60-definition: >-
  Indikator mjeri udio domaćinstava s fiksnom vezom na mrežu vrlo visokog kapaciteta (VHCN). Mreža vrlo visokog kapaciteta označava ili elektronsku komunikacijsku mrežu koja se u potpunosti sastoji od optičkih vlakana barem do distribucijske tačke na lokaciji posluživanja, ili elektronsku komunikacijsku mrežu sposobnu da, pod uobičajenim uslovima vršnog opterećenja, pruži slične mrežne performanse u smislu dostupne propusnosti za silazni i uzlazni tok, otpornosti, parametara povezanih s greškama, te latencije i njenih varijacija.
  Podaci se odnose i na optičko vlakno do prostorija (FTTP) i na specifikaciju interfejsa za usluge prenosa podataka preko kabla (DOCSIS) 3.1. DOCSIS omogućava dodavanje prenosa podataka visokog propusnog opsega postojećim kablovskim televizijskim sistemima.
  'Ruralna područja' su definirana kao ona s manje od 100 ljudi po km2.
17-60-intention: >-
  Pokazatelj se koristi za praćenje napretka prema cilju održivog razvoja 17 o revitalizaciji globalnog partnerstva za održivi razvoj i cilju održivog razvoja 9 o industriji, inovacijama i infrastrukturi. Ciljevi održivog razvoja 9 i 17 ugrađeni su u prioritet Evropske komisije pod nazivom „Novo doba za evropsku odbranu i sigurnost“. Cilj održivog razvoja 17 također je ugrađen u prioritet Evropske komisije „Zaštita naše demokratije, održavanje naših vrijednosti“.
  Priprema Evrope za digitalno doba je stoga jedan od šest prioriteta Komisije za period 2019–2024. Cilj je učiniti digitalnu transformaciju korisnom za ljude i preduzeća, a istovremeno pomoći u postizanju cilja klimatski neutralne Evrope do 2050. godine. Cilj održivog razvoja 17 prepoznaje važnost pristupa nauci, tehnologiji i inovacijama za održivi razvoj. Broj pretplata na širokopojasni internet na 100 stanovnika jedan je od pokazatelja koje UN koristi za mjerenje napretka prema povezanom cilju. U svojoj Digitalnoj strategiji za 2020. godinu, Evropska komisija je naglasila posvećenost EU razvoju Globalne strategije digitalne saradnje, koja će odražavati ciljeve održivog razvoja.
17-60-methodology: >-
  U svojoj Komunikaciji iz 2016. godine pod nazivom „Povezivanje za konkurentno jedinstveno digitalno tržište – prema evropskom gigabitnom društvu“, Evropska komisija je postavila viziju za evropsko gigabitno društvo, operacionaliziranu kroz tri cilja za 2025. godinu. EU ima za cilj gigabitnu povezivost za mjesta koja potiču socio-ekonomski razvoj, 5G pokrivenost za sva urbana područja i sve glavne kopnene transportne puteve, te pristup internetskoj povezivosti od najmanje 100 Mbps za sva evropska domaćinstva. Strategija „Od farme do stola“ potvrdila je ovaj cilj pozivajući na ubrzanje uvođenja brzog širokopojasnog interneta u ruralnim područjima kako bi se postigao cilj od 100% pristupa do 2025. godine.
  U martu 2021. godine, Komisija je – u svom Digitalnom kompasu za 2030. godinu – predstavila viziju i puteve za digitalnu transformaciju Evrope do 2030. godine, fokusirajući se na četiri glavna područja: (1) vještine, (2) sigurnu i održivu digitalnu infrastrukturu, (3) digitalnu transformaciju preduzeća i (4) digitalizaciju javnih usluga. Nadovezujući se na Komunikaciju iz 2016. godine, Digitalni kompas definira cilj da do 2030. godine sva evropska domaćinstva budu pokrivena gigabitnom mrežom, a sva naseljena područja 5G mrežom.
17-60-long_term_objective: >-
  Nadovezujući se na Komunikaciju iz 2016. godine, Digitalni kompas definira cilj da do 2030. godine sva evropska domaćinstva budu pokrivena gigabitnom mrežom, a sva naseljena područja 5G mrežom.
