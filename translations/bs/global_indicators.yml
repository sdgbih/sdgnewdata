1-1-1-title: Osobe u riziku od siromaštva ili socijalne isključenosti
1-1-1-definition: >-
  Ovaj indikator odgovara zbiru ljudi koji su: u riziku od siromaštva nakon socijalnih transfera, 
  teško materijalno i socijalno uskraćeni ili žive u domaćinstvima s vrlo niskim intenzitetom rada. 
  Pojedinci se broje samo jednom, čak i ako su pogođeni s više od jedne od ovih pojava. 
  Smatra se da su ljudi izloženi riziku od siromaštva nakon socijalnih transfera ako njihov 
  ekvivalentni raspoloživi dohodak nije veći od praga rizika od siromaštva, koji je postavljen 
  na 60% nacionalne medijane ekvivalentnog raspoloživog dohotka. Stopa teške materijalne i 
  socijalne deprivacije je udio stanovništva koje doživljava prisilni nedostatak od najmanje 
  7 od 13 stavki deprivacije.
1-1-1-intention: >-
  Siromaštvo i socijalna isključenost su štetni za živote pojedinaca i ograničavaju mogućnosti 
  ljudi da ostvare svoj puni potencijal utičući na njihovo zdravlje i blagostanje te smanjujući 
  obrazovne ishode. Bez efikasnog sistema socijalne zaštite, rizik od siromaštva se prenosi sa 
  jedne generacije na drugu, što stvara još veću nejednakost i ometa inkluzivni i održivi 
  ekonomski rast. Dugoročni cilj za ovaj indikator je vrijednost od 0.
1-1-1-methodology: >-
  Podaci se zasnivaju na usaglašenom godišnjem istraživanju o prihodima i uslovima života (EU-SILC). 
  U 2020. godini, EU-SILC je prošao opsežne metodološke revizije i integrisan je u mikrocenzus. 
  Kao rezultat toga, podaci od 2020. godine nadalje nisu uporedivi sa podacima iz prethodnih godina. 
  Od 2021. godine primjenjuje se Uredba (EU) 2019/1700 koja definiše standarde prikupljanja i obrade podataka.
