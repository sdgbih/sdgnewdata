definition-label: NASLOV DEFINITION
rationale-label: NASLOV RATIONALE
methodology-label: NASLOV METODOLGOGIJA
1-1-1-title: Osobe u riziku od siromaštva ili socijalne isključenosti
1-1-1-definition: >-
  Ovaj indikator odgovara zbiru ljudi koji su: u riziku od siromaštva nakon socijalnih transfera, 
  teško materijalno i socijalno uskraćeni ili žive u domaćinstvima s vrlo niskim intenzitetom rada. 
  Pojedinci se broje samo jednom, čak i ako su pogođeni s više od jedne od ovih pojava. 
  Smatra se da su ljudi izloženi riziku od siromaštva nakon socijalnih transfera ako njihov 
  ekvivalentni raspoloživi dohodak nije veći od praga rizika od siromaštva, koji je postavljen 
  na 60% nacionalne medijane ekvivalentnog raspoloživog dohotka. Stopa teške materijalne i 
  socijalne deprivacije je udio stanovništva koje doživljava prisilni nedostatak od najmanje 
  7 od 13 stavki deprivacije.
1-1-1-intention: >-
  Siromaštvo i socijalna isključenost su štetni za živote pojedinaca i ograničavaju mogućnosti 
  ljudi da ostvare svoj puni potencijal utičući na njihovo zdravlje i blagostanje te smanjujući 
  obrazovne ishode. Bez efikasnog sistema socijalne zaštite, rizik od siromaštva se prenosi sa 
  jedne generacije na drugu, što stvara još veću nejednakost i ometa inkluzivni i održivi 
  ekonomski rast. Dugoročni cilj za ovaj indikator je vrijednost od 0.
1-1-1-methodology: >-
  Podaci se zasnivaju na usaglašenom godišnjem istraživanju o prihodima i uslovima života (EU-SILC). 
  U 2020. godini, EU-SILC je prošao opsežne metodološke revizije i integrisan je u mikrocenzus. 
  Kao rezultat toga, podaci od 2020. godine nadalje nisu uporedivi sa podacima iz prethodnih godina. 
  Od 2021. godine primjenjuje se Uredba (EU) 2019/1700 koja definiše standarde prikupljanja i obrade podataka.
1-2-1-title: Osobe u opasnosti od monetarnog siromaštva nakon socijalnih transfera
1-2-1-definition: >-
  Omjer dohotka kvintila (S80/S20) je omjer ukupnog ekvivalentnog raspoloživog
  dohotka koji prima najbogatijih 20% stanovništva prema dohotku koji prima
  najsiromašnijih 20%. Viša vrijednost ukazuje na veću nejednakost u dohotku.
  Podaci su preuzeti iz EU ankete o prihodima i uvjetima življenja (EU-SILC).
1-2-1-intention: >-
  Nejednakost u dohotku potkopava društvenu koheziju i ograničava životne
  mogućnosti onih koji se nalaze na dnu distribucije dohotka. Smanjenje
  nejednakosti preduvjet je za održivi i uključivi rast. Napredak znači smanjenje
  omjera S80/S20 tokom vremena.
1-2-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Ekvivalentni raspoloživi dohodak
  je ukupni prihod domaćinstva nakon poreza i odbitaka, podijeljen ekvivalentnom
  veličinom domaćinstva. Anketa se provodi godišnje u svim zemljama učesnicama.
1-3-1-title: Stopa teške materijalne i socijalne uskraćenosti prema starosnoj grupi i spolu
1-3-1-definition: >-
  Ovaj indikator mjeri udio stanovništva obuhvaćenog barem jednom naknadom
  socijalne zaštite, uključujući naknade vezane za starost, invalidnost, bolest,
  nezaposlenost, porodicu i stanovanje. Izražava se kao postotak ukupnog
  stanovništva. Podaci se zasnivaju na EU-SILC anketi.
1-3-1-intention: >-
  Efikasni sistemi socijalne zaštite sprečavaju siromaštvo i smanjuju utjecaj
  ekonomskih šokova na pojedince i porodice. Široka pokrivenost osigurava da
  oni kojima je potrebna pomoć dobiju podršku na vrijeme. Napredak znači
  proširenje pokrivenosti na sve segmente stanovništva.
1-3-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete, koja prikuplja informacije o
  socijalnim transferima primljenim u domaćinstvima. Indikator obuhvata i
  doprinosne (osiguravajuće) i nedoprinosne (testiranjem prihoda uvjetovane)
  naknade u svim kategorijama socijalne zaštite.
1-4-1-title: Osobe koje žive u domaćinstvu sa veoma niskim intenzitetom rada, po starosnoj grupi
1-4-1-definition: >-
  Stopa preopterećenosti troškovima stanovanja je udio stanovništva koje živi
  u domaćinstvima gdje ukupni troškovi stanovanja (umanjeni za stambene naknade)
  predstavljaju više od 40% ukupnog raspoloživog dohotka domaćinstva. Izražava
  se kao postotak. Podaci se zasnivaju na EU-SILC anketi.
1-4-1-intention: >-
  Previsoki troškovi stanovanja smanjuju raspoloživi dohodak za ostale životne
  nužnosti i povećavaju rizik od siromaštva i socijalne isključenosti. Praćenje
  ovog indikatora pomaže identificirati domaćinstva izložena financijskim
  pritiscima stanovanja. Napredak znači smanjenje udjela osoba preopterećenih
  troškovima stanovanja.
1-4-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Troškovi stanovanja uključuju
  kiriju, otplatu hipoteke, komunalije i održavanje. Stambene naknade oduzimaju
  se i od troškova i od dohotka prije izračunavanja praga od 40%.
1-4-2-title: Stopa zaposlenih u riziku od siromaštva
1-4-2-definition: >-
  Stopa teške stambene deprivacije je udio stanovništva koje živi u prenapučenim
  stanovima koji ujedno nemaju barem jedno od sljedećeg: kadu ili tuš, unutarnji
  WC s ispiranjem, ili imaju propuštajući krov ili vlažne zidove. Izražava se
  kao postotak. Podaci se zasnivaju na EU-SILC anketi.
1-4-2-intention: >-
  Adekvatno stanovanje temeljna je ljudska potreba i ključna odrednica zdravlja
  i dobrobiti. Teška stambena deprivacija ima direktan negativan utjecaj na
  fizičko i mentalno zdravlje, obrazovne rezultate i socijalnu participaciju.
  Napredak znači trajno smanjenje stope teške stambene deprivacije.
1-4-2-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete. Prenapučenost se procjenjuje u
  odnosu na veličinu i sastav domaćinstva. Deprivacija kvalitete stanovanja
  obuhvata strukturne probleme (propuštajući krov, vlažni zidovi) i nedostatak
  osnovnih objekata (kupatilo, unutarnji WC).
1-5-1-title: Stopa prekomjernog opterećenja troškovima stanovanja prema statusu siromaštva
1-5-1-definition: >-
  Ovaj indikator prati smrtne slučajeve i ekonomske gubitke pripisane
  katastrofama, uključujući prirodne hazarde kao što su poplave, oluje, suše i
  ekstremne temperature. Koristi se za procjenu otpornosti stanovništva na
  klimatske i druge katastrofalne događaje. Podaci se kompiluju iz nacionalnih
  organa civilne zaštite i međunarodnih baza podataka.
1-5-1-intention: >-
  Izgradnja otpornosti na katastrofe ključna je za zaštitu života, sredstava za
  život i razvojnih dostignuća. Zemlje s efikasnim strategijama smanjenja rizika
  od katastrofa imaju manji broj smrtnih slučajeva i manje ekonomske gubitke.
  Napredak znači smanjenje smrtnosti i gubitaka uzrokovanih katastrofama.
1-5-1-methodology: >-
  Podaci se prikupljaju od nacionalnih organa civilne zaštite, uz dopunu
  međunarodnim bazama podataka kao što je EM-DAT. Indikator obuhvata katastrofalne
  događaje koji zahtijevaju hitnu reakciju i rezultiraju ljudskim ili značajnim
  ekonomskim gubicima.
2-1-1-title: Indeks potrošačkih cijena hrane
2-1-1-definition: >-
  Indeks potrošačkih cijena hrane mjeri promjene cijena koje potrošači plaćaju
  za hranu i bezalkoholna pića tokom vremena. Izražava se kao indeks s referentnim
  periodom jednakim 100. Rast cijena hrane može povećati prehrambenu nesigurnost,
  posebno u domaćinstvima s nižim prihodima. Podaci se kompiluju od strane
  Eurostata iz nacionalnih statističkih organa.
2-1-1-intention: >-
  Stabilne i pristupačne cijene hrane ključne su za osiguranje pristupa adekvatnoj
  ishrani za sve segmente stanovništva. Nagli rast cijena hrane nesrazmjerno
  pogađa domaćinstva s nižim prihodima i može dovesti do prehrambene nesigurnosti.
  Praćenje ovog indikatora doprinosi širem cilju eliminacije gladi.
2-1-1-methodology: >-
  Podaci se zasnivaju na harmonizovanom indeksu potrošačkih cijena (HICP),
  podindeks hrane, koji prikupljaju nacionalni statistički organi koristeći
  standardizovanu Eurostat metodologiju. Indeks pokriva svu hranu i bezalkoholna
  pića prema COICOP klasifikaciji.
2-2-1-title: Stopa prekomjerne težine i pretilosti kod odraslih
2-2-1-definition: >-
  Ovaj indikator mjeri udio odraslih osoba u dobi od 18 i više godina klasificiranih
  kao osobe s prekomjernom težinom ili pretilih na osnovu indeksa tjelesne mase
  (ITM). Prekomjerna težina definirana je kao ITM ≥ 25 kg/m², a pretilost kao
  ITM ≥ 30 kg/m². Izražava se kao postotak odraslog stanovništva. Podaci se
  prikupljaju putem Evropskog zdravstvenog intervjunog istraživanja (EHIS).
2-2-1-intention: >-
  Prekomjerna težina i pretilost su glavni faktori rizika za nezarazne bolesti,
  uključujući kardiovaskularne bolesti, dijabetes tipa 2 i određene vrste raka.
  Rastuće stope pretilosti stvaraju značajno opterećenje zdravstvenim sistemima.
  Napredak znači stabilizaciju ili smanjenje prevalencije prekomjerne težine i
  pretilosti u populaciji.
2-2-1-methodology: >-
  Podaci se prikupljaju putem Evropskog zdravstvenog intervjunog istraživanja
  (EHIS), koje se provodi otprilike svakih pet godina. ITM se izračunava iz
  samoprijavljene visine i težine. EHIS primjenjuje harmonizovanu metodologiju
  u svim zemljama učesnicama, što omogućava međunarodne usporedbe.
2-3-1-title: Indeks ptica poljoprivrednog zemljišta
2-3-1-definition: >-
  Indeks ptica poljoprivrednog zemljišta mjeri promjene u populaciji vrsta ptica
  vezanih za poljoprivredna staništa, koristeći 1990. godinu kao baznu (indeks =
  100). Pad populacije ptica poljoprivrednog zemljišta ukazuje na gubitak
  bioraznolikosti uzrokovan intenziviranjem poljoprivrede. Podaci se prikupljaju
  iz nacionalnih programa praćenja ptica.
2-3-1-intention: >-
  Raznolikost populacija ptica u poljoprivrednim krajolicima pokazatelj je
  ekološkog zdravlja poljoprivrednih sistema. Stabilne ili rastuće populacije
  ptica signaliziraju da poljoprivredne prakse podržavaju bioraznolikost. Zaustavljanje
  i preokret pada populacije ptica ključni su za održive prehrambene sisteme.
2-3-1-methodology: >-
  Podaci se kompiluju iz nacionalnih istraživanja gniježđenja ptica i dostavljaju
  Eurostatu. Indeks agregira trendove populacija niza reprezentativnih vrsta ptica
  tipičnih za poljoprivredna staništa. Rezultati se zaglađuju kako bi se uzela u
  obzir godišnja varijabilnost u brojanju.
2-4-1-title: Površina pod organskom poljoprivredom
2-4-1-definition: >-
  Ovaj indikator mjeri ukupnu poljoprivrednu površinu pod organskom
  poljoprivredom, uključujući i potpuno certificirano organsko zemljište i
  zemljište u periodu konverzije. Izražava se kao postotak ukupne iskorištene
  poljoprivredne površine (UAA). Podaci se zasnivaju na nacionalnim statistikama
  organske poljoprivrede koje kompiluje Eurostat.
2-4-1-intention: >-
  Organska poljoprivreda promoviše bioraznolikost, smanjuje upotrebu sintetičkih
  pesticida i gnojiva te podržava održivo upravljanje tlom i vodama. Povećanje
  udjela organske poljoprivredne površine važan je korak ka održivijim i
  otpornijim sistemima prehrambene proizvodnje.
2-4-1-methodology: >-
  Podaci se prikupljaju kroz nacionalne ankete o farmama i agrarne statistike,
  usklađene s EU propisima o organskoj poljoprivredi. Podaci uključuju površine
  potpuno certificirane kao organske i površine u periodu konverzije, koji
  tipično traje dvije do tri godine.
2-5-3-title: Bruto bilans dušika na poljoprivrednom zemljištu
2-5-3-definition: >-
  Bruto bilans dušika (GNB) na poljoprivrednom zemljištu procjenjuje višak ili
  manjak dušika u tlu, izračunat kao razlika između unosa dušika (mineralna
  gnojiva, stajnjak, atmosferska depozicija, biološka fiksacija i biljni ostatci)
  i izlaza dušika (usjevi i požnjevena trava). Izražava se u kilogramima dušika
  po hektaru poljoprivrednog zemljišta.
2-5-3-intention: >-
  Višak dušika u poljoprivrednim tlima doprinosi zagađenju voda ispiranjem
  nitrata, emisijama stakleničkih plinova i gubitku bioraznolikosti. Smanjenje
  viška dušika ključno je za održive poljoprivredne prakse koje štite vodna
  tijela i okoliš.
2-5-3-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih agrarnih statistika o
  korištenju gnojiva, broju stoke i proizvodnji usjeva. Metodologija GNB-a slijedi
  OECD/Eurostat pristup izračunavanju bilansa hranjivih tvari i ažurira se godišnje.
2-6-0-title: Emisije stakleničkih plinova iz poljoprivrede
2-6-0-definition: >-
  Ovaj indikator mjeri ukupne emisije stakleničkih plinova (GHG) iz
  poljoprivrednog sektora, izražene u milijunima tona ekvivalenta CO₂.
  Poljoprivredne emisije uključuju metan iz stoke i upravljanja stajnjakom,
  dušikov oksid iz tla i ugljikov dioksid iz potrošnje energije na farmama.
2-6-0-intention: >-
  Poljoprivreda značajno doprinosi ukupnim emisijama stakleničkih plinova.
  Smanjenje poljoprivrednih emisija uz održavanje prehrambene proizvodnje
  ključni je izazov za ispunjavanje klimatskih ciljeva. Napredak znači smanjenje
  ukupnih emisija GHG-a iz poljoprivrede bez ugrožavanja prehrambene sigurnosti.
2-6-0-methodology: >-
  Podaci se dostavljaju od strane nacionalnih organa u okviru UN Okvirne konvencije
  o klimatskim promjenama (UNFCCC) i kompiluju od strane Eurostata. Emisije se
  procjenjuju koristeći IPCC metodologiju i pokrivaju sve izvore poljoprivrednih
  emisija uključujući enteričnu fermentaciju, upravljanje stajnjakom i
  poljoprivredna tla.
3-1-1-title: Godine zdravog života pri rođenju
3-1-1-definition: >-
  Godine zdravog života (HLY) pri rođenju pokazuju broj godina koje se očekuje
  da će novorođenče živjeti u dobrom zdravlju, bez dugotrajne bolesti ili
  invalidnosti. HLY se izračunavaju kombinovanjem dobno-specifičnih stopa
  smrtnosti s dobno-specifičnim udjelima osoba koje prijavljuju dugotrajno
  ograničavajuću bolest. Indikator se izražava u godinama i razlaže po spolu.
3-1-1-intention: >-
  Godine zdravog života prevazilaze očekivani životni vijek mjerenjem kvalitete
  kao i duljine života. Povećanje HLY znači da ljudi ne samo dulje žive već i
  provode više godina u dobrom zdravlju. Napredak znači trajno povećanje godina
  zdravog života za muškarce i žene.
3-1-1-methodology: >-
  HLY se izračunavaju Sullivanovom metodom, kombinujući podatke o smrtnosti s
  podacima o samoprijavljivanoj invalidnosti iz EU-SILC ankete. Globalni
  indikator ograničenja aktivnosti (GALI) pita ispitanike jesu li bili ograničeni
  u aktivnostima zbog zdravstvenih problema u trajanju od najmanje šest mjeseci.
3-2-1-title: Stopa smrtnosti djece mlađe od pet godina
3-2-1-definition: >-
  Stopa smrtnosti djece mlađe od pet godina je vjerojatnost da će dijete rođeno
  u određenoj godini umrijeti prije navršenih pet godina, izražena na 1.000 živih
  rođenja. Odražava kumulativni utjecaj faktora koji utječu na preživljavanje
  djece, uključujući ishranu, pristup zdravstvenoj zaštiti, sanitaciju i uvjete
  življenja. Podaci se kompiluju iz nacionalnih vitalnih statistika.
3-2-1-intention: >-
  Smanjenje dječije smrtnosti temeljno je mjerilo ljudskog razvoja i efikasnosti
  zdravstvenih i socijalnih sistema. Visoke stope smrtnosti djece mlađe od pet
  godina odražavaju nedovoljan pristup zdravstvenoj zaštiti i loše uvjete
  življenja. Napredak znači trajno smanjenje preventabilnih smrtnih slučajeva
  djece mlađe od pet godina.
3-2-1-methodology: >-
  Podaci se kompiluju iz nacionalnih sistema registracije i vitalnih statistika.
  Stopa se izračunava iz dobno-specifičnih stopa smrtnosti za djecu mlađu od pet
  godina. Eurostat kompiluje i validira podatke od nacionalnih statističkih organa
  prema harmonizovanim definicijama.
3-3-1-title: Prevalencija pušenja kod odraslih
3-3-1-definition: >-
  Ovaj indikator mjeri udio odraslih osoba u dobi od 15 i više godina koje
  trenutno puše duhanske proizvode (uključujući cigarete, cigare i lule) svakodnevno
  ili povremeno. Izražava se kao postotak ukupnog odraslog stanovništva. Podaci
  se prikupljaju putem Evropskog zdravstvenog intervjunog istraživanja (EHIS).
3-3-1-intention: >-
  Upotreba duhana vodeći je preventabilni uzrok smrti na globalnom nivou,
  uzrokujući rak, kardiovaskularne bolesti i kronične respiratorne bolesti.
  Smanjenje prevalencije pušenja ključni je prioritet javnog zdravstva. Napredak
  znači trajni pad udjela odraslih koji puše duhan.
3-3-1-methodology: >-
  Podaci se prikupljaju putem Evropskog zdravstvenog intervjunog istraživanja
  (EHIS), koje se provodi otprilike svakih pet godina. Status pušenja je
  samoprijavljen. Istraživanje koristi standardizovani upitnik koji omogućava
  međunarodne usporedbe u svim državama članicama EU i zemljama učesnicama.
3-4-1-title: Standardizovana stopa smrtnosti od kroničnih bolesti
3-4-1-definition: >-
  Ovaj indikator mjeri standardizovanu stopu smrtnosti od nezaraznih kroničnih
  bolesti, uključujući kardiovaskularne bolesti, rak, dijabetes i kronične
  respiratorne bolesti. Izražava se kao broj smrtnih slučajeva na 100.000 osoba,
  standardizovan prema Evropskoj standardnoj populaciji (ESP 2013). Podaci se
  kompiluju od strane Eurostata iz nacionalnih statistika uzroka smrti.
3-4-1-intention: >-
  Nezarazne bolesti vodeći su uzrok prijevremene smrtnosti u Evropi. Smanjenje
  prijevremene smrtnosti od kroničnih bolesti zahtijeva efikasnu prevenciju,
  rano otkrivanje i pristup kvalitetnoj zdravstvenoj zaštiti za sve. Napredak
  znači smanjenje standardizovane stope smrtnosti od tih bolesti tokom vremena.
3-4-1-methodology: >-
  Podaci se zasnivaju na statistikama uzroka smrti iz nacionalnih matičnih knjiga
  umrlih. Standardizovana stopa smrtnosti eliminira utjecaj različitih dobnih
  struktura pri uspoređivanju populacija, koristeći Evropsku standardnu populaciju
  (ESP 2013) kao referencu. Podaci se godišnje dostavljaju Eurostatu.
3-6-1-title: Stopa smrtnosti u prometnim nesrećama
3-6-1-definition: >-
  Ovaj indikator mjeri broj osoba poginulih u prometnim nesrećama na milijun
  stanovnika. Osoba se klasificira kao žrtva prometne nesreće ukoliko umre u roku
  od 30 dana od nesreće kao posljedica zadobivenih ozljeda. Podaci se kompiluju
  od strane Eurostata iz nacionalnih baza podataka o sigurnosti u prometu.
3-6-1-intention: >-
  Prometne ozljede vodeći su uzrok smrti, posebno među mladima. Smanjenje broja
  poginulih zahtijeva ulaganja u infrastrukturu, standarde sigurnosti vozila,
  upravljanje brzinom i primjenu prometnih propisa. Napredak znači značajno i
  trajno smanjenje broja prometnih smrtnih slučajeva na milijun stanovnika.
3-6-1-methodology: >-
  Podaci se kompiluju iz nacionalnih baza podataka o prometnim nesrećama.
  Definicija smrtnosti u roku od 30 dana standardizovana je radi harmonizacije
  brojanja u zemljama učesnicama. Podaci se godišnje dostavljaju Eurostatu i
  verificiraju u odnosu na demografske statistike.
3-7-1-title: Stopa fertiliteta adolescenata
3-7-1-definition: >-
  Stopa fertiliteta adolescenata je broj živih рођenja na 1.000 žena u dobi od
  15 do 19 godina. Mjeri prevalenciju tinejdžerskih trudnoća i odražava pristup
  obrazovanju i uslugama spolnog i reproduktivnog zdravlja. Podaci se kompiluju
  iz nacionalnih vitalnih statistika od strane Eurostata.
3-7-1-intention: >-
  Visoke stope fertiliteta adolescenata povezane su s povećanim zdravstvenim
  rizicima za majku i dijete te smanjenim obrazovnim i ekonomskim mogućnostima
  za mlade žene. Smanjenje stope fertiliteta adolescenata zahtijeva pristup
  sveobuhvatnom spolnom obrazovanju i uslugama reproduktivnog zdravlja. Napredak
  znači trajno smanjenje porođaja kod adolescentnih žena.
3-7-1-methodology: >-
  Podaci se kompiluju iz nacionalnih registracija rođenja i demografskih
  statistika. Stopa se izračunava dijeljenjem živih rođenja ženama u dobi
  15–19 godina s ukupnom ženskom populacijom u toj dobi, pomnoženo s 1.000.
  Podaci se godišnje dostavljaju Eurostatu od strane nacionalnih statističkih
  organa.
17-5-1-title: Korisnici interneta kao udio stanovništva
17-5-1-definition: >-
  Udio osoba koje su koristile internet u posljednja tri mjeseca, izražen kao postotak ukupnog stanovništva. Podaci se prikupljaju putem godišnjeg EU IKT istraživanja.
17-5-1-intention: >-
  Pristup internetu omogućava učešće u digitalnoj ekonomiji. Napredak znači rastući udio stanovništva koje koristi internet.
17-5-1-methodology: >-
  Podaci iz godišnjeg EU IKT istraživanja u domaćinstvima. Objavljuju se godišnje od strane Eurostata.
17-4-1-title: Otvorenost trgovine
17-4-1-definition: >-
  Ukupan izvoz i uvoz roba i usluga kao postotak BDP-a. Ukazuje na stupanj integracije u globalni trgovinski sistem. Podaci iz nacionalnih računa.
17-4-1-intention: >-
  Otvoreni trgovinski sistemi promoviraju ekonomski rast. Napredak znači održavanje otvorenosti u podršci ciljevima održivog razvoja.
17-4-1-methodology: >-
  Podaci iz nacionalnih računa prema ESA 2010. Pokriva robu i usluge. Objavljuju se godišnje.
17-3-1-title: Javni dug kao udio BDP-a
17-3-1-definition: >-
  Konsolidirani bruto dug opće uprave kao postotak BDP-a. Odražava fiskalnu održivost i kapacitet za javna ulaganja. Podaci od Eurostata iz EDP obavijesti.
17-3-1-intention: >-
  Održive javne finansije ključne su za dugoročna razvojna ulaganja. Napredak znači dug na razinama koje su u skladu s fiskalnom održivošću.
17-3-1-methodology: >-
  Podaci od Eurostata prema EDP proceduri. Objavljuju se dva puta godišnje.
17-2-1-title: Porezni prihodi kao udio BDP-a
17-2-1-definition: >-
  Ukupni porezni prihodi uključujući socijalne doprinose kao postotak BDP-a. Odražava kapacitet vlada za mobilizaciju domaćih resursa.
17-2-1-intention: >-
  Adekvatna mobilizacija domaćih resursa finansira održivi razvoj. Napredak znači stabilan i dovoljan porezni prihod.
17-2-1-methodology: >-
  Podaci iz nacionalnih računa prema ESA 2010. Uključuje sve obvezne namete i socijalne doprinose. Objavljuju se godišnje.
17-1-1-title: Službena razvojna pomoć kao udio bruto nacionalnog dohotka
17-1-1-definition: >-
  Neto službena razvojna pomoć (ODA) zemalja donatora kao postotak bruto nacionalnog dohotka (BND). Međunarodni cilj je 0,7% BND-a. Podaci od OECD DAC-a i Eurostata.
17-1-1-intention: >-
  ODA je ključni izvor finansiranja razvoja za siromašnije zemlje. Napredak znači povećanje omjera ODA/BND.
17-1-1-methodology: >-
  Podaci od OECD DAC-a. Pokriva bilateralne i multilateralne tokove. Objavljuju se godišnje.
16-5-1-title: Percipirana neovisnost pravosudnog sistema
16-5-1-definition: >-
  Udio stanovništva koji smatra sudove poštenim ili vrlo neovisnim. Odražava povjerenje javnosti u pravosudne institucije. Podaci iz Eurobarometra EU Justice Scoreboard.
16-5-1-intention: >-
  Povjerenje u neovisnost pravosuđa temelj je vladavine prava. Napredak znači rastući udio građana koji pravosuđe percipiraju kao neovisno.
16-5-1-methodology: >-
  Podaci se prikupljaju godišnjim Eurobarometrom. Objavljuju se u EU Justice Scoreboard.
16-4-1-title: Stopa zatvorske populacije
16-4-1-definition: >-
  Broj osoba u zatvoru na 100.000 stanovnika. Odražava prakse kaznenog pravosuđa. Podaci od Eurostata iz nacionalnih penalnih statistika.
16-4-1-intention: >-
  Praćenje zatvorske populacije daje uvid u kazneno pravosuđe i vladavinu prava. Zatvaranje treba biti proporcionalno.
16-4-1-methodology: >-
  Podaci iz nacionalnih penalnih administracija. Ukupan broj u zatvoru na referentni datum. Objavljuju se godišnje.
16-3-1-title: Stanovništvo koje prijavljuje kriminal ili nasilje u svom susjedstvu
16-3-1-definition: >-
  Udio stanovništva koji prijavljuje iskustvo kriminala, nasilja ili vandalizma u svom susjedstvu u protekloj godini. Odražava percepciju sigurnosti. Podaci iz EU-SILC.
16-3-1-intention: >-
  Osjećaj sigurnosti dimenzija je kvaliteta života. Napredak znači smanjenje udjela osoba koje prijavljuju kriminal u svom susjedstvu.
16-3-1-methodology: >-
  Podaci iz EU-SILC ankete. Objavljuju se godišnje od strane Eurostata.
16-2-1-title: Indeks percepcije korupcije
16-2-1-definition: >-
  Percipirana razina korupcije u javnom sektoru, bodovana od 0 do 100. Temelji se na stručnim procjenama i poslovnim anketama. Sastavlja ga Transparency International.
16-2-1-intention: >-
  Korupcija potkopava javne institucije i održivi razvoj. Napredak znači poboljšanje rezultata indeksa percepcije korupcije.
16-2-1-methodology: >-
  Sastavlja se godišnje od strane Transparency International. Normalizirano na skali od 0 do 100.
16-1-1-title: Stopa namjernih ubojstava
16-1-1-definition: >-
  Broj namjernih ubojstava na 100.000 stanovnika. Definira se kao nezakonita smrt nanesena s namjerom. Podaci od Eurostata iz nacionalnih policijskih statistika.
16-1-1-intention: >-
  Stopa ubojstava pouzdani je pokazatelj nasilnog kriminala i javne sigurnosti. Napredak znači trajno smanjenje stope namjernih ubojstava.
16-1-1-methodology: >-
  Podaci iz nacionalnih policijskih statistika prema UNODC definicijama. Objavljuju se godišnje.
15-5-1-title: Invazivne strane vrste
15-5-1-definition: >-
  Broj invazivnih stranih vrsta od interesa za EU utvrđenih u državama članicama prema Uredbi 1143/2014. Invazivne vrste vodeći su uzrok gubitka bioraznolikosti.
15-5-1-intention: >-
  Invazivne strane vrste ugrožavaju autohtonu bioraznolikost. Napredak znači ograničavanje širenja invazivnih stranih vrsta.
15-5-1-methodology: >-
  Podaci od EEA na temelju nacionalnih izvještaja prema EU uredbi o invazivnim vrstama.
15-4-1-title: Erozija tla vodom
15-4-1-definition: >-
  Stopa gubitka tla vodom u tonama po hektaru godišnje. Smanjuje poljoprivrednu produktivnost. Procjenjuje se RUSLE2015 modelom od strane JRC-a.
15-4-1-intention: >-
  Tlo je neobnovljivi resurs. Napredak znači smanjenje stope gubitka tla erozijom.
15-4-1-methodology: >-
  Procjenjuje se RUSLE2015 modelom. Objavljuje se od strane JRC-a i Eurostata.
15-3-1-title: Indeks uobičajenih ptica
15-3-1-definition: >-
  Indeks koji prati promjene u populacijama uobičajenih ptica u Evropi s 1990. kao baznom godinom (= 100). Ptice su osjetljivi pokazatelji zdravlja ekosistema.
15-3-1-intention: >-
  Pad populacija ptica signalizira degradaciju staništa. Napredak znači zaustavljanje pada populacija uobičajenih ptica.
15-3-1-methodology: >-
  Podaci iz nacionalnih istraživanja gniježđenja ptica putem PECBMS sheme. Objavljuju se godišnje.
15-2-1-title: Zaštićene kopnene i slatkovodne površine
15-2-1-definition: >-
  Udio kopnenih i slatkovodnih površina označenih kao zaštićene kao postotak ukupne površine kopna. Uključuje Natura 2000 i nacionalno zaštićena područja.
15-2-1-intention: >-
  Zaštićena područja temelj su zaštite bioraznolikosti. Napredak znači rastući udio kopna pod učinkovitom zaštitom.
15-2-1-methodology: >-
  Podaci iz nacionalnih oznaka dostavljenih EEA-i. Pokriva kopnena i slatkovodna staništa. Objavljuju se godišnje.
15-1-1-title: Šumska površina kao udio ukupne površine kopna
15-1-1-definition: >-
  Površina šuma kao postotak ukupne površine kopna. Prati promjene uslijed promjene namjene zemljišta. Podaci iz nacionalnih šumarskih statistika.
15-1-1-intention: >-
  Šume su ključne za bioraznolikost i sekvestraciju ugljika. Napredak znači održavanje ili povećanje šumom pokrivenog kopna.
15-1-1-methodology: >-
  Podaci iz šumarskih statistika prema JFSQ upitniku. Definicija prema FAO. Objavljuju se periodično.
14-4-1-title: Erozija obale
14-4-1-definition: >-
  Udio obalne linije izložene eroziji kao postotak ukupne procijenjene linije. Kompiluje ga EEA satelitskim praćenjem i EUROSION bazom.
14-4-1-intention: >-
  Obalna erozija ubrzava se zbog porasta razine mora. Napredak znači ograničavanje udjela obale izložene eroziji.
14-4-1-methodology: >-
  Podaci od EEA koristeći Copernicus praćenje. Objavljuju se periodično.
14-3-1-title: Koncentracija klorofila-a u obalnim vodama
14-3-1-definition: >-
  Koncentracija klorofila-a u obalnim i prijelaznim vodama kao proxy za eutrofikaciju. Više koncentracije ukazuju na zagađenje nutrijentima.
14-3-1-intention: >-
  Eutrofikacija degradira morske ekosisteme. Napredak znači stabilne ili opadajuće koncentracije klorofila-a.
14-3-1-methodology: >-
  Podaci iz morskih programa praćenja i satelitskog istraživanja. Kompiluje EEA.
14-2-1-title: Ribni fondovi unutar održivih razina
14-2-1-definition: >-
  Udio procijenjenih komercijalnih ribnih fondova u EU vodama koji se love na ili ispod MSY, izražen kao postotak. Podaci od ICES-a.
14-2-1-intention: >-
  Prekomjerni ribolov iscrpljuje fondove. Napredak znači rastući udio fondova koji se love unutar održivih granica.
14-2-1-methodology: >-
  Temelji se na ICES procjenama fondova. Održivost prema MSY konceptu. Objavljuje se godišnje.
14-1-1-title: Morska zaštićena područja
14-1-1-definition: >-
  Udio mora u nacionalnoj jurisdikciji označenih kao MPA, izražen kao postotak. Podaci od EEA iz nacionalnih oznaka.
14-1-1-intention: >-
  MPA štite morsku bioraznolikost. Napredak znači rastući udio mora pod morskom zaštitom.
14-1-1-methodology: >-
  Podaci iz nacionalnih oznaka prema Natura 2000 i međunarodnim konvencijama. Objavljuju se godišnje.
13-4-1-title: Intenzitet emisija stakleničkih plinova energetske potrošnje
13-4-1-definition: >-
  Emisije stakleničkih plinova iz energetske potrošnje podijeljene s bruto potrošnjom energije, u gramima CO₂ eq/kgoe. Odražava ugljični sadržaj energetskog miksa.
13-4-1-intention: >-
  Dekarbonizacija energetskog sistema ključna je za klimatsko djelovanje. Napredak znači smanjenje intenziteta emisija stakleničkih plinova energije.
13-4-1-methodology: >-
  Kompiluje Eurostat iz energetskih bilanci i inventara stakleničkih plinova. Objavljuje se godišnje.
13-3-1-title: Ekonomski gubici vezani uz klimu
13-3-1-definition: >-
  Ekonomski gubici od ekstremnih klimatskih događaja kao postotak BDP-a. Uključuje poplave, oluje i suše. Podaci iz civilnih baza i reosiguravajućih izvora.
13-3-1-intention: >-
  Klimatske promjene povećavaju ekonomske gubitke. Napredak znači ograničavanje gubitaka od klimatskih događaja.
13-3-1-methodology: >-
  Podaci iz CATDAT baze i reosiguravajućih izvora. Objavljuje se periodično od strane Eurostata i EEA.
13-2-1-title: Emisije stakleničkih plinova - energetski sektor
13-2-1-definition: >-
  Ukupne emisije stakleničkih plinova iz energetskog sektora u Mt CO₂ eq. Pokriva sagorijevanje u elektranama, rafinerijama i energetskim industrijama.
13-2-1-intention: >-
  Energetski sektor najveći je izvor GHG emisija. Napredak znači trajno smanjenje emisija energetskog sektora.
13-2-1-methodology: >-
  Podaci od nacionalnih vlasti prema UNFCCC koristeći IPCC metodologiju. Objavljuje se godišnje.
13-1-1-title: Indeks emisija stakleničkih plinova
13-1-1-definition: >-
  Ukupne nacionalne emisije stakleničkih plinova indeksirane na baznu godinu. Prati ukupni napredak u smanjenju emisija prema klimatskim obvezama.
13-1-1-intention: >-
  Smanjenje ukupnih emisija centralni je cilj klimatske politike. Napredak znači trajni opadajući trend indeksa emisija.
13-1-1-methodology: >-
  Podaci od nacionalnih vlasti prema UNFCCC. Pokriva sve sektore. Objavljuje se godišnje.
12-5-1-title: Stopa kružnog korištenja materijala
12-5-1-definition: >-
  Udio materijala oporavljenih i vraćenih u ekonomiju kao proporcionalan ukupnoj upotrebi materijala. Ukazuje na napredak prema kružnoj ekonomiji.
12-5-1-intention: >-
  Povećanje kružnog korištenja smanjuje ekstrakciju resursa. Napredak znači rastući postotak kružnog korištenja materijala.
12-5-1-methodology: >-
  Izračunava se kao recikliran otpad kao input podijeljen ukupnom upotrebom materijala. Kompiluje Eurostat godišnje.
12-4-1-title: Intenzitet emisija stakleničkih plinova proizvodnje
12-4-1-definition: >-
  Ukupne emisije stakleničkih plinova po jedinici BDP-a u kg CO₂ eq po jedinici BDP-a. Prati odvajanje rasta od emisija.
12-4-1-intention: >-
  Smanjenje intenziteta emisija ključno je za održivu proizvodnju. Napredak znači pad emisija po jedinici BDP-a.
12-4-1-methodology: >-
  Kompiluje Eurostat iz inventara GHG i nacionalnih računa. Objavljuje se godišnje.
12-3-1-title: Stopa recikliranja komunalnog otpada
12-3-1-definition: >-
  Udio komunalnog otpada koji se reciklira kao postotak ukupno generiranog otpada. Pokriva materijalno recikliranje i kompostiranje.
12-3-1-intention: >-
  Povećanje recikliranja smanjuje odlaganje na deponije. Napredak znači rastući udio komunalnog otpada koji se reciklira.
12-3-1-methodology: >-
  Kompiluje Eurostat iz nacionalnih statistika otpada. Uključuje materijalno recikliranje i kompostiranje. Objavljuje se godišnje.
12-2-1-title: Komunalni otpad generiran po stanovniku
12-2-1-definition: >-
  Ukupni komunalni otpad generiran po stanovniku godišnje u kilogramima. Uključuje kućanski otpad i slične izvore.
12-2-1-intention: >-
  Smanjenje generiranja otpada prvi je korak u hijerarhiji otpada. Napredak znači opadajući komunalni otpad po stanovniku.
12-2-1-methodology: >-
  Kompiluje Eurostat iz nacionalnih statistika otpada. Objavljuje se godišnje.
12-1-1-title: Produktivnost resursa
12-1-1-definition: >-
  BDP podijeljen s domaćom potrošnjom materijala (DMC), u eurima po kilogramu. Viša vrijednost znači veći ekonomski output po jedinici materijala.
12-1-1-intention: >-
  Poboljšanje produktivnosti resursa odvaja rast od potrošnje materijala. Napredak znači trajno povećanje produktivnosti resursa.
12-1-1-methodology: >-
  Izračunava se koristeći BDP i DMC iz računa materijalnih tokova. Kompiluje Eurostat godišnje.
11-5-1-title: Udio željezničkog prometa u putničkom prijevozu
11-5-1-definition: >-
  Udio željeznice u kopnenom putničkom prijevozu, izražen kao postotak putničkih kilometara. Odražava korištenje održivijeg prijevoza od privatnih automobila.
11-5-1-intention: >-
  Željeznica je energetski učinkovitija od automobila. Napredak znači rastući udio željeznice u putničkom prijevozu.
11-5-1-methodology: >-
  Podaci od Eurostata iz nacionalnih transportnih statistika. Mjeri se u putničkim kilometrima. Objavljuje se godišnje.
11-4-1-title: Izloženost stanovništva zagađenju zraka PM2,5
11-4-1-definition: >-
  Populacijski ponderirana godišnja izloženost PM2,5 u µg/m³. PM2,5 uzrokuje respiratorne i kardiovaskularne bolesti.
11-4-1-intention: >-
  Zagađenje zraka vodeći je okolišni uzrok smrtnosti u Evropi. Napredak znači smanjenje izloženosti PM2,5.
11-4-1-methodology: >-
  Kompiluje EEA iz mreža za praćenje kvalitete zraka. Populacijski ponderirano. Objavljuje se godišnje.
11-3-1-title: Stopa recikliranja komunalnog otpada (urbano)
11-3-1-definition: >-
  Stopa recikliranja komunalnog otpada u urbanim područjima kao postotak ukupno generiranog otpada. Odražava napredak u urbanom upravljanju otpadom.
11-3-1-intention: >-
  Održivi gradovi trebaju učinkovite sustave upravljanja otpadom. Napredak znači rastući udio urbanog otpada koji se reciklira.
11-3-1-methodology: >-
  Kompiluje Eurostat iz nacionalnih statistika otpada. Uključuje recikliranje i kompostiranje. Objavljuje se godišnje.
11-2-1-title: Stopa prenapučenosti stambenog prostora
11-2-1-definition: >-
  Udio stanovništva u prenapučenim stanovima (premalo soba za veličinu domaćinstva) kao postotak. Odražava neadekvatne stambene uvjete.
11-2-1-intention: >-
  Prenapučenost utječe na zdravlje i kvalitet života. Napredak znači smanjenje udjela koji žive u prenapučenim stanovima.
11-2-1-methodology: >-
  Podaci iz EU-SILC koristeći standardizirani omjer soba i osoba. Objavljuju se godišnje.
11-1-1-title: Stanovništvo koje živi u gradovima
11-1-1-definition: >-
  Udio ukupnog stanovništva koje živi u gradovima, izražen kao postotak. Prati trendove urbanizacije. Podaci od Eurostata koristeći DEGURBA klasifikaciju.
11-1-1-intention: >-
  Gradovi su motori rasta, ali imaju izazove zagušenja i nejednakosti. Napredak zahtijeva urbanizaciju s adekvatnom infrastrukturom.
11-1-1-methodology: >-
  Kompiluje se DEGURBA metodologijom. Gradovi definirani ≥50.000 stanovnika i gustoćom ≥1.500/km². Objavljuje se periodično.
10-5-1-title: Gini koeficijent ekvivalentnog raspoloživog dohotka
10-5-1-definition: >-
  Gini koeficijent mjeri nejednakost u raspodjeli ekvivalentnog raspoloživog dohotka. Kreće se od 0 (savršena jednakost) do 100 (maksimalna nejednakost). Podaci iz EU-SILC.
10-5-1-intention: >-
  Dohodovna nejednakost ograničava mogućnosti i socijalnu mobilnost. Napredak znači opadajući Gini koeficijent.
10-5-1-methodology: >-
  Podaci iz EU-SILC. Izračunava se iz raspodjele ekvivalentnog raspoloživog dohotka. Objavljuje se godišnje.
10-4-1-title: Podnositelji zahtjeva za azil na milijun stanovnika
10-4-1-definition: >-
  Broj osoba koje podnose zahtjev za azil na milijun stanovnika. Odražava migracijske pritiske. Podaci od Eurostata iz azilnih vlasti.
10-4-1-intention: >-
  Osiguranje zaštite dimenzija je smanjenja nejednakosti. Praćenje azila pomaže procjeni migracijske dinamike.
10-4-1-methodology: >-
  Podaci iz azilnih vlasti prema EU azilnim propisima. Objavljuju se mjesečno i godišnje.
10-3-1-title: Udio dohotka najsiromašnijih 40% stanovništva
10-3-1-definition: >-
  Udio ukupnog ekvivalentnog raspoloživog dohotka koji prima najsiromašnijih 40% raspodjele, izražen kao postotak. Podaci iz EU-SILC.
10-3-1-intention: >-
  Praćenje udjela dohotka najsiromašnijih 40% direktno mjeri uključivi rast. Napredak znači rastući udio.
10-3-1-methodology: >-
  Podaci iz EU-SILC. Kumulativni udio najsiromašnijih 40% izračunava se iz raspodjele. Objavljuje se godišnje.
10-2-1-title: Relativni medijalni jaz rizika od siromaštva
10-2-1-definition: >-
  Razlika između medijanskog dohotka osoba ispod praga siromaštva i praga, izražena kao postotak praga. Mjeri dubinu siromaštva. Podaci iz EU-SILC.
10-2-1-intention: >-
  Jaz siromaštva pokazuje koliko su siromašni daleko ispod praga. Napredak znači smanjenje jaza.
10-2-1-methodology: >-
  Prag siromaštva postavljen na 60% medijanskog dohotka. Jaz kao postotak praga. Objavljuje se godišnje.
10-1-1-title: Omjer dohotka kvintila (S80/S20)
10-1-1-definition: >-
  Omjer ukupnog ekvivalentnog dohotka najbogatijih 20% i najsiromašnijih 20%. Mjeri dohodovnu nejednakost. Podaci iz EU-SILC.
10-1-1-intention: >-
  Dohodovna nejednakost ograničava socijalnu mobilnost. Napredak znači opadajući omjer S80/S20.
10-1-1-methodology: >-
  Podaci iz EU-SILC. Dijeli ukupni dohodak gornjeg kvintila s donjim. Objavljuje se godišnje.
9-6-1-title: Udio željeznice i unutarnjih plovnih puteva u teretnom prometu
9-6-1-definition: >-
  Ovaj indikator mjeri udio željeznice i unutarnjih plovnih puteva u ukupnom
  kopnenom teretnom prometu, izražen kao postotak ukupnih tona-kilometara.
  Odražava modalnu raspodjelu teretnog prometa i upotrebu održivijih načina
  prijevoza. Podaci se kompiluju od strane Eurostata iz nacionalnih statistika
  prometa.
9-6-1-intention: >-
  Prelazan teretnog prometa s cesta na željeznice i unutarnje plovne puteve
  smanjuje emisije stakleničkih plinova, zagušenje i nesreće. Povećanje udjela
  ovih održivih načina prijevoza ključni je cilj EU prometne politike. Napredak
  znači povećanje udjela željeznice i unutarnjih plovnih puteva u teretnom
  prometu.
9-6-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih statistika prometa.
  Teretni promet mjeri se u tona-kilometrima. Željeznica i unutarnji plovni
  putevi uspoređuju se s ukupnim kopnenim teretnim prometom (ceste, željeznica
  i unutarnji plovni putevi zajedno). Podaci se objavljuju godišnje.
9-5-1-title: Domaćinstva s pristupom širokopojasnom internetu
9-5-1-definition: >-
  Ovaj indikator mjeri udio domaćinstava s pristupom širokopojasnom internetu,
  izražen kao postotak svih domaćinstava. Širokopojasni pristup uključuje
  fiksne (DSL, kabelski, optički) i mobilne širokopojasne veze. Podaci se
  prikupljaju putem EU istraživanja o korištenju IKT-a.
9-5-1-intention: >-
  Širokopojasni pristup internetu sve je neophodnije za učešće u digitalnoj
  ekonomiji, pristup javnim uslugama i socijalnu uključenost. Širenje pristupa,
  posebno u ruralnim područjima, ključno je za smanjenje digitalnog jaza.
  Napredak znači povećanje udjela domaćinstava priključenih na širokopojasni
  internet.
9-5-1-methodology: >-
  Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a u domaćinstvima,
  koje se provodi godišnje. Indikator pokriva fiksne i mobilne širokopojasne
  veze s brzinom preuzimanja od najmanje 144 Kbps. Podaci se godišnje objavljuju
  od strane Eurostata.
9-4-1-title: Udio visokotehnološkog izvoza u ukupnom izvozu
9-4-1-definition: >-
  Ovaj indikator mjeri udio visokotehnoloških proizvoda u ukupnom izvozu
  prerađenih dobara, izražen kao postotak. Visokotehnološki proizvodi imaju
  visok intenzitet istraživanja i razvoja, kao što su zrakoplovstvo, računala,
  farmaceutski proizvodi i elektronika. Podaci se kompiluju od strane Eurostata
  iz statistika vanjske trgovine.
9-4-1-intention: >-
  Visok udio visokotehnološkog izvoza odražava tehnološku konkurentnost i
  inovativni kapacitet. Razvoj visokotehnoloških industrija podržava kreiranje
  kvalitetnih radnih mjesta i održivi rast. Napredak znači povećanje udjela
  visokotehnoloških proizvoda u ukupnom izvozu.
9-4-1-methodology: >-
  Podaci se kompiluju iz statistika vanjske trgovine (baza COMEXT) koristeći
  OECD definiciju visokotehnoloških sektora. Visokotehnološki proizvodi
  klasificiraju se prema SITC klasifikaciji. Podaci se godišnje objavljuju
  od strane Eurostata.
9-3-1-title: Prijave patenata Evropskom uredu za patente
9-3-1-definition: >-
  Ovaj indikator mjeri broj prijava patenata podnesenih Evropskom uredu za
  patente (EPO) na milijun stanovnika. Patenti štite izume i ključni su
  indikator inovacijskih outputa. Veći broj odražava veću inovativnu aktivnost.
  Podaci se kompiluju od strane Eurostata iz EPO evidencija.
9-3-1-intention: >-
  Prijave patenata naširoko se koriste kao proxy za inovacijski output. Zemlje
  s jakom patentnom aktivnošću imaju koristi od tehnološkog napretka i
  konkurentske prednosti. Napredak znači trajno povećanje prijava patenata
  na milijun stanovnika.
9-3-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz EPO evidencija na osnovu mjesta
  stanovanja izumitelja. Prijave se broje na datum prioriteta i pripisuju
  godini prvog podnošenja. Podaci se godišnje objavljuju.
9-2-1-title: Istraživači u ekvivalentu punog radnog vremena na milijun stanovnika
9-2-1-definition: >-
  Ovaj indikator mjeri broj istraživača u ekvivalentu punog radnog vremena
  (FTE) na milijun stanovnika. Istraživači su stručnjaci koji se bave
  stvaranjem novog znanja, proizvoda, procesa i sistema. Podaci se kompiluju
  od strane Eurostata iz nacionalnih statistika istraživanja i razvoja.
9-2-1-intention: >-
  Istraživači su ključni input u inovacijski proces. Veća istraživačka radna
  snaga pokreće naučni napredak i ekonomsku konkurentnost. Napredak znači
  povećanje broja istraživača na milijun stanovnika u svim sektorima ekonomije.
9-2-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz istraživačko-razvojnih anketa prema
  OECD Frascati priručniku. Istraživači se broje u ekvivalentima punog radnog
  vremena. Podaci pokrivaju poslovni, vladini, visokoškolski i privatni
  neprofitni sektor.
9-1-1-title: Rashodi za istraživanje i razvoj kao udio BDP-a
9-1-1-definition: >-
  Ovaj indikator mjeri bruto domaće rashode za istraživanje i razvoj (GERD) kao
  postotak BDP-a. Rashodi za I&R pokrivaju sav kreativni i sustavni rad za
  povećanje znanja i razvoj novih primjena. Ključni je indikator za praćenje
  inovacijskog intenziteta. Podaci se kompiluju od strane Eurostata iz
  nacionalnih I&R anketa.
9-1-1-intention: >-
  Ulaganje u istraživanje i razvoj ključni je pokretač inovacija, konkurentnosti
  i dugoročnog rasta produktivnosti. Povećanje rashoda za I&R pomaže razvoju
  novih tehnologija, poboljšanju procesa i kreiranju visokokvalitetnih radnih
  mjesta. Napredak znači trajno povećanje rashoda za I&R kao udjela BDP-a.
9-1-1-methodology: >-
  Podaci se prikupljaju putem nacionalnih I&R anketa prema OECD Frascati
  priručniku. GERD pokriva sav I&R proveden na nacionalnom teritoriju bez
  obzira na izvor financiranja, uključujući temeljna, primijenjena istraživanja
  i eksperimentalni razvoj. Podaci se godišnje objavljuju od strane Eurostata.
8-6-1-title: Smrtne nesreće na radu
8-6-1-definition: >-
  Ovaj indikator mjeri broj smrtnih nesreća na radu na 100.000 zaposlenih osoba.
  Smrtna nesreća na radu definira se kao nesreća koja dovodi do smrti žrtve u
  roku od jedne godine od nesreće. Podaci se prikupljaju putem Evropske
  statistike o nesrećama na radu (ESAW).
8-6-1-intention: >-
  Osiguranje sigurnih i zdravih uvjeta rada temeljna je dimenzija dostojanstvenog
  rada. Smrtne nesreće na radu predstavljaju preventabilni gubitak života s
  teškim posljedicama za radnike, porodice i društvo. Napredak znači trajno
  smanjenje stope smrtnih nesreća na radu.
8-6-1-methodology: >-
  Podaci se kompiluju od strane Eurostata putem metodologije Evropske statistike
  o nesrećama na radu (ESAW). Indikator pokriva sve nesreće na radu koje
  rezultiraju smrću žrtve u roku od jedne godine. Podaci se objavljuju godišnje.
8-5-1-title: Mladi koji nisu zaposleni, obrazuju se niti obučavaju (NEET)
8-5-1-definition: >-
  NEET stopa mjeri udio mladih osoba u dobi od 15 do 29 godina koji nisu
  zaposleni, ne obrazuju se niti obučavaju, izražen kao postotak ukupnog
  stanovništva u toj dobnoj skupini. Identificira mlade koji su izloženi riziku
  isključivanja s tržišta rada i socijalne marginalizacije. Podaci se zasnivaju
  na Anketi o radnoj snazi EU.
8-5-1-intention: >-
  Mladi koji spadaju u NEET kategoriju suočavaju se s dugoročnim rizicima po
  zapošljavanje, zarade i socijalnu integraciju. Smanjenje NEET stope zahtijeva
  ulaganja u obrazovanje, strukovnu obuku i aktivne politike tržišta rada.
  Napredak znači trajno smanjenje udjela mladih van zaposlenja, obrazovanja i
  obuke.
8-5-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). NEET status
  kombinira informacije o statusu zaposlenosti i učešću u obrazovanju ili obuci
  u četiri sedmice koje su prethodile anketi. Podaci se godišnje objavljuju
  od strane Eurostata.
8-4-1-title: Stopa dugotrajne nezaposlenosti
8-4-1-definition: >-
  Stopa dugotrajne nezaposlenosti je udio osoba koje su nezaposlene 12 ili više
  mjeseci, izražen kao postotak aktivne radne snage (zaposleni i nezaposleni).
  Dugotrajna nezaposlenost ukazuje na strukturni problem tržišta rada povezan
  s erozijom vještina i socijalnom isključenošću. Podaci se zasnivaju na
  Anketi o radnoj snazi EU.
8-4-1-intention: >-
  Dugotrajna nezaposlenost narušava vještine, smanjuje zapošljivost i povećava
  rizik od siromaštva i socijalne isključenosti. Njezino rješavanje zahtijeva
  aktivne politike tržišta rada, programe prekvalifikacije i socijalnu podršku.
  Napredak znači trajno smanjenje stope dugotrajne nezaposlenosti.
8-4-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Nezaposlenost
  se definira prema ILO standardima: osobe bez posla, dostupne za rad i aktivno
  traže zaposlenje. Dugotrajno nezaposleni su oni koji su nezaposleni 12 ili
  više mjeseci. Podaci se godišnje objavljuju od strane Eurostata.
8-3-1-title: Stopa zaposlenosti
8-3-1-definition: >-
  Stopa zaposlenosti je udio osoba u dobi od 20 do 64 godine koje su zaposlene,
  izražen kao postotak ukupnog stanovništva u toj dobnoj skupini. Jedan je od
  naširoko korištenih indikatora performansi tržišta rada. Podaci se zasnivaju
  na Anketi o radnoj snazi EU (EU-LFS).
8-3-1-intention: >-
  Visoka stopa zaposlenosti ključna je za ekonomski prosperitet, socijalnu
  uključenost i održivost sistema socijalne zaštite. Povećanje zaposlenosti
  zahtijeva politike koje podržavaju kreiranje radnih mjesta, razvoj vještina
  i uklanjanje barijera za učešće. Napredak znači trajno povećanje stope
  zaposlenosti.
8-3-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Zaposlenost
  se definira prema ILO standardima: osobe koje su radile barem jedan sat uz
  naknadu ili dobit tokom referentne sedmice. Podaci se objavljuju godišnje
  i tromjesečno od strane Eurostata.
8-2-1-title: Bruto investicije u fiksni kapital kao udio BDP-a
8-2-1-definition: >-
  Ovaj indikator mjeri bruto investicije u fiksni kapital (ulaganja u fizičku
  imovinu kao što su strojevi, zgrade i infrastruktura) kao postotak BDP-a.
  Odražava razinu investicija u ekonomiji i njezin kapacitet za budući rast.
  Podaci se kompiluju od strane Eurostata iz nacionalnih računa.
8-2-1-intention: >-
  Ulaganja u fizički kapital ključni su pokretač rasta produktivnosti i
  dugoročnog ekonomskog razvoja. Adekvatne razine investicija podržavaju
  inovacije, kreiranje radnih mjesta i poboljšanja infrastrukture. Napredak
  znači održavanje ili povećanje investicijskog udjela BDP-a.
8-2-1-methodology: >-
  Podaci se kompiluju iz nacionalnih računa izvještenih prema Evropskom sustavu
  računa (ESA 2010). Bruto investicije u fiksni kapital pokrivaju nabavke
  fiksne imovine umanjene za otuđenja rezidentnih proizvođača. Podaci se
  godišnje objavljuju od strane Eurostata.
8-1-1-title: Realni BDP po stanovniku
8-1-1-definition: >-
  Realni BDP po stanovniku je bruto domaći proizvod po tržišnim cijenama
  podijeljen s brojem stanovnika sredinom godine, izražen u lančanim obujmima.
  Naširoko je korišteni indikator ekonomskog outputa i životnog standarda.
  Stope rasta realnog BDP-a po stanovniku odražavaju ekonomske performanse
  korigirane za inflaciju. Podaci se kompiluju od strane Eurostata.
8-1-1-intention: >-
  Trajni, uključivi i održivi ekonomski rast ključan je za smanjenje siromaštva
  i poboljšanje životnog standarda. Rast realnog BDP-a po stanovniku odražava
  poboljšanja produktivnosti i ekonomske dobrobiti. Napredak znači pozitivna
  i trajna stopa rasta realnog BDP-a po stanovniku.
8-1-1-methodology: >-
  Podaci se kompiluju iz nacionalnih računa prema Evropskom sustavu računa
  (ESA 2010). Realni BDP koristi lančane volumenske mjere za uklanjanje
  utjecaja promjena cijena. Podaci po stanovniku koriste procjene stanovništva
  sredinom godine. Objavljuju se godišnje od strane Eurostata.
7-6-1-title: Stanovništvo koje ne može adekvatno grijati dom
7-6-1-definition: >-
  Ovaj indikator mjeri udio stanovništva koje nije u mogućnosti adekvatno
  grijati svoj dom, kao udio ukupnog stanovništva. Jedan je od ključnih
  indikatora energetskog siromaštva u Evropi. Podaci se prikupljaju putem
  EU ankete o prihodima i uvjetima življenja (EU-SILC).
7-6-1-intention: >-
  Energetsko siromaštvo utječe na zdravlje, dobrobit i kvalitet života,
  posebno za domaćinstva s nižim prihodima. Osiguranje da si sve osobe mogu
  priuštiti grijanje doma temeljna je dimenzija pristupačne i čiste energije.
  Napredak znači trajno smanjenje udjela stanovništva koje se suočava s
  energetskim siromaštvom.
7-6-1-methodology: >-
  Podaci se prikupljaju putem EU-SILC ankete, koja pita ispitanike mogu li
  si priuštiti adekvatno grijanje doma. Indikator se izražava kao postotak
  ukupnog stanovništva. Podaci se prikupljaju godišnje i objavljuju od strane
  Eurostata.
7-5-1-title: Ovisnost o uvozu energije
7-5-1-definition: >-
  Stopa ovisnosti o uvozu energije pokazuje u kojoj mjeri se ekonomija oslanja
  na uvoz energije kako bi zadovoljila svoje energetske potrebe. Izračunava se
  kao neto uvoz energije podijeljen s bruto potrošnjom energije u zemlji,
  izražen kao postotak. Viša stopa znači veću ovisnost o uvoznoj energiji.
7-5-1-intention: >-
  Visoka ovisnost o uvozu energije izlaže ekonomije riziku prekida opskrbe i
  volatilnosti cijena. Smanjenje ovisnosti kroz energetsku učinkovitost i razvoj
  obnovljivih izvora energije podržava energetsku sigurnost. Napredak znači
  smanjenje stope ovisnosti o uvozu energije.
7-5-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih energetskih statistika
  dostavljenih prema EU propisima o energetskim statistikama. Bruto potrošnja
  energije u zemlji pokriva svu energiju potrebnu za zadovoljenje domaće
  potražnje. Neto uvoz izračunava se kao uvoz minus izvoz i promjene zaliha.
7-4-1-title: Krajnja potrošnja energije
7-4-1-definition: >-
  Krajnja potrošnja energije mjeri ukupnu energiju koju troše krajnji korisnici
  (industrija, transport, domaćinstva, usluge i poljoprivreda), isključujući
  energiju koju koristi sam energetski sektor. Izražava se u milijunima tona
  ekvivalenta nafte (Mtoe). Podaci se kompiluju od strane Eurostata iz
  nacionalnih energetskih bilanci.
7-4-1-intention: >-
  Smanjenje krajnje potrošnje energije ključno je za ispunjavanje klimatskih
  ciljeva i poboljšanje energetske sigurnosti. Poboljšanja energetske
  učinkovitosti omogućavaju ekonomski rast odvojen od potrošnje energije.
  Napredak znači trajno smanjenje krajnje potrošnje energije uz održavanje
  ekonomske aktivnosti.
7-4-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih energetskih bilanci
  izvještenih prema EU propisima o energetskim statistikama. Krajnja potrošnja
  energije isključuje neenergetsku upotrebu i energiju potrošenu od strane
  sektora transformacije energije. Podaci se godišnje izvještavaju u tonama
  ekvivalenta nafte.
7-3-1-title: Primarna potrošnja energije
7-3-1-definition: >-
  Primarna potrošnja energije mjeri ukupnu energetsku potražnju zemlje,
  pokrivajući potrošnju svih oblika energije prije bilo kakvog procesa
  transformacije. Izražava se u milijunima tona ekvivalenta nafte (Mtoe).
  Uključuje energiju koju koristi energetski sektor, gubitke u distribuciji
  i krajnju potrošnju svih sektora.
7-3-1-intention: >-
  Smanjenje primarne potrošnje energije uz održavanje ekonomskog rasta ključno
  je za poboljšanje energetske učinkovitosti i ispunjavanje klimatskih ciljeva.
  Odvajanje ekonomskog rasta od potrošnje energije centralni je aspekt
  održivog razvoja. Napredak znači opadajući trend primarne potrošnje energije.
7-3-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih energetskih bilanci
  dostavljenih prema EU propisima o energetskim statistikama. Primarna potrošnja
  energije izračunava se metodom supstitucije za nuklearnu i obnovljivu
  električnu energiju. Podaci se objavljuju godišnje.
7-2-1-title: Udio obnovljivih izvora energije u bruto krajnjoj potrošnji energije
7-2-1-definition: >-
  Ovaj indikator mjeri udio energije iz obnovljivih izvora (vjetar, sunce,
  hidroenergija, geotermalna, oceanska, biomasa i biogoriva) u bruto krajnjoj
  potrošnji energije, izražen kao postotak. Pokriva obnovljivu energiju
  korištenu u elektrici, grijanju i hlađenju te transportu. Podaci se
  kompiluju od strane Eurostata iz nacionalnih energetskih statistika.
7-2-1-intention: >-
  Povećanje udjela obnovljivih izvora energije ključno je za smanjenje emisija
  stakleničkih plinova iz energetskog sektora i postizanje klimatskih ciljeva.
  Obnovljivi izvori doprinose i energetskoj sigurnosti i dugoročnom smanjenju
  troškova. Napredak znači trajno povećanje udjela obnovljive energije u ukupnoj
  potrošnji.
7-2-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih energetskih statistika
  izvještenih prema Direktivi o obnovljivim izvorima energije. Bruto krajnja
  potrošnja energije uključuje energiju isporučenu krajnjim korisnicima plus
  gubitke u mreži električne energije i distributivnim mrežama toplinskih
  postrojenja.
7-1-1-title: Energetska produktivnost
7-1-1-definition: >-
  Energetska produktivnost mjeri koliko ekonomskog outputa se generira po
  jedinici potrošene energije. Izračunava se kao BDP podijeljen s bruto
  potrošnjom energije u zemlji i izražava u eurima po kilogramu ekvivalenta
  nafte (EUR/kgoe). Viša vrijednost ukazuje na učinkovitije korištenje energije
  za generiranje ekonomskog outputa.
7-1-1-intention: >-
  Poboljšanje energetske produktivnosti centralno je za odvajanje ekonomskog
  rasta od potrošnje energije i smanjenje pritisaka na okoliš. Produktivnije
  korištenje energije snižava troškove za poduzeća i domaćinstva i smanjuje
  emisije. Napredak znači trajno povećanje energetske produktivnosti tokom
  vremena.
7-1-1-methodology: >-
  Energetska produktivnost izračunava se od strane Eurostata koristeći BDP
  podatke (lančani obujmi, referentna godina 2010) i bruto potrošnju energije
  iz nacionalnih energetskih bilanci. Oba indikatora kompiluju se prema EU
  propisima o energetskim statistikama. Podaci se objavljuju godišnje.
6-5-1-title: Vodna tijela s dobrim ekološkim statusom
6-5-1-definition: >-
  Ovaj indikator mjeri udio površinskih vodnih tijela (rijeke, jezera, prijelazne
  i priobalne vode) koja postižu dobar ili visok ekološki status ili potencijal,
  kako je definirano Okvirnom direktivom o vodama EU. Izražava se kao postotak
  svih procijenjenih vodnih tijela. Podaci se izvještavaju od strane država
  članica svakih šest godina.
6-5-1-intention: >-
  Ekološki status vodnih tijela odražava cjelokupno zdravlje vodenih ekosistema
  i pritiske kojima su izloženi od ljudskih aktivnosti. Postizanje dobrog
  ekološkog statusa središnji je cilj Okvirne direktive o vodama. Napredak znači
  povećanje udjela površinskih vodnih tijela koja postižu dobar ili visok
  ekološki status.
6-5-1-methodology: >-
  Podaci se izvještavaju od strane država EU Evropskoj agenciji za okoliš (EEA)
  u okviru Okvirne direktive o vodama (2000/60/EC). Ekološki status procjenjuje
  se na osnovu bioloških, hidromorfoloških i fizikalno-kemijskih elemenata
  kvalitete. Ciklusi izvještavanja traju šest godina.
6-4-1-title: Koncentracija nitrata u podzemnim vodama
6-4-1-definition: >-
  Ovaj indikator mjeri udio postaja za praćenje podzemnih voda gdje prosječna
  koncentracija nitrata prelazi 50 miligrama po litri (EU prag prema Direktivi
  o nitratima). Izražava se kao postotak svih praćenih postaja. Podaci se
  izvještavaju od strane država članica u okviru Direktive o nitratima.
6-4-1-intention: >-
  Zagađenje podzemnih voda nitratima, primarno iz poljoprivrednih izvora,
  predstavlja rizik za kvalitet pitke vode i vodene ekosisteme. Smanjenje
  koncentracija nitrata zahtijeva poboljšano upravljanje nutrijentima u
  poljoprivredi. Napredak znači smanjenje udjela postaja koje prelaze prag od
  50 mg/l.
6-4-1-methodology: >-
  Podaci se prikupljaju od strane država članica prema Direktivi Vijeća
  91/676/EEZ o zaštiti voda od zagađenja uzrokovanog nitratima iz
  poljoprivrednih izvora i izvještavaju Europskoj komisiji svake četiri godine.
  Eurostat kompiluje i objavljuje podatke.
6-3-1-title: Biokemijska potrošnja kisika u rijekama
6-3-1-definition: >-
  Ovaj indikator mjeri biokemijsku potrošnju kisika (BPK) u rijekama, koja
  odražava količinu kisika potrošenu biološkim procesima pri razgradnji organske
  materije u vodi. Niže vrijednosti BPK-a ukazuju na bolji kvalitet vode.
  Izražava se u miligramima kisika po litri i zasniva se na podacima s postaja
  za praćenje rijeka.
6-3-1-intention: >-
  Visoke razine organskog zagađenja u rijekama smanjuju otopljeni kisik, štete
  vodenim živim bićima i mogu učiniti vodu neupotrebljivom za ljude. Smanjenje
  BPK-a u rijekama ključno je za poboljšanje kvaliteta vode i zaštitu slatkovodnih
  ekosistema. Napredak znači smanjenje prosječnih razina BPK-a na praćenim
  postajama.
6-3-1-methodology: >-
  Podaci se prikupljaju iz nacionalnih mreža za praćenje rijeka i kompiluju
  od strane Eurostata u saradnji s Evropskom agencijom za okoliš (EEA). BPK se
  mjeri na standardizovanim postajama i predstavlja kisik potrošen tokom pet
  dana na 20°C (BPK5). Podaci se izvještavaju godišnje.
6-2-1-title: Stanovništvo priključeno na pročišćavanje otpadnih voda
6-2-1-definition: >-
  Ovaj indikator mjeri udio stanovništva čije se otpadne vode prikupljaju i
  obrađuju u postrojenjima za pročišćavanje komunalnih otpadnih voda, izražen
  kao postotak. Pokriva najmanje sekundarni (biološki) tretman. Podaci se
  izvještavaju od strane država članica u okviru Direktive o komunalnim otpadnim
  vodama i kompiluju od strane Eurostata.
6-2-1-intention: >-
  Pristup adekvatnom pročišćavanju otpadnih voda temeljan je za zaštitu
  kvaliteta vode i javnog zdravlja. Nepročišćene otpadne vode zagađuju rijeke,
  jezera i priobalne vode. Napredak znači povećanje udjela stanovništva
  priključenog na barem sekundarno pročišćavanje otpadnih voda.
6-2-1-methodology: >-
  Podaci se izvještavaju od strane država članica svake dvije godine prema
  Direktivi Vijeća 91/271/EEZ o pročišćavanju komunalnih otpadnih voda.
  Indikator pokriva aglomeracije koje generiraju više od 2.000 ekvivalenata
  stanovnika. Eurostat kompiluje i objavljuje podatke kao postotak ukupnog
  stanovništva.
6-1-1-title: Indeks eksploatacije vode
6-1-1-definition: >-
  Indeks eksploatacije vode (WEI+) mjeri zahvaćanje slatke vode kao udio
  dostupnih obnovljivih slatkovodnih resursa (dugoročni prosječni godišnji
  obnovljivi slatkovodni resursi umanjeni za zahtjeve ekološkog protoka).
  Izražava se kao postotak. Vrijednosti iznad 20% ukazuju na vodeni stres;
  iznad 40% na ozbiljan vodeni stres.
6-1-1-intention: >-
  Nestašica vode sve je veća prijetnja ekosistemima, ekonomijama i ljudskoj
  dobrobiti. Praćenje zahvaćanja slatke vode u odnosu na dostupne resurse
  ključno je za održivo upravljanje vodama. Napredak znači održavanje indeksa
  eksploatacije vode ispod pragova stresa kroz efikasno korištenje vode.
6-1-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih statistika o vodama
  koje izvještavaju države članice. Zahvaćanje slatke vode obuhvata vodu
  zahvaćenu iz rijeka, jezera, akumulacija i podzemnih voda za sve namjene.
  Dostupni resursi procjenjuju se iz dugoročnih hidroloških podataka korigiranih
  za zahtjeve ekološkog protoka.
5-6-1-title: Rodna razlika u korištenju interneta
5-6-1-definition: >-
  Ovaj indikator mjeri razliku između udjela muškaraca i žena u dobi od 16 do
  74 godine koji su koristili internet u posljednja tri mjeseca, izraženu u
  procentnim poenima. Pozitivna vrijednost ukazuje na veće korištenje interneta
  od strane muškaraca. Podaci se prikupljaju putem EU istraživanja o korištenju
  IKT-a u domaćinstvima i od strane pojedinaca.
5-6-1-intention: >-
  Digitalni rodni jaz odražava šire nejednakosti u pristupu tehnologiji,
  informacijama i ekonomskim prilikama. Zatvaranje jaza zahtijeva ciljane
  politike za poboljšanje digitalnog pristupa, vještina i samopouzdanja žena.
  Napredak znači smanjenje razlike između stopa korištenja interneta muškaraca
  i žena.
5-6-1-methodology: >-
  Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a u domaćinstvima
  i od strane pojedinaca, koje se provodi godišnje. Korištenje interneta odnosi
  se na bilo kakvu upotrebu interneta u tri mjeseca prije ankete. Rodni jaz
  izračunava se kao razlika između stopa korištenja interneta muškaraca i žena,
  izražena u procentnim poenima.
5-5-1-title: Mjesta koja zauzimaju žene u nacionalnim parlamentima
5-5-1-definition: >-
  Ovaj indikator mjeri udio mjesta koja zauzimaju žene u nacionalnim
  parlamentima (jednodomnim ili donjim domovima), izražen kao postotak svih
  popunjenih mjesta. Podaci se dobijaju od Međuparlamentarne unije (IPU) i
  kompiluju od strane Eurostata.
5-5-1-intention: >-
  Ravnopravno učešće žena i muškaraca u političkom odlučivanju temeljni je
  aspekt ravnopravnosti spolova i demokratskog upravljanja. Povećanje
  zastupljenosti žena u parlamentu osigurava da se perspektive i interesi žena
  odražavaju u zakonodavstvu i politikama. Napredak znači povećanje udjela
  mjesta u parlamentu koja zauzimaju žene.
5-5-1-methodology: >-
  Podaci se dobijaju od Međuparlamentarne unije (IPU) i odnose se na stanje na
  1. januara svake godine. Indikator pokriva jednodomne parlamente i donje domove
  dvodomnih parlamenata. Podaci se odnose na postotak žena među svim članovima
  parlamenta s važećim mandatom.
5-4-1-title: Žene u upravnim odborima velikih listiranih kompanija
5-4-1-definition: >-
  Ovaj indikator mjeri udio žena među članovima upravnih odbora najvećih
  javno listiranih kompanija, izražen kao postotak svih članova odbora.
  Obuhvata i izvršne i neizvršne članove odbora. Podaci se prikupljaju od
  strane Eurostata u saradnji s Evropskim institutom za ravnopravnost spolova.
5-4-1-intention: >-
  Žene su i dalje podzastupljene na višim rukovodećim pozicijama u korporativnom
  sektoru. Povećanje udjela žena u upravnim odborima kompanija promoviše
  ravnopravnost spolova i povezano je s boljim upravljanjem i poslovnim
  rezultatima. Napredak znači trajno povećanje udjela žena na pozicijama
  članova odbora.
5-4-1-methodology: >-
  Podaci se prikupljaju iz nacionalnih izvora od strane Eurostata u saradnji
  s Evropskim institutom za ravnopravnost spolova (EIGE). Indikator pokriva
  najveće javno lisirane kompanije registrovane u svakoj zemlji. Članovi
  odbora uključuju i članove nadzornih i upravljačkih odbora.
5-3-1-title: Jaz u penzijama između spolova
5-3-1-definition: >-
  Jaz u penzijama između spolova je razlika između prosječnih prihoda od penzija
  koje primaju muškarci i žene u dobi od 65 do 79 godina, izražena kao postotak
  prosječnih penzijskih prihoda muškaraca. Odražava nakupljene nejednakosti s
  tržišta rada, uključujući razlike u stopama zaposlenosti, radnom vremenu,
  plaćama i prekidima karijere. Podaci se zasnivaju na EU-SILC anketi.
5-3-1-intention: >-
  Jaz u penzijama između spolova posljedica je nejednakosti u zaposlenju i
  zaradama tokom cijelog radnog vijeka. Zatvaranje jaza zahtijeva rješavanje
  temeljnih uzroka, uključujući prekide karijere zbog skrbi, rad s nepunim
  radnim vremenom i segregaciju po zanimanjima. Napredak znači trajno smanjenje
  jaza u penzijskim prihodima između muškaraca i žena.
5-3-1-methodology: >-
  Podaci se prikupljaju putem EU ankete o prihodima i uvjetima življenja
  (EU-SILC). Penzijski prihodi uključuju starosne penzije i penzije preživjelih.
  Jaz u penzijama između spolova izračunava se kao razlika između prosječnih
  penzijskih prihoda muškaraca i žena, izražena kao postotak prosječnog
  penzijskog prihoda muškaraca, za osobe u dobi od 65 do 79 godina.
5-2-1-title: Jaz u plaćama između spolova
5-2-1-definition: >-
  Nekorigovani jaz u plaćama između spolova je razlika između prosječnih bruto
  satnih zarada zaposlenih muškaraca i žena, izražena kao postotak prosječnih
  bruto satnih zarada muškaraca. Zasniva se na zaposlenicima u firmama s deset
  ili više zaposlenih. Podaci se prikupljaju putem Istraživanja o strukturi zarada.
5-2-1-intention: >-
  Jaz u plaćama između spolova odražava trajne nejednakosti između muškaraca i
  žena na tržištu rada, uključujući razlike u sektorima, zanimanjima, radnom
  vremenu i prekidima karijere. Zatvaranje jaza zahtijeva rješavanje segregacije
  po zanimanjima i diskriminacije. Napredak znači trajno smanjenje jaza u plaćama.
5-2-1-methodology: >-
  Podaci se prikupljaju putem Istraživanja o strukturi zarada (SES), koje se
  provodi svake četiri godine, s godišnjim procjenama koje izrađuje Eurostat.
  Indikator pokriva sve ekonomske aktivnosti osim javne uprave i zasniva se na
  bruto satnim zaradama u firmama s deset ili više zaposlenih.
5-1-1-title: Jaz u zaposlenosti između spolova
5-1-1-definition: >-
  Jaz u zaposlenosti između spolova je razlika između stopa zaposlenosti muškaraca
  i žena u dobi od 20 do 64 godine, izražena u procentnim poenima. Pozitivna
  vrijednost znači da muškarci imaju višu stopu zaposlenosti od žena. Podaci se
  zasnivaju na Anketi o radnoj snazi EU (EU-LFS).
5-1-1-intention: >-
  Jaz u zaposlenosti između spolova odražava strukturne nejednakosti na tržištu
  rada. Zatvaranje jaza zahtijeva politike koje podržavaju učešće žena u
  zaposlenju, uključujući pristupačnu dječiju skrb, fleksibilne radne aranžmane
  i jednake mogućnosti. Napredak znači trajno smanjenje razlike između stopa
  zaposlenosti muškaraca i žena.
5-1-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Stopa
  zaposlenosti izračunava se kao postotak zaposlenih osoba u ukupnoj populaciji
  u dobi od 20 do 64 godine. Jaz u zaposlenosti između spolova je razlika između
  stopa zaposlenosti muškaraca i žena, izražena u procentnim poenima.
4-6-1-title: Učešće odraslih u učenju
4-6-1-definition: >-
  Ovaj indikator mjeri udio odraslih u dobi od 25 do 64 godine koji su
  učestvovali u formalnom ili neformalnom obrazovanju i obuci u četiri sedmice
  koje su prethodile anketi. Izražava se kao postotak ukupnog stanovništva u
  dobi od 25 do 64 godine. Podaci se zasnivaju na Anketi o radnoj snazi EU.
4-6-1-intention: >-
  Cjeloživotno učenje je ključno za prilagodbu promjenljivom tržištu rada i
  održavanje zapošljivosti. Veće učešće odraslih u učenju smanjuje neusklađenost
  vještina i podržava socijalnu uključenost. Cilj je povećati udio odraslih
  koji se kontinuirano obrazuju tokom svog života.
4-6-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Formalno
  obrazovanje odnosi se na obrazovanje koje pruža redovni sistem škola,
  univerziteta i drugih formalnih obrazovnih institucija. Neformalno obrazovanje
  uključuje sve organizovane obrazovne aktivnosti izvan formalnog sistema.
4-5-1-title: Osobe s barem osnovnim digitalnim vještinama
4-5-1-definition: >-
  Ovaj indikator mjeri udio osoba u dobi od 16 do 74 godine koje posjeduju
  barem osnovne digitalne vještine u četiri oblasti: informacijska i podatkovna
  pismenost, komunikacija i suradnja, rješavanje problema i kreiranje digitalnih
  sadržaja. Izražava se kao postotak ukupnog stanovništva u dobi od 16 do 74.
4-5-1-intention: >-
  Digitalne vještine su sve više neophodne za učešće na tržištu rada i u
  društvu. Osiguranje digitalno kompetentnog stanovništva podržava ekonomski
  rast, inovacije i socijalnu uključenost. Napredak znači povećanje udjela
  osoba s barem osnovnim digitalnim kompetencijama.
4-5-1-methodology: >-
  Podaci se prikupljaju putem EU istraživanja o korištenju IKT-a u domaćinstvima
  i od strane pojedinaca. Kompozitni indikator digitalnih vještina zasniva se
  na EU Okviru digitalnih kompetencija (DigComp) i pokriva aktivnosti obavljene
  u 3 mjeseca prije ankete.
4-4-1-title: Učenici s niskim postignućima u čitanju, matematici i prirodnim naukama
4-4-1-definition: >-
  Ovaj indikator mjeri udio 15-godišnjih učenika koji ne dostignu nivo 2
  (minimalni nivo kompetentnosti) u čitanju, matematici i prirodnim naukama,
  na osnovu OECD Programa za međunarodnu procjenu učenika (PISA). Izražava se
  kao postotak svih procijenjenih učenika.
4-4-1-intention: >-
  Osiguranje minimalnih kompetencija pismenosti i matematike za sve mlade
  ključno je za kvalitetno obrazovanje. Visoke stope slabih postignuća
  ograničavaju buduće mogućnosti zaposlenja i ekonomskog učešća. Napredak znači
  smanjenje udjela učenika s niskim postignućima u sve tri oblasti.
4-4-1-methodology: >-
  Podaci dolaze iz OECD PISA istraživanja, koje se provodi svake tri godine
  među učenicima od 15 godina. Nivo 2 kompetentnosti je bazični nivo na kojem
  učenici počinju pokazivati kompetencije koje im omogućavaju aktivno učešće
  u modernom društvu. Istraživanje pokriva čitanje, matematiku i prirodne nauke.
4-3-1-title: Učešće u ranom dječijem obrazovanju
4-3-1-definition: >-
  Ovaj indikator mjeri udio djece u dobi od 3 godine do početka obaveznog
  školovanja koja učestvuju u programima ranog dječijeg obrazovanja. Izražava
  se kao postotak stanovništva u istoj dobnoj skupini. Podaci se prikupljaju
  iz nacionalnih administrativnih izvora.
4-3-1-intention: >-
  Rano dječije obrazovanje ključno je za pripremu djece za osnovnu školu i
  cjeloživotno učenje. Visoke stope učešća smanjuju nejednakosti i podržavaju
  kognitivni, emocionalni i socijalni razvoj od najranije dobi. Dugoročni cilj
  je maksimizirati učešće sve djece u kvalitetnom ranom obrazovanju.
4-3-1-methodology: >-
  Podaci se kompiluju od strane Eurostata iz nacionalnih administrativnih izvora
  i odnose se na djecu upisanu u programe ISCED 2011 nivoa 0 (rano dječije
  obrazovanje). Pokrivenost uključuje javne i privatne institucije. Referentna
  populacija su djeca od 3 godine do početka obaveznog školovanja.
4-2-1-title: Tercijarno obrazovanje (25–34 godine)
4-2-1-definition: >-
  Ovaj indikator mjeri udio osoba u dobi od 25 do 34 godine koje su uspješno
  završile tercijarno obrazovanje (ISCED 2011 nivoi 5–8). Izražava se kao
  postotak ukupnog stanovništva u toj dobnoj skupini. Podaci se zasnivaju
  na Anketi o radnoj snazi EU.
4-2-1-intention: >-
  Povećanje udjela osoba s terciarnim obrazovanjem ključno je za razvoj
  kvalificirane radne snage sposobne za poticanje inovacija i ekonomskog
  rasta. Viši nivoi obrazovanja povezani su s boljim izgledima za zaposlenje,
  višim prihodima i većim građanskim angažmanom. Napredak podrazumijeva
  kontinuirani rast udjela mladih koji završavaju tercijarno obrazovanje.
4-2-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS). Tercijarno
  obrazovanje odgovara ISCED 2011 nivoima 5 do 8, koji obuhvataju kratke
  tercijarne programe, prvostepene studije, drugostepene studije i doktorske
  programe. Dobna skupina 25–34 odabrana je jer je većina osoba u tom rasponu
  završila inicijalno obrazovanje.
4-1-1-title: Rano napuštanje obrazovanja i obuke
4-1-1-definition: >-
  Rano napuštanje obrazovanja i obuke odnosi se na osobe u dobi od 18 do 24
  godine koje su stekle najviše niže srednje obrazovanje i nisu uključene u
  daljnje obrazovanje ili obuku. Indikator se izražava kao postotak ukupnog
  stanovništva u dobi od 18 do 24 godine. Podaci se zasnivaju na Anketi o
  radnoj snazi EU.
4-1-1-intention: >-
  Smanjenje ranog napuštanja obrazovanja ključno je za osiguranje da svi mladi
  steknu znanja i vještine neophodne za zaposlenje i aktivno građanstvo.
  Visoke stope ranog napuštanja povezane su s nižim prihodima, višom
  nezaposlenošću i većom ovisnošću o sistemima socijalne podrške. Dugoročni
  cilj je minimizirati udio onih koji rano napuštaju školovanje.
4-1-1-methodology: >-
  Podaci se prikupljaju putem Ankete o radnoj snazi EU (EU-LFS), velikog
  istraživanja kućanstava koje pruža tromjesečne statistike o učešću na
  tržištu rada. Indikator obuhvata osobe od 18 do 24 godine čiji je najviši
  nivo obrazovanja ISCED 2011 nivo 0, 1 ili 2, i koje su izjavile da nisu
  bile uključene u nikakvo obrazovanje ili obuku u četiri sedmice koje su
  prethodile anketi.
