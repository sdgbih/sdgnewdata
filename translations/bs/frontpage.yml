heading: "Indikatori ciljeva održivog razvoja za Bosnu i Hercegovinu"
download_all: Preuzmi sve podatke
zip_file: ZIP datoteka
intro_title: Za mjerenje napretka u ostvarivanju Ciljeva održivog razvoja na evropskom nivou (EU SDG) razvijen je set indikatora
intro_body: <a href="https://ec.europa.eu/eurostat/web/sdi/database/">Set indikatora</a> se sastoji od oko 100 indikatora strukturiranih prema 17 ciljeva Agende 2030, šest indikatora po svakom cilju održivosti, kako bi svi ciljevi imali istu važnost i omogućili uravnoteženo mjerenje napretka svih dimenzija održivosti. Pojedinačni indikatori, takozvani multifunkcionalni indikatori, također se koriste za praćenje više od jednog cilja održivog razvoja. Set EU SDG indikatora predstavlja osnovu za godišnji izvještaj Eurostata o napretku u ostvarivanju SDG-ova u kontekstu Evropske unije. Ovaj portal omogućava pregled trenutnog stanja dostupnosti i razvoja EU SDG indikatora u Bosni i Hercegovini. 
