instructions: Kliknite na svaki cilj, ili %before_link pretraga, %after_link za %name statistiku globalnih indikatora održivih ciljeva.
heading: "Indikatori ciljeva održivog razvoja za Bosnu i Hercegovinu"
download_all: Preuzmi sve podatke
zip_file: ZIP datoteka
intro_title: Ciljevi održivog razvoja na evropskom nivou (EU SDG)
intro_body: "<a href=\"https://ec.europa.eu/eurostat/web/sdi/database/\">Set indikatora</a> se sastoji od oko 100 indikatora strukturiranih prema 17 ciljeva Agende 2030, šest indikatora po svakom cilju održivosti, kako bi svi ciljevi imali istu važnost i omogućili uravnoteženo mjerenje napretka svih dimenzija održivosti. Ovaj portal omogućava pregled trenutnog stanja dostupnosti i razvoja EU SDG indikatora u Bosni i Hercegovini."
