heading: "Indikatori ciljeva održivog razvoja za Bosnu i Hercegovinu"
download_all: Preuzmi sve podatke
zip_file: ZIP datoteka
intro_title: EU-SDG indikatori za Bosnu i Hercegovinu
intro_body: '<a href="https://ec.europa.eu/eurostat/web/sdi/database/">Set indikatora</a> se sastoji od oko 100 indikatora strukturiranih prema 17 ciljeva Agende 2030, šest indikatora po svakom cilju održivosti, kako bi svi ciljevi imali istu važnost i omogućili uravnoteženo mjerenje napretka svih dimenzija održivosti. Ovaj portal omogućava pregled trenutnog stanja dostupnosti i razvoja EU SDG indikatora za Bosnu i Hercegovinu.'
