1-10-title: Poverty headcount ratio at $6.85/day - proxy indicator
1-10-definition: >-
  Estimated percentage of each country's population that is living under the poverty threshold of US$6.85 a day in purchasing power parity (PPP) at constant 2011 prices.
1-10-intention: >-
  Poverty and social exclusion are harmful to individual lives and limit people's opportunities to reach their full potential by affecting their health and well-being and reducing educational outcomes. This, in turn, reduces opportunities for a successful life and further increases the risk of poverty. Without an effective system of education, healthcare, social protection, tax relief, and employment, the risk of poverty is passed from one generation to the next. This causes the persistence of poverty and thereby creates even more inequality, which can lead to long-term loss of economic productivity of entire groups of society and hinder inclusive and sustainable economic growth.
1-10-methodology: >-
  Purchasing power parities (PPPs) are used in global poverty estimation to adjust for price differences across countries. PPPs are price indices published by the International Comparison Program (ICP) that measure how much it costs to purchase a basket of goods and services in one country compared to how much it costs to purchase the same basket of goods and services in a reference country, typically the United States. PPP conversion factors are preferred to market exchange rates for the measurement of global poverty because the latter overestimate poverty in developing countries, where non-tradable services are relatively cheap (a phenomenon known as the Balassa-Samuelson-Penn effect).
1-10-long_term_objective: >-
  Reduce the number of people at risk of poverty or social exclusion by 15 million by 2030 compared with 2019 (policy reference: European pillar of social rights Action Plan)
1-20-title: Poverty gap at $3.00 a day (2021 PPP) (%) - proxy indicator
1-20-definition: >-
  Poverty gap at $3.00 a day (2021 PPP) is the mean shortfall in income or consumption from the poverty line $3.00 a day (counting the nonpoor as having zero shortfall), expressed as a percentage of the poverty line. This measure reflects both the depth and the incidence of poverty.
1-20-intention: >-
  For countries with active poverty monitoring programs, the World Bank—in collaboration with national institutions, other development agencies, and civil society—regularly conducts analytical activities to assess the extent and causes of poverty and inequality, examine the impact of economic growth and public policies, and review household survey data and measurement methodology.
1-20-methodology: >-
  Poverty rates are estimated based on selected household consumption surveys. Generally, these surveys query a representative sample of households in a country regarding their consumption or income. They often serve as the official surveys that countries rely on to monitor and report on poverty conditions. 
1-20-long_term_objective: >-
  Text in progress
1-31-title: Severe material and social deprivation rate by age group and sex
1-31-definition: >-
  The ‘Income and Living Conditions’ (EU-SILC) domain covers the following topics: persons at risk of poverty or social exclusion, income inequality, income distribution and monetary poverty, living conditions and material deprivation. It also covers EU-SILC ad hoc modules, which are organised into collections of indicators on specific topics.
  The EU-SILC collection is a key instrument for providing the information required by the European Semester ([1]) and the European Pillar of Social Rights. It is also the main source of data for microsimulation purposes and for producing flash estimates of income distribution and poverty rates.
  In 2024, in addition to annual data, EU-SILC collected the three-yearly module on children health, access to healthcare and children specific deprivation, and the six-yearly module on access to services. The information collected in EU-SILC pertains to the following types of statistical units: private households and persons living in those households. Annex II to EU regulation 2019/2242 defines the specific statistical units for each variable, while Annex IV to the same Regulation specifies the content of the quality reports on the organisation of a sample survey in the income and living conditions domain, pursuant to EU regulation 2019/1700 of the European Parliament and of the Council.
1-31-intention: >-
  The EU-SILC common framework aims to ensure standardisation at different levels. Conceptual standardisation is achieved by defining and documenting the common concepts/definitions underlying each measure/variable, the scope and the time reference.
  In 2021, new legislation on implementing EU-SILC came into force, revising and improving the survey (see Section 3.4). The new legislation provided for multiple changes to EU-SILC data collection, in particular:

  •	it enforced the need for the following improvements: improved timeliness, with shorter deadlines for EU-SILC data submission;

  •	it reformulated precision requirements at national and regional level (NUTS2) for the at-risk-of-poverty-or social-exclusion indicator and the persistent-risk-of-poverty rate;

  •	additional/changed EU-SILC variables;

  •	data collection with three frequencies: nucleus, three-year module and six-year module, and the recommendation to extend the longitudinal panel.
1-31-methodology: >-
  The target population is private households and all persons composing these households having their usual residence in the national territory. A private household means a person living alone or a group of persons who live together, providing for themselves the essentials of living.
  The reference period is the survey year. For all countries, the reference period for income variables in EU-SILC is the previous calendar year.
  The concept of accuracy refers to the precision of estimates computed from a sample rather than from the entire population. Accuracy depends on sample size, sampling design effects and the structure of the population being studied. In addition, sampling errors and non-sampling errors need to be considered. Sampling error means the variability that occurs at random due to using a sample rather than a census, and non-sampling errors are errors that occur in all phases of the data collection and production process.
  From 2021
  EU regulation 2019/1700 lays down the requirements relating to geographical coverage, detailed sample characteristics, including subsampling, in accordance with Annex III to that Regulation, sampling characteristics, common data gathering periods, common standards for editing and imputation, weighting, estimation and variance estimation.
1-31-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
1-40-title: Persons living in households with very low work intensity, by age group
1-40-definition: >-
  Poverty and social exclusion harm individual lives and limit the opportunities for people to achieve their full potential by affecting their health and well-being and lowering educational outcomes. This, in turn, reduces opportunities to lead a successful life and further increases the risk of poverty. Without effective education, health, social, tax benefit and employment systems, the risk of poverty is passed on from one generation to the next. This causes poverty to persist and hence creates more inequality, which can lead to long-term loss of economic productivity from whole groups of society and hamper inclusive and sustainable economic growth.
1-40-intention: >-
  People in the age of 0 to 64 years living in households where the adults worked a working time equal or less than 20 % of their total combined work-time potential during the previous year.
  As adults count people in the age of 18 to 64 years. Students aged 18 to 24 years; people who are retired according to their self-defined current economic status or who receive any pension (except survivor’s pension); and people in the age bracket 60 to 64 who are inactive and living in a household where the main income is pensions, are not taken into account.
  The indicator is part of the multidimensional poverty index.
1-40-methodology: >-
  The reference period is the survey year. For all countries, the reference period for income variables in EU-SILC is the previous calendar year.
  The indicator is included as a secondary indicator in the Social Scoreboard for the European Pillar of Social Rights and the EPSR Action Plan, and is part of the multidimensional poverty index. It can be considered as part of the global SDG indicator 1.2.2 "Proportion of men, women and children of all ages living in poverty in all its dimensions according to national definitions"
  From 2021 Regulation (EU) 2019/1700 foresees the requirements relating to geographical coverage, detailed sample characteristics, including subsampling, in accordance with Annex III, common data gathering periods, common standards for editing and imputation, weighting, estimation and variance estimation.
1-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
1-41-title: In work at - risk - of poverty rate
1-41-definition: >-
  The indicator is part of the EU Sustainable Development Goals (SDG) indicator set where it is used to monitor progress towards SDG 1 on ending poverty in all its forms everywhere, which is embedded in the European Commission’s Priorities under 'An Economy that works for people'.
  The indicator is included as a secondary indicator in the Social Scoreboard for the European Pillar of Social Rights and EPSR Action Plan.
  The share of persons who are employed and have an equivalised disposable income below the risk-of-poverty threshold, which is set at 60 % of the national median equivalised disposable income (after social transfers). For the purpose of this indicator, an individual is considered as being employed if he/she was employed for more than half of the reference year. The indicator is based on the EU-SILC (statistics on income, social inclusion and living conditions).
1-41-intention: >-
  Employment is often claimed to be the best protection against poverty, so one of the objectives of the EU is to create more and better jobs. It is therefore important to measure the share of working-poor, people living below the poverty line although they are working.
  Poverty and social exclusion harm individual lives and limit the opportunities for people to achieve their full potential by affecting their health and well-being and lowering educational outcomes. This, in turn, reduces opportunities to lead a successful life and further increases the risk of poverty. Without effective education, health, social, tax benefit and employment systems, the risk of poverty is passed on from one generation to the next. This causes poverty to persist and hence creates more inequality, which can lead to long-term loss of economic productivity from whole groups of society and hamper inclusive and sustainable economic growth.
1-41-methodology: >-
  The indicator is produced according to the high-level quality standards of European Statistics. From 2005 onwards, EU-SILC is based on a common framework defined by harmonised lists of primary and secondary variables, common concepts, a recommended design, common requirements (such as imputation procedures, weighting, sampling errors calculation) and classifications aiming at maximising comparability of the information produced.
  From 2021 Regulation (EU) 2019/1700 foresees the requirements relating to geographical coverage, detailed sample characteristics, including subsampling, in accordance with Annex III, common data gathering periods, common standards for editing and imputation, weighting, estimation and variance estimation
1-41-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
1-50-title: Affordable Housing - proxy indicator
1-50-definition: >-
  Housing affordability in BiH has reached a critical point, with poor households spending over 40% of their income on housing. Many factors such as demand from diaspora and foreign investors, fragmented and poorly coordinated housing policies, have pushed prices beyond the reach of residents. Social housing systems remain underdeveloped, while informal rental markets induce tenants’ vulnerability and deprive governments of tax revenue.
1-50-intention: >-
  Poverty and social exclusion harm individual lives and limit the opportunities for people to achieve their full potential by affecting their health and well-being and lowering educational outcomes. This, in turn, reduces opportunities to lead a successful life and further increases the risk of poverty. Without effective education, health, social, tax benefit and employment systems, the risk of poverty is passed on from one generation to the next. This causes poverty to persist and hence creates more inequality, which can lead to long-term loss of economic productivity from whole groups of society and hamper inclusive and sustainable economic growth.
1-50-methodology: >-
  In addition to desk research, this paper draws on insights from eight semi-structured interviews conducted with stakeholders in Bosnia and Herzegovina, Montenegro, Denmark, and the Netherlands. Interviewees included representatives from cantonal ministries, municipal governments, NGOs working on tenant rights and housing affordability, and researchers specializing in housing systems. These interviews provided practical perspectives on the challenges of social housing, informal rental markets, vacant properties, and affordability. 
1-50-long_term_objective: >-
 Bosnia and Herzegovina ranks among Europe’s least affordable countries for housing, with average price-to-income ratios exceeding 13, which is far above, for example, the Netherlands' 7.7 and Denmark's 6.6.
2-10-title: Obesity rate by body mass index (BMI)
2-10-definition: >-
  The European Health Interview Survey (EHIS) aims to measure the health status (including disability), health determinants (lifestyle) of EU citizens, the use of health services, and barriers to accessing those services, in a harmonized manner and with a high degree of comparability among Member States (MS). 
  The general scope of the survey covers the population aged over 15 years living in private households within the territory of the country. 
  EHIS consists of four modules: health status, health determinants, health care, and core variables (sociodemographic characteristics of the population).
2-10-intention: >-
  Data are collected through national surveys. EHIS can be conducted as a separate national survey or can be integrated into an existing national survey (e.g., national health survey, labor force survey, other household survey). In this way, member countries had maximum flexibility in implementation. However, across the EU the same data were collected according to a common list of variables and response categories.
2-10-methodology: >-
  EHIS aims to achieve standardization of data entry. A standard questionnaire model (questions, response categories, filters, etc.) has been prepared, as well as conceptual guidelines and explanations. A conceptual translation into all EU languages has been requested.  
   "identical question"; "slightly modified question"; "strongly modified question"; or "not available: new question in EHIS wave 3."
2-10-long_term_objective: >-
  The long-term goal for this indicator is a BMI of 3.
2-20-title: Agricultural real factor income per annual work unit (AWU)
2-20-definition: >-
  Indicator is used to monitor progress towards SDG 2 on ending hunger and malnutrition; which is embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: Food security, water and nature'.
  Agricultural real factor income measures the income generated by farming, which is used to remunerate borrowed, rented or own factors of production (capital, labour and land). 
  Annual work units (AWUs) are defined as full-time equivalent employment (corresponding to the number of full-time equivalent jobs), which is calculated by dividing total hours worked by the average annual number of hours worked in full-time jobs within the economic territory. This can be interpreted as a measure of labour productivity in agriculture. The data stem from the Economic Accounts for Agriculture (EAA), which provide detailed information on agricultural sector income.
2-20-intention: >-
  SDG 2  aims to ensure access to safe, nutritious and sufficient food. Improving agricultural productivity and the incomes of food producers are key factors in achieving this goal.
  Data source is Economic accounts for agriculture (EAA) using agricultural statistics plus administrative information. The EAA are satellite accounts of the European System of Accounts, providing complementary information and concepts adapted to the particular nature of the agricultural industry. Although their structure very closely matches that of the national accounts, their compilation requires the formulation of appropriate rules and methods.
2-20-methodology: >-
  One of the five general objectives of the Common Agricultural Policy (CAP) is to ensure a fair standard of living for farmers. The CAP is financed by two funds: the European Agricultural Guarantee Fund (EAGF), which finances direct payments to farmers as well as market measures, and the European Agricultural Fund for Rural Development (EAFRD) under which rural development programmes are financed. EU subsidies and direct payments have become an important share of the agriculture factor income.
2-20-long_term_objective: >-
  to enhance the productivity and profitability of the agricultural sector through:

  -	Increasing real factor income

  -	Reducing agricultural labor

  -	Stabilizing agricultural income
2-30-title: Government support to agricultural research and development
2-30-definition: >-
  The indicator refers to Government budget allocations for R&D (GBARD) for agriculture. GBARD data measure government support to research and development (R&D) activities, or, in other words, how much priority governments place on the public funding of R&D. GBARD data are compiled using the guidelines laid out in the OECD’s Frascati Manual from 2015 and and the European Business Statistics Methodological Manual for R&D statistics of 2023. The data are expressed in current prices, meaning that the overall development of the indicator is in part also influenced by general price inflation.
2-30-intention: >-
  Indicator is used to monitor progress towards SDG 2 on ending hunger and malnutrition; which are embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: Food security, water and nature'. 
  SDG 2 - among other things - aims to ensure access to safe, nutritious and sufficient food. Improving agricultural productivity and maintaining sustainable and resilient food production systems are key factors in achieving this goal and depend to a large extend on increased investment in agricultural, food and nutrition research and development.
2-30-methodology: >-
  Countries compile GBARD data following the Frascati manual recommendations. Among the few methodological issues which can affect the comparisons across countries, are the stage in the budgetary process from which final GBARD data are drawn (final budget appropriations or actual outlays); the inclusion of VAT or EU funds for R&D.
  GBARD data are broken down by:
    -Socio-economic objectives (SEOs) in accordance to the Nomenclature for the analysis and comparison of scientific programmes and budgets (NABS 2007). - (See Annex 3 at the bottom of the page).
    -Funding mode: project funding and institutional funding (non-mandatory data).
  The part of GBARD allocated to transnational cooperation in R&D is further broken down into three specific categories: transnational public R&D performers; Europe-wide transnational public R&D programmes; and bilateral or multilateral public R&D programmes established between Member State governments or with EFTA and candidate countries.
2-30-long_term_objective: >-
  Enhancing market orientation and competitiveness (short-term rating 2018–2023 4.9%; long-term rating 2008–2023 1.5%)
2-40-title: Area under organic farming
2-40-definition: >-
  This indicator is defined as the share of total utilised agricultural area (UAA) occupied by organic farming (existing organically farmed areas and areas undergoing conversion). Organic farming is a production method that puts the highest emphasis on environmental and wildlife protection and, with regard to livestock production, on animal welfare considerations. It avoids or largely reduces the use of synthetic chemical inputs, such as fertilisers, pesticides, additives and medical products.
2-40-intention: >-
  Indicator is is used to monitor progress towards SDG 2 on ending hunger and malnutrition; which is embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: Food security, water and nature'.
  SDG 2 aims to ensure access to safe, nutritious and sufficient food. Sustainable and resilient food production systems are a key factor in achieving this goal. Organic farming is a method of production that puts the highest emphasis on environmental protection and, with regard to livestock production, animal welfare considerations. It avoids or largely reduces the use of synthetic chemical inputs such as fertilisers, pesticides, additives and medical products.
  Indicator can be considered as part of global SDG indicator 2.4.1 "Proportion of agricultural area under productive and sustainable agriculture".
2-40-methodology: >-
  Indicator can be considered as part of global SDG indicator 2.4.1 "Proportion of agricultural area under productive and sustainable agriculture". While organic farming is not explicitly mentioned in the Agenda 2030, the EU considers organic farming as a method of production, which puts the highest emphasis on environmental and woldlife protection and, with regard to livestock production, on animal welfare considerations. It avoids or largely reduces the use of synthetic chemical inputs such as fertilisers, pesticides, additives and medical products. The production of genetically modified organisms (GMOs) and their use in animal feed are forbidden. 
  The Biodiversity strategy for 2030 is a key component of the European Green Deal. The strategy aims to reduce the use and risk of chemical pesticides, reduce nutrient losses, and reduce the use of fertilisers and antibiotics. The Biodiversity strategy sets the target of achieving 25 % of the EU’s total farmland under organic farming by 2030.
2-40-long_term_objective: >-
  At least 25 % of the EU’s  agricultural land should be under organic farming by 2030
2-53-title: Use and risk of chemical pesticides
2-53-definition: >-
  The indicator monitors the trends in the use and risk of chemical pesticides in the EU and its Member States. The use of pesticides entails risks and impacts on human health and the environment. The indicator is based on the quantities of chemical active substances contained in the pesticides which are placed on the market (sold), and therefore used, in each Member State, and the hazard properties of these active substances. The data are presented as an index relative to the average results for the period 2015 to 2017.
2-53-intention: >-
  Indicator is used to monitor progress towards SDG 2 on ending hunger and malnutrition; which is embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: Food security, water and nature'.
  SDG 2 aims to ensure access to safe, nutritious and sufficient food. Sustainable and resilient food production systems are a key factor in achieving this goal. Along with the promotion of organic farming, integrated pest management (IPM) is one of the tools to emphasise the growth of healthy crop by encouraging natural pest control mechanisms and reducing or minimising risks to human health and the environment.
  The EU "Zero Pollution Action Plan" aims to reduce by 50% the use and risk of chemical pesticides and the use of more hazardous pesticides, by 2030.
2-53-methodology: >-
  Calculation based on the quantities of chemical active substances that are approved as candidates for substitution in accordance with Article 24 of Regulation (EC) No 1107/2009, contained in the plant protection products which are placed on the market in plant protection products each year reported under Regulation (EC) No 1185/2009 under Regulation (EC) No 1107/2009 and provided according to Annex I of Regulation (EC) No 1185/2009.
2-53-long_term_objective: >-
  Reduce the use and risk of chemical pesticides by 50 % by 2030 compared to a three-year baseline (average for the period 2015 to 2017)
2-60-title: Ammonia emissions from agriculture
2-60-definition: >-
  The amount of ammonia (NH3) emissions as a result of the agricultural production. Ammonia emissions per hectare are calculated using the total utilised agricultural area (UAA) of the relevant year as denominator.
  Data for this indicator come from the EU inventory on air pollution compiled by the European Environment Agency (EEA) under the Convention on Long-range Transboundary Air Pollution (LRTAP) and are fully consistent with national air pollution inventories compiled by EU Member States.
  Data on the utilised agricultural area (UAA) stem from Eurostat’s annual crop statistics. The definition of this indicator is based on the CAP indicator C45 Emissions from agriculture
2-60-intention: >-
  Indicator is used to monitor progress towards SDG 2 on ending hunger and malnutrition; which is embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: Food security, water and nature'.
  SDG 2 seeks for sustainable and resilient food production systems. Ammonia (NH3) is a colourless, pungent-smelling and corrosive gas that is produced by the decay of organic vegetable matter and from the excrement of humans and animals. When released into the atmosphere, ammonia contributes to the level of air pollution. The agricultural sector continues to be the overwhelming contributor to ammonia emissions in the EU.
2-60-methodology: >-
  The indicator monitors the trends in the use and risk of chemical pesticides in the EU and its Member States. The use of pesticides entails risks and impacts on human health and the environment. The indicator is based on the quantities of chemical active substances contained in the pesticides which are placed on the market (sold), and therefore used, in each Member State, and the hazard properties of these active substances. The data are presented as an index relative to the average results for the period 2015 to 2017.
  Measures implemented under the Common Agricultural Policy (CAP) and the Water Framework Directive has lead to EU reductions of ammonia emissions from agriculture since the 1990s. Specifically, measures to change agricultural practices brought about reductions in the use of nitrogenous fertilisers and reduced livestock density per hectare across the EU.
  The National Emission reduction Commitments Directive (NEC Directive) sets national emission reduction commitments for Member States and the EU for five important air pollutants, including ammonia.
2-60-long_term_objective: >-
  The long-term objective for this indicator is a value of 8 per hectare.
3-12-title: Healthy life expectancy based on self-perceived health
3-12-definition: >-
  This indicator estimates the number of years a person is expected to live in good perceived health. It is based on mortality data combined with data on self-perceived health as reported in the EU Statistics on Income and Living Conditions (EU-SILC).
3-12-intention: >-
  The indicator is part of the EU Sustainable Development Goals (SDG) indicator set. It is used to monitor progress towards SDG 3 on good health and well-being and SDG 1 on no poverty as a multi-purpose indicator (MPI); which are embedded in the European Commission’s 2024-2029 Priorities under 'Supporting people, strenghtening our societes and our social model'.
3-12-methodology: >-
  Good health is not only of value to the individual as a major determinant of quality of life, well being and social participation, it is also a basic precondition for general economic growth. Monitoring SDG 3 in an EU context focuses on the topics of healthy lives, determinants of health, causes of death and health care.
3-12-long_term_objective: >-
  No description
3-20-title: Share of people with good or very good perceived health by sex
3-20-definition: >-
  The indicator is a subjective measure on how people judge their health in general on a scale from "very good" to "very bad". It is expressed as the share of the population aged 16 or over perceiving itself to be in "good" or "very good" health.
  Indicators of perceived general health have been found to be a good predictor of people’s future health care use and mortality. The data stem from the EU Statistics on Income and Living Conditions (EU SILC).
3-20-intention: >-
  From 2021 Regulation (EU) 2019/1700 foresees the requirements relating to geographical coverage, detailed sample characteristics, including subsampling, in accordance with Annex III, common data gathering periods, common standards for editing and imputation, weighting, estimation and variance estimation.
3-20-methodology: >-
  Before 2021 onwards EU-SILC is based on a common framework defined by harmonised lists of primary and secondary variables, common concepts, a recommended design, common requirements (such as imputation procedures, weighting, sampling errors calculation) and classifications aiming at maximising comparability of the information produced. Details can be found in the metadata of the source datasets.
3-20-long_term_objective: >-
  The long-term objective for this indicator is a value of 80.
3-30-title: Smoking prevalence by sex
3-30-definition: >-
  This indicator measures the percentage of the population aged 15 years and over who report they currently smoke boxed cigarettes, cigars, cigarillos or a pipe. It does not include the use of other tobacco and related products such as electronic cigarettes and snuff. The data are collected through a Eurobarometer survey and are based on self-reported use during face-to-face interviews in people’s homes.
3-30-intention: >-
  It is used to monitor progress towards SDG 3 on good health and well-being which is embedded in the European Commission’s 2024-2029 Priorities under 'Supporting people, strenghtening our societes and our social model'.
3-30-methodology: >-
  The indicator can be considered as similar to global SDG indicator 3.a.1 "Age-standardized prevalence of current tobacco use among persons aged 15 years and older".
  Several EU Directives aim to protect citizens from the hazardous effects of smoking, including the Tobacco Products Directive, the Tobacco Advertising Directive and the Tobacco Taxation Directive.
3-30-long_term_objective: >-
  The long-term objective for this indicator is a value of 12
3-42-title: Standardised preventable and treatable mortality
3-42-definition: >-
  Avoidable mortality covers both preventable and treatable causes of mortality. Preventable mortality refers to mortality that can mainly be avoided through effective public health and primary prevention interventions (carried out before the onset of diseases/injuries to reduce incidence). Treatable mortality can mainly be avoided through timely and effective health care interventions, including secondary prevention and treatment (after the onset of diseas.
3-42-intention: >-
  Indicator is used to monitor progress towards SDG 3 on good health and well-being, which are embedded in the European Commission’s 2024-2029 Priorities under 'Supporting people, strenghtening our societes and our social model'. 
  Main prerequisite for meeting these objectives are universal health coverage; access to sexual and reproductive health-care services and to safe, affordable and effective medicines and vaccines for all. Standardised death rates that are used for this indicator take into account that countries with larger shares of older inhabitants also have higher death rates.
3-42-methodology: >-
  The total avoidable mortality rate includes a number of infectious diseases, several types of cancers, endocrine and metabolic diseases, as well as some diseases of the nervous, circulatory, respiratory, digestive and genitourinary systems, some diseases related to pregnancy, childbirth and the perinatal period, a number of congenital malformations, adverse effects of medical and surgical care, a list of injuries and alcohol and drug-related disorders.
  Treatable mortality can mainly be avoided through timely and effective health care interventions, including secondary prevention and treatment (after the onset of diseases to reduce case-fatality). The data are presented as standardised death rates, meaning they are adjusted to a standard age distribution in order to measure death rates independently of different age structures of populationses to reduce case-fatality).
3-42-long_term_objective: >-
  The long-term objective for this indicator is a value of 150.
3-60-title: Self-reported unmet need for medical examination and care by sex
3-60-definition: >-
  This indicator measures the share of the population aged 16 and over reporting unmet needs for medical care due to one of the following reasons: ‘financial reasons’, ‘waiting list’ and ‘too far to travel’. Self-reported unmet needs concern a person’s own assessment of whether they needed medical examination or treatment (dental care excluded) but did not have it or did not seek it.
  Since social norms and expectations may affect responses to questions about unmet care needs, caution is required when comparing differences in the reporting of unmet medical examination across countries. In addition, the different organisation of health care services is another factor to consider when analysing the data. Finally, there are also some variations in the survey questions across countries and across time.
3-60-intention: >-
  Indicator is used to monitor progress towards SDG 3 on good health and well-being and SDG 1 on no poverty as a multi-purpose indicator (MPI); which are embedded in the European Commission’s 2024-2029 Priorities under 'Supporting people, strenghtening our societes and our social model'.
3-60-methodology: >-
  Indicator is included as a main indicator in the Social Scoreboard for the European Pillar of Social Rights.
  Universal health coverage is an objective of the EU Charter of Fundamental Rights. One of the three priorities of the EU’s health policy is increasing accessibility to healthcare. In addition, one of the 20 principles of the European Pillar of Social Rights is that everyone has the right to timely access to affordable, preventive and curative health care of good quality.
3-70-title: Consumption of antibiotics in the community and hospital sectors – defined daily doses (DDD) per day
3-70-definition: >-
  This indicator measures the total antimicrobial consumption (AMC) in the community and hospital sectors. AMC is expressed as the number of defined daily doses (DDD) per 1 000 inhabitants per day. The data refer to the Anatomical Therapeutic Chemical (ATC) classification code J01 ‘Antibacterials for systemic use’. The data for the EU aggregate are presented as population-weighted mean and include imputations and adjustments.
3-70-intention: >-
  Indicator  is used to monitor progress towards SDG 3 on good health and well-being, which are embedded in the European Commission’s 2024-2029 Priorities under 'Supporting people, strenghtening our societes and our social model'.
3-70-methodology: >-
  Main prerequisite for meeting these objectives are universal health coverage; access to sexual and reproductive health-care services and to safe, affordable and effective medicines and vaccines for all. Standardised death rates that are used for this indicator take into account that countries with larger shares of older inhabitants also have higher death rates.
  The indicator is similar to the global SDG indicator 3.d.2 "Percentage of bloodstream infections due to selected antimicrobial-resistant organisms".
3-70-long_term_objective: >-
 Reduce the total consumption of antibiotics in humans by 20% by 2030 compared with 2019.
4-10-title: Early leavers from education and training by sex
4-10-definition: >-
  The indicator measures the share of the population aged 18 to 24 with at most lower secondary education who were not involved in any (formal or non-formal) education or training during the four weeks preceding the survey.
4-10-intention: >-
  Indicator is used to monitor progress towards SDG 4 on quality education and SDG 5 on gender equality, which are embedded in the European Commission’s Priorities under "Supporting people, strengthening our societies and our social model" and "A new plan for Europe's sustainable prosperity and competitiveness".
  The Council of the European Union on 26 February 2021 adopted the Resolution on a strategic framework for European cooperation in education and training towards the European Education Area and beyond (2021–2030), a framework that addresses five strategic priorities: (1) Improving quality, equity, inclusion and success for all in education and training; (2) Making lifelong learning and mobility a reality for all; (3) Enhancing competences and motivation in the education profession; (4) Reinforcing European higher education; and (5) Supporting green and digital transitions in and through education and training.
4-10-methodology: >-
  The Council Resolution sets the EU-level target for the share of early leavers from education and training as measured by this SDG indicator to be less than 9% by 2030. Furthermore, the indicator is included as main indicator in the Social Scoreboard for the European Pillar of Social Rights.
  Education and training are key drivers for growth and jobs as they help to improve employability, productivity, innovation and competitiveness. Continuing education after the basic level is important because people with higher qualifications are more likely to be employed and less likely to face poverty in a knowledge-based economy. People with a low level of education may not only face greater difficulties in the labour market but also have a higher risk of poverty and social exclusion.
4-10-long_term_objective: >-
  The long-term objective for this indicator is a value of 4
4-20-title: Tertiary educational attainment by sex
4-20-definition: >-
  The indicator measures the share of the population aged 25-34 who have successfully completed tertiary studies (e.g. at university or a higher technical institution). Tertiary educational attainment refers to ISCED (International Standard Classification of Education) 2011 levels 5–8 for data from 2014 onwards and to ISCED 1997 levels 5–6 for data up to 2013. The indicator is based on the EU Labour Force Survey (EU-LFS).
4-20-intention: >-
  Indicator is used to monitor progress towards SDG 4 on quality education and SDG 5 on gender equality, which are embedded in the European Commission’s Priorities under ‘Supporting people, strengthening our societies and our social model’ and ‘A new plan for Europe's sustainable prosperity and competitiveness’.
  The Council of the European Union on 26 February 2021 adopted the Resolution on a strategic framework for European cooperation in education and training towards the European Education Area and beyond (2021–2030), a framework that addresses five strategic priorities: (1) Improving quality, equity, inclusion and success for all in education and training; (2) Making lifelong learning and mobility a reality for all; (3) Enhancing competences and motivation in the education profession; (4) Reinforcing European higher education; and (5) Supporting green and digital transitions in and through education and training.
4-20-methodology: >-
  ducation and training are key drivers for growth and jobs as they help to improve employability, productivity, innovation and competitiveness. Continuing education after the basic level is important because people with higher qualifications are more likely to be employed and less likely to face poverty in a knowledge-based economy. People with a low level of education may not only face greater difficulties in the labour market but also have a higher risk of poverty and social exclusion.
  The indicator is included in the Social Scoreboard for the European Pillar of Social Rights.
4-20-long_term_objective: >-
  The long-term objective for this indicator is a value of 52.
4-31-title: Participation in early childhood education by sex (children aged 3 and over)
4-31-definition: >-
  The indicator measures the share of children between the age of three and the starting age of compulsory primary education who participated in early childhood education and care (ECEC) which can be classified as ISCED level 0 according to the International Standard Classification for Education (ISCED 2011). In order for ECEC programmes to be classified as ISCED level 0, they must be intentionally designed to support a child’s cognitive, physical and socio-emotional development. The starting age of compulsory primary education varies across countries. The participation of children in programmes which are not intentionally designed to support child development (such as childcare-only programmes) is not included in this indicator.
4-31-intention: >-
  Indicator s used to monitor progress towards SDG 4 on quality education, which is embedded in the European Commission’s Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’, ‘Supporting people, strengthening our societies and our social model’ and ‘Protecting our democracy, upholding our values’.
  The Council of the European Union on 26 February 2021 adopted the Resolution on a strategic framework for European cooperation in education and training towards the European Education Area and beyond (2021–2030), a framework that addresses five strategic priorities: (1) Improving quality, equity, inclusion and success for all in education and training; (2) Making lifelong learning and mobility a reality for all; (3) Enhancing competences and motivation in the education profession; (4) Reinforcing European higher education; and (5) Supporting green and digital transitions in and through education and training.
4-31-methodology: >-
  As early childhood education and care are increasingly recognised as an integral part of the education and training system, the Council Resolution sets the EU target for participation in early childhood education and care to be at least 96% of children between three years old and the starting age for compulsory primary education by 2030.
4-31-long_term_objective: >-
  The long-term objective for this indicator is a value of 100.
4-40-title: Low achieving 15-year-olds in reading, mathematics or science
4-40-definition: >-
  The indicator measures the share of 15-year-old students failing to reach level 2 (‘basic skills level’) on the PISA scale for the three core school subjects of reading, mathematics and science. The data stem from the Programme for International Student Assessment (PISA), a regularly conducted international survey which aims to evaluate education systems by testing the skills and knowledge of 15-year-old students.
4-40-intention: >-
  Indicator is used to monitor progress towards SDG 4 on quality education, which is embedded in the European Commission’s Priorities under 'A new plan for Europe's sustainable prosperity and competitiveness’, ‘Supporting people, strengthening our societies and our social model’ and ‘Protecting our democracy, upholding our values’.
  The Council of the European Union on 26 February 2021 adopted the Resolution on a strategic framework for European cooperation in education and training towards the European Education Area and beyond (2021–2030), a framework that addresses five strategic priorities: (1) Improving quality, equity, inclusion and success for all in education and training; (2) Making lifelong learning and mobility a reality for all; (3) Enhancing competences and motivation in the education profession; (4) Reinforcing European higher education; and (5) Supporting green and digital transitions in and through education and training.
4-40-methodology: >-
  The Council Resolution sets the EU target for the share of low-achieving 15-year-olds in reading, mathematics and science as measured by this SDG indicator to be less than 15% by 2030.
4-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 525.6.
4-60-title: Adult participation in learning by sex
4-60-definition: >-
  The indicator measures the share of people aged 25 to 64 who stated that they received formal or non-formal education and training in the four weeks preceding the survey (numerator). The denominator consists of the total population of the same age group, excluding those who did not answer the question 'participation in education and training'. Adult learning covers job-related and non-job-related formal and non-formal learning activities. It usually refers to learning activities after the end of initial education.
4-60-intention: >-
  Indicator is used to monitor progress towards SDG 4 on quality education, which is embedded in the European Commission’s Priorities under ‘Supporting people, strengthening our societies and our social model’ and ‘A new plan for Europe's sustainable prosperity and competitiveness’.
  The Council of the European Union on 26 February 2021 adopted the Resolution on a strategic framework for European cooperation in education and training towards the European Education Area and beyond (2021–2030), a framework that addresses five strategic priorities: (1) Improving quality, equity, inclusion and success for all in education and training; (2) Making lifelong learning and mobility a reality for all; (3) Enhancing competences and motivation in the education profession; (4) Reinforcing European higher education; and (5) Supporting green and digital transitions in and through education and training.
4-60-methodology: >-
  Adult learning covers the longest period in a person’s learning lifetime. It includes improving and developing skills, adapting to technological developments, advancing a person’s career or aiding their return to the labour market (upskilling and reskilling). Moreover, it is crucial for maintaining good health, remaining active in the community and being fully included in all aspects of society.
  The indicator is included in the Social Scoreboard for the European Pillar of Social Rights.
4-60-long_term_objective: >-
  The long-term objective for this indicator is a value of 28.
4-70-title: Share of individuals having at least basic digital skills, by sex
4-70-definition: >-
  This indicator measures the share of people aged 16 to 74 who have at least basic digital skills. It is a composite indicator based on selected activities performed by individuals on the internet in specific areas: information and data literacy, communication and collaboration, digital content creation, safety and problem solving. The indicator assesses digital skills classified into six levels, of which the two highest constitute the basic or above basic level of digital skills. The indicator is based on data from the EU survey on the use of ICT in households and by individuals.
4-70-intention: >-
  Indicator is used to monitor progress towards SDG 4 on ensuring inclusive and quality education for all which is embedded in the European Commission's Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’, ‘Supporting people, strengthening our societies and our social model’ and ‘Protecting our democracy, upholding our values’.
4-70-methodology: >-
  SDG 4 seeks to ensure people have access to equitable and quality education through all stages of life, as well as to increase the number of young people and adults who have the relevant skills for employment, decent jobs and entrepreneurship. The goal also envisages the elimination of gender and income disparities in access to education.
  Digital skills are of critical value for working, learning and social interaction.
4-70-long_term_objective: >-
  The European Pillar of Social Rights Action Plan and the 2030 Digital Compass: the European way to the Digital Decade set a target for the EU to raise the share of people aged 16 to 74 who have at least basic digital skills to 80 % in 2030.
5-11-title: Physical and sexual violence to women by age group (2012 data)
5-11-definition: >-
  The indicator measures the share of women from the age of 15 who answered "yes" when they were asked whether they have experienced physical and/or sexual violence by a partner or non-partner in the 12 months prior to the interview.
5-11-intention: >-
  Data coverage 2012 - 2012
5-11-methodology: >-
  No description
5-11-long_term_objective: >-
  No description
5-20-title: Gender pay gap in unadjusted form
5-20-definition: >-
  The indicator measures the difference between average gross hourly earnings of male paid employees and of female paid employees as a percentage of average gross hourly earnings of male paid employees. The indicator has been defined as unadjusted, because it gives an overall picture of gender inequalities in terms of pay and measures a concept which is broader than the concept of equal pay for equal work. All employees working in firms with ten or more employees, without restrictions for age and hours worked, are included. The gender pay gap is based on the methodology of the structure of earnings survey (SES), which is carried out every four years.
5-20-intention: >-
  Indicator is used to monitor progress towards SDG 5 on gender equality, which is embedded in the European Commission’s Priorities under 'Supporting people, strenghtening our societes and our social model'.
  Indicator can be considered as similar to global SDG indicator 8.5.1 "Average hourly earnings of female and male employees, by occupation, age and persons with disabilities". It is included as a secondary indicator in the Social Scoreboard for the European Pillar of Social Rights.
5-20-methodology: >-
  The EU Gender Equality Strategy commits to achieving a Union of Equality and presents policy objectives and actions to make significant progress by 2025 towards a gender-equal Europe, where women and men, girls and boys, are free to pursue their chosen path in life and have equal opportunities to thrive. The key objectives are ending gender-based violence; challenging gender stereotypes; closing gender gaps in the labour market; achieving equal participation across different sectors of the economy; addressing the gender pay and pension gaps; closing the gender care gap and achieving gender balance in decision-making and in politics.
  Equal pay for equal work is one of the European Union’s founding principles, embedded in the Treaties since 1957. Article 157 of the Treaty on the Functioning of the European Union provides that each Member State shall ensure that the principle is applied. Directive 2006/54/EC enshrines the principle of equal pay. Closing the gender pay gap is also one of the objectives of the Commission's Strategic engagement for gender equality as well as the European Pillar of Social Rights.
5-20-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
5-30-title: Gender employment gap, by type of employment
5-30-definition: >-
  The indicator measures the difference between the employment rates of men and women aged 20 to 64. The employment rate is calculated by dividing the number of persons aged 20 to 64 in employment by the total population of the same age group. 
  The indicator shows activity and employment status for four groups of persons: employed persons working full time, employed persons working part time, employed persons with temporary contract and underemployed persons working part time.
5-30-intention: >-
  Is used to monitor progress towards SDG 5 on gender equality, which is embedded in the European Commission’s Priorities under 'Supporting people, strenghtening our societes and our social model'.
  The indicator is included as a headline indicator in the Social Scoreboard for the European Pillar of Social Rights.
5-30-methodology: >-
  Increasing female labour market participation and the equal economic independence of women and men is one of the priorities of the EU Gender Equality Strategy, which commits to achieving a Union of Equality. The EU Gender Equality Strategy presents policy objectives and actions to make significant progress by 2025 towards a gender-equal Europe, where women and men, girls and boys, are free to pursue their chosen path in life and have equal opportunities to thrive. The key objectives are ending gender-based violence; challenging gender stereotypes; closing gender gaps in the labour market; achieving equal participation across different sectors of the economy; addressing the gender pay and pension gaps; closing the gender care gap and achieving gender balance in decision-making and in politics.
5-30-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
5-40-title: Persons outside the labour force due to caring responsibilities by sex
5-40-definition: >-
  The population outside the labour force comprises individuals who are not employed and are either not actively seeking work or not available to work (even if they have found a job that will start in the future). Therefore, they are neither employed nor unemployed. 
  This definition used in the EU Labour Force Survey (EU-LFS) is based on the resolutions of the International Conference of Labour Statisticians (ICLS) organised by the International Labour Organization (ILO). The reason for being outside the labour force covered by this indicator includes ‘care of adults with disabilities or children’. Only people who express willingness to work, despite being outside the labour force, are considered.
5-40-intention: >-
  Indicator is used to monitor progress towards SDG 5 on gender equality and SDG 8 on decent work and economic growth, which are embedded in the European Commission’s Priorities under the 'Supporting people, strenghtening our societes and our social model'.
  The European Pillar of Social Rights, jointly proclaimed by the European Commission, the European Parliament and the European Council in 2017, sets out 20 key principles and rights essential for fair and well-functioning labour markets and social protection systems.
5-40-methodology: >-
  The EU Gender Equality Strategy commits to achieving a Union of Equality and presents policy objectives and actions to make significant progress by 2025 towards a gender-equal Europe, where women and men, girls and boys, are free to pursue their chosen path in life and have equal opportunities to thrive. The key objectives are ending gender-based violence; challenging gender stereotypes; closing gender gaps in the labour market; achieving equal participation across different sectors of the economy; addressing the gender pay and pension gaps; closing the gender care gap and achieving gender balance in decision-making and in politics.
5-40-long_term_objective: >-
  No description
5-50-title: Seats held by women in national parliaments and governments
5-50-definition: >-
  The indicator measures the proportion of women in national parliaments and national governments.
  The national parliament is the national legislative assembly and the indicator refers to both chambers (lower house and an upper house, where relevant). The count of members of a parliament includes the president/speaker/leader of the parliament.
5-50-intention: >-
  Indicator is used to monitor progress towards SDG 5 on gender equality and SDG 8 on decent work and economic growth, which are embedded in the European Commission’s Priorities under the 'Supporting people, strenghtening our societes and our social model'.
  Indicator can be considered as similar to global SDG indicator 5.5.1 "Proportion of seats held by women in national parliaments and local governments".
5-50-methodology: >-
  The EU Gender Equality Strategy commits to achieving a Union of Equality and presents policy objectives and actions to make significant progress by 2025 towards a gender-equal Europe, where women and men, girls and boys, are free to pursue their chosen path in life and have equal opportunities to thrive. The key objectives are ending gender-based violence; challenging gender stereotypes; closing gender gaps in the labour market; achieving equal participation across different sectors of the economy; addressing the gender pay and pension gaps; closing the gender care gap and achieving gender balance in decision-making and in politics.
5-50-long_term_objective: >-
  The long-term objective for this indicator is a value of 50.
5-61-title: Positions held by women in senior management positions
5-61-definition: >-
  The indicator measures the share of female board members and executives in the largest publicly listed companies.
5-61-intention: >-
  Data coverage 2003 – 2023. Publicly listed means that the shares of the company are traded on the stock exchange. The ‘largest’ companies are taken to be the members (max. 50) of the primary blue-chip index, which is an index maintained by the stock exchange and covers the largest companies by market capitalisation and/or market trades. Only companies which are registered in the country concerned are counted. Board members cover all members of the highest decision-making body in each company (i.e. chairperson, non-executive directors, senior executives and employee representatives, where present). Executives refer to senior executives in the two highest decision-making bodies of the largest (max. 50) nationally registered companies listed on the national stock exchange.
5-61-methodology: >-
  The EU Gender Equality Strategy commits to achieving a Union of Equality and presents policy objectives and actions to make significant progress by 2025 towards a gender-equal Europe, where women and men, girls and boys, are free to pursue their chosen path in life and have equal opportunities to thrive.
5-61-long_term_objective: >-
  The long-term objective for this indicator is a value of 50.
6-20-title: Population connected to at least secondary wastewater treatment
6-20-definition: >-
  The indicator measures the percentage of population connected to wastewater treatment systems with at least secondary treatment. Thereby, waste water from urban or other sources is treated by a process generally involving biological treatment with a secondary settlement or other process that removes organic material and reduces its biochemical oxygen demand (BOD) by at least 70 % and chemical oxygen demand (COD) by at least 75 %
6-20-intention: >-
  Indicator is  used to monitor progress towards SDG 6 on clean water and sanitation, which is embedded in the European Commission’s 2024-2029 priorities under 'Sustaining our quality of life: Food security, water and nature'.
  The indicator can be considered similar to global SDG indicator 6.3.1 "Proportion of wastewater safely treated".
6-20-methodology: >-
  Protection of water resources, water ecosystems and of drinking and bathing water is at the cornerstone of EU environmental policy, as confirmed in the proposed 8th Environment Action Programme. EU water policy provides a framework to comprehensively address water protection and for achieving good status for inland surface waters, transitional waters, coastal waters and groundwater. The EU health and food safety policy also contributes to high standards on water and sanitation in terms of preventing the spread of communicable diseases. The Urban Waste-Water Treatment Directive regulates the collection, treatment and discharge of domestic as well as industrial urban wastewaters.
6-20-long_term_objective: >-
  The long-term objective for this indicator is a value of 100.
6-30-title: Proportion of bodies of water with good ambient water quality - proxy indicator
6-30-definition: >-
  The indicator is defined as the proportion of water bodies in the country that have good ambient water quality. Ambient water quality refers to natural, untreated water in rivers, lakes and groundwaters and represents a combination of natural influences together with the impacts of all anthropogenic activities. The indicator relies on water quality data derived from in situ measurements and the analysis of samples collected from surface and groundwaters. Water quality is assessed by means of core physical and chemical parameters that reflect natural water quality related to climatological and geological factors, together with major impacts on water quality.
6-30-intention: >-
  Text in progress
6-30-methodology: >-
  Text in progress
6-30-long_term_objective: >-
  By 2030, improve water quality by reducing pollution, eliminating dumping and minimizing release of hazardous chemicals and materials, halving the proportion of untreated wastewater and substantially increasing recycling and safe reuse globally.
6-40-title: Nitrate in groundwater
6-40-definition: >-
  This indicator shows concentrations of nitrate (NO3) in groundwater bodies measured as milligrams per litre (mg NO3/L). The indicator can be used to illustrate geographical variations in current concentrations and temporal trends. Large inputs of nitrogen to water bodies from urban areas, industry, and agricultural areas, can have negative impacts on the use of water for human consumption and other purposes.
6-40-intention: >-
  Indicator is used to monitor progress towards SDG 6 on clean water and sanitation, which is embedded in the European Commission’s 2024-2029 priorities under 'Sustaining our quality of life: Food security, water and nature'.
  Protection of water resources, water ecosystems and of drinking and bathing water is at the cornerstone of EU environmental policy. EU water policy provides a framework to comprehensively address water protection and for achieving good status for inland surface waters, transitional waters, coastal waters and groundwater. According to the Drinking Water Directive, a maximum concentration of 50 mg/L of nitrate in groundwater that is used for drinking water is allowed. The Nitrates Directive requires the designation of vulnerable zones based on this threshold for all waters including groundwater.
6-40-methodology: >-
  The Water Framework Directive is the main European legislation aiming to prevent water pollution. The EU Biodiversity Strategy for 2030 supports the implementation of the Water Framework Directive’s objective by requiring Member States to restore freshwater ecosystems.
  The 8th Environment Action Programme sets the environmental policy agenda for the years from 2021 to 2030 and explicitly mentions water-related issues in two of its six priority objectives. These two objectives are: (1) pursuing a zero-pollution ambition for a toxic free-environment, including for air, water and soil and protecting the health and well-being of citizens from environment-related risks and impacts; and (2) protecting, preserving and restoring biodiversity and enhancing natural capital, notably air, water, soil, and forest, freshwater, wetland and marine ecosystems.
6-40-long_term_objective: >-
  The long-term objective is reducing nitrate levels to below the established State Maximum Contaminant Level (MCL) of 10 mg/L (as N, Nitrogen) or 45 mg/L (as NO3−).
6-50-title: Phosphate in rivers
6-50-definition: >-
  This indicator measures the concentration of phosphate (PO4) per litre in the dissolved phase from water samples from river stations and aggregated to annual average values. At high concentrations phosphate can cause water quality problems, such as eutrophication, by triggering the growth of aquatic plants including algae. The indicator can be used to illustrate geographical variations in current nutrient concentrations and temporal trends.
6-50-intention: >-
  is used to monitor progress towards SDG 6 on clean water and sanitation, which is embedded in the European Commission’s 2024-2029 priorities under 'Sustaining our quality of life: Food security, water and nature'.
  The indicator can be considered as part of the global SDG indicator 6.3.2 "Proportion of bodies of water with good ambient water quality".
  Protection of water resources, water ecosystems and of drinking and bathing water is at the cornerstone of EU environmental policy. EU water policy provides a framework to comprehensively address water protection and for achieving good status for inland surface waters, transitional waters, coastal waters and groundwater. The Water Framework Directive is the main European legislation aiming to prevent water pollution. The EU Biodiversity Strategy for 2030 supports the implementation of the Water Framework Directive’s objective by requiring Member States to restore freshwater ecosystems.
6-50-methodology: >-
  The 8th Environment Action Programme sets the environmental policy agenda for the years from 2021 to 2030 and explicitly mentions water-related issues in two of its six priority objectives. These two objectives are: (1) pursuing a zero-pollution ambition for a toxic free-environment, including for air, water and soil and protecting the health and well-being of citizens from environment-related risks and impacts; and (2) protecting, preserving and restoring biodiversity and enhancing natural capital, notably air, water, soil, and forest, freshwater, wetland and marine ecosystems.
6-50-long_term_objective: >-
  No description
6-60-title: Water exploitation index, plus (WEI+)
6-60-definition: >-
  The water exploitation index (WEI+) provides a measure of total water consumption as a percentage of the renewable freshwater resources available for a given territory and period. It quantifies how much water is abstracted and how much water is returned to the environment by economic sectors before or after use. The difference between water abstractions and water returns is regarded as ‘water consumption’. In the absence of Europe-wide agreed formal targets, values above 20 % are generally considered to be a sign of water scarcity, while values equal or greater than 40 % indicate situations of severe water scarcity, meaning the use of freshwater resources is unsustainable.
6-60-intention: >-
  Indicator is used to monitor progress towards SDG 6 on clean water and sanitation; which is embedded in the European Commission’s 2024-2029 Priorities under 'Sustaining our quality of life: food security, water and nature'. 
  The indicator is produced by the EEA based on data from the WISE SoE-Water quantity database (WISE 3) and other open sources (Eurostat, OECD) and including gap filling methods.
  Indicator can be considered as global SDG indicator 6.4.2 "Level of water stress: freshwater withdrawal as a proportion of available freshwater resources".
  The Water Framework Directive is the main European legislation aiming to - among others - to promote sustainable water use based on a long-term protection of available water resources. The EU Biodiversity Strategy for 2030 supports the implementation of the Water Framework Directive’s objective by requiring Member States to restore freshwater ecosystems.
6-60-methodology: >-
  The 8th Environment Action Programme sets the environmental policy agenda for the years from 2021 to 2030 and explicitly mentions water-related issues in two of its six priority objectives. These two objectives are: (1) pursuing a zero-pollution ambition for a toxic free-environment, including for air, water and soil and protecting the health and well-being of citizens from environment-related risks and impacts; and (2) protecting, preserving and restoring biodiversity and enhancing natural capital, notably air, water, soil, and forest, freshwater, wetland and marine ecosystems.
6-60-long_term_objective: >-
  The long-term objective for the indicator SDG_06_60 is to ensure availability and sustainable management of water and sanitation for all. This includes achieving universal access to safe and affordable drinking water, sanitation, and hygiene, as well as improving water quality and managing water resources sustainably. The indicator is part of the EU Sustainable Development Goals and is used to monitor progress towards these objectives
6-70-title: Pesticides in rivers (NEW)
6-70-definition: >-
  This indicator measures the share of reported waterbodies with pesticides exceeding thresholds based on Environmental Quality Standards (EQS) for the toxicity of the pesticides measured. Pesticides include both active substances from plant protection products and biocides as well as their relevant metabolites, thereby reflecting the substances actually present in the water and affecting aquatic life. Only substances with a defined EQS are included.
6-70-intention: >-
  This indicator can be considered similar to global SDG indicator 6.3.2 "Proportion of bodies of water with good ambient water quality".
  Protection of water resources, water ecosystems and of drinking and bathing water is at the cornerstone of EU environmental policy. EU water policy provides a framework to comprehensively address water protection and for achieving good status for inland surface waters, transitional waters, coastal waters and groundwater. The Water Framework Directive is the main European legislation aiming to prevent water pollution and the EU Biodiversity Strategy for 2030 supports the implementation of the Water Framework Directive’s objective by requiring Member States to restore freshwater ecosystems.
6-70-methodology: >-
  The 8th Environment Action Programme sets the environmental policy agenda for the years from 2021 to 2030 and explicitly mentions water-related issues in two of its six priority objectives. These two objectives are: (1) pursuing a zero-pollution ambition for a toxic free-environment, including for air, water and soil and protecting the health and well-being of citizens from environment-related risks and impacts; and (2) protecting, preserving and restoring biodiversity and enhancing natural capital, notably air, water, soil, and forest, freshwater, wetland and marine ecosystems.
6-70-long_term_objective: >-
  No description
7-10-title: 'Primary & final energy consumption'
7-10-definition: >-
  The indicator measures the total energy needs of a country excluding all non-energy use of energy carriers (e.g. natural gas used not for combustion but for producing chemicals).
  "Primary Energy Consumption" covers the energy consumption by end users such as industry, transport, households, services and agriculture, plus energy consumption of the energy sector itself for production and transformation of energies, losses occurring during the transformation of energies (e.g. the efficiency of electricity production from combustible fuels) and the transmission and distribution losses of energy.
7-10-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy, which is embedded in the European Commission’s Priorities under the 'Supporting people, strengthening our societies and our social model'.
  The EU is implementing an interconnected set of measures "Fit for 55" to reach the new climate targets for 2030 and has followed a new strategic plan REPowerEU to reduce the EU dependency on energy imports.
7-10-methodology: >-
  The European Green Deal includes energy efficiency as a key measure for reducing cross-sectoral GHG emissions. Energy efficiency and Renewable energy Directives set ambitious EU targets to be reached by 2030.
7-10-long_term_objective: >-
  No description
7-20-title: Final energy consumption in households per capita
7-20-definition: >-
  The indicator measures how much energy every citizen consumes at home excluding energy used for transportation. Since the indicator refers to final energy consumption, only energy used by end consumers is considered. The related consumption of the energy sector itself is excluded.
7-20-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy, which is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
7-20-methodology: >-
  SDG 7 calls for ensuring universal access to modern energy services, improving energy efficiency and increasing the share of renewable energy. To accelerate the transition to an affordable, reliable, and sustainable energy system, countries need to facilitate access to clean energy research, promote investment in energy infrastructure and clean energy technology. Households account for about a quarter of final energy consumption. At home, people use electricity and fuels in particular for heating, cooling, warm water, lighting and appliances
7-20-long_term_objective: >-
  No description
7-30-title: Energy productivity
7-30-definition: >-
  The indicator measures the amount of economic output that is produced per unit of gross available energy. The gross available energy represents the quantity of energy products necessary to satisfy all demand of entities in the geographical area under consideration. The economic output is either given as in the unit of Euros in chain-linked volumes to the reference year 2010 at 2010 exchange rates or in the unit PPS (Purchasing Power Standard).
7-30-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy and SDG 12 on ensuring sustainable consumption and production patterns.
  This indicator can be considered as similar to global SDG indicator 7.3.1 "Energy intensity measured in terms of primary energy and GDP".
  Increasing energy productivity, i.e. decoupling economic growth from energy consumption, is key to reaching SDG 7 without harming economic development.
7-30-methodology: >-
  SDG7 is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
  SDG 7 calls for ensuring universal access to modern energy services, improving energy efficiency and increasing the share of renewable energy. To accelerate the transition to an affordable, reliable, and sustainable energy system, countries need to facilitate access to clean energy research, promote investment in energy infrastructure and clean energy technology. SDG 12 calls for a comprehensive set of actions from businesses, policy-makers, researchers and consumers to adapt to sustainable practices. It envisions sustainable production and consumption based on advanced technological capacity, resource efficiency and reduced global waste.
7-30-long_term_objective: >-
  No description
7-40-title: Share of renewable energy in gross final energy consumption
7-40-definition: >-
  The indicator measures the share of renewable energy consumption in gross final energy consumption according to the Renewable Energy Directive. The gross final energy consumption is the energy used by end-consumers (final energy consumption) plus grid losses and self-consumption of power plants.
7-40-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy and SDG 13 on climate action; which are respectively embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model' and 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as identical to global SDG indicator 7.2.1 "Renewable energy share in the total final energy consumption".
7-40-methodology: >-
  The EU is implementing an interconnected set of measures "Fit for 55" to reach the new climate targets for 2030 and has followed a new strategic plan REPowerEU to reduce the EU dependency on energy imports. The European Green Deal envisages the decarbonisation of Europe’s energy systems in order to reach climate neutrality by 2050. For this purpose, the EU will turn towards a fully integrated, interconnected and digitalised renewable energy system, while at the same time ensuring security of supply at affordable prices. Moreover, EU cohesion policy funds (2021–2027) including the ‘Next Generation EU’ recovery plan provide funding for investments in renewable energies. The revised Renewable energy Directives set an ambitious EU target to be reached by 2030.
7-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 50.
7-50-title: Energy import dependency
7-50-definition: >-
  The indicator shows the share of total energy needs of a country met by imports from other countries. It is calculated as net imports divided by the gross available energy. Energy dependence = (imports – exports) / gross available energy.
7-50-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy, which is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
  To accelerate the transition to an affordable, reliable, and sustainable energy system, countries need to facilitate access to clean energy research, promote investment in energy infrastructure and clean energy technology. Energy dependence on imports of energy carriers exposes the European economy to volatile world market prices and the risk of supply shortages, for example, due to geopolitical conflicts. The risks increase with dependency on single countries e.g. determined by the supply infrastructure.
7-50-methodology: >-
  There are several relevant EU policies for this indicator. The Energy Security Strategy outlines the need to enhance domestic energy production, including the need to increase local renewable energy production, energy efficiency and provide missing infrastructure. Moreover, EU cohesion policy funds (2021–2027) including the ‘Next Generation EU’ recovery plan provide funding for investments in renewable energies. REPowerEU is a new strategic plan on reducing the EU’s dependence on energy imports, particularly from Russia, due to insecurity and high prices following Russia’s invasion of Ukraine. In addition, the revised Energy efficiency and Renewable energy Directives set ambitious EU targets to be reached by 2030.
7-50-long_term_objective: >-
  No description
7-60-title: Population unable to keep home adequately warm
7-60-definition: >-
  The indicator measures the share of population who are unable to afford to keep home adequately warm. Data for this indicator are being collected as part of the European Union Statistics on Income and Living Conditions (EU-SILC) to monitor the development of poverty and social inclusion in the EU. The data collection is based on a survey, which means that indicator values are self-reported.
7-60-intention: >-
  Indicator is used to monitor progress towards SDG 7 on affordable and clean energy, which is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
  To accelerate the transition to an affordable, reliable, and sustainable energy system, countries need to facilitate access to clean energy research, promote investment in energy infrastructure and clean energy technology.
  The European Pillar of Social Rights lists energy among the essential services that everyone should have access to. With EU Energy Poverty Observatory, the EU seeks to help Member States in their efforts to decrease energy poverty and ensure access to affordable energy.
7-60-methodology: >-
  The Action Plan on Affordable Energy proposes measures to stabilise energy prices, ensure supply security, and drive the energy transition. The European Pillar of Social Rights lists energy among the essential services that everyone should have access to. The European Economic and Social Committee (EESC) assesses its state of play. The EU Energy Poverty Advisory Hub is an initiative that provides a central platform of energy poverty expertise for local authorities and other stakeholders.
7-60-long_term_objective: >-
  The long-term objective for this indicator is a value of 0.
8-10-title: Real GDP per capita
8-10-definition: >-
  The indicator is calculated as the ratio of real GDP (GDP adjusted for inflation) to the average population of a specific year, where GDP is expressed in millions and population is expressed in thousands. Real GDP is published without decimals.
8-10-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth, which is embedded in the European Commission’s Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’ and ‘Supporting people, strengthening our societies and our social model’.
  The indicator can be considered as identical to global SDG indicator 8.1.1 "Annual growth rate of real GDP per capita".
8-10-methodology: >-
  GDP measures the value of the total final output of goods and services produced by an economy within a certain period of time. It includes goods and services that have markets (or which could have markets) and products which are produced by general government and non-profit institutions. It is a measure of economic activity and is commonly used as a proxy for the development in a country’s material living standards. However, it is not a complete measure of economic welfare. For example, GDP does not include most unpaid household work. Neither does GDP take account of negative effects of economic activity, like environmental degradation.
8-10-long_term_objective: >-
  The long-term objective for Indicator is to strengthen the capacity of domestic financial institutions to encourage and expand access to banking, insurance, and financial services for all.
8-11-title: Investment share of GDP
8-11-definition: >-
  The indicator is calculated as the ratio of real GDP (GDP adjusted for inflation) to the average population of a specific year, where GDP is expressed in millions and population is expressed in thousands. Real GDP is published without decimals.
8-11-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth, which is embedded in the European Commission’s Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’ and ‘Supporting people, strengthening our societies and our social model’.
  The indicator can be considered as identical to global SDG indicator 8.1.1 "Annual growth rate of real GDP per capita".
8-11-methodology: >-
  GDP measures the value of the total final output of goods and services produced by an economy within a certain period of time. It includes goods and services that have markets (or which could have markets) and products which are produced by general government and non-profit institutions. It is a measure of economic activity and is commonly used as a proxy for the development in a country’s material living standards. However, it is not a complete measure of economic welfare. For example, GDP does not include most unpaid household work. Neither does GDP take account of negative effects of economic activity, like environmental degradation.
8-11-long_term_objective: >-
  The long-term objective for the indicator SDG_08_11 is to measure the investment share of GDP.
8-20-title: Young people neither in employment nor in education and training
8-20-definition: >-
  The indicator measures the share of the population aged 15 to 29 who is not employed and not involved in education or training.
  The numerator of the indicator refers to persons who meet the following two conditions: (a) they are not employed (i.e. unemployed or outside the labour force according to the International Labour Organisation definition) and (b) they have not received any education or training (i.e. neither formal nor non-formal) in the four weeks preceding the Labour Force Survey (LFS).
8-20-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth and SDG 4 on ensuring inclusive and quality education for all, which are embedded in the European Commission’s Priorities under the ‘Supporting people, strengthening our societies and our social model’ and ‘A new plan for Europe's sustainable prosperity and competitiveness’.
  This indicator can be considered as identical with global SDG indicator 8.6.1 "Proportion of youth (aged 15-24 years) not in education, employment or training". Furthermore, it is included as main indicator in the Social Scoreboard for the European Pillar of Social Rights.
8-20-methodology: >-
  The European Pillar of Social Rights, jointly proclaimed by the European Commission, the European Parliament and the European Council in 2017, sets out 20 key principles and rights essential for fair and well-functioning labour markets and social protection systems. The European Pillar of Social Rights Action Plan, adopted in 2021, turns the Principles into concrete actions to benefit citizens. It also proposes an ambitious employment target of 78 % of the population aged 20 to 64 for the EU to reach by 2030. In support of this, the Action Plan proposes to halve the gender employment gap by 2030 compared with 2019 and to decrease the rate of young people neither in employment nor in education or training (NEET) aged 15 to 29 to 9 % by 2030.
8-20-long_term_objective: >-
  The long-term objective for the indicator 0 is to ensure that 8% of the population aged 15 to 29 is neither employed nor involved in education or training.
8-30-title: Employment rate
8-30-definition: >-
  The indicator measures the share of the population aged 20 to 64 which is employed. Employed persons are defined as persons who, during a reference week, worked at least one hour for pay or profit or were not working but had jobs from which they were temporarily absent.
8-30-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth, which is embedded in the European Commission’s Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’and ‘Supporting people, strengthening our societies and our social model’. SDG 8 calls, among other things, for providing opportunities for full and productive employment and decent work for all.
  Employment and other labour market-related issues are at the heart of social and political debate in the EU. Paid employment is crucial for ensuring sufficient living standards and it provides the necessary foundation for people to achieve their personal goals and aspirations. Moreover, employment contributes to economic performance, quality of life and social inclusion, making it a cornerstone of socioeconomic development and well-being.
8-30-methodology: >-
  The European Pillar of Social Rights sets out 20 key principles and rights essential for fair and well-functioning labour markets and social protection systems. The European Pillar of Social Rights Action Plan, adopted in 2021, turns the Principles into concrete actions to benefit citizens. It also proposes an ambitious employment target of 78 % of the population aged 20 to 64 for the EU to reach by 2030. In support of this, the Action Plan proposes to halve the gender employment gap by 2030 compared with 2019 and to decrease the rate of young people neither in employment nor in education or training (NEET) aged 15 to 29 to 9 % by 2030.
8-30-long_term_objective: >-
  Increase the employment rate of the population aged 20 to 64 to at least 78% by 2030 (European Pillar of Social Rights Action Plan)
8-40-title: Long - term unemployment rate
8-40-definition: >-
  The indicator measures the share of the population in the labour force aged 15 to 74 who has been unemployed for 12 months or more. Population in the labour force are those who are either employed or unemployed. Unemployed persons are defined as persons aged 15-74 who were without work during the reference week, were currently available to start working within the next two weeks and were either actively seeking work in the last four weeks or had already found a job to start within the next three months. The unemployment period is defined as the duration of a job search, or as the length of time since the last job was held (if shorter than the time spent on a job search).
8-40-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth, which is embedded in the European Commission’s Priorities under ‘A new plan for Europe's sustainable prosperity and competitiveness’ and ‘Supporting people, strengthening our societies and our social model’.
  The indicator is also included in the Social Scoreboard for the European Pillar of Social Rights.
  The European pillar of social rights sets out a number of key principles and rights to support fair and well-functioning labour markets and welfare systems. It serves as a compass for a renewed process of convergence towards better working and living conditions among participating member states. It is primarily conceived for the euro area, but is applicable to all member states wishing to participate. The Active Inclusion Approach is a Commission recommendation to enable every citizen, notably the most disadvantaged, to fully participate in society, including having a job.
8-40-methodology: >-
  The European Pillar of Social Rights sets out 20 key principles and rights essential for fair and well-functioning labour markets and social protection systems. The European Pillar of Social Rights Action Plan, adopted in 2021, turns the Principles into concrete actions to benefit citizens. It also proposes an ambitious employment target of 78 % of the population aged 20 to 64 for the EU to reach by 2030. In support of this, the Action Plan proposes to halve the gender employment gap by 2030 compared with 2019 and to decrease the rate of young people neither in employment nor in education or training (NEET) aged 15 to 29 to 9 % by 2030.
8-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 3
8-60-title: Fatal accidents at work per 100 000 workers
8-60-definition: >-
  The indicator measures the number of fatal accidents that occur during the course of work and lead to the death of the victim within one year of the accident. The incidence rate refers to the number of fatal accidents per 100 000 persons in employment.
8-60-intention: >-
  Indicator is used to monitor progress towards SDG 8 on decent work and economic growth and SDG 3 on good health and well-being.
  The indicator can be considered as similar to global SDG indicator 8.8.1 "Fatal and non-fatal occupational injuries per 100,000 workers, by sex and migrant status".
8-60-methodology: >-
  The national 'European Statistics on Accidents at Work (ESAW)' sources are the employers' declarations of accidents at work, either to the relevant insurance companies, the national social security system, labour inspections or similar national authorities.
  The Directive on transparent and predictable working conditions in the European Union sets minimum standards on working conditions. The EU strategic framework on health and safety at work 2021–2027 sets out key priorities for improving workers’ health and safety.
8-60-long_term_objective: >-
  The long-term objective for this indicator is a value of 0
9-10-title: 'Gross domestic expenditure on R&D'
9-10-definition: >-
  The indicator measures gross domestic expenditure on R&D (GERD) as a percentage of the gross domestic product (GDP) — also called R&D intensity. The OECD’s Frascati Manual: Guidelines for Collecting and Reporting Data on Research and Experimental Development defines research and experimental development (R&D) as creative and systematic work undertaken in order to increase the stock of knowledge — including knowledge of humankind, culture and society — and to devise new applications of available knowledge.
9-10-intention: >-
  Indicator is used to monitor progress towards SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation which is embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security'.
  The indicator can be considered as identical to the global SDG indicator 9.5.1 "Research and development expenditure as a proportion of GDP".
9-10-methodology: >-
  A new vision for the European Research Area (ERA) aims to build a common scientific and technology area for the EU, by prioritising investments and reforms, improving access to excellence, translating research and innovation results into the economy and deepening the ERA. The EU has a long-standing objective of increasing its R&D intensity to 3 % of GDP, which was reaffirmed in a Council Recommendation on a Pact for Research and Innovation in Europe from November 2021.
9-10-long_term_objective: >-
  The long-term objective for this indicator is a value of 3.3.
9-30-title: 'R&D personnel'
9-30-definition: >-
  The indicator measures the share of R&D personnel in the following institutional sectors: business enterprise (BES), government (GOV), higher education (HES) and private non-profit (PNP). Data are presented in full-time equivalents as a share of the labour force.
9-30-intention: >-
  Indicator is used to monitor progress towards SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation which is embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security'.
  The indicator can be considered as similar to global SDG indicator 9.5.2 "Researchers (in full-time equivalent) per million inhabitants"
9-30-methodology: >-
  R&D and innovation are major drivers of competitiveness and employment in a knowledge-based economy. Greater investment in R&D provides new jobs in business and academia, increasing demand for scientists and researchers in the labour market.
9-30-long_term_objective: >-
  The long-term objective for this indicator is a value of 2.
9-40-title: Patent applications to the European Patent Office
9-40-definition: >-
  This indicator measures requests for the protection of an invention filed with the European Patent Office (EPO) regardless of whether they are granted or not. Applications are allocated according to the country of residence of the first applicant listed on the application form (first-named applicant principle) as well as according to the country of residence of the inventor.
  The data show the total number of applications per country and per million inhabitants (using the average population of the reference year as denominator).
9-40-intention: >-
  Indicator is used to monitor progress towards SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation which is embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security'.
  Requests for protection of an invention directed either directly to the European Patent Office (EPO) or filed under the Patent Cooperation Treaty and designating the EPO (Euro-PCT), regardless of whether they are granted or not. The patent applications are alloted according to the country of residence of the applicant listed on the application form. In cases where several applicants are mentioned on the application form, the country of residence of the first applicant listed applies. The country of residence of the (first) applicant is not necessarily the same as the county of residence of the inventor(s).
9-40-methodology: >-
  Patents reflect a country's inventive activity. Patents also show the capacity of countries and their businesses to exploit knowledge and research results, and translate it into potential economic gains. In this context, indicators based on patent statistics provide a valuable measure of the inventive performance of countries.
9-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 240.
9-50-title: Share of busses and trains in inland passenger transport
9-50-definition: >-
  This indicator measures the share of buses, including coaches and trolley-buses, and trains in inland passenger transport, expressed in passenger-kilometres (pkm). Passenger transport here includes transport by passenger cars, buses and coaches, and trains, but excludes inland waterways, air and sea transport. All data are based on movements within national territories, regardless of the vehicle’s nationality. Road data stem from a voluntary collection and are not fully harmonised at the EU level. Tram and metro systems are not included because the data collection methodology for these means of transport is not sufficiently harmonised between Member States.
9-50-intention: >-
  Indicator s used to monitor progress towards SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation and towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable, which are embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: Food security, water and nature' and 'Protecting our democracy, upholding our values'.
  The indicator can be considered as similar to the global SDG indicator 9.1.2 "Passenger and freight volumes, by mode of transport".
9-50-methodology: >-
  Rethinking future mobility includes optimising the use of all modes of transport, car sharing and multimodal integration between the different modes of collective transport such as train, tram, metro, bus and taxi.
  In 2020 the Commission adopted the ‘Sustainable and Smart Mobility Strategy’ together with an Action Plan of 82 initiatives. This strategy lays the foundation for how the EU transport system can achieve its green and digital transformation and become more resilient to future crises. As outlined in the European Green Deal, the aim will be a 90% cut in emissions by 2050, delivered by a smart, competitive, safe, accessible and affordable transport system.
9-50-long_term_objective: >-
  No description
9-60-title: Share of rail and inland waterways activity in inland freight transport
9-60-definition: >-
  This indicator measures the share of rail and inland waterways in inland freight transport, expressed in tonne-kilometres (tkm).
  Inland freight transport includes road, rail and inland waterways. All data are based on movements on national territory; rail and inland waterways transport are collected based on movements on national territory, regardless of the nationality of the train or vessel.
  Road transport activity is collected according to the country of registration of the vehicle, regardless of the territory where the activity is performed. The activity is redistributed to the territory where the activity is actually performed by modelling the likely journey itinerary on the European road network. Neither sea nor air freight transport are currently included.
9-60-intention: >-
  Indicator is used to monitor progress towards SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation which is embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security'.
  Indicator can be considered as similar to the global SDG indicator 9.1.2 "Passenger and freight volumes, by mode of transport".
9-60-methodology: >-
  While the free movement of goods is an essential component of the EU internal market and important for maintaining the competitiveness of European industry and services, transport should be organised in an environment-friendly way.
  This strategy lays the foundation for how the EU transport system can achieve its green and digital transformation and become more resilient to future crises. As outlined in the European Green Deal, the aim will be a 90% cut in emissions by 2050, delivered by a smart, competitive, safe, accessible and affordable transport system.
9-60-long_term_objective: >-
  No description
9-70-title: Air emission intensity of industry
9-70-definition: >-
  This indicator measures the emissions intensity of particulate matter (PM10 and PM2.5) from the manufacturing sector (NACE Rev. 2 sector ‘C’). Air emissions are defined as flows of gaseous and particulate materials emitted into the atmosphere. 
  Fine and coarse particulates (PM10) are less than 10 micrometres in diameter and can be carried deep into the lungs, where they can cause inflammation and exacerbate the condition of people suffering from heart and lung diseases. Fine particulates (PM2.5) are less than 2.5 micrometres in diameter and are therefore a subset of the PM10 particles. Their negative health impacts are more serious than PM10 because they can be drawn further into the lungs and may be more toxic. 
  Emission intensity is calculated by dividing the sector’s PM emissions by its gross value added (GVA), which is defined as output (at basic prices) minus intermediate consumption (at purchaser prices).
9-70-intention: >-
  Indicator is used to monitor progress towards SDG 9 on industry, innovation and infrastructure, which is embedded in the European Commission’s 2024-2029 Priorities under 'A new era for European defence and security'.
9-70-methodology: >-
  SDG 9 recognises the importance of technological progress and innovation for finding lasting solutions to social, economic and environmental challenges such as the creation of new jobs and promotion of resource and energy efficiency. To foster innovation and entrepreneurship, SDG 9 also seeks to increase access to financial services for small-scale enterprises and to bridge the digital divide by increasing access to information and communication technologies.
  With its Clean Industrial Deal from February 2025, the European Commission outline concrete actions to turn decarbonisation into a driver of growth for European industries. This includes lowering energy prices, creating quality jobs and the right conditions for companies to thrive.
9-70-long_term_objective: >-
  The long-term objective for the indicator is to measure the progress towards the goal of ensuring healthy lives and promoting well-being for all at all ages.
10-10-title: Purchasing power adjusted GDP per capita
10-10-definition: >-
  Gross domestic product (GDP) is a measure for the economic activity. It refers to the value of the total output of goods and services produced by an economy, less intermediate consumption, plus net taxes on products and imports. GDP per capita is calculated as the ratio of GDP to the average population in a specific year. Basic figures are expressed in purchasing power standards (PPS), which represents a common currency that eliminates the differences in price levels between countries to allow meaningful volume comparisons of GDP.
10-10-intention: >-
  Indicator is used to monitor progress towards SDG 10 on reducing inequality within and among countries; which is embedded in the Europen Comission's Priorities under 'Supporting people, strenghtening our societes and our social model'.
  Indicator can be considered as similar to  global SDG indicator 8.1.1 "Annual growth rate of real GDP per capita". Furthermore, indicator is also an impact indicator for the Strategic Plan 2020-2024 referring to the 10 Commission priorities.
10-10-methodology: >-
  The indicator is also relevant in the context of the recently adopted European Pillar for Social Rights, which sets out a number of key principles to support fair and well-functioning labour markets and welfare systems. Those principles address topics related to inequality, by tackling both inequality of outcomes (income and wealth inequality) and inequality of opportunities: from wage-setting to social protection systems (including minimum income), gender equality, enabling social services, childcare and support to children, old-age income, health care and access to housing.
10-10-long_term_objective: >-
  The long-term objective for the indicator is to progressively achieve and sustain income growth of the bottom 40 per cent of the population at a rate higher than the national average by 2030.
10-20-title: Disparities in household income per capita
10-20-definition: >-
  The indicator reflects the purchasing power of households and their ability to invest in goods and services or save for the future, by accounting for taxes and social contributions and monetary in-kind social benefits. It is calculated as the adjusted gross disposable income of households and Non-Profit Institutions Serving Households (NPISH) divided by the purchasing power parities (PPP) of the actual individual consumption of households and by the total resident population.
10-20-intention: >-
  Indicator is used to monitor progress towards SDG 10 on reducing inequality within and among countries and SDG 1 on ending poverty in all its forms everywhere, which is embedded in the European Commission’s Priorities under 'Supporting people, strenghtening our societs and our social model'.
10-20-methodology: >-
  The indicator is also included as main indicator in the Social Scoreboard for the European Pillar of Social Rights. The European Pillar for Social Rights, adopted in 2017, sets out a number of key principles to support fair and well-functioning labour markets and welfare systems. Those principles address topics related to inequality, by tackling both inequality of outcomes (income and wealth inequality) and inequality of opportunities: from wage-setting to social protection systems (including minimum income), gender equality, enabling social services, childcare and support to children, old-age income, health care and access to housing.
  While GDP per capita is used to measure the economic performance of a country, gross household disposable income provides an indication of the average material well-being of people. The indicator therefore measures whether the EU Member States are converging in terms of people's incomes.
10-20-long_term_objective: >-
  No description
10-30-title: Relative median at-risk-of-poverty gap
10-30-definition: >-
  The indicator is calculated as the distance between the median equivalised total net income of persons below the at-risk-of-poverty threshold and the at-risk-of-poverty threshold itself, expressed as a percentage of the at-risk-of-poverty threshold. This threshold is set at 60 % of the national median equivalised disposable income of all people in a country and not for the EU as a whole.
10-30-intention: >-
  Indicator is used to monitor progress towards SDG 10 on reducing inequality within and among countries: which is embedded in the European Commission's Priorities under 'Supporting people, strenghtening our societes and our social model'.
  The European Pillar of Social Rights sets out 20 key principles to support fair and well-functioning labour markets and welfare systems. These principles address topics related to inequality by tackling both inequality of outcomes and inequality of opportunities: from wage-setting to social-protection systems, gender equality, enabling social services, childcare and support to children, old-age income, healthcare and access to housing.
10-30-methodology: >-
  The European Pillar of Social Rights Action Plan turns the Principles of European Pillar of Social Rights into concrete actions to benefit citizens. It proposes headline targets regarding employment rate, adult participation in learning and risk of poverty and social exclusion for the EU to reach by 2030.
  The European Semester is a key delivery tool of the Pillar and coordinates the economic and fiscal policies of EU Member States. As part of its Green Deal, the European Commission has announced that the European Semester will be refocused to integrate the SDGs and to put sustainability and the well-being of citizens at the centre of economic policy.
10-30-long_term_objective: >-
  SDG 10 calls for nations to adapt policies and legislation to increase the income of the bottom 40% of the population and to reduce inequalities based on income, sex, age, disability, race, class, ethnicity, religion, and opportunity.
10-41-title: Income distribution - proxy indicator
10-41-definition: >-
  Percentage share of income or consumption is the share that accrues to subgroups of the population indicated by deciles or quintiles. Percentage shares by quintile may not sum to 100 because of rounding. Data are based on primary household survey data obtained from government statistical agencies and World Bank country departments.
10-41-intention: >-
  Despite progress in the last decade, the challenges of measuring poverty remain. The timeliness, frequency, quality, and comparability of household surveys need to increase substantially, particularly in the poorest countries. The surveys ask detailed questions on sources of income and how it was spent, which must be carefully recorded by trained personnel. Income is generally more difficult to measure accurately, and consumption comes closer to the notion of living standards. Most survey data now include valuations for consumption or income from own production, but valuation methods vary.
10-41-methodology: >-
  Inequality in the distribution of income is reflected in the share of income or consumption accruing to a portion of the population ranked by income or consumption levels. The portions ranked lowest by personal income receive the smallest shares of total income. Data on the distribution of income or consumption come from nationally representative household surveys. Where the original data from the household survey were available, they have been used to directly calculate the income or consumption shares by quintile. Otherwise, shares have been estimated from the best available grouped data. The distribution data have been adjusted for household size, providing a more consistent measure of per capita income or consumption. Survey year is the year in which the underlying household survey data were collected or, when the data collection period bridged two calendar years, the year in which most of the data were collected. Percentage shares by quintile may not sum to 100 because of rounding.
10-41-long_term_objective: >-
  The World Bank Group's goal of promoting shared prosperity has been defined as fostering income growth of the bottom 40 per cent of the welfare distribution in every country. Income distribution data and the Gini coefficient measure inequality in income or consumption and are important indicators for measuring shared prosperity.
10-50-title: Income share of the bottom 40 % of the population
10-50-definition: >-
  The indicator measures the income share received by the bottom 40 % of the population. The income concept used is the total disposable household income.
10-50-intention: >-
  Indicator is used to monitor progress towards SDG 10 on reducing inequality within and among countries; which is embedded in the European Commission’s Priorities under 'Supporting people, strenghtening our societs and our social model'.
  Indicator can be considered as similar to global SDG indicator 10.1.1 "Growth rates of household expenditure or income per capita among the bottom 40 percent of the population and the total population".
  The indicator is relevant for measuring the overall change in living standards of those with the lowest incomes over a number of years.
  The European Pillar of Social Rights sets out 20 key principles to support fair and well-functioning labour markets and welfare systems. These principles address topics related to inequality by tackling both inequality of outcomes and inequality of opportunities: from wage-setting to social-protection systems, gender equality, enabling social services, childcare and support to children, old-age income, healthcare and access to housing.
10-50-methodology: >-
  The European Pillar of Social Rights Action Plan turns the Principles of European Pillar of Social Rights into concrete actions to benefit citizens. It proposes headline targets regarding employment rate, adult participation in learning and risk of poverty and social exclusion for the EU to reach by 2030.
  The European Semester is a key delivery tool of the Pillar and coordinates the economic and fiscal policies of EU Member States. As part of its Green Deal, the European Commission has announced that the European Semester will be refocused to integrate the SDGs and to put sustainability and the well-being of citizens at the centre of economic policy
  The European Social Fund (ESF) is the EU’s main instrument for investing in people since the adoption of the Treaty of Rome. It helps tackle inequalities, both in terms of outcomes and opportunities, by financing actions in the areas of employment, social inclusion, education, training and administrative capacity reforms. The revised European Social Fund Plus (ESF+), with a budget of EUR 101 billion as part of the Multiannual Financial Framework 2021–2027, will further help to reduce inequalities.
10-50-long_term_objective: >-
  No description
10-60-title: Asylum applications
10-60-definition: >-
  The indicator shows the number of first-time asylum applicants per million inhabitants and the number of positive first instance decisions per million inhabitants. Please note that caution is required when comparing these two values, since applications received in a given year might not be processed until a later year.
10-60-intention: >-
  Indicator is used to monitor progress towards SDG 10 on reducing inequality within and among countries; which is embedded in the European Commission’s Priorities under 'Supporting people, strenghtening our societs and our social model'. . SDG 10 among other things, seeks to promote social inclusion globally through the facilitation of safe, orderly and regular migration and the reduction of transaction costs of migrant remittances.
  The European Commission’s Knowledge Centre for Migration and Demography provides knowledge and evidence-based analysis for policy developments and decisions related to saving migrants’ lives and securing the external borders, strengthening the common asylum policy and developing a new policy on legal migration. The Asylum, Migration and Integration Fund provide financial support for these actions.
10-60-methodology: >-
  The Fund for European Aid to the Most Deprived (FEAD) supports asylum seekers by providing them with immediate relief (food, clothing and other essential items for personal use).
  The proposed European Solidarity Corps will enable young people across the EU to volunteer their help for the reception and integration of refugees.
10-60-long_term_objective: >-
  No description
11-11-title: Severe housing deprivation rate
11-11-definition: >-
  The severe housing deprivation rate is defined as the percentage of the population living in a dwelling which is considered as overcrowded, while also exhibiting at least one of the following housing deprivation measures: i) a leaking roof, ii) no bath/shower and no indoor toilet, iii) considered too dark.
11-11-intention: >-
  Indicator is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable and and towards SDG 1 on multidimensional poverty. SDG 11 is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'. SDG 1 is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'
11-11-methodology: >-
  SDG 11 aims to renew and plan cities and other human settlements so that they offer opportunities for all, with access to basic services, energy, housing, transportation, green public spaces and others, while improving resource use and reducing environmental impacts.
  SDG 1 calls, among other things, for an eradication of extreme poverty and for a reduction of relative poverty and is embedded in the European Commission’s Priorities under 'An economy that works for people'.
11-11-long_term_objective: >-
  No description
11-20-title: Population living in households suffering from noise
11-20-definition: >-
  The indicator measures the proportion of the population who declare that they are affected either by noise from neighbours or from the street.
  Because the assessment of noise pollution is subjective, it should be noted that the indicator accounts for both the levels of noise pollution as well as people’s standards of what level they consider to be acceptable. Therefore, an increase in the value of the indicator may not necessarily indicate a similar increase in noise pollution levels but also a decrease of the levels that European citizens are willing to tolerate and vice versa. In fact, there is empirical evidence that perceived environmental quality by individuals is not always consistent with the actual environmental quality assessed using ‘objective’ indicators, particularly for noise.
11-20-intention: >-
  Indicator is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable and SDG 3 on good health and well-being. SDG 11 is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'. SDG 3 is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
11-20-methodology: >-
  SDG 11 aims to renew and plan cities and other human settlements so that they offer opportunities for all, with access to basic services, energy, housing, transportation, green public spaces and others, while improving resource use and reducing environmental impacts. SDG 3 aims to ensure health and well-being for all at all ages by improving reproductive, maternal and child health; ending the epidemics of major communicable diseases; reducing non-communicable and mental diseases. It also calls for reducing behavioural and environmental health-risk factors.
  The Environmental Noise Directive is the main EU instrument for identifying and combating noise pollution. It focuses on three action areas: determination of exposure to environmental noise; ensuring that information on environmental noise and its effects is made available to the public; preventing and reducing environmental noise where necessary and particularly where exposure levels can induce harmful effects on human health and preserving environmental noise quality where it is good.
11-20-long_term_objective: >-
  No description
11-32-title: Soil sealing index
11-32-definition: >-
  This indicator measures the covering of the soil surface with non-permeable materials, hence indicating imperviousness. The aggregation of imperviousness values to reference units, such as urban areas, floodplains, coastal zones or protected areas is performed using the integrated spatial data platform of the EEA.
11-32-intention: >-
  Indicator is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable and towards SDG 15 on protecting, restoring and promoting sustainable use of land. SDG 11 is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'. SDG 15 is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
11-32-methodology: >-
  SDG 11 aims to renew and plan cities and other human settlements so that they offer opportunities for all, with access to basic services, energy, housing, transportation, green public spaces and others, while improving resource use and reducing environmental impacts.
  SDG 15 seeks to protect, restore and promote the conservation and sustainable use of terrestrial, inland-water and mountain ecosystems. This includes efforts to sustainably manage forests and halt deforestation, combat desertification, restore degraded land and soil, halt biodiversity loss and protect threatened species.
11-32-long_term_objective: >-
  The Soil Strategy for 2030 has set a goal of no net land take by 2050
11-40-title: Road traffic deaths
11-40-definition: >-
  The indicator measures the number of fatalities caused by road accidents, including drivers and passengers of motorised vehicles and pedal cycles as well as pedestrians. Persons dying on road accidents up to 30 days after the occurrence of the accident are counted as road accident fatalities.
11-40-intention: >-
  Indicator is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable and SDG 3 on good health and well-being. SDG 11 is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'. SDG 3 is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
  The indicator can be considered as similar to the global SDG indicator 3.6.1 "Death rate due to road traffic injuries".
11-40-methodology: >-
  SDG 11 aims to renew and plan cities and other human settlements so that they offer opportunities for all, with access to basic services, energy, housing, transportation, green public spaces and others, while improving resource use and reducing environmental impacts. With sound, risk-informed and smart planning and management, SDG 11 envisions cities as environmentally resilient human settlements that foster personal safety.
  SDG 3 aims to ensure health and well-being for all at all ages by improving reproductive, maternal and child health; ending the epidemics of major communicable diseases; reducing non-communicable and mental diseases. It also calls for reducing behavioural and environmental health-risk factors.
  The Strategic Action Plan on Road Safety and the EU road safety policy framework 2021–2030 set a 50 % reduction target for deaths and for serious injuries by 2030 compared to 2019 and ambitious road safety plans to reach zero road deaths by 2050 (‘Vision Zero’).
11-40-long_term_objective: >-
  No description
11-52-title: Premature deaths due to exposure to fine particulate matter (PM2.5)
11-52-definition: >-
  This indicator estimates the number of premature deaths attributable to long-term exposure to concentrations of PM2.5 above 5µg/m3 (the World Health Organization's guideline level). PM2.5 are particulates whose diameter is less than 2.5 micrometres and which can be carried deep into the lungs where they can cause inflammation and exacerbate the condition of people suffering heart and lung diseases.
11-52-intention: >-
  is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable and SDG 3 on good health and well-being. SDG 11 is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'. SDG 3 is embedded in the European Commission’s Priorities under 'Supporting people, strengthening our societies and our social model'.
11-52-methodology: >-
  The EU addresses the problem of air pollution through its specific air quality and industrial emissions legislation such as the Clean Air Package and the directives adopted by the Council and the European Parliament in relation to ambient air quality, as well as through co-benefits resulting from implementation of certain climate policies.
  The Action Plan Towards a Zero Pollution for Air, Water and Soil’ includes the target of reducing the health impacts due to air pollution by 55 % by 2030, compared with 2005.
  The monitoring framework for the 8th Environment Action Programme uses the number of premature deaths as a headline indicator with the target to reduce the number of permature deaths due to PM2.5 by 55 % by 2030, compared with 2005.
11-52-long_term_objective: >-
  The long-term objective for this indicator is a value of 5.
11-60-title: Recycling rate of municipal waste
11-60-definition: >-
  The indicator measures the tonnage recycled from municipal waste divided by the total municipal waste arising. Recycling includes material recycling, composting, preparing for re-use and anaerobic digestion. Municipal waste consists mostly of waste generated by households, but may also include similar wastes generated by small businesses and public institutions and collected by the municipality. This latter part of municipal waste may vary from municipality to municipality and from country to country, depending on the local waste management system. For areas not covered by a municipal waste collection scheme the amount of waste generated is estimated.
11-60-intention: >-
  Indicator is used to monitor progress towards SDG 11 on making cities and human settlements inclusive, safe, resilient and sustainable which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security', 'Supporting people, strengthening our societies and our social model', 'Sustaining our quality of life: food security, water and nature' and 'Protecting our democracy, upholding our values'.
11-60-methodology: >-
  The 2015 circular economy action plan supports the transition to a stronger and more circular economy. The Directive (EU) 2018/851 of 30 May 2018 established new more ambitious legally binding targets for recycling and reuse of municipal waste. EU countries will now be required to recycle at least 55 % of their municipal waste by 2025, 60 % by 2030 and 65 % by 2035. The 2022 Circular Economy package proposal for packaging and packaging waste Directive aims to reduce packaging waste and increase recycling.
11-60-long_term_objective: >-
  The long-term objective for this indicator is a value of 62.
12-10-title: Consumption of hazardous chemicals
12-10-definition: >-
  This indicator measures the consumption of toxic chemicals, expressed in million tonnes. The consumption of chemicals is calculated as the sum of the production volumes (PRODCOM) and the net import volumes of the chemicals (COMEXT) according to the equation: Consumption = production + imports – exports.
  The data on hazardous and non-hazardous chemicals show the total consumption of all chemicals. The two sub-categories of hazardous chemicals – hazardous to human health and hazardous to the environment – overlap by definition and as a result their sum is not equal to the total consumption of hazardous chemicals.
12-10-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
12-10-methodology: >-
  SDG 12 calls for a comprehensive set of actions from businesses, policy-makers, researchers and consumers to adapt to sustainable practices. It envisions sustainable production and consumption based on advanced technological capacity, resource efficiency and reduced global waste.
  The Registration, Evaluation, Authorisation and Restriction of Chemicals (REACH) framework aims to improve the protection of human health and the environment through better identification and management of hazardous chemicals. The framework will be updated, supported by the Chemicals Strategy for Sustainability, which aims to improve the protection of the environment and our health from risks posed by chemicals and to support innovation for safe and sustainable chemicals.
12-10-long_term_objective: >-
  No description
12-21-title: Material footprint
12-21-definition: >-
  The material footprint, also referred to as raw material consumption (RMC), represents the global demand for the extraction of materials (minerals, metal ore, biomass, fossil energy materials) induced by consumption of goods and services within a geographical reference area. Data for material footprints stem from material flow accounts, which model the flows of natural resources from the environment into the economy. They include domestic extraction of materials measured in tonnes of gross material (for example, gross ore or gross harvest) as well as imports and exports measured by estimates of the raw material equivalents of the products traded (domestic and abroad extraction required to produce the traded products). RMC thus shows the amount of extraction needed to produce the goods demanded by final users in the geographical reference area, irrespective of where in the world the material extraction took place.
12-21-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  SDG 12 calls for a comprehensive set of actions from businesses, policy-makers, researchers and consumers to adapt to sustainable practices. It envisions sustainable production and consumption based on advanced technological capacity, resource efficiency and reduced global waste.
  SDG 8, among other things, calls for promoting labour rights and safe and secure working environments
  The indicator can be considered as similar to the global SDG indicator 8.4.1 and 12.2.1 element "Material footprint".
12-21-methodology: >-
  The 8th Environment Action Programme (EAP) adopted in March 2022 aims to accelerate the transition to a climate-neutral, resource-efficient and regenerative economy, recognising that human wellbeing depends on healthy ecosystems. Among its priority objectives are achieving climate neutrality by 2050 and restoring biodiversity.
  The Circular Economy Action Plan adopted in 2020 aims to double the EU’s circular material use rate in the coming decade to support the achievement of climate neutrality by 2050, to decouple economic growth from resource use and waste generation and to keep resource consumption within ecological boundaries. In March 2022, the European Commission adopted a package on Circular Economy measures to make sustainable products the norm in the EU and boost circular business models.
12-21-long_term_objective: >-
  No description
12-31-title: Consumption footprint
12-31-definition: >-
  The consumption footprint (CF) is a Life Cycle Assessment (LCA)-based model used to produce a set of 16 environmental indicators to assess the environmental impacts of consumption patterns of the EU and its Member States, performed by combining data on consumption intensity with an assessment of the environmental impacts of representative products. The CF assessment is based on the combination of: (a) the emissions to air, soil and water as well as the resources used throughout the life cycle of 164 representative products, belonging to five areas of consumption (food, mobility, housing, household goods, and appliances), (b) the consumption per year (i.e., consumption intensities) of those products, which are calculated based on consumption statistics, and (c) the Environmental Footprint (EF) impact assessment method, which translates emissions and resource consumption into the 16 potential environmental impacts, which it is possible to aggregate into a single score, where deemed convenient. The EF impact indicators can be compared with a set of thresholds that are based on the Planetary Boundaries framework. Thus, a given CF indicator (for example, climate change or marine eutrophication) measures the number of times the impact of consumption has transgressed the associated planetary boundary. As well, the CF single weighted score measures the number of times a weighted boundary has been transgressed.
12-31-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
12-31-methodology: >-
  The European Commission adopted the circular economy action plan (CEAP) in March 2020. The EU’s transition to a circular economy will reduce pressure on natural resources and will create sustainable growth and jobs. The new action plan announces initiatives along the entire life cycle of products. It targets how products are designed, promotes circular economy processes, encourages sustainable consumption, and aims to ensure that waste is prevented and the resources used are kept in the EU economy for as long as possible. Building on existing EU policies and legislation, the Circular Economy Package establishes a programme of action with measures covering the whole cycle from production and consumption to waste management. The Package includes commitments on ecodesign, waste prevention and reuse, clean material cycles and ambitious quantitative targets on increasing recycling and reducing landfilling, obligations to improve the separate collection of waste, as well as the promotion of efficient use of bio-based resources.
12-31-long_term_objective: >-
  No description
12-41-title: Circular material use rate
12-41-definition: >-
  The consumption footprint (CF) is a Life Cycle Assessment (LCA)-based model used to produce a set of 16 environmental indicators to assess the environmental impacts of consumption patterns of the EU and its Member States, performed by combining data on consumption intensity with an assessment of the environmental impacts of representative products. The CF assessment is based on the combination of: (a) the emissions to air, soil and water as well as the resources used throughout the life cycle of 164 representative products, belonging to five areas of consumption (food, mobility, housing, household goods, and appliances), (b) the consumption per year (i.e., consumption intensities) of those products, which are calculated based on consumption statistics, and (c) the Environmental Footprint (EF) impact assessment method, which translates emissions and resource consumption into the 16 potential environmental impacts, which it is possible to aggregate into a single score, where deemed convenient. The EF impact indicators can be compared with a set of thresholds that are based on the Planetary Boundaries framework. Thus, a given CF indicator (for example, climate change or marine eutrophication) measures the number of times the impact of consumption has transgressed the associated planetary boundary. As well, the CF single weighted score measures the number of times a weighted boundary has been transgressed.
12-41-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, w The indicator can be considered as part of the global SDG indicator 11.6.1 "Proportion of urban solid waste regularly collected and with adequate final discharge out of total urban solid waste generated, by cities".
  Increasing the circularity of Europe's economy is a key priority of the new Industrial Strategy of the EU adopted in 2020 and one of the key elements of the European Green Deal.ater and nature'.
12-41-methodology: >-
  The European Commission adopted the circular economy action plan (CEAP) in March 2020. The EU’s transition to a circular economy will reduce pressure on natural resources and will create sustainable growth and jobs. The new action plan announces initiatives along the entire life cycle of products. It targets how products are designed, promotes circular economy processes, encourages sustainable consumption, and aims to ensure that waste is prevented and the resources used are kept in the EU economy for as long as possible. Building on existing EU policies and legislation, the Circular Economy Package establishes a programme of action with measures covering the whole cycle from production and consumption to waste management. The Package includes commitments on ecodesign, waste prevention and reuse, clean material cycles and ambitious quantitative targets on increasing recycling and reducing landfilling, obligations to improve the separate collection of waste, as well as the promotion of efficient use of bio-based resources.
  The Sustainable Consumption and Production and Sustainable Industrial Policy (SCP/SIP) Action Plan includes a series of proposals on sustainable consumption and production that will contribute to improving the environmental performance of products and increase the demand for more sustainable goods and production technologies.
  The 8th Environment Action Programme (EAP) adopted in March 2022 aims to accelerate the transition to a climate-neutral, resource-efficient and regenerative economy, recognising that human wellbeing depends on healthy ecosystems. Among its priority objectives are achieving climate neutrality by 2050 and restoring biodiversity. This indicator is also included as a headline indicator and sets a target of doubling the ratio of circular material use by 2030 compared to 2020.
12-41-long_term_objective: >-
  The long-term objective for this indicator is a value of 30
12-51-title: Generation of waste
12-51-definition: >-
  This indicator is defined as all waste generated in a country. It covers waste generated by industrial production (including the waste management sector itself) and by households. Major mineral wastes, dredging spoils and soils are included. This leads to high quantities of waste in some countries with substantial economic activities such as mining and construction.
12-51-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as part of the global SDG indicator 11.6.1 "Proportion of urban solid waste regularly collected and with adequate final discharge out of total urban solid waste generated, by cities".
  Increasing the circularity of Europe's economy is a key priority of the new Industrial Strategy of the EU adopted in 2020 and one of the key elements of the European Green Deal.
12-51-methodology: >-
  The European Commission adopted the new circular economy action plan (CEAP) in March 2020. The EU’s transition to a circular economy will reduce pressure on natural resources and will create sustainable growth and jobs. The new action plan announces initiatives along the entire life cycle of products. It targets how products are designed, promotes circular economy processes, encourages sustainable consumption, and aims to ensure that waste is prevented and the resources used are kept in the EU economy for as long as possible. Building on existing EU policies and legislation, the Circular Economy Package establishes a programme of action with measures covering the whole cycle from production and consumption to waste management. The Package includes commitments on ecodesign, waste prevention and reuse, clean material cycles and ambitious quantitative targets on increasing recycling and reducing landfilling, obligations to improve the separate collection of waste, as well as the promotion of efficient use of bio-based resources.
  The Sustainable Consumption and Production and Sustainable Industrial Policy (SCP/SIP) Action Plan includes a series of proposals on sustainable consumption and production that will contribute to improving the environmental performance of products and increase the demand for more sustainable goods and production technologies.
12-51-long_term_objective: >-
  No description
12-61-title: Gross value added in environmental goods and services sector
12-61-definition: >-
  The environmental goods and services sector (EGSS) is defined as that part of a country’s economy that is engaged in producing goods and services that are used in environmental protection and resource management activities either domestically or abroad. Gross value added in EGSS represents the contribution of the environmental goods and services sector to GDP. 
  Products for environmental protection prevent, reduce and eliminate pollution or any other degradation of the environment and include measures undertaken to restore degraded habitats and ecosystems. Examples are electric vehicles, catalysts and filters to decrease pollutant emissions, wastewater and waste treatment services, or noise insulation works. Products for resource management safeguard the stock of natural resources against depletion. Examples are renewable energy production, energy efficient and passive buildings, seawater desalinization or rainwater recovery.
12-61-intention: >-
  Indicator is used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns and SDG 9 on building resilient infrastructure, promoting inclusive and sustainable industrialisation and fostering innovation, which are embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
12-61-methodology: >-
  SDG 12 calls for a comprehensive set of actions from businesses, policy-makers, researchers and consumers to adapt to sustainable practices. It envisions sustainable production and consumption based on advanced technological capacity, resource efficiency and reduced global waste.
  SDG 9 calls for building resilient and sustainable infrastructure and promotes inclusive and sustainable industrialisation. It also recognises the importance of research and innovation for finding lasting solutions to social, economic and environmental challenges.
12-61-long_term_objective: >-
  The long-term objective for this indicator is a value of 5.5.
13-10-title: Domestic net greenhouse gas emissions
13-10-definition: >-
  The indicator measures total national emissions (from both ESD and ETS sectors) of the so called ‘Kyoto basket’ of greenhouse gases, including carbon dioxide (CO2), methane (CH4), nitrous oxide (N2O), and the so-called F-gases (hydrofluorocarbons, perfluorocarbons, nitrogen triflouride (NF3) and sulphur hexafluoride (SF6)) from all sectors of the GHG emission inventories. Estimated emissions from international aviation and maritime transport are excluded for individual countries. The indicator is presented in two forms: as net emissions including land use, land use change and forestry (LULUCF) as well as excluding LULUCF. Using each gas’ individual global warming potential (GWP), they are being integrated into a single indicator expressed in units of CO2 equivalents. The GHG emission inventories are submitted annually by the EU Member States to the United Nations Framework Convention on Climate Change (UNFCCC).
13-10-intention: >-
  Indicator is used to monitor progress towards SDG 13 on climate action which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The European Climate Law sets out a framework for climate action and increases the EU’s ambition for 2030, with a new goal to reduce net greenhouse gas (GHG) emissions by at least 55 % by that year (compared to 1990) and to achieve climate-neutrality by 2050. The European Commission has also put in place a package of new and revised EU climate and energy legislation — the so called Fit for 55 package — to increase its ambition on climate mitigation. The package comprises an interconnected set of measures in the area of energy, transport, taxation and climate policies, and includes strengthened and expanded carbon pricing, targets, standards and support measures. It also sets a target for natural carbon sinks of 310 million tonnes of CO2equivalents.
13-10-methodology: >-
  The NextGenerationEU recovery plan is the Union’s economic response to the COVID-19 crisis. It includes the Recovery and Resilience Facility worth EUR 672.5 billion, of which at least 37 % must go to climate action. Each national recovery and resilience plan will have to meet this target of a minimum of 37% of expenditure related to climate, and all reforms and investments by Member States as a part of the recovery fund must comply with the ’do-no-significant-harm’principle and therefore avoid significant negative impact on the EU’s climate and environmental objectives.
  The new EU cohesion policy (2021 to 2027) includes a ‘greener, carbon-free Europe’ as one of its five main objectives receiving 65 % to 85 % of available funding together with an objective for a ‘smarter Europe’
13-10-long_term_objective: >-
  Reduction of 55% of 1990 level
13-21-title: Net greenhouse gas emissions of the LULUCF sector
13-21-definition: >-
  This indicator measures net carbon removals from the land use, land use change and forestry (LULUCF) sector, considering both emissions and removals from the sector. The LULUCF data covers the annual fluxes of CO2, CH4 and N2O from all managed land in the EU. The indicator is expressed as_x000B_CO2 equivalents using the global warming potential (GWP) of each gas. 
  Emissions and removals data, known as GHG inventories, are submitted annually by Member States to the EU and the United Nations Framework Convention on Climate Change (UNFCCC). The European Environment Agency (EEA) compiles the EU aggregate data and publishes data for the EU and all Member States. Eurostat republishes the EEA data.
13-21-intention: >-
  Indicator is used to monitor progress towards SDG 13 on climate action which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'. SDG 13 seeks to implement the commitment to the United Nations Framework Convention on Climate Change for achieving a climate neutral world by mid-century to limit global warming to well below 2°C and aiming at 1.5°C (compared to pre-industrial times). It also aims to strengthen countries’ resilience and adaptive capacity to climate-related natural hazards and the resulting disasters.
13-21-methodology: >-
  The European Climate Law sets out a framework for climate action and increases the EU’s ambition for 2030, with a new goal to reduce net greenhouse gas (GHG) emissions by at least 55 % by that year (compared to 1990) and to achieve climate-neutrality by 2050. The European Commission has also put in place a package of new and revised EU climate and energy legislation — the so called Fit for 55 package — to increase its ambition on climate mitigation. 
  The package comprises an interconnected set of measures in the area of energy, transport, taxation and climate policies, and includes strengthened and expanded carbon pricing, targets, standards and support measures. It also sets a target for natural carbon sinks of 310 million tonnes of CO2 equivalents.
13-21-long_term_objective: >-
  No description
13-31-title: Average CO2 emissions per km from new passenger cars
13-31-definition: >-
  The indicator is defined as the average carbon dioxide (CO2) emissions per km by new passenger cars in a given year. The reported emissions are based on type-approval and can deviate from the actual CO2 emissions of new cars. In the monitoring for cars and vans, emissions data are reported using the ‘New European Driving Cycle’ (NEDC) protocol until 2019, using both protocols NEDC and the ‘Worldwide harmonized Light vehicles Test Procedure’ (WLTP) in 2020 and only WLTP protocol from 2021.
13-31-intention: >-
  Indicator s used to monitor progress towards SDG 12 on ensuring sustainable consumption and production patterns and on SDG 13 on taking urgent action to combat climate change and its impacts. These SDGs are embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
13-31-methodology: >-
  SDG 12 calls for a comprehensive set of actions from businesses, policy-makers, researchers and consumers to adapt to sustainable practices. It envisions sustainable production and consumption based on advanced technological capacity, resource efficiency and reduced global waste.
  SDG 13 seeks to implement the commitment to the United Nations Framework Convention on Climate Change for achieving a climate neutral world by mid-century to limit global warming to well below 2°C and aiming at 1.5°C (compared to pre-industrial times). It also aims to strengthen countries’ resilience and adaptive capacity to climate-related natural hazards and the resulting disasters.
  the Fit for 55 package comprises an interconnected set of EU climate and energy legislation including updated CO2 emission standards for new vehicles.
13-31-long_term_objective: >-
  No description
13-40-title: Climate-related economic losses
13-40-definition: >-
  The indicator measures the economic losses from weather and climate-related events. Weather and climate-related events are defined as meteorological events (storms, avalanches), hydrological events (floods) and climatological events (heatwaves, cold waves, droughts, forest fires) based on the classification by the International Council for Science (ICSU).
  In addition to the annual figures, a smoothed time-series based on 30-year averages is presented. In line with the climate normal period as defined by World Meteorological Organisation, these 30 years average figures reflect trends excluding the substantial climate variability on shorter time scales due to natural factors. The indicator is based on data from CATDAT of RiskLayer.
13-40-intention: >-
  Indicator is used to monitor progress towards SDG 13 on climate action which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'. SDG 13 seeks to implement the commitment to the United Nations Framework Convention on Climate Change for achieving a climate neutral world by mid-century to limit global warming to well below 2°C and aiming at 1.5°C (compared to pre-industrial times). It also aims to strengthen countries’ resilience and adaptive capacity to climate-related natural hazards and the resulting disasters.
  This indicator can be considered as similar to the global SDG indicators 1.5.2 and 11.5.2 "Direct disaster economic loss in relation to global GDP" (related to Sendai indicator).
13-40-methodology: >-
  The EU places disaster and climate resilience as a central objective in its humanitarian assistance. The EU Resilience Marker is used in all humanitarian projects to define ways to reduce disaster risks and to strengthen people's coping capacities to disasters and crises. The Action Plan for the Sendai Framework for Disaster Risk Reduction 2015 – 2030 includes a strong focus on climate change adaptation, linking it to disaster risk reduction strategies and their coherent implementation in EU partner countries.
  The new EU Adaptation Strategy urges smarter, faster and more systematic adaptation to fulfil the vision that in 2050, the EU will be a climate-resilient society, fully adapted to the unavoidable impacts of climate change.
13-40-long_term_objective: >-
  EU Adaptation Strategy 2021; Policy reference: CLIM039; 8th EAP; Climate losses insurance; Economic losses; Disasters; Natural hazards.
13-50-title: Contribution to the international 100bn USD commitment on climate related expenditure
13-50-definition: >-
  The indicator measures the total amount spent from the annual budget of the EU Member States as well as of the European Commission and the European Investment Bank, in order to contribute to the international 100bn USD commitment for climate finance under the United Nations Framework Convention on Climate Change (UNFCCC).
13-50-intention: >-
  Indicator is used to monitor progress towards SDG 13 on climate action which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  Indicator can be considered as identical to global SDG indicator 13.a.1 'Amounts provided and mobilized in United States dollars per year in relation to the continued existing collective mobilization goal of the $100 billion commitment through to 2025'
13-50-methodology: >-
  SDG 13 seeks to implement the commitment to the United Nations Framework Convention on Climate Change for achieving a climate neutral world by mid-century to limit global warming to well below 2°C and aiming at 1.5°C (compared to pre-industrial times). It also aims to strengthen countries’ resilience and adaptive capacity to climate-related natural hazards and the resulting disasters.
13-50-long_term_objective: >-
  No description
13-70-title: Green bond issuance
13-70-definition: >-
  Green bonds are loans provided by an investor to a borrower which are used to fund projects or activities that promote climate change mitigation or adaptation or other environmental objectives. While the green bond definition can vary, this indicator includes bonds that are aligned with the four core components of the International Capital Market Association (ICMA) green bond principles or are certified by the Climate Bond Initiative (CBI). Issuers include corporates such as a company or financial corporation, and sovereign bond issuers which are national governments. Sovereign bonds issued by governments are only included if they have a maturity of more than one year.
13-70-intention: >-
  Indicator is used to monitor progress towards SDG 13 on climate action which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'. SDG 13 seeks to implement the commitment to the United Nations Framework Convention on Climate Change for achieving a climate neutral world by mid-century to limit global warming to well below 2°C and aiming at 1.5°C (compared to pre-industrial times). It also aims to strengthen countries’ resilience and adaptive capacity to climate-related natural hazards and the resulting disasters.
13-70-methodology: >-
  As part of the transition towards climate neutrality and climate resilience, the EU is endeavouring to redirect public and private investments to areas where they will support this objective. For this reason, the EU has adopted the EU taxonomy as a classification system for sustainable economic activities and a European green bond standard as a voluntary ‘gold’ standard for the green bond market. At EU level, climate change mitigation and adaptation has been integrated into all major spending programmes and the EU has also committed to support international climate action.
  This indicator is a headline indicator for monitoring progress towards meeting targets of the Eighth Environment Action Programme (8th EAP).
13-70-long_term_objective: >-
  No description
14-10-title: Marine protected areas
14-10-definition: >-
  This indicator measures the extent of marine protected areas (MPAs) in EU marine waters. MPAs are biodiversity ‘hotspots’ and can serve various objectives including species and habitats protection, biodiversity conservation and restoration, but also resource use within defined ecological boundaries. MPAs may also positively impact neighbouring areas.
14-10-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicator 14.5.1 "Coverage of protected areas in relation to marine areas".
14-10-methodology: >-
  The EU Birds Directive and the Habitats Directive aim to maintain or restore a favourable conservation status of protected habitats and species, and safeguard their sustainable use and management. The Habitats Directive aims to contribute towards ensuring biodiversity of the EU, including in the marine environment and lists nine marine habitat types and 16 species for which marine site designation is required, whilst the Birds Directive lists a further 60 bird species whose conservation requires marine site protection.
  The EU biodiversity strategy aims to protect at least 30% of land and sea in Europe including both nationally designated sites and Natura 2000 sites.
  Marine protected areas can serve various objectives including species and habitats protection, biodiversity conservation and restoration, but also resource use within defined ecological boundaries. For all MPAs, specific management objectives are set, often consisting of different zones with permitted and non-permitted uses.
  The EU is also engaged in discussions at the United Nations General Assembly towards an international legally binding agreement on the conservation of biodiversity in areas beyond national jurisdiction (BBNJ).
14-10-long_term_objective: >-
  No description
14-21-title: Estimated trends in fish stock biomass
14-21-definition: >-
  Fish stock biomass is a function of biological characteristics such as abundance and weight and can indicate the status of a fish stock when measured against reference values. This is a model-based indicator that is computed using results from single-species quantitative stock assessments. It shows the median value of fish stock biomass relative to 2003. The full time series is updated every year, sometimes including new stocks due to newly available quantitative assessments which can result in small differences from one release year to the next.
14-21-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicator 14.4.1 "Proportion of fish stocks within biologically sustainable levels".
14-21-methodology: >-
  The Common Fisheries Policy aims to ensure the long-term sustainability of the sector by safeguarding stock reproduction for high long-term yield, improving distribution of fishing opportunities, conserving marine resources and supporting the profitability of the industry. The Marine Strategy Framework Directive takes a comprehensive and integrated approach to the protection of the marine environment and natural resources with the aim of achieving good environmental status of EU marine waters that are ecologically diverse, clean healthy and productive.
14-21-long_term_objective: >-
  No description
14-30-title: Estimated trend in fishing pressure
14-30-definition: >-
  The indicator presents the model-based median value of fishing pressure (F/Fmsy) in EU marine waters of the North-East Atlantic and adjacent seas (FAO area 27) and the Mediterranean and the Black Sea (FAO area 37) for which current fishing mortality (F) exceeds the estimated fishing mortality consistent with achieving maximum sustainable yield (Fmsy). Fishing mortality is a measure for death or removal of fish from a population due to fishing. The fishing mortality consistent with achieving maximum sustainable yield is determined by the long-term average stock size that allows fishing at this level. For fisheries to be sustainable, F should not exceed Fmsy– the point at which the largest catch can be taken from a fish stock over an indefinite period without harming it.
14-30-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicator 14.4.1 "Proportion of fish stocks within biologically sustainable levels".
14-30-methodology: >-
  The Common Fisheries Policy aims to ensure the long-term sustainability of the sector by safeguarding stock reproduction for high long-term yield, improving distribution of fishing opportunities, conserving marine resources and supporting the profitability of the industry. The Marine Strategy Framework Directive takes a comprehensive and integrated approach to the protection of the marine environment and natural resources with the aim of achieving good environmental status of EU marine waters that are ecologically diverse, clean healthy and productive
14-30-long_term_objective: >-
   No description
14-40-title: Bathing sites with excellent water quality
14-40-definition: >-
  The indicator shows the share of inland and coastal bathing sites with excellent water quality in the EU and in other European countries. Bathing water quality is assessed according to standards for microbiological parameters (intestinal Enterococci and Escherichia coli). The indicator is calculated based on the moving average of at least 16 sampling events in four years to be sure that a realistic bathing water classification is achieved. 
  The Bathing Water Directive (BWD) requires Member States to identify and assess the quality of all inland and marine bathing waters and to classify these waters as ‘poor’, ‘sufficient’, ‘good’ or ‘excellent’ depending on the levels of faecal bacteria detected.
14-40-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development, and towards SDG 6 on ensuring availability and sustainable management of water and sanitation for all which are embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
14-40-methodology: >-
  The EU Bathing Water Directive is one of the success stories in EU water policy, aimed to protect human health and the environment by complementing the Water Framework Directive.
14-40-long_term_objective: >-
  The long-term objective for this indicator is a value of 100.
14-50-title: Global mean surface seawater acidity
14-50-definition: >-
  This indicator shows the yearly mean concentration of hydrogen ions in surface seawater in the northeastern Atlantic and adjacent seas, expressed in nanomoles per litre (nmol/l). An increase in the concentration of hydrogen ions corresponds to a decline in pH value and an increase in seawater acidity. 
  This trend is caused by an increase in atmospheric carbon dioxide (CO2) concentrations, which increases the uptake of CO2 by the ocean. The Copernicus Marine Service has reconstructed the trends in global ocean acidification from 1985 onwards.
14-50-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicator 14.3.1 "Average marine acidity (pH) measured at agreed suite of representative sampling stations".
14-50-methodology: >-
  SDG 14 aims to protect and ensure the sustainable use of oceans. This includes the reduction of marine pollution and the impacts of ocean acidification, the ending of overfishing and the conservation of marine and coastal areas and ecosystems. SDG 14 has strong interdependencies with a broad range of other SDGs, as oceans sustain coastal economies and livelihoods, contribute to food production and function as a carbon sink.
  Recognising the limitations of tackling ocean governance at a Member State or European level, the EU is working to ensure a stronger system of ocean governance to achieve the conservation and sustainable use of both regional and international waters. The EU has also a range of strategies which aim to mitigate climate change and reduce greenhouse gas (GHG) emissions including CO2.
14-50-long_term_objective: >-
  No description
14-60-title: Marine waters affected by eutrophication
14-60-definition: >-
  The indicator shows the share of eutrophic marine waters in the Exclusive Economic Zone (EEZ). An area is classified as eutrophic if for more than 25 % of the observation days of a given year the chlorophyll concentrations as a proxy for eutrophication are above the 90th percentile of the 1998–2017 reference base line.
  Eutrophication is the process by which an excess of nutrients – mainly phosphorus and nitrogen – leads to increased growth of plant material, particularly algal blooms, in an aquatic body resulting in a decrease in water quality. This can, in turn, cause death by hypoxia of aquatic organisms. Anthropogenic activities, such as farming, agriculture, aquaculture, industry and sewage, are the main source of nutrient input in problem areas.
14-60-intention: >-
  Indicator is used to monitor progress towards SDG 14 on conserving and sustainably using the oceans, seas and marine recources for sustainable development, which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicator 14.1.1: (a) "Index of coastal eutrophication".
14-60-methodology: >-
  SDG 14 aims to achieve conservation and sustainable use of oceans, seas and marine resources, that also requires among other things preventing and reducing marine pollution and the impacts of ocean acidification.
  The Marine Strategy Framework Directive (MSFD) requires Member States to report on eutrophication for their regional seas every 6 years
14-60-long_term_objective: >-
  No description
15-11-title: Forest area
15-11-definition: >-
  The indicator measures the proportion of forest areas in comparison to the total surface area of the country. The data used for this indicator originate from the European Forest Accounts (EFA) and are consistent with the FAO definition of forest.
15-11-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.The indicator can be considered as identical to global SDG indicator 15.1.1 "Forest area as a proportion of total land area".
15-11-methodology: >-
  SDG 15 seeks to protect, restore and promote the conservation and sustainable use of terrestrial, inland-water and mountain ecosystems. This includes efforts to sustainably manage forests and halt deforestation, combat desertification, restore degraded land and soil, halt biodiversity loss and protect threatened species.
15-11-long_term_objective: >-
  The  European Commission's Forest Strategy 2030  focuses on planting at least 3 billion additional trees by 2030.
15-20-title: Terrestrial protected areas
15-20-definition: >-
  This indicator measures the extent and share of terrestrial protected areas, comprising nationally designated protected areas and Natura 2000 sites. A nationally designated area is an area protected by national legislation.
  The Natura 2000 sites are designated to safeguard Europe's species and habitats, listed under the EU Habitats and Birds Directives.
15-20-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
  The indicator can be considered as similar to the global SDG indicators 15.1.2 "Proportion of important sites for terrestrial and freshwater biodiversity that are covered by protected areas, by ecosystem type" and 15.4.1 "Coverage by protected areas of important sites for mountain biodiversity".
15-20-methodology: >-
  The EU Birds Directive and the Habitats Directive aim to maintain or restore a favourable conservation status of protected habitats and species, and safeguard their sustainable use and management. The Birds Directive protects all wild bird species and their habitats. The Habitats Directive protects more than 1 300 other rare, threatened or endemic species of wild animals and plants and 233 natural habitat types. In addition, Natura 2000 network of protected areas comprises sites designated under the Birds and Habitats Directives by EU Member States.
15-20-long_term_objective: >-
  The EU biodiversity strategy aims to protect at least 30% of land and sea in Europe including both nationally designated sites and Natura 2000 sites.
15-42-title: Drought impact on ecosystems
15-42-definition: >-
  This indicator shows the area impacted by drought by monitoring negative anomalies in vegetation productivity in areas with a severe soil moisture deficit during the growing season (more than one standard deviation from the long-term average - observed through remote sensing data at 500×500 meters resolution of the Copernicus EMS European Drought Observatory of the European Commission Joint Research Centre. 
  The indicator covers only agricultural droughts with soil moisture deficits causing reduced vegetation productivity due to insufficient precipitation, as opposed to hydrological droughts, which occur when low water supplies become apparent in streams, reservoirs, and groundwater levels, usually after many months of meteorological drought.
15-42-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
15-42-methodology: >-
  SDG 15 seeks to protect, restore and promote the conservation and sustainable use of terrestrial, inland-water and mountain ecosystems. This includes efforts to sustainably manage forests and halt deforestation, combat desertification, restore degraded land and soil, halt biodiversity loss and protect threatened species.
15-42-long_term_objective: >-
  The Soil Strategy for 2030 has set the goal of no net land take by 2050.
15-50-title: Area at risk of severe soil erosion by water
15-50-definition: >-
  The indicator estimates the area potentially affected by severe soil erosion by water such as rain splash, sheet-wash and rills (soil loss > 10 tonnes/hectare/year). This area is expressed in km2 and as a percentage of the total non-artificial, erodible area in the country. Where there is no land that is at risk of soil erosion by water of more than 10 tonnes per hectare, a country will have a zero value. Soil erosion may still be occurring in areas of those countries, but at a rate of less than 10 tonnes per hectare.
  These numbers are estimated using a modified version of the Revised Universal Soil Loss Equation model (RUSLE 2015), which delivers estimates on a 100 m resolution based on peer-reviewed input layers of rainfall erosivity, soil erodibility, topography, land use and management. The following classes of the CORINE Land Cover (CLC) nomenclature are included: Agricultural areas (2), forest and semi natural areas (3) excluding beaches, dunes, sand plains (3.3.1), bare rock (3.3.2), glaciers and perpetual snow (3.3.5). Generally, artificial, sandy, rocky and icy surfaces as well as wetlands and water bodies are not included.
15-50-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land and towards SDG 2 on ending hunger, achieving food security and improved nutrition and promoting sustainable agriculture which are embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
15-50-methodology: >-
  SDG 15 seeks to protect, restore and promote the conservation and sustainable use of terrestrial, inland-water and mountain ecosystems. This includes efforts to sustainably manage forests and halt deforestation, combat desertification, restore degraded land and soil, halt biodiversity loss and protect threatened species.
  SDG 2 seeks to end hunger and malnutrition and ensure access to safe, nutritious and sufficient food. Realising this goal will largely depend on promoting sustainable production systems and increasing investment in rural infrastructure and agricultural research and development.
  The Soil Strategy for 2030 recognises erosion as a threat to soil in the EU. Europe’s Common Agricultural Policy sets requirements to protect utilised agricultural areas against erosion and establishes a framework of standards that aim, among others, to contribute to preventing soil erosion.
15-50-long_term_objective: >-
  No description
15-60-title: Common bird index
15-60-definition: >-
  The indicator is a multi-species composite index, which measures the relative abundance of a selection of common bird species associated with specific habitats. Rare species are excluded. Three groups of bird species are represented: common farmland species (39 species), common forest species (34 species) and all common bird species (168 species; including farmland and forest species).
15-60-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land and towards SDG 2 on ending hunger, achieving food security and improved nutrition and promoting sustainable agriculture which are embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
15-60-methodology: >-
  SDG 15 seeks to protect, restore and promote the conservation and sustainable use of terrestrial, inland-water and mountain ecosystems. This includes efforts to sustainably manage forests and halt deforestation, combat desertification, restore degraded land and soil, halt biodiversity loss and protect threatened species.
  SDG 2 seeks to end hunger and malnutrition and ensure access to safe, nutritious and sufficient food. Realising this goal will largely depend on promoting sustainable production systems and increasing investment in rural infrastructure and agricultural research and development.
  Birds and the habitats of endangered and migratory bird species are protected under the Birds Directive. Many habitats used by birds are also protected under the Habitats Directive. The EU Biodiversity strategy for 2030 specifically states that these Nature Directives should be fully implemented in an effort to halt and reverse the trends of biodiversity loss.
15-60-long_term_objective: >-
  No description
15-61-title: Grassland butterfly index
15-61-definition: >-
  The EU grassland butterfly index integrates the population trends of 17 butterfly species monitored across the EU and is calculated from data from all 27 EU Member States. The start year of national time series ranges from 1990 until 2023, therefore the index is currently presented as an EU aggregate with smoothed values. The data are integrated and provided by the Butterfly Conservation Europe, European Butterfly Monitoring Scheme partnership, EMBRACE project.
15-61-intention: >-
  Indicator is used to monitor progress towards SDG 15 on protecting, restoring and promoting sustainable use of land which is embedded in the European Commission’s Priorities under 'Sustaining our quality of life: food security, water and nature'.
15-61-methodology: >-
  The EU Biodiversity strategy for 2030 aims to restore degraded ecosystems and to halt and reverse the decline of pollinators. The Habitats Directive and the Birds Directive play a central role in achieveing these targets. In June 2018, the European Commission adopted the first-ever EU initiative on pollinators including butterflies. The initiative sets the framework for an integrated approach to address the problem of declining pollinators in the EU and for a more effective use of existing tools and policies.
15-61-long_term_objective: >-
  No description
16-10-title: Standardised death rate due to homicid
16-10-definition: >-
  The indicator measures the standardised death rate of homicide and injuries inflicted by another person with the intent to injure or kill by any means, including ‘late effects’ from assault (International Classification of Diseases (ICD) codes X85 to Y09 and Y87.1). It does not include deaths due to legal interventions or war (ICD codes Y35 and Y36).
  Data on causes of death (COD) refer to the underlying cause which - according to the World Health Organisation (WHO) - is "the disease or injury which initiated the train of morbid events leading directly to death, or the circumstances of the accident or violence which produced the fatal injury". COD data are derived from death certificates
16-10-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which is embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
  The indicator can be considered as part of the global SDG indicator 16.1.2 "Conflict-related deaths per 100,000 population, by sex, age and cause".
16-10-methodology: >-
  On 24 July 2020, the European Commission set out an EU Security Union Strategy for the period from 2020 to 2025. As a core component of the strategy, the Commission defined a new way forward on internal security with actions in key areas: organised crime; terrorism and the prevention of violent radicalisation; resilience of our critical infrastructures and public spaces; cybercrime, including fighting child sexual abuse; law enforcement cooperation and information exchange; and research and innovation
  Safety is a crucial aspect in people’s lives. Insecurity of any kind is a source of fear and worry, which negatively affect quality of life. Physical insecurity includes all the external factors that could potentially put the individual’s physical integrity in danger. Criminal actions are one of the most obvious abuses of insecurity. Analyses of physical insecurity usually combine both subjective and objective aspects – the subjective perception of insecurity and the objective lack of safety as measured by crime statistics. As such, the indicator contributes to the understanding of the security of society.
16-10-long_term_objective: >-
  The long-term objective for this indicator is a value of 0.3.
16-20-title: Population reporting crime, violence or vandalism in their are
16-20-definition: >-
  The indicator shows the share of the population who reported facing a problem of crime, violence or vandalism in their local area. This describes the situation where the respondent feels crime, violence or vandalism in the area to be a problem for the household, although this perception is not necessarily based on personal experience.
16-20-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which are embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
  The indicator can be considered as similar to global SDG indicator 16.1.4 "Proportion of population that feel safe walking alone around the area they live after dark".".
16-20-methodology: >-
  Safety is a crucial aspect in people’s lives. Insecurity of any kind is a source of fear and worry, which negatively affect quality of life. Physical insecurity includes all the external factors that could potentially put the individual’s physical integrity in danger. Criminal actions are one of the most obvious abuses of insecurity. Analyses of physical insecurity usually combine both subjective and objective aspects – the subjective perception of insecurity and the objective lack of safety as measured by crime statistics. This indicator therefore complements the indicator on homicide rates by focussing on the perception of insecurity.
  The European Commission’s ProtectEU Strategy aims to increase the capabilities of EU Member States to protect societies and democracies from online and offline threats from terrorists, criminals, and hostile foreign actors. Furthermore, it will guarantee that security implications are considered in all future EU policies.
16-20-long_term_objective: >-
  The long-term objective for this indicator is a value of 4.
16-30-title: General government total expenditure on law courts
16-30-definition: >-
  The indicator measures the general government total expenditure on law courts according to the classification of the functions of government (COFOG). This includes expenditure on administration, operation or support of civil and criminal law courts and the judicial system, including enforcement of fines and legal settlements imposed by the courts and operation of parole and probation systems; legal representation and advice on behalf of government or on behalf of others provided by government in cash or in services. Law courts include administrative tribunals, ombudsmen and the like, and exclude prison administrations.
  In computing the per capita indicator, the average National Accounts (NA) population data of the reference year is used as denominator (calculated as the arithmetic mean of the population on 1st January of two consecutive years).
16-30-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which is embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
16-30-methodology: >-
  Well-functioning justice systems are an important structural condition on which EU Member States base their sustainable growth and social stability policies. Whatever the model of the national justice system or the legal tradition in which it is anchored, quality, independence and efficiency are among the essential parameters of an ‘effective justice system’. Improving the effectiveness of justice systems in Member States has been identified as a key component for structural reforms in the European Semester, the annual cycle for the coordination of economic policies at EU level. The Rule of Law Report assesses the situation of Member States’ justice systems and the EU Justice Scoreboard complements it by monitoring the efficiency, quality and independence of Member States’ justice systems. As a key part of the EU Justice Scoreboard, this indicator helps to assess the quality of the justice system.
16-30-long_term_objective: >-
 No description
16-40-title: 'Perceived independence of the justice system: very or fairly good'
16-40-definition: >-
  The indicator is designed to explore respondents’ perceptions about the independence of the judiciary across EU Member States, looking specifically at the perceived independence of the courts and judges in a country. Data on the perceived independence of the justice system stem from annual Flash Eurobarometer surveys starting in 2016 on behalf of the European Commission’s Directorate-General for Justice and Consumers. In this survey, respondents are asked to answer the following question: “From what you know, how would you rate the justice system in (THIS COUNTRY) in terms of the independence of courts and judges? Would you say it is very good, fairly good, fairly bad or very bad?”
16-40-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which is embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
16-40-methodology: >-
  In addition to sufficient financial resources, judges in law courts need to be able to make decisions without interference or pressure from policy or other economic actors, to ensure that individuals and businesses can fully enjoy their rights. Respect for the rule of law is a prerequisite for the protection of all fundamental values listed in the EU Treaties, including democracy and fundamental rights. Improving the effectiveness of justice systems in Member States has been identified as a key component for structural reforms in the European Semester. The Rule of Law Report assesses the situation of Member States’ justice systems and the EU Justice Scoreboard complements it by monitoring the efficiency, quality and independence of Member States’ justice systems.
16-40-long_term_objective: >-
  No description
16-50-title: Corruption Perceptions Index
16-50-definition: >-
  The indicator is a composite index based on a combination of surveys and assessments of corruption from 13 different sources, and scores and ranks countries based on how corrupt a country’s public sector is perceived to be, with a score of 0 representing a very high level of corruption and a score of 100 representing a very clean country. The CPI includes only sources that provide a score for a set of countries/territories and that measure perceptions of corruption in the public sector. For a country/territory to be included in the ranking, it must be included in a minimum of three of the CPI’s data sources. The CPI is published by Transparency International.
16-50-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which is embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
  The indicator can be considered as similar to global SDG indicator 16.5.2 "Proportion of businesses that had at least one contact with a public official and that paid a bribe to a public official, or were asked for a bribe by those public officials, during the previous 12 months".
16-50-methodology: >-
  Corruption inflicts financial damage by lowering investment levels, hampering the fair operation of the internal market and reducing public finances. It also causes social harm as organised crime groups use corruption to commit other serious crimes, such as trafficking in drugs and human beings. As there is no meaningful way to assess absolute levels of corruption in countries or territories on the basis of hard empirical data, capturing perceptions of corruption of those in a position to offer assessments of public sector corruption is so far the most reliable method of comparing relative corruption levels across countries.
16-50-long_term_objective: >-
  The long-term objective for this indicator is a value of 88.
16-70-title: Victims of trafficking in human beings by sex
16-70-definition: >-
  The indicator is a composite index based on a combination of surveys and assessments of corruption from 13 different sources, and scores and ranks countries based on how corrupt a country’s public sector is perceived to be, with a score of 0 representing a very high level of corruption and a score of 100 representing a very clean country. The CPI includes only sources that provide a score for a set of countries/territories and that measure perceptions of corruption in the public sector. For a country/territory to be included in the ranking, it must be included in a minimum of three of the CPI’s data sources. The CPI is published by Transparency International.
16-70-intention: >-
  Indicator is used to monitor progress towards SDG 16 on peace, justice and strong institutions, which is embedded in the European Commission’s Priorities under ‘A new era for European Defence and Security’ and ‘Protecting our democracy, upholding our values’.
16-70-methodology: >-
  Safety is a crucial aspect in people’s lives. Insecurity of any kind is a source of fear and worry, which negatively affect quality of life. Physical insecurity includes all the external factors that could potentially put the individual’s physical integrity in danger. Criminal actions are one of the most obvious causes of insecurity. Analyses of physical insecurity usually combine both subjective and objective aspects – the subjective perception of insecurity and the objective lack of safety as measured by crime statistics. This indicator therefore complements the indicator on homicide rates by focussing on the perception of insecurity.
  The European Commission’s ProtectEU Strategy aims to increase the capabilities of EU Member States to protect societies and democracies from online and offline threats from terrorists, criminals, and hostile foreign actors. Furthermore, it will guarantee that security implications are considered in all future EU policies.
16-70-long_term_objective: >-
  The long-term objective for this indicator is a value of 0.
17-10-title: Official development assistance as share of gross national income
17-10-definition: >-
  Official development assistance (ODA) consists of grants, loans and equity investments that are undertaken by the official sector with the objective of promoting economic development and welfare in developing countries. Disbursements record the actual international transfer of financial resources, or of goods or services valued at the cost of the donor. ODA is here presented as a share of Gross National Income (GNI). GNI at market prices equals Gross Domestic Product (GDP) minus primary income payable by resident units to non-resident units, plus primary income receivable by resident units from the rest of the world. The list of countries and territories eligible to receive ODA is determined by the OECD’s Development Assistance Committee.
17-10-intention: >-
  Indicator is used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security' and 'Protecting our democracy, upholding our values'.
  The indicator can be considered as similar to global SDG indicator 17.2.1 "Net official development assistance, total and to least developed countries, as a proportion of the OECD-DAC donors’ GNI".
  Advanced economies such as the EU can support developing countries to shift to sustainable — and country-led — development paths in various ways. This includes providing official development assistance (ODA). For this reason, there is a long-standing target of dedicating 0.7% of gross national income (GNI) to ODA.
17-10-methodology: >-
  The European Consensus on Development of June 2017 outlines the need to dedicate a high proportion of official development assistance to least developed countries (LDCs) and other low-income countries. Hence, 0.15-0.20 % of GNI should be allocated to LDCs in the short term, rising to 0.20 % by 2030. The Consensus takes a comprehensive approach to implementation, combining aid with other resources, with sound policies and a strengthened approach to Policy Coherence for Development.
17-10-long_term_objective: >-
  The long-term objective for this indicator is a value of 1.
17-20-title: EU financing to developing countries by financing source
17-20-definition: >-
  The indicator shows the total official and private EU financing to developing countries. These consist of net disbursements of Official Development Assistance (ODA), other official flows (OOFs), private flows (mainly foreign direct investment, FDI) and grants by private agencies and NGOs. 
  ODA consists of grants or concessional loans undertaken by the official sector with promotion of economic development and welfare in the recipient countries as the main objective. OOFs are transactions which do not meet the conditions for eligibility as ODA, either because they are not primarily aimed at development, or because they have a grant element of less than 25 %. Private flows include direct investment, bonds, export credits and multilateral private flows. 
  Grants by private agencies and national NGOs consists of funds for development assistance and relief, together with any additional contributions in kind, including, for instance proceeds from charity Christmas card sales or special appeals (for example, for disaster relief).
17-20-intention: >-
  Indicator s used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security' and 'Protecting our democracy, upholding our values'.
17-20-methodology: >-
  Goal 17, Official Development Assistance and other financial resources, whether public or private, domestic or international will be needed. 
  The EU pursues a coherent and supportive approach to development, where all financial flows to developing countries, including aid, investment and trade, work together with domestic resource mobilisation and good policies to help build capacity and support self-reliance in these countries. Thus, the indicator complements the indicator on development assistance.
17-20-long_term_objective: >-
  No description
17-31-title: EU imports from least developed countries
17-31-definition: >-
  This indicator is defined as the share of all extra-EU imports coming from the countries classified by the UN as least developed. It indicates to what extent products from these countries access the EU market. Information for this indicator is provided by enterprises with a trade volume above a set threshold and is collected on the basis of customs declarations. This information is then adjusted by Member States to account for the impact of trade under this threshold.
17-31-intention: >-
  Indicator is used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security' and 'Protecting our democracy, upholding our values'.
  The potential contribution of trade to sustainable development has long been acknowledged. The EU is leading the way towards a more equal global partnership with developing countries by taking a responsible approach to trade and investment policy, for instance through the ‘Trade for All’ strategy (2015) which aims to help developing countries participate more fully in the global market. Furthermore, the EU facilitates imports from developing countries by granting tariff reductions under its Generalised Scheme of Preferences and by providing ‘Aid for Trade’ targeted at supporting trade-related infrastructure, trade-related assistance and private sector development. Finally, the Cotonou Agreement regulates the EU’s relationship with 79 countries from Africa, the Caribbean and the Pacific (ACP), focusing on development cooperation, political cooperation as well as economic and trade cooperation.
17-31-methodology: >-
  The EU updated its Aid for Trade Strategy in 2017, to reflect the significant political changes both globally — in particular, the 2030 Agenda — and at the EU level, including the new European Consensus on Development and Trade for All. The updated strategy aims to enhance the coherence of aid for trade with other EU policies and instruments, including EU trade agreements and unilateral preference schemes. The focus on LDCs constitutes a key part of the updated strategy. In 2021, the EU conducted a review of its trade strategy, with a view to reflecting its new, more sustainable growth model as well as the SDGs.
17-31-long_term_objective: >-
  No description
17-40-title: General government gross debt
17-40-definition: >-
  The indicator is defined in the 2012 consolidated version of the Treaty on the Functioning of the European Union and furter elaborated in Council Regulation (EC) No 479/2009, as amended and Regulation (EU) No 549/2013 of the European Parliament and of the Council (ESA 2010) and subsequent legal amendments, supplemented by further interpretation and guidance from Eurostat, in particular the Manual on Government Deficit and Debt as the ratio of total government gross debt at nominal value outstanding at the end of the year to GDP at current market prices.
  The government debt is defined as the total consolidated gross debt at nominal value at the end of the year in the following categories of government liabilities (as defined in ESA 2010): currency and deposits (AF.2), debt securities (AF.3) and loans (AF.4). The general government sector comprises the subsectors of central government, state government, local government and social security funds.
17-40-intention: >-
  Indicator is used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security' and 'Protecting our democracy, upholding our values'.
17-40-methodology: >-
  To help others to advance their economies, it is pivotal to keep the EU’s own economies on a sustainable development path. Macroeconomic management that aims to ensure financial stability in the EU is therefore one pillar of the EU’s contribution to implementing the SDGs. Government debt should consequently be limited to a manageable level and not exceed 60 % of GDP, as laid down in the Treaty on the Functioning of the European Union. This forms the basis of the Stability and Growth Pact and the Excessive Deficit Procedure (EDP), which ensures fiscal sustainability. 
  In 2024, the ambitious reform of the EU’s economic governance framework, aimed at strengthening Member States’ debt sustainability and promoting sustainable and inclusive growth in all Member States, entered into force.
17-40-long_term_objective: >-
  No description
17-50-title: Shares of environmental taxes in total tax revenues
17-50-definition: >-
  The indicator measures the share of environmental taxes in total revenues from taxes and social contributions. Environmental taxes are defined as taxes whose tax base is a physical unit (or proxy of it) of something that has a proven, specific negative impact on the environment. Environmental tax revenues stem from four types of taxes: energy taxes (which contribute around three-quarters of the total), transport taxes (about one fifth of the total) and pollution and resource taxes (about 4 % of the total).
17-50-intention: >-
  Indicator is used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development which is embedded in the European Commission’s Priorities under 'A new era for European Defence and Security' and 'Protecting our democracy, upholding our values'.
17-50-methodology: >-
  In a global context, where consumption patterns in one region can severely impact production patterns elsewhere in the world, it is particularly important that prices reflect the real costs of consumption and production. They should, therefore, also include the payments for the damages activities cause to human health and the environment. EU policies such as the European Green Deal call for a shift from labour to energy and environmental taxes as part of a ‘greening’ of taxation systems, meaning that revenues from environmental taxes should increase relative to labour taxes. The European Semester monitors the progress towards the objectives laid down in the European strategies.
17-50-long_term_objective: >-
  No description
17-60-title: High-speed internet coverage, by type of area
17-60-definition: > -
  The indicator measures the share of households with fixed very high capacity network (VHCN) connection. Very high capacity network means either an electronic communications network that consists entirely of optical fibre elements at least up to the distribution point at the serving location, or an electronic communications network capable of delivering, under usual peak-time conditions, similar network performance in terms of available downlink and uplink bandwidth, resilience, error-related parameters, and latency and its variation. Data refer to both fibre to the premises (FTTP) and Data Over Cable Service Interface Specification (DOCSIS) 3.1. DOCSIS allows adding high-bandwidth data transfer to existing cable television systems. 'Rural areas' are defined as those with less than 100 people per km2.
17-60-intention: > -
  Indicator is used to monitor progress towards SDG 17 on revitalizing the global partnership for sustainable development and SDG 9 on industry, innovation and infrastructure. SDG 9 and 17 are embedded in the European Commission’s Priority under 'A new era for European Defence and Security'. SDG 17 is also embedded in the European Commission’s Priority 'Protecting our democracy, upholding our values'. Making Europe fit for the digital age is consequently one of the six Commission priorities for 2019–2024. The aim is to make the digital transformation work for people and businesses while helping to achieve the target of a climate-neutral Europe by 2050. SDG 17 recognises the importance of access to science, technology and innovation for sustainable development. The number of broadband internet subscriptions per 100 inhabitants is one of the indicators used by the UN to measure progress towards the related target. In its 2020 Digital Strategy, the European Commission emphasised the EU’s commitment towards developing a Global Digital Cooperation Strategy, which will reflect the SDGs.
17-60-methodology: > -
  In its 2016 Communication ‘Connectivity for a Competitive Digital Single Market — Towards a European Gigabit Society’, the European Commission set out a vision for a European gigabit society, operationalised through three objectives for 2025. The EU aims to have gigabit connectivity for places driving socio-economic developments, 5G coverage for all urban areas and all major terrestrial transport paths, and access for all European households to internet connectivity offering at least 100 Mbps. The Farm to Fork strategy reaffirmed this objective by calling for an acceleration of the roll-out of fast broadband internet in rural areas to achieve the objective of 100 % access by 2025. In March 2021, the Commission — in its 2030 Digital Compass — presented a vision and avenues for Europe’s digital transformation by 2030, focusing on four main areas : (1) skills, (2) secure and sustainable digital infrastructures, (3) digital transformation of businesses, and (4) digitalisation of public services.
17-60-long_term_objective: > -
  Building on the 2016 Communication, the Digital Compass defines the objective that by 2030 all European households should be covered by a gigabit network, with all populated areas covered by 5G.
