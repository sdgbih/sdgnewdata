1-1-1-title: People at risk of poverty or social exclusion
1-1-1-definition: >-
  This indicator corresponds to the sum of people who are: at risk of poverty after social transfers, 
  severely materially and socially deprived, or living in households with very low work intensity. 
  Individuals are counted only once, even if they are affected by more than one of these occurrences. 
  People are considered at risk of poverty if their income is below 60% of the national median 
  equivalent disposable income.
1-1-1-intention: >-
  Poverty and social exclusion limit people's opportunities to reach their full potential by affecting 
  health and reducing educational outcomes. Without effective social protection, the risk of poverty 
  is passed between generations, creating inequality and hindering sustainable economic growth. 
  The long-term objective for this indicator is a value of 0.
1-1-1-methodology: >-
  Based on the Europe-wide harmonised annual survey on income and living conditions (EU-SILC). 
  From 2020 onwards, data is not strictly comparable with previous years due to methodological 
  revisions and integration into the microcensus.
