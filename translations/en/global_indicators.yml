1-1-1-title: People at risk of poverty or social exclusion
1-1-1-definition: >-
  This indicator corresponds to the sum of people who are: at risk of poverty after social transfers, 
  severely materially and socially deprived, or living in households with very low work intensity. 
  Individuals are counted only once, even if they are affected by more than one of these occurrences. 
  People are considered at risk of poverty if their income is below 60% of the national median 
  equivalent disposable income.
1-1-1-intention: >-
  Poverty and social exclusion limit people's opportunities to reach their full potential by affecting 
  health and reducing educational outcomes. Without effective social protection, the risk of poverty 
  is passed between generations, creating inequality and hindering sustainable economic growth. 
  The long-term objective for this indicator is a value of 0.
1-1-1-methodology: >-
  Based on the Europe-wide harmonised annual survey on income and living conditions (EU-SILC). 
  From 2020 onwards, data is not strictly comparable with previous years due to methodological 
  revisions and integration into the microcensus.
1-2-1-title: Persons at risk of monetary poverty after social transfers
1-2-1-definition: >-
  The income quintile share ratio (S80/S20) is the ratio of total equivalised
  disposable income received by the top 20% of the population to that received
  by the bottom 20%. A higher value indicates greater income inequality. Data
  are drawn from the EU Survey on Income and Living Conditions (EU-SILC).
1-2-1-intention: >-
  Income inequality undermines social cohesion and limits life opportunities for
  those at the lower end of the income distribution. Reducing inequality is a
  prerequisite for sustainable and inclusive growth. Progress means a decreasing
  S80/S20 ratio over time.
1-2-1-methodology: >-
  Data are collected through EU-SILC. Equivalised disposable income is the total
  household income after tax and other deductions, divided by the equivalised
  household size. The survey is conducted annually in all participating countries.
1-3-1-title: Severe material and social deprivation rate by age group and sex
1-3-1-definition: >-
  This indicator measures the proportion of the population covered by at least
  one social protection benefit, including benefits related to old age, disability,
  sickness, unemployment, family and housing. It is expressed as a percentage of
  the total population. Data are based on EU-SILC.
1-3-1-intention: >-
  Effective social protection systems prevent poverty and reduce the impact of
  economic shocks on individuals and families. Broad coverage ensures that those
  in need receive timely support. Progress means extending effective coverage to
  all segments of the population.
1-3-1-methodology: >-
  Data are collected from EU-SILC, which gathers information on social transfers
  received by households. The indicator covers both contributory (insurance-based)
  and non-contributory (means-tested) benefits across all categories of social
  protection.
1-4-1-title: Persons living in households with very low work intensity, by age group
1-4-1-definition: >-
  The housing cost overburden rate is the proportion of the population living in
  households where total housing costs (net of housing allowances) represent more
  than 40% of total disposable household income. It is expressed as a percentage.
  Data are based on the EU Statistics on Income and Living Conditions (EU-SILC).
1-4-1-intention: >-
  Excessive housing costs reduce disposable income available for other necessities
  and increase the risk of poverty and social exclusion. Monitoring this indicator
  helps identify households under financial strain from housing costs. Progress
  means a reduction in the proportion of people overburdened by housing costs.
1-4-1-methodology: >-
  Data are collected through EU-SILC. Housing costs include rent, mortgage
  repayments, utilities and maintenance. Housing allowances are deducted from
  both costs and income before calculating the 40% threshold. The survey is
  conducted annually.
1-4-2-title: In work at risk of poverty rate
1-4-2-definition: >-
  The severe housing deprivation rate is the proportion of the population living
  in an overcrowded dwelling that also lacks at least one of the following: a
  bath or shower, an indoor flushing toilet, or has a leaking roof or damp walls.
  It is expressed as a percentage. Data are based on EU-SILC.
1-4-2-intention: >-
  Adequate housing is a fundamental human need and a key determinant of health
  and well-being. Severe housing deprivation directly impacts physical and mental
  health, educational attainment and social participation. Progress means a
  sustained reduction in the severe housing deprivation rate.
1-4-2-methodology: >-
  Data are collected through EU-SILC. Overcrowding is assessed relative to
  household size and composition. Housing quality deprivation covers structural
  problems (leaking roof, damp walls) and the absence of basic facilities
  (bath or shower, indoor toilet).
1-5-1-title: Housing cost overburden rate by poverty status
1-5-1-definition: >-
  This indicator tracks deaths and economic losses attributed to disaster events,
  including natural hazards such as floods, storms, droughts and extreme
  temperatures. It is used to assess population resilience to climate-related and
  other disaster events. Data are compiled from national civil protection
  authorities and international databases.
1-5-1-intention: >-
  Building resilience to disasters is key to protecting lives, livelihoods and
  development gains. Countries with effective disaster risk reduction strategies
  and social safety nets suffer fewer disaster-related deaths and smaller economic
  losses. Progress means a reduction in disaster-related mortality and losses.
1-5-1-methodology: >-
  Data are collected from national civil protection and emergency management
  authorities, complemented by international databases such as EM-DAT. The
  indicator covers disaster events that require emergency response and result
  in human or significant economic losses.
2-1-1-title: Consumer food price index
2-1-1-definition: >-
  The consumer food price index measures changes over time in the prices paid by
  consumers for food and non-alcoholic beverages. It is expressed as an index
  with a reference period equal to 100. Rising food prices can increase food
  insecurity, particularly among lower-income households. Data are compiled by
  Eurostat from national statistical authorities.
2-1-1-intention: >-
  Stable and affordable food prices are essential for ensuring access to adequate
  nutrition for all segments of the population. Sharp price increases
  disproportionately affect lower-income households and can push people into food
  insecurity. Monitoring this indicator contributes to the broader goal of
  ending hunger.
2-1-1-methodology: >-
  Data are based on the Harmonised Index of Consumer Prices (HICP) food
  sub-index, collected monthly by national statistical authorities using
  standardised Eurostat methodology. The index covers all food and non-alcoholic
  beverages following the COICOP classification.
2-2-1-title: Overweight and obesity rate in adults
2-2-1-definition: >-
  This indicator measures the proportion of adults aged 18 and over classified
  as overweight or obese based on Body Mass Index (BMI). Overweight is defined
  as BMI ≥ 25 kg/m² and obesity as BMI ≥ 30 kg/m². It is expressed as a
  percentage of the adult population. Data are collected through the European
  Health Interview Survey (EHIS).
2-2-1-intention: >-
  Overweight and obesity are major risk factors for non-communicable diseases
  including cardiovascular disease, type 2 diabetes and certain cancers. Rising
  obesity rates place significant burdens on healthcare systems and reduce healthy
  life expectancy. Progress means stabilising or reducing the prevalence of
  overweight and obesity.
2-2-1-methodology: >-
  Data are collected through the European Health Interview Survey (EHIS),
  conducted approximately every five years. BMI is calculated from self-reported
  height and weight. EHIS follows a harmonised methodology across all participating
  countries, enabling cross-country comparisons.
2-3-1-title: Farmland bird index
2-3-1-definition: >-
  The farmland bird index measures changes in the population of bird species
  associated with farmland habitats, using 1990 as the base year (index = 100).
  A decline in farmland bird populations indicates biodiversity loss driven by
  agricultural intensification. Data are collected from national bird monitoring
  schemes.
2-3-1-intention: >-
  The diversity of bird populations in agricultural landscapes is an indicator
  of the ecological health of farming systems. Stable or increasing bird
  populations signal that agricultural practices support biodiversity. Halting
  and reversing the decline in farmland bird populations is essential for
  sustainable food systems.
2-3-1-methodology: >-
  Data are compiled from national breeding bird surveys and reported to Eurostat.
  The index aggregates population trends across a representative set of bird
  species typical of farmland habitats. Results are smoothed to account for
  year-to-year variability in survey counts.
2-4-1-title: Area under organic farming
2-4-1-definition: >-
  This indicator measures the total agricultural area under organic farming,
  including both fully certified organic land and land currently in the conversion
  period. It is expressed as a percentage of the total utilised agricultural area
  (UAA). Data are based on national organic farming statistics compiled by Eurostat.
2-4-1-intention: >-
  Organic farming promotes biodiversity, reduces the use of synthetic pesticides
  and fertilisers, and supports sustainable soil and water management. Increasing
  the share of organic farmland is an important step towards more sustainable and
  resilient food production systems.
2-4-1-methodology: >-
  Data are collected through national farm surveys and agricultural statistics,
  compiled in accordance with EU organic farming regulations. Figures include
  land fully certified as organic as well as land in the conversion period,
  typically lasting two to three years.
2-5-3-title: Gross nitrogen balance on agricultural land
2-5-3-definition: >-
  The gross nitrogen balance (GNB) on agricultural land estimates the nitrogen
  surplus in the soil, calculated as the difference between nitrogen inputs
  (mineral fertilisers, manure, atmospheric deposition, biological fixation and
  crop residues) and outputs (crops and grass harvested). It is expressed in
  kilograms of nitrogen per hectare of agricultural land.
2-5-3-intention: >-
  Excess nitrogen in agricultural soils contributes to water pollution through
  nitrate leaching, greenhouse gas emissions and biodiversity loss. Reducing the
  nitrogen surplus is essential for sustainable agricultural practices that
  protect water bodies and the broader environment.
2-5-3-methodology: >-
  Data are compiled by Eurostat from national agricultural statistics on fertiliser
  use, livestock numbers and crop production. The GNB methodology follows the
  OECD/Eurostat approach for nutrient balance calculation and is updated annually.
2-6-0-title: Greenhouse gas emissions from agriculture
2-6-0-definition: >-
  This indicator measures total greenhouse gas (GHG) emissions from the
  agricultural sector, expressed in million tonnes of CO₂ equivalent. Agricultural
  emissions include methane from livestock and manure management, nitrous oxide
  from soils and carbon dioxide from on-farm energy use.
2-6-0-intention: >-
  Agriculture contributes significantly to total greenhouse gas emissions.
  Reducing agricultural emissions while maintaining food production is a key
  challenge for meeting climate targets. Progress means a reduction in total GHG
  emissions from agriculture without compromising food security.
2-6-0-methodology: >-
  Data are reported by national authorities under the UN Framework Convention on
  Climate Change (UNFCCC) and compiled by Eurostat. Emissions are estimated using
  IPCC methodology and cover all agricultural emission sources including enteric
  fermentation, manure management and agricultural soils.
3-1-1-title: Healthy life years at birth
3-1-1-definition: >-
  Healthy life years (HLY) at birth indicate the number of years a newborn is
  expected to live in good health, free from long-standing illness or disability.
  HLY are calculated by combining age-specific mortality rates with age-specific
  proportions of people reporting a limiting long-standing illness. The indicator
  is expressed in years and disaggregated by sex.
3-1-1-intention: >-
  Healthy life years go beyond life expectancy by measuring the quality as well
  as the length of life. Increasing HLY means people not only live longer but
  spend more years in good health. Progress means a sustained increase in healthy
  life years for both men and women.
3-1-1-methodology: >-
  HLY are calculated using the Sullivan method, combining mortality data with
  self-reported disability data from EU-SILC. The global activity limitation
  indicator (GALI) asks whether respondents have been limited in activities due
  to health problems for at least six months.
3-2-1-title: Under-five mortality rate
3-2-1-definition: >-
  The under-five mortality rate is the probability that a child born in a given
  year will die before reaching the age of five, expressed per 1,000 live births.
  It reflects the cumulative effect of multiple determinants of child survival
  including nutrition, healthcare access, sanitation and living conditions. Data
  are compiled from national vital statistics.
3-2-1-intention: >-
  Reducing child mortality is a fundamental measure of human development and
  of the effectiveness of health and social systems. High under-five mortality
  rates reflect inadequate healthcare access and poor living conditions. Progress
  means a steady reduction in preventable deaths among children under five.
3-2-1-methodology: >-
  Data are compiled from national civil registration and vital statistics systems.
  The rate is calculated from age-specific death rates for children under five.
  Eurostat compiles and validates data from national statistical authorities
  following harmonised definitions.
3-3-1-title: Smoking prevalence in adults
3-3-1-definition: >-
  This indicator measures the proportion of adults aged 15 and over who currently
  smoke tobacco products (including cigarettes, cigars and pipes) on a daily or
  occasional basis. It is expressed as a percentage of the total adult population.
  Data are collected through the European Health Interview Survey (EHIS).
3-3-1-intention: >-
  Tobacco use is the leading preventable cause of death globally, causing cancer,
  cardiovascular disease and chronic respiratory conditions. Reducing smoking
  prevalence is a key public health priority. Progress means a sustained decline
  in the proportion of adults who smoke.
3-3-1-methodology: >-
  Data are collected through the European Health Interview Survey (EHIS),
  conducted approximately every five years. Smoking status is self-reported. The
  survey uses a standardised questionnaire enabling cross-country comparisons
  across all EU member states and participating countries.
3-4-1-title: Standardised death rate from chronic diseases
3-4-1-definition: >-
  This indicator measures the standardised death rate from non-communicable
  chronic diseases, including cardiovascular diseases, cancer, diabetes and
  chronic respiratory diseases. It is expressed as deaths per 100,000 persons,
  standardised to the European Standard Population (ESP 2013). Data are compiled
  by Eurostat from national causes of death statistics.
3-4-1-intention: >-
  Non-communicable diseases are the leading cause of premature mortality in Europe.
  Reducing premature deaths from chronic diseases requires effective prevention,
  early detection and access to quality healthcare. Progress means a reduction in
  the standardised death rate from these diseases over time.
3-4-1-methodology: >-
  Data are based on causes of death statistics from national death registries. The
  standardised death rate eliminates the effect of different age structures when
  comparing populations, using the European Standard Population (ESP 2013) as
  the reference. Data are reported annually to Eurostat.
3-6-1-title: Road traffic accident fatality rate
3-6-1-definition: >-
  This indicator measures the number of persons killed in road traffic accidents
  per million inhabitants. A person is classified as a road traffic fatality if
  they die within 30 days of the accident as a result of injuries sustained.
  Data are compiled by Eurostat from national road safety databases.
3-6-1-intention: >-
  Road traffic injuries are a leading cause of death, particularly among young
  people. Reducing fatalities requires investment in infrastructure, vehicle
  safety standards, speed management and enforcement of traffic laws. Progress
  means a significant and sustained reduction in road deaths per million
  inhabitants.
3-6-1-methodology: >-
  Data are compiled from national road traffic accident databases. The 30-day
  fatality definition was standardised to harmonise counting across participating
  countries. Data are reported annually to Eurostat and verified against
  population statistics from national sources.
3-7-1-title: Adolescent birth rate
3-7-1-definition: >-
  The adolescent birth rate is the number of live births per 1,000 women aged
  15 to 19 years. It measures the prevalence of teenage pregnancies and reflects
  access to sexual and reproductive health education and services. Data are
  compiled from national vital statistics by Eurostat.
3-7-1-intention: >-
  High adolescent birth rates are associated with increased health risks for
  mother and child, and with reduced educational and economic opportunities for
  young women. Reducing the adolescent birth rate requires access to comprehensive
  sexual education and reproductive health services. Progress means a sustained
  decrease in births to adolescent women.
3-7-1-methodology: >-
  Data are compiled from national birth registrations and population statistics.
  The rate is calculated by dividing live births to women aged 15–19 by the total
  female population aged 15–19, multiplied by 1,000. Data are reported to Eurostat
  annually by national statistical authorities.
17-5-1-title: Internet users as share of population
17-5-1-definition: >-
  This indicator measures the proportion of individuals using the internet in the last three months, as a percentage of total population. Data are collected through the EU ICT Usage Survey.
17-5-1-intention: >-
  Internet access enables participation in the digital economy and access to information. Progress means a growing share of the population using the internet regularly.
17-5-1-methodology: >-
  Data are collected through the annual EU Survey on ICT Usage in Households and by Individuals. Published annually by Eurostat.
17-4-1-title: Trade openness
17-4-1-definition: >-
  Trade openness is measured as total exports plus imports of goods and services as a percentage of GDP. It indicates the degree of integration into the global trading system. Data are compiled from national accounts by Eurostat.
17-4-1-intention: >-
  Open trade promotes economic growth and development. Progress means maintaining openness in support of sustainable development goals.
17-4-1-methodology: >-
  Data are compiled from national accounts under ESA 2010. Exports and imports cover goods and services. Published annually by Eurostat.
17-3-1-title: Government debt as share of GDP
17-3-1-definition: >-
  General government consolidated gross debt as a percentage of GDP. Reflects fiscal sustainability and capacity to finance public investment. Data compiled by Eurostat under the Excessive Deficit Procedure.
17-3-1-intention: >-
  Sustainable public finances are essential for long-term development investment. Progress means maintaining debt at levels consistent with fiscal sustainability.
17-3-1-methodology: >-
  Data compiled by Eurostat under the Excessive Deficit Procedure (EDP). Published twice yearly for all EU member states and candidate countries.
17-2-1-title: Tax revenue as share of GDP
17-2-1-definition: >-
  Total tax revenue including social contributions as a percentage of GDP. Reflects the capacity of governments to mobilise domestic resources. Data compiled by Eurostat from national accounts.
17-2-1-intention: >-
  Adequate domestic resource mobilisation finances sustainable development. Progress means a stable and sufficient tax revenue base for public services.
17-2-1-methodology: >-
  Data compiled from national accounts under ESA 2010. Includes all compulsory levies and social contributions. Published annually by Eurostat.
17-1-1-title: Official development assistance as share of gross national income
17-1-1-definition: >-
  Net official development assistance (ODA) provided by donor countries as a percentage of gross national income (GNI). The internationally agreed target is 0.7% of GNI. Data compiled by the OECD DAC and Eurostat.
17-1-1-intention: >-
  ODA is a key source of development finance for lower-income countries. Progress means an increasing ODA-to-GNI ratio among donor countries.
17-1-1-methodology: >-
  Data compiled by the OECD Development Assistance Committee (DAC) and published by Eurostat. Covers bilateral and multilateral flows. Published annually.
16-5-1-title: Perceived independence of the justice system
16-5-1-definition: >-
  Proportion of the population who perceive courts as fairly or very independent. Reflects public trust in judicial institutions and rule of law. Data from EU Justice Scoreboard Eurobarometer surveys.
16-5-1-intention: >-
  Trust in judicial independence is fundamental to the rule of law. Progress means an increasing proportion of citizens perceiving justice as independent.
16-5-1-methodology: >-
  Data collected through annual Eurobarometer surveys. Respondents assess independence of courts from government and economic interests. Published in the EU Justice Scoreboard.
16-4-1-title: Prison population rate
16-4-1-definition: >-
  Number of persons held in prison per 100,000 inhabitants. Reflects criminal justice practices. Data compiled by Eurostat from national penitentiary statistics.
16-4-1-intention: >-
  Monitoring prison populations provides insight into criminal justice and rule of law. Imprisonment should be proportionate and consistent with fair justice principles.
16-4-1-methodology: >-
  Data compiled from national penitentiary administration statistics. Refers to total persons held on a reference date. Published annually by Eurostat.
16-3-1-title: Population reporting crime, violence or vandalism in their area
16-3-1-definition: >-
  Proportion of the population reporting experience of crime, violence or vandalism in their local area in the past year. Reflects perceptions of safety. Data collected through EU-SILC.
16-3-1-intention: >-
  Feeling safe is a dimension of quality of life. Progress means a reduction in the share of people reporting crime or violence in their area.
16-3-1-methodology: >-
  Data collected through EU-SILC. Respondents asked about crime, violence or vandalism experienced in their area. Published annually by Eurostat.
16-2-1-title: Corruption perceptions index
16-2-1-definition: >-
  Perceived level of public sector corruption, scored 0 (highly corrupt) to 100 (very clean). Based on expert assessments and business surveys. Compiled by Transparency International and used in Eurostat SDG monitoring.
16-2-1-intention: >-
  Corruption undermines public institutions and sustainable development. Progress means an improving (increasing) corruption perceptions score.
16-2-1-methodology: >-
  Compiled annually by Transparency International from multiple expert and business surveys. Scores normalised on a 0–100 scale. Published annually.
16-1-1-title: Intentional homicide rate
16-1-1-definition: >-
  Number of intentional homicides per 100,000 inhabitants. Defined as unlawful death inflicted with intent to cause death or serious injury. Data compiled by Eurostat from national criminal justice statistics.
16-1-1-intention: >-
  The homicide rate is one of the most reliable measures of violent crime and public safety. Progress means a sustained reduction in intentional homicide rates.
16-1-1-methodology: >-
  Data compiled by Eurostat from national police and criminal justice statistics following UNODC definitions. Published annually.
15-5-1-title: Invasive alien species
15-5-1-definition: >-
  Number of invasive alien species of EU concern established in member states under Regulation 1143/2014. Invasive species are a leading cause of biodiversity loss. Data maintained by the European Environment Agency.
15-5-1-intention: >-
  Invasive alien species threaten native biodiversity and ecosystem services. Progress means limiting the spread of invasive alien species.
15-5-1-methodology: >-
  Data maintained by the EEA based on national monitoring reports under the EU invasive alien species regulation. Published as part of the EU biodiversity monitoring framework.
15-4-1-title: Soil erosion by water
15-4-1-definition: >-
  Rate of soil loss caused by water erosion in tonnes per hectare per year. Soil erosion reduces agricultural productivity and degrades ecosystems. Estimated using the RUSLE2015 model by the JRC.
15-4-1-intention: >-
  Soil is a non-renewable resource. Reducing soil erosion is essential for sustainable land management and food security. Progress means a reduction in estimated soil loss rates.
15-4-1-methodology: >-
  Estimated using the Revised Universal Soil Loss Equation (RUSLE2015) model applied to European conditions. Published by the Joint Research Centre (JRC) and Eurostat.
15-3-1-title: Common bird index
15-3-1-definition: >-
  Index tracking changes in common bird populations across Europe using 1990 as base year (= 100). Birds are sensitive indicators of ecosystem health. Data compiled from national breeding bird surveys.
15-3-1-intention: >-
  Declining bird populations signal habitat degradation. Progress means halting and reversing the decline in common bird populations.
15-3-1-methodology: >-
  Data compiled from national breeding bird surveys via the Pan-European Common Bird Monitoring Scheme (PECBMS). Index aggregates trends for representative species. Published annually.
15-2-1-title: Protected terrestrial and freshwater areas
15-2-1-definition: >-
  Proportion of terrestrial and freshwater areas designated as protected, as a percentage of total land area. Includes Natura 2000 and nationally designated areas. Data compiled by Eurostat and the EEA.
15-2-1-intention: >-
  Protected areas are a cornerstone of biodiversity conservation. Progress means an increasing proportion of land and freshwater under effective protection.
15-2-1-methodology: >-
  Data compiled from national designations reported to the EEA. Natura 2000 forms the backbone of the EU network. Covers both terrestrial and freshwater habitats. Published annually.
15-1-1-title: Forest area as share of total land area
15-1-1-definition: >-
  Forest area as a percentage of total land area, covering forests and other wooded land. Monitors changes due to land use change, afforestation and deforestation. Data compiled by Eurostat from national forestry statistics.
15-1-1-intention: >-
  Forests are essential for biodiversity, carbon sequestration and livelihoods. Progress means maintaining or increasing the share of land covered by forests.
15-1-1-methodology: >-
  Data compiled from national forestry statistics under the Joint Forest Sector Questionnaire (JFSQ). Forest area defined per FAO criteria. Published periodically by Eurostat.
14-4-1-title: Coastal erosion
14-4-1-definition: >-
  Proportion of the coastline experiencing erosion as a percentage of total assessed coastline. Compiled by the EEA using satellite monitoring and the EUROSION database.
14-4-1-intention: >-
  Coastal erosion is accelerating due to sea level rise and human pressures. Progress means limiting the proportion of coastline experiencing erosion.
14-4-1-methodology: >-
  Data compiled by the EEA using Copernicus Land Monitoring and historical shoreline position comparisons. Published periodically.
14-3-1-title: Chlorophyll-a concentration in coastal and transitional waters
14-3-1-definition: >-
  Concentration of chlorophyll-a in coastal and transitional waters as a proxy for eutrophication. Higher concentrations indicate algal growth from nutrient pollution. Data compiled from marine monitoring programmes.
14-3-1-intention: >-
  Eutrophication degrades marine ecosystems. Reducing nutrient inputs is essential for healthy seas. Progress means stable or declining chlorophyll-a concentrations.
14-3-1-methodology: >-
  Data compiled from national marine monitoring and satellite remote sensing. Reported under the Marine Strategy Framework Directive and compiled by the EEA.
14-2-1-title: Fish stocks within sustainable levels
14-2-1-definition: >-
  Proportion of assessed commercial fish stocks in EU waters fished at or below maximum sustainable yield (MSY), expressed as a percentage of all assessed stocks. Data compiled by ICES.
14-2-1-intention: >-
  Overfishing depletes stocks and damages marine ecosystems. Progress means an increasing proportion of stocks fished within sustainable limits.
14-2-1-methodology: >-
  Based on stock assessments conducted by ICES. Sustainability assessed relative to MSY. Covers commercially important stocks in EU and adjacent waters. Published annually.
14-1-1-title: Marine protected areas
14-1-1-definition: >-
  Proportion of territorial seas and exclusive economic zones designated as marine protected areas (MPAs), as a percentage. Data compiled by the EEA from national designations.
14-1-1-intention: >-
  MPAs protect marine biodiversity and ecosystems. Progress means an increasing proportion of seas under effective marine protection.
14-1-1-methodology: >-
  Data compiled by the EEA from national designations under Natura 2000 and international conventions. Published annually.
13-4-1-title: Greenhouse gas emission intensity of energy consumption
13-4-1-definition: >-
  GHG emissions from energy use divided by gross inland energy consumption, expressed in grams of CO₂ equivalent per kilogram of oil equivalent. Reflects the carbon content of the energy mix. Compiled by Eurostat from national energy balances and GHG inventories.
13-4-1-intention: >-
  Decarbonising the energy system is central to climate action. Progress means a sustained reduction in the GHG emission intensity of energy.
13-4-1-methodology: >-
  Compiled by Eurostat from national energy balances and GHG inventories. Covers combustion and fugitive emissions. Published annually.
13-3-1-title: Climate-related economic losses
13-3-1-definition: >-
  Economic losses from weather and climate-related extreme events as a percentage of GDP. Includes floods, storms, droughts and heatwaves. Data compiled from civil protection databases and reinsurance sources.
13-3-1-intention: >-
  Climate change increases extreme weather events and economic losses. Progress means limiting economic losses from climate-related events through adaptation and mitigation.
13-3-1-methodology: >-
  Data compiled from national reports, CATDAT database and reinsurance sources. Covers insured and uninsured losses from weather-related events. Published periodically by Eurostat and the EEA.
13-2-1-title: Greenhouse gas emissions - energy sector
13-2-1-definition: >-
  Total GHG emissions from the energy sector in million tonnes of CO₂ equivalent. Covers combustion in power plants, refineries and other energy industries. Reported under UNFCCC and compiled by Eurostat.
13-2-1-intention: >-
  The energy sector is the largest source of GHG emissions. Decarbonising energy production is essential for meeting climate targets. Progress means a sustained reduction in energy sector emissions.
13-2-1-methodology: >-
  Reported by national authorities under UNFCCC using IPCC methodology. Covers CRF sector 1A (fuel combustion) and 1B (fugitive emissions). Published annually.
13-1-1-title: Greenhouse gas emissions index
13-1-1-definition: >-
  Total national GHG emissions (CO₂, CH₄, N₂O and F-gases) indexed to a base year, expressed as a percentage of base year emissions. Tracks overall progress in reducing emissions. Data reported under UNFCCC.
13-1-1-intention: >-
  Reducing total GHG emissions is the central objective of climate policy. Progress means a sustained declining trend in the emissions index.
13-1-1-methodology: >-
  Data reported by national authorities under UNFCCC using IPCC methodology. Covers all sectors. Published annually by Eurostat.
12-5-1-title: Circular material use rate
12-5-1-definition: >-
  Share of material recovered and reused as a proportion of overall material use. Indicates progress towards a circular economy. Compiled by Eurostat from waste and material flow statistics.
12-5-1-intention: >-
  Increasing circular material use reduces extraction, waste and environmental pressures. Progress means an increasing circular material use rate.
12-5-1-methodology: >-
  Calculated as recycled waste used as raw material inputs divided by overall material use. Compiled by Eurostat annually from waste statistics and material flow accounts.
12-4-1-title: Greenhouse gas emissions intensity of production
12-4-1-definition: >-
  Total GHG emissions per unit of GDP in kilograms of CO₂ equivalent per GDP unit (constant prices). Tracks decoupling of economic growth from emissions. Compiled by Eurostat.
12-4-1-intention: >-
  Reducing GHG intensity is essential for sustainable production. Progress means a sustained decline in emissions per unit of GDP.
12-4-1-methodology: >-
  Compiled from national GHG inventories and national accounts under ESA 2010. Published annually by Eurostat.
12-3-1-title: Recycling rate of municipal waste
12-3-1-definition: >-
  Proportion of municipal waste that is recycled, expressed as a percentage of total waste generated. Covers material recycling and composting. Data compiled by Eurostat from national waste statistics.
12-3-1-intention: >-
  Increasing recycling reduces landfilling and resource extraction. Progress means an increasing share of municipal waste being recycled.
12-3-1-methodology: >-
  Compiled by Eurostat from national waste statistics under the Waste Statistics Regulation. Includes material recycling and composting. Published annually.
12-2-1-title: Municipal waste generated per capita
12-2-1-definition: >-
  Total municipal waste generated per inhabitant per year in kilograms. Includes household waste and similar sources. Data compiled by Eurostat from national waste statistics.
12-2-1-intention: >-
  Reducing waste generation is the first priority in the waste hierarchy. Progress means a declining trend in municipal waste per capita.
12-2-1-methodology: >-
  Compiled by Eurostat from national waste statistics under the Waste Statistics Regulation. Data are published annually.
12-1-1-title: Resource productivity
12-1-1-definition: >-
  GDP divided by domestic material consumption (DMC), expressed in euros per kilogram. Higher resource productivity means more economic output per unit of material. Data compiled by Eurostat from material flow accounts.
12-1-1-intention: >-
  Improving resource productivity decouples growth from material use and reduces environmental pressures. Progress means a sustained increase in resource productivity.
12-1-1-methodology: >-
  Calculated using GDP and domestic material consumption from material flow accounts (MFA). Both indicators compiled under the EU material flow accounts framework. Published annually.
11-5-1-title: Share of rail transport in passenger transport
11-5-1-definition: >-
  Share of rail in total inland passenger transport, expressed as a percentage of passenger-kilometres. Reflects use of sustainable alternatives to private cars. Data compiled by Eurostat from national transport statistics.
11-5-1-intention: >-
  Rail transport is more energy-efficient and less polluting than private cars. Progress means an increasing share of rail in total passenger transport.
11-5-1-methodology: >-
  Data compiled by Eurostat from national transport statistics. Measured in passenger-kilometres. Rail compared to total inland passenger transport. Published annually.
11-4-1-title: Population exposure to air pollution by PM2.5
11-4-1-definition: >-
  Population-weighted mean annual exposure to fine particulate matter (PM2.5) in micrograms per cubic metre. PM2.5 causes respiratory and cardiovascular disease. Data compiled by the EEA from air quality monitoring networks.
11-4-1-intention: >-
  Air pollution is the leading environmental cause of premature death in Europe. Progress means a sustained reduction in population-weighted PM2.5 exposure.
11-4-1-methodology: >-
  Compiled by the EEA from national monitoring networks under the Ambient Air Quality Directive. Population-weighted using modelled concentrations and population density. Published annually.
11-3-1-title: Recycling rate of municipal waste (urban)
11-3-1-definition: >-
  Recycling rate of municipal waste in urban areas as a percentage of total waste generated. Reflects progress in sustainable urban waste management. Data compiled by Eurostat.
11-3-1-intention: >-
  Sustainable cities need efficient waste management. Increasing recycling in urban areas supports the circular economy. Progress means an increasing urban recycling rate.
11-3-1-methodology: >-
  Compiled from national waste statistics under the Waste Statistics Regulation. Includes material recycling and composting. Published annually.
11-2-1-title: Overcrowding rate
11-2-1-definition: >-
  Proportion of the population living in overcrowded dwellings (too few rooms relative to household size), expressed as a percentage. Reflects inadequate housing, especially in urban areas. Data collected through EU-SILC.
11-2-1-intention: >-
  Overcrowding affects health and quality of life. Progress means a sustained reduction in the proportion living in overcrowded dwellings.
11-2-1-methodology: >-
  Data collected through EU-SILC using a standardised room-to-person ratio definition. Published annually by Eurostat.
11-1-1-title: Population living in cities
11-1-1-definition: >-
  Proportion of the total population living in cities (urban areas), expressed as a percentage. Monitors urbanisation trends. Data compiled by Eurostat using the Degree of Urbanisation classification.
11-1-1-intention: >-
  Cities drive growth but face challenges of congestion and inequality. Monitoring urbanisation helps plan for sustainable cities. Progress requires urban growth accompanied by adequate infrastructure and services.
11-1-1-methodology: >-
  Compiled using the Degree of Urbanisation (DEGURBA) methodology. Cities defined as areas with at least 50,000 inhabitants and density above 1,500/km². Published periodically by Eurostat.
10-5-1-title: Gini coefficient of equivalised disposable income
10-5-1-definition: >-
  Gini coefficient measuring inequality in the distribution of equivalised disposable income. Ranges from 0 (perfect equality) to 100 (maximum inequality). Data collected through EU-SILC.
10-5-1-intention: >-
  Income inequality limits opportunities and social mobility. Progress means a declining Gini coefficient reflecting more equal income distribution.
10-5-1-methodology: >-
  Data collected through EU-SILC. Gini coefficient calculated from the full income distribution using equivalised disposable income. Published annually by Eurostat.
10-4-1-title: Asylum applicants per million inhabitants
10-4-1-definition: >-
  Number of persons applying for international protection per million inhabitants. Reflects migration pressures and protection needs. Data compiled by Eurostat from national asylum authorities.
10-4-1-intention: >-
  Ensuring safe and orderly migration and protection is a dimension of reducing inequalities. Monitoring asylum applications helps assess migration dynamics and policy responses.
10-4-1-methodology: >-
  Compiled from national asylum authorities under EU asylum statistics regulations. Covers persons lodging applications for international protection. Published monthly and annually by Eurostat.
10-3-1-title: Income share of the bottom 40% of the population
10-3-1-definition: >-
  Share of total equivalised disposable income received by the bottom 40% of the income distribution, expressed as a percentage. Higher share indicates more equal distribution. Data from EU-SILC.
10-3-1-intention: >-
  Monitoring the bottom 40% income share directly measures inclusive growth. Progress means an increasing income share for the poorest 40%.
10-3-1-methodology: >-
  Data collected through EU-SILC. Equivalised disposable income ranked and cumulative share of bottom 40% calculated. Published annually by Eurostat.
10-2-1-title: Relative median at-risk-of-poverty gap
10-2-1-definition: >-
  Difference between the median income of people below the poverty threshold and the threshold itself, expressed as a percentage of the threshold. Measures the depth of poverty. Data from EU-SILC.
10-2-1-intention: >-
  The poverty gap shows how far below the poverty line the poor are. Progress means a reduction in the gap, reflecting improved incomes among those at risk of poverty.
10-2-1-methodology: >-
  Data from EU-SILC. Poverty threshold set at 60% of national median equivalised disposable income. Gap expressed as percentage of threshold. Published annually by Eurostat.
10-1-1-title: Income quintile share ratio (S80/S20)
10-1-1-definition: >-
  Ratio of total equivalised disposable income of the richest 20% to that of the poorest 20% of the population. Measures income inequality. Higher values indicate greater inequality. Data from EU-SILC.
10-1-1-intention: >-
  Income inequality limits social mobility and cohesion. Progress means a declining S80/S20 ratio reflecting a narrowing gap between richest and poorest.
10-1-1-methodology: >-
  Data collected through EU-SILC using equivalised disposable income. Divides total income of top quintile by that of bottom quintile. Published annually by Eurostat.
9-6-1-title: Share of rail and inland waterways in freight transport
9-6-1-definition: >-
  This indicator measures the share of rail and inland waterways in total inland
  freight transport, expressed as a percentage of total tonne-kilometres. It
  reflects the modal split of freight transport and the use of more sustainable
  modes. Data are compiled by Eurostat from national transport statistics.
9-6-1-intention: >-
  Shifting freight from road to rail and inland waterways reduces greenhouse gas
  emissions, congestion and accidents. Increasing the share of these sustainable
  modes is a key EU transport policy objective. Progress means an increasing
  share of rail and inland waterways in total inland freight transport.
9-6-1-methodology: >-
  Data are compiled by Eurostat from national transport statistics under EU
  transport data regulations. Freight transport is measured in tonne-kilometres.
  Rail and inland waterways are compared to total inland freight (road, rail
  and inland waterways combined). Data are published annually.
9-5-1-title: Households with broadband internet access
9-5-1-definition: >-
  This indicator measures the proportion of households with broadband internet
  access, expressed as a percentage of all households. Broadband includes fixed
  (DSL, cable, fibre) and mobile broadband connections. Data are collected through
  the EU Survey on ICT Usage in Households and by Individuals.
9-5-1-intention: >-
  Broadband access is essential for participation in the digital economy, access
  to public services and social inclusion. Expanding access, particularly in rural
  areas, is key to reducing the digital divide. Progress means an increasing
  proportion of households connected to broadband.
9-5-1-methodology: >-
  Data are collected through the EU ICT Survey, conducted annually. The indicator
  covers fixed and mobile broadband connections with download speeds of at least
  144 Kbps. Data are published annually by Eurostat.
9-4-1-title: Share of high-tech exports in total exports
9-4-1-definition: >-
  This indicator measures the share of high-technology products in total exports
  of manufactured goods, expressed as a percentage. High-technology products have
  high R&D intensity, such as aerospace, computers, pharmaceuticals and
  electronics. Data are compiled by Eurostat from trade statistics.
9-4-1-intention: >-
  A high share of high-tech exports reflects technological competitiveness and
  innovation capacity. Developing high-tech industries supports quality job
  creation and sustainable growth. Progress means an increasing share of
  high-technology products in total exports.
9-4-1-methodology: >-
  Data are compiled from trade statistics (COMEXT) using the OECD definition of
  high-technology sectors. High-technology products are classified using the
  Standard International Trade Classification (SITC). Data are published annually
  by Eurostat.
9-3-1-title: Patent applications to the European Patent Office
9-3-1-definition: >-
  This indicator measures the number of patent applications filed with the
  European Patent Office (EPO) per million inhabitants. Patents protect inventions
  and indicate innovation output. A higher number reflects greater innovative
  activity. Data are compiled by Eurostat from EPO records.
9-3-1-intention: >-
  Patent applications are a widely used proxy for innovation output. Countries
  with strong patent activity benefit from technological progress and competitive
  advantage. Progress means a sustained increase in patent applications per
  million inhabitants.
9-3-1-methodology: >-
  Data are compiled by Eurostat from EPO records based on the residence of the
  inventor. Applications are counted at the priority date and attributed to the
  year of first filing. Data are published annually.
9-2-1-title: Researchers in full-time equivalents per million inhabitants
9-2-1-definition: >-
  This indicator measures the number of researchers in full-time equivalents
  (FTE) per million inhabitants. Researchers are professionals engaged in
  creating new knowledge, products, processes and systems. Data are compiled by
  Eurostat from national R&D statistics.
9-2-1-intention: >-
  Researchers are a key input to the innovation process. A larger research
  workforce drives scientific progress and economic competitiveness. Progress
  means an increasing number of researchers per million inhabitants across all
  sectors of the economy.
9-2-1-methodology: >-
  Data are compiled by Eurostat from R&D surveys following the OECD Frascati
  Manual. Researchers are counted in full-time equivalents to account for
  part-time work. Data cover business enterprise, government, higher education
  and private non-profit sectors.
9-1-1-title: Research and development expenditure as share of GDP
9-1-1-definition: >-
  This indicator measures gross domestic expenditure on research and development
  (GERD) as a percentage of GDP. R&D expenditure covers all creative and
  systematic work to increase knowledge and devise new applications. It is a key
  indicator for monitoring innovation intensity. Data are compiled by Eurostat
  from national R&D surveys.
9-1-1-intention: >-
  Investment in R&D is a key driver of innovation, competitiveness and long-term
  productivity growth. Increasing R&D expenditure helps develop new technologies,
  improve processes and create high-quality jobs. Progress means a sustained
  increase in R&D expenditure as a share of GDP.
9-1-1-methodology: >-
  Data are collected through national R&D surveys following the OECD Frascati
  Manual. GERD covers all R&D performed on national territory regardless of
  funding source, including basic research, applied research and experimental
  development. Data are published annually by Eurostat.
8-6-1-title: Fatal accidents at work
8-6-1-definition: >-
  This indicator measures the number of fatal accidents at work per 100,000
  persons employed. A fatal accident at work is defined as an accident that
  leads to the death of the victim within one year of the accident. Data are
  collected through the European Statistics on Accidents at Work (ESAW).
8-6-1-intention: >-
  Ensuring safe and healthy working conditions is a fundamental dimension of
  decent work. Fatal accidents at work represent a preventable loss of life
  with severe consequences for workers, families and society. Progress means
  a sustained reduction in the rate of fatal accidents at work.
8-6-1-methodology: >-
  Data are compiled by Eurostat through the European Statistics on Accidents
  at Work (ESAW) methodology. The indicator covers all accidents at work that
  result in the death of the victim within one year. Data are published annually.
8-5-1-title: Young people neither in employment nor in education or training (NEET)
8-5-1-definition: >-
  The NEET rate measures the proportion of young people aged 15 to 29 who are
  not in employment, education or training, expressed as a percentage of the
  total population in that age group. It identifies young people at risk of
  labour market exclusion and social marginalisation. Data are based on the
  EU Labour Force Survey.
8-5-1-intention: >-
  Young people who are NEET face long-term risks to their employment prospects,
  earnings and social integration. Reducing the NEET rate requires investment
  in education, vocational training and active labour market policies. Progress
  means a sustained reduction in the proportion of young people outside
  employment, education and training.
8-5-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). NEET status
  combines information on employment status and participation in education or
  training in the four weeks preceding the survey. Data are published annually.
8-4-1-title: Long-term unemployment rate
8-4-1-definition: >-
  The long-term unemployment rate is the proportion of people who have been
  unemployed for 12 months or more, expressed as a percentage of the active
  labour force. Long-term unemployment indicates a structural labour market
  problem associated with skills deterioration and social exclusion. Data are
  based on the EU Labour Force Survey.
8-4-1-intention: >-
  Long-term unemployment erodes skills, reduces employability and increases the
  risk of poverty and social exclusion. Addressing it requires active labour
  market policies, retraining programmes and social support. Progress means a
  sustained reduction in the long-term unemployment rate.
8-4-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). Unemployment
  follows ILO standards: persons without a job, available for work and actively
  seeking employment. The long-term unemployed have been unemployed for 12
  months or more. Data are published annually by Eurostat.
8-3-1-title: Employment rate
8-3-1-definition: >-
  The employment rate is the proportion of persons aged 20 to 64 who are in
  employment, expressed as a percentage of the total population in that age
  group. It is one of the most widely used indicators of labour market
  performance. Data are based on the EU Labour Force Survey (EU-LFS).
8-3-1-intention: >-
  A high employment rate is central to economic prosperity, social inclusion
  and the sustainability of social protection systems. Increasing employment
  requires policies supporting job creation, skills development and removing
  barriers to participation. Progress means a sustained increase in the
  employment rate.
8-3-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). Employment
  follows ILO standards: persons who worked at least one hour for pay or profit
  during the reference week. Data are published annually and quarterly by
  Eurostat.
8-2-1-title: Gross fixed capital formation as share of GDP
8-2-1-definition: >-
  This indicator measures gross fixed capital formation (investment in physical
  assets such as machinery, buildings and infrastructure) as a percentage of
  GDP. It reflects the level of investment in the economy and its capacity for
  future growth. Data are compiled by Eurostat from national accounts.
8-2-1-intention: >-
  Investment in physical capital is a key driver of productivity growth and
  long-term economic development. Adequate investment levels support innovation,
  job creation and infrastructure improvements. Progress means maintaining or
  increasing the investment share of GDP at levels consistent with sustainable
  growth.
8-2-1-methodology: >-
  Data are compiled from national accounts reported under the European System
  of Accounts (ESA 2010). Gross fixed capital formation covers acquisitions of
  fixed assets minus disposals by resident producers. Data are published annually
  by Eurostat.
8-1-1-title: Real GDP per capita
8-1-1-definition: >-
  Real GDP per capita is gross domestic product at market prices divided by the
  mid-year population, expressed in chain-linked volumes. It is the most commonly
  used indicator of economic output and living standards. Growth rates reflect
  economic performance adjusted for inflation. Data are compiled by Eurostat
  from national accounts.
8-1-1-intention: >-
  Sustained, inclusive and sustainable economic growth is essential for reducing
  poverty and improving living standards. Real GDP per capita growth reflects
  improvements in productivity and economic well-being. Progress means a positive
  and sustained growth rate in real GDP per capita.
8-1-1-methodology: >-
  Data are compiled from national accounts under the European System of Accounts
  (ESA 2010). Real GDP uses chain-linked volume measures to remove price effects.
  Per capita figures use mid-year population estimates. Data are published
  annually by Eurostat.
7-6-1-title: Population unable to keep home adequately warm
7-6-1-definition: >-
  This indicator measures the proportion of the population that is unable to
  keep their home adequately warm, as a share of total population. It is one
  of the key indicators of energy poverty in Europe. Data are collected through
  the EU Statistics on Income and Living Conditions (EU-SILC).
7-6-1-intention: >-
  Energy poverty affects health, well-being and quality of life, particularly
  for low-income households. Ensuring that all people can afford to heat their
  homes is a fundamental dimension of affordable and clean energy. Progress means
  a sustained reduction in the share of the population experiencing energy poverty.
7-6-1-methodology: >-
  Data are collected through EU-SILC, which asks respondents whether they can
  afford to keep their home adequately warm. The indicator is expressed as a
  percentage of the total population. Data are collected annually and published
  by Eurostat.
7-5-1-title: Energy import dependency
7-5-1-definition: >-
  The energy import dependency rate shows the extent to which an economy relies
  on energy imports to meet its energy needs. It is calculated as net energy
  imports divided by gross inland energy consumption, expressed as a percentage.
  A higher rate means greater dependence on imported energy.
7-5-1-intention: >-
  High energy import dependency exposes economies to energy supply disruptions
  and price volatility. Reducing dependency through energy efficiency and
  renewable energy development supports energy security and sustainability.
  Progress means a reduction in the energy import dependency rate.
7-5-1-methodology: >-
  Data are compiled by Eurostat from national energy statistics submitted under
  EU energy statistics regulations. Gross inland energy consumption covers all
  energy needed to meet domestic demand. Net imports are calculated as imports
  minus exports and stock changes.
7-4-1-title: Final energy consumption
7-4-1-definition: >-
  Final energy consumption measures the total energy consumed by end users
  (industry, transport, households, services and agriculture), excluding energy
  used by the energy sector itself. It is expressed in million tonnes of oil
  equivalent (Mtoe) and serves as a key indicator of energy demand. Data are
  compiled by Eurostat from national energy balances.
7-4-1-intention: >-
  Reducing final energy consumption is essential for meeting climate targets and
  improving energy security. Energy efficiency improvements allow economic growth
  to decouple from energy use. Progress means a sustained reduction in final
  energy consumption while maintaining economic activity.
7-4-1-methodology: >-
  Data are compiled by Eurostat from national energy balances reported under EU
  energy statistics regulations. Final energy consumption excludes non-energy use
  and energy consumed by the energy transformation sector. Data are reported
  annually in tonnes of oil equivalent.
7-3-1-title: Primary energy consumption
7-3-1-definition: >-
  Primary energy consumption measures the total energy demand of a country,
  covering consumption of all energy forms before any transformation process.
  It is expressed in million tonnes of oil equivalent (Mtoe). It includes energy
  used by the energy sector, distribution losses and final consumption by all
  sectors.
7-3-1-intention: >-
  Reducing primary energy consumption while maintaining economic output is key
  to improving energy efficiency and meeting climate targets. Decoupling economic
  growth from energy consumption is central to sustainable development. Progress
  means a declining trend in primary energy consumption relative to economic
  output.
7-3-1-methodology: >-
  Data are compiled by Eurostat from national energy balances submitted under
  EU energy statistics regulations (Regulation EC No 1099/2008). Primary energy
  consumption is calculated using the substitution method for nuclear and
  renewable electricity. Data are published annually.
7-2-1-title: Share of renewable energy in gross final energy consumption
7-2-1-definition: >-
  This indicator measures the share of energy from renewable sources (wind,
  solar, hydro, geothermal, ocean, biomass and biofuels) in gross final energy
  consumption, expressed as a percentage. It covers renewable energy used in
  electricity, heating and cooling, and transport. Data are compiled by Eurostat
  from national energy statistics.
7-2-1-intention: >-
  Increasing the share of renewable energy is essential for reducing greenhouse
  gas emissions from the energy sector and achieving climate targets. Renewables
  also contribute to energy security and long-term cost reductions. Progress
  means a sustained increase in the renewable energy share in total energy
  consumption.
7-2-1-methodology: >-
  Data are compiled by Eurostat from national energy statistics reported under
  Directive 2009/28/EC (Renewable Energy Directive) and its successor
  Directive 2018/2001/EU. Gross final energy consumption includes energy
  delivered to end users plus grid losses in electricity and distribution losses
  in heat networks.
7-1-1-title: Energy productivity
7-1-1-definition: >-
  Energy productivity measures how much economic output is generated per unit
  of energy consumed. It is calculated as GDP divided by gross inland energy
  consumption and expressed in euros per kilogram of oil equivalent (EUR/kgoe).
  A higher value indicates more efficient use of energy to generate economic
  output.
7-1-1-intention: >-
  Improving energy productivity is central to decoupling economic growth from
  energy consumption and reducing environmental pressures. More productive use
  of energy lowers costs for businesses and households and reduces emissions.
  Progress means a sustained increase in energy productivity over time.
7-1-1-methodology: >-
  Energy productivity is calculated by Eurostat using GDP data (chain-linked
  volumes, reference year 2010) and gross inland energy consumption from national
  energy balances. Both indicators are compiled under EU energy statistics
  regulations. Data are published annually.
6-5-1-title: Water bodies with good ecological status
6-5-1-definition: >-
  This indicator measures the proportion of surface water bodies (rivers, lakes,
  transitional and coastal waters) achieving good or high ecological status or
  potential, as defined by the EU Water Framework Directive. It is expressed as
  a percentage of all assessed water bodies. Data are reported by member states
  every six years.
6-5-1-intention: >-
  The ecological status of water bodies reflects the overall health of aquatic
  ecosystems and the pressures they face from human activities. Achieving good
  ecological status is the central objective of the Water Framework Directive.
  Progress means an increasing proportion of surface water bodies achieving
  good or high ecological status.
6-5-1-methodology: >-
  Data are reported by EU member states to the European Environment Agency (EEA)
  under the Water Framework Directive (2000/60/EC). Ecological status is assessed
  based on biological, hydromorphological and physico-chemical quality elements.
  Reporting cycles run every six years.
6-4-1-title: Nitrate concentration in groundwater
6-4-1-definition: >-
  This indicator measures the proportion of groundwater monitoring stations where
  the average nitrate concentration exceeds 50 milligrams per litre (the EU
  threshold under the Nitrates Directive). It is expressed as a percentage of
  all monitored stations. Data are reported by member states under the Nitrates
  Directive.
6-4-1-intention: >-
  Nitrate pollution of groundwater, primarily from agricultural sources, poses
  risks to drinking water quality and aquatic ecosystems. Reducing nitrate
  concentrations requires improved agricultural nutrient management. Progress
  means a reduction in the proportion of monitoring stations exceeding the
  50 mg/l threshold.
6-4-1-methodology: >-
  Data are collected by member states under Council Directive 91/676/EEC
  concerning the protection of waters against pollution caused by nitrates from
  agricultural sources (Nitrates Directive) and reported to the European
  Commission every four years. Eurostat compiles and publishes the data.
6-3-1-title: Biochemical oxygen demand in rivers
6-3-1-definition: >-
  This indicator measures the biochemical oxygen demand (BOD) in rivers, which
  reflects the amount of oxygen consumed by biological processes when decomposing
  organic matter in water. Lower BOD values indicate better water quality. It is
  expressed in milligrams of oxygen per litre and is based on data from river
  monitoring stations.
6-3-1-intention: >-
  High levels of organic pollution in rivers reduce dissolved oxygen, harm
  aquatic life and can render water unsafe for human use. Reducing BOD in rivers
  is essential for improving water quality and protecting freshwater ecosystems.
  Progress means a reduction in average BOD levels across monitored river stations.
6-3-1-methodology: >-
  Data are collected from national river monitoring networks and compiled by
  Eurostat in cooperation with the European Environment Agency (EEA). BOD is
  measured at standardised monitoring stations and represents the oxygen consumed
  over five days at 20°C (BOD5). Data are reported annually.
6-2-1-title: Population connected to urban wastewater treatment
6-2-1-definition: >-
  This indicator measures the proportion of the population whose wastewater is
  collected and treated in urban wastewater treatment plants, expressed as a
  percentage. It covers at least secondary (biological) treatment. Data are
  reported by member states under the Urban Wastewater Treatment Directive and
  compiled by Eurostat.
6-2-1-intention: >-
  Access to adequate wastewater treatment is fundamental for protecting water
  quality and public health. Untreated wastewater contaminates rivers, lakes
  and coastal waters. Progress means an increasing proportion of the population
  connected to at least secondary wastewater treatment.
6-2-1-methodology: >-
  Data are reported by member states every two years under Council Directive
  91/271/EEC concerning urban wastewater treatment. The indicator covers
  agglomerations generating more than 2,000 population equivalents. Eurostat
  compiles and publishes the data as a percentage of the total population.
6-1-1-title: Water exploitation index
6-1-1-definition: >-
  The water exploitation index (WEI+) measures freshwater abstraction as a
  proportion of the available renewable freshwater resources (long-term average
  annual renewable freshwater resources minus environmental flow requirements).
  It is expressed as a percentage. Values above 20% indicate water stress; above
  40% indicate severe water stress.
6-1-1-intention: >-
  Water scarcity is an increasing threat to ecosystems, economies and human
  well-being. Monitoring freshwater abstraction relative to available resources
  is essential for sustainable water management. Progress means maintaining the
  water exploitation index below stress thresholds through efficient water use
  and resource management.
6-1-1-methodology: >-
  Data are compiled by Eurostat from national water statistics reported by member
  states. Freshwater abstraction covers water withdrawn from rivers, lakes,
  reservoirs and groundwater for all uses. Available resources are estimated from
  long-term hydrological data adjusted for environmental flow requirements.
5-6-1-title: Gender gap in internet use
5-6-1-definition: >-
  This indicator measures the difference between the proportion of men and women
  aged 16 to 74 who used the internet in the last three months, expressed in
  percentage points. A positive value indicates higher internet use among men.
  Data are collected through the EU Survey on ICT Usage in Households and by
  Individuals.
5-6-1-intention: >-
  The digital gender gap reflects broader inequalities in access to technology,
  information and economic opportunities. Closing the gap requires targeted
  policies to improve digital access, skills and confidence among women. Progress
  means a reduction in the difference between male and female internet use rates.
5-6-1-methodology: >-
  Data are collected through the EU Survey on ICT Usage in Households and by
  Individuals, conducted annually. Internet use refers to use of the internet
  for any purpose in the three months preceding the survey. The gender gap is
  calculated as the difference between male and female internet use rates,
  expressed in percentage points.
5-5-1-title: Seats held by women in national parliaments
5-5-1-definition: >-
  This indicator measures the proportion of seats held by women in national
  parliaments (single or lower chamber), expressed as a percentage of all
  occupied seats. Data are provided by the Inter-Parliamentary Union (IPU) and
  compiled by Eurostat.
5-5-1-intention: >-
  Equal participation of women and men in political decision-making is a
  fundamental dimension of gender equality and democratic governance. Increasing
  women's representation in parliament ensures that women's perspectives and
  interests are reflected in legislation and policy. Progress means an increasing
  share of seats held by women.
5-5-1-methodology: >-
  Data are provided by the Inter-Parliamentary Union (IPU) and refer to the
  situation on 1 January of each year. The indicator covers single chambers and
  the lower chambers of bicameral parliaments. Figures refer to the percentage
  of women among all members of parliament with a valid mandate.
5-4-1-title: Women on boards of large listed companies
5-4-1-definition: >-
  This indicator measures the proportion of women among members of boards of
  directors of the largest publicly listed companies, expressed as a percentage
  of all board members. It covers both executive and non-executive board members.
  Data are collected by Eurostat in cooperation with the European Institute for
  Gender Equality (EIGE).
5-4-1-intention: >-
  Women remain underrepresented in senior decision-making positions in the
  corporate sector. Increasing the share of women on company boards promotes
  gender equality and is associated with better governance and business
  performance. Progress means a sustained increase in the proportion of women
  in board-level positions.
5-4-1-methodology: >-
  Data are collected from national sources by Eurostat in cooperation with EIGE.
  The indicator covers the largest publicly listed companies registered in each
  country, specifically those listed on each country's main national stock
  exchange. Board members include both supervisory and management board members.
5-3-1-title: Gender pension gap
5-3-1-definition: >-
  The gender pension gap is the difference between the average pension income
  received by men and women aged 65 to 79, expressed as a percentage of the
  average pension income received by men. It reflects accumulated inequalities
  from the labour market, including differences in employment rates, working
  hours, pay and career breaks. Data are based on EU-SILC.
5-3-1-intention: >-
  The gender pension gap is a consequence of lifetime inequalities in employment
  and earnings between men and women. Closing the gap requires addressing the
  root causes throughout working life, including career breaks for care
  responsibilities, part-time work and occupational segregation. Progress means
  a sustained reduction in the pension income gap between men and women.
5-3-1-methodology: >-
  Data are collected through the EU Statistics on Income and Living Conditions
  (EU-SILC). Pension income includes old-age and survivors' pensions. The gender
  pension gap is calculated as the difference between average male and female
  pension incomes, expressed as a percentage of average male pension income,
  for persons aged 65 to 79.
5-2-1-title: Gender pay gap
5-2-1-definition: >-
  The unadjusted gender pay gap is the difference between average gross hourly
  earnings of male and female employees, expressed as a percentage of average
  gross hourly earnings of male employees. It is based on employees working in
  firms with ten or more employees. Data are collected through the Structure of
  Earnings Survey (SES).
5-2-1-intention: >-
  The gender pay gap reflects persistent inequalities between men and women in
  the labour market, including differences in sectors, occupations, working hours
  and career interruptions. Closing the gap requires addressing occupational
  segregation and discrimination. Progress means a sustained reduction in the
  unadjusted gender pay gap over time.
5-2-1-methodology: >-
  Data are collected through the Structure of Earnings Survey (SES), conducted
  every four years, with annual estimates produced by Eurostat. The indicator
  covers all economic activities except public administration and is based on
  gross hourly earnings of employees in establishments with ten or more employees.
5-1-1-title: Gender employment gap
5-1-1-definition: >-
  The gender employment gap is the difference between the employment rates of
  men and women aged 20 to 64, expressed in percentage points. A positive value
  indicates that men have a higher employment rate than women. Data are based on
  the EU Labour Force Survey (EU-LFS).
5-1-1-intention: >-
  The gender employment gap reflects structural inequalities in the labour market.
  Closing the gap requires policies supporting women's participation in employment,
  including affordable childcare, flexible working arrangements and equal
  opportunities. Progress means a sustained reduction in the difference between
  men's and women's employment rates.
5-1-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). The employment
  rate is calculated as the percentage of employed persons in the total population
  aged 20–64. The gender employment gap is the difference between the male and
  female employment rates, expressed in percentage points.
4-6-1-title: Participation of adults in learning
4-6-1-definition: >-
  This indicator measures the proportion of adults aged 25 to 64 who participated
  in formal or non-formal education and training in the four weeks preceding the
  survey. It is expressed as a percentage of the total population aged 25 to 64.
  Data are based on the EU Labour Force Survey.
4-6-1-intention: >-
  Life-long learning is essential for adapting to a changing labour market and
  maintaining employability. Higher participation in adult learning reduces skills
  mismatches and supports social inclusion. The goal is to increase the proportion
  of adults engaged in continuous learning throughout their lives.
4-6-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). Formal education
  refers to education provided by the regular system of schools, universities and
  other formal educational institutions. Non-formal education includes all organised
  educational activities outside the formal educational system.
4-5-1-title: Individuals with at least basic digital skills
4-5-1-definition: >-
  This indicator measures the proportion of individuals aged 16 to 74 who possess
  at least basic digital skills across four areas: information and data literacy,
  communication and collaboration, problem solving, and digital content creation.
  It is expressed as a percentage of the total population aged 16 to 74.
4-5-1-intention: >-
  Digital skills are increasingly essential for participation in the labour market
  and in society. Ensuring a digitally competent population supports economic growth,
  innovation and social inclusion. Progress means increasing the share of people
  with at least basic digital competences.
4-5-1-methodology: >-
  Data are collected through the EU Survey on ICT Usage in Households and by
  Individuals. The composite digital skills indicator is based on the EU Digital
  Competence Framework (DigComp) and covers activities performed in the 3 months
  prior to the survey.
4-4-1-title: Low achieving students in reading, mathematics and science
4-4-1-definition: >-
  This indicator measures the share of 15-year-old students who fail to reach
  level 2 (minimum level of proficiency) in reading, mathematics and science,
  based on the OECD Programme for International Student Assessment (PISA). It is
  expressed as a percentage of all students assessed.
4-4-1-intention: >-
  Ensuring that all young people acquire minimum literacy and numeracy skills is
  fundamental to quality education. High rates of underachievement limit future
  employment and economic participation. Progress means reducing the share of
  low-achieving students in all three domains.
4-4-1-methodology: >-
  Data come from the OECD PISA survey, conducted every three years among students
  aged 15. Level 2 proficiency is the baseline level at which students begin to
  demonstrate competencies that enable them to participate actively in modern
  society. The survey covers reading, mathematics and science.
4-3-1-title: Participation in early childhood education
4-3-1-definition: >-
  This indicator measures the proportion of children aged 3 years to the starting
  age of compulsory education who participate in early childhood education
  programmes. It is expressed as a percentage of the population in the same age
  group. Data are collected from national administrative sources.
4-3-1-intention: >-
  Early childhood education is key to preparing children for primary school and
  life-long learning. High participation rates reduce inequalities and support
  cognitive, emotional and social development from an early age. The long-term
  goal is to maximise participation of all children in quality early education.
4-3-1-methodology: >-
  Data are compiled by Eurostat from national administrative sources and refer to
  children enrolled in ISCED 2011 level 0 (early childhood education) programmes.
  Coverage includes both public and private institutions. The reference population
  is children aged 3 years to the starting age of compulsory education.
4-2-1-title: Tertiary educational attainment
4-2-1-definition: >-
  This indicator measures the proportion of persons aged 25 to 34 who have
  successfully completed tertiary education (ISCED 2011 levels 5–8). It is
  expressed as a percentage of the total population in that age group. Data
  are based on the EU Labour Force Survey.
4-2-1-intention: >-
  Increasing tertiary educational attainment is key to developing a skilled
  workforce capable of driving innovation and economic growth. Higher levels
  of education are associated with better employment prospects, higher earnings
  and greater civic participation. Progress means a sustained rise in the share
  of young people completing tertiary education.
4-2-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS). Tertiary
  education corresponds to ISCED 2011 levels 5 to 8, covering short-cycle
  tertiary education, bachelor's or equivalent, master's or equivalent, and
  doctoral or equivalent programmes. The age group 25–34 is chosen because
  most people in this range have completed their initial education.
4-1-1-title: Early leavers from education and training
4-1-1-definition: >-
  Early leavers from education and training are persons aged 18 to 24 who have
  attained at most lower secondary education and are not in further education or
  training. The indicator is expressed as a percentage of the total population
  aged 18 to 24. Data are based on the EU Labour Force Survey.
4-1-1-intention: >-
  Reducing early school leaving is essential for ensuring that all young people
  acquire the knowledge and skills needed for employment and active citizenship.
  High rates of early leaving are associated with lower earning potential,
  higher unemployment, and greater dependence on social support systems. The
  long-term objective is to minimise the share of early leavers.
4-1-1-methodology: >-
  Data are collected through the EU Labour Force Survey (EU-LFS), a large
  household survey providing quarterly statistics on labour participation.
  The indicator covers persons aged 18 to 24 whose highest level of education
  is ISCED 2011 level 0, 1 or 2, and who stated they had not received any
  education or training in the four weeks preceding the survey.
