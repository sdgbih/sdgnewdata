intro_title: ЕУ-СДГ индикатори за Босну и Херцеговину
intro_body: '<a href="https://ec.europa.eu/eurostat/web/sdi/database/">Сет индикатора</a> се састоји од око 100 индикатора структурираних према 17 циљева Агенде 2030, шест индикатора по сваком циљу одрживости, како би сви циљеви имали исту важност и омогућили уравнотежено мјерење напретка свих димензија одрживости. Овај портал омогућава преглед тренутног стања доступности и развоја ЕУ СДГ индикатора у Босни и Херцеговини.'
