intro_title: За мјерење напретка у остваривању Циљева одрживог развоја на европском нивоу (EU SDG) развијен је сет индикатора.
intro_body: <a href="https://ec.europa.eu/eurostat/web/sdi/database/">Сет индикатора</a> се састоји од око 100 индикатора структурираних према 17 циљева Агенде 2030, шест индикатора по сваком циљу одрживости, како би сви циљеви имали исту важност и омогућили уравнотежено мјерење напретка свих димензија одрживости. Појединачни индикатори, такозвани мултифункционални индикатори, такође се користе за праћење више од једног циља одрживог развоја. Сет EU SDG индикатора представља основу за годишњи извјештај Евростата о напретку у остваривању SDG-ова у контексту Европске уније. Овај портал омогућава преглед тренутног стања доступности и развоја EU SDG индикатора у Босни и Херцеговини.
