1-1-1-title: Особе у ризику од сиромаштва или социјалне искључености
1-1-1-definition: >-
  Овај индикатор одговара збиру људи који су: у ризику од сиромаштва након социјалних трансфера, 
  тешко материјално и социјално депривирани, или живе у домаћинствима са веома ниским интензитетом рада. 
  Појединци се броје само једном, чак и ако је на њих утицало више од једног од ових догађаја. 
  Сматра се да су људи изложени ризику од сиромаштва након социјалних трансфера ако њихов 
  еквивалентни расположиви доходак није већи од прага ризика од сиромаштва, који је постављен 
  на 60% националног средњег еквивалентног расположивог дохотка. Стопа тешке материјалне и 
  социјалне депривације је удио становништва које доживљава присилни недостатак од најмање 
  7 од 13 ставки депривације.
1-1-1-intention: >-
  Сиромаштво и социјална искљученост су штетни за животе појединаца и ограничавају могућности људи 
  да остваре свој пуни потенцијал утичући на њихово здравље и благостање те смањујући образовне исходе. 
  Без ефикасног система социјалне заштите, ризик од сиромаштва се преноси са једне генерације на другу, 
  што ствара још већу неједнакост и омета инклузивни и одрживи економски раст. Дугорочни циљ за овај 
  индикатор је вриједност од 0.
1-1-1-methodology: >-
  Подаци се заснивају на хармонизованом годишњем истраживању о приходима и условима живота (ЕУ-СИЛЦ). 
  У 2020. години, ЕУ-СИЛЦ је прошао опсежне методолошке ревизије и интегрисан је у микроцензус. 
  Као резултат тога, подаци од 2020. године надаље нису упоредиви са подацима из претходних година. 
  Од 2021. године примјењује се Уредба (ЕУ) 2019/1700 која дефинише стандарде прикупљања и обраде података.
1-2-1-title: Особе у опасности од монетарног сиромаштва након социјалних трансфера
1-2-1-definition: >-
  Омјер доходака квинтила (S80/S20) је омјер укупног еквивалентног расположивог
  доходка који прима 20% најближих највишем дохотку становништва према доходку
  који прима 20% са најнижим дохотком. Виша вриједност указује на већу
  неједнакост у доходку. Подаци потичу из ЕУ анкете о приходима и условима
  живота (EU-SILC).
1-2-1-intention: >-
  Неједнакост у доходку поткопава друштвену кохезију и ограничава животне
  могућности оних на дну расподјеле доходка. Смањење неједнакости предуслов је
  за одрживи и инклузивни раст. Напредак значи смањење омјера S80/S20 током
  времена.
1-2-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Еквивалентни расположиви доходак
  је укупни приход домаћинства након пореза и одбитака, подијељен еквивалентном
  величином домаћинства. Анкета се проводи годишње у свим земљама учесницама.
1-3-1-title: Стопа тешке материјалне и социјалне ускраћености према старосној групи и полу
1-3-1-definition: >-
  Овај индикатор мјери удио становништва обухваћеног бар једном накнадом
  социјалне заштите, укључујући накнаде везане за старост, инвалидност, болест,
  незапосленост, породицу и становање. Изражава се као посто укупног становништва.
  Подаци се заснивају на EU-SILC анкети.
1-3-1-intention: >-
  Ефикасни системи социјалне заштите спречавају сиромаштво и смањују утицај
  економских шокова на појединце и породице. Широка покривеност осигурава да
  они којима је потребна помоћ добију подршку на вријеме. Напредак значи
  проширење ефективне покривености на све сегменте становништва.
1-3-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете, која прикупља информације о
  социјалним трансферима примљеним у домаћинствима. Индикатор обухвата и
  доприносне и недоприносне накнаде у свим категоријама социјалне заштите.
1-4-1-title: Особе која живе у домаћинствима са веома ниским интензитетом рада, по старосним групама
1-4-1-definition: >-
  Стопа оптерећености трошковима становања је удио становништва које живи у
  домаћинствима гдје укупни трошкови становања (умањени за стамбене накнаде)
  представљају више од 40% укупног расположивог доходка домаћинства. Изражава
  се као посто. Подаци се заснивају на EU-SILC анкети.
1-4-1-intention: >-
  Претјерани трошкови становања смањују расположиви доходак за остале животне
  нужности и повећавају ризик од сиромаштва и социјалне искључености. Праћење
  овог индикатора помаже идентификовати домаћинства под финансијским притиском
  становања. Напредак значи смањење удјела особа оптерећених трошковима
  становања.
1-4-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Трошкови становања укључују
  кирију, отплату хипотеке, комуналије и одржавање. Стамбене накнаде одузимају
  се и од трошкова и од доходка прије израчунавања прага од 40%.
1-4-2-title: Стопа запослених у ризику од сиромаштва
1-4-2-definition: >-
  Стопа тешке стамбене депривације је удио становништва које живи у пренасељеним
  становима који уједно немају барем једно од сљедећег: каду или туш, унутарњи
  тоалет с испирањем, или имају цурећи кров или влажне зидове. Изражава се
  као посто. Подаци се заснивају на EU-SILC анкети.
1-4-2-intention: >-
  Адекватно становање темељна је људска потреба и кључна одредница здравља и
  добробити. Тешка стамбена депривација има директан негативан утицај на
  физичко и ментално здравље, образовне резултате и социјалну партиципацију.
  Напредак значи трајно смањење стопе тешке стамбене депривације.
1-4-2-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Пренасељеност се процјењује у
  односу на величину и састав домаћинства. Депривација квалитете становања
  обухвата структурне проблеме (цурећи кров, влажни зидови) и недостатак
  основних објеката (купатило, унутарњи WC).
1-5-1-title: Стопа прекомјерног оптерећења трошковима становања према статусу сиромаштва
1-5-1-definition: >-
  Овај индикатор прати смртне случајеве и економске губитке приписане
  катастрофама, укључујући природне хазарде као што су поплаве, олује, суше
  и екстремне температуре. Користи се за процјену отпорности становништва на
  климатске и друге катастрофалне догађаје. Подаци се компилују из националних
  органа цивилне заштите и међународних база података.
1-5-1-intention: >-
  Изградња отпорности на катастрофе кључна је за заштиту живота, средстава за
  живот и развојних достигнућа. Земље с ефикасним стратегијама смањења ризика
  имају мањи број смртних случајева и мање економске губитке. Напредак значи
  смањење смртности и губитака узрокованих катастрофама.
1-5-1-methodology: >-
  Подаци се прикупљају од националних органа цивилне заштите, уз допуну
  међународним базама података као што је EM-DAT. Индикатор обухвата
  катастрофалне догађаје који захтијевају хитну реакцију и резултирају
  људским или значајним економским губицима.
2-1-1-title: Индекс потрошачких цијена хране
2-1-1-definition: >-
  Индекс потрошачких цијена хране мјери промјене цијена које потрошачи плаћају
  за храну и безалкохолна пића током времена. Изражава се као индекс с
  референтним периодом једнаким 100. Раст цијена хране може повећати прехрамбену
  несигурност, посебно у домаћинствима с нижим приходима. Подаци се компилују
  од стране Еуростата из националних статистичких органа.
2-1-1-intention: >-
  Стабилне и приступачне цијене хране кључне су за осигурање приступа адекватној
  исхрани за све сегменте становништва. Нагли раст цијена хране несразмјерно
  погађа домаћинства с нижим приходима и може довести до прехрамбене несигурности.
  Праћење овог индикатора доприноси ширем циљу елиминације глади.
2-1-1-methodology: >-
  Подаци се заснивају на хармонизованом индексу потрошачких цијена (HICP),
  подиндекс хране, прикупљеном мјесечно од стране националних статистичких
  органа. Индекс покрива сву храну и безалкохолна пића prema COICOP класификацији.
2-2-1-title: Стопа прекомјерне тежине и гојазности код одраслих
2-2-1-definition: >-
  Овај индикатор мјери удио одраслих особа у доби од 18 и више година
  класификованих као особе с прекомјерном тежином или гојазних на основу
  индекса тјелесне масе (ИТМ). Прекомјерна тежина дефинисана је као ИТМ
  ≥ 25 kg/m², а гојазност као ИТМ ≥ 30 kg/m². Изражава се као посто одраслог
  становништва. Подаци се прикупљају путем Европског здравственог
  интервјуног истраживања (EHIS).
2-2-1-intention: >-
  Прекомјерна тежина и гојазност главни су фактори ризика за незаразне болести,
  укључујући кардиоваскуларне болести, дијабетес типа 2 и одређене врсте рака.
  Растуће стопе гојазности стварају значајно оптерећење здравственим системима.
  Напредак значи стабилизацију или смањење преваленције прекомјерне тежине и
  гојазности у популацији.
2-2-1-methodology: >-
  Подаци се прикупљају путем Европског здравственог интервјуног истраживања
  (EHIS), које се проводи отприлике сваких пет година. ИТМ се израчунава из
  самопријављене висине и тежине. EHIS примјењује хармонизовану методологију
  у свим земљама учесницама, омогућавајући међународне поредбе.
2-3-1-title: Индекс птица пољопривредног земљишта
2-3-1-definition: >-
  Индекс птица пољопривредног земљишта мјери промјене у популацији врста птица
  везаних за пољопривредна станишта, користећи 1990. годину као базну (индекс =
  100). Пад популације птица пољопривредног земљишта указује на губитак
  биоразноликости узрокован интензивирањем пољопривреде. Подаци се прикупљају
  из националних програма праћења птица.
2-3-1-intention: >-
  Разноликост популација птица у пољопривредним крајоликам показатељ је
  еколошког здравља пољопривредних система. Стабилне или растуће популације
  птица сигнализирају да пољопривредне праксе подржавају биоразноликост.
  Заустављање и преокрет пада популације птица кључни су за одрживе
  прехрамбене системе.
2-3-1-methodology: >-
  Подаци се компилују из националних истраживања гнијежђења птица и достављају
  Еуростату. Индекс агрегира трендове популација репрезентативних врста птица
  типичних за пољопривредна станишта. Резултати се заглађују ради узимања у
  обзир годишње варијабилности у бројању.
2-4-1-title: Површина под органском пољопривредом
2-4-1-definition: >-
  Овај индикатор мјери укупну пољопривредну површину под органском
  пољопривредом, укључујући и потпуно сертификовано органско земљиште и
  земљиште у периоду конверзије. Изражава се као посто укупне искоришћене
  пољопривредне површине. Подаци се заснивају на националним статистикама
  органске пољопривреде које компилује Еуростат.
2-4-1-intention: >-
  Органска пољопривреда промовише биоразноликост, смањује употребу синтетичких
  пестицида и ђубрива те подржава одрживо управљање тлом и водама. Повећање
  удјела органске пољопривредне површине важан је корак ка одрживијим и
  отпорнијим системима прехрамбене производње.
2-4-1-methodology: >-
  Подаци се прикупљају кроз националне анкете о фармама и пољопривредне
  статистике усклађене с ЕУ прописима о органској пољопривреди. Подаци
  укључују површине потпуно сертификоване као органске и површине у периоду
  конверзије, који типично траје двије до три године.
2-5-3-title: Бруто биланс азота на пољопривредном земљишту
2-5-3-definition: >-
  Бруто биланс азота (GNB) на пољопривредном земљишту процјењује вишак азота
  у тлу, израчунат као разлика између уноса азота (минерална ђубрива, стајњак,
  атмосферска депозиција, биолошка фиксација и биљни остатци) и излаза азота
  (усјеви и пожњевена трава). Изражава се у килограмима азота по хектару
  пољопривредног земљишта.
2-5-3-intention: >-
  Вишак азота у пољопривредним тлима доприноси загађењу вода испирањем
  нитрата, емисијама стакленичких гасова и губитку биоразноликости. Смањење
  вишка азота кључно је за одрживе пољопривредне праксе које штите водна
  тијела и животну средину.
2-5-3-methodology: >-
  Подаци се компилују од стране Еуростата из националних пољопривредних
  статистика о коришћењу ђубрива, броју стоке и производњи усјева. Методологија
  GNB-а слиједи OECD/Eurostat приступ израчунавању биланса хранљивих твари.
2-6-0-title: Емисије стакленичких гасова из пољопривреде
2-6-0-definition: >-
  Овај индикатор мјери укупне емисије стакленичких гасова (GHG) из
  пољопривредног сектора, изражене у милионима тона еквивалента CO₂.
  Пољопривредне емисије укључују метан из стоке и управљања стајњаком,
  азотни оксид из тла и угљен-диоксид из потрошње енергије на фармама.
2-6-0-intention: >-
  Пољопривреда значајно доприноси укупним емисијама стакленичких гасова.
  Смањење пољопривредних емисија уз одржавање прехрамбене производње кључни
  је изазов за испуњавање климатских циљева. Напредак значи смањење укупних
  GHG емисија из пољопривреде без угрожавања прехрамбене сигурности.
2-6-0-methodology: >-
  Подаци се достављају од стране националних органа у оквиру UN Оквирне
  конвенције о климатским промјенама (UNFCCC) и компилују од стране Еуростата.
  Емисије се процјењују коришћењем IPCC методологије и покривају све изворе
  пољопривредних емисија укључујући ентеричну ферментацију, управљање
  стајњаком и пољопривредна тла.
3-1-1-title: Године здравог живота при рођењу
3-1-1-definition: >-
  Године здравог живота (HLY) при рођењу показују број година које се очекује
  да ће новорођенче живјети у добром здрављу, без дуготрајне болести или
  инвалидности. HLY се израчунавају комбиновањем добно-специфичних стопа
  смртности с добно-специфичним удјелима особа које пријављују дуготрајно
  ограничавајућу болест. Индикатор се изражава у годинама и раставља по полу.
3-1-1-intention: >-
  Године здравог живота превазилазе очекивани животни вијек мјерењем квалитете
  као и дуљине живота. Повећање HLY значи да људи не само дуље живе већ и
  проводе више година у добром здрављу. Напредак значи трајно повећање година
  здравог живота за мушкарце и жене.
3-1-1-methodology: >-
  HLY се израчунавају Сулливановом методом, комбинујући податке о смртности с
  подацима о самопријављиваној инвалидности из EU-SILC анкете. Глобални
  индикатор ограничења активности (GALI) пита испитанике јесу ли били
  ограничени у активностима због здравствених проблема у трајању од најмање
  шест мјесеци.
3-2-1-title: Стопа смртности дјеце млађе од пет година
3-2-1-definition: >-
  Стопа смртности дјеце млађе од пет година је вјероватноћа да ће дијете
  рођено у одређеној години умријети прије навршених пет година, изражена на
  1.000 живорођених. Одражава кумулативни утицај фактора који утичу на
  преживљавање дјеце, укључујући исхрану, приступ здравственој заштити,
  санитацију и услове живота. Подаци се компилују из националних вitalних
  статистика.
3-2-1-intention: >-
  Смањење дјечије смртности темељно је мjerило људског развоја и ефикасности
  здравствених и социјалних система. Висоcке стопе смртности дjеце млађе од
  пет година одражавају недовољан приступ здравственој заштити и лоше услове
  живота. Напредак значи трајно смањење превентабилних смртних случајева
  дjеце млађе од пет година.
3-2-1-methodology: >-
  Подаци се компилују из националних система регистрације и vitalних статистика.
  Стопа се израчунава из добно-специфичних стопа смртности за дjецу млађу
  од пет година. Еуростат компилује и валидира податке од националних
  статистичких органа према хармонизованим дефиницијама.
3-3-1-title: Преваленција пушења код одраслих
3-3-1-definition: >-
  Овај индикатор мjери удио одраслих особа у доби од 15 и више година које
  тренутно пуше дуванске производе (укључујући цигарете, цигаре и луле)
  свакодневно или повремено. Изражава се као посто укупног одраслог становништва.
  Подаци се прикупљају путем Европског здравственог интервjуног истраживања.
3-3-1-intention: >-
  Употреба дувана водећи је превентабилни узрок смрти на глобалном нивоу,
  узрокујући рак, кардиоваскуларне болести и хроничне респираторне болести.
  Смањење преваленције пушења кључни је приоритет jавног здравства. Напредак
  значи трајни пад удjела одраслих коjи пуше дуван.
3-3-1-methodology: >-
  Подаци се прикупљају путем Европског здравственог интервjуног истраживања
  (EHIS), коjе се проводи отприлике сваких пет година. Статус пушења jе
  самоприjављен. Истраживање користи стандардизован упитник коjи омогућава
  међународне поредбе у свим државама чланицама ЕУ и земљама учесницама.
3-4-1-title: Стандардизована стопа смртности од хроничних болести
3-4-1-definition: >-
  Овај индикатор мjери стандардизовану стопу смртности од незаразних хроничних
  болести, укључуjући кардиоваскуларне болести, рак, диjабетес и хроничне
  респираторне болести. Изражава се као броj смртних случаjева на 100.000
  особа, стандардизован према Европскоj стандардноj популациjи (ESP 2013).
  Подаци се компилуjу од стране Еуростата из националних статистика узрока
  смрти.
3-4-1-intention: >-
  Незаразне болести водећи су узрок превремене смртности у Европи. Смањење
  превремене смртности од хроничних болести захтиjева ефикасну превенциjу,
  рано откривање и приступ квалитетноj здравственоj заштити за све. Напредак
  значи смањење стандардизоване стопе смртности од тих болести током времена.
3-4-1-methodology: >-
  Подаци се заснивају на статистикама узрока смрти из националних матичних
  књига умрлих. Стандардизована стопа смртности елиминише утицај различитих
  добних структура при поређењу популациjа, користећи Европску стандардну
  популациjу (ESP 2013) као референцу. Подаци се годишње достављаjу Еуростату.
3-6-1-title: Стопа смртности у прометним несрећама
3-6-1-definition: >-
  Оваj индикатор мjери броj особа погинулих у прометним несрећама на милион
  становника. Особа се класификуjе као жртва прометне несреће уколико умре у
  року од 30 дана од несреће као посљедица задобивених поврjеда. Подаци се
  компилуjу од стране Еуростата из националних база података о сигурности
  у промету.
3-6-1-intention: >-
  Прометне поврjеде водећи су узрок смрти, посебно међу младима. Смањење броjа
  погинулих захтиjева улагања у инфраструктуру, стандарде сигурности возила,
  управљање брзином и приmjену прометних прописа. Напредак значи значаjно и
  траjно смањење броjа прометних смртних случаjева на милион становника.
3-6-1-methodology: >-
  Подаци се компилуjу из националних база података о прометним несрећама.
  Дефинициjа смртности у року од 30 дана стандардизована jе ради хармонизациjе
  бројања у земљама учесницама. Подаци се годишње достављаjу Еуростату и
  верификуjу у односу на демографске статистике.
3-7-1-title: Стопа фертилитета адолесцената
3-7-1-definition: >-
  Стопа фертилитета адолесцената jе броj живорођених на 1.000 жена у доби
  од 15 до 19 година. Мjери преваленциjу тинejџерских трудноћа и одражава
  приступ образовању и услугама полног и репродуктивног здравља. Подаци се
  компилуjу из националних вitalних статистика од стране Еуростата.
3-7-1-intention: >-
  Високе стопе фертилитета адолесцената повезане су с повећаним здравственим
  ризицима за мajку и диjете те смањеним образовним и економским могућностима
  за младе жене. Смањење стопе фертилитета адолесцената захтиjева приступ
  свеобухватном полном образовању и услугама репродуктивног здравља. Напредак
  значи траjно смањење порођаjа код адолесцентних жена.
3-7-1-methodology: >-
  Подаци се компилуjу из националних регистрациjа рођења и демографских
  статистика. Стопа се израчунава диjељењем живорођених жени у доби 15–19
  година с укупном женском популациjом у тоj доби, помножено с 1.000.
  Подаци се годишње достављаjу Еуростату.
17-5-1-title: Корисници интернета kao удио становништва
17-5-1-definition: >-
  Удио особа коjе су користиле интернет у посљедња три мjесеца, изражен kao посто укупног становништва. Подаци се прикупљају путем годишњег ЕУ ИКТ истраживања.
17-5-1-intention: >-
  Приступ интернету омогућава учешће у дигиталноj економиjи. Напредак значи растући удио становништва коjе користи интернет.
17-5-1-methodology: >-
  Подаци из годишњег ЕУ ИКТ истраживања у домаћинствима. Обjављуjу се годишnje.
17-4-1-title: Отвореност трговине
17-4-1-definition: >-
  Укупан извоз и увоз роба и услуга kao посто БДП-а. Указуjе на степен интеграциjе у глобални трговински систем.
17-4-1-intention: >-
  Отворени трговински системи проموваjу економски раст. Напредак значи одржавање отворености у подршци ОДР циљевима.
17-4-1-methodology: >-
  Подаци из националних рачуна prema ESA 2010. Покрива робу и услуге. Обjављуjу се годишnje.
17-3-1-title: Jавни дуг kao удио БДП-а
17-3-1-definition: >-
  Консолидирани бруто дуг опће управе kao посто БДП-а. Одражава фискалну одрживост. Подаци od Еуростата из EDP обавjести.
17-3-1-intention: >-
  Одрживе jавне финансиjе кључне су за дугорочна разvojna улагања. Напредак значи дуг у складу с фискалном одрживошћу.
17-3-1-methodology: >-
  Подаци od Еуростата prema EDP процедури. Обjављуjу се два пута годишnje.
17-2-1-title: Порезни приходи kao удио БДП-а
17-2-1-definition: >-
  Укупни порезни приходи укључуjући социjалне доприносе kao посто БДП-а. Одражава капацитет влада за мобилизациjу домаћих ресурса.
17-2-1-intention: >-
  Адекватна мобилизациjа домаћих ресурса финансира одрживи развоj. Напредак значи стабилан порезни приход.
17-2-1-methodology: >-
  Подаци из националних рачуна prema ESA 2010. Укључуjе све обвезне намете. Обjављуjу се годишnje.
17-1-1-title: Службена развоjна помоћ kao удио бруто националног доходка
17-1-1-definition: >-
  Нето службена развоjна помоћ (ODA) земаља доnatora kao посто бруто националног доходка. Међународни циљ jе 0,7% БНД-а. Подаци od OECD DAC-а и Еуростата.
17-1-1-intention: >-
  ODA jе кључни извор финансирања развоjа за сиромашниjе земље. Напредак значи повећање омjера ODA/БНД.
17-1-1-methodology: >-
  Подаци od OECD DAC-а. Покрива билатералне и мултилатералне токове. Обjављуjу се годишnje.
16-5-1-title: Перципирана нeovisnost правосудног система
16-5-1-definition: >-
  Удио становништва коjи сматра судове поштеним или врло неovisnim. Одражава повjерење jавности у правосудне институциjе.
16-5-1-intention: >-
  Повjерење у неovisnost правосуђа темељ jе владавине права. Напредак значи растући удио грађана коjи правосуђе перципираjу kao нeovisno.
16-5-1-methodology: >-
  Подаци годишним Еуробарометром. Обjављуjу се у EU Justice Scoreboard.
16-4-1-title: Стопа затворске популациjе
16-4-1-definition: >-
  Броj особа у затвору на 100.000 становника. Одражава праксе казненог правосуђа. Подаци od Еуростата из националних пеналних статистика.
16-4-1-intention: >-
  Праћење затворске популациjе даjе увид у казнено правосуђе. Затварање треба бити пропорционално.
16-4-1-methodology: >-
  Подаци из националних пеналних администрациjа. Укупан броj у затвору на референтни датум. Обjављуjу се годишnje.
16-3-1-title: Становништво коjе приjављуjе криминал или насиље у свом сусjедству
16-3-1-definition: >-
  Удио становништва коjе приjављуjе искуство криминала, насиља или vandalizma у свом сусjедству. Одражава перцепциjу сигурности.
16-3-1-intention: >-
  Осjећаj сигурности димензиjа jе квалитета живота. Напредак значи смањење удjела коjи приjављуjе криминал.
16-3-1-methodology: >-
  Подаци из EU-SILC анкете. Обjављуjу се годишnje.
16-2-1-title: Индекс перцепциjе корупциjе
16-2-1-definition: >-
  Перципирана разина корупциjе у jавном сектору, боdovana od 0 до 100. Теmelji се на стручним процjенама. Саставља га Transparency International.
16-2-1-intention: >-
  Корупциjа поткопава jавне институциjе и одрживи развоj. Напредак значи побoljšanje резултата индекса перцепциjе корупциjе.
16-2-1-methodology: >-
  Саставља се годишnje od стране Transparency International. Нормализирано на скали 0–100.
16-1-1-title: Стопа намjерних убоjстава
16-1-1-definition: >-
  Броj намjерних убоjстава на 100.000 становника. Дефинира се kao незаконита смрт наnesena с намjером. Подаци od Еуростата из националних полициjских статистика.
16-1-1-intention: >-
  Стопа убоjстава поуздан jе показатељ насилног криминала. Напредак значи траjно смањење стопе намjерних убоjстава.
16-1-1-methodology: >-
  Подаци из националних полициjских статистика prema UNODC дефинициjама. Обjављуjу се годишnje.
15-5-1-title: Инвазивне стране врсте
15-5-1-definition: >-
  Броj инвазивних страних врста od интереса за ЕУ утврђених у државама чланицама prema Уредби 1143/2014. Инвазивне врсте водећи су узрок губитка биоразноликости.
15-5-1-intention: >-
  Инвазивне стране врсте угрожаваjу аутохтону биоразноликост. Напредак значи ограничавање ширења инвазивних врста.
15-5-1-methodology: >-
  Подаци od EEA на теmelju националних извjештаjа prema ЕУ уредби о инвазивним врстама.
15-4-1-title: Ерозиjа тла водом
15-4-1-definition: >-
  Стопа губитка тла воdom у тонама по хектару годишnje. Смањуjе пољопривредну продуктивност. Процjенjуjе се RUSLE2015 моделом od стране JRC-а.
15-4-1-intention: >-
  Тло jе необновљиви ресурс. Напредак значи смањење стопе губитка тла ерозиjом.
15-4-1-methodology: >-
  Процjенjуjе се RUSLE2015 моделом. Обjављуjе се od стране JRC-а и Еуростата.
15-3-1-title: Индекс уобичаjених птица
15-3-1-definition: >-
  Индекс коjи прати промjене у популациjама уобичаjених птица у Европи с 1990. kao базном годином (= 100). Птице су осjетљиви показатељи здравља екосистема.
15-3-1-intention: >-
  Пад популациjа птица сигнализира деградациjу станишта. Напредак значи заустављање пада популациjа птица.
15-3-1-methodology: >-
  Подаци из националних истраживања гниjежђења птица путем PECBMS шеме. Обjављуjу се годишnje.
15-2-1-title: Заштићене копнене и слатководне површине
15-2-1-definition: >-
  Удио копнених и слатководних површина означених kao заштићене kao посто укупне површине копна. Укључуjе Natura 2000 и националне заштићене поdrucja.
15-2-1-intention: >-
  Заштићена подручjа темељ су заштите биоразноликости. Напредак значи растући удио копна под учинковитом заштитом.
15-2-1-methodology: >-
  Подаци из националних ознака достављених EEA-и. Покрива копнена и слатководна станишта. Обjављуjу се годишnje.
15-1-1-title: Шумска површина kao удио укупне површине копна
15-1-1-definition: >-
  Površina шума kao посто укупне površine копна. Прати промjене усљед промjене намjене земљишта. Подаци из националних шумарских статистика.
15-1-1-intention: >-
  Шуме су кључне за биоразноликост и секвестрациjу угљика. Напредак значи одржавање или повећање шумом покривеног копна.
15-1-1-methodology: >-
  Подаци из шумарских статистика prema JFSQ уpitniku. Дефинициjа prema FAO. Обjављуjу се периодично.
14-4-1-title: Ерозиjа обале
14-4-1-definition: >-
  Удио обалне линиjе изложене ерозиjи kao посто укупне проциjенjене линиjе. Компилуjе ga EEA сателитским праћењем и EUROSION базом.
14-4-1-intention: >-
  Обална ерозиjа убрзава се. Напредак значи ограничавање удjела обале изложене ерозиjи.
14-4-1-methodology: >-
  Подаци od EEA корistešći Copernicus праћење. Обjављуjу се периодично.
14-3-1-title: Концентрациjа кlorофила-а у обалним водама
14-3-1-definition: >-
  Концентрациjа кlorофила-а у обалним и приjелазним водama kao proxy за еутрофикациjу. Виши нивои указуjу на загађење нутриjентима.
14-3-1-intention: >-
  Еутрофикациjа деградира морске екосистеме. Напредак значи стабилне или opadajuće концентрациjе кlorофила-а.
14-3-1-methodology: >-
  Подаци из морских програма праћења и сателитског истраживања. Компилуjе EEA.
14-2-1-title: Рибни фондови унутар одрживих разина
14-2-1-definition: >-
  Удио проциjенjених кomercijалних рибних фондова у ЕУ водама коjи се лове на или испод MSY, изражен kao посто. Подаци od ICES-а.
14-2-1-intention: >-
  Прeкомjерни риболов исцрпљуjе фондове. Напредак значи растући удио фондова у одрживим граnicama.
14-2-1-methodology: >-
  Теmelji се на ICES процjенама фондова. Одрживост prema MSY концепту. Обjављуjе се годишnje.
14-1-1-title: Морска заштићена подручjа
14-1-1-definition: >-
  Удио мора у националноj jурисдикциjи означених kao МPA, изражен kao посто. Подаци od EEA из националних ознака.
14-1-1-intention: >-
  МPA штите морску биоразноликост. Напредак значи растући удио мора под морском заштитом.
14-1-1-methodology: >-
  Подаци из националних ознака prema Natura 2000 и међународним конвенциjама. Обjављуjу се годишnje.
13-4-1-title: Интензитет емисиjа стакленичких гасова енергетске потрошnje
13-4-1-definition: >-
  Емисиjе стакленичких гасова из енергетске потрошnje поdijelene с бруто потрошnom енергиjе, у грамима CO₂ eq/kgoe. Одражава угљични садржаj енергетског миксa.
13-4-1-intention: >-
  Декарбонизациjа енергетског система кључна jе за климатско дjелавање. Напредак значи смањење интензитета емисиjа стакленичких гасова.
13-4-1-methodology: >-
  Компилуjе Еуростат из енергетских биланци и инventara стакленичких гасова. Обjављуjе се годишnje.
13-3-1-title: Економски губици везани уз климу
13-3-1-definition: >-
  Економски губици od екстремних климатских догађаjа kao посто БДП-а. Укључуjе поплаве, олуjе и суше.
13-3-1-intention: >-
  Климатске промjене повећаваjу екстремне догађаjе и економске губитке. Напредак значи ограничавање губитака od климатских догађаjа.
13-3-1-methodology: >-
  Подаци из CATDAT базе и реосигуравajućих извора. Обjављуjе се периодично.
13-2-1-title: Емисиjе стакленичких гасова - енергетски сектор
13-2-1-definition: >-
  Укупне емисиjе стакленичких гасова из енергетског сектора у Mt CO₂ eq. Покрива сагориjевање у електранама и енергетским индустриjама.
13-2-1-intention: >-
  Енергетски сектор наjвећи jе извор GHG емисиjа. Напредак значи траjно смањење емисиjа енергетског сектора.
13-2-1-methodology: >-
  Подаци od националних власти prema UNFCCC koristešći IPCC методологиjу. Обjављуjе се годишnje.
13-1-1-title: Индекс емисиjа стакленичких гасова
13-1-1-definition: >-
  Укупне националне емисиjе стакленичких гасова индексиране на базну годину. Прати укупни напредак у смањењу емисиjа.
13-1-1-intention: >-
  Смањење укупних емисиjа централни jе циљ климатске политике. Напредак значи траjни opadajući тренд индекса.
13-1-1-methodology: >-
  Подаци od националних власти prema UNFCCC. Покрива све секторе. Обjављуjе се годишnje.
12-5-1-title: Стопа кружног кориштења материjала
12-5-1-definition: >-
  Удио материjала опорављених и враћених у економиjу у ukupnoj upotrebi материjала. Указуjе на напредак prema kružnoj економиjи.
12-5-1-intention: >-
  Повећање кружног кориштења смањуjе екстракциjу ресурса. Напредак значи растући посто кружног кориштења материjала.
12-5-1-methodology: >-
  Израчунава се kao рециклиран otpad kao input поdijeljen ukupnom upotrebom. Компилуjе Еуростат годишnje.
12-4-1-title: Интензитет емисиjа стакленичких гасова производnje
12-4-1-definition: >-
  Укупне емисиjе стакленичких гасова по jединици БДП-а у kg CO₂ eq. Прати одваjање раста od емисиjа.
12-4-1-intention: >-
  Смањење интензитета емисиjа кључно jе за одрживу производnjу. Напредак значи пад емисиjа по jединици БДП-а.
12-4-1-methodology: >-
  Компилуjе Еуростат из инventara GHG и националних рачуна. Обjављуjе се годишnje.
12-3-1-title: Стопа рециклирања комуналног отпада
12-3-1-definition: >-
  Удио комуналног отпада коjи се рециклира kao посто укупно генерираног отпада. Покрива материjално рециклирање и компостирање.
12-3-1-intention: >-
  Повећање рециклирања смањуjе odlaganje. Напредак значи растући удио комуналног отпада коjи се рециклира.
12-3-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Укључуjе рециклирање и компостирање. Обjављуjе се годишnje.
12-2-1-title: Комунални отпад генериран по становнику
12-2-1-definition: >-
  Укупни комунални отпад генериран по становнику годишnje у килограмима. Укључуjе кућански отпад и сличне изворе.
12-2-1-intention: >-
  Смањење генерирања отпада први jе корак у хиjерархиjи отпада. Напредак значи opadajući тренд отпада по становнику.
12-2-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Обjављуjе се годишnje.
12-1-1-title: Продуктивност ресурса
12-1-1-definition: >-
  БДП поdijeljen с домаћом потрошnom материjала (DMC) у еурима по килограму. Виша вриjednost значи веfiri економски output по jединици материjала.
12-1-1-intention: >-
  Побoljšanje продуктивности ресурса одваjа раст od потрошne материjала. Напредак значи траjно повећање продуктивности ресурса.
12-1-1-methodology: >-
  Израчунава се коришhenjем БДП-а и DMC из рачуна материjалних токова. Компилуjе Еуростат годишnje.
11-5-1-title: Удио жељезничког промета у путничком приjевозу
11-5-1-definition: >-
  Удио жељезнице у копненом путничком приjевозу, изражен kao посто путничких километара. Одражава кориштење одрживиjих начина приjевоза.
11-5-1-intention: >-
  Жељезница jе енергетски учинковитиjа od automobila. Напредак значи растући удио жељезнице у путничком приjевозу.
11-5-1-methodology: >-
  Подаци od Еуростата из националних транспортних статистика. Мjери се у путничким километрима. Обjављуjе се годишnje.
11-4-1-title: Изложеност становништва загађењу зрака PM2,5
11-4-1-definition: >-
  Популациjски пондерирана годишnja изложеност PM2,5 у µg/m³. PM2,5 узрокуjе respiratorne и кардиоваскуларне болести.
11-4-1-intention: >-
  Загађење зрака водећи jе околишни узрок смртности у Европи. Напредак значи смањење изложености PM2,5.
11-4-1-methodology: >-
  Компилуjе EEA из мрежа за праћење квалитете зрака. Популациjски пондерирано. Обjављуjе се годишnje.
11-3-1-title: Стопа рециклирања комуналног отпада (урбано)
11-3-1-definition: >-
  Стопа рециклирања комуналног отпада у урбаним подручjима kao посто укупно генерираног отпада. Одражава напредак у урбаном управљањy отпадом.
11-3-1-intention: >-
  Одрживи градови требаjу учинковите системе управљања отпадом. Напредак значи растући удио урбаног отпада коjи се рециклира.
11-3-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Укључуjе рециклирање и компостирање. Обjављуjе се годишnje.
11-2-1-title: Стопа пренасeљeности стамбеног простора
11-2-1-definition: >-
  Удио становништва у пренасeљeним становима (premalo soba у односу на величину домаћинства) kao посто. Одражава неadekvatne стамбене увjете.
11-2-1-intention: >-
  Пренасeљeност утjeche на здравље и квалитет живота. Напредак значи смањење удjела коjи живе у пренасeљeним становима.
11-2-1-methodology: >-
  Подаци из EU-SILC коristešći стандардизирани омjер собa и особа. Обjављуjу се годишnje.
11-1-1-title: Становништво коjе живи у градовима
11-1-1-definition: >-
  Удио укупног становништва коjе живи у градовима, изражен kao посто. Прати тренд урбанизациjе. Подаци od Еуростата koristešći DEGURBA класификациjу.
11-1-1-intention: >-
  Градови су мотори раста, али имаjу изазове загушења и неjеднакости. Напредак захтиjева урбанизациjу с адекватном инфраструктуром.
11-1-1-methodology: >-
  Компилуjе се DEGURBA методологиjом. Градови дефинирани ≥50.000 становника и густoćom ≥1.500/km². Обjављуjе се периодично.
10-5-1-title: Gini коефициjент еквивалентног расположивог доходка
10-5-1-definition: >-
  Gini коефициjент мjери неjеднакост у расподjели еквивалентног расположивог доходка. Kreće se od 0 (савршена jеднакост) до 100 (максимална неjеднакост). Подаци из EU-SILC.
10-5-1-intention: >-
  Доходовна неjеднакост ограничава могућности и социjалну мобилност. Напредак значи opadajući Gini коефициjент.
10-5-1-methodology: >-
  Подаци из EU-SILC. Израчунава се из расподjеле еквивалентног расположивог доходка. Обjављуjе се годишnje.
10-4-1-title: Подносиоци захтjева за азил на милиjун становника
10-4-1-definition: >-
  Броj особа коjе подносе захтjев за азил на милиjун становника. Одражава миграциjске притиске. Подаци od Еуростата из азилних власти.
10-4-1-intention: >-
  Осигурање заштите димензиjа jе смањења неjеднакости. Праћење азила помаже процjени миграциjске динамике.
10-4-1-methodology: >-
  Подаци из азилних власти prema ЕУ азилним прописима. Обjављуjу се мjесечно и годишnje.
10-3-1-title: Удио доходка наjсиромашниjих 40% становништва
10-3-1-definition: >-
  Удио укупног еквивалентног расположивог доходка коjи прима наjсиромашниjих 40% расподjеле, изражен kao посто.
10-3-1-intention: >-
  Праћење удjела доходка наjсиромашниjих 40% директно мjери инклузивни раст. Напредак значи растући удио.
10-3-1-methodology: >-
  Подаци из EU-SILC. Кумулативни удио наjсиромашниjих 40% израчунава се из расподjеле. Обjављуjе се годишnje.
10-2-1-title: Релативни медиjални jаз ризика od сиромаштва
10-2-1-definition: >-
  Разлика između медиjанског доходка особа испод прага сиромаштва и прага, изражена kao посто прага. Мjери dubinu сиромаштва.
10-2-1-intention: >-
  Jаз сиромаштва показуjе колико су сиромашни далеко испод прага. Напредак значи смањење jаза.
10-2-1-methodology: >-
  Праг сиромаштва 60% медиjанског доходка. Jаз kao посто прага. Обjављуjе се годишnje.
10-1-1-title: Омjер доходка квинтила (S80/S20)
10-1-1-definition: >-
  Омjер укупног еквивалентног доходка наjбогатиjих 20% и наjсиромашниjих 20%. Мjери доходовну неjеднакост.
10-1-1-intention: >-
  Доходовна неjеднакост ограничава социjалну мобилност. Напредак значи opadajući омjер S80/S20.
10-1-1-methodology: >-
  Подаци из EU-SILC. Диjели укупни доходак горњег квинтила с доnjим. Обjављуjе се годишnje.
9-6-1-title: Удио жељезнице и унутарњих пловних путева у теретном промету
9-6-1-definition: >-
  Овај индикатор мjери удио жељезнице и унутарњих пловних путева у укупном копненом теретном промету, изражен као посто укупних тона-километара. Подаци се компилуjу od стране Еуростата из националних статистика промета.
9-6-1-intention: >-
  Преласком теретног промета с цеста на жељезнице и пловне путеве смањуjу се емисиjе, загушење и несреће. Напредак значи повећање удjела ових одрживих начина приjевоза у укупном теретном промету.
9-6-1-methodology: >-
  Подаци се компилуjу из националних статистика промета. Теретни промет мjери се у тона-километрима. Подаци се годишне обjављуjу od стране Еуростата.
9-5-1-title: Домаћинства с приступом широкопоjасном интернету
9-5-1-definition: >-
  Овај индикатор мjери удио домаћинстава с приступом широкопоjасном интернету, изражен kao посто свих домаћинстава. Широкопоjасни приступ укључуjе фиксне и мобилне широкопоjасне вeze. Подаци се прикупљају путем ЕУ истраживања о кориштењу ИКТ-а.
9-5-1-intention: >-
  Широкопоjасни приступ интернету sve jе нeophodниjе за учешће у дигиталноj економиjи и социjалну укљученост. Напредак значи повећање удjела домаћинстава прикљученних на широкопоjасни интернет.
9-5-1-methodology: >-
  Подаци се прикупљају путем годишњег ЕУ истраживања о кориштењу ИКТ-а у домаћинствима. Подаци се годишне обjављуjу od стране Еуростата.
9-4-1-title: Удио високотехнолошког извоза у укупном извозу
9-4-1-definition: >-
  Овај индикатор мjери удио високотехнолошких производа у укупном извозу прерађених добара, изражен kao посто. Подаци се компилуjу из статистика vanjske трговине (COMEXT база података).
9-4-1-intention: >-
  Висок удио високотехнолошког извоза одражава технолошку конкурентност и иновативни капацитет. Напредак значи повећање удjела високотехнолошких производа у укупном извозу.
9-4-1-methodology: >-
  Подаци се компилуjу из COMEXT базе података користећи OECD дефинициjу високотехнолошких сектора. Подаци се годишне обjављуjу od стране Еуростата.
9-3-1-title: Приjаве патената Европском уреду за патенте
9-3-1-definition: >-
  Овај индикатор мjери броj приjава патената поднесених EPO-у на милиjун становника. Патенти штите изуме и кључни су индикатор иновациjских outputa. Подаци се компилуjу из EPO евиденциjа.
9-3-1-intention: >-
  Приjаве патената наjшире се користе kao proxy за иновациjски output. Напредак значи траjно повећање приjава патената на милиjун становника.
9-3-1-methodology: >-
  Подаци се компилуjу на основу мjеста становања изумитeља из EPO евиденциjа. Подаци се годишне обjављуjу od стране Еуростата.
9-2-1-title: Истраживачи у еквиваленту пуног радног времена на милиjун становника
9-2-1-definition: >-
  Овај индикатор мjери броj истраживача у FTE еквиваленту на милиjун становника. Истраживачи су стручњаци коjи стварају ново знање, производе, процесе и системе. Подаци се компилуjу из националних И&Р статистика.
9-2-1-intention: >-
  Истраживачи су кључни input у иновациjски процес. Напредак значи повећање броjа истраживача на милиjун становника у свим секторима економиjе.
9-2-1-methodology: >-
  Подаци се прикупљају путем националних И&Р анкета prema OECD Frascati приручнику. Истраживачи се броjе у FTE еквивалентима. Подаци покриваjу пословни, владини и висоокошколски сектор.
9-1-1-title: Расходи за истраживање и развоj kao удио БДП-а
9-1-1-definition: >-
  Овај индикатор мjери бруто домаће расходе за истраживање и развоj (GERD) kao посто БДП-а. Покрива сав креативни и суставни рад за повећање знања и развоj нових примjена. Подаци се компилуjу из националних И&Р анкета.
9-1-1-intention: >-
  Улагање у И&Р кључни jе покретач иновациjа, конкурентности и дугорочног раста продуктивности. Напредак значи траjно повећање расхода за И&Р kao удjела БДП-а.
9-1-1-methodology: >-
  Подаци се прикупљају путем националних И&Р анкета prema OECD Frascati приручнику. GERD покрива сав И&Р провeден на националном териториjу. Подаци се годишне обjављуjу od стране Еуростата.
8-6-1-title: Смртне несреће на раду
8-6-1-definition: >-
  Овај индикатор мjери броj смртних несрећа на раду на 100.000 запослених
  особа. Смртна несрећа на раду дефинира се kao несрећа коjа доводи до
  смрти жртве у року od jедне године od несреће. Подаци се прикупљају путем
  Европске статистике о несрећама на раду (ESAW).
8-6-1-intention: >-
  Осигурање сигурних и здравих услова рада темељна jе димензиjа достоjанственог
  рада. Смртне несреће на раду представљаjу превентабилни губитак живота с
  тешким посљедицама за раднике, породице и друштво. Напредак значи траjно
  смањење стопе смртних несрећа на раду.
8-6-1-methodology: >-
  Подаци се компилуjу od стране Еуростата путем методологиjе ESAW. Индикатор
  покрива све несреће на раду коjе резултираjу смрћу жртве у року od jедне
  године. Подаци се обjављуjу годишње.
8-5-1-title: Млади коjи нису запослени, не образуjу се нити обучаваjу (NEET)
8-5-1-definition: >-
  NEET стопа мjери удио младих у доби od 15 до 29 година коjи нису запослени,
  не образуjу се нити обучаваjу, изражен kao посто укупног становништва у
  тоj добноj скупини. Идентификуjе младе изложене ризику искључивања с
  тржишта рада и социjалне маргинализациjе. Подаци се заснивају на EU-LFS.
8-5-1-intention: >-
  Млади у NEET категориjи суочаваjу се с дугорочним ризицима по запошљавање,
  зараде и социjалну интеграциjу. Смањење NEET стопе захтиjева улагања у
  образовање, струковну обуку и активне политике тржишта рада. Напредак значи
  траjно смањење удjела младих van запослења, образовања и обуке.
8-5-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. NEET статус комбинира информациjе
  о статусу запослености и учешћу у образовању или обуци у четири нeдjеље
  приjе анкете. Подаци се годишње обjављуjу od стране Еуростата.
8-4-1-title: Стопа дуготраjне незапослености
8-4-1-definition: >-
  Стопа дуготраjне незапослености jе удио особа незапослених 12 или više
  мjесеци, изражен kao посто активне радне снаге. Дуготраjна незапосленост
  указуjе на структурни проблем тржишта рада повезан с ерозиjом вjештина и
  социjалном искљученошћу. Подаци се заснивају на EU-LFS анкети.
8-4-1-intention: >-
  Дуготраjна незапосленост наруšава вjештине, смањуjе запошљивост и повећава
  ризик od сиромаштва и социjалне искључeности. Решавање захтиjева активне
  политике тржишта рада и програме прeквалификациjе. Напредак значи траjно
  смањење стопе дуготраjне незапослености.
8-4-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. Незапосленост се дефинира prema
  ILO стандардима: особе без посла, доступне за рад и активно траже запослење.
  Дуготраjно незапослени су они незапослени 12 или više мjесеци.
8-3-1-title: Стопа запослености
8-3-1-definition: >-
  Стопа запослености jе удио особа у доби od 20 до 64 године коjе су запослене,
  изражен kao посто укупног становништва у тоj добноj скупини. Jедан jе od
  наjшире коришћених индикатора перформанси тржишта рада. Подаци се заснивају
  на Анкети о радноj снази ЕУ (EU-LFS).
8-3-1-intention: >-
  Висоcка стопа запослености кључна jе за економски просперитет, социjалну
  укљученост и одрживост система социjалне заштите. Повећање запослености
  захтиjева политике коjе подржаваjу креирање радних мjеста и развоj вjештина.
  Напредак значи траjно повећање стопе запослености.
8-3-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. Запосленост се дефинира prema ILO
  стандардима: особе коjе су радиле бар jедан сат уз накнаду током референтне
  нeдjеље. Подаци се обjављуjу годишnje и тромjесечно od стране Еуростата.
8-2-1-title: Бруто инвестициjе у фиксни капитал kao удио БДП-а
8-2-1-definition: >-
  Овај индикатор мjери бруто инвестициjе у фиксни капитал (улагања у физичку
  имовину) kao посто БДП-а. Одражава разину инвестициjа у економиjи и
  капацитет за будући раст. Подаци се компилуjу od стране Еуростата из
  националних рачуна.
8-2-1-intention: >-
  Улагања у физички капитал кључни су покретач раста продуктивности и
  дугорочног економског развоjа. Адекватне инвестициjе подржаваjу иновациjе,
  креирање радних мjеста и побољшања инфраструктуре. Напредак значи
  одржавање или повећање инвестициjског удjела БДП-а.
8-2-1-methodology: >-
  Подаци се компилуjу из националних рачуна prema Европском систему рачуна
  (ESA 2010). Бруто инвестициjе покриваjу набавке фиксне имовине умањене за
  отуђења резидентних произвођача. Подаци се годишње обjављуjу.
8-1-1-title: Реални БДП по становнику
8-1-1-definition: >-
  Реални БДП по становнику jе бруто домаћи производ по тржишним циjенама
  подиjељен с броjем становника средином године, изражен у lančanim obujmima.
  Наjшире jе коришћени индикатор економског outputa и животног стандарда.
  Стопе раста одражаваjу економске перформансе korigirane за инфлациjу.
8-1-1-intention: >-
  Траjни, инклузивни и одрживи економски раст кључан jе за смањење сиромаштва
  и побољшање животног стандарда. Раст реалног БДП-а по становнику одражава
  побољшања продуктивности и економске добробити. Напредак значи позитивна
  и траjна стопа раста реалног БДП-а по становнику.
8-1-1-methodology: >-
  Подаци се компилуjу из националних рачуна prema ESA 2010. Реални БДП користи
  lančane volumenske мjере за уклањање утjецаjа промjена циjена. Подаци по
  становнику користе процjене становништва средином године.
7-6-1-title: Становништво које не може адекватно гриjати дом
7-6-1-definition: >-
  Овај индикатор мjери удио становништва које ниjе у могућности адекватно
  гриjати своj дом, kao удио укупног становништва. Jедан jе od кључних
  индикатора енергетског сиромаштва у Европи. Подаци се прикупљају путем
  EU анкете о приходима и условима живота (EU-SILC).
7-6-1-intention: >-
  Енергетско сиромаштво утjеche на здравље, добробит и квалитет живота,
  посебно за домаћинства с нижим приходима. Осигурање да све особе могу
  приуштити гриjање дома темељна jе димензиjа приступачне и чисте енергиjе.
  Напредак значи траjно смањење удjела становништва коjе се суочава с
  енергетским сиромаштвом.
7-6-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете, коjа пита испитанике могу ли
  приуштити адекватно гриjање дома. Индикатор се изражава kao посто укупног
  становништва. Подаци се прикупљају годишње и обjављуjу od стране Еуростата.
7-5-1-title: Зависност od увоза енергиjе
7-5-1-definition: >-
  Стопа зависности od увоза енергиjе показуjе у коjоj мjери се економиjа
  ослања на увоз енергиjе kako би задовољила своjе енергетске потребе.
  Израчунава се kao нето увоз енергиjе подиjeljен с брuto потрошњом енергиjе
  у земљи, изражен kao посто. Виша стопа значи већу зависност od увозне
  енергиjе.
7-5-1-intention: >-
  Висоcка зависност od увоза енергиjе излаже економиjе ризику прекида
  опскрбе и волатилности циjена. Смањење зависности кроз енергетску
  учинковитост и развоj обновљивих извора подржава енергетску сигурност.
  Напредак значи смањење стопе зависности od увоза енергиjе.
7-5-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских
  статистика достављених prema EU прописима. Бруто потрошња енергиjе у
  земљи покрива сву енергиjу потребну за задовоljenje домаће потражnje.
  Нето увоз израчунава се kao увоз минус извоз и промjене залиха.
7-4-1-title: Краjња потрошња енергиjе
7-4-1-definition: >-
  Краjња потрошња енергиjе мjери укупну енергиjу коjу troše краjњи корисници
  (индустриjа, транспорт, домаћинства, услуге и пољопривреда), искључуjући
  енергиjу коjу користи сам енергетски сектор. Изражава се у милиjунима тона
  еквивалента нафте (Mtoe). Подаци се компилуjу od стране Еуростата из
  националних енергетских биланци.
7-4-1-intention: >-
  Смањење краjње потрошње енергиjе кључно jе за испуњавање климатских циљева
  и побoljšanje енергетске сигурности. Побољшања енергетске учинковитости
  омогућавају економски раст одвоjен od потрошње енергиjе. Напредак значи
  траjно смањење краjње потрошње енергиjе уз одржавање економске активности.
7-4-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских биланци
  извjештених prema EU прописима. Краjња потрошња енергиjе искључуjе
  неенергетску употребу и енергиjу потрошену od стране сектора трансформациjе
  енергиjе. Подаци се годишње извjештавају у тонама еквивалента нафте.
7-3-1-title: Примарна потрошња енергиjе
7-3-1-definition: >-
  Примарна потрошња енергиjе мjери укупну енергетску потражњу земље,
  покриваjући потрошњу свих облика енергиjе приjе bilo каквог процеса
  трансформациjе. Изражава се у милиjунима тона еквивалента нафте (Mtoe).
  Укључуjе енергиjу коjу користи енергетски сектор, губитке у дистрибуциjи
  и краjњу потрошњу свих сектора.
7-3-1-intention: >-
  Смањење примарне потрошње енергиjе уз одржавање економског раста кључно
  jе за побoljšanje енергетске учинковитости и испуњавање климатских циљева.
  Одваjање економског раста od потрошње енергиjе централни jе аспект
  одрживог развоjа. Напредак значи опадаjући тренд примарне потрошње енергиjе.
7-3-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских биланци
  достављених prema EU прописима о енергетским статистикама. Примарна потрошња
  енергиjе израчунава се методом супституциjе за нуклеарну и обновљиву
  електричну енергиjу. Подаци се обjављуjу годишње.
7-2-1-title: Удио обновљивих извора енергиjе у бруто краjњоj потрошњи енергиjе
7-2-1-definition: >-
  Овај индикатор мjери удио енергиjе из обновљивих извора (виjетар, Сунце,
  хидроенергиjа, геотермална, океанска, биомаса и биогорива) у бруто краjњоj
  потрошњи енергиjе, изражен kao посто. Покрива обновљиву енергиjу коришћену
  у електрици, гриjању и хлађењу те транспорту. Подаци се компилуjу od
  стране Еуростата из националних енергетских статистика.
7-2-1-intention: >-
  Повећање удjела обновљивих извора енергиjе кључно jе за смањење емисиjа
  стакленичких гасова из енергетског сектора и постизање климатских циљева.
  Обновљиви извори доприносе и енергетскоj сигурности и дугорочном смањењу
  трошкова. Напредак значи траjно повећање удjела обновљиве енергиjе у
  укупноj потрошњи.
7-2-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских статистика
  извjештених prema Директиви о обновљивим изворима енергиjе. Бруто краjња
  потрошња енергиjе укључуjе енергиjу испоручену краjњим корисницима plus
  губитке у мрежи електричне енергиjе и дистрибутивним мрежама.
7-1-1-title: Енергетска продуктивност
7-1-1-definition: >-
  Енергетска продуктивност мjери колико економског outputa се генерира по
  jединици потрошене енергиjе. Израчунава се kao БДП подиjељен с бруто
  потрошњом енергиjе у земљи и изражава у еурима по килограму еквивалента
  нафте (EUR/kgoe). Виша вриjедност указуjе на учинковитиjе кориштење
  енергиjе за генерирање економског outputa.
7-1-1-intention: >-
  Побoljšanje енергетске продуктивности централно jе за одваjање економског
  раста od потрошње енергиjе и смањење притисака на околиш. Продуктивниjе
  кориштење енергиjе снижава трошкове за предузећа и домаћинства и смањуjе
  емисиjе. Напредак значи траjно повећање енергетске продуктивности током
  времена.
7-1-1-methodology: >-
  Енергетска продуктивност израчунава се od стране Еуростата користећи БДП
  податке (lančani obujmi, референтна година 2010) и бруто потрошњу енергиjе
  из националних енергетских биланци. Оба индикатора компилуjу се prema EU
  прописима о енергетским статистикама. Подаци се обjављуjу годишње.
6-5-1-title: Водна тиjела с добрим еколошким статусом
6-5-1-definition: >-
  Овај индикатор мjери удио површинских водних тиjела (риjеке, jезера,
  приjелазне и приобалне воде) која постижу добар или висок еколошки статус
  или потенциjал, как је дефинисано Оквирном директивом о водама ЕУ. Изражава
  се као посто свих процијењених водних тиjела. Подаци се извjештавају од
  стране država чланица сваких шест година.
6-5-1-intention: >-
  Еколошки статус водних тиjела одражава свеукупно здравље водених екосистема
  и притиске коjима су изложени od људских активности. Постизање доброг
  еколошког статуса централни jе циљ Оквирне директиве о водама. Напредак
  значи повећање удjела површинских водних тиjела која постижу добар или висок
  еколошки статус.
6-5-1-methodology: >-
  Подаци се извjештавају od strane država ЕУ Европскоj агенциjи за околиш
  (EEA) у оквиру Оквирне директиве о водама (2000/60/EC). Еколошки статус
  процjењуjе се на основу биолошких, хидроморфолошких и физикално-хемијских
  елемената квалитете. Циклуси извjештавања траjу шест година.
6-4-1-title: Концентрациjа нитрата у подземним водама
6-4-1-definition: >-
  Овај индикатор мjери удио постаjа за праћење подземних вода гдjе просjечна
  концентрациjа нитрата прелази 50 миligrama по литри (ЕУ праг према Директиви
  о нитратима). Изражава се као посто свих праћених постаjа. Подаци се
  извjештавају od strane država чланица у оквиру Директиве о нитратима.
6-4-1-intention: >-
  Загађење подземних вода нитратима, примарно из пољопривредних извора,
  представља ризик за квалитет питке воде и водене екосистеме. Смањење
  концентрациjа нитрата захтиjева побoljšano управљање нутриjентима у
  пољопривреди. Напредак значи смањење удjела постаjа коjе прелазе праг od
  50 mg/l.
6-4-1-methodology: >-
  Подаци се прикупљају od strane država чланица према Директиви Виjећа
  91/676/EEZ о заштити вода od загађења uzrokovanog нитратима из пољопривредних
  извора и извjештавају Европскоj комисиjи сваке четири године. Еуростат
  компилуjе и обjављуjе податке.
6-3-1-title: Биохемиjска потрошња кисика у риjекама
6-3-1-definition: >-
  Овај индикатор мjери биохемиjску потрошњу кисика (BPK) у риjекама, коjа
  одражава количину кисика утрошену биолошким процесима при разградњи органске
  материjе у води. Ниже вриjедности BPK-а указуjу на бољи квалитет воде.
  Изражава се у миligramima кисика по литри и заснива се на подacima с постаjа
  за праћење риjека.
6-3-1-intention: >-
  Висоcке разине органског загађења у риjекама смањуjу отопљени кисик, штете
  водним живим бићима и могу учинити воду неупотребљивом за људе. Смањење
  BPK-а у риjекама кључно jе за побoljšanje квалитета воде и заштиту
  слатководних екосистема. Напредак значи смањење просjечних разина BPK-а
  на праћеним постаjама.
6-3-1-methodology: >-
  Подаци се прикупљају из националних мрежа за праћење риjека и компилуjу
  od strane Еуростата у сарадњи с Европском агенциjом за околиш (EEA). BPK
  се мjери на стандардизованим постаjама и представља кисик утрошен током пет
  дана на 20°C (BPK5). Подаци се извjештавају годишње.
6-2-1-title: Становништво прикључено на пречишћавање отпадних вода
6-2-1-definition: >-
  Овај индикатор мjери удио становништва чиjе се отпадне воде прикупљаjу и
  обрађуjу у построjењима за пречишћавање комуналних отпадних вода, изражен
  kao посто. Покрива наjмање секундарни (биолошки) третман. Подаци се
  извjештавају od strane država чланица у оквиру Директиве о комуналним
  отпадним водама и компилуjу od strane Еуростата.
6-2-1-intention: >-
  Приступ адекватном пречишћавању отпадних вода теmeljan jе за заштиту
  квалитета воде и jавног здравља. Непречишћене отпадне воде загађуjу риjеке,
  jезера и приобалне воде. Напредак значи повећање удjела становништва
  прикљученог на наjмање секундарно пречишћавање отпадних вода.
6-2-1-methodology: >-
  Подаци се извjештавају od strane država чланица сваке двиjе године prema
  Директиви Виjећа 91/271/EEZ о пречишћавању комуналних отпадних вода.
  Индикатор покрива агломерациjе коjе генеришу više od 2.000 еквивалената
  становника. Еуростат компилуjе и обjављуjе податке kao посто укупног
  становништва.
6-1-1-title: Индекс експлоатациjе воде
6-1-1-definition: >-
  Индекс експлоатациjе воде (WEI+) мjери захватање слатке воде kao удио
  доступних обновљивих слатководних ресурса (дугорочни просjечни годишњи
  обновљиви слатководни ресурси умањени за захтjеве еколошког протока).
  Изражава се kao посто. Вриjедности iznad 20% указуjу на водни стрес;
  iznad 40% на озбиљан водни стрес.
6-1-1-intention: >-
  Несташица воде sve jе већа приjетња екосистемима, економиjама и људскоj
  добробити. Праћење захватања слатке воде у односу на доступне ресурсе
  кључно jе за одрживо управљање водама. Напредак значи одржавање индекса
  испод прагова стреса кроз ефикасно кориштење воде.
6-1-1-methodology: >-
  Подаци се компилуjу od strane Еуростата из националних статистика о водама
  коjе извjештавају државе чланице. Захватање слатке воде обухвата воду
  захваћену из риjека, jезера, акумулациjа и подземних вода за све намjене.
  Доступни ресурси процjењуjу се из дугорочних хидролошких података
  кorigiranih за захтjеве еколошког протока.
5-6-1-title: Родна разлика у кориштењу интернета
5-6-1-definition: >-
  Овај индикатор мjери разлику između удjела мушкараца и жена у доби од 16 до
  74 године који су користили интернет у посљедња три мjесеца, изражену у
  процентним поенима. Позитивна вриjедност указуjе на веће кориштење интернета
  од стране мушкараца. Подаци се прикупљају путем ЕУ истраживања о кориштењу
  ИКТ-а у домаћинствима и од стране поjединаца.
5-6-1-intention: >-
  Дигитални родни jаз одражава шире неједнакости у приступу технологиjи,
  информациjама и економским приликама. Затварање jаза захтиjева циљане
  политике за побољшање дигиталног приступа, вjештина и самопоуздања жена.
  Напредак значи смањење разлике između стопа кориштења интернета мушкараца
  и жена.
5-6-1-methodology: >-
  Подаци се прикупљају путем ЕУ истраживања о кориштењу ИКТ-а у домаћинствима
  и од стране поjединаца, које се проводи годишње. Кориштење интернета односи
  се на bilo kakву употребу интернета у три мjесеца приjе анкете. Родни jаз
  израчунава се као разлика između стопа кориштења интернета мушкараца и жена,
  изражена у процентним поенима.
5-5-1-title: Мjеста која заузимају жене у националним парламентима
5-5-1-definition: >-
  Овај индикатор мjери удио мjеста која заузимају жене у националним
  парламентима (jednodomnim или доњим домовима), изражен као посто свих
  попуњених мjеста. Подаци се добиjају од Мeђупарламентарне униjе (IPU)
  и компилуjу од стране Еуростата.
5-5-1-intention: >-
  Равноправно учешће жена и мушкараца у политичком одлучивању темељни је
  аспект равноправности полова и демократског управљања. Повећање заступљености
  жена у парламенту осигурава да се перспективе и интереси жена одражавају у
  законодавству и политикама. Напредак значи повећање удjела мjеста у парламенту
  која заузимају жене.
5-5-1-methodology: >-
  Подаци се добиjају од Мeђупарламентарне униjе (IPU) и односе се на стање на
  1. jануара сваке године. Индикатор покрива jednodomne парламенте и доње домове
  двodomних парламената. Подаци се односе на посто жена међу свим члановима
  парламента с важећим мандатом.
5-4-1-title: Жене у управним одборима великих листираних компанија
5-4-1-definition: >-
  Овај индикатор мjери удио жена међу члановима управних одбора највећих јавно
  листираних компанија, изражен као посто свих чланова одбора. Обухвата и
  извршне и неизвршне чланове одбора. Подаци се прикупљају од стране Еуростата
  у сарадњи с Европским институтом за равноправност полова (EIGE).
5-4-1-intention: >-
  Жене су и даље пodzаступљене на вишим руководећим позицијама у корпоративном
  сектору. Повећање удjела жена у управним одборима компанија промовише
  равноправност полова и повезано је с бољим управљањем и пословним резултатима.
  Напредак значи трајно повећање удjела жена на позицијама чланова одбора.
5-4-1-methodology: >-
  Подаци се прикупљају из националних извора од стране Еуростата у сарадњи с
  EIGE-ом. Индикатор покрива највеће јавно листиране компаније регистроване у
  свакој земљи. Чланови одбора укључују и чланове надзорних и управљачких одбора.
5-3-1-title: Јаз у пензијама između полова
5-3-1-definition: >-
  Јаз у пензијама između полова је разлика između просjечних прихода од пензија
  које примају мушкарци и жене у доби од 65 до 79 година, изражена као посто
  просjечних пензијских прихода мушкараца. Одражава накупљене неједнакости с
  тржишта рада, укључуjући разлике у стопама запослености, радном времену,
  платама и прекидима каријере. Подаци се заснивају на EU-SILC анкети.
5-3-1-intention: >-
  Јаз у пензијама između полова посљедица је неједнакости у запослењу и
  зарадама током цијелог радног вијека. Затварање јаза захтијева рjешавање
  темељних узрока, укључујући прекиде каријере због скрби, рад с непуним
  радним временом и сегрегацију по занимањима. Напредак значи трајно смањење
  јаза у пензијским приходима između мушкараца и жена.
5-3-1-methodology: >-
  Подаци се прикупљају путем EU анкете о приходима и условима живота (EU-SILC).
  Пензијски приходи укључују старосне пензије и пензије преживjелих. Јаз у
  пензијама između полова израчунава се као разлика između просjечних пензијских
  прихода мушкараца и жена, изражена као посто просjечног пензијског прихода
  мушкараца, за особе у доби од 65 до 79 година.
5-2-1-title: Јаз у платама између полова
5-2-1-definition: >-
  Некоригован јаз у платама између полова је разлика између просјечних бруто
  сатних зарада запослених мушкараца и жена, изражена као посто просјечних
  бруто сатних зарада мушкараца. Заснива се на запосленицима у фирмама с
  десет или више запослених. Подаци се прикупљају путем Истраживања о
  структури зарада.
5-2-1-intention: >-
  Јаз у платама између полова одражава трајне неједнакости između мушкараца и
  жена на тржишту рада, укључујући разлике у секторима, занимањима, радном
  времену и прекидима каријере. Затварање јаза захтијева рjешавање сегрегације
  по занимањима и дискриминације. Напредак значи трајно смањење јаза у платама.
5-2-1-methodology: >-
  Подаци се прикупљају путем Истраживања о структури зарада (SES), које се
  проводи сваке четири године, с годишњим процјенама које израђује Еуростат.
  Индикатор покрива све економске активности осим јавне управе и заснива се
  на бруто сатним зарадама у фирмама с десет или више запослених.
5-1-1-title: Јаз у запослености između полова
5-1-1-definition: >-
  Јаз у запослености између полова је разлика између стопа запослености
  мушкараца и жена у доби од 20 до 64 године, изражена у процентним поенима.
  Позитивна вриједност значи да мушкарци имају вишу стопу запослености од жена.
  Подаци се заснивају на Анкети о радној снази ЕУ (EU-LFS).
5-1-1-intention: >-
  Јаз у запослености између полова одражава структурне неједнакости на тржишту
  рада. Затварање јаза захтијева политике које подржавају учешће жена у
  запослењу, укључујући приступачну дјечију заштиту, флексибилне радне аранжмане
  иједнаке могућности. Напредак значи трајно смањење разлике између стопа
  запослености мушкараца и жена.
5-1-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Стопа
  запослености израчунава се као посто запослених особа у укупној популацији
  у доби од 20 до 64 године. Јаз у запослености између полова је разлика između
  стопа запослености мушкараца и жена, изражена у процентним поенима.
4-6-1-title: Учешће одраслих у учењу
4-6-1-definition: >-
  Овај индикатор мјери удио одраслих у доби од 25 до 64 године који су
  учествовали у формалном или неформалном образовању и обуци у четири недјеље
  које су претходиле анкети. Изражава се као посто укупног становништва у
  доби од 25 до 64 године. Подаци се заснивају на Анкети о радној снази ЕУ.
4-6-1-intention: >-
  Цјеложивотно учење је кључно за прилагодбу промјенљивом тржишту рада и
  одржавање запошљивости. Веће учешће одраслих у учењу смањује неусклађеност
  вјештина и подржава социјалну укљученост. Циљ је повећати удио одраслих
  који се континуирано образују током свог живота.
4-6-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Формално
  образовање односи се на образовање које пружа редовни систем школа,
  универзитета и других формалних образовних институција. Неформално
  образовање укључује све организоване образовне активности изван формалног
  система.
4-5-1-title: Особе с барем основним дигиталним вјештинама
4-5-1-definition: >-
  Овај индикатор мјери удио особа у доби од 16 до 74 године које посједују
  барем основне дигиталне вјештине у четири области: информациона и податковна
  писменост, комуникација и сарадња, рјешавање проблема и креирање дигиталног
  садржаја. Изражава се као посто укупног становништва у доби од 16 до 74.
4-5-1-intention: >-
  Дигиталне вјештине су све više неопходне за учешће на тржишту рада и у
  друштву. Осигурање дигитално компетентног становништва подржава економски
  раст, иновације и социјалну укљученост. Напредак значи повећање удјела
  особа с барем основним дигиталним компетенцијама.
4-5-1-methodology: >-
  Подаци се прикупљају путем ЕУ истраживања о коришћењу ИКТ-а у домаћинствима
  и од стране појединаца. Композитни индикатор дигиталних вјештина заснива се
  на ЕУ Оквиру дигиталних компетенција (DigComp) и покрива активности обављене
  у 3 мјесеца прије анкете.
4-4-1-title: Ученици с ниским постигнућима у читању, математици и природним наукама
4-4-1-definition: >-
  Овај индикатор мјери удио 15-годишњих ученика који не досtigну ниво 2
  (минимални ниво компетентности) у читању, математици и природним наукама,
  на основу OECD Програма за међународну процјену ученика (PISA). Изражава се
  као посто свих процијењених ученика.
4-4-1-intention: >-
  Осигурање минималних компетенција писмености и математике за све младе
  кључно је за квалитетно образовање. Висоcке стопе слабих постигнућа
  ограничавају будуће могућности запослења и економског учешћа. Напредак
  значи смањење удјела ученика с ниским постигнућима у све три области.
4-4-1-methodology: >-
  Подаци долазе из OECD PISA истраживања, које се проводи сваке три године
  међу ученицима од 15 година. Ниво 2 компетентности је базични ниво на ком
  ученици почињу показивати компетенције које им омогућавају активно учешће
  у модерном друштву. Истраживање покрива читање, математику и природне науке.
4-3-1-title: Учешће у раном дјечијем образовању
4-3-1-definition: >-
  Овај индикатор мјери удио дјеце у доби од 3 године до почетка обавезног
  школовања која учествују у програмима раног дјечијег образовања. Изражава
  се као посто становништва у истој добној групи. Подаци се прикупљају из
  националних административних извора.
4-3-1-intention: >-
  Рано дјечије образовање кључно је за припрему дјеце за основну школу и
  цјеложивотно учење. Висоcке стопе учешћа смањују неједнакости и подржавају
  когнитивни, емоционални и социјални развој од најраније доби. Дугорочни
  циљ је максимизирати учешће све дјеце у квалитетном раном образовању.
4-3-1-methodology: >-
  Подаци се компилују од стране Еуростата из националних административних
  извора и односе се на дјецу уписану у програме ISCED 2011 нивоа 0 (рано
  дјечије образовање). Покривеност укључује јавне и приватне институције.
  Референтна популација су дјеца од 3 године до почетка обавезног школовања.
4-2-1-title: Терцијарно образовање (25–34 године)
4-2-1-definition: >-
  Овај индикатор мјери удио особа у доби од 25 до 34 године које су успјешно
  завршиле терцијарно образовање (ISCED 2011 нивои 5–8). Изражава се као
  посто укупног становништва у тој добној групи. Подаци се заснивају на
  Анкети о радној снази ЕУ.
4-2-1-intention: >-
  Повећање удјела особа с терцијарним образовањем кључно је за развој
  квалификоване радне снаге способне за подстицање иновација и економског
  раста. Виши нивои образовања повезани су с бољим изгледима за запослење,
  вишим приходима и већим грађанским ангажовањем. Напредак подразумијева
  континуирани раст удјела младих који завршавају терцијарно образовање.
4-2-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Терцијарно
  образовање одговара ISCED 2011 нивоима 5 до 8, који обухватају кратке
  терцијарне програме, прва степенске студије, другостепене студије и
  докторске програме. Добна група 25–34 одабрана је јер је већина особа у
  том распону завршила иницијално образовање.
4-1-1-title: Рано напуштање образовања и обуке
4-1-1-definition: >-
  Рано напуштање образовања и обуке односи се на особе у доби од 18 до 24
  године које су стекле највише ниже средње образовање и нису укључене у
  даље образовање или обуку. Индикатор се изражава као посто укупног
  становништва у доби од 18 до 24 године. Подаци се заснивају на Анкети
  о радној снази ЕУ.
4-1-1-intention: >-
  Смањење раног напуштања образовања кључно је за осигурање да сви млади
  стекну знања и вјештине неопходне за запослење и активно грађанство.
  Високе стопе раног напуштања повезане су с нижим приходима, вишом
  незапосленошћу и већом зависношћу од система социјалне подршке.
  Дугорочни циљ је минимизирати удио оних који рано напуштају школовање.
4-1-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS), великог
  истраживања домаћинстава које пружа тромјесечне статистике о учешћу на
  тржишту рада. Индикатор обухвата особе од 18 до 24 године чији је највиши
  ниво образовања ISCED 2011 ниво 0, 1 или 2, и које су изјавиле да нису
  биле укључене у никакво образовање или обуку у четири недјеље које су
  претходиле анкети.metadata-footer-label: Национални референтни метаподаци

