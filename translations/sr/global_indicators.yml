1-1-1-title: Особе у ризику од сиромаштва или социјалне искључености
1-1-1-definition: >-
  Овај индикатор одговара збиру људи који су: у ризику од сиромаштва након социјалних трансфера, 
  тешко материјално и социјално депривирани, или живе у домаћинствима са веома ниским интензитетом рада. 
  Појединци се броје само једном, чак и ако је на њих утицало више од једног од ових догађаја. 
  Сматра се да су људи изложени ризику од сиромаштва након социјалних трансфера ако њихов 
  еквивалентни расположиви доходак није већи од прага ризика од сиромаштва, који је постављен 
  на 60% националног средњег еквивалентног расположивог дохотка. Стопа тешке материјалне и 
  социјалне депривације је удио становништва које доживљава присилни недостатак од најмање 
  7 од 13 ставки депривације.
1-1-1-intention: >-
  Сиромаштво и социјална искљученост су штетни за животе појединаца и ограничавају могућности људи 
  да остваре свој пуни потенцијал утичући на њихово здравље и благостање те смањујући образовне исходе. 
  Без ефикасног система социјалне заштите, ризик од сиромаштва се преноси са једне генерације на другу, 
  што ствара још већу неједнакост и омета инклузивни и одрживи економски раст. Дугорочни циљ за овај 
  индикатор је вриједност од 0.
1-1-1-methodology: >-
  Подаци се заснивају на хармонизованом годишњем истраживању о приходима и условима живота (ЕУ-СИЛЦ). 
  У 2020. години, ЕУ-СИЛЦ је прошао опсежне методолошке ревизије и интегрисан је у микроцензус. 
  Као резултат тога, подаци од 2020. године надаље нису упоредиви са подацима из претходних година. 
  Од 2021. године примјењује се Уредба (ЕУ) 2019/1700 која дефинише стандарде прикупљања и обраде података.
1-2-1-title: Особе у опасности од монетарног сиромаштва након социјалних трансфера
1-2-1-definition: >-
  Омјер доходака квинтила (S80/S20) је омјер укупног еквивалентног расположивог
  доходка који прима 20% најближих највишем дохотку становништва према доходку
  који прима 20% са најнижим дохотком. Виша вриједност указује на већу
  неједнакост у доходку. Подаци потичу из ЕУ анкете о приходима и условима
  живота (EU-SILC).
1-2-1-intention: >-
  Неједнакост у доходку поткопава друштвену кохезију и ограничава животне
  могућности оних на дну расподјеле доходка. Смањење неједнакости предуслов је
  за одрживи и инклузивни раст. Напредак значи смањење омјера S80/S20 током
  времена.
1-2-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Еквивалентни расположиви доходак
  је укупни приход домаћинства након пореза и одбитака, подијељен еквивалентном
  величином домаћинства. Анкета се проводи годишње у свим земљама учесницама.
1-3-1-title: Стопа тешке материјалне и социјалне ускраћености према старосној групи и полу
1-3-1-definition: >-
  Овај индикатор мјери удио становништва обухваћеног бар једном накнадом
  социјалне заштите, укључујући накнаде везане за старост, инвалидност, болест,
  незапосленост, породицу и становање. Изражава се као посто укупног становништва.
  Подаци се заснивају на EU-SILC анкети.
1-3-1-intention: >-
  Ефикасни системи социјалне заштите спречавају сиромаштво и смањују утицај
  економских шокова на појединце и породице. Широка покривеност осигурава да
  они којима је потребна помоћ добију подршку на вријеме. Напредак значи
  проширење ефективне покривености на све сегменте становништва.
1-3-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете, која прикупља информације о
  социјалним трансферима примљеним у домаћинствима. Индикатор обухвата и
  доприносне и недоприносне накнаде у свим категоријама социјалне заштите.
1-4-1-title: Особе која живе у домаћинствима са веома ниским интензитетом рада, по старосним групама
1-4-1-definition: >-
  Стопа оптерећености трошковима становања је удио становништва које живи у
  домаћинствима гдје укупни трошкови становања (умањени за стамбене накнаде)
  представљају више од 40% укупног расположивог доходка домаћинства. Изражава
  се као посто. Подаци се заснивају на EU-SILC анкети.
1-4-1-intention: >-
  Претјерани трошкови становања смањују расположиви доходак за остале животне
  нужности и повећавају ризик од сиромаштва и социјалне искључености. Праћење
  овог индикатора помаже идентификовати домаћинства под финансијским притиском
  становања. Напредак значи смањење удјела особа оптерећених трошковима
  становања.
1-4-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Трошкови становања укључују
  кирију, отплату хипотеке, комуналије и одржавање. Стамбене накнаде одузимају
  се и од трошкова и од доходка прије израчунавања прага од 40%.
1-4-2-title: Стопа запослених у ризику од сиромаштва
1-4-2-definition: >-
  Стопа тешке стамбене депривације је удио становништва које живи у пренасељеним
  становима који уједно немају барем једно од сљедећег: каду или туш, унутарњи
  тоалет с испирањем, или имају цурећи кров или влажне зидове. Изражава се
  као посто. Подаци се заснивају на EU-SILC анкети.
1-4-2-intention: >-
  Адекватно становање темељна је људска потреба и кључна одредница здравља и
  добробити. Тешка стамбена депривација има директан негативан утицај на
  физичко и ментално здравље, образовне резултате и социјалну партиципацију.
  Напредак значи трајно смањење стопе тешке стамбене депривације.
1-4-2-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете. Пренасељеност се процјењује у
  односу на величину и састав домаћинства. Депривација квалитете становања
  обухвата структурне проблеме (цурећи кров, влажни зидови) и недостатак
  основних објеката (купатило, унутарњи WC).
1-5-1-title: Стопа прекомјерног оптерећења трошковима становања према статусу сиромаштва
1-5-1-definition: >-
  Овај индикатор прати смртне случајеве и економске губитке приписане
  катастрофама, укључујући природне хазарде као што су поплаве, олује, суше
  и екстремне температуре. Користи се за процјену отпорности становништва на
  климатске и друге катастрофалне догађаје. Подаци се компилују из националних
  органа цивилне заштите и међународних база података.
1-5-1-intention: >-
  Изградња отпорности на катастрофе кључна је за заштиту живота, средстава за
  живот и развојних достигнућа. Земље с ефикасним стратегијама смањења ризика
  имају мањи број смртних случајева и мање економске губитке. Напредак значи
  смањење смртности и губитака узрокованих катастрофама.
1-5-1-methodology: >-
  Подаци се прикупљају од националних органа цивилне заштите, уз допуну
  међународним базама података као што је EM-DAT. Индикатор обухвата
  катастрофалне догађаје који захтијевају хитну реакцију и резултирају
  људским или значајним економским губицима.
2-1-1-title: Индекс потрошачких цијена хране
2-1-1-definition: >-
  Индекс потрошачких цијена хране мјери промјене цијена које потрошачи плаћају
  за храну и безалкохолна пића током времена. Изражава се као индекс с
  референтним периодом једнаким 100. Раст цијена хране може повећати прехрамбену
  несигурност, посебно у домаћинствима с нижим приходима. Подаци се компилују
  од стране Еуростата из националних статистичких органа.
2-1-1-intention: >-
  Стабилне и приступачне цијене хране кључне су за осигурање приступа адекватној
  исхрани за све сегменте становништва. Нагли раст цијена хране несразмјерно
  погађа домаћинства с нижим приходима и може довести до прехрамбене несигурности.
  Праћење овог индикатора доприноси ширем циљу елиминације глади.
2-1-1-methodology: >-
  Подаци се заснивају на хармонизованом индексу потрошачких цијена (HICP),
  подиндекс хране, прикупљеном мјесечно од стране националних статистичких
  органа. Индекс покрива сву храну и безалкохолна пића prema COICOP класификацији.
2-2-1-title: Стопа прекомјерне тежине и гојазности код одраслих
2-2-1-definition: >-
  Овај индикатор мјери удио одраслих особа у доби од 18 и више година
  класификованих као особе с прекомјерном тежином или гојазних на основу
  индекса тјелесне масе (ИТМ). Прекомјерна тежина дефинисана је као ИТМ
  ≥ 25 kg/m², а гојазност као ИТМ ≥ 30 kg/m². Изражава се као посто одраслог
  становништва. Подаци се прикупљају путем Европског здравственог
  интервјуног истраживања (EHIS).
2-2-1-intention: >-
  Прекомјерна тежина и гојазност главни су фактори ризика за незаразне болести,
  укључујући кардиоваскуларне болести, дијабетес типа 2 и одређене врсте рака.
  Растуће стопе гојазности стварају значајно оптерећење здравственим системима.
  Напредак значи стабилизацију или смањење преваленције прекомјерне тежине и
  гојазности у популацији.
2-2-1-methodology: >-
  Подаци се прикупљају путем Европског здравственог интервјуног истраживања
  (EHIS), које се проводи отприлике сваких пет година. ИТМ се израчунава из
  самопријављене висине и тежине. EHIS примјењује хармонизовану методологију
  у свим земљама учесницама, омогућавајући међународне поредбе.
2-3-1-title: Индекс птица пољопривредног земљишта
2-3-1-definition: >-
  Индекс птица пољопривредног земљишта мјери промјене у популацији врста птица
  везаних за пољопривредна станишта, користећи 1990. годину као базну (индекс =
  100). Пад популације птица пољопривредног земљишта указује на губитак
  биоразноликости узрокован интензивирањем пољопривреде. Подаци се прикупљају
  из националних програма праћења птица.
2-3-1-intention: >-
  Разноликост популација птица у пољопривредним крајоликам показатељ је
  еколошког здравља пољопривредних система. Стабилне или растуће популације
  птица сигнализирају да пољопривредне праксе подржавају биоразноликост.
  Заустављање и преокрет пада популације птица кључни су за одрживе
  прехрамбене системе.
2-3-1-methodology: >-
  Подаци се компилују из националних истраживања гнијежђења птица и достављају
  Еуростату. Индекс агрегира трендове популација репрезентативних врста птица
  типичних за пољопривредна станишта. Резултати се заглађују ради узимања у
  обзир годишње варијабилности у бројању.
2-4-1-title: Површина под органском пољопривредом
2-4-1-definition: >-
  Овај индикатор мјери укупну пољопривредну површину под органском
  пољопривредом, укључујући и потпуно сертификовано органско земљиште и
  земљиште у периоду конверзије. Изражава се као посто укупне искоришћене
  пољопривредне површине. Подаци се заснивају на националним статистикама
  органске пољопривреде које компилује Еуростат.
2-4-1-intention: >-
  Органска пољопривреда промовише биоразноликост, смањује употребу синтетичких
  пестицида и ђубрива те подржава одрживо управљање тлом и водама. Повећање
  удјела органске пољопривредне површине важан је корак ка одрживијим и
  отпорнијим системима прехрамбене производње.
2-4-1-methodology: >-
  Подаци се прикупљају кроз националне анкете о фармама и пољопривредне
  статистике усклађене с ЕУ прописима о органској пољопривреди. Подаци
  укључују површине потпуно сертификоване као органске и површине у периоду
  конверзије, који типично траје двије до три године.
2-5-3-title: Бруто биланс азота на пољопривредном земљишту
2-5-3-definition: >-
  Бруто биланс азота (GNB) на пољопривредном земљишту процјењује вишак азота
  у тлу, израчунат као разлика између уноса азота (минерална ђубрива, стајњак,
  атмосферска депозиција, биолошка фиксација и биљни остатци) и излаза азота
  (усјеви и пожњевена трава). Изражава се у килограмима азота по хектару
  пољопривредног земљишта.
2-5-3-intention: >-
  Вишак азота у пољопривредним тлима доприноси загађењу вода испирањем
  нитрата, емисијама стакленичких гасова и губитку биоразноликости. Смањење
  вишка азота кључно је за одрживе пољопривредне праксе које штите водна
  тијела и животну средину.
2-5-3-methodology: >-
  Подаци се компилују од стране Еуростата из националних пољопривредних
  статистика о коришћењу ђубрива, броју стоке и производњи усјева. Методологија
  GNB-а слиједи OECD/Eurostat приступ израчунавању биланса хранљивих твари.
2-6-0-title: Емисије стакленичких гасова из пољопривреде
2-6-0-definition: >-
  Овај индикатор мјери укупне емисије стакленичких гасова (GHG) из
  пољопривредног сектора, изражене у милионима тона еквивалента CO₂.
  Пољопривредне емисије укључују метан из стоке и управљања стајњаком,
  азотни оксид из тла и угљен-диоксид из потрошње енергије на фармама.
2-6-0-intention: >-
  Пољопривреда значајно доприноси укупним емисијама стакленичких гасова.
  Смањење пољопривредних емисија уз одржавање прехрамбене производње кључни
  је изазов за испуњавање климатских циљева. Напредак значи смањење укупних
  GHG емисија из пољопривреде без угрожавања прехрамбене сигурности.
2-6-0-methodology: >-
  Подаци се достављају од стране националних органа у оквиру UN Оквирне
  конвенције о климатским промјенама (UNFCCC) и компилују од стране Еуростата.
  Емисије се процјењују коришћењем IPCC методологије и покривају све изворе
  пољопривредних емисија укључујући ентеричну ферментацију, управљање
  стајњаком и пољопривредна тла.
3-1-1-title: Године здравог живота при рођењу
3-1-1-definition: >-
  Године здравог живота (HLY) при рођењу показују број година које се очекује
  да ће новорођенче живјети у добром здрављу, без дуготрајне болести или
  инвалидности. HLY се израчунавају комбиновањем добно-специфичних стопа
  смртности с добно-специфичним удјелима особа које пријављују дуготрајно
  ограничавајућу болест. Индикатор се изражава у годинама и раставља по полу.
3-1-1-intention: >-
  Године здравог живота превазилазе очекивани животни вијек мјерењем квалитете
  као и дуљине живота. Повећање HLY значи да људи не само дуље живе већ и
  проводе више година у добром здрављу. Напредак значи трајно повећање година
  здравог живота за мушкарце и жене.
3-1-1-methodology: >-
  HLY се израчунавају Сулливановом методом, комбинујући податке о смртности с
  подацима о самопријављиваној инвалидности из EU-SILC анкете. Глобални
  индикатор ограничења активности (GALI) пита испитанике јесу ли били
  ограничени у активностима због здравствених проблема у трајању од најмање
  шест мјесеци.
3-2-1-title: Стопа смртности дјеце млађе од пет година
3-2-1-definition: >-
  Стопа смртности дјеце млађе од пет година је вјероватноћа да ће дијете
  рођено у одређеној години умријети прије навршених пет година, изражена на
  1.000 живорођених. Одражава кумулативни утицај фактора који утичу на
  преживљавање дјеце, укључујући исхрану, приступ здравственој заштити,
  санитацију и услове живота. Подаци се компилују из националних вitalних
  статистика.
3-2-1-intention: >-
  Смањење дјечије смртности темељно је мjerило људског развоја и ефикасности
  здравствених и социјалних система. Висоcке стопе смртности дjеце млађе од
  пет година одражавају недовољан приступ здравственој заштити и лоше услове
  живота. Напредак значи трајно смањење превентабилних смртних случајева
  дjеце млађе од пет година.
3-2-1-methodology: >-
  Подаци се компилују из националних система регистрације и vitalних статистика.
  Стопа се израчунава из добно-специфичних стопа смртности за дjецу млађу
  од пет година. Еуростат компилује и валидира податке од националних
  статистичких органа према хармонизованим дефиницијама.
3-3-1-title: Преваленција пушења код одраслих
3-3-1-definition: >-
  Овај индикатор мjери удио одраслих особа у доби од 15 и више година које
  тренутно пуше дуванске производе (укључујући цигарете, цигаре и луле)
  свакодневно или повремено. Изражава се као посто укупног одраслог становништва.
  Подаци се прикупљају путем Европског здравственог интервjуног истраживања.
3-3-1-intention: >-
  Употреба дувана водећи је превентабилни узрок смрти на глобалном нивоу,
  узрокујући рак, кардиоваскуларне болести и хроничне респираторне болести.
  Смањење преваленције пушења кључни је приоритет jавног здравства. Напредак
  значи трајни пад удjела одраслих коjи пуше дуван.
3-3-1-methodology: >-
  Подаци се прикупљају путем Европског здравственог интервjуног истраживања
  (EHIS), коjе се проводи отприлике сваких пет година. Статус пушења jе
  самоприjављен. Истраживање користи стандардизован упитник коjи омогућава
  међународне поредбе у свим државама чланицама ЕУ и земљама учесницама.
3-4-1-title: Стандардизована стопа смртности од хроничних болести
3-4-1-definition: >-
  Овај индикатор мjери стандардизовану стопу смртности од незаразних хроничних
  болести, укључуjући кардиоваскуларне болести, рак, диjабетес и хроничне
  респираторне болести. Изражава се као броj смртних случаjева на 100.000
  особа, стандардизован према Европскоj стандардноj популациjи (ESP 2013).
  Подаци се компилуjу од стране Еуростата из националних статистика узрока
  смрти.
3-4-1-intention: >-
  Незаразне болести водећи су узрок превремене смртности у Европи. Смањење
  превремене смртности од хроничних болести захтиjева ефикасну превенциjу,
  рано откривање и приступ квалитетноj здравственоj заштити за све. Напредак
  значи смањење стандардизоване стопе смртности од тих болести током времена.
3-4-1-methodology: >-
  Подаци се заснивају на статистикама узрока смрти из националних матичних
  књига умрлих. Стандардизована стопа смртности елиминише утицај различитих
  добних структура при поређењу популациjа, користећи Европску стандардну
  популациjу (ESP 2013) као референцу. Подаци се годишње достављаjу Еуростату.
3-6-1-title: Стопа смртности у прометним несрећама
3-6-1-definition: >-
  Оваj индикатор мjери броj особа погинулих у прометним несрећама на милион
  становника. Особа се класификуjе као жртва прометне несреће уколико умре у
  року од 30 дана од несреће као посљедица задобивених поврjеда. Подаци се
  компилуjу од стране Еуростата из националних база података о сигурности
  у промету.
3-6-1-intention: >-
  Прометне поврjеде водећи су узрок смрти, посебно међу младима. Смањење броjа
  погинулих захтиjева улагања у инфраструктуру, стандарде сигурности возила,
  управљање брзином и приmjену прометних прописа. Напредак значи значаjно и
  траjно смањење броjа прометних смртних случаjева на милион становника.
3-6-1-methodology: >-
  Подаци се компилуjу из националних база података о прометним несрећама.
  Дефинициjа смртности у року од 30 дана стандардизована jе ради хармонизациjе
  бројања у земљама учесницама. Подаци се годишње достављаjу Еуростату и
  верификуjу у односу на демографске статистике.
3-7-1-title: Стопа фертилитета адолесцената
3-7-1-definition: >-
  Стопа фертилитета адолесцената jе броj живорођених на 1.000 жена у доби
  од 15 до 19 година. Мjери преваленциjу тинejџерских трудноћа и одражава
  приступ образовању и услугама полног и репродуктивног здравља. Подаци се
  компилуjу из националних вitalних статистика од стране Еуростата.
3-7-1-intention: >-
  Високе стопе фертилитета адолесцената повезане су с повећаним здравственим
  ризицима за мajку и диjете те смањеним образовним и економским могућностима
  за младе жене. Смањење стопе фертилитета адолесцената захтиjева приступ
  свеобухватном полном образовању и услугама репродуктивног здравља. Напредак
  значи траjно смањење порођаjа код адолесцентних жена.
3-7-1-methodology: >-
  Подаци се компилуjу из националних регистрациjа рођења и демографских
  статистика. Стопа се израчунава диjељењем живорођених жени у доби 15–19
  година с укупном женском популациjом у тоj доби, помножено с 1.000.
  Подаци се годишње достављаjу Еуростату.
17-5-1-title: Корисници интернета kao удио становништва
17-5-1-definition: >-
  Удио особа коjе су користиле интернет у посљедња три мjесеца, изражен kao посто укупног становништва. Подаци се прикупљају путем годишњег ЕУ ИКТ истраживања.
17-5-1-intention: >-
  Приступ интернету омогућава учешће у дигиталноj економиjи. Напредак значи растући удио становништва коjе користи интернет.
17-5-1-methodology: >-
  Подаци из годишњег ЕУ ИКТ истраживања у домаћинствима. Обjављуjу се годишnje.
17-4-1-title: Отвореност трговине
17-4-1-definition: >-
  Укупан извоз и увоз роба и услуга kao посто БДП-а. Указуjе на степен интеграциjе у глобални трговински систем.
17-4-1-intention: >-
  Отворени трговински системи проموваjу економски раст. Напредак значи одржавање отворености у подршци ОДР циљевима.
17-4-1-methodology: >-
  Подаци из националних рачуна prema ESA 2010. Покрива робу и услуге. Обjављуjу се годишnje.
17-3-1-title: Jавни дуг kao удио БДП-а
17-3-1-definition: >-
  Консолидирани бруто дуг опће управе kao посто БДП-а. Одражава фискалну одрживост. Подаци od Еуростата из EDP обавjести.
17-3-1-intention: >-
  Одрживе jавне финансиjе кључне су за дугорочна разvojna улагања. Напредак значи дуг у складу с фискалном одрживошћу.
17-3-1-methodology: >-
  Подаци od Еуростата prema EDP процедури. Обjављуjу се два пута годишnje.
17-2-1-title: Порезни приходи kao удио БДП-а
17-2-1-definition: >-
  Укупни порезни приходи укључуjући социjалне доприносе kao посто БДП-а. Одражава капацитет влада за мобилизациjу домаћих ресурса.
17-2-1-intention: >-
  Адекватна мобилизациjа домаћих ресурса финансира одрживи развоj. Напредак значи стабилан порезни приход.
17-2-1-methodology: >-
  Подаци из националних рачуна prema ESA 2010. Укључуjе све обвезне намете. Обjављуjу се годишnje.
17-1-1-title: Службена развоjна помоћ kao удио бруто националног доходка
17-1-1-definition: >-
  Нето службена развоjна помоћ (ODA) земаља доnatora kao посто бруто националног доходка. Међународни циљ jе 0,7% БНД-а. Подаци od OECD DAC-а и Еуростата.
17-1-1-intention: >-
  ODA jе кључни извор финансирања развоjа за сиромашниjе земље. Напредак значи повећање омjера ODA/БНД.
17-1-1-methodology: >-
  Подаци od OECD DAC-а. Покрива билатералне и мултилатералне токове. Обjављуjу се годишnje.
16-5-1-title: Перципирана нeovisnost правосудног система
16-5-1-definition: >-
  Удио становништва коjи сматра судове поштеним или врло неovisnim. Одражава повjерење jавности у правосудне институциjе.
16-5-1-intention: >-
  Повjерење у неovisnost правосуђа темељ jе владавине права. Напредак значи растући удио грађана коjи правосуђе перципираjу kao нeovisno.
16-5-1-methodology: >-
  Подаци годишним Еуробарометром. Обjављуjу се у EU Justice Scoreboard.
16-4-1-title: Стопа затворске популациjе
16-4-1-definition: >-
  Броj особа у затвору на 100.000 становника. Одражава праксе казненог правосуђа. Подаци od Еуростата из националних пеналних статистика.
16-4-1-intention: >-
  Праћење затворске популациjе даjе увид у казнено правосуђе. Затварање треба бити пропорционално.
16-4-1-methodology: >-
  Подаци из националних пеналних администрациjа. Укупан броj у затвору на референтни датум. Обjављуjу се годишnje.
16-3-1-title: Становништво коjе приjављуjе криминал или насиље у свом сусjедству
16-3-1-definition: >-
  Удио становништва коjе приjављуjе искуство криминала, насиља или vandalizma у свом сусjедству. Одражава перцепциjу сигурности.
16-3-1-intention: >-
  Осjећаj сигурности димензиjа jе квалитета живота. Напредак значи смањење удjела коjи приjављуjе криминал.
16-3-1-methodology: >-
  Подаци из EU-SILC анкете. Обjављуjу се годишnje.
16-2-1-title: Индекс перцепциjе корупциjе
16-2-1-definition: >-
  Перципирана разина корупциjе у jавном сектору, боdovana od 0 до 100. Теmelji се на стручним процjенама. Саставља га Transparency International.
16-2-1-intention: >-
  Корупциjа поткопава jавне институциjе и одрживи развоj. Напредак значи побoljšanje резултата индекса перцепциjе корупциjе.
16-2-1-methodology: >-
  Саставља се годишnje od стране Transparency International. Нормализирано на скали 0–100.
16-1-1-title: Стопа намjерних убоjстава
16-1-1-definition: >-
  Броj намjерних убоjстава на 100.000 становника. Дефинира се kao незаконита смрт наnesena с намjером. Подаци od Еуростата из националних полициjских статистика.
16-1-1-intention: >-
  Стопа убоjстава поуздан jе показатељ насилног криминала. Напредак значи траjно смањење стопе намjерних убоjстава.
16-1-1-methodology: >-
  Подаци из националних полициjских статистика prema UNODC дефинициjама. Обjављуjу се годишnje.
15-5-1-title: Инвазивне стране врсте
15-5-1-definition: >-
  Броj инвазивних страних врста od интереса за ЕУ утврђених у државама чланицама prema Уредби 1143/2014. Инвазивне врсте водећи су узрок губитка биоразноликости.
15-5-1-intention: >-
  Инвазивне стране врсте угрожаваjу аутохтону биоразноликост. Напредак значи ограничавање ширења инвазивних врста.
15-5-1-methodology: >-
  Подаци od EEA на теmelju националних извjештаjа prema ЕУ уредби о инвазивним врстама.
15-4-1-title: Ерозиjа тла водом
15-4-1-definition: >-
  Стопа губитка тла воdom у тонама по хектару годишnje. Смањуjе пољопривредну продуктивност. Процjенjуjе се RUSLE2015 моделом od стране JRC-а.
15-4-1-intention: >-
  Тло jе необновљиви ресурс. Напредак значи смањење стопе губитка тла ерозиjом.
15-4-1-methodology: >-
  Процjенjуjе се RUSLE2015 моделом. Обjављуjе се od стране JRC-а и Еуростата.
15-3-1-title: Индекс уобичаjених птица
15-3-1-definition: >-
  Индекс коjи прати промjене у популациjама уобичаjених птица у Европи с 1990. kao базном годином (= 100). Птице су осjетљиви показатељи здравља екосистема.
15-3-1-intention: >-
  Пад популациjа птица сигнализира деградациjу станишта. Напредак значи заустављање пада популациjа птица.
15-3-1-methodology: >-
  Подаци из националних истраживања гниjежђења птица путем PECBMS шеме. Обjављуjу се годишnje.
15-2-1-title: Заштићене копнене и слатководне површине
15-2-1-definition: >-
  Удио копнених и слатководних површина означених kao заштићене kao посто укупне површине копна. Укључуjе Natura 2000 и националне заштићене поdrucja.
15-2-1-intention: >-
  Заштићена подручjа темељ су заштите биоразноликости. Напредак значи растући удио копна под учинковитом заштитом.
15-2-1-methodology: >-
  Подаци из националних ознака достављених EEA-и. Покрива копнена и слатководна станишта. Обjављуjу се годишnje.
15-1-1-title: Шумска површина kao удио укупне површине копна
15-1-1-definition: >-
  Površina шума kao посто укупне površine копна. Прати промjене усљед промjене намjене земљишта. Подаци из националних шумарских статистика.
15-1-1-intention: >-
  Шуме су кључне за биоразноликост и секвестрациjу угљика. Напредак значи одржавање или повећање шумом покривеног копна.
15-1-1-methodology: >-
  Подаци из шумарских статистика prema JFSQ уpitniku. Дефинициjа prema FAO. Обjављуjу се периодично.
14-4-1-title: Ерозиjа обале
14-4-1-definition: >-
  Удио обалне линиjе изложене ерозиjи kao посто укупне проциjенjене линиjе. Компилуjе ga EEA сателитским праћењем и EUROSION базом.
14-4-1-intention: >-
  Обална ерозиjа убрзава се. Напредак значи ограничавање удjела обале изложене ерозиjи.
14-4-1-methodology: >-
  Подаци od EEA корistešći Copernicus праћење. Обjављуjу се периодично.
14-3-1-title: Концентрациjа кlorофила-а у обалним водама
14-3-1-definition: >-
  Концентрациjа кlorофила-а у обалним и приjелазним водama kao proxy за еутрофикациjу. Виши нивои указуjу на загађење нутриjентима.
14-3-1-intention: >-
  Еутрофикациjа деградира морске екосистеме. Напредак значи стабилне или opadajuće концентрациjе кlorофила-а.
14-3-1-methodology: >-
  Подаци из морских програма праћења и сателитског истраживања. Компилуjе EEA.
14-2-1-title: Рибни фондови унутар одрживих разина
14-2-1-definition: >-
  Удио проциjенjених кomercijалних рибних фондова у ЕУ водама коjи се лове на или испод MSY, изражен kao посто. Подаци od ICES-а.
14-2-1-intention: >-
  Прeкомjерни риболов исцрпљуjе фондове. Напредак значи растући удио фондова у одрживим граnicama.
14-2-1-methodology: >-
  Теmelji се на ICES процjенама фондова. Одрживост prema MSY концепту. Обjављуjе се годишnje.
14-1-1-title: Морска заштићена подручjа
14-1-1-definition: >-
  Удио мора у националноj jурисдикциjи означених kao МPA, изражен kao посто. Подаци od EEA из националних ознака.
14-1-1-intention: >-
  МPA штите морску биоразноликост. Напредак значи растући удио мора под морском заштитом.
14-1-1-methodology: >-
  Подаци из националних ознака prema Natura 2000 и међународним конвенциjама. Обjављуjу се годишnje.
13-4-1-title: Интензитет емисиjа стакленичких гасова енергетске потрошnje
13-4-1-definition: >-
  Емисиjе стакленичких гасова из енергетске потрошnje поdijelene с бруто потрошnom енергиjе, у грамима CO₂ eq/kgoe. Одражава угљични садржаj енергетског миксa.
13-4-1-intention: >-
  Декарбонизациjа енергетског система кључна jе за климатско дjелавање. Напредак значи смањење интензитета емисиjа стакленичких гасова.
13-4-1-methodology: >-
  Компилуjе Еуростат из енергетских биланци и инventara стакленичких гасова. Обjављуjе се годишnje.
13-3-1-title: Економски губици везани уз климу
13-3-1-definition: >-
  Економски губици od екстремних климатских догађаjа kao посто БДП-а. Укључуjе поплаве, олуjе и суше.
13-3-1-intention: >-
  Климатске промjене повећаваjу екстремне догађаjе и економске губитке. Напредак значи ограничавање губитака od климатских догађаjа.
13-3-1-methodology: >-
  Подаци из CATDAT базе и реосигуравajućих извора. Обjављуjе се периодично.
13-2-1-title: Емисиjе стакленичких гасова - енергетски сектор
13-2-1-definition: >-
  Укупне емисиjе стакленичких гасова из енергетског сектора у Mt CO₂ eq. Покрива сагориjевање у електранама и енергетским индустриjама.
13-2-1-intention: >-
  Енергетски сектор наjвећи jе извор GHG емисиjа. Напредак значи траjно смањење емисиjа енергетског сектора.
13-2-1-methodology: >-
  Подаци od националних власти prema UNFCCC koristešći IPCC методологиjу. Обjављуjе се годишnje.
13-1-1-title: Индекс емисиjа стакленичких гасова
13-1-1-definition: >-
  Укупне националне емисиjе стакленичких гасова индексиране на базну годину. Прати укупни напредак у смањењу емисиjа.
13-1-1-intention: >-
  Смањење укупних емисиjа централни jе циљ климатске политике. Напредак значи траjни opadajući тренд индекса.
13-1-1-methodology: >-
  Подаци od националних власти prema UNFCCC. Покрива све секторе. Обjављуjе се годишnje.
12-5-1-title: Стопа кружног кориштења материjала
12-5-1-definition: >-
  Удио материjала опорављених и враћених у економиjу у ukupnoj upotrebi материjала. Указуjе на напредак prema kružnoj економиjи.
12-5-1-intention: >-
  Повећање кружног кориштења смањуjе екстракциjу ресурса. Напредак значи растући посто кружног кориштења материjала.
12-5-1-methodology: >-
  Израчунава се kao рециклиран otpad kao input поdijeljen ukupnom upotrebom. Компилуjе Еуростат годишnje.
12-4-1-title: Интензитет емисиjа стакленичких гасова производnje
12-4-1-definition: >-
  Укупне емисиjе стакленичких гасова по jединици БДП-а у kg CO₂ eq. Прати одваjање раста od емисиjа.
12-4-1-intention: >-
  Смањење интензитета емисиjа кључно jе за одрживу производnjу. Напредак значи пад емисиjа по jединици БДП-а.
12-4-1-methodology: >-
  Компилуjе Еуростат из инventara GHG и националних рачуна. Обjављуjе се годишnje.
12-3-1-title: Стопа рециклирања комуналног отпада
12-3-1-definition: >-
  Удио комуналног отпада коjи се рециклира kao посто укупно генерираног отпада. Покрива материjално рециклирање и компостирање.
12-3-1-intention: >-
  Повећање рециклирања смањуjе odlaganje. Напредак значи растући удио комуналног отпада коjи се рециклира.
12-3-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Укључуjе рециклирање и компостирање. Обjављуjе се годишnje.
12-2-1-title: Комунални отпад генериран по становнику
12-2-1-definition: >-
  Укупни комунални отпад генериран по становнику годишnje у килограмима. Укључуjе кућански отпад и сличне изворе.
12-2-1-intention: >-
  Смањење генерирања отпада први jе корак у хиjерархиjи отпада. Напредак значи opadajući тренд отпада по становнику.
12-2-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Обjављуjе се годишnje.
12-1-1-title: Продуктивност ресурса
12-1-1-definition: >-
  БДП поdijeljen с домаћом потрошnom материjала (DMC) у еурима по килограму. Виша вриjednost значи веfiri економски output по jединици материjала.
12-1-1-intention: >-
  Побoljšanje продуктивности ресурса одваjа раст od потрошne материjала. Напредак значи траjно повећање продуктивности ресурса.
12-1-1-methodology: >-
  Израчунава се коришhenjем БДП-а и DMC из рачуна материjалних токова. Компилуjе Еуростат годишnje.
11-5-1-title: Удио жељезничког промета у путничком приjевозу
11-5-1-definition: >-
  Удио жељезнице у копненом путничком приjевозу, изражен kao посто путничких километара. Одражава кориштење одрживиjих начина приjевоза.
11-5-1-intention: >-
  Жељезница jе енергетски учинковитиjа od automobila. Напредак значи растући удио жељезнице у путничком приjевозу.
11-5-1-methodology: >-
  Подаци od Еуростата из националних транспортних статистика. Мjери се у путничким километрима. Обjављуjе се годишnje.
11-4-1-title: Изложеност становништва загађењу зрака PM2,5
11-4-1-definition: >-
  Популациjски пондерирана годишnja изложеност PM2,5 у µg/m³. PM2,5 узрокуjе respiratorne и кардиоваскуларне болести.
11-4-1-intention: >-
  Загађење зрака водећи jе околишни узрок смртности у Европи. Напредак значи смањење изложености PM2,5.
11-4-1-methodology: >-
  Компилуjе EEA из мрежа за праћење квалитете зрака. Популациjски пондерирано. Обjављуjе се годишnje.
11-3-1-title: Стопа рециклирања комуналног отпада (урбано)
11-3-1-definition: >-
  Стопа рециклирања комуналног отпада у урбаним подручjима kao посто укупно генерираног отпада. Одражава напредак у урбаном управљањy отпадом.
11-3-1-intention: >-
  Одрживи градови требаjу учинковите системе управљања отпадом. Напредак значи растући удио урбаног отпада коjи се рециклира.
11-3-1-methodology: >-
  Компилуjе Еуростат из националних статистика отпада. Укључуjе рециклирање и компостирање. Обjављуjе се годишnje.
11-2-1-title: Стопа пренасeљeности стамбеног простора
11-2-1-definition: >-
  Удио становништва у пренасeљeним становима (premalo soba у односу на величину домаћинства) kao посто. Одражава неadekvatne стамбене увjете.
11-2-1-intention: >-
  Пренасeљeност утjeche на здравље и квалитет живота. Напредак значи смањење удjела коjи живе у пренасeљeним становима.
11-2-1-methodology: >-
  Подаци из EU-SILC коristešći стандардизирани омjер собa и особа. Обjављуjу се годишnje.
11-1-1-title: Становништво коjе живи у градовима
11-1-1-definition: >-
  Удио укупног становништва коjе живи у градовима, изражен kao посто. Прати тренд урбанизациjе. Подаци od Еуростата koristešći DEGURBA класификациjу.
11-1-1-intention: >-
  Градови су мотори раста, али имаjу изазове загушења и неjеднакости. Напредак захтиjева урбанизациjу с адекватном инфраструктуром.
11-1-1-methodology: >-
  Компилуjе се DEGURBA методологиjом. Градови дефинирани ≥50.000 становника и густoćom ≥1.500/km². Обjављуjе се периодично.
10-5-1-title: Gini коефициjент еквивалентног расположивог доходка
10-5-1-definition: >-
  Gini коефициjент мjери неjеднакост у расподjели еквивалентног расположивог доходка. Kreće se od 0 (савршена jеднакост) до 100 (максимална неjеднакост). Подаци из EU-SILC.
10-5-1-intention: >-
  Доходовна неjеднакост ограничава могућности и социjалну мобилност. Напредак значи opadajući Gini коефициjент.
10-5-1-methodology: >-
  Подаци из EU-SILC. Израчунава се из расподjеле еквивалентног расположивог доходка. Обjављуjе се годишnje.
10-4-1-title: Подносиоци захтjева за азил на милиjун становника
10-4-1-definition: >-
  Броj особа коjе подносе захтjев за азил на милиjун становника. Одражава миграциjске притиске. Подаци od Еуростата из азилних власти.
10-4-1-intention: >-
  Осигурање заштите димензиjа jе смањења неjеднакости. Праћење азила помаже процjени миграциjске динамике.
10-4-1-methodology: >-
  Подаци из азилних власти prema ЕУ азилним прописима. Обjављуjу се мjесечно и годишnje.
10-3-1-title: Удио доходка наjсиромашниjих 40% становништва
10-3-1-definition: >-
  Удио укупног еквивалентног расположивог доходка коjи прима наjсиромашниjих 40% расподjеле, изражен kao посто.
10-3-1-intention: >-
  Праћење удjела доходка наjсиромашниjих 40% директно мjери инклузивни раст. Напредак значи растући удио.
10-3-1-methodology: >-
  Подаци из EU-SILC. Кумулативни удио наjсиромашниjих 40% израчунава се из расподjеле. Обjављуjе се годишnje.
10-2-1-title: Релативни медиjални jаз ризика od сиромаштва
10-2-1-definition: >-
  Разлика između медиjанског доходка особа испод прага сиромаштва и прага, изражена kao посто прага. Мjери dubinu сиромаштва.
10-2-1-intention: >-
  Jаз сиромаштва показуjе колико су сиромашни далеко испод прага. Напредак значи смањење jаза.
10-2-1-methodology: >-
  Праг сиромаштва 60% медиjанског доходка. Jаз kao посто прага. Обjављуjе се годишnje.
10-1-1-title: Омjер доходка квинтила (S80/S20)
10-1-1-definition: >-
  Омjер укупног еквивалентног доходка наjбогатиjих 20% и наjсиромашниjих 20%. Мjери доходовну неjеднакост.
10-1-1-intention: >-
  Доходовна неjеднакост ограничава социjалну мобилност. Напредак значи opadajući омjер S80/S20.
10-1-1-methodology: >-
  Подаци из EU-SILC. Диjели укупни доходак горњег квинтила с доnjим. Обjављуjе се годишnje.
9-6-1-title: Удио жељезнице и унутарњих пловних путева у теретном промету
9-6-1-definition: >-
  Овај индикатор мjери удио жељезнице и унутарњих пловних путева у укупном копненом теретном промету, изражен као посто укупних тона-километара. Подаци се компилуjу od стране Еуростата из националних статистика промета.
9-6-1-intention: >-
  Преласком теретног промета с цеста на жељезнице и пловне путеве смањуjу се емисиjе, загушење и несреће. Напредак значи повећање удjела ових одрживих начина приjевоза у укупном теретном промету.
9-6-1-methodology: >-
  Подаци се компилуjу из националних статистика промета. Теретни промет мjери се у тона-километрима. Подаци се годишне обjављуjу od стране Еуростата.
9-5-1-title: Домаћинства с приступом широкопоjасном интернету
9-5-1-definition: >-
  Овај индикатор мjери удио домаћинстава с приступом широкопоjасном интернету, изражен kao посто свих домаћинстава. Широкопоjасни приступ укључуjе фиксне и мобилне широкопоjасне вeze. Подаци се прикупљају путем ЕУ истраживања о кориштењу ИКТ-а.
9-5-1-intention: >-
  Широкопоjасни приступ интернету sve jе нeophodниjе за учешће у дигиталноj економиjи и социjалну укљученост. Напредак значи повећање удjела домаћинстава прикљученних на широкопоjасни интернет.
9-5-1-methodology: >-
  Подаци се прикупљају путем годишњег ЕУ истраживања о кориштењу ИКТ-а у домаћинствима. Подаци се годишне обjављуjу od стране Еуростата.
9-4-1-title: Удио високотехнолошког извоза у укупном извозу
9-4-1-definition: >-
  Овај индикатор мjери удио високотехнолошких производа у укупном извозу прерађених добара, изражен kao посто. Подаци се компилуjу из статистика vanjske трговине (COMEXT база података).
9-4-1-intention: >-
  Висок удио високотехнолошког извоза одражава технолошку конкурентност и иновативни капацитет. Напредак значи повећање удjела високотехнолошких производа у укупном извозу.
9-4-1-methodology: >-
  Подаци се компилуjу из COMEXT базе података користећи OECD дефинициjу високотехнолошких сектора. Подаци се годишне обjављуjу od стране Еуростата.
9-3-1-title: Приjаве патената Европском уреду за патенте
9-3-1-definition: >-
  Овај индикатор мjери броj приjава патената поднесених EPO-у на милиjун становника. Патенти штите изуме и кључни су индикатор иновациjских outputa. Подаци се компилуjу из EPO евиденциjа.
9-3-1-intention: >-
  Приjаве патената наjшире се користе kao proxy за иновациjски output. Напредак значи траjно повећање приjава патената на милиjун становника.
9-3-1-methodology: >-
  Подаци се компилуjу на основу мjеста становања изумитeља из EPO евиденциjа. Подаци се годишне обjављуjу od стране Еуростата.
9-2-1-title: Истраживачи у еквиваленту пуног радног времена на милиjун становника
9-2-1-definition: >-
  Овај индикатор мjери броj истраживача у FTE еквиваленту на милиjун становника. Истраживачи су стручњаци коjи стварају ново знање, производе, процесе и системе. Подаци се компилуjу из националних И&Р статистика.
9-2-1-intention: >-
  Истраживачи су кључни input у иновациjски процес. Напредак значи повећање броjа истраживача на милиjун становника у свим секторима економиjе.
9-2-1-methodology: >-
  Подаци се прикупљају путем националних И&Р анкета prema OECD Frascati приручнику. Истраживачи се броjе у FTE еквивалентима. Подаци покриваjу пословни, владини и висоокошколски сектор.
9-1-1-title: Расходи за истраживање и развоj kao удио БДП-а
9-1-1-definition: >-
  Овај индикатор мjери бруто домаће расходе за истраживање и развоj (GERD) kao посто БДП-а. Покрива сав креативни и суставни рад за повећање знања и развоj нових примjена. Подаци се компилуjу из националних И&Р анкета.
9-1-1-intention: >-
  Улагање у И&Р кључни jе покретач иновациjа, конкурентности и дугорочног раста продуктивности. Напредак значи траjно повећање расхода за И&Р kao удjела БДП-а.
9-1-1-methodology: >-
  Подаци се прикупљају путем националних И&Р анкета prema OECD Frascati приручнику. GERD покрива сав И&Р провeден на националном териториjу. Подаци се годишне обjављуjу od стране Еуростата.
8-6-1-title: Смртне несреће на раду
8-6-1-definition: >-
  Овај индикатор мjери броj смртних несрећа на раду на 100.000 запослених
  особа. Смртна несрећа на раду дефинира се kao несрећа коjа доводи до
  смрти жртве у року od jедне године od несреће. Подаци се прикупљају путем
  Европске статистике о несрећама на раду (ESAW).
8-6-1-intention: >-
  Осигурање сигурних и здравих услова рада темељна jе димензиjа достоjанственог
  рада. Смртне несреће на раду представљаjу превентабилни губитак живота с
  тешким посљедицама за раднике, породице и друштво. Напредак значи траjно
  смањење стопе смртних несрећа на раду.
8-6-1-methodology: >-
  Подаци се компилуjу od стране Еуростата путем методологиjе ESAW. Индикатор
  покрива све несреће на раду коjе резултираjу смрћу жртве у року od jедне
  године. Подаци се обjављуjу годишње.
8-5-1-title: Млади коjи нису запослени, не образуjу се нити обучаваjу (NEET)
8-5-1-definition: >-
  NEET стопа мjери удио младих у доби od 15 до 29 година коjи нису запослени,
  не образуjу се нити обучаваjу, изражен kao посто укупног становништва у
  тоj добноj скупини. Идентификуjе младе изложене ризику искључивања с
  тржишта рада и социjалне маргинализациjе. Подаци се заснивају на EU-LFS.
8-5-1-intention: >-
  Млади у NEET категориjи суочаваjу се с дугорочним ризицима по запошљавање,
  зараде и социjалну интеграциjу. Смањење NEET стопе захтиjева улагања у
  образовање, струковну обуку и активне политике тржишта рада. Напредак значи
  траjно смањење удjела младих van запослења, образовања и обуке.
8-5-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. NEET статус комбинира информациjе
  о статусу запослености и учешћу у образовању или обуци у четири нeдjеље
  приjе анкете. Подаци се годишње обjављуjу od стране Еуростата.
8-4-1-title: Стопа дуготраjне незапослености
8-4-1-definition: >-
  Стопа дуготраjне незапослености jе удио особа незапослених 12 или više
  мjесеци, изражен kao посто активне радне снаге. Дуготраjна незапосленост
  указуjе на структурни проблем тржишта рада повезан с ерозиjом вjештина и
  социjалном искљученошћу. Подаци се заснивају на EU-LFS анкети.
8-4-1-intention: >-
  Дуготраjна незапосленост наруšава вjештине, смањуjе запошљивост и повећава
  ризик od сиромаштва и социjалне искључeности. Решавање захтиjева активне
  политике тржишта рада и програме прeквалификациjе. Напредак значи траjно
  смањење стопе дуготраjне незапослености.
8-4-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. Незапосленост се дефинира prema
  ILO стандардима: особе без посла, доступне за рад и активно траже запослење.
  Дуготраjно незапослени су они незапослени 12 или više мjесеци.
8-3-1-title: Стопа запослености
8-3-1-definition: >-
  Стопа запослености jе удио особа у доби od 20 до 64 године коjе су запослене,
  изражен kao посто укупног становништва у тоj добноj скупини. Jедан jе od
  наjшире коришћених индикатора перформанси тржишта рада. Подаци се заснивају
  на Анкети о радноj снази ЕУ (EU-LFS).
8-3-1-intention: >-
  Висоcка стопа запослености кључна jе за економски просперитет, социjалну
  укљученост и одрживост система социjалне заштите. Повећање запослености
  захтиjева политике коjе подржаваjу креирање радних мjеста и развоj вjештина.
  Напредак значи траjно повећање стопе запослености.
8-3-1-methodology: >-
  Подаци се прикупљају путем EU-LFS анкете. Запосленост се дефинира prema ILO
  стандардима: особе коjе су радиле бар jедан сат уз накнаду током референтне
  нeдjеље. Подаци се обjављуjу годишnje и тромjесечно od стране Еуростата.
8-2-1-title: Бруто инвестициjе у фиксни капитал kao удио БДП-а
8-2-1-definition: >-
  Овај индикатор мjери бруто инвестициjе у фиксни капитал (улагања у физичку
  имовину) kao посто БДП-а. Одражава разину инвестициjа у економиjи и
  капацитет за будући раст. Подаци се компилуjу od стране Еуростата из
  националних рачуна.
8-2-1-intention: >-
  Улагања у физички капитал кључни су покретач раста продуктивности и
  дугорочног економског развоjа. Адекватне инвестициjе подржаваjу иновациjе,
  креирање радних мjеста и побољшања инфраструктуре. Напредак значи
  одржавање или повећање инвестициjског удjела БДП-а.
8-2-1-methodology: >-
  Подаци се компилуjу из националних рачуна prema Европском систему рачуна
  (ESA 2010). Бруто инвестициjе покриваjу набавке фиксне имовине умањене за
  отуђења резидентних произвођача. Подаци се годишње обjављуjу.
8-1-1-title: Реални БДП по становнику
8-1-1-definition: >-
  Реални БДП по становнику jе бруто домаћи производ по тржишним циjенама
  подиjељен с броjем становника средином године, изражен у lančanim obujmima.
  Наjшире jе коришћени индикатор економског outputa и животног стандарда.
  Стопе раста одражаваjу економске перформансе korigirane за инфлациjу.
8-1-1-intention: >-
  Траjни, инклузивни и одрживи економски раст кључан jе за смањење сиромаштва
  и побољшање животног стандарда. Раст реалног БДП-а по становнику одражава
  побољшања продуктивности и економске добробити. Напредак значи позитивна
  и траjна стопа раста реалног БДП-а по становнику.
8-1-1-methodology: >-
  Подаци се компилуjу из националних рачуна prema ESA 2010. Реални БДП користи
  lančane volumenske мjере за уклањање утjецаjа промjена циjена. Подаци по
  становнику користе процjене становништва средином године.
7-6-1-title: Становништво које не може адекватно гриjати дом
7-6-1-definition: >-
  Овај индикатор мjери удио становништва које ниjе у могућности адекватно
  гриjати своj дом, kao удио укупног становништва. Jедан jе od кључних
  индикатора енергетског сиромаштва у Европи. Подаци се прикупљају путем
  EU анкете о приходима и условима живота (EU-SILC).
7-6-1-intention: >-
  Енергетско сиромаштво утjеche на здравље, добробит и квалитет живота,
  посебно за домаћинства с нижим приходима. Осигурање да све особе могу
  приуштити гриjање дома темељна jе димензиjа приступачне и чисте енергиjе.
  Напредак значи траjно смањење удjела становништва коjе се суочава с
  енергетским сиромаштвом.
7-6-1-methodology: >-
  Подаци се прикупљају путем EU-SILC анкете, коjа пита испитанике могу ли
  приуштити адекватно гриjање дома. Индикатор се изражава kao посто укупног
  становништва. Подаци се прикупљају годишње и обjављуjу od стране Еуростата.
7-5-1-title: Зависност od увоза енергиjе
7-5-1-definition: >-
  Стопа зависности od увоза енергиjе показуjе у коjоj мjери се економиjа
  ослања на увоз енергиjе kako би задовољила своjе енергетске потребе.
  Израчунава се kao нето увоз енергиjе подиjeljен с брuto потрошњом енергиjе
  у земљи, изражен kao посто. Виша стопа значи већу зависност od увозне
  енергиjе.
7-5-1-intention: >-
  Висоcка зависност od увоза енергиjе излаже економиjе ризику прекида
  опскрбе и волатилности циjена. Смањење зависности кроз енергетску
  учинковитост и развоj обновљивих извора подржава енергетску сигурност.
  Напредак значи смањење стопе зависности od увоза енергиjе.
7-5-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских
  статистика достављених prema EU прописима. Бруто потрошња енергиjе у
  земљи покрива сву енергиjу потребну за задовоljenje домаће потражnje.
  Нето увоз израчунава се kao увоз минус извоз и промjене залиха.
7-4-1-title: Краjња потрошња енергиjе
7-4-1-definition: >-
  Краjња потрошња енергиjе мjери укупну енергиjу коjу troše краjњи корисници
  (индустриjа, транспорт, домаћинства, услуге и пољопривреда), искључуjући
  енергиjу коjу користи сам енергетски сектор. Изражава се у милиjунима тона
  еквивалента нафте (Mtoe). Подаци се компилуjу od стране Еуростата из
  националних енергетских биланци.
7-4-1-intention: >-
  Смањење краjње потрошње енергиjе кључно jе за испуњавање климатских циљева
  и побoljšanje енергетске сигурности. Побољшања енергетске учинковитости
  омогућавају економски раст одвоjен od потрошње енергиjе. Напредак значи
  траjно смањење краjње потрошње енергиjе уз одржавање економске активности.
7-4-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских биланци
  извjештених prema EU прописима. Краjња потрошња енергиjе искључуjе
  неенергетску употребу и енергиjу потрошену od стране сектора трансформациjе
  енергиjе. Подаци се годишње извjештавају у тонама еквивалента нафте.
7-3-1-title: Примарна потрошња енергиjе
7-3-1-definition: >-
  Примарна потрошња енергиjе мjери укупну енергетску потражњу земље,
  покриваjући потрошњу свих облика енергиjе приjе bilo каквог процеса
  трансформациjе. Изражава се у милиjунима тона еквивалента нафте (Mtoe).
  Укључуjе енергиjу коjу користи енергетски сектор, губитке у дистрибуциjи
  и краjњу потрошњу свих сектора.
7-3-1-intention: >-
  Смањење примарне потрошње енергиjе уз одржавање економског раста кључно
  jе за побoljšanje енергетске учинковитости и испуњавање климатских циљева.
  Одваjање економског раста od потрошње енергиjе централни jе аспект
  одрживог развоjа. Напредак значи опадаjући тренд примарне потрошње енергиjе.
7-3-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских биланци
  достављених prema EU прописима о енергетским статистикама. Примарна потрошња
  енергиjе израчунава се методом супституциjе за нуклеарну и обновљиву
  електричну енергиjу. Подаци се обjављуjу годишње.
7-2-1-title: Удио обновљивих извора енергиjе у бруто краjњоj потрошњи енергиjе
7-2-1-definition: >-
  Овај индикатор мjери удио енергиjе из обновљивих извора (виjетар, Сунце,
  хидроенергиjа, геотермална, океанска, биомаса и биогорива) у бруто краjњоj
  потрошњи енергиjе, изражен kao посто. Покрива обновљиву енергиjу коришћену
  у електрици, гриjању и хлађењу те транспорту. Подаци се компилуjу od
  стране Еуростата из националних енергетских статистика.
7-2-1-intention: >-
  Повећање удjела обновљивих извора енергиjе кључно jе за смањење емисиjа
  стакленичких гасова из енергетског сектора и постизање климатских циљева.
  Обновљиви извори доприносе и енергетскоj сигурности и дугорочном смањењу
  трошкова. Напредак значи траjно повећање удjела обновљиве енергиjе у
  укупноj потрошњи.
7-2-1-methodology: >-
  Подаци се компилуjу od стране Еуростата из националних енергетских статистика
  извjештених prema Директиви о обновљивим изворима енергиjе. Бруто краjња
  потрошња енергиjе укључуjе енергиjу испоручену краjњим корисницима plus
  губитке у мрежи електричне енергиjе и дистрибутивним мрежама.
7-1-1-title: Енергетска продуктивност
7-1-1-definition: >-
  Енергетска продуктивност мjери колико економског outputa се генерира по
  jединици потрошене енергиjе. Израчунава се kao БДП подиjељен с бруто
  потрошњом енергиjе у земљи и изражава у еурима по килограму еквивалента
  нафте (EUR/kgoe). Виша вриjедност указуjе на учинковитиjе кориштење
  енергиjе за генерирање економског outputa.
7-1-1-intention: >-
  Побoljšanje енергетске продуктивности централно jе за одваjање економског
  раста od потрошње енергиjе и смањење притисака на околиш. Продуктивниjе
  кориштење енергиjе снижава трошкове за предузећа и домаћинства и смањуjе
  емисиjе. Напредак значи траjно повећање енергетске продуктивности током
  времена.
7-1-1-methodology: >-
  Енергетска продуктивност израчунава се od стране Еуростата користећи БДП
  податке (lančani obujmi, референтна година 2010) и бруто потрошњу енергиjе
  из националних енергетских биланци. Оба индикатора компилуjу се prema EU
  прописима о енергетским статистикама. Подаци се обjављуjу годишње.
6-5-1-title: Водна тиjела с добрим еколошким статусом
6-5-1-definition: >-
  Овај индикатор мjери удио површинских водних тиjела (риjеке, jезера,
  приjелазне и приобалне воде) која постижу добар или висок еколошки статус
  или потенциjал, как је дефинисано Оквирном директивом о водама ЕУ. Изражава
  се као посто свих процијењених водних тиjела. Подаци се извjештавају од
  стране država чланица сваких шест година.
6-5-1-intention: >-
  Еколошки статус водних тиjела одражава свеукупно здравље водених екосистема
  и притиске коjима су изложени od људских активности. Постизање доброг
  еколошког статуса централни jе циљ Оквирне директиве о водама. Напредак
  значи повећање удjела површинских водних тиjела која постижу добар или висок
  еколошки статус.
6-5-1-methodology: >-
  Подаци се извjештавају od strane država ЕУ Европскоj агенциjи за околиш
  (EEA) у оквиру Оквирне директиве о водама (2000/60/EC). Еколошки статус
  процjењуjе се на основу биолошких, хидроморфолошких и физикално-хемијских
  елемената квалитете. Циклуси извjештавања траjу шест година.
6-4-1-title: Концентрациjа нитрата у подземним водама
6-4-1-definition: >-
  Овај индикатор мjери удио постаjа за праћење подземних вода гдjе просjечна
  концентрациjа нитрата прелази 50 миligrama по литри (ЕУ праг према Директиви
  о нитратима). Изражава се као посто свих праћених постаjа. Подаци се
  извjештавају od strane država чланица у оквиру Директиве о нитратима.
6-4-1-intention: >-
  Загађење подземних вода нитратима, примарно из пољопривредних извора,
  представља ризик за квалитет питке воде и водене екосистеме. Смањење
  концентрациjа нитрата захтиjева побoljšano управљање нутриjентима у
  пољопривреди. Напредак значи смањење удjела постаjа коjе прелазе праг od
  50 mg/l.
6-4-1-methodology: >-
  Подаци се прикупљају od strane država чланица према Директиви Виjећа
  91/676/EEZ о заштити вода od загађења uzrokovanog нитратима из пољопривредних
  извора и извjештавају Европскоj комисиjи сваке четири године. Еуростат
  компилуjе и обjављуjе податке.
6-3-1-title: Биохемиjска потрошња кисика у риjекама
6-3-1-definition: >-
  Овај индикатор мjери биохемиjску потрошњу кисика (BPK) у риjекама, коjа
  одражава количину кисика утрошену биолошким процесима при разградњи органске
  материjе у води. Ниже вриjедности BPK-а указуjу на бољи квалитет воде.
  Изражава се у миligramima кисика по литри и заснива се на подacima с постаjа
  за праћење риjека.
6-3-1-intention: >-
  Висоcке разине органског загађења у риjекама смањуjу отопљени кисик, штете
  водним живим бићима и могу учинити воду неупотребљивом за људе. Смањење
  BPK-а у риjекама кључно jе за побoljšanje квалитета воде и заштиту
  слатководних екосистема. Напредак значи смањење просjечних разина BPK-а
  на праћеним постаjама.
6-3-1-methodology: >-
  Подаци се прикупљају из националних мрежа за праћење риjека и компилуjу
  od strane Еуростата у сарадњи с Европском агенциjом за околиш (EEA). BPK
  се мjери на стандардизованим постаjама и представља кисик утрошен током пет
  дана на 20°C (BPK5). Подаци се извjештавају годишње.
6-2-1-title: Становништво прикључено на пречишћавање отпадних вода
6-2-1-definition: >-
  Овај индикатор мjери удио становништва чиjе се отпадне воде прикупљаjу и
  обрађуjу у построjењима за пречишћавање комуналних отпадних вода, изражен
  kao посто. Покрива наjмање секундарни (биолошки) третман. Подаци се
  извjештавају od strane država чланица у оквиру Директиве о комуналним
  отпадним водама и компилуjу od strane Еуростата.
6-2-1-intention: >-
  Приступ адекватном пречишћавању отпадних вода теmeljan jе за заштиту
  квалитета воде и jавног здравља. Непречишћене отпадне воде загађуjу риjеке,
  jезера и приобалне воде. Напредак значи повећање удjела становништва
  прикљученог на наjмање секундарно пречишћавање отпадних вода.
6-2-1-methodology: >-
  Подаци се извjештавају od strane država чланица сваке двиjе године prema
  Директиви Виjећа 91/271/EEZ о пречишћавању комуналних отпадних вода.
  Индикатор покрива агломерациjе коjе генеришу više od 2.000 еквивалената
  становника. Еуростат компилуjе и обjављуjе податке kao посто укупног
  становништва.
6-1-1-title: Индекс експлоатациjе воде
6-1-1-definition: >-
  Индекс експлоатациjе воде (WEI+) мjери захватање слатке воде kao удио
  доступних обновљивих слатководних ресурса (дугорочни просjечни годишњи
  обновљиви слатководни ресурси умањени за захтjеве еколошког протока).
  Изражава се kao посто. Вриjедности iznad 20% указуjу на водни стрес;
  iznad 40% на озбиљан водни стрес.
6-1-1-intention: >-
  Несташица воде sve jе већа приjетња екосистемима, економиjама и људскоj
  добробити. Праћење захватања слатке воде у односу на доступне ресурсе
  кључно jе за одрживо управљање водама. Напредак значи одржавање индекса
  испод прагова стреса кроз ефикасно кориштење воде.
6-1-1-methodology: >-
  Подаци се компилуjу od strane Еуростата из националних статистика о водама
  коjе извjештавају државе чланице. Захватање слатке воде обухвата воду
  захваћену из риjека, jезера, акумулациjа и подземних вода за све намjене.
  Доступни ресурси процjењуjу се из дугорочних хидролошких података
  кorigiranih за захтjеве еколошког протока.
5-6-1-title: Родна разлика у кориштењу интернета
5-6-1-definition: >-
  Овај индикатор мjери разлику između удjела мушкараца и жена у доби од 16 до
  74 године који су користили интернет у посљедња три мjесеца, изражену у
  процентним поенима. Позитивна вриjедност указуjе на веће кориштење интернета
  од стране мушкараца. Подаци се прикупљају путем ЕУ истраживања о кориштењу
  ИКТ-а у домаћинствима и од стране поjединаца.
5-6-1-intention: >-
  Дигитални родни jаз одражава шире неједнакости у приступу технологиjи,
  информациjама и економским приликама. Затварање jаза захтиjева циљане
  политике за побољшање дигиталног приступа, вjештина и самопоуздања жена.
  Напредак значи смањење разлике između стопа кориштења интернета мушкараца
  и жена.
5-6-1-methodology: >-
  Подаци се прикупљају путем ЕУ истраживања о кориштењу ИКТ-а у домаћинствима
  и од стране поjединаца, које се проводи годишње. Кориштење интернета односи
  се на bilo kakву употребу интернета у три мjесеца приjе анкете. Родни jаз
  израчунава се као разлика između стопа кориштења интернета мушкараца и жена,
  изражена у процентним поенима.
5-5-1-title: Мjеста која заузимају жене у националним парламентима
5-5-1-definition: >-
  Овај индикатор мjери удио мjеста која заузимају жене у националним
  парламентима (jednodomnim или доњим домовима), изражен као посто свих
  попуњених мjеста. Подаци се добиjају од Мeђупарламентарне униjе (IPU)
  и компилуjу од стране Еуростата.
5-5-1-intention: >-
  Равноправно учешће жена и мушкараца у политичком одлучивању темељни је
  аспект равноправности полова и демократског управљања. Повећање заступљености
  жена у парламенту осигурава да се перспективе и интереси жена одражавају у
  законодавству и политикама. Напредак значи повећање удjела мjеста у парламенту
  која заузимају жене.
5-5-1-methodology: >-
  Подаци се добиjају од Мeђупарламентарне униjе (IPU) и односе се на стање на
  1. jануара сваке године. Индикатор покрива jednodomne парламенте и доње домове
  двodomних парламената. Подаци се односе на посто жена међу свим члановима
  парламента с важећим мандатом.
5-4-1-title: Жене у управним одборима великих листираних компанија
5-4-1-definition: >-
  Овај индикатор мjери удио жена међу члановима управних одбора највећих јавно
  листираних компанија, изражен као посто свих чланова одбора. Обухвата и
  извршне и неизвршне чланове одбора. Подаци се прикупљају од стране Еуростата
  у сарадњи с Европским институтом за равноправност полова (EIGE).
5-4-1-intention: >-
  Жене су и даље пodzаступљене на вишим руководећим позицијама у корпоративном
  сектору. Повећање удjела жена у управним одборима компанија промовише
  равноправност полова и повезано је с бољим управљањем и пословним резултатима.
  Напредак значи трајно повећање удjела жена на позицијама чланова одбора.
5-4-1-methodology: >-
  Подаци се прикупљају из националних извора од стране Еуростата у сарадњи с
  EIGE-ом. Индикатор покрива највеће јавно листиране компаније регистроване у
  свакој земљи. Чланови одбора укључују и чланове надзорних и управљачких одбора.
5-3-1-title: Јаз у пензијама između полова
5-3-1-definition: >-
  Јаз у пензијама između полова је разлика između просjечних прихода од пензија
  које примају мушкарци и жене у доби од 65 до 79 година, изражена као посто
  просjечних пензијских прихода мушкараца. Одражава накупљене неједнакости с
  тржишта рада, укључуjући разлике у стопама запослености, радном времену,
  платама и прекидима каријере. Подаци се заснивају на EU-SILC анкети.
5-3-1-intention: >-
  Јаз у пензијама između полова посљедица је неједнакости у запослењу и
  зарадама током цијелог радног вијека. Затварање јаза захтијева рjешавање
  темељних узрока, укључујући прекиде каријере због скрби, рад с непуним
  радним временом и сегрегацију по занимањима. Напредак значи трајно смањење
  јаза у пензијским приходима između мушкараца и жена.
5-3-1-methodology: >-
  Подаци се прикупљају путем EU анкете о приходима и условима живота (EU-SILC).
  Пензијски приходи укључују старосне пензије и пензије преживjелих. Јаз у
  пензијама između полова израчунава се као разлика između просjечних пензијских
  прихода мушкараца и жена, изражена као посто просjечног пензијског прихода
  мушкараца, за особе у доби од 65 до 79 година.
5-2-1-title: Јаз у платама између полова
5-2-1-definition: >-
  Некоригован јаз у платама између полова је разлика између просјечних бруто
  сатних зарада запослених мушкараца и жена, изражена као посто просјечних
  бруто сатних зарада мушкараца. Заснива се на запосленицима у фирмама с
  десет или више запослених. Подаци се прикупљају путем Истраживања о
  структури зарада.
5-2-1-intention: >-
  Јаз у платама између полова одражава трајне неједнакости između мушкараца и
  жена на тржишту рада, укључујући разлике у секторима, занимањима, радном
  времену и прекидима каријере. Затварање јаза захтијева рjешавање сегрегације
  по занимањима и дискриминације. Напредак значи трајно смањење јаза у платама.
5-2-1-methodology: >-
  Подаци се прикупљају путем Истраживања о структури зарада (SES), које се
  проводи сваке четири године, с годишњим процјенама које израђује Еуростат.
  Индикатор покрива све економске активности осим јавне управе и заснива се
  на бруто сатним зарадама у фирмама с десет или више запослених.
5-1-1-title: Јаз у запослености između полова
5-1-1-definition: >-
  Јаз у запослености између полова је разлика између стопа запослености
  мушкараца и жена у доби од 20 до 64 године, изражена у процентним поенима.
  Позитивна вриједност значи да мушкарци имају вишу стопу запослености од жена.
  Подаци се заснивају на Анкети о радној снази ЕУ (EU-LFS).
5-1-1-intention: >-
  Јаз у запослености између полова одражава структурне неједнакости на тржишту
  рада. Затварање јаза захтијева политике које подржавају учешће жена у
  запослењу, укључујући приступачну дјечију заштиту, флексибилне радне аранжмане
  иједнаке могућности. Напредак значи трајно смањење разлике између стопа
  запослености мушкараца и жена.
5-1-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Стопа
  запослености израчунава се као посто запослених особа у укупној популацији
  у доби од 20 до 64 године. Јаз у запослености између полова је разлика između
  стопа запослености мушкараца и жена, изражена у процентним поенима.
4-6-1-title: Учешће одраслих у учењу
4-6-1-definition: >-
  Овај индикатор мјери удио одраслих у доби од 25 до 64 године који су
  учествовали у формалном или неформалном образовању и обуци у четири недјеље
  које су претходиле анкети. Изражава се као посто укупног становништва у
  доби од 25 до 64 године. Подаци се заснивају на Анкети о радној снази ЕУ.
4-6-1-intention: >-
  Цјеложивотно учење је кључно за прилагодбу промјенљивом тржишту рада и
  одржавање запошљивости. Веће учешће одраслих у учењу смањује неусклађеност
  вјештина и подржава социјалну укљученост. Циљ је повећати удио одраслих
  који се континуирано образују током свог живота.
4-6-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Формално
  образовање односи се на образовање које пружа редовни систем школа,
  универзитета и других формалних образовних институција. Неформално
  образовање укључује све организоване образовне активности изван формалног
  система.
4-5-1-title: Особе с барем основним дигиталним вјештинама
4-5-1-definition: >-
  Овај индикатор мјери удио особа у доби од 16 до 74 године које посједују
  барем основне дигиталне вјештине у четири области: информациона и податковна
  писменост, комуникација и сарадња, рјешавање проблема и креирање дигиталног
  садржаја. Изражава се као посто укупног становништва у доби од 16 до 74.
4-5-1-intention: >-
  Дигиталне вјештине су све više неопходне за учешће на тржишту рада и у
  друштву. Осигурање дигитално компетентног становништва подржава економски
  раст, иновације и социјалну укљученост. Напредак значи повећање удјела
  особа с барем основним дигиталним компетенцијама.
4-5-1-methodology: >-
  Подаци се прикупљају путем ЕУ истраживања о коришћењу ИКТ-а у домаћинствима
  и од стране појединаца. Композитни индикатор дигиталних вјештина заснива се
  на ЕУ Оквиру дигиталних компетенција (DigComp) и покрива активности обављене
  у 3 мјесеца прије анкете.
4-4-1-title: Ученици с ниским постигнућима у читању, математици и природним наукама
4-4-1-definition: >-
  Овај индикатор мјери удио 15-годишњих ученика који не досtigну ниво 2
  (минимални ниво компетентности) у читању, математици и природним наукама,
  на основу OECD Програма за међународну процјену ученика (PISA). Изражава се
  као посто свих процијењених ученика.
4-4-1-intention: >-
  Осигурање минималних компетенција писмености и математике за све младе
  кључно је за квалитетно образовање. Висоcке стопе слабих постигнућа
  ограничавају будуће могућности запослења и економског учешћа. Напредак
  значи смањење удјела ученика с ниским постигнућима у све три области.
4-4-1-methodology: >-
  Подаци долазе из OECD PISA истраживања, које се проводи сваке три године
  међу ученицима од 15 година. Ниво 2 компетентности је базични ниво на ком
  ученици почињу показивати компетенције које им омогућавају активно учешће
  у модерном друштву. Истраживање покрива читање, математику и природне науке.
4-3-1-title: Учешће у раном дјечијем образовању
4-3-1-definition: >-
  Овај индикатор мјери удио дјеце у доби од 3 године до почетка обавезног
  школовања која учествују у програмима раног дјечијег образовања. Изражава
  се као посто становништва у истој добној групи. Подаци се прикупљају из
  националних административних извора.
4-3-1-intention: >-
  Рано дјечије образовање кључно је за припрему дјеце за основну школу и
  цјеложивотно учење. Висоcке стопе учешћа смањују неједнакости и подржавају
  когнитивни, емоционални и социјални развој од најраније доби. Дугорочни
  циљ је максимизирати учешће све дјеце у квалитетном раном образовању.
4-3-1-methodology: >-
  Подаци се компилују од стране Еуростата из националних административних
  извора и односе се на дјецу уписану у програме ISCED 2011 нивоа 0 (рано
  дјечије образовање). Покривеност укључује јавне и приватне институције.
  Референтна популација су дјеца од 3 године до почетка обавезног школовања.
4-2-1-title: Терцијарно образовање (25–34 године)
4-2-1-definition: >-
  Овај индикатор мјери удио особа у доби од 25 до 34 године које су успјешно
  завршиле терцијарно образовање (ISCED 2011 нивои 5–8). Изражава се као
  посто укупног становништва у тој добној групи. Подаци се заснивају на
  Анкети о радној снази ЕУ.
4-2-1-intention: >-
  Повећање удјела особа с терцијарним образовањем кључно је за развој
  квалификоване радне снаге способне за подстицање иновација и економског
  раста. Виши нивои образовања повезани су с бољим изгледима за запослење,
  вишим приходима и већим грађанским ангажовањем. Напредак подразумијева
  континуирани раст удјела младих који завршавају терцијарно образовање.
4-2-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS). Терцијарно
  образовање одговара ISCED 2011 нивоима 5 до 8, који обухватају кратке
  терцијарне програме, прва степенске студије, другостепене студије и
  докторске програме. Добна група 25–34 одабрана је јер је већина особа у
  том распону завршила иницијално образовање.
4-1-1-title: Рано напуштање образовања и обуке
4-1-1-definition: >-
  Рано напуштање образовања и обуке односи се на особе у доби од 18 до 24
  године које су стекле највише ниже средње образовање и нису укључене у
  даље образовање или обуку. Индикатор се изражава као посто укупног
  становништва у доби од 18 до 24 године. Подаци се заснивају на Анкети
  о радној снази ЕУ.
4-1-1-intention: >-
  Смањење раног напуштања образовања кључно је за осигурање да сви млади
  стекну знања и вјештине неопходне за запослење и активно грађанство.
  Високе стопе раног напуштања повезане су с нижим приходима, вишом
  незапосленошћу и већом зависношћу од система социјалне подршке.
  Дугорочни циљ је минимизирати удио оних који рано напуштају школовање.
4-1-1-methodology: >-
  Подаци се прикупљају путем Анкете о радној снази ЕУ (EU-LFS), великог
  истраживања домаћинстава које пружа тромјесечне статистике о учешћу на
  тржишту рада. Индикатор обухвата особе од 18 до 24 године чији је највиши
  ниво образовања ISCED 2011 ниво 0, 1 или 2, и које су изјавиле да нису
  биле укључене у никакво образовање или обуку у четири недјеље које су
  претходиле анкети.
metadata-footer-label: Национални референтни метаподаци

1-10-title: Лица у ризику од сиромаштва или социјалне искључености
1-10-definition: >-
  Индикатор је дио скупа индикатора циљева одрживог развоја ЕУ (СДГ). Користи се за праћење напретка ка циљу одрживог развоја 1 о искорјењивању сиромаштва у свим његовим облицима свуда и циљу одрживог развоја 10 о смањењу неједнакости унутар и међу земљама које су уграђене у Приоритет Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Овај индикатор одговара збиру људи који су: у ризику од сиромаштва након социјалних трансфера, тешко материјално и социјално депривирани, или живе у домаћинствима са веома ниским интензитетом рада. Појединци се броје само једном, чак и ако је на њих утицало више од једног од ових догађаја.

  • 	Сматра се да су људи изложени ризику од сиромаштва након социјалних трансфера ако њихов еквивалентни расположиви доходак није већи од прага ризика од сиромаштва, који је постављен на 60% националног средњег еквивалентног расположивог дохотка.

  • Стопа тешке материјалне и социјалне депривације је удио становништва које доживљава присилни недостатак од најмање 7 од 13 ставки депривације (6 се односи на појединца, а 7 на домаћинство)
1-10-intention: >-
  Сиромаштво и социјална искљученост су штетни за животе појединаца и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успешан живот и додатно повећава ризик од сиромаштва. Без ефикасног система образовања, здравствене заштите, социјалне заштите, пореских олакшица и запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује упорност сиромаштва и тиме ствара још већу неједнакост, што може довести до дугорочног губитка економске продуктивности читавих група друштва и ометати инклузивни и одрживи економски раст.
1-10-methodology: >-
  Подаци који се користе за овај индикатор заснивају се на хармонизованом годишњем истраживању о приходима и условима живота (ЕУ-СИЛЦ) широм Европе. У 2020. години истраживања, ЕУ-СИЛЦ је прошао опсежне методолошке ревизије и интегрисан је у микроцензус као одговор на све веће захтјеве за ажурираним подацима и пружањем детаљнијих регионалних резултата. Као резултат овог усклађивања, подаци од 2020. године надаље нису упоредиви са подацима из претходних година.
  Од 2021. године, Регулаtива (ЕУ) 2019/1700 предвиђа захтјеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
1-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност 0
1-20-title: Лица у опасности од монетарног сиромаштва након социјалних трансфера
1-20-definition: >-
  Прикупљање ЕУ-СИЛЦ је кључни инструмент за пружање информација које се захтјевају у оквиру Европског семестра ([1]) и Европског стуба социјалних права. Такође је главни извор података за потребе микросимулације и за израду брзих процјена расподјеле прихода и стопа сиромаштва. Индикатор особа у ризику од сиромаштва или социјалне искључености (АРОПЕ) остаје кључан за праћење европских социјалних политика, посебно за праћење циља ЕУ за 2030. годину о сиромаштву и социјалној искључености.
  Статистика Европске уније о приходима и условима живота (EU-SILC) прикупља благовремене и упоредиве вишедимензионалне микроподатке о приходима, сиромаштву, социјалној искључености и условима живота. Наведени су статистички концепти и дефиниције за EU-SILC Регулаtивa ЕУ 2019/1700,  Регулаtивa EU 2019/2181 i  Регулаtивa EU 2019/2242. Основна Регулаtивa и њени спроведбени и делегирани акти предвидjели су вишеструке измjене у прикупљању података ЕУ-СИЛЦ почев од 2021. године.
  Земље морају да се придржавају Анекса II Регулаtивe ЕУ 2019/2242, који наводи промjењиве, укључујући њихове модалитете, ознаке, јединицу и референтни период.
1-20-intention: >-
  Индикатор особа у ризику од сиромаштва или социјалне искључености (АРОПЕ) остаје кључан за праћење европских социјалних политика, посебно за праће Регулаtива е циља ЕУ за 2030. годину о сиромаштву и социјалној искључености. 
  Инструмент ЕУ-СИЛЦ пружа двијe врсте података:
  више димензионалнe податке који се односе на одређено вријеме или одређени временски период са варијаблама о приходима, сиромаштву, социјалној искључености и другим условима живота;
  лонгитудинални подаци који се односе на промjене на индивидуалном нивоу током времена, посматрани периодично са шемом ротације од четири или више година (Анекс III(2) Уредбе ЕУ 2019/1700).
1-20-methodology: >-
  Циљна популација су приватна домаћинства и сва лица која сачињавају ова домаћинства која имају своје уобичајено пребивалиште на националној територији. Приватно домаћинство је особа која живи сама или група особа које живе заједно, обезбјеђујући себи основне животне потребе.
  Концепт тачности се односи на прецизност процjена израчунатих из узорка, а не из цијеле популације. Тачност зависи од величине узорка, ефеката дизајна узорковања и структуре популације која се проучава. Поред тога, потребно је узети у обзир грешке у узорковању и грешке које нису у узорковању. Грешка у узорковању означава варијабилност која се насумично јавља усљед коришћења узорка, а не пописа, а грешке које нису грешке у узорковању су грешке које се јављају у свим фазама процеса прикупљања и производње података.
  од 2021. године
  Регулаtива ЕУ 2019/1700 утврђује захтjеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Прилогом III те Регулаtивe, карактеристике узорковања, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процjену и процjену варијансе.
1-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност 0
1-31-title: Стопа тешке материјалне и социјалне ускраћености према старосној групи и полу
1-31-definition: >-
  Домен „Приходи и услови живота“ (ЕУ-СИЛЦ) обухвата сљедеће теме: особе у ризику од сиромаштва или социјалне искључености, неједнакост прихода, расподјелу прихода и монетарно сиромаштво, услове живота и материјалну депривацију. Обухвата и ЕУ-СИЛЦ "ad hoc" модуле, који су организовани у колекције индикатора о одређеним темама.
  Прикупљање ЕУ-СИЛЦ је кључни инструмент за пружање информација које се захтјевају у оквиру Европског семестра ([1]) и Европског стуба социјалних права. Такође је главни извор података за потребе микросимулације и за израду брзих процјена расподјеле прихода и стопа сиромаштва. 
  2024. године, поред годишњих података, ЕУ-СИЛЦ је прикупила трогодишњи модул о здрављу дјеце, приступу здравственој заштити и специфичној депривацији дјеце и шестогодишњи модул о приступу услугама. Информације прикупљене у ЕУ-СИЛЦ односе се на сљедеће врсте статистичких јединица: приватна домаћинства и лица која живе у тим домаћинствима. Анекс II Уредбе ЕУ 2019/2242 дефинише специфичне статистичке јединице за сваку променљиву, док Анекс IV исте Уредбе одређује садржај извештаја о квалитету о организацији узорка истраживања у области прихода и услова живота, у складу са Уредбом ЕУ 2019/1700 Европског парламента и Савјета.
1-31-intention: >-
  Заједнички оквир ЕУ-СИЛЦ има за циљ да обезбједи стандардизацију на различитим нивоима. Концептуална стандардизација се постиже дефинисањем и документовањем заједничких концепата/дефиниција на којима се заснива свака мера/варијабла, обима и временске референце.
  У 2021. години ступило је на снагу ново законодавство о спровођењу ЕУ-СИЛЦ, ревидирајући и побољшавајући анкету (видети Одељак 3.4). Новим законодавством предвиђене су вишеструке измјене у прикупљању података ЕУ-СИЛЦ, посебно:

  •	спровео је потребу за следећим побољшањима: побољшана благовременост, са краћим роковима за достављање података ЕУ-СИЛЦ;

  •	реформулисала је захтјеве за прецизношћу на националном и регионалном нивоу (НУТС2) за индикатор ризика од сиромаштва или социјалне искључености и стопу трајног ризика од сиромаштва;

  •	додатне/измјењене ЕУ-СИЛЦ варијабле;

  •	прикупљање података са три фреквенције: језгро, трогодишњи модул и шестогодишњи модул, и препорука за проширење уздужног панела.
1-31-methodology: >-
  Циљна популација су приватна домаћинства и сва лица која сачињавају ова домаћинства која имају своје уобичајено пребивалиште на националној територији. Приватно домаћинство је особа која живи сама или група особа које живе заједно, обезбјеђујући себи основне животне потребе.
  Референтни период је година истраживања. За све земље, референтни период за варијабле прихода у ЕУ-СИЛЦ је претходна календарска година.
  Концепт тачности се односи на прецизност процена израчунатих из узорка, а не из цијеле популације. Тачност зависи од величине узорка, ефеката дизајна узорковања и структуре популације која се проучава. Поред тога, потребно је узети у обзир грешке у узорковању и грешке које нису у узорковању. Грешка у узорковању означава варијабилност која се насумично јавља услед коришћења узорка, а не пописа, а грешке које нису грешке у узорковању су грешке које се јављају у свим фазама процеса прикупљања и производње података.
  из 2021. године
  Уредба ЕУ 2019/1700 утврђује захтјеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Прилогом III те уредбе, карактеристике узорковања, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процену и процену варијансе.
1-31-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-40-title: Лица која живе у домаћинствима са веома ниским интензитетом рада, по старосним групама
1-40-definition: >-
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-40-intention: >-
  Људи старости од 0 до 64 године који живе у домаћинствима у којима су одрасли радили радно време једнако или мање од 20% њиховог укупног комбинованог потенцијала радног времена током претходне године.
  Одрасли број људи у доби од 18 до 64 године. Студенти узраста од 18 до 24 године; људи који су пензионисани у складу са својим само-дефинисаним тренутним економским статусом или који примају било коју пензију (осим породичне пензије); и људи у старосној групи од 60 до 64 године који су неактивни и живе у домаћинству где су главни приходи пензије, не узимају се у обзир.
  Индикатор је део мултидимензионалног индекса сиромаштва.
1-40-methodology: >-
  Референтни период је година истраживања. За све земље, референтни период за варијабле прихода у ЕУ-СИЛЦ је претходна календарска година.
  Индикатор је укључен као секундарни индикатор у Преглед социјалних индикатора за Европски стуб социјалних права и Акциони план ЕПСР-а, а дио је вишедимензионалног индекса сиромаштва. Може се сматрати дјелом глобалног индикатора СДГ 1.2.2 „Удио мушкараца, жена и деце свих узраста који живе у сиромаштву у свим његовим димензијама према националним дефиницијама“
  Од 2021. године Уредба (ЕУ) 2019/1700 предвиђа захтеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијанце.
1-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-41-title: Стопа запослених у ризику од сиромаштва
1-41-definition: >-
  Индикатор је дио индикатора Циљева одрживог развоја ЕУ (СДГ) који се користи за праћење напретка ка циљу одрживог развоја 1 искорењивању сиромаштва у свим његовим облицима свуда, што је уграђено у приоритете Европске комисије у оквиру „Економије која ради за људе“.
  Индикатор је укључен као секундарни индикатор у Преглед социјалних индикатора за Европски стуб социјалних права и Акциони план ЕПСР.
  Удио лица која су запослена и имају еквивалентни расположиви доходак испод прага ризика од сиромаштва, који је постављен на 60% националног медијана еквивалентног расположивог дохотка (након социјалних трансфера). За потребе овог индикатора, сматра се да је појединац запослен ако је био запослен више од половине референтне године. Индикатор се заснива на ЕУ-СИЛЦ (статистика о приходима, социјалној инклузији и условима живота).
1-41-intention: >-
  Запосленост се често тврди да је најбоља заштита од сиромаштва, тако да је један од циљева ЕУ стварање више и бољих радних места. Стога је важно измјерити удео сиромашних радника, људи који живе испод границе сиромаштва иако раде.
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-41-methodology: >-
  Индикатор је произведен у складу са високим стандардима квалитета европске статистике. Од 2005. године надаље, ЕУ-СИЛЦ се заснива на заједничком оквиру дефинисаном хармонизованим листама примарних и секундарних варијабли, заједничким концептима, препорученом дизајну, заједничким захтевима (као што су поступци импутације, пондерисање, израчунавање грешака у узорковању) и класификацијама са циљем максимизирања упоредивости произведених информација.
  Од 2021  године Уредба (ЕУ) 2019/1700 предвиђа захтеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
1-41-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-50-title: Стопа прекомјерног оптерећења трошковима становања према статусу сиромаштва
1-50-definition: >-
  Индикатор је дио индикатора Циљева одрживог развоја ЕУ (СДГ) који се користи за праћење напретка ка циљу одрживог развоја 1 о искорјењивању сиромаштва у свим његовим облицима свуда, који је уграђен у приоритете Европске комисије под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор је укључен као секундарни индикатор у Преглед социјалних индикатора за Европски стуб социјалних права и Акциони план ЕПСР-а, а дио је вишедимензионалног индекса сиромаштва. Може се сматрати дјелом глобалног индикатора СДГ 1.2.2 „Удио мушкараца, жена и деце свих узраста који живе у сиромаштву у свим његовим димензијама према националним дефиницијама“
1-50-intention: >-
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-50-methodology: >-
  Индикатор мјери удио становништва које живи у домаћинствима која троше 40% или више расположивог дохотка домаћинства на становање („нето“ накнаде за становање). Трошкови становања укључују плаћање камате на закуп или хипотеку, али и трошкове комуналних услуга као што су вода, струја, гас или грејање.
  Од 2021  године Уредба (ЕУ) 2019/1700 предвиђа захтеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
1-50-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
2-10-title: Стопа гојазности према индексу тjелесне масе (BMI)
2-10-definition: >-
  Европско истраживање о здрављу (EHIS) има за циљ да измjери здравствено стање (укључујући инвалидитет), детерминанте здравља (начин живота) грађана ЕУ, коришћење здравствених услуга и препреке у приступу тим услугама, на хармонизован начин и са високим степеном упоредивости међу државама чланицама (ДЦ).
  Општи обухват истраживања укључује популацију старију од 15 година која живи у приватним домаћинствима на територији земље.
  EHIS се састоји из четири модула: здравствено стање, детерминанте здравља, здравствена заштита и основне варијабле (социодемографске карактеристике популације).
2-10-intention: >-
  Подаци се прикупљају кроз националне анкете. EHIS се може спровести као посебна национална анкета или се може интегрисати у постојећу националну анкету (нпр. национална анкета о здрављу, анкета о радној снази, друга анкета домаћинстава). На овај начин, државе чланице имале су максималну флексибилност у спровођењу. Међутим, у оквиру ЕУ су исти подаци прикупљани према заједничкој листи варијабли и категорија одговора.
2-10-methodology: >-
  EHIS има за циљ постизање стандартизације уноса података. Припремљен је стандардни модел упитника (питања, категорије одговора, филтери итд.), као и концептуална упутства и објашњења. Захтеван је концептуални превод на све језике ЕУ. 
  У методолошком приручнику за трећу фазу EHIS-а пружена је процена упоредивости променљивих са оним из фазе 2, користећи скалу: „идентично питање“; „слабо модификовано питање“; „снажно модификовано питање“; или „није доступно: ново питање у трећој фази EHIS-а.“
2-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је БМИ од 3.
2-20-title: Реални факторски доходак пољопривреде по годишњој радној јединици (AWU)
2-20-definition: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 2 о искорењивању глади и неухрањености; који је укључен у Приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Реални факторски доходак пољопривреде мери приход који генерише пољопривреда, а који се користи за надокнаду позајмљених, изнајмљених или поседованих фактора производње (капитал, рад и земљиште).
  Годишње радне јединице (ГРЈ) су дефинисане као рад са пуним радним временом (што одговара броју радних места са пуним радним временом) и израчунавају се дељењем укупног броја одрађених сати са просечним годишњим бројем сати одрађених на радним местима са пуним радним временом унутар економске територије. Ово се може тумачити као мера продуктивности рада у пољопривреди. Подаци потичу из Економских евиденција пољопривреде (ЕЕП), које пружају детаљне информације о приходима пољопривредног сектора.
2-20-intention: >-
  Намера Циљ циља одрживог развоја 2 јесте обезбеђивање приступа безбедној, хранљивој и довољној храни. Повећање пољопривредне продуктивности и прихода произвођача хране кључни су фактори у постизању овог циља. Извор података су Економски рачуни за пољопривреду (ЕРА), који користе пољопривредну статистику и административне информације. ЕРА су сателитски рачуни Европског система рачуна, који пружају комплементарне информације и концепте прилагођене специфичностима пољопривредне индустрије. Иако њихова структура веома одговара националним рачунима, њихово састављање захтева формулисање одговарајућих правила и метода.
2-20-methodology: >-
  Један од пет општих циљева Заједничке пољопривредне политике (ЗПП) јесте обезбеђивање праведног животног стандарда пољопривредника. ЗПП се финансира из два фонда: Европског фонда за гаранције у пољопривреди (ЕФГФ), који финансира директна плаћања пољопривредницима, као и тржишне мере, и Европског пољопривредног фонда за рурални развој (ЕАФРД), који финансира програме руралног развоја. Субвенције ЕУ и директна плаћања постале су значајан удео факторског дохотка у пољопривреди.
2-20-long_term_objective: >-
  повећање продуктивности и профитабилности пољопривредног сектора кроз:

  - Повећање реалног факторског дохотка

  - Смањење пољопривредне радне снаге

  - Стабилизацију пољопривредног дохотка
2-30-title: Државна подршка истраживању и развоју пољопривреде
2-30-definition: >-
  Индикатор се односи на издвајања из државног буџета за истраживање и развој (GBARD) за пољопривреду. Подаци GBARD мере владину подршку активностима истраживања и развоја (R&D), или, другим речима, колико владе дају приоритет јавном финансирању истраживања и развоја. Подаци GBARD се прикупљају коришћењем смерница наведених у ОЕЦД-овом Фраскати приручнику из 2015. године и Европском методолошком приручнику за статистику пословања за статистику истраживања и развоја из 2023. године. Подаци су изражени у текућим ценама, што значи да на укупни развој индикатора делимично утиче и општа инфлација цена.
2-30-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 2 о искорењивању глади и неухрањености; који су уграђени у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“. 
  Циљ одрживог развоја 2 – између осталог – има за циљ да обезбеди приступ безбедној, хранљивој и довољној храни. Побољшање пољопривредне продуктивности и одржавање одрживих и отпорних система производње хране кључни су фактори у постизању овог циља и у великој мери зависе од повећаних улагања у истраживање и развој у пољопривреди, храни и исхрани.
2-30-methodology: >-
  Земље прикупљају податке GBARD-а пратећи препоруке из Фраскати приручника. Међу неколико методолошких питања која могу утицати на поређења између земаља су фаза у буџетском процесу из које се црпе коначни подаци GBARD-а (коначна буџетска средства или стварни издаци); укључивање ПДВ-а или средстава ЕУ за истраживање и развој.
  Подаци GBARD-а су разврстани по:

  - Социо-економским циљевима (SEO) у складу са Номенклатуром за анализу и поређење научних програма и буџета (NABS 2007). - (Види Прилог 3 на дну странице).

  - Начин финансирања: финансирање пројеката и институционално финансирање (необавезни подаци).
  Део GBARD-а додељен транснационалној сарадњи у истраживању и развоју даље је разврстан у три специфичне категорије: транснационални јавни извођачи истраживања и развоја; транснационални јавни програми истраживања и развоја широм Европе; и билатерални или мултилатерални јавни програми истраживања и развоја успостављени између влада држава чланица или са ЕФТА и земљама кандидатима.
2-30-long_term_objective: >-
  Јачање тржишне оријентације и конкурентности
2-40-title: Површина под органском пољопривредом
2-40-definition: >-
  Опис пољопривредне површине (КПЗ) коју заузима органска пољопривреда (постојеће органски обрађене површине и површине које пролазе кроз конверзију). Органска пољопривреда је метод производње који ставља највећи нагласак на заштиту животне средине и дивљих животиња, а у погледу сточарске производње и на разматрања добробити животиња. Избегава или у великој мери смањује употребу синтетичких хемијских улагања, као што су ђубрива, пестициди, адитиви и медицински производи.
2-40-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 2 о искорењивању глади и неухрањености; који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Цир одрживог развоја 2 има за циљ да обезбеди приступ безбедној, хранљивој и довољној храни. Одрживи и отпорни системи производње хране су кључни фактор у постизању овог циља. Органска пољопривреда је метод производње који ставља највећи нагласак на заштиту животне средине и, када је у питању сточарска производња, на разматрања добробити животиња. Она избегава или у великој мери смањује употребу синтетичких хемијских инпута као што су ђубрива, пестициди, адитиви и медицински производи.
  Индикатор се може сматрати делом глобалног индикатора циља одрживог развоја 2.4.1 „Удео пољопривредне површине под продуктивном и одрживом пољопривредом“.
2-40-methodology: >-
  Индикатор се може сматрати делом глобалног индикатора циљева одрживог развоја 2.4.1 „Удео пољопривредног земљишта под продуктивном и одрживом пољопривредом“. Иако органска пољопривреда није експлицитно поменута у Агенди 2030, ЕУ сматра органску пољопривреду методом производње која ставља највећи нагласак на заштиту животне средине и дивљих животиња, а у погледу сточарске производње и на разматрања добробити животиња. Избегава или у великој мери смањује употребу синтетичких хемијских инпута као што су ђубрива, пестициди, адитиви и медицински производи. Производња генетски модификованих организама (ГМО) и њихова употреба у сточној храни су забрањени.
  Стратегија биодиверзитета за 2030. годину је кључна компонента Европског зеленог плана. Стратегија има за циљ смањење употребе и ризика од хемијских пестицида, смањење губитака хранљивих материја и смањење употребе ђубрива и антибиотика. Стратегија биодиверзитета поставља циљ да се до 2030. године постигне 25% укупног пољопривредног земљишта ЕУ под органском пољопривредом.
2-40-long_term_objective: >-
  Најмање 25% пољопривредног земљишта ЕУ требало би да буде под органском пољопривредом до 2030. године
2-53-title: Употреба и ризик од хемијских пестицида
2-53-definition: >-
  Индикатор прати трендове у употреби и ризику хемијских пестицида у ЕУ и њеним државама чланицама. Употреба пестицида са собом носи ризике и утицаје на људско здравље и животну средину. Индикатор се заснива на количинама хемијских активних супстанци садржаних у пестицидима који се стављају на тржиште (продају), а самим тим и користе, у свакој држави чланици, и на опасним својствима ових активних супстанци. Подаци су представљени као индекс у односу на просечне резултате за период од 2015. до 2017. године.
2-53-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 2 о искорењивању глади и неухрањености; који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Циљ одрживог развоја 2 има за циљ да обезбеди приступ безбедној, хранљивој и довољној храни. Одрживи и отпорни системи производње хране су кључни фактор у постизању овог циља. Уз промоцију органске пољопривреде, интегрисано управљање штеточинама (ИУБ) је један од алата за наглашавање раста здравих усева подстицањем природних механизама сузбијања штеточина и смањењем или минимизирањем ризика по људско здравље и животну средину.
  „Акциони план за нулто загађење“ ЕУ има за циљ да смањи употребу и ризик од хемијских пестицида и употребу опаснијих пестицида за 50% до 2030. године.
2-53-methodology: >-
  Израчунавање засновано на количинама хемијских активних супстанци које су одобрене као кандидати за замену у складу са чланом 24 Уредбе (ЕЗ) бр. 1107/2009, садржаних у средствима за заштиту биља која се стављају на тржиште у средствима за заштиту биља сваке године пријављеним према Уредби (ЕЗ) бр. 1185/2009 у складу са Уредбом (ЕЗ) бр. 1107/2009 и достављеним у складу са Прилогом I Уредбе (ЕЗ) бр. 1185/2009.
2-53-long_term_objective: >-
  Смањити употребу и ризик хемијских пестицида за 50% до 2030. године у поређењу са трогодишњом основном вриједношћу (просек за период од 2015. до 2017. године)
2-60-title: Емисије амонијака из пољопривреде
2-60-definition: >-
  Количина емисија амонијака (NH3) као резултат пољопривредне производње. Емисије амонијака по хектару се израчунавају користећи укупну коришћену пољопривредну површину (КПП) релевантне године као именилац.
  Подаци за овај индикатор потичу из инвентара ЕУ о загађењу ваздуха који је саставила Европска агенција за животну средину (ЕЕА) у складу са Конвенцијом о прекограничном загађењу ваздуха на велике удаљености (ЛРТАП) и у потпуности су у складу са националним инвентарима загађења ваздуха које су саставиле државе чланице ЕУ.
  Подаци о коришћеној пољопривредној површини (КПП) потичу из годишње статистике усева Евростата. Дефиниција овог индикатора заснива се на индикатору CAP C45 Емисије из пољопривреде
2-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 2 о искорењивању глади и неухрањености; који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Циљ одрживог развоја 2 тежи одрживим и отпорним системима производње хране. Амонијак (NH3) је безбојан, гас оштрог мириса и корозиван, који настаје распадањем органске биљне материје и из измета људи и животиња. Када се испусти у атмосферу, амонијак доприноси нивоу загађења ваздуха. Пољопривредни сектор и даље је највећи допринос емисији амонијака у ЕУ.
2-60-methodology: >-
  Индикатор прати трендове у употреби и ризику хемијских пестицида у ЕУ и њеним државама чланицама. Употреба пестицида са собом носи ризике и утицаје на људско здравље и животну средину. Индикатор се заснива на количинама хемијских активних супстанци садржаних у пестицидима који се стављају на тржиште (продају), а самим тим и користе, у свакој држави чланици, и на опасним својствима ових активних супстанци. Подаци су представљени као индекс у односу на просечне резултате за период од 2015. до 2017. године.
  Мере спроведене у оквиру Заједничке пољопривредне политике (ЗПП) и Оквирне директиве о водама довеле су до смањења емисија амонијака из пољопривреде у ЕУ од 1990-их. Конкретно, мере за промену пољопривредних пракси довеле су до смањења употребе азотних ђубрива и смањења густине стоке по хектару широм ЕУ.
  Директива о националним обавезама за смањење емисија (Директива о НЕЦ) поставља националне обавезе за смањење емисија за државе чланице и ЕУ за пет важних загађивача ваздуха, укључујући амонијак.
2-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 8 по хектару.
3-12-title: Здраве године живота засноване на самоопажању здравља
3-12-definition: >-
  Овај индикатор процењује број година колико се очекује да ће особа живети у добром перципираном здрављу. Заснован је на подацима о смртности у комбинацији са подацима о самопроцени здравља, како је пријављено у Статистици ЕУ о приходима и условима живота (EU-SILC).
3-12-methodology: >-
  Добро здравље није само вредно за појединца као главни фактор квалитета живота, благостања и друштвеног учешћа, већ је и основни предуслов за општи економски раст. Праћење циља одрживог развоја 3 у контексту ЕУ фокусира се на теме здравог живота, фактора здравља, узрока смрти и здравствене заштите.
3-20-title: Удио људи са добром или веома добром перцепцијом здравља према полу
3-20-definition: >-
  Индикатор је субјективна мјера о томе како људи генерално процјењују своје здравље на скали од „веома доброг“ до „веома лошег“. Изражава се као удио популације старије од 16 година која себе доживљава као „доброг“ или „веома доброг“ здравља.
  Утврђено је да су индикатори перципираног општег здравља добар предиктор будуће употребе здравствене заштите и смртности људи. Подаци потичу из Статистике ЕУ о приходима и условима живота (ЕУ СИЛЦ).
3-20-intention: >-
  Од 2021. године Уредба (ЕУ) 2019/1700 предвиђа захтјеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
3-20-methodology: >-
  Од 2021. године надаље, ЕУ-СИЛЦ се заснива на заједничком оквиру дефинисаном хармонизованим листама примарних и секундарних варијабли, заједничким концептима, препорученом дизајну, заједничким захтјевима (као што су поступци импутације, пондерисање, израчунавање грешака у узорковању) и класификацијама са циљем максимизирања упоредивости произведених информација. Детаљи се могу наћи у метаподацима изворних скупова података.
3-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 80.
3-30-title: Преваленција пушења према полу
3-30-definition: >-
  Овај индикатор мјери проценат становништва старости 15 и више година које је пријавило да тренутно пуши цигарете, цигаре, цигарилосе или лулу. Не укључује употребу других дуванских и сродних производа као што су електронске цигарете и снуф. Подаци се прикупљају путем истраживања Евробарометра и заснивају се на самоизвештају о коришћењу током интервјуа лицем у лице у домовима људи.
3-30-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-30-methodology: >-
  Индикатор се може сматрати сличним глобалном индикатору СДГ 3.а.1 „Старосно стандардизована распрострањеност тренутне употребе дувана код особа старијих од 15 година“.
  Неколико директива ЕУ има за циљ заштиту грађана од опасних ефеката пушења, укључујући Директиву о дуванским производима, Директиву о оглашавању дувана и Директиву о опорезивању дувана.
3-30-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 12
3-42-title: Стандардизована смртност која се може спријечити и лијечити
3-42-definition: >-
  Смртност која се може избећи обухвата узроке смртности који се могу спријечити и излијечити. Смртност која се може спријечити односи се на смртност која се углавном може избјећи ефикасним интервенцијама јавног здравља и примарне превенције (спроведене прије појаве болести/повреда како би се смањила инциденца). Излијечива смртност се углавном може избјећи благовременим и ефикасним здравственим интервенцијама, укључујући секундарну превенцију и лечење (након појаве болести).
3-42-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”. 
  Главни предуслов за постизање ових циљева је универзална здравствена покривеност; приступ услугама сексуалног и репродуктивног здравља и безбједним, приступачним и ефикасним лијековима и вакцинама за све. Стандардизоване стопе смртности које се користе за овај индикатор узимају у обзир да земље са већим удјелом старијих становника такође имају веће стопе смртности.
3-42-methodology: >-
  Укупна стопа смртности која се може избјећи обухвата низ заразних болести, неколико врста карцинома, ендокриних и метаболичких болести, као и неке болести нервног, циркулаторног, респираторног, дигестивног и генитоуринарног система, неке болести везане за трудноћу, порођај и перинатални период, низ урођених малформација, нежељених ефеката медицинске и хируршке неге, списак повреда и поремећаја везаних за алкохол и дрогу.
  Смртност која се може лијечити углавном се може избећи правовременим и ефикасним интервенцијама здравствене заштите, укључујући секундарну превенцију и лијечење (након појаве болести како би се смањила смртност од случаја). Подаци су представљени као стандардизоване стопе смртности, што значи да су прилагођени стандардној старосној дистрибуцији како би се измјериле стопе смртности независно од различитих старосних структура популација како би се смањила смртност од случаја).
3-42-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 150.
3-60-title: Самопријављена незадовољена потреба за љекарским прегледом и његом по полу
3-60-definition: >-
  Овај индикатор мјери удио становништва старости 16 и више година које пријављује незадовољене потребе за медицинском његом из једног од сљедећих разлога: „финансијски разлози“, „листа чекања“ и „предалеко за путовање“. Самопријављене незадовољене потребе односе се на сопствену процјену особе да ли јој је потребан љекарски преглед или љечење (без стоматолошке његе), али га није обавила или га није тражила.
  Пошто друштвене норме и очекивања могу утицати на одговоре на питања о незадовољеним потребама за његом, потребан је опрез када се упоређују разлике у извјештавању о незадовољеним љекарским прегледима у различитим земљама. Поред тога, различита организација здравствених услуга је још један фактор који треба узети у обзир приликом анализе података. Коначно, постоје и неке варијације у анкетним питањима у различитим земљама и током времена.
3-60-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и благостању и циљу одрживог развоја 1 о сиромаштву као вишенамјенском индикатору (МПИ); који су уграђени у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-60-methodology: >-
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
  Универзална здравствена покривеност је циљ Повеље ЕУ о основним правима. Један од три приоритета здравствене политике ЕУ је повећање доступности здравствене заштите. Поред тога, један од 20 принципа Европског стуба социјалних права је да свако има право на правовремени приступ приступачној, превентивној и куративној здравственој заштити доброг квалитета.
3-70-title: Потрошња антибиотика у заједници и болничком сектору – дефинисане дневне дозе (ДДД) дневно
3-70-definition: >-
  Овај индикатор мјери укупну потрошњу антимикробних средстава (АМЦ) у заједници и болничком сектору. АМЦ се изражава као број дефинисаних дневних доза (ДДД) на 1000 становника дневно. Подаци се односе на класификациону ознаку Анатомско-терапијско-хемијски (АТЦ) Ј01 „Антибактеријски производи за системску употребу“. Подаци за агрегат ЕУ приказани су као популационо пондерисана средина и укључују импутације и корекције.
3-70-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-70-methodology: >-
  Главни предуслов за постизање ових циљева је универзална здравствена покривеност; приступ услугама сексуалног и репродуктивног здравља и безбједним, приступачним и ефикасним лијековима и вакцинама за све. Стандардизоване стопе смртности које се користе за овај индикатор узимају у обзир да земље са већим удјелом старијих становника такође имају веће стопе смртности.
  Индикатор је сличан глобалном СДГ индикатору 3.д.2 „Проценат инфекција крвотока услед одабраних антимикробно резистентних организама“.
3-70-long_term_objective: >-
  Дугорочни циљ је постизање универзалног здравственог осигурања. То укључује заштиту од финансијског ризика, приступ квалитетним основним здравственим услугама и приступ безбједним, ефикасним, квалитетним и приступачним основним љековима и вакцинама за све. 
  До 2030. године, циљ је да се осигура да сви људи имају приступ услугама сексуалног и репродуктивног здравља, укључујући планирање породице, информације и образовање, као и да се репродуктивно здравље интегрише у националне стратегије и програме.
4-10-title: Рано напуштање образовања и обуке по полу
4-10-definition: >-
  Индикатор мјери уиео становништва старости од 18 до 24 године са највише нижим средњим образовањем које није било укључено у било какво (формално или неформално) образовање или обуку током четири недеље које су претходиле истраживању.
4-10-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању и циљу одрживог развоја 5 о родној равноправности, који су уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-10-methodology: >-
  Резолуција Савета поставља циљ на нивоу ЕУ да удио особа које рано напуштају образовање и обуку, мјерен овим индикатором циљева одрживог развоја, буде мањи од 9% до 2030. године. Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
  Образовање и обука су кључни покретачи раста и запошљавања јер помажу у побољшању запослености, продуктивности, иновација и конкурентности. Наставак образовања након основног нивоа је важан јер је вјероватније да ће људи са вишим квалификацијама бити запослени и мање је вјероватно да ће се суочити са сиромаштвом у економији заснованој на знању. Особе са ниским нивоом образовања не само да се могу суочити са већим потешкоћама на тржишту рада, већ имају и већи ризик од сиромаштва и социјалне искључености.
4-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 4
4-20-title: Високо образовање према полу
4-20-definition: >-
  Индикатор мјери удио становништва старости 25-34 године које је успјешно завршило терцијарне студије (нпр. на универзитету или вишој техничкој установи). Постигнуће у терцијарном образовању односи се на ИСЦЕД (Међународна стандардна класификација образовања) нивое 5–8 из 2011. године за податке од 2014. године надаље и на ИСЦЕД нивое 5–6 из 1997. године за податке до 2013. године. Индикатор се заснива на Анкети о радној снази ЕУ (ЕУ-ЛФС).
4-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању и циљу одрживог развоја 5 о родној равноправности, који су уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-20-methodology: >-
  Образовање и обука су кључни покретачи раста и запошљавања јер помажу у побољшању запослености, продуктивности, иновација и конкурентности. Наставак образовања након основног нивоа је важан јер је вјероватније да ће људи са вишим квалификацијама бити запослени и мање је вјероватно да ће се суочити са сиромаштвом у економији заснованој на знању. Особе са ниским нивоом образовања не само да се могу суочити са већим потешкоћама на тржишту рада, већ имају и већи ризик од сиромаштва и социјалне искључености.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
4-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 52
4-31-title: Учешће у образовању у раном дјетињству по полу (дјеца узраста 3 године и више)
4-31-definition: >-
  Индикатор мјери удио дјеце између треће године и почетног узраста обавезног основног образовања која су учествовала у образовању и њези у раном детињству (ЕЦЕЦ) које се може класификовати као ИСЦЕД ниво 0 према Међународној стандардној класификацији за образовање (ИСЦЕД 2011). Да би се ЕЦЕЦ програми класификовали као ИСЦЕД ниво 0, морају бити намјерно осмишљени тако да подржавају когнитивни, физички и социо-емоционални развој дјетета. Почетни узраст обавезног основног образовања варира од земље до земље. Учешће дјеце у програмима који нису намјерно осмишљени да подрже развој дјетета (као што су програми само за бригу о дјеци) није укључено у овај индикатор.
4-31-intention: >-
  Намјера	Индикатори који се користе за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“, „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Заштита наше демократије, очување наших вриједности“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-31-methodology: >-
  Како се образовање и брига у раном дјетињству све више препознају као саставни дио система образовања и обуке, Резолуција Савјета поставља циљ ЕУ да учешће у образовању и бризи у раном дјетињству буде најмање 96% дјеце између три године и почетног узраста за обавезно основно образовање до 2030. године.
4-31-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 100.
4-40-title: Петнаестогодишњаци са слабим успјехом у читању, математици или природним наукама
4-40-definition: >-
  Индикатор мјери удио 15-годишњих ученика који нису достигли ниво 2 („ниво основних вештина“) на ПИСА скали за три основна школска предмета читања, математике и науке. Подаци потичу из Програма за међународну процјену ученика (ПИСА), редовно спроведеног међународног истраживања чији је циљ евалуација образовних система тестирањем вјештина и знања 15-годишњих ученика.
4-40-intention: >-
  Индикатори који се користе за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“, „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Заштита наше демократије, очување наших вриједности“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-40-methodology: >-
  Резолуција Савјета поставља циљ ЕУ да удио 15-годишњака са ниским успехом у читању, математици и науци, мјерен овим индикатором циљева одрживог развоја, буде мањи од 15% до 2030. године.
4-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 525,6
4-60-title: Учешће одраслих у учењу у посљедње четири недеље по полу
4-60-definition: >-
  Индикатор мјери удио особа старости од 25 до 64 године које су изјавиле да су стекле формално или неформално образовање и обуку у четири недеље које су претходиле истраживању (бројилац). Именилац се састоји од укупне популације исте старосне групе, искључујући оне који нису одговорили на питање „учешће у образовању и обуци“. Образовање одраслих обухвата активности формалног и неформалног учења које се односе на посао и које се не односе на посао. Обично се односи на активности учења након завршетка иницијалног образовања.
4-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-60-methodology: >-
  Учење одраслих покрива најдужи период у животу учења особе. То укључује унапређење и развој вјештина, прилагођавање технолошком развоју, унапрјеђење каријере особе или помагање њеном повратку на тржиште рада (усавршавање и преквалификација). Штавише, од кључног је значаја за одржавање доброг здравља, остајање активним у заједници и потпуно укључивање у све аспекте друштва.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
4-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 28.
4-70-title: Удио појединаца који посједују барем основне дигиталне вјештине, по полу
4-70-definition: >-
  Овај индикатор мјери удио особа старости од 16 до 74 године који посједују најмање основне дигиталне вештине. То је композитни индикатор заснован на одабраним активностима које појединци обављају на интернету у одређеним областима: информациона и податковна писменост, комуникација и сарадња, креирање дигиталних садржаја, безбједност и ријешавање проблема. Индикатор оцјењује дигиталне вјештине класификоване у шест нивоа, од којих два највиша чине основни или изнад основног нивоа дигиталних вјештина. Индикатор се заснива на подацима из истраживања ЕУ о употреби ИКТ у домаћинствима и од стране појединаца.
4-70-intention: >-
  Индикатори који се користе за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“, „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Заштита наше демократије, очување наших вриједности“.
4-70-methodology: >-
  Циљ одрживог развоја 4 настоји да обезбједи људима приступ правичном и квалитетном образовању у свим фазама живота, као и да повећа број младих и одраслих који имају релевантне вјештине за запошљавање, пристојне послове и предузетништво. Циљ предвиђа и отклањање родних и доходовних неједнакости у приступу образовању.
  Дигиталне вештине су од критичне вриједности за рад, учење и социјалну интеракцију.
4-70-long_term_objective: >-
  Европски акциони план за стуб социјалних права и Дигитални компас до 2030. године: европски пут ка дигиталној деценији поставили су циљ да ЕУ повећа удио људи старости од 16 до 74 године који имају барем основне дигиталне вјештине на 80% до 2030. године.
5-10-title: Физичко и сексуално насиље над женама по старосним групама (подаци из 2012. године)
5-10-definition: >-
  Индикатор мјери удио жена од 15 година које су одговориле са „да“ када су упитане да ли су доживеле физичко и/или сексуално насиље од стране партнера или не-партнера у 12 месеци прије интервјуа.
5-10-intention: >-
  Обухват података 2012 - 2012
5-20-title: Разлика у платама између полова у неприлагођеном облику
5-20-definition: >-
  Индикатор мјери разлику између просјечне бруто сатнице запослених мушкараца и запослених жена као проценат просјечне бруто сатнице запослених мушкараца. Индикатор је дефинисан као неприлагођен, јер даје укупну слику родних неједнакости у погледу плате и мери концепт који је шири од концепта једнаке плате за једнак рад. Укључени су сви запослени који раде у фирмама са десет и више запослених, без ограничења старости и сати рада. Родна разлика у платама заснива се на методологији истраживања о структури зарада (SES), које се спроводи сваке четири године.
5-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор се може сматрати сличним глобалном СДГ индикатору 8.5.1 „Просјечна сатница запослених жена и мушкараца, према занимању, старости и особама са инвалидитетом“. Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
5-20-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
  Једнака плата за једнак рад је један од оснивачких принципа Европске уније, уграђен у Уговоре од 1957. године. Чланом 157. Уговора о функционисању Европске уније предвиђено је да свака држава чланица обезбијеђује примјену тог начела. Директива 2006/54/ЕЗ садржи принцип једнаке плате. Затварање родне разлике у платама је такође један од циљева Стратешког ангажовања Комисије за родну равноправност, као и Европског стуба социјалних права.
5-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
5-30-title: Разлика у запослености међу половима, према врсти запослења
5-30-definition: >-
  Индикатор мјери разлику између стопа запослености мушкараца и жена узраста од 20 до 64 године. Стопа запослености се израчунава тако што се број лица старости од 20 до 64 године у радном односу подели са укупном популацијом исте старосне групе. 
  Индикатор показује активност и радни статус за четири групе лица: запослена лица која раде пуно радно време, запослена лица која раде са непуним радним временом, запослена лица са уговором о раду на одређено време и подзапослена лица која раде са непуним радним временом.
5-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
5-30-methodology: >-
  Повећање учешћа жена на тржишту рада и једнака економска независност жена и мушкараца један је од приоритета Стратегије ЕУ за родну равноправност, која се обавезује на остваривање Уније равноправности. Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-30-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
5-40-title: Лица ван радне снаге због обавеза бриге о другима по полу
5-40-definition: >-
  Становништво ван радне снаге обухвата појединце који нису запослени и који или активно не траже посао или нису доступни за рад (чак и ако су пронашли посао који ће почети у будућности). Дакле, они нису ни запослени ни незапослени. 
  Ова дефиниција која се користи у Анкети о радној снази ЕУ (EU-LFS) заснива се на резолуцијама Међународне конференције статистичара рада (ICLS) коју је организовала Међународна организација рада (ILO). Разлог за одсуство радне снаге обухваћене овим индикатором укључује „бригу о одраслима са инвалидитетом или дјеци“. Разматрају се само људи који изражавају спремност за рад, упркос томе што су ван радне снаге.
5-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности и циљу одрживог развоја 8 о достојанственом раду и економском расту, који су уграђени у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
   Европски стуб социјалних права, који су заједнички прогласили Европска комисија, Европски парламент и Европски савјет 2017. године, утврђује 20 кључних принципа и права неопходних за праведна и добро функционишућа тржишта рада и системе социјалне заштите.
5-40-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-50-title: Мjеста која жене заузимају у националним парламентима и владама
5-50-definition: >-
  Индикатор мјери удио жена у националним парламентима и националним владама.
  Национални парламент је национална законодавна скупштина, а индикатор се односи на оба дома (доњи дом и горњи дом, где је то релевантно). Број чланова парламента обухвата предсједника/предсједавајућег/лидера парламента.
5-50-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности и циљу одрживог развоја 8 о достојанственом раду и економском расту, који су уграђени у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 5.5.1 „Удио жена у националним парламентима и локалним самоуправама“.
5-50-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-50-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 50.
5-60-title: Позиције које заузимају жене на вишим руководећим позицијама
5-60-definition: >-
  Индикатор мјри удио жена чланова одбора и руководилаца у највећим компанијама које котирају на берзи.
5-60-intention: >-
  Обухват података 2003 – 2023. Јавно котирано значи да се акцијама друштва тргује на берзи. „Највећим“ компанијама сматрају се чланови (макс. 50) примарног blue-chip индекса, који је индекс који одржава берза и који покрива највеће компаније према тржишној капитализацији и/или тржишној трговини. Рачунају се само компаније које су регистроване у дотичној земљи. Чланови одбора покривају све чланове највишег органа одлучивања у свакој компанији (тј. председника, неизвршне директоре, више руководиоце и представнике запослених, где су присутни). Руководиоци се односе на више руководиоце у два највиша органа одлучивања највећих (макс. 50) национално регистрованих компанија које котирају на националној берзи.
5-60-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак
5-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 50.
6-20-title: Становништво повезано на најмање секундарни третман отпадних вода
6-20-definition: >-
  Индикатор мјери проценат становништва повезан са системима за пречишћавање отпадних вода са најмање секундарним пречишћавањем. На тај начин, отпадне воде из урбаних или других извора се пречишћавају процесом који генерално укључује биолошко пречишћавање са секундарним насељем или другим процесом који уклања органски материјал и смањује његову биохемијску потребу за кисеоником (БПК) за најмање 70% и хемијску потребу за кисеоником (КПК) за најмање 75%
6-20-intention: >-
  Индикатор  се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбједност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном СДГ индикатору 6.3.1 „Удио безбједно пречишћених отпадних вода“.
6-20-methodology: >-
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ, што је потврђено у предложеном 8. Акционом програму за животну средину. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Политика ЕУ у области здравља и безбједности хране такође доприноси високим стандардима у погледу воде и санитарних услова у смислу спрјечавања ширења заразних болести. Директива о пречишћавању комуналних отпадних вода регулише сакупљање, пречишћавање и испуштање комуналних и индустријских отпадних вода.
6-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 100.
6-30-title: Биохемијске потребе за кисеоником у ријекама
6-30-definition: >-
  Биохемијска потрошња кисеоника (БПК) се користи за мјерење квалитета воде. Односи се на количину кисеоника потребну аеробним микроорганизмима за разградњу органских супстанци у узорку воде у периоду од пет дана у мраку на 20°Ц (БПК5), мјерено у милиграмима по литру (мг О2/Л) и пондерисано бројем мјерних станица. Високе вредности БПК5 су обично знак органског загађења, што утиче на квалитет воде. Најчишће реке имају вриједности БПК5 мање од 1 мг О2/Л, умјерено и јако загађене ријеке показују вриједности у распону од 2 до 8 мг О2/Л.
6-30-intention: >-
  Индикатор  се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбједност хране, вода и природа“. Овај индикатор се може сматрати сличним глобалном индикатору циљева одрживог развоја 6.3.2 „Удио водних тјела са добрим квалитетом воде у околини“.
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Оквирна директива о водама је главно европско законодавство које има за циљ спречавање загађења воде, а Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтјевајући од држава чланица да обнове слатководне екосистеме.
6-30-methodology: >-
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-30-long_term_objective: >-
  Дугорочни циљ за биохемијску потражњу за кисеоником (БПК) у ријекама је постизање вриједности од 1 мг О2/Л. Овај циљ је дио циља одрживог развоја ЕУ и има за циљ обнову слатководних екосистема и обезбјеђивање окружења без токсичности.
6-40-title: Нитрати у подземним водама
6-40-definition: >-
  Овај индикатор приказује концентрације нитрата (НО3) у тјелима подземних вода мјерене као милиграми по литру (мг НО3/Л). Индикатор се може користити за илустрацију географских варијација у тренутним концентрацијама и временским трендовима. Велики уноси азота у водна тјела из урбаних подручја, индустрије и пољопривредних подручја, могу имати негативан утицај на коришћење воде за људску потрошњу и друге намјене.
6-40-intention: >-
  Индикатор  се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбједност хране, вода и природа“. 
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Према Директиви о води за пиће, дозвољена је максимална концентрација од 50 мг/Л нитрата у подземним водама које се користе за воду за пиће. Директива о нитратима захтева одређивање осетљивих зона на основу овог прага за све воде, укључујући подземне воде.
6-40-methodology: >-
  Оквирна директива о водама је главно европско законодавство које има за циљ спречавање загађења воде. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-40-long_term_objective: >-
  Дугорочни циљ је смањење нивоа нитрата испод утврђеног максималног нивоа загађивача (MCL)) од 10 мг/Л (као N, азот) или 45 мг/Л (као NО3−).
6-50-title: Фосфат у ријекама
6-50-definition: >-
  Овај индикатор мјери концентрацију фосфата (ПО4) по литру у раствореној фази из узорака воде из ријечних станица и агрегирано на годишње просјечне вриједности. У високим концентрацијама фосфат може изазвати проблеме са квалитетом воде, као што је еутрофикација, покретањем раста водених биљака, укључујући алге. Индикатор се може користити за илустрацију географских варијација у тренутним концентрацијама и временским трендовима.
6-50-intention: >-
  користи се за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“.
  Индикатор се може сматрати дјелом глобалног СДГ индикатора 6.3.2 „Удио водних тјела са добрим квалитетом амбијенталне воде“.
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Оквирна директива о водама је главно европско законодавство које има за циљ спречавање загађења воде. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
6-50-methodology: >-
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-60-title: Индекс експлоатације воде, плус (WEI+)
6-60-definition: >-
  Индекс експлоатације воде (WЕИ+) даје мјеру укупне потрошње воде као проценат обновљивих слатководних ресурса доступних за дату територију и период. Он квантификује колико се воде захвата и колико се вода враћа у животну средину од стране економских сектора прије или послије употребе. Разлика између захватања воде и враћања воде сматра се „потрошњом воде“. У одсуству договорених формалних циљева широм Европе, вриједности изнад 20% се генерално сматрају знаком несташице воде, док вриједности једнаке или веће од 40% указују на ситуације озбиљне несташице воде, што значи да је коришћење слатководних ресурса неодрживо.
6-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“. 
  Индикатор производи ЕЕА на основу података из базе података WISE SoE-Water quantity database (WISE 3) и других отворених извора (Евростат, ОЕЦД), укључујући методе попуњавања празнина.
  Индикатор се може сматрати глобалним СДГ индикатором 6.4.2 „Ниво водног стреса: повлачење слатке воде као пропорција доступних слатководних ресурса“.
  Оквирна директива о водама је главно европско законодавство које има за циљ - између осталог - промовисање одрживог коришћења воде на основу дугорочне заштите доступних водних ресурса. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
6-60-methodology: >-
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-60-long_term_objective: >-
  Дугорочни циљ за индикатор СДГ_06_60 је да се обезбједи доступност и одрживо управљање водом и канализацијом за све. То укључује постизање универзалног приступа безбједној и приступачној води за пиће, санитаријама и хигијени, као и побољшање квалитета воде и одрживо управљање водним ресурсима. Индикатор је дио циљева одрживог развоја ЕУ и користи се за праћење напретка ка овим циљевима
6-70-title: Пестициди у ријекама
6-70-definition: >-
  Овај индикатор мери удео пријављених водних тела са пестицидима који прелазе прагове на основу Стандарда квалитета животне средине (СКЕ) за токсичност мерених пестицида. Пестициди укључују и активне супстанце из средстава за заштиту биља и биоцида, као и њихове релевантне метаболите, чиме се одражавају супстанце које су стварно присутне у води и утичу на водени свет. Укључене су само супстанце са дефинисаним СКЕ.
6-70-intention: >-
  Овај индикатор се може сматрати сличним глобалном индикатору циљева одрживог развоја 6.3.2 „Удео водних тела са добрим квалитетом воде у околини“.
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац политике ЕУ у области заштите животне средине. Политика ЕУ у области вода пружа оквир за свеобухватно решавање заштите вода и за постизање доброг статуса унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Оквирна директива о водама је главни европски закон који има за циљ спречавање загађења воде, а Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама тако што захтева од држава чланица да обнове слатководне екосистеме.
6-70-methodology: >-
  Осми акциони програм за животну средину утврђује агенду политике заштите животне средине за период од 2021. до 2030. године и експлицитно помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) тежња ка циљу нултог загађења за животну средину без токсичних материја, укључујући ваздух, воду и земљиште, и заштита здравља и благостања грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шумских, слатководних, мочварних и морских екосистема.
7-10-title: "Примарна и финална потрошња енергије"
7-10-definition: >-
  Индикатор мјери укупне енергетске потребе једне земље, искључујући сву употребу енергената који нису енергетски производи (нпр. природни гас који се не користи за сагоревање већ за производњу хемикалија).
  „Потрошња примарне енергије“ обухвата потрошњу енергије од стране крајњих корисника као што су индустрија, саобраћај, домаћинства, услуге и пољопривреда, плус потрошњу енергије самог енергетског сектора за производњу и трансформацију енергије, губитке који се јављају током трансформације енергије (нпр. ефикасност производње електричне енергије из запаљивих горива) и губитке преноса и дистрибуције енергије.
7-10-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  ЕУ спроводи међусобно повезан скуп мера "Fit for 55" за постизање нових климатских циљева за 2030. годину и пратила је нови стратешки план REPowerEU за смањење зависности ЕУ од увоза енергије.
7-10-methodology: >-
  Европски зелени договор укључује енергетску ефикасност као кључну мјеру за смањење међусекторских емисија гасова са ефектом стаклене баште. Директиве о енергетској ефикасности и обновљивој енергији постављају амбициозне циљеве ЕУ које треба постићи до 2030. године.
7-20-title: "Коначна потрошња енергије у домаћинствима по глави становника"
7-20-definition: >-
  Индикатор мјери колико енергије сваки грађанин троши код куће искључујући енергију која се користи за транспорт. Пошто се индикатор односи на финалну потрошњу енергије, узима се у обзир само енергија коју користе крајњи потрошачи. Искључена је повезана потрошња самог енергетског сектора.
7-20-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
7-20-methodology: >-
  Циљ одрживог развоја 7 позива на обезбјеђивање универзалног приступа савременим енергетским услугама, побољшање енергетске ефикасности и повећање удјела обновљиве енергије. Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. Домаћинства чине око четвртину финалне потрошње енергије. Код куће људи користе електричну енергију и горива, посебно за гријање, хлађење, топлу воду, освјетљење и уређаје
7-30-title: Енергетска продуктивност
7-30-definition: >-
  Индикатор мјери количину економске производње која се производи по јединици бруто расположиве енергије. Бруто расположива енергија представља количину енергената неопходну за задовољење свих потреба субјеката у разматраном географском подручју. Економски учинак је дат или у јединици евра у ланчано повезаним обимима за референтну 2010. годину по девизном курсу из 2010. године или у јединици ППС (стандард куповне моћи).
7-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 7 о приступачној и чистој енергији и циљу одрживог развоја 12 о обезбјеђивању одрживих образаца потрошње и производње.
  Овај индикаторсе може сматрати сличним глобалном индикатору циљева одрживог развоја 7.3.1 „Енергетски интензитет мјерен у смислу примарне енергије и БДП-а“.
  Повећање енергетске продуктивности, односно раздвајање економског раста од потрошње енергије, кључно је за постизање циља одрживог развоја 7 без наношења штете економском развоју.
7-30-methodology: >-
  СДГ 7 је уграђен у приоритете Европске комисије под називом „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Циљ одрживог развоја 7 позива на обезбјеђивање универзалног приступа савременим енергетским услугама, побољшање енергетске ефикасности и повећање удјела обновљиве енергије. Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. Циљ одрживог развоја 12 позива на свеобухватан скуп акција предузећа, креатора политика, истраживача и потрошача да се прилагоде одрживим праксама. Предвиђа одрживу производњу и потрошњу засновану на напредним технолошким капацитетима, ефикасности ресурса и смањењу глобалног отпада.
7-40-title: "Удио обновљиве енергије у укупној коначној потрошњи енергије"
7-40-definition: >-
  Индикатор мјери удио потрошње обновљивих извора енергије у бруто финалној потрошњи енергије према Директиви о обновљивим изворима енергије. Бруто финална потрошња енергије је енергија коју користе крајњи потрошачи (финална потрошња енергије) плус губици мреже и сопствена потрошња електрана.
7-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 7 о приступачној и чистој енергији и циљу одрживог развоја 13 о климатским акцијама; који су респективно уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Одржавање нашег квалитета живота: безбједност хране, вода и природе“.
  Индикатор се може сматрати идентичним глобалном СДГ индикатору 7.2.1 „Удио обновљиве енергије у укупној финалној потрошњи енергије“.
7-40-methodology: >-
  ЕУ спроводи међусобно повезани скуп мјера "Fit for 55" како би достигла нове климатске циљеве за 2030. годину и пратила је нови стратешки план REPowerEU за смањење зависности ЕУ од увоза енергије. Европски зелени план предвиђа декарбонизацију енергетских система Европе како би се постигла климатска неутралност до 2050. године. У том циљу, ЕУ ће се окренути ка потпуно интегрисаном, међусобно повезаном и дигитализованом систему обновљивих извора енергије, истовремено обезбјеђујући сигурност снабдјевања по приступачним цијенама. Штавише, фондови кохезионе политике ЕУ (2021–2027), укључујући план опоравка „Неxт Генератион ЕУ“, обезбеђују финансирање инвестиција у обновљиве изворе енергије. Ревидиране Директиве о обновљивим изворима енергије постављају амбициозан циљ ЕУ који треба постићи до 2030. године.
7-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 50.
7-50-title: "Завиност од увоза енергије"
7-50-definition: >-
  Индикатор показује удио укупних енергетских потреба једне земље покривених увозом из других земаља. Израчунава се као нето увоз подељен са бруто расположивом енергијом. Енергетска зависност = (увоз – извоз) / бруто расположива енергија.
7-50-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. Енергетска зависност од увоза енергената излаже европску економију нестабилним цијенама на светском тржишту и ризику од несташице снабдјевања, на примјер, због геополитичких сукоба. Ризици се повећавају зависно од појединачних земаља, нпр. одређених инфраструктуром снабдјевања.
7-50-methodology: >-
  Постоји неколико релевантних политика ЕУ за овај индикатор. Стратегија енергетске безбједности наводи потребу за унапређењем домаће производње енергије, укључујући потребу за повећањем локалне производње обновљиве енергије, енергетске ефикасности и обезбјеђивањем недостајуће инфраструктуре. Штавише, фондови кохезионе политике ЕУ (2021–2027), укључујући план опоравка ‘Next Generation EU’, обезбјеђују финансирање инвестиција у обновљиве изворе енергије. REPowerEU је нови стратешки план за смањење зависности ЕУ од увоза енергије, посебно из Русије, због несигурности и високих цијена након руске инвазије на Украјину. Директиве о енергетској ефикасности и обновљивој енергији постављају амбициозне циљеве ЕУ које треба постићи до 2030. године.
7-60-title: "Популација која није у могућности да обезбиједи адекватно загријaвање дома"
7-60-definition: >-
  Индикатор мјери удио становништва које није у стању да приушти адекватно гријање дома. Подаци за овај индикатор прикупљају се у оквиру Статистике Европске уније о приходима и условима живота (ЕУ-СИЛЦ) за праћење развоја сиромаштва и социјалне инклузије у ЕУ. Прикупљање података се заснива на анкети, што значи да се вриједности индикатора самостално пријављују.
7-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. 
  Европски стуб социјалних права наводи енергију међу основним услугама којима би сви требало да имају приступ. Са Опсерваторијом ЕУ за енергетско сиромаштво, ЕУ настоји да помогне државама чланицама у њиховим напорима да смање енергетско сиромаштво и обезбједе приступ приступачној енергији.
7-60-methodology: >-
  Акциони план за приступачну енергију предлаже мјере за стабилизацију цијена енергије, обезбјеђивање сигурности снабдјевања и покретање енергетске транзиције. Европски стуб социјалних права наводи енергију међу основним услугама којима би сви требало да имају приступ. Европски економски и социјални комитет (EESC) процјењује његово стање. Савјетодавни центар ЕУ за енергетско сиромаштво је иницијатива која пружа централну платформу експертизе о енергетском сиромаштву за локалне власти и друге заинтересоване стране.
7-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0.
8-10-title: БДП по глави становника
8-10-definition: >-
  Индикатор се израчунава као однос реалног БДП-а (БДП прилагођен инфлацији) и просјечног становништва одређене године, где се БДП изражава у милионима, а становништво у хиљадама. Реални БДП се објављује без децимала.
8-10-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати идентичним глобалном показатељу СДГ 8.1.1 „Годишња стопа раста реалног БДП-а по глави становника“.
8-10-methodology: >-
  БДП мјери вриједност укупне коначне производње добара и услуга које је произвела привреда у одређеном временском периоду. Укључује робу и услуге које имају тржишта (или које би могле имати тржишта) и производе које производе општа држава и непрофитне институције. То је мјера економске активности и обично се користи као замјена за развој материјалног животног стандарда земље. Међутим, то није потпуна мјера економског благостања. На пример, БДП не укључује већину неплаћених послова у домаћинству. БДП такође не узима у обзир негативне ефекте економске активности, као што је деградација животне средине.
8-10-long_term_objective: >-
  Дугорочни циљ Индикатора је јачање капацитета домаћих финансијских институција да подстакну и прошире приступ банкарским, осигуравајућим и финансијским услугама за све.
8-11-title: Удио инвестиција у БДП-у
8-11-definition: >-
  Индикатор се израчунава као однос реалног БДП-а (БДП прилагођен инфлацији) и просјечног становништва одређене године, где се БДП изражава у милионима, а становништво у хиљадама. Реални БДП се објављује без децимала.
8-11-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати идентичним глобалном показатељу СДГ 8.1.1 „Годишња стопа раста реалног БДП-а по глави становника“.
8-11-methodology: >-
  БДП мјери вриједност укупне коначне производње добара и услуга које је произвела привреда у одређеном временском периоду. Укључује робу и услуге које имају тржишта (или које би могле имати тржишта) и производе које производе општа држава и непрофитне институције. То је мјера економске активности и обично се користи као замјена за развој материјалног животног стандарда земље. Међутим, то није потпуна мјера економског благостања. На пример, БДП не укључује већину неплаћених послова у домаћинству. БДП такође не узима у обзир негативне ефекте економске активности, као што је деградација животне средине.
8-11-long_term_objective: >-
  Дугорочни циљ за индикатор СДГ_08_11 је мјерење учешћа инвестиција у БДП-у.
8-20-title: Млади који нису запослени и нису у образовању или обуци
8-20-definition: >-
  Индикатор мјери удио становништва старости од 15 до 29 година које није запослено и није укључено у образовање или обуку.
  Бројилац индикатора односи се на лица која испуњавају сљедећа два услова: (а) нису запослена (тј. незапослена или ван радне снаге према дефиницији Међународне организације рада) и (б) нису стекла никакво образовање или обуку (тј. ни формално ни неформално) у четири недеље које претходе Анкети о радној снази (Анкета о радној снази).
8-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту и циљу одрживог развоја 4 о обезбјеђивању инклузивног и квалитетног образовања за све, који су уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Овај индикатор се може сматрати идентичним глобалном индикатору СДГ 8.6.1 „Удио младих (старости 15-24 године) који нису у образовању, запошљавању или обуци“. Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
8-20-methodology: >-
  Европски стуб социјалних права, који су заједнички прогласили Европска комисија, Европски парламент и Европски савјет 2017. године, утврђује 20 кључних принципа и права неопходних за праведна и добро функционишућа тржишта рада и системе социјалне заштите. Европски акциони план за стуб социјалних права, усвојен 2021. године, претвара принципе у конкретне акције у корист грађана. Такође предлаже амбициозан циљ запошљавања од 78% становништва старости од 20 до 64 године који ЕУ треба да достигне до 2030. године. У прилог томе, Акциони план предлаже да се до 2030. године преполови јаз у запослености међу половима у поређењу са 2019. годином и да се до 2030. године смањи стопа младих који нису запослени нити у образовању или обуци (NEET) узраста од 15 до 29 до 9%.
8-20-long_term_objective: >-
  Дугорочни циљ за индикатор 0 је да се осигура да 8% становништва старости од 15 до 29 година није запослено нити укључено у образовање или обуку.
8-30-title: Стопа запослености
8-30-definition: >-
  Индикатор мјери удио становништва старости од 20 до 64 године које је запослено. Запослена лица су дефинисана као лица која су током референтне недеље радила најмање један сат за плату или профит или нису радила, али су имала послове са којих су била привремено одсутна.
8-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“. СДГ 8 позива, између осталог, на пружање могућности за пуно и продуктивно запошљавање и пристојан рад за све.
  Запошљавање и друга питања везана за тржиште рада су у средишту социјалне и политичке дебате у ЕУ. Плаћено запослење је кључно за обезбеђивање довољног животног стандарда и пружа неопходну основу људима да остваре своје личне циљеве и тежње. Штавише, запошљавање доприноси економским перформансама, квалитету живота и социјалној инклузији, чинећи га каменом темељцем друштвено-економског развоја и благостања.
8-30-methodology: >-
  Европски стуб социјалних права утврђује 20 кључних принципа и права од суштинског значаја за праведна и функционална тржишта рада и системе социјалне заштите. Европски акциони план за стуб социјалних права, усвојен 2021. године, претвара принципе у конкретне акције у корист грађана. Такође предлаже амбициозан циљ запошљавања од 78% становништва старости од 20 до 64 године који ЕУ треба да достигне до 2030. године. У прилог томе, Акциони план предлаже да се до 2030. године преполови јаз у запослености међу половима у поређењу са 2019. годином и да се до 2030. године смањи стопа младих који нису запослени нити у образовању или обуци (NEET) узраста од 15 до 29 до 9%.
8-40-title: Стопа дуготрајне незапослености
8-40-definition: >-
  Индикатор мјери удио становништва у радној снази узраста од 15 до 74 године које је незапослено 12 мјесеци или дуже. Становништво у радној снази су они који су или запослени или незапослени. Незапослена лица су дефинисана као лица старости 15-74 године која су била без посла током референтне недеље, тренутно су била доступна за почетак рада у наредне две недеље и или су активно тражила посао у последње четири недеље или су већ пронашла посао за почетак рада у наредна три мјесеца. Период незапослености се дефинише као трајање тражења посла, или као дужина времена од када је посљедњи посао задржан (ако је краће од времена проведеног на тражењу посла).
8-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
  Европски стуб социјалних права поставља низ кључних принципа и права за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Служи као компас за обновљени процес конвергенције ка бољим условима рада и живота међу државама чланицама учесницама. Првенствено је замишљен за еврозону, али је применљив на све државе чланице које желе да учествују. Приступ активног укључивања је препорука Комисије да се сваком грађанину, посебно онима у најнеповољнијем положају, омогући да у потпуности учествује у друштву, укључујући и запослење.
8-40-methodology: >-
  Европски стуб социјалних права утврђује 20 кључних принципа и права од суштинског значаја за праведна и функционална тржишта рада и системе социјалне заштите. Европски акциони план за стуб социјалних права, усвојен 2021. године, претвара принципе у конкретне акције у корист грађана. Такође предлаже амбициозан циљ запошљавања од 78% становништва старости од 20 до 64 године који ЕУ треба да достигне до 2030. године. У прилог томе, Акциони план предлаже да се до 2030. године преполови јаз у запослености међу половима у поређењу са 2019. годином и да се до 2030. године смањи стопа младих који нису запослени нити у образовању или обуци (NEET) узраста од 15 до 29 до 9%.
8-60-title: Смртоноснe несрећe на раду на 100 000 радника
8-60-definition: >-
  Индикатор мјери број несрећа са смртним исходом које се дешавају у току рада и доводе до смрти жртве у року од годину дана од настанка несреће. Стопа инциденције се односи на број несрећа са смртним исходом на 100 000 запослених.
8-60-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту и циљу одрживог развоја 3 о добром здрављу и добробити.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 8.8.1 „Повреде на раду са смртним исходом и без смртног исхода на 100.000 радника, према полу и мигрантском статусу“.
8-60-methodology: >-
  Национални извори „Европске статистике о незгодама на раду (ESAW)“ су изјаве послодаваца о незгодама на раду, било релевантним осигуравајућим друштвима, националном систему социјалног осигурања, инспекцијама рада или сличним националним органима.
  Директива о транспарентним и предвидивим условима рада у Европској унији поставља минималне стандарде о условима рада. Стратешки оквир ЕУ за здравље и безбједност на раду 2021-2027. године утврђује кључне приоритете за побољшање здравља и безбједности радника.
8-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
9-10-title: Бруто домаћа потрошња за истраживање и развој
9-10-definition: >-
  Индикатор мјери бруто домаће трошкове за истраживање и развој (ГЕРБ) као проценат бруто домаћег производа (БДП) — који се назива и интензитет истраживања и развоја. Приручник ОЕЦД-а Фрасцати: Смјернице за прикупљање и извјештавање о подацима о истраживању и експерименталном развоју дефинише истраживање и експериментални развој (Р&Д) као креативан и систематичан рад који се предузима у циљу повећања залиха знања — укључујући знање о човјечанству, култури и друштву — и осмишљавања нових примјена доступног знања.
9-10-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација које су уграђене у приоритете Европске комисије 2024-2029 у оквиру „Нове ере за европску одбрану и безбједност“.
  Индикатор се може сматрати идентичним глобалном индикатору СДГ 9.5.1 „Издаци за истраживање и развој као пропорција БДП-а“.
9-10-methodology: >-
  Нова визија Европског истраживачког простора (ERA) има за циљ изградњу заједничког научног и технолошког простора за ЕУ, давањем приоритета инвестицијама и реформама, побољшањем приступа изврсности, превођењем резултата истраживања и иновација у економију и продубљивањем ERA. ЕУ има дугогодишњи циљ да повећа свој интензитет истраживања и развоја на 3% БДП-а, што је потврђено у Препоруци Савјета о Пакту за истраживање и иновације у Европи из новембра 2021. године.
9-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 3.3
9-30-title: Особље за истраживање и развој
9-30-definition: >-
  Индикатор мјери удио особља за истраживање и развој у следећим институционалним секторима: пословном предузећу (БЕС), влади (ГОВ), високом образовању (ХЕС) и приватној непрофитној организацији (ПНП). Подаци су приказани у еквивалентима пуног радног времена као удио радне снаге.
9-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација које су уграђене у приоритете Европске комисије 2024-2029 у оквиру „Нове ере за европску одбрану и безбједност“.
  Индикатор се може сматрати сличним глобалном СДГ индикатору 9.5.2 "Истраживачи (у еквиваленту пуног радног времена) на милион становника"
9-30-methodology: >-
  Истраживање и развој и иновације су главни покретачи конкурентности и запошљавања у економији заснованој на знању. Већа улагања у истраживање и развој обезбјеђују нова радна места у бизнису и академској заједници, повећавајући потражњу за научницима и истраживачима на тржишту рада.
9-30-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 2.
9-40-title: Пријаве патената Европском патентном бироу
9-40-definition: >-
  Овај индикатор мјери захтјеве за заштиту проналаска који су поднијети Европском заводу за патенте (ЕПО) без обзира на то да ли су одобрени или не. Пријаве се додељују према земљи пребивалишта првог подносиоца пријаве наведеног на обрасцу пријаве (принцип првоименованог подносиоца пријаве), као и према земљи пребивалишта проналазача.
  Подаци показују укупан број пријава по земљи и на милион становника (користећи просјечно становништво референтне године као именилац).
9-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација које су уграђене у приоритете Европске комисије 2024-2029 у оквиру „Нове ере за европску одбрану и безбједност“.
  Захтеви за заштиту проналаска упућени или директно Европском заводу за патенте (ЕПО) или поднети у складу са Уговором о сарадњи на пољу патената и којима се именује ЕПО (Еуро-ПЦТ), без обзира на то да ли су одобрени или не. Пријаве патената се додјељују према земљи пребивалишта подносиоца пријаве наведеној на обрасцу пријаве. У случајевима када се на обрасцу пријаве помиње више подносилаца захтева, примењује се земља пребивалишта првог наведеног подносиоца захтјева. Земља пребивалишта (првог) подносиоца захтева не мора нужно бити иста као и земља пребивалишта проналазача.
9-40-methodology: >-
  Патенти одражавају инвентивну активност земље. Патенти такође показују способност земаља и њихових предузећа да искористе знање и резултате истраживања и претворе их у потенцијалне економске користи. У том контексту, индикатори засновани на статистици патената пружају драгоцјену мјеру инвентивног учинка земаља.
9-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 240.
9-50-title: Удио аутобуса и возова у унутрашњем путничком превозу
9-50-definition: >-
  Овај индикатор мјери удио аутобуса, укључујући аутобусе и тролејбусе, и возова у унутрашњем путничком саобраћају, изражен у путничким километрима (пкм). Путнички превоз овде обухвата превоз путничким аутомобилима, аутобусима и вагонима и возовима, али не укључује унутрашње пловне путеве, ваздушни и поморски превоз. Сви подаци се заснивају на кретањима унутар националних територија, без обзира на националност возила. Подаци о путевима потичу из добровољног прикупљања и нису у потпуности усклађени на нивоу ЕУ. Системи трамваја и метроа нису укључени јер методологија прикупљања података за ова превозна средства није довољно усклађена између држава чланица.
9-50-intention: >-
  Индикатори који се користе за праћење напретка ка циљу одрживог развоја 9 о изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација и ка циљу одрживог развоја 11 о стварању градова и људских насеља инклузивним, безбедним, отпорним и одрживим, који су уграђени у приоритете Европске комисије 2024-2029. године у оквиру „Нове ере за европску одбрану и безбједност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: Безбједност хране, вода и природа“ и „Заштита наше демократије, очување наших вриједности“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 9.1.2 „Количине путника и терета, према начину превоза“.
9-50-methodology: >-
  Преиспитивање будуће мобилности укључује оптимизацију коришћења свих видова превоза, дијељење аутомобила и мултимодалну интеграцију између различитих видова колективног превоза као што су воз, трамвај, метро, аутобус и такси.
  Комисија је 2020. године усвојила „Стратегију одрживе и паметне мобилности“ заједно са Акционим планом од 82 иницијативе. Ова стратегија поставља темеље за то како транспортни систем ЕУ може да оствари своју зелену и дигиталну трансформацију и постане отпорнији на будуће кризе. Као што је наведено у Европском зеленом договору, циљ ће бити смањење емисија од 90% до 2050. године, које ће се остварити паметним, конкурентним, безбједним, приступачним и приступачним транспортним системом.
9-60-title: Удио жељезнице и унутрашњих пловних путева у превозу робе унутар земље
9-60-definition: >-
  Овај индикатор мјери удио жељезнице и унутрашњих пловних путева у унутрашњем теретном саобраћају, изражен у тонским километрима (ткм).
  Унутрашњи теретни саобраћај обухвата друмски, железнички и унутрашњи пловни пут. Сви подаци се заснивају на кретању на националној територији; жељезнички и унутрашњи пловни путеви се прикупљају на основу кретања на националној територији, без обзира на националност воза или пловила.
  Дјелатност друмског превоза се прикупља према земљи регистрације возила, без обзира на територију на којој се обавља дјелатност. Активност се прерасподјељује на територију на којој се активност заправо обавља моделирањем вјероватног итинерера путовања на европској путној мрежи. Тренутно није укључен ни поморски ни ваздушни теретни саобраћај.
9-60-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација које су уграђене у приоритете Европске комисије 2024-2029 у оквиру „Нове ере за европску одбрану и безбједност“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 9.1.2 „Количине путника и терета, према начину превоза“.
9-60-methodology: >-
  Иако је слободно кретање робе суштинска компонента унутрашњег тржишта ЕУ и важно за одржавање конкурентности европске индустрије и услуга, транспорт треба организовати на еколошки прихватљив начин.
  Ова стратегија поставља темеље за то како транспортни систем ЕУ може да оствари своју зелену и дигиталну трансформацију и постане отпорнији на будуће кризе. Као што је наведено у Европском зеленом договору, циљ ће бити смањење емисија од 90% до 2050. године, које ће се остварити паметним, конкурентним, безбједним, приступачним и приступачним транспортним системом.
9-70-title: Интензитет емисијa у ваздух у индустрији
9-70-definition: >-
  Овај индикатор мјери интензитет емисија честица (ПМ10 и ПМ2.5) из производног сектора (НАЦЕ Рев. 2 сектор „Ц“). Емисије у ваздух се дефинишу као токови гасовитих и честица материјала који се емитују у атмосферу. 
  Ситне и крупне честице (ПМ10) су мање од 10 микрометара у пречнику и могу се пренијети дубоко у плућа, где могу изазвати упалу и погоршати стање људи који пате од болести срца и плућа. Фине честице (ПМ2,5) су пречника мањег од 2,5 микрометара и стога су подскуп честица ПМ10. Њихови негативни утицаји на здравље су озбиљнији од ПМ10 јер се могу увући даље у плућа и могу бити токсичнији. 
  Интензитет емисије се израчунава тако што се емисије ПМ сектора подјеле са његовом бруто додатом вриједношћу (БДВ), која се дефинише као производња (у основним цјенама) умањена за средњу потрошњу (у куповним цјенама)
9-70-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у области индустрије, иновација и инфраструктуре, који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Нова ера за европску одбрану и безбједност“.
9-70-methodology: >-
  СДГ 9 препознаје значај технолошког напретка и иновација за проналажење трајних решења за друштвене, економске и еколошке изазове као што су отварање нових радних мјеста и промоција ресурсне и енергетске ефикасности. Да би се подстакле иновације и предузетништво, СДГ 9 такође настоји да повећа приступ финансијским услугама за мала предузећа и да премости дигитални јаз повећањем приступа информационим и комуникационим технологијама.
  Са својим Чистим индустријским договором из фебруара 2025. године, Европска комисија износи конкретне акције за претварање декарбонизације у покретач раста европских индустрија. То укључује снижавање цјена енергије, стварање квалитетних радних мјеста и праве услове за напредак компанија.
9-70-long_term_objective: >-
  Дугорочни циљ индикатора је мјерење напретка ка циљу обезбјеђивања здравог живота и промовисања благостања за све у свим узрастима.
10-10-title: Разлике у БДП-у по становнику
10-10-definition: >-
  Бруто домаћи производ (БДП) је мјера за привредну активност. Односи се на вриједност укупне производње робе и услуга које производи привреда, умањену за интермедијарну потрошњу, плус нето порезе на производе и увоз. БДП по становнику се израчунава као однос БДП-а и просјечног становништва у одређеној години. Основне цифре су изражене у стандардима куповне моћи (ППС), која представља заједничку валуту која елиминише разлике у нивоима цена између земаља како би се омогућило смислено поређење обима БДП-а.
10-10-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор се може сматрати идентичним глобалном индикатору СДГ 8.1.1 „Годишња стопа раста реалног БДП-а по глави становника“. Поред тога, индикатор је и индикатор утицаја за Стратешки план 2020-2024 који се односи на 10 приоритета Комисије.
10-10-methodology: >-
  Индикатор је такође релевантан у контексту недавно усвојеног Европског стуба за социјална права, који утврђује низ кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ти принципи се баве темама везаним за неједнакост, решавајући и неједнакост исхода (неједнакост прихода и богатства) и неједнакост могућности: од одређивања плата до система социјалне заштите (укључујући минимални доходак), родне равноправности, омогућавања социјалних услуга, бриге о деци и подршке деци, прихода од старости, здравствене заштите и приступа становању.
10-10-long_term_objective: >-
  Дугорочни циљ индикатора је да се постепено постигне и одржи раст прихода доњих 40 процената становништва по стопи већој од националног просјека до 2030. године.
10-20-title: Разлике у дохотку домаћинстава по становнику
10-20-definition: >-
  Индикатор одражава куповну моћ домаћинстава и њихову способност да улажу у добра и услуге или штеде за будућност, обрачунавањем пореза и социјалних доприноса и новчаних социјалних давања у натури. Израчунава се као кориговани бруто расположиви доходак домаћинстава и непрофитних институција које опслужују домаћинства (НПИСХ) подељен са паритетима куповне моћи (ППП) стварне индивидуалне потрошње домаћинстава и са укупном резидентном популацијом.
10-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 10 о смањењу неједнакости унутар и између земаља и циљу одрживог развоја 1 о искорењивању сиромаштва у свим његовим облицима свуда, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање наших друштава и нашег социјалног модела“.
10-20-methodology: >-
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права. Европски стуб за социјална права, усвојен 2017. године, поставља низ кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ти принципи се баве темама везаним за неједнакост, решавајући и неједнакост исхода (неједнакост прихода и богатства) и неједнакост могућности: од одређивања плата до система социјалне заштите (укључујући минимални доходак), родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
  Док се БДП по глави становника користи за мјерење економских перформанси земље, бруто расположиви доходак домаћинстава пружа индикацију просјечног материјалног благостања људи. Индикатор стога мјери да ли се државе чланице ЕУ конвергирају у смислу прихода људи.
10-30-title: Релативни медијан ризика од сиромаштва
10-30-definition: >-
  Индикатор се израчунава као растојање између медијане еквивалентног укупног нето прихода лица испод прага ризика од сиромаштва и самог прага ризика од сиромаштва, изражено као проценат прага ризика од сиромаштва. Овај праг је постављен на 60% националног медијана еквивалентног расположивог дохотка свих људи у земљи, а не за ЕУ у цјелини.
10-30-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
   Европски стуб социјалних права утврђује 20 кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ови принципи се баве темама везаним за неједнакост рјешавањем и неједнакости исхода и неједнакости могућности: од одређивања плата до система социјалне заштите, родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
10-30-methodology: >-
  Акциони план за европски стуб социјалних права претвара принципе европског стуба социјалних права у конкретне акције у корист грађана. Предлаже главне циљеве у вези са стопом запослености, учешћем одраслих у учењу и ризиком од сиромаштва и социјалне искључености које ЕУ треба да достигне до 2030. године.
  Европски семестар је кључни алат за спровођење Стуба и координира економске и фискалне политике држава чланица ЕУ. У оквиру свог Зеленог договора, Европска комисија је најавила да ће европски семестар бити преусмерен на интеграцију циљева одрживог развоја и стављање одрживости и добробити грађана у центар економске политике.
10-30-long_term_objective: >-
  СДГ 10 позива нације да прилагоде политике и законодавство како би повећале приход доњих 40% становништва и смањиле неједнакости на основу прихода, пола, старости, инвалидитета, расе, класе, етничке припадности, религије и могућности.
10-41-title: Неједнакост у дохотку - однос удjела петтина по дохотку
10-41-definition: >-
  Индикатор је мјера неједнакости расподјеле прихода. Израчунава се као однос укупних прихода које је примило 20% становништва са највишим приходима (горњи квинтил) и оних које је примило 20% становништва са најнижим приходима (доњи квинтил).
  Сви приходи се састављају као еквивалентни расположиви приходи.
10-41-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“. СДГ 10 позива нације да прилагоде политике и законодавство како би повећале приход доњих 40% становништва и смањиле неједнакости на основу прихода, пола, старости, инвалидитета, расе, класе, етничке припадности, религије и могућности.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
10-41-methodology: >-
  Један од циљева социјалних политика у ЕУ је смањење неједнакости пружањем једнаких могућности за све. Анализа неједнакости расподјеле прихода један је од начина мјерења неједнакости унутар земаља ЕУ. Као мјера неједнакости расподјеле дохотка унутар земље, индикатор допуњује показатеље о удјелу дохотка најнижих 40% и о ризику од јаза у сиромаштву.
10-50-title: Удио дохотка доњих 40% становништва
10-50-definition: >-
  Индикатор мјери удио прихода који је примило доњих 40% становништва. Коришћени концепт прихода је укупан расположиви доходак домаћинства.
10-50-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“. 
  Индикатор се може сматрати сличним глобалном Индикатору СДГ 10.1.1 „Стопе раста трошкова домаћинстава или прихода по глави становника међу доњих 40 процената становништва и укупног становништва“.
  Индикатор је релевантан за мјерење укупне промене животног стандарда оних са најнижим приходима током више година.
  Европски стуб социјалних права утврђује 20 кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ови принципи се баве темама везаним за неједнакост рјешавањем и неједнакости исхода и неједнакости могућности: од одређивања плата до система социјалне заштите, родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
10-50-methodology: >-
  Акциони план за европски стуб социјалних права претвара принципе европског стуба социјалних права у конкретне акције у корист грађана. Предлаже главне циљеве у вези са стопом запослености, учешћем одраслих у учењу и ризиком од сиромаштва и социјалне искључености које ЕУ треба да достигне до 2030. године.
  Европски семестар је кључни алат за спровођење Стуба и координира економске и фискалне политике држава чланица ЕУ. У оквиру свог Зеленог договора, Европска комисија је најавила да ће европски семестар бити преусмерен на интеграцију циљева одрживог развоја и стављање одрживости и добробити грађана у центар економске политике.
  Европски социјални фонд (ЕСФ) је главни инструмент ЕУ за улагање у људе од усвајања Римског уговора. Помаже у борби против неједнакости, како у смислу исхода тако и могућности, финансирањем акција у областима запошљавања, социјалне инклузије, образовања, обуке и реформи административних капацитета. Ревидирани Европски социјални фонд плус (ЕСФ+), са буџетом од 101 милијарде евра у оквиру Вишегодишњег финансијског оквира 2021–2027, додатно ће помоћи у смањењу неједнакости.
10-60-title: Захтjеви за азил
10-60-definition: >-
  Индикатор показује број подносилаца захтјева за азил по први пут на милион становника и број позитивних првостепених одлука на милион становника. Имајте на уму да је потребан опрез приликом поређења ове две вриједности, јер пријаве примљене у датој години можда неће бити обрађене до касније године.
10-60-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“. СДГ 10, између осталог, настоји да промовише социјалну инклузију на глобалном нивоу кроз олакшавање безбедне, уредне и регуларне миграције и смањење трансакционих трошкова дознака миграната.
  Центар знања Европске комисије за миграције и демографију пружа анализу знања и доказа за развој политика и одлуке у вези са спашавањем живота миграната и обезбеђивањем спољних граница, јачањем заједничке политике азила и развојем нове политике о законитој миграцији. Фонд за азил, миграције и интеграцију пружа финансијску подршку овим акцијама.
10-60-methodology: >-
  Фонд за европску помоћ најугроженијима (ФЕАД) пружа подршку тражиоцима азила пружајући им тренутну помоћ (храну, одјећу и друге неопходне предмете за личну употребу).
  Предложене Европске снаге солидарности омогућиће младима широм ЕУ да волонтирају у пружању помоћи за прихват и интеграцију избјеглица.
11-11-title: Стопа тешке стамбене депривације
11-11-definition: >-
  Стопа тешке стамбене депривације дефинише се као проценат становништва које живи у стамбеној јединици која се сматра пренасељеном и истовремено показује најмање једну од следећих мера стамбене депривације: i) кров који цури, ii) нема каде/туша и нема тоалета у затвореном простору, iii) сматра се превише мрачном.
11-11-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и ка Циљу одрживог развоја 1 о вишедимензионалном сиромаштву. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 1 је уграђен у приоритете Европске комисије „Подршка људима, јачање наших друштава и нашег социјалног модела“.
11-11-methodology: >-
  Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, превозу, зеленим јавним површинама и још много тога, уз побољшање коришћења ресурса и смањење утицаја на животну средину. Циљ одрживог развоја 1, између осталог, позива на искорењивање екстремног сиромаштва и смањење релативног сиромаштва и уграђен је у приоритете Европске комисије у оквиру „Економије која ради за људе“.
11-20-title: Становништво које живи у домаћинствима која трпе буку
11-20-definition: >-
  Индикатор мери удео становништва који пријављују да су погођени буком од комшија или са улице.
  Пошто је процена буке субјективна, треба напоменути да индикатор узима у обзир и нивое буке и стандарде људи о томе шта сматрају прихватљивим нивоима. Стога, повећање вредности индикатора не мора нужно указивати на слично повећање нивоа буке, већ на смањење нивоа које су европски грађани спремни да толеришу и обрнуто. У ствари, постоје емпиријски докази да перципирани квалитет животне средине од стране појединаца није увек у складу са стварним квалитетом животне средине процењеним коришћењем „објективних“ индикатора, посебно за буку.
11-20-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и Циљу одрживог развоја 3 о добром здрављу и благостању. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 3 је уграђен у приоритете Европске комисије „Подршка људима, јачање наших друштава и нашег социјалног модела“.
11-20-methodology: >-
  „Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, превозу, зеленим јавним површинама и још много тога, уз побољшање коришћења ресурса и смањење утицаја на животну средину. Циљ одрживог развоја 3 има за циљ да обезбеди здравље и благостање за све у свим узрастима побољшањем репродуктивног, мајчиног и дечијег здравља; окончањем епидемија главних заразних болести; смањењем незаразних и менталних болести. Такође позива на смањење фактора ризика за здравље понашања и животне средине.
  Директива о буци у животној средини је главни инструмент ЕУ за идентификацију и борбу против загађења буком. Фокусира се на три области деловања: одређивање изложености буци у животној средини; осигуравање да су информације о буци у животној средини и њеним утицајима доступне јавности; спречавање и смањење буке у животној средини где је то потребно, посебно тамо где нивои изложености могу изазвати негативне ефекте на људско здравље, и очување квалитета буке у животној средини где је добар.“
11-32-title: Индекс прекривања тла
11-32-definition: >-
  Овај индикатор мери покривеност површине тла непропусним материјалима, што указује на непропусност. Агрегација вредности непропусности са референтним јединицама, као што су урбана подручја, поплавна подручја, приобалне зоне или заштићена подручја, врши се коришћењем интегрисане платформе просторних података ЕЕА.
11-32-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег друштвеног модела“, „Одржавање квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, одржавање наших вредности“. Циљ одрживог развоја 15 је уграђен у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
11-32-methodology: >-
  „Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, транспорту, зеленим јавним површинама и још много тога, уз побољшање коришћења ресурса и смањење утицаја на животну средину. Циљ одрживог развоја 15 тежи заштити, обнови и промоцији очувања и одрживог коришћења копнених, унутрашњих водних и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање крчења шума, борбу против дезертификације, обнављање деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.“
11-32-long_term_objective: >-
  Стратегија за земљиште 2030 поставила је циљ нулте нето експлоатације земљишта до 2050. године.
11-40-title: Смртност у саобраћајним незгодама
11-40-definition: >-
  Индикатор мери број смртних случајева узрокованих саобраћајним незгодама, укључујући возаче и путнике моторних возила и бицикала, као и пешаке. Људи који погину у саобраћајним незгодама до 30 дана након што се незгода догодила рачунају се као смртни случајеви у саобраћајним незгодама.
11-40-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и Циљу одрживог развоја 3 о добром здрављу и благостању. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање квалитета живота: безбедност хране, воде и природе“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 3 је уграђен у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати сличним глобалном индикатору Циља одрживог развоја 3.6.1 „Стопа смртности услед повреда у саобраћају“.
11-40-methodology: >-
  Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, транспорту, зеленим јавним површинама и још много тога, уз истовремено побољшање коришћења ресурса и смањење утицаја на животну средину. Уз добро, о ризику свесно и паметно планирање и управљање, Циљ одрживог развоја 11 замишља градове као еколошки отпорна људска насеља која подстичу личну безбедност.
  Циљ одрживог развоја 3 има за циљ да обезбеди здравље и благостање за све у свим узрастима побољшањем репродуктивног, мајчиног и дечијег здравља; окончањем епидемија главних заразних болести; смањењем незаразних и менталних болести. Такође позива на смањење фактора ризика за здравље у понашању и животној средини.
  Стратешки акциони план безбедности на путевима и Оквир политике безбедности на путевима ЕУ 2021-2030. поставили су циљ смањења смртних случајева и тешких повреда за 50% до 2030. у поређењу са 2019. годином и амбициозне планове безбедности на путевима за постизање нулте смртности на путевима до 2050. („Визија нула“).
11-52-title: Преране смрти због изложености финим честицама (PM2.5)
11-52-definition: >-
  Овај индикатор процењује број превремених смртних случајева који се могу приписати дуготрајној изложености концентрацијама PM2.5 изнад 5µг/м3 (смернице СЗО). PM2.5 су честице чији је пречник мањи од 2,5 микрометара и које могу доспети дубоко у плућа где могу изазвати упалу и погоршати стање људи који пате од срчаних и плућних болести.
11-52-intention: >-
  Користи се за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и Циљу одрживог развоја 3 о добром здрављу и благостању. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 3 је уграђен у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“.
11-52-methodology: >-
  ЕУ се бави проблемом загађења ваздуха кроз своје специфичне законске прописе о квалитету ваздуха и индустријским емисијама, као што су Пакет за чист ваздух и директиве које су усвојили Савет и Европски парламент о квалитету амбијенталног ваздуха, као и кроз косвене користи од спровођења одређених климатских политика.
  Акциони план за нулто загађење ваздуха, воде и земљишта укључује циљ смањења утицаја загађења ваздуха на здравље за 55% до 2030. године, у поређењу са 2005. годином.
  Оквир за праћење 8. Акционог програма за животну средину користи број превремених смрти као кључни индикатор са циљем смањења броја трајних смртних случајева узрокованих PM2.5 за 55% до 2030. године, у поређењу са 2005. годином.
11-52-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност 5.
11-60-title: Стопа рециклирања комуналног отпада
11-60-definition: >-
  Индикатор мери количину рециклираног комуналног отпада подељену са укупном количином произведеног комуналног отпада. Рециклажа обухвата рециклажу материјала, компостирање, припрему за поновну употребу и анаеробну дигестију. Комунални отпад се углавном састоји од отпада који производе домаћинства, али може да укључује и сличан отпад који производе мала предузећа и јавне институције, а који сакупља општина. Овај други део комуналног отпада може да варира од општине до општине и од земље до земље, у зависности од локалног система управљања отпадом. За подручја која нису обухваћена системом сакупљања комуналног отпада, процењује се количина произведеног отпада.
11-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, што је уграђено у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, очување наших вредности“.
11-60-methodology: >-
  Акциони план за циркуларну економију из 2015. године подржава прелазак на јачу и циркуларнију економију. Директива (ЕУ) 2018/851 од 30. маја 2018. године поставила је нове, амбициозније правно обавезујуће циљеве за рециклажу и поновну употребу комуналног отпада. Земље ЕУ ће сада морати да рециклирају најмање 55% свог комуналног отпада до 2025. године, 60% до 2030. године и 65% до 2035. године. Предлог пакета за циркуларну економију из 2022. године за Директиву о амбалажи и амбалажном отпаду има за циљ смањење амбалажног отпада и повећање рециклаже.
11-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 62.
12-10-title: Потрошња опасних хемикалија
12-10-definition: >-
  Овај индикатор мери потрошњу токсичних хемикалија, изражену у милионима тона. Потрошња хемикалија се израчунава као збир производње (PRODCOM) и нето увоза хемикалија (COMEXT) према једначини: Потрошња = производња + увоз – извоз.
  Подаци о опасним и неопасним хемикалијама показују укупну потрошњу свих хемикалија. Две подкатегорије опасних хемикалија – опасне по људско здравље и опасне по животну средину – преклапају се по дефиницији и као резултат тога њихов збир није једнак укупној потрошњи опасних хемикалија.
12-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-10-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада.
  Оквир за регистрацију, евалуацију, одобравање и ограничавање хемикалија (REACH) има за циљ побољшање заштите људског здравља и животне средине кроз бољу идентификацију и управљање опасним хемикалијама. Оквир ће бити ажуриран, уз подршку Стратегије хемикалија за одрживост, која има за циљ побољшање заштите животне средине и нашег здравља од ризика које представљају хемикалије и подршку иновацијама за безбедне и одрживе хемикалије.
12-21-title: Материјални отисак
12-21-definition: >-
  Материјални отисак, такође познат као потрошња сировина (RMC), представља глобалну потражњу за екстракцијом материјала (минерала, металних руда, биомасе, фосилних енергетских материјала) вођену потрошњом робе и услуга унутар географског референтног подручја. Подаци о материјалном отиску долазе из рачуна токова материјала, који моделирају токове природних ресурса из животне средине у економију. Они укључују домаћу екстракцију материјала мерену у тонама бруто материјала (на пример, бруто руда или бруто жетва), као и увоз и извоз мерени у смислу процењених еквивалената сировина тргованих производа (домаћа и страна екстракција потребна за производњу тргованих производа). RMC стога показује количину екстракције потребну за производњу робе коју траже крајњи корисници у географском референтном подручју, без обзира где у свету се екстракција материјала одвијала.
12-21-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, воде и природе“.
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада.
  Циљ одрживог развоја 8, између осталог, позива на промоцију радних права и безбедног и сигурног радног окружења.
  Индикатор се може сматрати сличним глобалном индикатору Циљева одрживог развоја 8.4.1 и 12.2.1 за елемент „Материјални отисак“.
12-21-methodology: >-
  Осми акциони програм за животну средину (EAP), усвојен у марту 2022. године, има за циљ да убрза прелазак на климатски неутралну, ресурсно ефикасну и регенеративну економију, препознајући да људска добробит зависи од здравих екосистема. Његови приоритетни циљеви укључују постизање климатске неутралности до 2050. године и обнављање биодиверзитета.
  Акциони план за циркуларну економију, усвојен 2020. године, има за циљ да удвостручи стопу коришћења циркуларних материјала у ЕУ током наредне деценије како би се подржало постизање климатске неутралности до 2050. године, одвојио економски раст од коришћења ресурса и стварања отпада и одржао потрошњу ресурса у оквирима еколошких граница. У марту 2022. године, Европска комисија је усвојила пакет мера о циркуларној економији како би одрживи производи постали норма у ЕУ и неговали циркуларне пословне моделе.
12-31-title: Отисак потрошње
12-31-definition: >-
  Потрошачки отисак (КП) је модел процене животног циклуса (ЛЦА) који се користи за развој скупа од 16 индикатора животне средине ради процене утицаја образаца потрошње ЕУ и њених држава чланица на животну средину, а спроводи се комбиновањем података о интензитету потрошње са проценом утицаја репрезентативних производа на животну средину. Процена КП заснива се на комбинацији: (а) емисија у ваздух, земљиште и воду, као и ресурса који се користе током животног циклуса 164 репрезентативна производа, који припадају пет области потрошње (храна, мобилност, становање, кућни апарати и уређаји), (б) годишње потрошње (тј. интензитета потрошње) ових производа, израчунате из статистике потрошње, и (ц) методе процене утицаја еколошког отиска (ЕО), која претвара емисије и потрошњу ресурса у 16 потенцијалних утицаја на животну средину, који се могу објединити у један резултат, где је то прикладно. Индикатори утицаја ЕО могу се упоредити са скупом прагова заснованих на оквиру планетарних граница. Дакле, дати индикатор КП (на пример, климатске промене или еутрофикација мора) мери колико пута је утицај потрошње премашио повезану планетарну границу. Слично томе, индивидуални пондерисани CF резултат мери број пута када је пондерисана граница прекорачена.
12-31-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-31-methodology: >-
  Европска комисија је усвојила Акциони план за циркуларну економију (CEAP) у марту 2020. године. Прелазак ЕУ на циркуларну економију смањиће притисак на природне ресурсе и створити одрживи раст и радна места. Нови акциони план најављује иницијативе дуж целог животног циклуса производа. Он је усмерен на начин на који су производи дизајнирани, промовише процесе циркуларне економије, подстиче одрживу потрошњу и има за циљ да осигура да се спречи настанак отпада и да коришћени ресурси остану у економији ЕУ што је дуже могуће. Надовезујући се на постојеће политике и законодавство ЕУ, Пакет циркуларне економије утврђује акциони програм са мерама које покривају цео циклус, од производње и потрошње до управљања отпадом. Пакет укључује обавезе у вези са екодизајном, спречавањем настанка отпада и поновном употребом, циклусима чистих материјала и амбициозним квантитативним циљевима за повећање рециклаже и смањење одлагања отпада, обавезе за побољшање одвојеног сакупљања отпада, као и промоцију ефикасног коришћења био-ресурса.
12-41-title: Степен кружне употребе материјала
12-41-definition: >-
  Потрошачки отисак (КП) је модел процене животног циклуса (ЛЦА) који се користи за развој скупа од 16 индикатора животне средине ради процене утицаја образаца потрошње ЕУ и њених држава чланица на животну средину, а спроводи се комбиновањем података о интензитету потрошње са проценом утицаја репрезентативних производа на животну средину. Процена КП заснива се на комбинацији: (а) емисија у ваздух, земљиште и воду, као и ресурса који се користе током животног циклуса 164 репрезентативна производа, који припадају пет области потрошње (храна, мобилност, становање, кућни апарати и уређаји), (б) годишње потрошње (тј. интензитета потрошње) ових производа, израчунате из статистике потрошње, и (ц) методе процене утицаја еколошког отиска (ЕО), која претвара емисије и потрошњу ресурса у 16 потенцијалних утицаја на животну средину, који се могу објединити у један резултат, где је то прикладно. Индикатори утицаја ЕО могу се упоредити са скупом прагова заснованих на оквиру планетарних граница. Дакле, дати индикатор КП (на пример, климатске промене или еутрофикација мора) мери колико пута је утицај потрошње премашио повезану планетарну границу. Слично томе, индивидуални пондерисани CF резултат мери број пута када је пондерисана граница прекорачена.
12-41-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране“. Индикатор се може сматрати делом глобалног индикатора за Циљ одрживог развоја 11.6.1 „Удео чврстог комуналног отпада који се редовно сакупља и има одговарајуће коначно одлагање у укупном произведеном чврстом комуналном отпаду, од стране градова“.
  Повећање циркуларности европске економије је кључни приоритет нове индустријске стратегије ЕУ усвојене 2020. године и један је од кључних елемената Европског зеленог плана.
12-41-methodology: >-
  Европска комисија је усвојила Акциони план за циркуларну економију (CEAP) у марту 2020. године. Прелазак ЕУ на циркуларну економију смањиће притисак на природне ресурсе и створити одрживи раст и радна места. Нови акциони план најављује иницијативе дуж целог животног циклуса производа. Он је усмерен на начин на који су производи дизајнирани, промовише процесе циркуларне економије, подстиче одрживу потрошњу и има за циљ да осигура да се спречи настанак отпада и да коришћени ресурси остану у економији ЕУ што је дуже могуће. Надовезујући се на постојеће политике и законодавство ЕУ, Пакет циркуларне економије утврђује акциони програм са мерама које покривају цео циклус од производње и потрошње до управљања отпадом. Пакет укључује обавезе о екодизајну, спречавању настанка отпада и поновној употреби, циклусима чистих материјала и амбициозним квантитативним циљевима за повећање рециклаже и смањење одлагања на депоније, обавезе за побољшање одвојеног сакупљања отпада, као и промоцију ефикасног коришћења био-ресурсa.
  Акциони план за одрживу потрошњу и производњу и одрживу индустријску политику (SCP/SIP) укључује низ предлога о одрживој потрошњи и производњи који ће допринети побољшању еколошких перформанси производа и повећању потражње за одрживијем робом и производним технологијама. Осми акциони програм за животну средину (EAP), усвојен у марту 2022. године, има за циљ да убрза прелазак на климатски неутралну, ресурсно ефикасну и регенеративну економију, препознајући да људска добробит зависи од здравих екосистема. Међу његовим приоритетним циљевима су постизање климатске неутралности до 2050. године и обнављање биодиверзитета. Овај индикатор је такође укључен као главни индикатор и поставља циљ удвостручавања циркуларности употребе материјала до 2030. године у поређењу са 2020. годином.
12-41-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 30
12-51-title: Настанак отпада
12-51-definition: >-
  Овај индикатор се дефинише као сав отпад генерисан у земљи. Укључује отпад генерисан индустријском производњом (укључујући и сам сектор управљања отпадом) и отпад генерисан од стране домаћинстава. Укључени су главни минерални отпад, ископани материјал и земљиште. То доводи до великих количина отпада у неким земљама са значајним економским активностима као што су рударство и грађевинарство.
12-51-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, воде и природе“.
  Индикатор се може сматрати делом глобалног индикатора за Циљ одрживог развоја 11.6.1 „Удео чврстог комуналног отпада који се редовно сакупља и одлаже у одговарајућем коначном облику у односу на укупни чврсти комунални отпад који генеришу градови“.
  Повећање циркуларности европске економије је кључни приоритет нове индустријске стратегије ЕУ усвојене 2020. године и један је од кључних елемената Европског зеленог плана.
12-51-methodology: >-
  Европска комисија је усвојила нови Акциони план за циркуларну економију (CEAP) у марту 2020. године. Прелазак ЕУ на циркуларну економију смањиће притисак на природне ресурсе и створити одрживи раст и радна места. Нови акциони план најављује иницијативе дуж целог животног циклуса производа. Он је усмерен на начин на који су производи дизајнирани, промовише процесе циркуларне економије, подстиче одрживу потрошњу и има за циљ да осигура да се спречи настанак отпада и да коришћени ресурси остану у економији ЕУ што је дуже могуће. Надовезујући се на постојеће политике и законодавство ЕУ, Пакет циркуларне економије успоставља акциони програм са мерама које покривају цео циклус од производње и потрошње до управљања отпадом. Пакет укључује обавезе о екодизајну, спречавању настанка отпада и поновној употреби, циклусима чистих материјала и амбициозним квантитативним циљевима за повећање рециклаже и смањење одлагања на депоније, обавезе за побољшање одвојеног сакупљања отпада, као и промоцију ефикасног коришћења биоресурса.
  Акциони план за одрживу потрошњу и производњу и одрживу индустријску политику (SCP/SIP) укључује низ предлога о одрживој потрошњи и производњи који ће допринети побољшању еколошких перформанси производа и повећати потражњу за одрживијем робом и производним технологијама.
12-61-title: Бруто додата вриједност у сектору еколошких добара и услуга
12-61-definition: >-
  Сектор еколошких добара и услуга (EGSS) дефинисан је као онај део економије једне земље који производи добра и услуге које се користе у активностима заштите животне средине и управљања ресурсима, било на домаћем или међународном нивоу. Бруто додата вредност у EGSS-у представља допринос сектора еколошких добара и услуга БДП-у.
  Еколошки производи спречавају, смањују и елиминишу загађење или било коју другу деградацију животне средине и укључују мере предузете за обнову деградираних станишта и екосистема. Примери укључују електрична возила, катализаторе и филтере за смањење емисије загађивача, услуге третмана отпадних вода и отпада или радове на изолацији буке. Производи за управљање ресурсима штите залихе природних ресурса од исцрпљивања. Примери укључују производњу обновљиве енергије, енергетски ефикасне и пасивне зграде, десалинизацију морске воде или сакупљање кишнице.
12-61-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње и Циљу одрживог развоја 9 о изградњи отпорне инфраструктуре, промоцији инклузивне и одрживе индустријализације и неговању иновација, који су уграђени у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-61-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада. Циљ одрживог развоја 9 позива на изградњу отпорне и одрживе инфраструктуре и промоцију инклузивне и одрживе индустријализације. Такође препознаје важност истраживања и иновација у проналажењу трајних решења за друштвене, економске и еколошке изазове.
12-61-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 5,5.
13-10-title: Нето емисије гасова стаклене баште
13-10-definition: >-
  Индикатор мери укупне националне емисије (из оба сектора, ESD и ETS) такозване „Кјото корпе“ гасова стаклене баште, укључујући угљен-диоксид (CO2), метан (CH4), азот-оксид (N2O) и такозване F-гасове (хидрофлуороугљенике, перфлуороугљенике, азот-трифлуорид (NF3) и сумпор-хексафлуорид (SF6)) из свих сектора инвентара емисија гасова стаклене баште. Процењене емисије из међународног ваздухопловства и поморског саобраћаја су искључене за појединачне земље. Индикатор је представљен у два облика: као нето емисије које укључују коришћење земљишта, промене у коришћењу земљишта и шумарство (LULUCF) и искључују LULUCF. Користећи појединачни потенцијал глобалног загревања (GWP) сваког гаса, оне су интегрисане у јединствени индикатор изражен у јединицама CO2 еквивалента. Инвентаре емисија гасова стаклене баште државе чланице ЕУ годишње достављају Оквирној конвенцији Уједињених нација о климатским променама (UNFCCC).
13-10-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је уграђен у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Европски закон о клими поставља оквир за климатске акције и повећава амбиције ЕУ за 2030. годину, са новим циљем смањења нето емисије гасова стаклене баште (ГСГ) за најмање 55% до те године (у поређењу са 1990. годином) и постизања климатске неутралности до 2050. године. Европска комисија је такође увела пакет новог и ревидираног законодавства ЕУ о клими и енергетици – такозвани пакет „Спремни за 55“ – како би повећала своје амбиције за ублажавање климатских промена. Пакет обухвата међусобно повезан скуп мера у областима енергетике, транспорта, опорезивања и климатских политика, и укључује појачано и проширено одређивање цена угљеника, циљеве, стандарде и мере подршке. Такође поставља циљ за природне поноре угљеника од 310 милиона тона еквивалента CO2.
13-10-methodology: >-
  План опоравка NextGenerationEU је економски одговор Уније на кризу изазвану COVID-19. Он укључује Механизам за опоравак и отпорност вредан 672,5 милијарди евра, од чега најмање 37% мора бити намењено климатским акцијама. Сваки национални план опоравка и отпорности мораће да испуни овај циљ од најмање 37% расхода везаних за климатске промене, а све реформе и инвестиције држава чланица као део фонда за опоравак морају бити у складу са принципом „не наносити значајну штету“ и стога избегавати значајан негативан утицај на климатске и еколошке циљеве ЕУ.
  Нова кохезионска политика ЕУ (2021–2027) укључује „зеленију Европу без угљеника“ као један од својих пет главних циљева, који добијају 65% до 85% расположивих средстава, заједно са циљем „паметније Европе“.
13-21-title: Нето емисије гасова стаклене баште у сектору LULUCF
13-21-definition: >-
  Овај индикатор мери нето уклањање угљеника из сектора коришћења земљишта, промена коришћења земљишта и шумарства (LULUCF), узимајући у обзир и емисије и уклањање из сектора. Подаци о LULUCF-у обухватају годишње токове CO2, CH4 и N2O са свих управљаних земљишта у ЕУ. Индикатор се изражава као еквивалент CO2 користећи потенцијал глобалног загревања (GWP) сваког гаса.
  Подаци о емисијама и уклањању, познати као инвентари гасова стаклене баште, годишње се извештавају од стране земаља чланица ЕУ и Оквирне конвенције Уједињених нација о климатским променама (UNFCCC). Европска агенција за животну средину (EEA) прикупља агрегиране податке ЕУ и објављује податке за ЕУ и све државе чланице. Евростат поново објављује податке EEA.
13-21-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 има за циљ спровођење обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем да се достигне 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-21-methodology: >-
  Европски закон о клими утврђује оквир за климатске акције и повећава амбиције ЕУ за 2030. годину, са новим циљем смањења нето емисија гасова стаклене баште (ГСГ) за најмање 55% до те године (у поређењу са 1990. годином) и постизања климатске неутралности до 2050. године. Европска комисија је такође увела пакет новог и ревидираног законодавства ЕУ о клими и енергетици – такозвани пакет „Спремни за 55“ – како би повећала своје амбиције за ублажавање климатских промена. Пакет обухвата међусобно повезан скуп мера у областима енергетике, транспорта, опорезивања и климатских политика, и укључује појачано и проширено одређивање цена угљеника, циљеве, стандарде и мере подршке. Такође поставља циљ за природне поноре угљеника од 310 милиона тона еквивалента CO2.
13-31-title: Просjечне CO2 емисије по км нових путничких аутомобила
13-31-definition: >-
  Индикатор је дефинисан као просечна емисија угљен-диоксида (CO2) по км за нове путничке аутомобиле у датој години. Пријављене емисије се заснивају на хомологацији и могу се разликовати од стварних емисија CO2 нових аутомобила. Приликом праћења аутомобила и комбија, подаци о емисијама се приказују коришћењем протокола Новог европског циклуса вожње (NEDC) до 2019. године, коришћењем и NEDC и протокола Светски хармонизоване процедуре испитивања лаких возила (WLTP) у 2020. години, а од 2021. године само WLTP протокол.
13-31-intention: >-
  Индикатори који се користе за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње и ка Циљу одрживог развоја 13 о предузимању хитних мера за борбу против климатских промена и њихових утицаја. Ови циљеви одрживог развоја су укључени у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
13-31-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасности ресурса и смањењу глобалног отпада.
  Циљ одрживог развоја 13 тежи да спроведе обавезу према Оквирној конвенцији Уједињених нација о климатским променама да се постигне климатски неутралан свет до средине века како би се ограничило глобално загревање на знатно испод 2°C, са циљем од 1,5°C (у поређењу са прединдустријским нивоима). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
  Пакет „Спремни за 55“ укључује међусобно повезан скуп законодавства ЕУ о клими и енергији, укључујући ажуриране стандарде емисије CO2 за нова возила.
13-40-title: Економски губици повезани са климатским промjенама
13-40-definition: >-
  Индикатор мери економске губитке узроковане временским и климатским догађајима. Временски и климатски догађаји су дефинисани као метеоролошки догађаји (олује, лавине), хидролошки догађаји (поплаве) и климатолошки догађаји (топлотни таласи, хладни таласи, суше, шумски пожари) на основу класификације Међународног савета за науку (ICSU).
  Поред годишњих података, представљена је и изглађена временска серија заснована на 30-годишњим просецима. У складу са нормалним климатским периодом како га је дефинисала Светска метеоролошка организација, ови 30-годишњи просеци одражавају трендове искључујући значајну климатску варијабилност на краћим временским скалама услед природних фактора. Индикатор се заснива на подацима из CATDAT RiskLayer-а.
13-40-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 тежи спровођењу обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем од 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивних капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
  Овај индикатор се може сматрати сличним глобалним индикаторима Циљева одрживог развоја 1.5.2 и 11.5.2 „Директни економски губитак услед катастрофа у односу на глобални БДП“ (повезано са индикатором из Сендаија).
13-40-methodology: >-
  ЕУ ставља отпорност на катастрофе и климатске промене као централни циљ своје хуманитарне помоћи. Маркер отпорности ЕУ се користи у свим хуманитарним пројектима како би се дефинисали начини за смањење ризика од катастрофа и јачање капацитета људи да се носе са катастрофама и кризама. Акциони план за Сендајски оквир за смањење ризика од катастрофа 2015-2030 укључује снажан фокус на прилагођавање климатским променама, повезујући га са стратегијама за смањење ризика од катастрофа и њиховом кохерентном применом у земљама партнерима ЕУ.
  Нова Стратегија прилагођавања ЕУ подстиче паметније, брже и систематичније прилагођавање како би се испунила визија да ће ЕУ бити друштво отпорно на климатске промене 2050. године, потпуно прилагођено неизбежним утицајима климатских промена.
13-50-title: Допринос међународној обавези од 100 милијарди USD за климатске расходе
13-50-definition: >-
  Индикатор мери укупан износ потрошен из годишњег буџета држава чланица ЕУ, као и Европске комисије и Европске инвестиционе банке, како би се допринело међународној обавези од 100 милијарди америчких долара за финансирање климатских промена у складу са Оквирном конвенцијом Уједињених нација о климатским променама (UNFCCC).
13-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 13 о климатским акцијама, који је уграђен у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати идентичним глобалном индикатору за Циљ одрживог развоја 13.а.1 „Износи обезбеђени и мобилисани у америчким доларима годишње ка текућем циљу мобилизације колективних обавеза од 100 милијарди америчких долара до 2025. године“.
13-50-methodology: >-
  Циљ одрживог развоја 13 има за циљ спровођење обавезе преузете Оквирном конвенцијом Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет, са циљем ограничавања глобалног загревања на знатно испод 2°C, са циљем достизања 1,5°C (у поређењу са прединдустријским периодом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-70-title: Издавање зелених обвезница
13-70-definition: >-
  Зелене обвезнице су кредити које инвеститор даје зајмопримцу, а који се користе за финансирање пројеката или активности које промовишу ублажавање или прилагођавање климатским променама или друге циљеве заштите животне средине. Иако дефиниција зелене обвезнице може да варира, овај индикатор укључује обвезнице које су усклађене са четири основне компоненте Принципа зелених обвезница Међународног удружења тржишта капитала (ICMA) или су сертификоване од стране Иницијативе за климатске обвезнице (CBI). Издаваоци укључују корпорације као што су компаније или финансијске корпорације и издаваоце суверених обвезница које су националне владе. Суверене обвезнице које издају владе укључене су само ако имају рок доспећа дужи од годину дана.
13-70-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 има за циљ спровођење обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем да се достигне 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-70-methodology: >-
  Као део транзиције ка климатској неутралности и климатској отпорности, ЕУ настоји да преусмери јавна и приватна улагања у области у којима ће подржати овај циљ. Из тог разлога, ЕУ је усвојила Таксономију ЕУ као систем класификације за одрживе економске активности и Европски стандард зелених обвезница као добровољни „златни“ стандард за тржиште зелених обвезница. На нивоу ЕУ, ублажавање и прилагођавање климатским променама интегрисани су у све главне програме потрошње, а ЕУ се такође обавезала да ће подржати међународне акције у области климе.
  Овај индикатор је главни индикатор за праћење напретка ка циљевима Осмог акционог програма за животну средину (8. ЕАП).
14-10-title: Marine protected areas
14-10-definition: >-
  Овај индикатор мери обим морских заштићених подручја (МПА) у морским водама ЕУ. МПА су жаришта биодиверзитета и могу служити различитим циљевима, укључујући заштиту врста и станишта, очување и обнављање биодиверзитета и коришћење ресурса унутар дефинисаних еколошких граница. МПА такође могу имати позитиван утицај на суседна подручја.
14-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору Циља одрживог развоја 14.5.1 „Покривеност заштићених подручја у односу на морска подручја“.
14-10-methodology: >-
  Директива ЕУ о птицама и Директива о стаништима имају за циљ да одрже или обнове повољан статус очувања заштићених станишта и врста, као и да заштите њихово одрживо коришћење и управљање. Директива о стаништима има за циљ да допринесе обезбеђивању биодиверзитета ЕУ, укључујући морску средину, и наводи девет типова морских станишта и 16 врста за које је потребно проглашење морског подручја, док Директива о птицама наводи додатних 60 врста птица чије очување захтева заштиту морског подручја.
  Стратегија ЕУ о биодиверзитету има за циљ да заштити најмање 30% европског копна и мора, укључујући национално одређена подручја и локације Натура 2000.
  Заштићена морска подручја могу служити различитим сврхама, укључујући заштиту врста и станишта, очување и обнављање биодиверзитета и коришћење ресурса унутар дефинисаних еколошких граница. Специфични циљеви управљања постављени су за сва заштићена морска подручја (МПА), која се често састоје од различитих зона са дозвољеном и забрањеном употребом.
  ЕУ је такође укључена у дискусије на Генералној скупштини Уједињених нација о међународном правно обавезујућем споразуму о очувању биодиверзитета у подручјима ван националне јурисдикције (BBNJ).
14-21-title: Estimated trends in fish stock biomass
14-21-definition: >-
  Биомаса рибљег фонда је функција биолошких карактеристика као што су бројност и тежина и може указивати на статус рибљег фонда када се мери у односу на референтне вредности. Ово је индикатор заснован на моделу који се израчунава коришћењем резултата квантитативних процена фондова појединачних врста. Он приказује средњу вредност биомасе рибљег фонда у поређењу са 2003. годином. Пуна временска серија се ажурира годишње, понекад укључујући нова средства због новодоступних квантитативних процена, што може довести до малих разлика од једне године објављивања до друге.
14-21-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.4.1 „Удео рибљих залиха у оквиру биолошки одрживих нивоа“.
14-21-methodology: >-
  Заједничка рибарска политика има за циљ да обезбеди дугорочну одрживост сектора одржавањем репродукције рибљих залиха за високе дугорочне приносе, побољшањем расподеле риболовних могућности, очувањем морских ресурса и подржавањем профитабилности индустрије. Оквирна директива о морској стратегији предузима свеобухватан и интегрисан приступ заштити морске средине и природних ресурса са циљем постизања доброг еколошког статуса морских вода ЕУ које су еколошки разноврсне, чисте, здраве и продуктивне.
14-30-title: Estimated trend in fishing pressure
14-30-definition: >-
  Индикатор представља моделски заснован средњи риболовни притисак (F/Fmsy) у морским водама ЕУ североисточног Атлантика и суседних мора (FAO подручје 27) и Средоземног и Црног мора (FAO подручје 37) за које тренутни риболовни морталитет (F) премашује процењени риболовни морталитет који је у складу са постизањем максималног одрживог приноса (Fmsy). Риболовни морталитет је мера угинућа или уклањања рибе из популације услед риболова. Риболовни морталитет који је у складу са постизањем максималног одрживог приноса одређен је дугорочном просечном величином залиха која омогућава риболов на овом нивоу. Да би риболов био одржив, F не би требало да пређе Fmsy – тачку у којој се највећи улов може узети из рибљег залиха током неограниченог периода без наношења штете.
14-30-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.4.1 „Удео рибљих залиха у оквиру биолошки одрживих нивоа“.
14-30-methodology: >-
  Заједничка рибарска политика има за циљ да обезбеди дугорочну одрживост сектора одржавањем репродукције рибљих залиха за високе дугорочне приносе, побољшањем расподеле риболовних могућности, очувањем морских ресурса и подржавањем профитабилности индустрије. Оквирна директива о морској стратегији предузима свеобухватан и интегрисан приступ заштити морске средине и природних ресурса са циљем постизања доброг еколошког статуса морских вода ЕУ које су еколошки разноврсне, чисте, здраве и продуктивне.
14-40-title: Bathing sites with excellent water quality
14-40-definition: >-
  Индикатор показује удео купалишта у унутрашњости и на обали са одличним квалитетом воде у ЕУ и другим европским земљама. Квалитет воде за купање процењује се према стандардима за микробиолошке параметре (цревне ентерококе и ешерихија коли). Индикатор се израчунава на основу покретног просека од најмање 16 узорака у четири године како би се осигурало да се постигне реална класификација воде за купање.
  Директива о водама за купање (ДВК) захтева од држава чланица да идентификују и процене квалитет свих копнених и морских вода за купање и да класификују те воде као „лоше“, „задовољавајуће“, „добре“ или „одличне“ у зависности од нивоа откривених фекалних бактерија.
14-40-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, и ка Циљу одрживог развоја 6 о обезбеђивању доступности и одрживог управљања водом и санитацијом за све, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
14-40-methodology: >-
  Директива ЕУ о водама за купање једна је од успешних прича у политици ЕУ о водама, усмерена на заштиту људског здравља и животне средине допуњавањем Оквирне директиве о водама.
14-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 100.
14-50-title: Global mean surface seawater acidity
14-50-definition: >-
  Овај индикатор показује просечну годишњу концентрацију водоничних јона у површинској морској води североисточног Атлантика и суседних мора, изражену у наномолима по литру (nmol/l). Повећање концентрације водоничних јона одговара смањењу pH вредности и повећању киселости морске воде.
  Овај тренд је покренут повећањем атмосферског угљен-диоксида (CO2), што повећава унос CO2 у океан. Коперникус морска служба реконструише трендове у глобалној ацидификацији океана од 1985. године.
14-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.3.1 „Просечна киселост мора (pH) мерена на договореном скупу репрезентативних станица за узорковање“.
14-50-methodology: >-
  Циљ одрживог развоја 14 има за циљ заштиту и осигурање одрживог коришћења океана. То укључује смањење загађења мора и утицаја закисељавања океана, окончање прекомерног риболова и очување морских и приобалних подручја и екосистема. Циљ одрживог развоја 14 има јаке међузависности са широким спектром других циљева одрживог развоја, јер океани одржавају приобалне економије и средства за живот, доприносе производњи хране и функционишу као понор угљеника. Препознајући ограничења у решавању управљања океанима на нивоу држава чланица или Европе, ЕУ ради на обезбеђивању јачег система управљања океанима како би се постигло очување и одрживо коришћење регионалних и међународних вода. ЕУ такође има низ стратегија усмерених на ублажавање климатских промена и смањење емисије гасова стаклене баште, укључујући CO2.
14-60-title: Marine waters affected by eutrophication
14-60-definition: >-
  Индикатор показује удео еутрофичних морских вода у ексклузивној економској зони (ИЕЗ). Подручје се класификује као еутрофично ако су, током више од 25% дана посматрања у датој години, концентрације хлорофила а, као замена за еутрофикацију, изнад 90. перцентила референтне основне вредности из периода 1998–2017.
  Еутрофикација је процес којим вишак хранљивих материја – углавном фосфора и азота – доводи до повећаног раста биљног материјала, посебно цветања алги, у воденом телу, што резултира смањењем квалитета воде. То, заузврат, може изазвати смрт водених организама услед хипоксије. Антропогене активности, као што су пољопривреда, аквакултура, индустрија и канализација, главни су извори уноса хранљивих материја у проблематична подручја.
14-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.1.1: (а) „Индекс еутрофикације обале“.
14-60-methodology: >-
  Циљ одрживог развоја 14 има за циљ очување и одрживо коришћење океана, мора и морских ресурса, што захтева, између осталог, спречавање и смањење загађења мора и утицаја закисељавања океана.
  Оквирна директива о морској стратегији (MSFD) захтева од држава чланица да извештавају о еутрофикацији за своја регионална мора сваких 6 година.
15-10-title: Удио шумске површине
15-20-title: Земљишта под заштитом
15-20-definition: >-
  Овај индикатор мери обим и удео копнених заштићених подручја, која укључују национално одређена заштићена подручја и подручја Натура 2000. Национално одређено подручје је подручје заштићено националним законодавством.
  Натура 2000 подручја су одређена ради заштите европских врста и станишта, како је наведено у директивама ЕУ о стаништима и птицама.
15-20-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је укључен у Приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалним индикаторима Циљева одрживог развоја 15.1.2 „Удео важних локација за копнени и слатководни биодиверзитет који су покривени заштићеним подручјима, по типу екосистема“ и 15.4.1 „Покривеност важних локација за планински биодиверзитет заштићеним подручјима“.
15-20-methodology: >-
  Директива ЕУ о птицама и Директива о стаништима имају за циљ да одрже или обнове повољан статус очувања заштићених станишта и врста, као и да заштите њихово одрживо коришћење и управљање. Директива о птицама штити све врсте дивљих птица и њихова станишта. Директива о стаништима штити више од 1.300 других ретких, угрожених или ендемских врста дивљих животиња и биљака и 233 врсте природних станишта. Поред тога, мрежа заштићених подручја Натура 2000 обухвата подручја која су државе чланице ЕУ одредиле у складу са Директивама о птицама и Директивама о стаништима.
15-20-long_term_objective: >-
  Стратегија ЕУ за биодиверзитет има за циљ да заштити најмање 30% европског копна и мора, укључујући национално одређена подручја и локације Натура 2000.
15-42-title: Утицај суше на екосистеме
15-42-definition: >-
  Овај индикатор приказује површину погођену сушом праћењем негативних аномалија у продуктивности вегетације у подручјима са озбиљним дефицитом влажности земљишта током вегетационе сезоне (више од једне стандардне девијације од дугорочног просека - посматрано путем података даљинске детекције у резолуцији од 500×500 метара из Коперникус ЕМС Европске опсерваторије за сушу Заједничког истраживачког центра Европске комисије).
  Индикатор покрива само пољопривредне суше са дефицитом влажности земљишта који узрокује смањену продуктивност вегетације због недовољних падавина, за разлику од хидролошких суша, које се јављају када ниске залихе воде постану очигледне у потоцима, акумулацијама и нивоима подземних вода, обично након вишемесечне метеоролошке суше.
15-42-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је уграђен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
15-42-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање крчења шума, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
15-42-long_term_objective: >-
  Стратегија за земљиште 2030 поставила је циљ нулте нето експлоатације земљишта до 2050. године.
15-50-title: Површина у ризику од тешке ерозије земљишта од воде
15-50-definition: >-
  Индикатор процењује површину потенцијално погођену јаком ерозијом земљишта водом, као што су прскање кише, топљење снега и потоци (губитак земљишта > 10 тона/хектар/годишње). Ова површина је изражена у km2 и као проценат укупне неразместиве, ерозивне површине у земљи. Тамо где нема земљишта које је у ризику од ерозије земљишта водом веће од 10 тона по хектару, земља ће имати вредност нула. Ерозија земљишта се и даље може јављати у подручјима ових земаља, али брзином мањом од 10 тона по хектару.
  Ови бројеви се процењују коришћењем модификоване верзије Ревидиране универзалне једначине губитка земљишта (RUSLE 2015), која даје процене са резолуцијом од 100 m на основу рецензираних улазних слојева ерозивности кише, еродибилности земљишта, топографије, коришћења земљишта и управљања земљиштем. Укључене су следеће класе номенклатуре CORINE Land Cover (CLC): Пољопривредне површине (2), шуме и полуприродна подручја (3) искључујући плаже, дине, пешчане равнице (3.3.1), голе стене (3.3.2), глечере и стални снег (3.3.5). Генерално, вештачке, песковите, камените и залеђене површине, као и мочваре и водена тела, нису укључене.
15-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта и ка Циљу одрживог развоја 2 о искорењивању глади, постизању безбедности хране и побољшаној исхрани и промоцији одрживе пољопривреде, који су уграђени у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
15-50-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање дефорестације, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
  Циљ одрживог развоја 2 има за циљ да оконча глад и неухрањеност и обезбеди приступ безбедној, хранљивој и довољној храни. Остваривање овог циља ће у великој мери зависити од промоције одрживих производних система и повећања улагања у руралну инфраструктуру и пољопривредна истраживања и развој.
  Стратегија за земљиште до 2030. године препознаје ерозију као претњу земљишту у ЕУ. Заједничка пољопривредна политика Европе поставља захтеве за заштиту коришћених пољопривредних површина од ерозије и успоставља оквир стандарда који, између осталог, имају за циљ да допринесу спречавању ерозије тла.
15-60-title: Индекс птица
15-60-definition: >-
  Индикатор је композитни вишеврсни индекс, који мери релативну бројност одабраних уобичајених врста птица повезаних са одређеним стаништима. Ретке врсте су искључене. Заступљене су три групе врста птица: уобичајене врсте пољопривредног земљишта (39 врста), уобичајене шумске врсте (34 врсте) и све уобичајене врсте птица (168 врста; укључујући врсте пољопривредног земљишта и шуме).
15-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта и ка Циљу одрживог развоја 2 о искорењивању глади, постизању безбедности хране и побољшаној исхрани и промоцији одрживе пољопривреде, који су уграђени у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
15-60-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање дефорестације, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
  Циљ одрживог развоја 2 има за циљ да оконча глад и неухрањеност и обезбеди приступ безбедној, хранљивој и довољној храни. Остваривање овог циља ће у великој мери зависити од промоције одрживих производних система и повећања улагања у руралну инфраструктуру и пољопривредна истраживања и развој.
  Птице и станишта угрожених и птица селица заштићена су Директивом о птицама. Многа станишта која користе птице такође су заштићена Директивом о стаништима. Стратегија ЕУ о биодиверзитету за 2030. годину посебно наводи да ове Директиве о природи треба у потпуности спровести у настојању да се зауставе и преокрену трендови губитка биодиверзитета.
15-61-title: Индекс лептира на травнатим површинама
15-61-definition: >-
  Индекс лептира травнатих травњака ЕУ интегрише трендове популације 17 врста лептира које се прате широм ЕУ и израчунава се коришћењем података из свих 27 земаља чланица ЕУ. Почетна година националне временске серије креће се од 1990. до 2023. године, стога је индекс тренутно представљен као агрегирани подаци ЕУ са изравнаним вредностима. Податке је интегрисала и обезбедила организација Butterfly Conservation Europe, партнерство Европског програма за праћење лептира, пројекат EMBRACE.
15-61-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је уграђен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
15-61-methodology: >-
  Стратегија ЕУ за биодиверзитет до 2030. године има за циљ обнављање деградираних екосистема и заустављање и преокретање тренда смањења броја опрашивача. Директива о стаништима и Директива о птицама играју централну улогу у остваривању ових циљева. У јуну 2018. године, Европска комисија је усвојила прву иницијативу ЕУ о опрашивачима, укључујући лептире. Иницијатива поставља оквир за интегрисани приступ решавању проблема смањења броја опрашивача у ЕУ и за ефикасније коришћење постојећих алата и политика.
16-10-title: Стандардизована стопа смртности због убистава
16-10-definition: >-
  Индикатор мери стандардизовану стопу смртности од убистава и повреда које је нанела друга особа са намером да повреди или убије на било који начин, укључујући „касне последице“ напада (кодови Међународне класификације болести (МКБ) X85 до Y09 и Y87.1). Не укључује смртне случајеве узроковане правним интервенцијама или ратом (кодови МКБ Y35 и Y36).
  Подаци о узроку смрти (УСС) односе се на основни узрок, који је - према Светској здравственој организацији (СЗО) - „болест или повреда која је покренула низ морбидних догађаја који су директно довели до смрти или околности несреће или насиља које је изазвало смртоносну повреду“. Подаци о УСС-у се изводе из извода из матичне књиге умрлих.
16-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, поштовање наших вредности“.
  Индикатор се може сматрати делом глобалног индикатора Циља одрживог развоја 16.1.2 „Смрти повезане са сукобима на 100.000 становника, по полу, старости и узроку“.
16-10-methodology: >-
  Европска комисија је 24. јула 2020. године усвојила Стратегију безбедносне уније ЕУ за период 2020–2025. Као кључну компоненту стратегије, Комисија је дефинисала нови пут напред у области унутрашње безбедности са акцијама у кључним областима: организовани криминал; тероризам и спречавање насилне радикализације; отпорност наше критичне инфраструктуре и јавних простора; сајбер криминал, укључујући борбу против сексуалног злостављања деце; сарадња у спровођењу закона и размена информација; и истраживање и иновације.
  Безбедност је кључни аспект живота људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који би потенцијално могли да угрозе физички интегритет појединца. Кривична дела су једна од најочигледнијих злоупотреба несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Као такав, овај индикатор доприноси разумевању безбедности друштва.
16-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 0,3.
16-20-title: Становништво које пријављује криминал, насиље или вандализам у својој заједници
16-20-definition: >-
  Индикатор показује удео становништва које је пријавило да има проблем са криминалом, насиљем или вандализмом у свом локалном подручју. Ово описује ситуацију у којој испитаник верује да криминал, насиље или вандализам у том подручју представљају проблем за домаћинство, иако се ова перцепција не заснива нужно на личном искуству.
16-20-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, који су уграђени у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, одржавања наших вредности“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 16.1.4 „Удео становништва које се осећа безбедно шетајући само у свом комшилуку након мрака“.
16-20-methodology: >-
  Безбедност је кључни аспект у животима људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који потенцијално могу угрозити физички интегритет појединца. Кривична дела су једна од најочигледнијих злоупотреба несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Овај индикатор стога допуњује индикатор стопе убистава фокусирајући се на перцепцију несигурности.
  Стратегија Европске комисије „ProtectEU“ има за циљ да повећа капацитет држава чланица ЕУ да заштите друштва и демократије од онлајн и офлајн претњи терориста, криминалаца и непријатељских страних актера. Штавише, осигураће да се безбедносне импликације узму у обзир у свим будућим политикама ЕУ.
16-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност 4.
16-30-title: Укупна потрошња владе на судове
16-30-definition: >-
  Индикатор мери укупне државне расходе за судове према Класификацији функција владе (COFOG). Ово укључује расходе за администрацију, рад или подршку грађанским и кривичним судовима и правосудном систему, укључујући спровођење новчаних казни и правних поравнања које изричу судови и рад система условног отпуста и пробације; правно заступање и саветовање у име владе или у име других које влада пружа у новцу или натури. Судови укључују управне трибунале, омбудсмане и слично, а искључују затворске управе.
  Приликом израчунавања индикатора по глави становника, као именилац се користе подаци о просечном броју становника из Националних рачуна (НР) референтне године (израчунати као аритметичка средина броја становника на дан 1. јануара две узастопне године).
16-30-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-30-methodology: >-
  Добро функционисање правосудних система је важан структурни услов на којем државе чланице ЕУ заснивају своје политике за одрживи раст и социјалну стабилност. Без обзира на модел националног правосудног система или правну традицију на којој се он заснива, квалитет, независност и ефикасност су међу битним параметрима „ефикасног правосудног система“. Побољшање ефикасности правосудних система у државама чланицама идентификовано је као кључна компонента за структурне реформе у Европском семестру, годишњем циклусу за координацију економских политика на нивоу ЕУ. Извештај о владавини права процењује стање правосудних система држава чланица, а Табела о стању правосуђа ЕУ допуњује га праћењем ефикасности, квалитета и независности правосудних система држава чланица. Као кључни део Табеле о стању правосуђа ЕУ, овај индикатор помаже у процени квалитета правосудног система.
16-40-title: 'Перципирана независност правосуђа: врло или прилично добра'
16-40-definition: >-
  Индикатор је осмишљен да истражи перцепцију испитаника о независности правосуђа у државама чланицама ЕУ, са посебним фокусом на перципирану независност судова и судија у одређеној земљи. Подаци о перципираној независности правосудног система потичу из годишњих истраживања Флеш Евробарометра, која су почела 2016. године у име Генералног директората Европске комисије за правосуђе и потрошаче. У овом истраживању, од испитаника се тражи да одговоре на следеће питање: „На основу онога што знате, како бисте оценили правосудни систем у (ОВОЈ ЗЕМЉИ) у погледу независности судова и судија? Да ли бисте рекли да је веома добар, прилично добар, прилично лош или веома лош?“
16-40-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-40-methodology: >-
  Поред довољних финансијских средстава, судије у судовима морају бити у могућности да доносе одлуке без мешања или притиска политике или других економских актера, како би се осигурало да појединци и предузећа могу у потпуности уживати у својим правима. Поштовање владавине права је предуслов за заштиту свих основних вредности садржаних у Уговорима ЕУ, укључујући демократију и основна права. Побољшање ефикасности правосудних система у државама чланицама идентификовано је као кључна компонента структурних реформи у Европском семестру. Извештај о владавини права процењује стање правосудних система држава чланица, а Табела о стању правосуђа ЕУ га допуњује праћењем ефикасности, квалитета и независности правосудних система држава чланица.
16-50-title: Индекс перцепције корупције
16-50-definition: >-
  Индикатор је композитни индекс заснован на комбинацији анкета и процена корупције из 13 различитих извора, и оцењује и рангира земље на основу тога колико се јавни сектор у земљи доживљава као корумпиран, при чему резултат 0 представља веома висок ниво корупције, а резултат 100 представља веома чисту земљу. ИПЦ укључује само изворе који дају резултат за скуп земаља/територија и који мере перцепцију корупције у јавном сектору. Да би била укључена у рангирање, земља/територија мора бити укључена у најмање три извора података ИПЦ-а. ИПЦ објављује Транспаренси Интернешенел.
16-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, поштовање наших вредности“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 16.5.2 „Удео предузећа која су имала барем један контакт са јавним службеником и која су платила мито јавном службенику или им је јавни службеник затражио мито у претходних 12 месеци“.
16-50-methodology: >-
  Корупција узрокује финансијску штету смањењем нивоа инвестиција, нарушавањем праведног функционисања унутрашњег тржишта и исцрпљивањем јавних финансија. Такође узрокује друштвену штету јер организоване криминалне групе користе корупцију за чињење других тешких кривичних дела, као што су трговина дрогом и људима. Пошто не постоји смислен начин да се процени апсолутни ниво корупције у земљама или територијама на основу чврстих емпиријских података, прикупљање перцепција о корупцији од оних који су у позицији да понуде процене корупције у јавном сектору је до сада најпоузданија метода поређења релативних нивоа корупције у различитим земљама.
16-50-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 88.
16-70-title: Жртве трговине људима по полу
16-70-definition: >-
  Индикатор је композитни индекс заснован на комбинацији анкета и процена корупције из 13 различитих извора, и оцењује и рангира земље на основу тога колико се јавни сектор у земљи доживљава као корумпиран, при чему резултат 0 представља веома висок ниво корупције, а резултат 100 представља веома чисту земљу. ИПЦ укључује само изворе који дају резултат за скуп земаља/територија и који мере перцепцију корупције у јавном сектору. Да би била укључена у рангирање, земља/територија мора бити укључена у најмање три извора података ИПЦ-а. ИПЦ објављује Транспаренси Интернешенел.
16-70-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-70-methodology: >-
  Безбедност је кључни аспект у животима људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који потенцијално могу угрозити физички интегритет појединца. Криминал је један од најочигледнијих узрока несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Овај индикатор стога допуњује индикатор стопе убистава фокусирајући се на перцепцију несигурности.
  Стратегија Европске комисије „ProtectEU“ има за циљ да повећа капацитет држава чланица ЕУ да заштите друштва и демократије од онлајн и офлајн претњи терориста, криминалаца и непријатељских страних актера. Штавише, осигураће да се безбедносне импликације узму у обзир у свим будућим политикама ЕУ.
16-70-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност 0.
17-10-title: Званична развојна помоћ
17-10-definition: >-
  Званична развојна помоћ (ОДА) састоји се од грантова, кредита и капиталних инвестиција које врши званични сектор са циљем промоције економског развоја и благостања у земљама у развоју. Исплате евидентирају стварни међународни трансфер финансијских средстава или робе или услуга вреднованих по трошку донатора. ОДА је овде представљена као удео у бруто националном дохотку (БНД). БНД по тржишним ценама једнак је бруто домаћем производу (БДП) умањеном за примарни доходак који резидентне јединице плаћају нерезидентним јединицама, плус примарни доходак који резидентне јединице примају од остатка света. Списак земаља и територија које испуњавају услове за ОДА утврђује Комитет за развојну помоћ ОЕЦД-а.
17-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, који је уграђен у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, очување наших вредности“.
  Индикатор се може посматрати као сличан глобалном индикатору за Циљ одрживог развоја 17.2.1 „Нето званична развојна помоћ, укупна и најмање развијеним земљама, као удео у БНД-у донатора ОЕЦД-ДАЦ“.
  Развијене економије попут ЕУ могу подржати земље у развоју да се крећу ка одрживим – и од стране земаља – путевима развоја на различите начине. То укључује пружање званичне развојне помоћи (ОДА). Из тог разлога постоји дугорочни циљ да се 0,7% бруто националног дохотка (БНД) издвоји за ОДА.
17-10-methodology: >-
  Европски консензус о развоју из јуна 2017. године истиче потребу да се висок удео званичне развојне помоћи додели најмање развијеним земљама и другим земљама са ниским приходима. Стога би 0,15-0,20% БНД-а требало доделити најмање развијеним земљама у кратком року, а овај износ би се повећао на 0,20% до 2030. године. Консензус заузима свеобухватан приступ имплементацији, комбинујући помоћ са другим ресурсима, са добрим политикама и ојачаним приступом кохерентности политика за развој.
17-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност 1.
17-20-title: Финансирање ЕУ земљама у развоју
17-20-definition: >-
  Индикатор приказује укупно званично и приватно финансирање ЕУ земљама у развоју. Састоји се од нето исплата званичне развојне помоћи (ОДА), осталих званичних токова (ОЗТ), приватних токова (углавном страних директних инвестиција, СДИ) и грантова од приватних агенција и невладиних организација.
  ОДА се састоји од грантова или концесионих кредита које додељује званични сектор са главним циљем промоције економског развоја и благостања у земљама примаоцима. ОЗТ су трансакције које се не квалификују као ОДА, било зато што нису првенствено оријентисане на развој или зато што имају елемент гранта мањи од 25%. Приватни токови укључују директне инвестиције, обвезнице, извозне кредите и мултилатералне приватне токове.
  Грантови од приватних агенција и националних невладиних организација састоје се од развојне помоћи и средстава за помоћ, заједно са свим додатним доприносима у натури, укључујући, на пример, приходе од продаје божићних честитки у добротворне сврхе или посебне апеле (на пример, за помоћ у катастрофама).
17-20-intention: >-
  Индикатори који се користе за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
17-20-methodology: >-
  Циљ 17, Званична развојна помоћ и други финансијски ресурси, било јавни или приватни, домаћи или међународни, биће потребни.
  ЕУ примењује кохерентан и подржавајући приступ развоју, где сви финансијски токови ка земљама у развоју, укључујући помоћ, инвестиције и трговину, раде заједно са мобилизацијом домаћих ресурса и добрим политикама како би се помогло у изградњи капацитета и подршци самосталности у тим земљама. Индикатор стога допуњује индикатор о развојној помоћи.
17-31-title: Увоз ЕУ из најмање развијених земаља
17-31-definition: >-
  Овај индикатор је дефинисан као удео укупног увоза ван ЕУ који долази из земаља које су УН класификовале као најмање развијене. Он показује у којој мери производи из ових земаља приступају тржишту ЕУ. Информације за овај индикатор пружају компаније са обимом трговине изнад утврђеног прага и прикупљају се на основу царинских декларација. Ове информације затим државе чланице прилагођавају како би узеле у обзир утицај трговине испод овог прага.
17-31-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, очување наших вредности“.
  Потенцијални допринос трговине одрживом развоју је одавно препознат. ЕУ предводи пут ка праведнијем глобалном партнерству са земљама у развоју заузимајући одговоран приступ трговинској и инвестиционој политици, на пример кроз стратегију „Трговина за све“ (2015) која има за циљ да помогне земљама у развоју да потпуније учествују на глобалном тржишту. Штавише, ЕУ олакшава увоз из земаља у развоју одобравањем смањења царина у оквиру своје Генерализоване шеме преференција и пружањем „Помоћи за трговину“ усмерене на подршку трговинској инфраструктури, помоћи везаној за трговину и развоју приватног сектора. Коначно, Споразум из Котонуа регулише односе ЕУ са 79 земаља Африке, Кариба и Пацифика (АКП), фокусирајући се на развојну сарадњу, политичку сарадњу, као и економску и трговинску сарадњу.
17-31-methodology: >-
  ЕУ је ажурирала своју Стратегију помоћи за трговину 2017. године, како би одражавала значајне промене политика и на глобалном нивоу - посебно Агенду 2030 - и на нивоу ЕУ, укључујући нови Европски консензус о развоју и трговини за све. Ажурирана стратегија има за циљ побољшање кохерентности помоћи за трговину са другим политикама и инструментима ЕУ, укључујући трговинске споразуме ЕУ и једностране шеме преференција. Фокус на најмање развијене земље је кључни део ажуриране стратегије. ЕУ је 2021. године ревидирала своју трговинску стратегију, са циљем да одражава свој нови, одрживији модел раста, као и циљеве одрживог развоја.
17-40-title: Бруто дуг опште државе
17-40-definition: >-
  Индикатор је дефинисан у консолидованој верзији Уговора о функционисању Европске уније из 2012. године и даље развијен у Уредби Савета (ЕЗ) бр. 479/2009, са изменама и допунама, и Уредби (ЕУ) бр. 549/2013 Европског парламента и Савета (ЕСА 2010) и накнадним законским изменама, допуњен даљим тумачењима и смерницама Евростата, посебно Приручником о државном дефициту и дугу као односу укупног бруто државног дуга по номиналној вредности на крају године и БДП-а по текућим тржишним ценама.
  Државни дуг се дефинише као укупни консолидовани бруто дуг по номиналној вредности на крају године у следећим категоријама државних обавеза (како је дефинисано у ЕСА 2010): валута и депозити (АФ.2), дужничке хартије од вредности (АФ.3) и кредити (АФ.4). Сектор опште државе обухвата подсекторе централне владе, државне владе, локалне самоуправе и фондова социјалног осигурања.
17-40-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
17-40-methodology: >-
  „Да би се помогло другима да побољшају своје економије, неопходно је да се економије саме ЕУ одрже на одрживом путу. Макроекономско управљање, које има за циљ да обезбеди финансијску стабилност у ЕУ, стога је један од стубова доприноса ЕУ спровођењу Циљева одрживог развоја. Државни дуг би стога требало да буде ограничен на управљив ниво и не би требало да прелази 60% БДП-а, како је наведено у Уговору о функционисању Европске уније. Ово чини основу Пакта стабилности и раста и Поступка прекомерног дефицита (ЕДП), који обезбеђује фискалну одрживост.
  Амбициозна реформа оквира економског управљања ЕУ ступила је на снагу 2024. године, са циљем јачања одрживости дуга држава чланица и промовисања одрживог и инклузивног раста у свим државама чланицама.“
17-50-title: Удио пореза на заштиту животне средине у укупним пореским приходима
17-50-definition: >-
  Индикатор мери удео пореза на заштиту животне средине у укупним приходима од пореза и социјалних доприноса. Порези на заштиту животне средине су дефинисани као порези чија је пореска основица физичка јединица (или њена замена) нечега што има доказан, специфичан негативан утицај на животну средину. Приходи од пореза на заштиту животне средине долазе из четири врсте пореза: порези на енергију (који доприносе око три четвртине укупног износа), порези на транспорт (око једне петине укупног износа) и порези на загађење и ресурсе (око 4% укупног износа).
17-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
17-50-methodology: >-
  У глобалном контексту, где обрасци потрошње у једном региону могу озбиљно утицати на обрасце производње у другим деловима света, посебно је важно да цене одражавају стварне трошкове потрошње и производње. Стога би требало да укључују и плаћања за штету коју активности наносе људском здрављу и животној средини. Политике ЕУ, као што је Европски зелени план, позивају на прелазак са пореза на рад на порезе на енергију и животну средину као део „озелењавања“ пореских система, што значи да би приходи од пореза заштите животне средине требало да се повећају у односу на порезе на рад. Европски семестар прати напредак ка циљевима постављеним у европским стратегијама.
17-60-title: Удио домаћинстава са брзим интернет прикључком
17-60-definition: >-
  Индикатор мери удео домаћинстава са фиксном везом на мрежу веома високог капацитета (VHCN). Мрежа веома високог капацитета је или електронска комуникациона мрежа која се у потпуности састоји од оптичких влакана барем до дистрибутивне тачке на локацији услуге, или електронска комуникациона мрежа способна да обезбеди, под нормалним условима вршног оптерећења, сличне мрежне перформансе у смислу расположивог низводног и узводног пропусног опсега, отпорности, параметара везаних за грешке и латенције и њених варијација.
  Подаци се односе и на оптичко влакно до просторија (FTTP) и на Спецификацију интерфејса за услуге преноса података преко кабла (DOCSIS) 3.1. DOCSIS омогућава додавање преноса података великог пропусног опсега постојећим системима кабловске телевизије.
  „Рурална подручја“ су дефинисана као она са мање од 100 људи по km².
17-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој и Циљу одрживог развоја 9 о индустрији, иновацијама и инфраструктури. Циљеви одрживог развоја 9 и 17 су уграђени у приоритет Европске комисије „Нова ера за европску одбрану и безбедност“. Циљ одрживог развоја 17 је такође уграђен у приоритет Европске комисије „Заштита наших демократија, одржавање наших вредности“. Припрема Европе за дигитално доба је стога један од шест приоритета Комисије за период 2019–2024. Циљ је да дигитална трансформација функционише за људе и предузећа, а истовремено помогне у постизању циља климатски неутралне Европе до 2050. године. Циљ одрживог развоја 17 препознаје важност приступа науци, технологији и иновацијама за одрживи развој. Број претплата на широкопојасни интернет на 100 становника један је од индикатора које УН користе за мерење напретка ка повезаном циљу. У својој Дигиталној стратегији за 2020. годину, Европска комисија је истакла посвећеност ЕУ развоју Глобалне стратегије за дигиталну сарадњу, која ће одражавати циљеве одрживог развоја.
17-60-methodology: >-
  У својој комуникацији из 2016. године под називом „Повезивање за конкурентно јединствено дигитално тржиште – ка европском гигабитном друштву“, Европска комисија је поставила визију за европско гигабитно друштво, операционализовану кроз три циља за 2025. годину. ЕУ тежи гигабитној повезаности за места која покрећу друштвено-економски развој, 5Г покривености за сва урбана подручја и све главне копнене саобраћајне руте и приступу интернет конекцији од најмање 100 Mbps за сва европска домаћинства. Стратегија „Од фарме до трпезе“ потврдила је овај циљ позивајући на убрзање увођења брзог широкопојасног интернета у руралним подручјима како би се постигао циљ од 100% приступа до 2025. године.
  У марту 2021. године, Комисија је – у свом Дигиталном компасу 2030 – представила визију и путеве за дигиталну трансформацију Европе до 2030. године, фокусирајући се на четири главне области: (1) вештине, (2) безбедна и одржива дигитална инфраструктура, (3) дигитална трансформација предузећа и (4) дигитализација јавних услуга. Надовезујући се на Саопштење из 2016. године, Дигитални компас поставља циљ покривања свих европских домаћинстава гигабитном мрежом и свих насељених подручја 5G мрежом до 2030. године.
17-60-long_term_objective: >-
  Надовезујући се на Саопштење из 2016. године, Дигитални компас дефинише циљ да до 2030. године сва европска домаћинства буду покривена гигабитном мрежом, а сва насељена подручја 5G мрежом.
