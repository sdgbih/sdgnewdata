1-10-title: "Стопа сиромаштва према прагу од 8,30 USD дневно (ПКМ за 2021. годину) (% становништва) - замјенски индикатор"
1-10-definition: >-
  Стопа сиромаштва према граници од 8,30 USD дневно представља проценат становништва које живи са мање од 8,30 USD дневно, обрачунато према међународним цијенама из 2021. године.
1-10-intention: >-
  Поред међународне границе сиромаштва од 3,00 USD, Свјетска банка дефинише и вишу границу од 8,30 USD како би обухватила виши животни стандард у промјенљивом глобалном окружењу (ове вриједности одражавају прилагођавања за разлике у куповној моћи). Вриједност од 8,30 USD представља типичну границу сиромаштва за земље са вишим средњим дохотком, што је процијењени минимални износ новца потребан појединцу у овим земљама за покривање свакодневних основних потреба, укључујући храну, одјећу, смјештај, здравствену заштиту, образовање и остале основне трошкове.
1-10-methodology: >-
  Животни стандард и благостање људи у различитим земљама могу се мјерити на заједничкој скали прилагођавањем разлика у куповној моћи валута. Како се трошкови живота широм свијета мијењају, међународна граница сиромаштва периодично се ажурира на основу нових података о паритету куповне моћи (ПКМ). Посљедња измјена извршена је у септембру 2022. године, када је усвојена вриједност од 3,00 USD као међународна граница сиромаштва према ПКМ-у из 2021. године. Мјерила сиромаштва заснована на међународним границама настоје да одрже реалну вриједност границе сиромаштва константном међу земљама, једнаким принципом који се користи при поређењу кроз вријеме. Граница сиромаштва од 4,20 USD изведена је из типичних националних граница сиромаштва у земљама са нижим средњим дохотком. Граница сиромаштва од 8,30 USD изведена је из типичних националних граница сиромаштва у земљама са вишим средњим дохотком.
1-10-long_term_objective: >-
  Нема описа
1-20-title: "Јаз сиромаштва на 8,30 USD дневно (ПКМ за 2021. годину) (%) – замјенски индикатор"
1-20-definition: >-
  Јаз сиромаштва на нивоу од 8,30 USD дневно (ПКМ за 2021.) представља просјечни дефицит прихода или потрошње у односу на границу сиромаштва од 8,30 USD дневно (при чему се узима да несиромашно становништво нема дефицита), изражен као проценат те границе сиромаштва. Ова мјера одражава како дубину сиромаштва, тако и његову обимност.
1-20-intention: >-
  Праћење сиромаштва представља кључни елемент глобалне и националних развојних агенди. Мјера јаза сиромаштва одражава дубину сиромаштва, односно колико далеко испод границе сиромаштва за земље вишег средњег дохотка живи сиромашно становништво. Ова мјера служи за процјену укупне вриједности новчаних трансфера потребних за подизање сиромашних изнад границе сиромаштва, уз претпоставку да је сиромаштво привременог карактера те да не постоје административни трошкови реализације трансфера.
1-20-methodology: >-
  Међународна поређења процјена сиромаштва обухватају и концептуалне и практичне изазове. Државе примјењују различите дефиниције сиромаштва, што отежава досљедна поређења међу њима. Локалне границе сиромаштва обично имају већу куповну моћ у богатијим земљама, гдје се примјењују обухватнији стандарди у поређењу са сиромашним земљама. Услијед промјена у трошковима живота широм свијета, међународна граница сиромаштва повремено се усклађује примјеном нових података о паритету куповне моћи (ПКМ). Посљедња измјена извршена је у септембру 2022. године усвајањем границе сиромаштва од 3,00 USD на основу ПКМ-а из 2021. године. Због ревизија девизних курсева заснованих на ПКМ-у, стопе сиромаштва по појединачним земљама нису упоредиве са стопама објављеним у ранијим издањима. Приказани статистички подаци засновани су на подацима о потрошњи или, уколико они нису доступни, на анкетама о приходима.
1-20-long_term_objective: >-
  Нема описа
1-31-title: Стопа тешке материјалне и социјалне ускраћености према старосној групи и полу
1-31-definition: >-
  Домен „Приходи и услови живота“ (ЕУ-СИЛЦ) обухвата сљедеће теме: особе у ризику од сиромаштва или социјалне искључености, неједнакост прихода, расподјелу прихода и монетарно сиромаштво, услове живота и материјалну депривацију. Обухвата и ЕУ-СИЛЦ "ad hoc" модуле, који су организовани у колекције индикатора о одређеним темама.
  Прикупљање ЕУ-СИЛЦ је кључни инструмент за пружање информација које се захтјевају у оквиру Европског семестра ([1]) и Европског стуба социјалних права. Такође је главни извор података за потребе микросимулације и за израду брзих процјена расподјеле прихода и стопа сиромаштва. 
  2024. године, поред годишњих података, ЕУ-СИЛЦ је прикупила трогодишњи модул о здрављу дјеце, приступу здравственој заштити и специфичној депривацији дјеце и шестогодишњи модул о приступу услугама. Информације прикупљене у ЕУ-СИЛЦ односе се на сљедеће врсте статистичких јединица: приватна домаћинства и лица која живе у тим домаћинствима. Анекс II Уредбе ЕУ 2019/2242 дефинише специфичне статистичке јединице за сваку променљиву, док Анекс IV исте Уредбе одређује садржај извештаја о квалитету о организацији узорка истраживања у области прихода и услова живота, у складу са Уредбом ЕУ 2019/1700 Европског парламента и Савјета.
1-31-intention: >-
  Заједнички оквир ЕУ-СИЛЦ има за циљ да обезбједи стандардизацију на различитим нивоима. Концептуална стандардизација се постиже дефинисањем и документовањем заједничких концепата/дефиниција на којима се заснива свака мера/варијабла, обима и временске референце.
  У 2021. години ступило је на снагу ново законодавство о спровођењу ЕУ-СИЛЦ, ревидирајући и побољшавајући анкету (видети Одељак 3.4). Новим законодавством предвиђене су вишеструке измјене у прикупљању података ЕУ-СИЛЦ, посебно:

  •	спровео је потребу за следећим побољшањима: побољшана благовременост, са краћим роковима за достављање података ЕУ-СИЛЦ;

  •	реформулисала је захтјеве за прецизношћу на националном и регионалном нивоу (НУТС2) за индикатор ризика од сиромаштва или социјалне искључености и стопу трајног ризика од сиромаштва;

  •	додатне/измјењене ЕУ-СИЛЦ варијабле;

  •	прикупљање података са три фреквенције: језгро, трогодишњи модул и шестогодишњи модул, и препорука за проширење уздужног панела.
1-31-methodology: >-
  Циљна популација су приватна домаћинства и сва лица која сачињавају ова домаћинства која имају своје уобичајено пребивалиште на националној територији. Приватно домаћинство је особа која живи сама или група особа које живе заједно, обезбјеђујући себи основне животне потребе.
  Референтни период је година истраживања. За све земље, референтни период за варијабле прихода у ЕУ-СИЛЦ је претходна календарска година.
  Концепт тачности се односи на прецизност процена израчунатих из узорка, а не из цијеле популације. Тачност зависи од величине узорка, ефеката дизајна узорковања и структуре популације која се проучава. Поред тога, потребно је узети у обзир грешке у узорковању и грешке које нису у узорковању. Грешка у узорковању означава варијабилност која се насумично јавља услед коришћења узорка, а не пописа, а грешке које нису грешке у узорковању су грешке које се јављају у свим фазама процеса прикупљања и производње података.
  из 2021. године
  Уредба ЕУ 2019/1700 утврђује захтјеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Прилогом III те уредбе, карактеристике узорковања, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процену и процену варијансе.
1-31-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-40-title: Лица која живе у домаћинствима са веома ниским интензитетом рада, по старосним групама
1-40-definition: >-
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-40-intention: >-
  Људи старости од 0 до 64 године који живе у домаћинствима у којима су одрасли радили радно време једнако или мање од 20% њиховог укупног комбинованог потенцијала радног времена током претходне године.
  Одрасли број људи у доби од 18 до 64 године. Студенти узраста од 18 до 24 године; људи који су пензионисани у складу са својим само-дефинисаним тренутним економским статусом или који примају било коју пензију (осим породичне пензије); и људи у старосној групи од 60 до 64 године који су неактивни и живе у домаћинству где су главни приходи пензије, не узимају се у обзир.
  Индикатор је део мултидимензионалног индекса сиромаштва.
1-40-methodology: >-
  Референтни период је година истраживања. За све земље, референтни период за варијабле прихода у ЕУ-СИЛЦ је претходна календарска година.
  Индикатор је укључен као секундарни индикатор у Преглед социјалних индикатора за Европски стуб социјалних права и Акциони план ЕПСР-а, а дио је вишедимензионалног индекса сиромаштва. Може се сматрати дјелом глобалног индикатора СДГ 1.2.2 „Удио мушкараца, жена и деце свих узраста који живе у сиромаштву у свим његовим димензијама према националним дефиницијама“
  Од 2021. године Уредба (ЕУ) 2019/1700 предвиђа захтеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијанце.
1-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-41-title: Стопа запослених у ризику од сиромаштва
1-41-definition: >-
  Индикатор је дио индикатора Циљева одрживог развоја ЕУ (СДГ) који се користи за праћење напретка ка циљу одрживог развоја 1 искорењивању сиромаштва у свим његовим облицима свуда, што је уграђено у приоритете Европске комисије у оквиру „Економије која ради за људе“.
  Индикатор је укључен као секундарни индикатор у Преглед социјалних индикатора за Европски стуб социјалних права и Акциони план ЕПСР.
  Удио лица која су запослена и имају еквивалентни расположиви доходак испод прага ризика од сиромаштва, који је постављен на 60% националног медијана еквивалентног расположивог дохотка (након социјалних трансфера). За потребе овог индикатора, сматра се да је појединац запослен ако је био запослен више од половине референтне године. Индикатор се заснива на ЕУ-СИЛЦ (статистика о приходима, социјалној инклузији и условима живота).
1-41-intention: >-
  Запосленост се често тврди да је најбоља заштита од сиромаштва, тако да је један од циљева ЕУ стварање више и бољих радних места. Стога је важно измјерити удео сиромашних радника, људи који живе испод границе сиромаштва иако раде.
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-41-methodology: >-
  Индикатор је произведен у складу са високим стандардима квалитета европске статистике. Од 2005. године надаље, ЕУ-СИЛЦ се заснива на заједничком оквиру дефинисаном хармонизованим листама примарних и секундарних варијабли, заједничким концептима, препорученом дизајну, заједничким захтевима (као што су поступци импутације, пондерисање, израчунавање грешака у узорковању) и класификацијама са циљем максимизирања упоредивости произведених информација.
  Од 2021  године Уредба (ЕУ) 2019/1700 предвиђа захтеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
1-41-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
1-50-title: Приступачно становање - замјенски индикатор
1-50-definition: >-
  Приступачност становања у БиХ достигла је критичну тачку, гдје сиромашна домаћинства троше преко 40% својих прихода на становање. Многи фактори, попут потражње дијаспоре и страних инвеститора, фрагментиране и лоше координисане стамбене политике, довели су до тога да цијене буду ван домашаја становника. Системи социјалног становања остају неразвијени, док неформална тржишта закупа подстичу рањивост станара и лишавају владе пореских прихода.
1-50-intention: >-
  Сиромаштво и социјална искљученост штете индивидуалним животима и ограничавају могућности људи да остваре свој пуни потенцијал тако што утичу на њихово здравље и благостање и смањују образовне исходе. То заузврат смањује могућности за успјешан живот и додатно повећава ризик од сиромаштва. Без ефикасног образовања, здравствених, социјалних, пореских олакшица и система запошљавања, ризик од сиромаштва се преноси са једне генерације на другу. То узрокује опстанак сиромаштва и стога ствара више неједнакости, што може довести до дугорочног губитка економске продуктивности од стране читавих група друштва и ометати инклузивни и одрживи економски раст.
1-50-methodology: >-
  Поред анализе постојећих података/докумената, овај рад се ослања на увиде из осам полуструктурираних интервјуа спроведених са заинтересованим странама у Босни и Херцеговини, Црној Гори, Данској и Холандији. Међу испитаницима су били представници кантоналних министарстава, општинских власти, невладиних организација које раде на правима станара и приступачности становања, као и истраживачи специјализовани за системе становања. Ови интервјуи пружили су практичне перспективе о изазовима социјалног становања, неформалних тржишта изнајмљивања, празних некретнина и приступачности. 
1-50-long_term_objective: >-
  Нема описа
2-10-title: Стопа гојазности према индексу тjелесне масе (BMI)
2-10-definition: >-
  Овај индикатор мјери стопу гојазности према индексу тјелесне масе (BMI). BMI се израчунава као тјелесна маса у килограмима подијељена квадратом тјелесне висине изражене у метрима. Особе старости 18 година и више сматрају се гојазним ако је њихов BMI једнак или већи од 30.
  Категорија прекомјерне тјелесне масе обухвата особе са BMI вриједношћу 25 или већом и укључује категорије пред-гојазности и гојазности. Индикатор се изражава као проценат становништва старости 18 година и више.
2-10-definition_national: >-
  Индикатор мјери удио становништва старости 18 година и више које се, на основу индекса тјелесне масе (BMI), класификује као гојазно. BMI се израчунава на основу тјелесне масе и тјелесне висине, а вриједност BMI од 30 или више користи се за класификацију гојазности.
2-10-intention: >-
  Индикатор се користи за праћење нутритивног и здравственог стања становништва у контексту циљева одрживог развоја. Повећана преваленција гојазности представља један од изазова повезаних са исхраном, физичком активношћу и здрављем становништва. Индикатор је дио скупа индикатора ЕУ за циљеве одрживог развоја и користи се за праћење напретка у оквиру циљева 2 и 3.
2-10-intention_national: >-
  Индикатор пружа информације о распрострањености гојазности међу становништвом Босне и Херцеговине старости 18 година и више. Праћење овог показатеља омогућава сагледавање промјена у здравственом и нутритивном стању становништва кроз вријеме и доприноси праћењу циљева одрживог развоја који се односе на здравље и добробит.
2-10-methodology: >-
  Индикатор се заснива на индексу тјелесне масе (BMI), који представља однос тјелесне масе у килограмима и квадрата тјелесне висине у метрима. Према методологији Евростата, особе старости 18 година и више са BMI вриједношћу 30 или већом класификују се као гојазне.
  Подаци за овај индикатор потичу из Европског истраживања о здрављу (EHIS) и Истраживања о приходима и условима живота (SILC). EHIS подаци односе се на 2008, 2014. и 2019. годину, док су подаци из SILC-а доступни за 2017. и 2022. годину. SILC подаци за 2017. годину користе се за премошћавање периода између података EHIS-а за 2014. и 2019. годину.
2-10-methodology_national: >-
  Индикатор се на нивоу Босне и Херцеговине приказује у оквиру скупа података Евростата `sdg_02_10`. Према методологији Евростата, индикатор се заснива на подацима Европског истраживања о здрављу (EHIS) и Истраживања о приходима и условима живота (SILC). За податке из SILC-а референтне 2022. године користи се варијабла PH110, која се односи на индекс тјелесне масе (BMI). Евростат податке за индикатор добија на основу података прикупљених путем националних истраживања. Вриједност индикатора представља проценат становништва старости 18 година и више које је класификовано као гојазно, односно које има BMI вриједност 30 или више. За међународно поређење користи се серија коју објављује Евростат у оквиру скупа података `sdg_02_10`.
  На нивоу Босне и Херцеговине Министарство цивилних послова Босне и Херцеговине координише активности у области здравства и, у сарадњи са надлежним здравственим властима, учествује у ажурирању, верификацији и обради података за домаће и међународно извјештавање. Овај институционални оквир укључује сарадњу са надлежним здравственим институцијама у Босни и Херцеговини и размјену података са домаћим и међународним институцијама.
  Прикупљање података о здравственом стању становништва у Босни и Херцеговини суочава се са методолошким, логистичким и системским ограничењима која могу утицати на доступност, квалитет и упоредивост података. Међу важним ограничењима су могућа грешка самопроцјене, ограничења или застарјелост оквира узорка, висока стопа неодзива и дуги временски периоди између појединачних спровођења истраживања. Ова ограничења треба узети у обзир при тумачењу вриједности индикатора и процјени промјена кроз вријеме.
2-10-long_term_objective: >-
  За овај индикатор није утврђена посебна политичка квантитативна циљна вриједност на нивоу Европске уније. Индикатор се користи за праћење промјена стопе гојазности и напретка у остваривању циљева одрживог развоја повезаних са исхраном, здрављем и добробити становништва.
2-10-long_term_objective_national: >-
  За овај индикатор није утврђена посебна квантитативна циљна вриједност на нивоу Босне и Херцеговине. Напредак се прати на основу промјене стопе гојазности кроз доступне упоредиве податке, узимајући у обзир методологију и периодичност извора података.
2-20-title: Реални факторски доходак пољопривреде по годишњој радној јединици (AWU)
2-20-definition: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 2 о искорењивању глади и неухрањености; који је укључен у Приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Реални факторски доходак пољопривреде мери приход који генерише пољопривреда, а који се користи за надокнаду позајмљених, изнајмљених или поседованих фактора производње (капитал, рад и земљиште).
  Годишње радне јединице (ГРЈ) су дефинисане као рад са пуним радним временом (што одговара броју радних места са пуним радним временом) и израчунавају се дељењем укупног броја одрађених сати са просечним годишњим бројем сати одрађених на радним местима са пуним радним временом унутар економске територије. Ово се може тумачити као мера продуктивности рада у пољопривреди. Подаци потичу из Економских евиденција пољопривреде (ЕЕП), које пружају детаљне информације о приходима пољопривредног сектора.
2-20-intention: >-
  Намјера Циљ циља одрживог развоја 2 јесте обезбјеђивање приступа безбједној, хранљивој и довољној количини хране. Повећање пољопривредне продуктивности и прихода произвођача хране кључни су фактори у постизању овог циља. Извор података су Економски рачуни за пољопривреду (ЕРА), који користе пољопривредну статистику и административне информације. ЕРА су сателитски рачуни Европског система рачуна, који пружају комплементарне информације и концепте прилагођене специфичностима пољопривредне индустрије. Иако њихова структура веома одговара националним рачунима, њихово састављање захтева формулисање одговарајућих правила и метода.
2-20-methodology: >-
  Један од пет општих циљева Заједничке пољопривредне политике (ЗПП) јесте обезбеђивање праведног животног стандарда пољопривредника. ЗПП се финансира из два фонда: Европског фонда за гаранције у пољопривреди (ЕФГФ), који финансира директна плаћања пољопривредницима, као и тржишне мере, и Европског пољопривредног фонда за рурални развој (ЕАФРД), који финансира програме руралног развоја. Субвенције ЕУ и директна плаћања постале су значајан удео факторског дохотка у пољопривреди.
2-20-long_term_objective: >-
  повећање продуктивности и профитабилности пољопривредног сектора кроз:

  - Повећање реалног факторског дохотка

  - Смањење пољопривредне радне снаге

  - Стабилизацију пољопривредног дохотка
2-30-title: Државна подршка истраживању и развоју пољопривреде
2-30-definition: >-
  Индикатор се односи на издвајања из државног буџета за истраживање и развој (GBARD) за пољопривреду. Подаци GBARD мере владину подршку активностима истраживања и развоја (R&D), или, другим речима, колико владе дају приоритет јавном финансирању истраживања и развоја. Подаци GBARD се прикупљају коришћењем смерница наведених у ОЕЦД-овом Фраскати приручнику из 2015. године и Европском методолошком приручнику за статистику пословања за статистику истраживања и развоја из 2023. године. Подаци су изражени у текућим ценама, што значи да на укупни развој индикатора делимично утиче и општа инфлација цена.
2-30-definition_national: >-
  Индикатор приказује издвајања из јавних буџета за истраживање и развој (GBARD) намијењена пољопривреди. GBARD подаци мјере јавну подршку активностима истраживања и развоја и пружају информацију о обиму јавног финансирања истраживања и развоја у области пољопривреде. Вриједности се исказују у милионима еура, у текућим цијенама.
2-30-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 2 о искорењивању глади и неухрањености; који су уграђени у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“. 
  Циљ одрживог развоја 2 – између осталог – има за циљ да обезбеди приступ безбедној, хранљивој и довољној храни. Побољшање пољопривредне продуктивности и одржавање одрживих и отпорних система производње хране кључни су фактори у постизању овог циља и у великој мери зависе од повећаних улагања у истраживање и развој у пољопривреди, храни и исхрани.
2-30-intention_national: >-
  Индикатор пружа информације о обиму јавног финансирања истраживања и развоја усмјереног на пољопривреду. Праћење издвајања за истраживање и развој у овој области доприноси праћењу улагања која могу подржати развој пољопривредне продуктивности, одрживих и отпорних система производње хране и унапређење безбједности хране.
2-30-methodology: >-
  Земље прикупљају податке GBARD-а пратећи препоруке из Фраскати приручника. Међу неколико методолошких питања која могу утицати на поређења између земаља су фаза у буџетском процесу из које се црпе коначни подаци GBARD-а (коначна буџетска средства или стварни издаци); укључивање ПДВ-а или средстава ЕУ за истраживање и развој.
  Подаци GBARD-а су разврстани по:

  - Социо-економским циљевима (SEO) у складу са Номенклатуром за анализу и поређење научних програма и буџета (NABS 2007). - (Види Прилог 3 на дну странице).

  - Начин финансирања: финансирање пројеката и институционално финансирање (необавезни подаци).
  Део GBARD-а додељен транснационалној сарадњи у истраживању и развоју даље је разврстан у три специфичне категорије: транснационални јавни извођачи истраживања и развоја; транснационални јавни програми истраживања и развоја широм Европе; и билатерални или мултилатерални јавни програми истраживања и развоја успостављени између влада држава чланица или са ЕФТА и земљама кандидатима.
2-30-methodology_national: >-
  Подаци за индикатор у Босни и Херцеговини заснивају се на подацима о државним буџетским издвајањима за истраживање и развој (GBARD) за социоекономски циљ пољопривреде. Подаци се прикупљају и обрађују у оквиру статистике истраживања и развоја у складу са међународним методолошким стандардима који се користе за GBARD, укључујући смјернице OECD-овог Frascati приручника из 2015. године и Европског методолошког приручника за пословну статистику за статистику истраживања и развоја из 2023. године. За потребе међународне упоредивости индикатор се приказује у оквиру скупа података Eurostata sdg_02_30. Подаци су изражени у милионима еура и у текућим цијенама.
  Приликом поређења података између земаља треба узети у обзир методолошке разлике које могу настати због фазе буџетског процеса из које се преузимају подаци, односно да ли се подаци заснивају на коначним буџетским издвајањима или стварним издацима, као и због начина укључивања ПДВ-а или средстава Европске уније за истраживање и развој. Подаци за Босну и Херцеговину које објављује Агенција за статистику Босне и Херцеговине представљају националну серију података за овај индикатор.
2-30-long_term_objective: >-
  Дугорочни циљ до 2030. године је транзиција са базичног институционалног финансирања на системску подршку иновацијама и руралном развоју, уз повећање издвајања јавних средстава за истраживање и развој у пољопривреди на минимално 2% до 3% укупног буџета.
2-30-long_term_objective_national: >-
  За овај индикатор није утврђена посебна квантитативна циљна вриједност на нивоу Босне и Херцеговине. Кретање индикатора прати се кроз промјене издвајања јавних средстава за истраживање и развој у области пољопривреде кроз вријеме, на основу доступне временске серије.
2-40-title: Површина под органском пољопривредом
2-40-definition: >-
  Овај индикатор представља удио укупно коришћене пољопривредне површине (UAA) која је под органском пољопривредом, укључујући постојеће површине под органском производњом и површине које су у процесу конверзије. Органска пољопривреда је метода производње која ставља посебан нагласак на заштиту животне средине и дивљих животиња, а у погледу сточарске производње и на добробит животиња. Она избјегава или у великој мјери смањује употребу синтетичких хемијских инпута, као што су ђубрива, пестициди, адитиви и медицински производи.
2-40-definition_national: >-
  Опис пољопривредне површине (КПЗ) коју заузима органска пољопривреда (постојеће органски обрађене површине и површине које пролазе кроз конверзију). Органска пољопривреда је метод производње који ставља највећи нагласак на заштиту животне средине и дивљих животиња, а у погледу сточарске производње и на разматрања добробити животиња. Избегава или у великој мери смањује употребу синтетичких хемијских улагања, као што су ђубрива, пестициди, адитиви и медицински производи.
2-40-intention: >-
  Органска пољопривреда представља један од приступа унапређењу одрживости пољопривредне производње и заштити природних ресурса. Европска унија укључује овај индикатор у свој оквир за праћење циљева одрживог развоја јер је повећање површина под органском пољопривредом повезано са циљевима ЕУ у области одрживе пољопривреде, заштите животне средине и биодиверзитета.
2-40-intention_national: >-
  Органска пољопривреда у Босни и Херцеговини почела се развијати 1990-их година. Упркос томе што се површина под органском производњом између 2014. и 2022. године повећала осам пута, укупно пољопривредно земљиште под овим узгојем достигло је скромних 2.495 ha у 2022. години. Један од циљева стратегија руралног развоја за период 2021–2027. јесте остваривање значајног раста органске пољопривреде.
2-40-methodology: >-
  Индикатор се може повезати са глобалним циљем одрживог развоја 2.4, који се односи на одрживе системе производње хране и примјену отпорних пољопривредних пракси. Међутим, индикатор SDG 2.40 је дио оквира Европске уније за праћење циљева одрживог развоја и посебно прати удио коришћене пољопривредне површине под органском пољопривредом.
  У оквиру Европског зеленог плана и стратегије „Од њиве до трпезе“, Европска унија је поставила циљ да најмање 25% пољопривредног земљишта у ЕУ буде под органском пољопривредом до 2030. године. Индикатор прати напредак према овом циљу кроз годишње податке о удјелу коришћене пољопривредне површине под органском производњом, укључујући површине у процесу конверзије.
2-40-methodology_national: >-
  Индикатор се може повезати са глобалним индикатором циљева одрживог развоја 2.4.1 „Удио пољопривредног подручја под продуктивном и одрживом пољопривредом“. Иако органска пољопривреда није експлицитно наведена у Агенди 2030, она представља производну методу која ставља посебан нагласак на заштиту животне средине и дивљих животиња, а у погледу сточарске производње и на добробит животиња. Органска пољопривреда избјегава или у великој мјери смањује употребу синтетичких хемијских инпута, као што су ђубрива, пестициди, адитиви и медицински производи.
  У Босни и Херцеговини развој органске пољопривреде представља један од праваца унапређења одрживе пољопривредне производње и заштите природних ресурса. Праћење удјела пољопривредног земљишта под органском производњом омогућава праћење промјена у обиму органске пољопривреде и њеног доприноса одрживијим праксама у пољопривреди.
2-40-long_term_objective: >-
  Повећати удио пољопривредног земљишта у Европској унији под органском пољопривредом на најмање 25% до 2030. године.
2-40-long_term_objective: >-
  Повећати удио пољопривредног земљишта у Босни и Херцеговини под органском производњом на 0,36% до 2030. године, што одговара циљаној површини од око 4.000 ha.
2-53-title: Употреба и ризик од хемијских пестицида
2-53-definition: >-
  Индикатор прати трендове у употреби и ризику хемијских пестицида у ЕУ и њеним државама чланицама. Употреба пестицида са собом носи ризике и утицаје на људско здравље и животну средину. Индикатор се заснива на количинама хемијских активних супстанци садржаних у пестицидима који се стављају на тржиште (продају), а самим тим и користе, у свакој држави чланици, и на опасним својствима ових активних супстанци. Подаци су представљени као индекс у односу на просечне резултате за период од 2015. до 2017. године.
2-53-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 2 о искорењивању глади и неухрањености; који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбедност хране, вода и природа“.
  Циљ одрживог развоја 2 има за циљ да обезбеди приступ безбедној, хранљивој и довољној храни. Одрживи и отпорни системи производње хране су кључни фактор у постизању овог циља. Уз промоцију органске пољопривреде, интегрисано управљање штеточинама (ИУБ) је један од алата за наглашавање раста здравих усева подстицањем природних механизама сузбијања штеточина и смањењем или минимизирањем ризика по људско здравље и животну средину.
  „Акциони план за нулто загађење“ ЕУ има за циљ да смањи употребу и ризик од хемијских пестицида и употребу опаснијих пестицида за 50% до 2030. године.
2-53-methodology: >-
  Израчунавање засновано на количинама хемијских активних супстанци које су одобрене као кандидати за замену у складу са чланом 24 Уредбе (ЕЗ) бр. 1107/2009, садржаних у средствима за заштиту биља која се стављају на тржиште у средствима за заштиту биља сваке године пријављеним према Уредби (ЕЗ) бр. 1185/2009 у складу са Уредбом (ЕЗ) бр. 1107/2009 и достављеним у складу са Прилогом I Уредбе (ЕЗ) бр. 1185/2009.
2-53-long_term_objective: >-
  Смањити употребу и ризик хемијских пестицида за 50% до 2030. године у поређењу са трогодишњом основном вриједношћу (просек за период од 2015. до 2017. године)
2-60-title: Емисије амонијака из пољопривреде
2-60-definition: >-
  Индикатор мјери емисије амонијака (NH₃) настале као резултат пољопривредне производње. Ове емисије настају усљед управљања стајским ђубривом, примјене неорганских азотних ђубрива и животињског стајског ђубрива на земљиште, као и урина и измета животиња на испаши. Емисије амонијака исказују се у тонама и килограмима по хектару коришћене пољопривредне површине (UAA). Подаци за овај индикатор потичу из инвентара загађења ваздуха Европске агенције за животну средину (EEA), израђеног у оквиру Конвенције о прекограничном загађењу ваздуха на великим удаљеностима (LRTAP), и у потпуности су усклађени са националним инвентарима загађења ваздуха држава чланица ЕУ.
  Подаци о коришћеној пољопривредној површини (UAA) потичу из годишње статистике усјева Евростата. Дефиниција овог индикатора заснива се на индикатору Заједничке пољопривредне политике (ЗПП) C45 „Емисије из пољопривреде“.
2-60-definition_national: >-
  Индикатор мјери емисије амонијака (NH₃) настале као резултат пољопривредне производње. Ове емисије настају усљед управљања стајским ђубривом, примјене неорганских азотних ђубрива и животињског стајског ђубрива на земљиште, као и урина и измета животиња на испаши. Емисије амонијака исказују се у тонама и килограмима по хектару коришћене пољопривредне површине (UAA).
  Подаци омогућавају праћење емисија амонијака из пољопривреде у Босни и Херцеговини и њиховог интензитета по јединици коришћене пољопривредне површине.
2-60-intention: >-
  Индикатор је дио скупа индикатора одрживог развоја ЕУ и користи се за праћење напретка ка Циљу одрживог развоја 2 о искорјењивању глади и потхрањености, који је уграђен у приоритете Европске комисије за период 2024–2029. SDG 2, између осталог, тежи одрживим и отпорним системима производње хране. Амонијак (NH₃) је безбојан, оштрог мириса и корозиван гас који настаје разградњом органске биљне материје и излучевинама људи и животиња. Када се испусти у атмосферу, амонијак доприноси загађењу ваздуха. Пољопривредни сектор и даље је доминантни извор емисија амонијака у ЕУ.
  Мјере спроведене у оквиру Заједничке пољопривредне политике (ЗПП) и Оквирне директиве о водама допринијеле су смањењу емисија амонијака из пољопривреде у ЕУ од 1990-их. Промјене пољопривредних пракси довеле су, између осталог, до смањења употребе азотних ђубрива и смањења густине стоке по хектару. Директива о националним обавезама смањења емисија (NEC директива) утврђује националне обавезе смањења емисија за државе чланице и ЕУ за пет важних загађивача ваздуха, укључујући амонијак.
2-60-intention_national: >-
  Индикатор се користи за праћење напретка Босне и Херцеговине ка Циљу одрживог развоја 2, који, између осталог, подразумијева одрживе и отпорне системе производње хране. Амонијак (NH₃) је значајан загађивач ваздуха, а пољопривреда представља доминантан извор емисија амонијака.
  Смањење емисија амонијака доприноси смањењу загађења ваздуха, ацидификације и еутрофикације, као и одрживијем управљању азотом у пољопривреди.
2-60-methodology: >-
  Индикатор прати трендове емисија амонијака из пољопривреде у ЕУ, исказаних укупном количином емисија и количином емисија по хектару коришћене пољопривредне површине. Емисије обухватају емисије настале управљањем стајским ђубривом, примјеном неорганских азотних ђубрива и животињског стајског ђубрива на земљиште, као и таложењем урина и измета животиња на испаши. Подаци се заснивају на националним инвентарима емисија које државе пријављују у оквиру Конвенције о прекограничном загађењу ваздуха на великим удаљеностима (LRTAP), а за државе чланице ЕУ усклађени су са инвентаром ЕУ који саставља EEA.
2-60-methodology_national: >-
  Индикатор прати трендове емисија амонијака из пољопривреде у Босни и Херцеговини, исказаних укупном количином емисија и количином емисија по хектару коришћене пољопривредне површине. Емисије обухватају емисије настале управљањем стајским ђубривом, примјеном неорганских азотних ђубрива и животињског стајског ђубрива на земљиште, као и таложењем урина и измета животиња на испаши. Смањење емисија може се постићи унапређењем пољопривредних пракси, ефикаснијим управљањем азотом и стајским ђубривом, рационалнијом примјеном минералних ђубрива и мјерама за смањење губитака амонијака из пољопривредне производње.
2-60-long_term_objective: >-
  Дугорочни референтни циљ за овај индикатор је вриједност од 8 kg емисија амонијака по хектару коришћене пољопривредне површине (UAA).
2-60-long_term_objective_national: >-
  Дугорочни циљ за Босну и Херцеговину у оквиру индикатора SDG_02_60 је смањење емисија амонијака (NH₃) из пољопривреде по хектару коришћене пољопривредне површине, уз унапређење одрживих пољопривредних пракси и ефикасније управљање азотом, стајским ђубривом и минералним ђубривима.
3-12-title: Очекивани животни вијек у добром здрављу на основу самопроцјене здравственог стања
3-12-definition: >-
  Овај индикатор процењује број година колико се очекује да ће особа живети у добром перципираном здрављу. Заснован је на подацима о смртности у комбинацији са подацима о самопроцени здравља, како је пријављено у Статистици ЕУ о приходима и условима живота (EU-SILC).
3-12-methodology: >-
  Добро здравље није само вредно за појединца као главни фактор квалитета живота, благостања и друштвеног учешћа, већ је и основни предуслов за општи економски раст. Праћење циља одрживог развоја 3 у контексту ЕУ фокусира се на теме здравог живота, фактора здравља, узрока смрти и здравствене заштите.
3-12-long_term_objective: >-
  Нема описа
3-20-title: Удио људи са добром или веома добром перцепцијом здравља према полу
3-20-definition: >-
  Индикатор је субјективна мјера о томе како људи генерално процјењују своје здравље на скали од „веома доброг“ до „веома лошег“. Изражава се као удио популације старије од 16 година која себе доживљава као „доброг“ или „веома доброг“ здравља.
  Утврђено је да су индикатори перципираног општег здравља добар предиктор будуће употребе здравствене заштите и смртности људи. Подаци потичу из Статистике ЕУ о приходима и условима живота (ЕУ СИЛЦ).
3-20-intention: >-
  Од 2021. године Уредба (ЕУ) 2019/1700 предвиђа захтјеве који се односе на географску покривеност, детаљне карактеристике узорка, укључујући подузорковање, у складу са Анексом III, заједничке периоде прикупљања података, заједничке стандарде за уређивање и импутацију, пондерисање, процјену и процјену варијансе.
3-20-methodology: >-
  Од 2021. године надаље, ЕУ-СИЛЦ се заснива на заједничком оквиру дефинисаном хармонизованим листама примарних и секундарних варијабли, заједничким концептима, препорученом дизајну, заједничким захтјевима (као што су поступци импутације, пондерисање, израчунавање грешака у узорковању) и класификацијама са циљем максимизирања упоредивости произведених информација. Детаљи се могу наћи у метаподацима изворних скупова података.
3-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 80.
3-30-title: Преваленција пушења према полу
3-30-definition: >-
  Овај индикатор мјери проценат становништва старости 15 и више година које је пријавило да тренутно пуши цигарете, цигаре, цигарилосе или лулу. Не укључује употребу других дуванских и сродних производа као што су електронске цигарете и снуф. Подаци се прикупљају путем истраживања Евробарометра и заснивају се на самоизвештају о коришћењу током интервјуа лицем у лице у домовима људи.
3-30-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-30-methodology: >-
  Индикатор се може сматрати сличним глобалном индикатору СДГ 3.а.1 „Старосно стандардизована распрострањеност тренутне употребе дувана код особа старијих од 15 година“.
  Неколико директива ЕУ има за циљ заштиту грађана од опасних ефеката пушења, укључујући Директиву о дуванским производима, Директиву о оглашавању дувана и Директиву о опорезивању дувана.
3-30-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 12
3-42-title: Стандардизована смртност која се може спријечити и лијечити
3-42-definition: >-
  Смртност која се може избећи обухвата узроке смртности који се могу спријечити и излијечити. Смртност која се може спријечити односи се на смртност која се углавном може избјећи ефикасним интервенцијама јавног здравља и примарне превенције (спроведене прије појаве болести/повреда како би се смањила инциденца). Излијечива смртност се углавном може избјећи благовременим и ефикасним здравственим интервенцијама, укључујући секундарну превенцију и лечење (након појаве болести).
3-42-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”. 
  Главни предуслов за постизање ових циљева је универзална здравствена покривеност; приступ услугама сексуалног и репродуктивног здравља и безбједним, приступачним и ефикасним лијековима и вакцинама за све. Стандардизоване стопе смртности које се користе за овај индикатор узимају у обзир да земље са већим удјелом старијих становника такође имају веће стопе смртности.
3-42-methodology: >-
  Укупна стопа смртности која се може избјећи обухвата низ заразних болести, неколико врста карцинома, ендокриних и метаболичких болести, као и неке болести нервног, циркулаторног, респираторног, дигестивног и генитоуринарног система, неке болести везане за трудноћу, порођај и перинатални период, низ урођених малформација, нежељених ефеката медицинске и хируршке неге, списак повреда и поремећаја везаних за алкохол и дрогу.
  Смртност која се може лијечити углавном се може избећи правовременим и ефикасним интервенцијама здравствене заштите, укључујући секундарну превенцију и лијечење (након појаве болести како би се смањила смртност од случаја). Подаци су представљени као стандардизоване стопе смртности, што значи да су прилагођени стандардној старосној дистрибуцији како би се измјериле стопе смртности независно од различитих старосних структура популација како би се смањила смртност од случаја).
3-42-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 150.
3-60-title: Самопријављена незадовољена потреба за љекарским прегледом и његом по полу
3-60-definition: >-
  Овај индикатор мјери удио становништва старости 16 и више година које пријављује незадовољене потребе за медицинском његом из једног од сљедећих разлога: „финансијски разлози“, „листа чекања“ и „предалеко за путовање“. Самопријављене незадовољене потребе односе се на сопствену процјену особе да ли јој је потребан љекарски преглед или љечење (без стоматолошке његе), али га није обавила или га није тражила.
  Пошто друштвене норме и очекивања могу утицати на одговоре на питања о незадовољеним потребама за његом, потребан је опрез када се упоређују разлике у извјештавању о незадовољеним љекарским прегледима у различитим земљама. Поред тога, различита организација здравствених услуга је још један фактор који треба узети у обзир приликом анализе података. Коначно, постоје и неке варијације у анкетним питањима у различитим земљама и током времена.
3-60-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и благостању и циљу одрживог развоја 1 о сиромаштву као вишенамјенском индикатору (МПИ); који су уграђени у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-60-methodology: >-
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
  Универзална здравствена покривеност је циљ Повеље ЕУ о основним правима. Један од три приоритета здравствене политике ЕУ је повећање доступности здравствене заштите. Поред тога, један од 20 принципа Европског стуба социјалних права је да свако има право на правовремени приступ приступачној, превентивној и куративној здравственој заштити доброг квалитета.
3-70-title: Потрошња антибиотика у заједници и болничком сектору – дефинисане дневне дозе (ДДД) дневно
3-70-definition: >-
  Овај индикатор мјери укупну потрошњу антимикробних средстава (АМЦ) у заједници и болничком сектору. АМЦ се изражава као број дефинисаних дневних доза (ДДД) на 1000 становника дневно. Подаци се односе на класификациону ознаку Анатомско-терапијско-хемијски (АТЦ) Ј01 „Антибактеријски производи за системску употребу“. Подаци за агрегат ЕУ приказани су као популационо пондерисана средина и укључују импутације и корекције.
3-70-intention: >-
  Користи се за праћење напретка ка циљу одрживог развоја 3 о добром здрављу и добробити који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Подршка људима, јачање нашег друштва и нашег социјалног модела”.
3-70-methodology: >-
  Главни предуслов за постизање ових циљева је универзална здравствена покривеност; приступ услугама сексуалног и репродуктивног здравља и безбједним, приступачним и ефикасним лијековима и вакцинама за све. Стандардизоване стопе смртности које се користе за овај индикатор узимају у обзир да земље са већим удјелом старијих становника такође имају веће стопе смртности.
  Индикатор је сличан глобалном СДГ индикатору 3.д.2 „Проценат инфекција крвотока услед одабраних антимикробно резистентних организама“.
3-70-long_term_objective: >-
  Смањити укупну потрошњу антибиотика код људи за 20% до 2030. године у поређењу са 2019. годином.
4-10-title: Рано напуштање образовања и обуке по полу
4-10-definition: >-
  Индикатор мјери уиео становништва старости од 18 до 24 године са највише нижим средњим образовањем које није било укључено у било какво (формално или неформално) образовање или обуку током четири недеље које су претходиле истраживању.
4-10-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању и циљу одрживог развоја 5 о родној равноправности, који су уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-10-methodology: >-
  Резолуција Савета поставља циљ на нивоу ЕУ да удио особа које рано напуштају образовање и обуку, мјерен овим индикатором циљева одрживог развоја, буде мањи од 9% до 2030. године. Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
  Образовање и обука су кључни покретачи раста и запошљавања јер помажу у побољшању запослености, продуктивности, иновација и конкурентности. Наставак образовања након основног нивоа је важан јер је вјероватније да ће људи са вишим квалификацијама бити запослени и мање је вјероватно да ће се суочити са сиромаштвом у економији заснованој на знању. Особе са ниским нивоом образовања не само да се могу суочити са већим потешкоћама на тржишту рада, већ имају и већи ризик од сиромаштва и социјалне искључености.
4-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 4.
4-20-title: Високо образовање према полу
4-20-definition: >-
  Индикатор мјери удио становништва старости 25-34 године које је успјешно завршило терцијарне студије (нпр. на универзитету или вишој техничкој установи). Постигнуће у терцијарном образовању односи се на ИСЦЕД (Међународна стандардна класификација образовања) нивое 5–8 из 2011. године за податке од 2014. године надаље и на ИСЦЕД нивое 5–6 из 1997. године за податке до 2013. године. Индикатор се заснива на Анкети о радној снази ЕУ (ЕУ-ЛФС).
4-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању и циљу одрживог развоја 5 о родној равноправности, који су уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-20-methodology: >-
  Образовање и обука су кључни покретачи раста и запошљавања јер помажу у побољшању запослености, продуктивности, иновација и конкурентности. Наставак образовања након основног нивоа је важан јер је вјероватније да ће људи са вишим квалификацијама бити запослени и мање је вјероватно да ће се суочити са сиромаштвом у економији заснованој на знању. Особе са ниским нивоом образовања не само да се могу суочити са већим потешкоћама на тржишту рада, већ имају и већи ризик од сиромаштва и социјалне искључености.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
4-20-long_term_objective: >-
  Циљ је подићи удио становништва у доби од 25 до 34 године са завршеним високим образовањем на најмање 52% до 2030. године.
4-31-title: Учешће у образовању у раном дјетињству по полу (дјеца узраста 3 године и више)
4-31-definition: >-
  Индикатор мјери удио дјеце између треће године и почетног узраста обавезног основног образовања која су учествовала у образовању и њези у раном детињству (ЕЦЕЦ) које се може класификовати као ИСЦЕД ниво 0 према Међународној стандардној класификацији за образовање (ИСЦЕД 2011). Да би се ЕЦЕЦ програми класификовали као ИСЦЕД ниво 0, морају бити намјерно осмишљени тако да подржавају когнитивни, физички и социо-емоционални развој дјетета. Почетни узраст обавезног основног образовања варира од земље до земље. Учешће дјеце у програмима који нису намјерно осмишљени да подрже развој дјетета (као што су програми само за бригу о дјеци) није укључено у овај индикатор.
4-31-intention: >-
  Намјера	Индикатори који се користе за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“, „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Заштита наше демократије, очување наших вриједности“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-31-methodology: >-
  Како се образовање и брига у раном дјетињству све више препознају као саставни дио система образовања и обуке, Резолуција Савјета поставља циљ ЕУ да учешће у образовању и бризи у раном дјетињству буде најмање 96% дјеце између три године и почетног узраста за обавезно основно образовање до 2030. године.
4-31-long_term_objective: >-
  Циљ је постићи стопу учешћа од 96% дјеце (од 3 године до почетка обавезног основног образовања) до 2030. године.
4-40-title: Петнаестогодишњаци са слабим успјехом у читању, математици или природним наукама
4-40-definition: >-
  Индикатор мјери удио петнаестогодишњих ученика који не достижу ниво 2 („ниво основних вјештина“) на PISA скали у три основне области: читању, математици и природним наукама. Подаци потичу из Програма за међународну процјену ученика (PISA), међународног истраживања које процјењује знања и вјештине петнаестогодишњих ученика и пружа податке за праћење исхода образовних система.
4-40-definition_national: >-
  Индикатор мјери удио петнаестогодишњих ученика у Босни и Херцеговини који нису достигли ниво 2, односно основни ниво постигнућа, у областима читања, математике и природних наука.
4-40-intention: >-
  Индикатор се користи за праћење напретка према Циљу одрживог развоја 4 – Квалитетно образовање. Праћење удјела петнаестогодишњих ученика са ниским постигнућима омогућава праћење основних нивоа знања и вјештина у читању, математици и природним наукама.
  Индикатор је повезан са стратешким оквиром Европске уније за сарадњу у образовању и оспособљавању према Европском образовном простору за период 2021–2030. године.
4-40-intention_national: >-
  Индикатор прати исходе образовања у Босни и Херцеговини и доприноси праћењу Циља одрживог развоја 4 – Квалитетно образовање. Омогућава праћење удјела петнаестогодишњих ученика који нису достигли основни ниво постигнућа у кључним областима знања и вјештина.
  Босна и Херцеговина је први пут учествовала у PISA истраживању 2018. године. Истраживање у Босни и Херцеговини припрема и спроводи Агенција за предшколско, основно и средње образовање у сарадњи са образовним властима.
4-40-methodology: >-
  Резолуцијом Савјета Европске уније о стратешком оквиру за европску сарадњу у образовању и оспособљавању за период 2021–2030. године постављен је циљ да удио петнаестогодишњака са ниским постигнућима у читању, математици и природним наукама буде мањи од 15% до 2030. године.Нижа вриједност индикатора представља повољнији резултат, јер означава мањи удио ученика који не достижу ниво 2.
4-40-methodology_national: >-
  Подаци за Босну и Херцеговину заснивају се на резултатима PISA 2018 истраживања. Вриједности индикатора представљају удио петнаестогодишњих ученика који нису достигли ниво 2 у читању, математици и природним наукама. За овај индикатор доступни су подаци за 2018. годину. Због тога се на националном нивоу не израчунава аутоматски статус напретка.
4-40-long_term_objective: >-
  Циљ Европске уније је да удио петнаестогодишњих ученика са ниским постигнућима у читању, математици и природним наукама буде мањи од 15% до 2030. године.
4-40-long_term_objective_national: >-
  Дугорочни циљ је унапређење квалитета образовања у Босни и Херцеговини и смањење удјела петнаестогодишњих ученика који не достижу основни ниво постигнућа у читању, математици и природним наукама.
4-60-title: Учешће одраслих у учењу по полу
4-60-definition: >-
  Индикатор мјери удио особа старости од 25 до 64 године које су изјавиле да су стекле формално или неформално образовање и обуку у четири недеље које су претходиле истраживању (бројилац). Именилац се састоји од укупне популације исте старосне групе, искључујући оне који нису одговорили на питање „учешће у образовању и обуци“. Образовање одраслих обухвата активности формалног и неформалног учења које се односе на посао и које се не односе на посао. Обично се односи на активности учења након завршетка иницијалног образовања.
4-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Нови план за одрживи просперитет и конкурентност Европе“.
  Савјет Европске уније је 26. фебруара 2021. године усвојио Резолуцију о стратешком оквиру за европску сарадњу у образовању и обуци ка Европском образовном простору и шире (2021–2030),оквир који се бави пет стратешких приоритета: (1) Побољшање квалитета, равноправности, инклузије и успјеха за све у образовању и обуци; (2) Остваривање цијеложивотног учења и мобилности за све; (3) Унапређење компетенција и мотивације у образовној професији; (4) Јачање европског високог образовања; и (5) Подржавање зелене и дигиталне транзиције у образовању и обуци и кроз њих.
4-60-methodology: >-
  Учење одраслих покрива најдужи период у животу учења особе. То укључује унапређење и развој вјештина, прилагођавање технолошком развоју, унапрјеђење каријере особе или помагање њеном повратку на тржиште рада (усавршавање и преквалификација). Штавише, од кључног је значаја за одржавање доброг здравља, остајање активним у заједници и потпуно укључивање у све аспекте друштва.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
4-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 28.
4-70-title: Удио појединаца који посједују барем основне дигиталне вјештине, по полу
4-70-definition: >-
  Овај индикатор мјери удио особа старости од 16 до 74 године који посједују најмање основне дигиталне вештине. То је композитни индикатор заснован на одабраним активностима које појединци обављају на интернету у одређеним областима: информациона и податковна писменост, комуникација и сарадња, креирање дигиталних садржаја, безбједност и ријешавање проблема. Индикатор оцјењује дигиталне вјештине класификоване у шест нивоа, од којих два највиша чине основни или изнад основног нивоа дигиталних вјештина. Индикатор се заснива на подацима из истраживања ЕУ о употреби ИКТ у домаћинствима и од стране појединаца.
4-70-intention: >-
  Индикатори који се користе за праћење напретка ка циљу одрживог развоја 4 о квалитетном образовању, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“, „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Заштита наше демократије, очување наших вриједности“.
4-70-methodology: >-
  Циљ одрживог развоја 4 настоји да обезбједи људима приступ правичном и квалитетном образовању у свим фазама живота, као и да повећа број младих и одраслих који имају релевантне вјештине за запошљавање, пристојне послове и предузетништво. Циљ предвиђа и отклањање родних и доходовних неједнакости у приступу образовању.
  Дигиталне вештине су од критичне вриједности за рад, учење и социјалну интеракцију.
4-70-long_term_objective: >-
  Европски акциони план за стуб социјалних права и Дигитални компас до 2030. године: европски пут ка дигиталној деценији поставили су циљ да ЕУ повећа удио људи старости од 16 до 74 године који имају барем основне дигиталне вјештине на 80% до 2030. године.
5-11-title: Физичко и сексуално насиље над женама по старосним групама
5-11-definition: >-
  Индикатор мјери удио жена у доби од 18 и више година које су навеле да су доживјеле физичко и/или сексуално насиље од стране интимног партнера или особе која им није партнер у периоду од 12 мјесеци прије интервјуа. Истраживање је спроведено у прољеће/љето 2018. године.
5-11-intention: >-
  Ови подаци приказују распрострањеност физичког и сексуалног насиља над женама у доби од 18 до 74 године у Босни и Херцеговини, а прикупљени су у сврху праћења показатеља Циља одрживог развоја 5 (SDG 5: Родна равноправност), са нагласком на индикатор EU SDG 5.11. Приказане стопе обухватају насиље од стране интимних партнера и особа које им нису партнери, укључујући преваленцију током живота (од 15. године) и у посљедњих 12 мјесеци.
5-11-methodology: >-
  Ова студија је заснована на методологији коју је Агенција ЕУ за основна права (FRA) користила у свом истраживању из 2012. године о насиљу над женама у 28 држава чланица Европске уније, па је са њом и упоредива. Европски институт за родну равноправност (EIGE) у свом раду користи податке из студије FRA, а студија OSI обухвата одабрана питања Евробарометра о ставовима према насиљу над женама. Дизајн узорка и пондери засновани су на попису становништва из 2013. године и обухватају популацију жена старосне доби од 18 до 74 године које живе у Босни и Херцеговини.
5-11-long_term_objective: >-
  Осигурати поуздану, међународно упоредиву и на доказима утемељену емпиријску основу за праћење показатеља EU SDG 5.11 у складу с методолошким стандардима Евростата. Крајњи циљ прикупљања ових података јест усмјеравање јавних политика и законодавства према потпуном искорјењивању родно заснованог насиља, јачању капацитета служби за подршку жртвама те осигуравању потпуног благостања и безбједности жена и дјевојчица у јавној и приватној сфери
5-20-title: Разлика у платама између полова у неприлагођеном облику
5-20-definition: >-
  Индикатор мјери разлику између просјечне бруто сатнице запослених мушкараца и запослених жена као проценат просјечне бруто сатнице запослених мушкараца. Индикатор је дефинисан као неприлагођен, јер даје укупну слику родних неједнакости у погледу плате и мери концепт који је шири од концепта једнаке плате за једнак рад. Укључени су сви запослени који раде у фирмама са десет и више запослених, без ограничења старости и сати рада. Родна разлика у платама заснива се на методологији истраживања о структури зарада (SES), које се спроводи сваке четири године.
5-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор се може сматрати сличним глобалном СДГ индикатору 8.5.1 „Просјечна сатница запослених жена и мушкараца, према занимању, старости и особама са инвалидитетом“. Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
5-20-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
  Једнака плата за једнак рад је један од оснивачких принципа Европске уније, уграђен у Уговоре од 1957. године. Чланом 157. Уговора о функционисању Европске уније предвиђено је да свака држава чланица обезбијеђује примјену тог начела. Директива 2006/54/ЕЗ садржи принцип једнаке плате. Затварање родне разлике у платама је такође један од циљева Стратешког ангажовања Комисије за родну равноправност, као и Европског стуба социјалних права.
5-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
5-30-title: Разлика у запослености међу половима, према врсти запослења
5-30-definition: >-
  Индикатор мјери разлику између стопа запослености мушкараца и жена узраста од 20 до 64 године. Стопа запослености се израчунава тако што се број лица старости од 20 до 64 године у радном односу подели са укупном популацијом исте старосне групе. 
  Индикатор показује активност и радни статус за четири групе лица: запослена лица која раде пуно радно време, запослена лица која раде са непуним радним временом, запослена лица са уговором о раду на одређено време и подзапослена лица која раде са непуним радним временом.
5-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права.
5-30-methodology: >-
  Повећање учешћа жена на тржишту рада и једнака економска независност жена и мушкараца један је од приоритета Стратегије ЕУ за родну равноправност, која се обавезује на остваривање Уније равноправности. Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-30-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0
5-40-title: Лица ван радне снаге због обавеза бриге о другима по полу
5-40-definition: >-
  Становништво ван радне снаге обухвата појединце који нису запослени и који или активно не траже посао или нису доступни за рад (чак и ако су пронашли посао који ће почети у будућности). Дакле, они нису ни запослени ни незапослени. 
  Ова дефиниција која се користи у Анкети о радној снази ЕУ (EU-LFS) заснива се на резолуцијама Међународне конференције статистичара рада (ICLS) коју је организовала Међународна организација рада (ILO). Разлог за одсуство радне снаге обухваћене овим индикатором укључује „бригу о одраслима са инвалидитетом или дјеци“. Разматрају се само људи који изражавају спремност за рад, упркос томе што су ван радне снаге.
5-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности и циљу одрживог развоја 8 о достојанственом раду и економском расту, који су уграђени у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
   Европски стуб социјалних права, који су заједнички прогласили Европска комисија, Европски парламент и Европски савјет 2017. године, утврђује 20 кључних принципа и права неопходних за праведна и добро функционишућа тржишта рада и системе социјалне заштите.
5-40-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-40-long_term_objective: >-
  Нема описа
5-50-title: Мjеста која жене заузимају у националним парламентима и владама
5-50-definition: >-
  Индикатор мјери удио жена у националним парламентима и националним владама.
  Национални парламент је национална законодавна скупштина, а индикатор се односи на оба дома (доњи дом и горњи дом, где је то релевантно). Број чланова парламента обухвата предсједника/предсједавајућег/лидера парламента.
5-50-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 5 о родној равноправности и циљу одрживог развоја 8 о достојанственом раду и економском расту, који су уграђени у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 5.5.1 „Удио жена у националним парламентима и локалним самоуправама“.
5-50-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак. Кључни циљеви су окончање родно заснованог насиља; изазивање родних стереотипа; затварање родних разлика на тржишту рада; постизање једнаког учешћа у различитим секторима привреде; рјешавање родних разлика у платама и пензијама; затварање родног јаза и постизање родне равнотеже у доношењу одлука и у политици.
5-50-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 50.
5-61-title: Позиције које заузимају жене на вишим руководећим позицијама
5-61-definition: >-
  Индикатор мјри удио жена чланова одбора и руководилаца у највећим компанијама које котирају на берзи.
5-61-intention: >-
  Обухват података 2003 – 2023. Јавно котирано значи да се акцијама друштва тргује на берзи. „Највећим“ компанијама сматрају се чланови (макс. 50) примарног blue-chip индекса, који је индекс који одржава берза и који покрива највеће компаније према тржишној капитализацији и/или тржишној трговини. Рачунају се само компаније које су регистроване у дотичној земљи. Чланови одбора покривају све чланове највишег органа одлучивања у свакој компанији (тј. председника, неизвршне директоре, више руководиоце и представнике запослених, где су присутни). Руководиоци се односе на више руководиоце у два највиша органа одлучивања највећих (макс. 50) национално регистрованих компанија које котирају на националној берзи.
5-61-methodology: >-
  Стратегија ЕУ за родну равноправност обавезује се на постизање Уније равноправности и представља циљеве политике и акције за постизање значајног напретка до 2025. године ка Европи родне равноправности, у којој су жене и мушкарци, дјевојчице и дјечаци, слободни да слиједе свој изабрани животни пут и имају једнаке могућности за напредак
5-61-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 50.
6-20-title: Становништво повезано на најмање секундарни третман отпадних вода
6-20-definition: >-
  Индикатор мјери проценат становништва повезан са системима за пречишћавање отпадних вода са најмање секундарним пречишћавањем. На тај начин, отпадне воде из урбаних или других извора се пречишћавају процесом који генерално укључује биолошко пречишћавање са секундарним насељем или другим процесом који уклања органски материјал и смањује његову биохемијску потребу за кисеоником (БПК) за најмање 70% и хемијску потребу за кисеоником (КПК) за најмање 75%
6-20-intention: >-
  Индикатор  се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбједност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном СДГ индикатору 6.3.1 „Удио безбједно пречишћених отпадних вода“.
6-20-methodology: >-
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ, што је потврђено у предложеном 8. Акционом програму за животну средину. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Политика ЕУ у области здравља и безбједности хране такође доприноси високим стандардима у погледу воде и санитарних услова у смислу спрјечавања ширења заразних болести. Директива о пречишћавању комуналних отпадних вода регулише сакупљање, пречишћавање и испуштање комуналних и индустријских отпадних вода.
6-20-long_term_objective: >-
  Повећање удјела становништва прикљученог на најмање секундарни третман отпадних вода.
6-30-title: Удио водних тијела са добром квалитетом површинских и подземних вода - замјенски индикатор
6-30-definition: >-
  Индикатор се дефинише као удио водних тијела у земљи која имају добру квалитету површинских и подземних вода. Квалитета воде у животној средини односи се на природну, непречишћену воду у ријекама, језерима и подземним водама и представља комбинацију природних утицаја заједно са утицајима свих антропогених активности. Индикатор се ослања на податке о квалитету воде добијене из мјерења на лицу мјеста и анализе узорака прикупљених из површинских и подземних вода. Квалитета воде се процјењује помоћу основних физичких и хемијских параметара који одражавају природну квалитету воде повезану са климатолошким и геолошким факторима, заједно са главним утицајима на квалитету воде.
6-30-intention: >-
  Текст у изради
6-30-methodology: >-
  Текст у изради
6-30-long_term_objective: >-
  Побољшати квалитет површинских и подземних вода и повећати удио водних тијела са добрим амбијенталним квалитетом воде до 2030. године.
6-40-title: Нитрати у подземним водама
6-40-definition: >-
  Овај индикатор приказује концентрације нитрата (НО3) у тјелима подземних вода мјерене као милиграми по литру (мг НО3/Л). Индикатор се може користити за илустрацију географских варијација у тренутним концентрацијама и временским трендовима. Велики уноси азота у водна тјела из урбаних подручја, индустрије и пољопривредних подручја, могу имати негативан утицај на коришћење воде за људску потрошњу и друге намјене.
6-40-intention: >-
  Индикатор  се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024-2029 у оквиру „Одржавање квалитета живота: Безбједност хране, вода и природа“. 
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Према Директиви о води за пиће, дозвољена је максимална концентрација од 50 мг/Л нитрата у подземним водама које се користе за воду за пиће. Директива о нитратима захтева одређивање осетљивих зона на основу овог прага за све воде, укључујући подземне воде.
6-40-methodology: >-
  Оквирна директива о водама је главно европско законодавство које има за циљ спречавање загађења воде. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-40-long_term_objective: >-
  Дугорочни циљ је смањење нивоа нитрата испод утврђеног максималног нивоа загађивача (MCL)) од 10 мг/Л (као N, азот) или 45 мг/Л (као NО3−).
6-50-title: Фосфат у ријекама
6-50-definition: >-
  Овај индикатор мјери концентрацију фосфата (ПО4) по литру у раствореној фази из узорака воде из ријечних станица и агрегирано на годишње просјечне вриједности. У високим концентрацијама фосфат може изазвати проблеме са квалитетом воде, као што је еутрофикација, покретањем раста водених биљака, укључујући алге. Индикатор се може користити за илустрацију географских варијација у тренутним концентрацијама и временским трендовима.
6-50-intention: >-
  користи се за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“.
  Индикатор се може сматрати дјелом глобалног СДГ индикатора 6.3.2 „Удио водних тјела са добрим квалитетом амбијенталне воде“.
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац еколошке политике ЕУ. Водна политика ЕУ пружа оквир за свеобухватно решавање заштите вода и за постизање доброг стања унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Оквирна директива о водама је главно европско законодавство које има за циљ спречавање загађења воде. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
6-50-methodology: >-
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-50-long_term_objective: >-
  Нема описа
6-60-title: Индекс експлоатације воде, плус (WEI+)
6-60-definition: >-
  Индекс експлоатације воде (WЕИ+) даје мјеру укупне потрошње воде као проценат обновљивих слатководних ресурса доступних за дату територију и период. Он квантификује колико се воде захвата и колико се вода враћа у животну средину од стране економских сектора прије или послије употребе. Разлика између захватања воде и враћања воде сматра се „потрошњом воде“. У одсуству договорених формалних циљева широм Европе, вриједности изнад 20% се генерално сматрају знаком несташице воде, док вриједности једнаке или веће од 40% указују на ситуације озбиљне несташице воде, што значи да је коришћење слатководних ресурса неодрживо.
6-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 6 о чистој води и санитацији, који је уграђен у приоритете Европске комисије за период 2024–2029. у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“. 
  Индикатор производи ЕЕА на основу података из базе података WISE SoE-Water quantity database (WISE 3) и других отворених извора (Евростат, ОЕЦД), укључујући методе попуњавања празнина.
  Индикатор се може сматрати глобалним СДГ индикатором 6.4.2 „Ниво водног стреса: повлачење слатке воде као пропорција доступних слатководних ресурса“.
  Оквирна директива о водама је главно европско законодавство које има за циљ - између осталог - промовисање одрживог коришћења воде на основу дугорочне заштите доступних водних ресурса. Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама захтевајући од држава чланица да обнове слатководне екосистеме.
6-60-methodology: >-
  Осми акциони програм за животну средину поставља агенду еколошке политике за године од 2021. до 2030. године и изричито помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) остваривање амбиције нултог загађења за токсичну слободну животну средину, укључујући ваздух, воду и земљиште и заштиту здравља и добробити грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шума, слатководних, мочварних и морских екосистема.
6-60-long_term_objective: >-
  Дугорочни циљ за индикатор СДГ_06_60 је обезбиједити одрживо коришћење слатководних ресурса смањењем притиска на обновљиве водне ресурсе и одржавањем потрошње воде на нивоима који не угрожавају њихову дугорочну одрживост. 
6-70-title: Пестициди у ријекама
6-70-definition: >-
  Овај индикатор мери удео пријављених водних тела са пестицидима који прелазе прагове на основу Стандарда квалитета животне средине (СКЕ) за токсичност мерених пестицида. Пестициди укључују и активне супстанце из средстава за заштиту биља и биоцида, као и њихове релевантне метаболите, чиме се одражавају супстанце које су стварно присутне у води и утичу на водени свет. Укључене су само супстанце са дефинисаним СКЕ.
6-70-intention: >-
  Овај индикатор се може сматрати сличним глобалном индикатору циљева одрживог развоја 6.3.2 „Удео водних тела са добрим квалитетом воде у околини“.
  Заштита водних ресурса, водних екосистема и воде за пиће и купање је камен темељац политике ЕУ у области заштите животне средине. Политика ЕУ у области вода пружа оквир за свеобухватно решавање заштите вода и за постизање доброг статуса унутрашњих површинских вода, прелазних вода, приобалних вода и подземних вода. Оквирна директива о водама је главни европски закон који има за циљ спречавање загађења воде, а Стратегија ЕУ за биодиверзитет до 2030. године подржава спровођење циља Оквирне директиве о водама тако што захтева од држава чланица да обнове слатководне екосистеме.
6-70-methodology: >-
  Осми акциони програм за животну средину утврђује агенду политике заштите животне средине за период од 2021. до 2030. године и експлицитно помиње питања везана за воду у два од својих шест приоритетних циљева. Ова два циља су: (1) тежња ка циљу нултог загађења за животну средину без токсичних материја, укључујући ваздух, воду и земљиште, и заштита здравља и благостања грађана од ризика и утицаја везаних за животну средину; и (2) заштита, очување и обнављање биодиверзитета и унапређење природног капитала, посебно ваздуха, воде, земљишта и шумских, слатководних, мочварних и морских екосистема.
6-70-long_term_objective: >-
  Нема описа
7-10-title: "Примарна потрошња енергије"
7-10-definition: >-
  Индикатор мјери укупне енергетске потребе једне земље, искључујући сву употребу енергената који нису енергетски производи (нпр. природни гас који се не користи за сагоревање већ за производњу хемикалија).
  „Потрошња примарне енергије“ обухвата потрошњу енергије од стране крајњих корисника као што су индустрија, саобраћај, домаћинства, услуге и пољопривреда, плус потрошњу енергије самог енергетског сектора за производњу и трансформацију енергије, губитке који се јављају током трансформације енергије (нпр. ефикасност производње електричне енергије из запаљивих горива) и губитке преноса и дистрибуције енергије.
7-10-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  ЕУ спроводи међусобно повезан скуп мера "Fit for 55" за постизање нових климатских циљева за 2030. годину и пратила је нови стратешки план REPowerEU за смањење зависности ЕУ од увоза енергије.
7-10-methodology: >-
  Европски зелени договор укључује енергетску ефикасност као кључну мјеру за смањење међусекторских емисија гасова са ефектом стаклене баште. Директиве о енергетској ефикасности и обновљивој енергији постављају амбициозне циљеве ЕУ које треба постићи до 2030. године.
7-10-long_term_objective: >-
  Дугорочни циљ Европске уније у оквиру индикатора SDG_07_10 је смањити примарну потрошњу енергије на највише 992,5 Mtoe до 2030. године, у складу са циљевима ЕУ за повећање енергетске ефикасности и смањење потрошње енергије.
7-10-long_term_objective_national: >-
  Дугорочни циљ за Босну и Херцеговину у оквиру индикатора SDG_07_10 је смањити примарну потрошњу енергије на највише 6,50 Mtoe до 2030. године, у складу са обавезујућим циљем за Босну и Херцеговину који је утврдио Министарски савјет Енергетске заједнице, уз повећање енергетске ефикасности и одрживије коришћење енергије. 
7-11-title: "Финална потрошња енергије"
7-11-definition: >-
  Индикатор мјери крајњу потрошњу енергије у земљи, искључујући сву неенергетску употребу енергената (нпр. природни гас који се не користи за сагоријевање, већ за производњу хемикалија). „Крајња потрошња енергије“ обухвата само енергију коју троше крајњи корисници, као што су индустрија, саобраћај, домаћинства, услуге и пољопривреда; искључује потрошњу енергије самог енергетског сектора и губитке који настају током трансформације и дистрибуције енергије.
7-11-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  ЕУ спроводи међусобно повезан скуп мера "Fit for 55" за постизање нових климатских циљева за 2030. годину и пратила је нови стратешки план REPowerEU за смањење зависности ЕУ од увоза енергије.
7-11-methodology: >-
  Европски зелени договор укључује енергетску ефикасност као кључну мјеру за смањење међусекторских емисија гасова са ефектом стаклене баште. Директиве о енергетској ефикасности и обновљивој енергији постављају амбициозне циљеве ЕУ које треба постићи до 2030. године.
7-11-long_term_objective: >-
  Дугорочни циљ Европске уније у оквиру индикатора SDG_07_11 је смањити финалну потрошњу енергије на највише 763 Mtoe до 2030. године, у складу са циљевима ЕУ за повећање енергетске ефикасности и смањење потрошње енергије.
7-11-long_term_objective_national: >-
   Дугорочни циљ за Босну и Херцеговину у оквиру индикатора SDG_07_11 је смањити финалну потрошњу енергије на највише 4,34 Mtoe до 2030. године, у складу са обавезујућим циљем Босне и Херцеговине који је утврдио Министарски савјет Енергетске заједнице, уз повећање енергетске ефикасности и одрживије коришћење енергије.
7-20-title: "Коначна потрошња енергије у домаћинствима по глави становника"
7-20-definition: >-
  Индикатор мјери колико енергије сваки грађанин троши код куће искључујући енергију која се користи за транспорт. Пошто се индикатор односи на финалну потрошњу енергије, узима се у обзир само енергија коју користе крајњи потрошачи. Искључена је повезана потрошња самог енергетског сектора.
7-20-definition_national: >-
  Индикатор мјери финалну потрошњу енергије у домаћинствима по становнику, а изражава се у килограмима еквивалента нафте (KGOE). Обухваћена је енергија коју користе крајњи потрошачи у домаћинствима, док је искључена енергија која се користи за транспорт и повезана сопствена потрошња енергетског сектора. Подаци се заснивају на годишњим енергетским билансима и усклађени су с методолошким концептом Евростата за индикатор sdg_07_20. 
7-20-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
7-20-intention_national: >-
  Индикатор пружа информације о финалној потрошњи енергије у домаћинствима по становнику и омогућава праћење кретања потрошње енергије коју грађани користе у својим домаћинствима, искључујући енергију која се користи за транспорт. Праћење овог индикатора доприноси процјени напретка у области енергетске ефикасности и одрживог коришћења енергије у Босни и Херцеговини, у оквиру Циља одрживог развоја 7 – Приступачна и чиста енергија.
7-20-methodology: >-
  Циљ одрживог развоја 7 позива на обезбјеђивање универзалног приступа савременим енергетским услугама, побољшање енергетске ефикасности и повећање удјела обновљиве енергије. Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. Домаћинства чине око четвртину финалне потрошње енергије. Код куће људи користе електричну енергију и горива, посебно за гријање, хлађење, топлу воду, освјетљење и уређаје
7-20-long_term_objective: >-
  Дугорочно смањење финалне потрошње енергије у домаћинствима по становнику, као допринос повећању енергетске ефикасности.
7-20-long_term_objective_national: >-
  Дугорочно смањење финалне потрошње енергије у домаћинствима по становнику, као допринос повећању енергетске ефикасности у Босни и Херцеговини.
7-30-title: Енергетска продуктивност
7-30-definition: >-
  Индикатор мјери количину економске производње која се производи по јединици бруто расположиве енергије. Бруто расположива енергија представља количину енергената неопходну за задовољење свих потреба субјеката у разматраном географском подручју. Економски учинак је дат или у јединици евра у ланчано повезаним обимима за референтну 2010. годину по девизном курсу из 2010. године или у јединици ППС (стандард куповне моћи).
7-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 7 о приступачној и чистој енергији и циљу одрживог развоја 12 о обезбјеђивању одрживих образаца потрошње и производње.
  Овај индикаторсе може сматрати сличним глобалном индикатору циљева одрживог развоја 7.3.1 „Енергетски интензитет мјерен у смислу примарне енергије и БДП-а“.
  Повећање енергетске продуктивности, односно раздвајање економског раста од потрошње енергије, кључно је за постизање циља одрживог развоја 7 без наношења штете економском развоју.
7-30-methodology: >-
  СДГ 7 је уграђен у приоритете Европске комисије под називом „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Циљ одрживог развоја 7 позива на обезбјеђивање универзалног приступа савременим енергетским услугама, побољшање енергетске ефикасности и повећање удјела обновљиве енергије. Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. Циљ одрживог развоја 12 позива на свеобухватан скуп акција предузећа, креатора политика, истраживача и потрошача да се прилагоде одрживим праксама. Предвиђа одрживу производњу и потрошњу засновану на напредним технолошким капацитетима, ефикасности ресурса и смањењу глобалног отпада.
7-30-long_term_objective: >-
  Дугорочно повећање енергетске продуктивности, као допринос повећању енергетске ефикасности и одрживом коришћењу енергије.
7-30-long_term_objective_national: >-
  Дугорочно повећање енергетске продуктивности у Босни и Херцеговини, као допринос повећању енергетске ефикасности и одрживом коришћењу енергије.
7-40-title: "Удио обновљиве енергије у укупној коначној потрошњи енергије"
7-40-definition: >-
  Индикатор мјери удио потрошње обновљивих извора енергије у бруто финалној потрошњи енергије према Директиви о обновљивим изворима енергије. Бруто финална потрошња енергије је енергија коју користе крајњи потрошачи (финална потрошња енергије) плус губици мреже и сопствена потрошња електрана.
7-40-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 7 о приступачној и чистој енергији и циљу одрживог развоја 13 о климатским акцијама; који су респективно уграђени у приоритете Европске комисије у оквиру „Подршка људима, јачање наших друштава и нашег социјалног модела“ и „Одржавање нашег квалитета живота: безбједност хране, вода и природе“.
  Индикатор се може сматрати идентичним глобалном СДГ индикатору 7.2.1 „Удио обновљиве енергије у укупној финалној потрошњи енергије“.
7-40-methodology: >-
  ЕУ спроводи међусобно повезани скуп мјера "Fit for 55" како би достигла нове климатске циљеве за 2030. годину и пратила је нови стратешки план REPowerEU за смањење зависности ЕУ од увоза енергије. Европски зелени план предвиђа декарбонизацију енергетских система Европе како би се постигла климатска неутралност до 2050. године. У том циљу, ЕУ ће се окренути ка потпуно интегрисаном, међусобно повезаном и дигитализованом систему обновљивих извора енергије, истовремено обезбјеђујући сигурност снабдјевања по приступачним цијенама. Штавише, фондови кохезионе политике ЕУ (2021–2027), укључујући план опоравка „Неxт Генератион ЕУ“, обезбеђују финансирање инвестиција у обновљиве изворе енергије. Ревидиране Директиве о обновљивим изворима енергије постављају амбициозан циљ ЕУ који треба постићи до 2030. године.
7-40-long_term_objective: >-
  Дугорочни циљ Европске уније у оквиру индикатора SDG_07_40 је повећати удио обновљиве енергије у бруто финалној потрошњи енергије на најмање 42,5% до 2030. године, у складу са ревидираном Директивом о обновљивој енергији.
7-40-long_term_objective_national: >-
  Дугорочни циљ за Босну и Херцеговину у оквиру индикатора SDG_07_40 је повећати удио обновљиве енергије у бруто финалној потрошњи енергије на најмање 43,6% до 2030. године, у складу са обавезујућим циљем Босне и Херцеговине који је утврдио Министарски савјет Енергетске заједнице.
7-50-title: "Завиност од увоза енергије"
7-50-definition: >-
  Индикатор приказује удио укупних енергетских потреба једне земље који се покрива нето увозом енергије из других земаља. Израчунава се као нето увоз енергије (увоз минус извоз) подијељен са бруто расположивом енергијом и изражава се у процентима. Енергетска зависност = (увоз – извоз) / бруто расположива енергија.
7-50-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији. Енергетска зависност од увоза показује у којој мјери земља зависи од енергије која се обезбјеђује из других земаља и представља важан показатељ енергетске сигурности. Висока зависност од увоза енергије може изложити економију промјенама цијена на међународним енергетским тржиштима и ризицима од поремећаја у снабдијевању.
  Смањење енергетске зависности може се подржати повећањем домаће производње енергије, развојем обновљивих извора енергије, унапређењем енергетске ефикасности и диверсификацијом извора и праваца снабдијевања.
7-50-methodology: >-
  Енергетска зависност представља важан показатељ енергетске сигурности и отпорности енергетског система. Смањење зависности од увоза може се подржати повећањем домаће производње енергије, развојем обновљивих извора енергије, повећањем енергетске ефикасности и диверсификацијом извора и праваца снабдијевања. У оквиру Европске уније смањење зависности од увоза енергије представља важан дио енергетске политике и енергетске сигурности. Иницијатива REPowerEU усмјерена је, између осталог, на смањење зависности од увоза фосилних горива, повећање енергетске ефикасности, убрзавање развоја обновљивих извора енергије и диверсификацију снабдијевања. Индикатор се приказује за укупну енергију и према појединим врстама енергената. Укупна вриједност представља основну мјеру енергетске зависности земље, док рашчлањивање према врстама енергената омогућава детаљнији увид у структуру зависности од увоза.
7-50-long_term_objective: >-
  Дугорочни циљ Европске уније у оквиру индикатора SDG_07_50 је смањити енергетску зависност од увоза јачањем домаће производње енергије, повећањем енергетске ефикасности и повећањем коришћења обновљивих извора енергије.
7-50-long_term_objective_national: >-
  Дугорочно смањење енергетске зависности Босне и Херцеговине од увоза, уз повећање домаће производње енергије, енергетску ефикасност и развој обновљивих извора енергије.
7-60-title: "Популација која није у могућности да обезбиједи адекватно загријaвање дома"
7-60-definition: >-
  Индикатор мјери удио становништва које није у стању да приушти адекватно гријање дома. Подаци за овај индикатор прикупљају се у оквиру Статистике Европске уније о приходима и условима живота (ЕУ-СИЛЦ) за праћење развоја сиромаштва и социјалне инклузије у ЕУ. Прикупљање података се заснива на анкети, што значи да се вриједности индикатора самостално пријављују.
7-60-intention: >-
  Индикатор се користи за праћење напретка ка остваривању циља одрживог развоја 7 о приступачној и чистој енергији, који је уграђен у приоритете Европске комисије у оквиру „Подршке људима, јачања наших друштава и нашег социјалног модела“.
  Да би убрзале прелазак на приступачан, поуздан и одржив енергетски систем, земље треба да олакшају приступ истраживању чисте енергије, промовишу улагања у енергетску инфраструктуру и технологију чисте енергије. 
  Европски стуб социјалних права наводи енергију међу основним услугама којима би сви требало да имају приступ. Са Опсерваторијом ЕУ за енергетско сиромаштво, ЕУ настоји да помогне државама чланицама у њиховим напорима да смање енергетско сиромаштво и обезбједе приступ приступачној енергији.
7-60-methodology: >-
  Акциони план за приступачну енергију предлаже мјере за стабилизацију цијена енергије, обезбјеђивање сигурности снабдјевања и покретање енергетске транзиције. Европски стуб социјалних права наводи енергију међу основним услугама којима би сви требало да имају приступ. Европски економски и социјални комитет (EESC) процјењује његово стање. Савјетодавни центар ЕУ за енергетско сиромаштво је иницијатива која пружа централну платформу експертизе о енергетском сиромаштву за локалне власти и друге заинтересоване стране.
7-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 0.
8-10-title: Реални БДП по глави становника
8-10-definition: >-
  Индикатор се израчунава као однос реалног БДП-а, односно БДП-а прилагођеног за инфлацију, и просјечног становништва у одређеној години. БДП се изражава у милионима еура, а становништво у хиљадама. Реални БДП објављује се без децимала.
8-10-intention: >-
  Индикатор се користи за праћење напретка према циљу одрживог развоја 8 – Достојанствен рад и економски раст. Индикатор се може сматрати идентичним глобалном индикатору SDG 8.1.1 „Годишња стопа раста реалног БДП-а по становнику“.
8-10-methodology: >-
  БДП мјери вриједност укупне коначне производње добара и услуга произведених у економији током одређеног временског периода. Реални БДП прилагођава се за промјене цијена и омогућава праћење промјена економске активности независно од инфлације. Реални БДП по становнику често се користи као показатељ економског раста и развоја материјалног животног стандарда. Међутим, БДП није потпуна мјера економског благостања. На примјер, не укључује већину неплаћеног рада у домаћинству нити у потпуности одражава негативне ефекте економске активности, као што је деградација животне средине.
8-10-long_term_objective: >-
  Дугорочни циљ индикатора је одржив раст реалног БДП-а по становнику, уз истовремено подстицање инклузивног економског раста и побољшање материјалних животних услова становништва.
8-10-long_term_objective_national: >-
  Дугорочни циљ индикатора је одржив раст реалног БДП-а по становнику, уз истовремено подстицање инклузивног економског раста и побољшање материјалних животних услова становништва.
8-11-title: Удио инвестиција у БДП-у
8-11-definition: >-
  Индикатор се израчунава као однос реалног БДП-а (БДП прилагођен инфлацији) и просјечног становништва одређене године, где се БДП изражава у милионима, а становништво у хиљадама. Реални БДП се објављује без децимала.
8-11-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“.
  Индикатор се може сматрати идентичним глобалном показатељу СДГ 8.1.1 „Годишња стопа раста реалног БДП-а по глави становника“.
8-11-methodology: >-
  БДП мјери вриједност укупне коначне производње добара и услуга које је произвела привреда у одређеном временском периоду. Укључује робу и услуге које имају тржишта (или које би могле имати тржишта) и производе које производе општа држава и непрофитне институције. То је мјера економске активности и обично се користи као замјена за развој материјалног животног стандарда земље. Међутим, то није потпуна мјера економског благостања. На пример, БДП не укључује већину неплаћених послова у домаћинству. БДП такође не узима у обзир негативне ефекте економске активности, као што је деградација животне средине.
8-11-long_term_objective: >-
  Дугорочни циљ за индикатор СДГ_08_11 је мјерење учешћа инвестиција у БДП-у.
8-20-title: Млади који нису запослени и нису у образовању или обуци
8-20-definition: >-
  Индикатор показује удио младих лица у доби од 15 до 29 година која нису запослена и нису укључена у образовање или оспособљавање. У категорију младих који нису у запослењу, образовању или оспособљавању (NEET) укључују се лица која нису запослена и која нису учествовала у формалном или неформалном образовању или оспособљавању током четири седмице које претходе истраживању.
8-20-intention: >-
  Индикатор се користи за праћење напретка према циљу одрживог развоја 8 – Достојанствен рад и економски раст, као и према циљу одрживог развоја 4 – Квалитетно образовање. Посебно указује на положај младих који нису укључени ни у тржиште рада ни у образовање или оспособљавање и може указивати на потешкоће у преласку из образовања у запослење. Индикатор се може сматрати повезаним с глобалним индикатором SDG 8.6.1 „Удио младих (15–24 године) који нису у образовању, запослењу или оспособљавању“.
8-20-methodology: >-
  Индикатор мјери удио становништва у доби од 15 до 29 година које није запослено и није укључено у образовање или оспособљавање. Лице се сматра NEET лицем ако није запослено, односно ако је незапослено или изван радне снаге према дефиницији Међународне организације рада, и ако није учествовало у формалном или неформалном образовању или оспособљавању током четири седмице које претходе истраживању. Смањење удјела младих који нису у запослењу, образовању или оспособљавању указује на побољшање укључивања младих у образовање, оспособљавање и тржиште рада.
8-20-long_term_objective: >-
  Дугорочни циљ Европске уније је смањити стопу младих у доби од 15 до 29 година који нису у запослењу, образовању или оспособљавању на 9% до 2030. године.
8-20-long_term_objective_national: >-
  Дугорочни циљ индикатора је смањење удјела младих у доби од 15 до 29 година који нису у запослењу, образовању или оспособљавању, уз унапређење преласка младих из образовања у запослење и њихово веће укључивање у тржиште рада.
8-30-title: Стопа запослености
8-30-definition: >-
  Индикатор мјери удио становништва старости од 20 до 64 године које је запослено. Запослена лица су дефинисана као лица која су током референтне недеље радила најмање један сат за плату или профит или нису радила, али су имала послове са којих су била привремено одсутна.
8-30-definition_national: >-
  Индикатор мјери удио становништва у Босни и Херцеговини у доби од 20 до 64 године које је запослено. Запослена лица дефинишу се као лица која су током референтне седмице радила најмање један сат за плату или профит или нису радила, али су имала посао са којег су била привремено одсутна.
8-30-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 8 о достојанственом раду и економском расту, који је уграђен у приоритете Европске комисије под „Нови план за одрживи просперитет и конкурентност Европе“ и „Подршка људима, јачање наших друштава и нашег социјалног модела“. СДГ 8 позива, између осталог, на пружање могућности за пуно и продуктивно запошљавање и пристојан рад за све.
  Запошљавање и друга питања везана за тржиште рада су у средишту социјалне и политичке дебате у ЕУ. Плаћено запослење је кључно за обезбеђивање довољног животног стандарда и пружа неопходну основу људима да остваре своје личне циљеве и тежње. Штавише, запошљавање доприноси економским перформансама, квалитету живота и социјалној инклузији, чинећи га каменом темељцем друштвено-економског развоја и благостања.
8-30-intention_national: >-
  ИИндикатор се користи за праћење кретања запослености становништва у Босни и Херцеговини и напретка према Циљу одрживог развоја 8, који промовише достојанствен рад, пуно и продуктивно запошљавање и одрживи економски раст.
  Повећање запослености становништва у доби од 20 до 64 године доприноси већој економској активности, бољем животном стандарду, социјалној укључености и одрживом друштвено-економском развоју.
8-30-methodology: >-
  Европски стуб социјалних права поставља 20 кључних принципа и права од суштинског значаја за праведна и добро функционална тржишта рада и системе социјалне заштите. Акциони план Европског стуба социјалних права, усвојен 2021. године, претвара принципе у конкретне активности и поставља три главна циља ЕУ за 2030. годину. У области запошљавања постављен је циљ да најмање 78% становништва у доби од 20 до 64 године буде запослено до 2030. године. Акциони план такође предвиђа преполовљавање јаза у запослености између жена и мушкараца до 2030. године у односу на 2019. годину и смањење удјела младих у доби од 15 до 29 година који нису запослени нити у образовању или оспособљавању (NEET) на 9% до 2030. године.
8-30-methodology_national: >-
  Индикатор прати стопу запослености становништва у Босни и Херцеговини у доби од 20 до 64 године. Кретање индикатора омогућава праћење промјена у учешћу становништва радне доби на тржишту рада и дугорочних трендова запослености. Повећање стопе запослености представља позитиван тренд у односу на циљ повећања запослености и учешћа становништва на тржишту рада.
8-30-long_term_objective: >-
  Дугорочни циљ Европске уније у оквиру индикатора SDG_08_30 је повећати стопу запослености становништва у доби од 20 до 64 године на најмање 78% до 2030. године, у складу са Акционим планом Европског стуба социјалних права.
8-30-long_term_objective_national: >-
  Дугорочни циљ за Босну и Херцеговину у оквиру индикатора SDG_08_30 је повећање стопе запослености становништва у доби од 20 до 64 године, уз унапређење учешћа становништва на тржишту рада и стварање услова за одрживо и доступно запошљавање.
8-40-title: Стопа дуготрајне незапослености
8-40-definition: >-
  Индикатор мјери удио становништва у радној снази старости од 15 до 74 године које је незапослено 12 мјесеци или дуже. Становништво у радној снази обухвата запослена и незапослена лица. Незапослена лица су лица старости од 15 до 74 године која су током референтне седмице била без посла, била доступна за почетак рада у наредне двије седмице и која су активно тражила посао у посљедње четири седмице или су већ пронашла посао који почиње у наредна три мјесеца. Трајање незапослености дефинише се као трајање тражења посла или, ако је краће, као вријеме протекло од посљедњег запослења.
8-40-definition_national: >-
  Индикатор мјери удио становништва у Босни и Херцеговини у радној снази старости од 15 до 74 године које је незапослено 12 мјесеци или дуже. Становништво у радној снази обухвата запослена и незапослена лица. Незапослена лица су лица старости од 15 до 74 године која су током референтне седмице била без посла, била доступна за почетак рада у наредне двије седмице и која су активно тражила посао у посљедње четири седмице или су већ пронашла посао који почиње у наредна три мјесеца. Трајање незапослености дефинише се као трајање тражења посла или, ако је краће, као вријеме протекло од посљедњег запослења. Дефиниције и методолошки приступ усклађени су са методологијом Европске уније и стандардима Међународне организације рада.
8-40-intention: >-
  Индикатор се користи за праћење дуготрајне незапослености и напретка према Циљу одрживог развоја 8 – Достојанствен рад и економски раст. У оквиру Европског стуба социјалних права, индикатор доприноси праћењу функционисања тржишта рада и положаја лица која се дуже вријеме суочавају са незапосленошћу.
  Смањење дуготрајне незапослености повезано је са јачањем приступа запошљавању, бољим укључивањем незапослених лица на тржиште рада и унапређењем услова за достојанствен рад.
8-40-intention_national: >-
  Индикатор се користи за праћење дуготрајне незапослености и стања на тржишту рада у Босни и Херцеговини, у оквиру Циља одрживог развоја 8 – Достојанствен рад и економски раст. Праћење дуготрајне незапослености омогућава сагледавање положаја лица која дуже вријеме траже запослење и подржава праћење промјена у могућностима за учешће на тржишту рада.
  Смањење дуготрајне незапослености доприноси повећању запослености, активирању радне снаге и унапређењу услова за достојанствен и одржив рад.
8-40-methodology: >-
  Индикатор прати промјене у стопи дуготрајне незапослености међу становништвом у радној снази старости од 15 до 74 године. Нижа вриједност показује повољнији развој индикатора. У ЕУ је стопа дуготрајне незапослености смањена са 2,7% у 2019. години на 1,9% у 2025. години, што указује на дугорочно смањење дуготрајне незапослености. Индикатор се користи за праћење напретка у области запошљавања и тржишта рада у контексту Циља одрживог развоја 8 и Европског стуба социјалних права.
8-40-methodology_national: >-
  Индикатор прати стопу дуготрајне незапослености међу становништвом у радној снази у Босни и Херцеговини старости од 15 до 74 године. Нижа вриједност показује повољнији развој индикатора. Подаци се прате на начин усклађен са методологијом ЕУ за овај индикатор, што омогућава упоредиво праћење кретања дуготрајне незапослености. Промјене индикатора користе се за праћење дугорочних кретања на тржишту рада и напретка у остваривању циљева одрживог развоја.
8-40-long_term_objective: >-
  Дугорочно смањење стопе дуготрајне незапослености, уз повећање могућности за запошљавање, активирање незапослених лица и унапређење услова за одрживо и достојанствено запошљавање.
8-40-long_term_objective_national: >-
  Дугорочно смањење стопе дуготрајне незапослености у Босни и Херцеговини, уз повећање могућности за запошљавање, активирање незапослених лица и стварање услова за одрживо и достојанствено запошљавање.
8-60-title: Смртоноснe несрећe на раду на 100 000 радника
8-60-definition: >-
  Индикатор мјери број несрећа са смртним исходом које се дешавају у току рада и доводе до смрти жртве у року од годину дана од настанка несреће. Стопа инциденције се односи на број несрећа са смртним исходом на 100 000 запослених.
8-60-definition_national: >-
  Индикатор мјери број несрећа са смртним исходом које се догоде током рада и доведу до смрти жртве у року од једне године од несреће. Стопа инциденције односи се на број несрећа са смртним исходом на 100 000 запослених лица.
8-60-intention: >-
  Индикатор прати безбједност и заштиту здравља на раду и доприноси праћењу Циља одрживог развоја 8 – Достојанствен рад и економски раст. Хармонизовани подаци о несрећама на раду у Европској унији прикупљају се у оквиру административног прикупљања података Европска статистика о несрећама на раду (ESAW), а Eurostat је пружалац података за овај индикатор у оквиру Европског статистичког система.
8-60-intention_national: >-
  Индикатор прати безбједност и заштиту здравља на раду у Босни и Херцеговини и доприноси праћењу Циља одрживог развоја 8 – Достојанствен рад и економски раст. Смањење броја смртних несрећа на раду представља важан аспект унапређења безбједности и заштите здравља запослених. У Босни и Херцеговини се Европска статистика о несрећама на раду (ESAW) не спроводи као засебно истраживање. Агенција за статистику Босне и Херцеговине користи секундарне изворе података, укључујући постојеће податке Министарства цивилних послова Босне и Херцеговине, за праћење овог индикатора.
8-60-methodology: >-
  Индикатор прати стопу смртних несрећа на раду на 100 000 запослених лица и омогућава праћење дугорочних промјена у безбједности и заштити здравља на раду. Смањење вриједности индикатора представља повољан тренд, јер указује на смањење учесталости несрећа са смртним исходом.
  На нивоу Европске уније, заштита здравља и безбједности радника представља важан дио политика усмјерених на унапређење услова рада. Европска статистика о несрећама на раду (ESAW) користи хармонизовани методолошки оквир за праћење фаталних и нефаталних несрећа на раду.
8-60-methodology_national: >-
  Индикатор прати стопу смртних несрећа на раду на 100 000 запослених лица и омогућава праћење промјена у безбједности и заштити здравља на раду у Босни и Херцеговини. Смањење вриједности индикатора представља повољан тренд, јер указује на смањење учесталости несрећа са смртним исходом. Праћење временског тренда омогућава праћење дугорочних промјена у безбједности и заштити здравља на раду и напретка Босне и Херцеговине у остваривању Циља одрживог развоја 8.
  Методолошка дефиниција индикатора усклађена је са релевантним принципима Европске статистике о несрећама на раду (ESAW).
8-60-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност 0, што представља научно заснован, односно технички оптимум и дугорочну тежњу ка спречавању смртних исхода на раду.
8-60-long_term_objective_national: >-
  Дугорочни циљ је смањење стопе смртних несрећа на раду у Босни и Херцеговини и континуирано унапређење безбједности и заштите здравља на раду. Дугорочни технички оптимум за овај индикатор је вриједност 0, што представља тежњу ка спречавању смртних исхода на раду.
9-10-title: Бруто домаћа потрошња за истраживање и развој
9-10-definition: >-
  Индикатор мјери бруто домаће издатке за истраживање и развој (GERD) као проценат бруто домаћег производа (БДП-а), што се назива и интензитет истраживања и развоја. Према OECD-овом Фраскати приручнику, истраживање и експериментални развој (R&D) представљају креативан и систематичан рад који се предузима ради повећања фонда знања, укључујући знање о човјечанству, култури и друштву, као и ради осмишљавања нових примјена доступног знања.
9-10-definition_national: >-
  Индикатор мјери бруто домаће издатке за истраживање и развој (GERD) као проценат бруто домаћег производа (БДП-а), односно интензитет истраживања и развоја. Истраживање и експериментални развој (R&D) обухватају креативан и систематичан рад који се предузима ради повећања фонда знања и осмишљавања нових примјена доступног знања. Подаци за Босну и Херцеговину обухватају укупне издатке за истраживање и развој, као и издатке према секторима извођења истраживања и развоја.
9-10-intention: >-
  Индикатор се користи за праћење напретка према циљу одрживог развоја 9, који се односи на изградњу отпорне инфраструктуре, промовисање инклузивне и одрживе индустријализације и подстицање иновација. Индикатор је идентичан глобалном индикатору SDG 9.5.1 „Издаци за истраживање и развој као удио БДП-а“.
9-10-intention_national: >-
  Индикатор омогућава праћење нивоа улагања у истраживање и развој у односу на величину економије Босне и Херцеговине. На тај начин пружа основу за праћење улагања у науку, технологију и иновације и представља један од показатеља напретка у остваривању циља одрживог развоја 9.
9-10-methodology: >-
  Нова визија Европског истраживачког простора (ERA) усмјерена је на изградњу заједничког европског простора за истраживање и иновације кроз подстицање улагања и реформи, унапређење приступа изврсности, претварање резултата истраживања и иновација у економску вриједност и даље продубљивање Европског истраживачког простора. Европска унија има дугогодишњи циљ повећања интензитета истраживања и развоја на 3% БДП-а, што је потврђено Препоруком Савјета о Пакту за истраживање и иновације у Европи из новембра 2021. године.
9-10-methodology_national: >-
  Подаци за Босну и Херцеговину заснивају се на подацима Агенције за статистику Босне и Херцеговине и обухватају бруто домаће издатке за истраживање и развој исказане као проценат БДП-а. Подаци су доступни за период 2019–2024. године, при чему су укупне вриједности индикатора (TOTAL, Сви сектори) основа за праћење његовог кретања. Аутоматски статус напретка израчунава се на основу доступних података временске серије за укупну вриједност индикатора.
9-10-long_term_objective: >-
  Дугорочни циљ Европске уније за овај индикатор је повећање бруто домаћих издатака за истраживање и развој на 3% БДП-а до 2030. године
9-10-long_term_objective_national: >-
  За Босну и Херцеговину у оквиру овог индикатора није утврђен посебан национални нумерички дугорочни циљ који би се користио за аутоматски обрачун статуса напретка. Циљ ЕУ од 3% БДП-а представља референтни циљ на нивоу Европске уније и не представља аутоматски национални циљ Босне и Херцеговине.
9-30-title: Особље за истраживање и развој
9-30-definition: >-
  Индикатор мјери удио особља за истраживање и развој у сљедећим институционалним секторима: пословни сектор (BES), сектор државе (GOV), сектор високог образовања (HES) и приватни непрофитни сектор (PNP). Подаци су изражени у еквивалентима пуног радног времена (FTE) као удио радне снаге.
9-30-definition_national: >-
  Индикатор мјери удио особља за истраживање и развој у Босни и Херцеговини, израженог у еквивалентима пуног радног времена (FTE) као удио радне снаге. Обухваћени су пословни сектор (BES), сектор државе (GOV), сектор високог образовања (HES) и приватни непрофитни сектор (PNP).
9-30-intention: >-
  Индикатор је дио скупа индикатора ЕУ за циљеве одрживог развоја и користи се за праћење напретка према циљу одрживог развоја 9 о изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација. Истраживање и развој и иновације важни су покретачи конкурентности и запошљавања у економији заснованој на знању.
9-30-intention_national: >-
  Индикатор омогућава праћење људских ресурса ангажованих у истраживању и развоју у Босни и Херцеговини и поређење са подацима за Европску унију и друге земље који се заснивају на истој методологији. На тај начин индикатор пружа информације о капацитету земље у области истраживања и развоја и људским ресурсима расположивим за истраживачке и развојне активности.
9-30-methodology: >-
  Истраживање и развој представљају важну основу за стварање новог знања, технолошки развој и иновације. Индикатор обухвата истраживаче и друго особље које пружа директну подршку активностима истраживања и развоја. Праћење њиховог удјела у радној снази омогућава праћење развоја људских ресурса ангажованих у истраживању и развоју. Евростат напредак прати кроз промјене вриједности индикатора кроз вријеме.
9-30-methodology_national: >-
  Подаци за Босну и Херцеговину обухватају особље које је непосредно ангажовано у истраживању и развоју, укључујући истраживаче и друго особље које пружа директну подршку активностима истраживања и развоја. Вриједност индикатора за Босну и Херцеговину за 2021. годину износи 0,14% радне снаге. Податак је преузет из Евростатове базе података за индикатор SDG 9.30.
9-30-long_term_objective: >-
  За овај индикатор није утврђена посебна квантитативна циљна вриједност на нивоу Европске уније. Напредак се процјењује на основу промјене вриједности индикатора кроз вријеме.
9-30-long_term_objective_national: >-
  За овај индикатор није утврђена посебна квантитативна циљна вриједност на нивоу Босне и Херцеговине. Напредак се може пратити на основу промјене вриједности индикатора кроз вријеме, када буду доступни подаци за више референтних година.
9-40-title: Пријаве патената Европском патентном бироу
9-40-definition: >-
  Овај индикатор мјери захтјеве за заштиту проналазака поднесене Европском патентном заводу (EPO), без обзира на то да ли су одобрени или не. Пријаве се распоређују према земљи пребивалишта проналазача.
  Подаци се исказују као укупан број пријава и као број пријава на милион становника.
9-40-definition_national: >-
  Индикатор мјери патентну активност повезану са заштитом изума и обухвата патентне пријаве поднесене Европском заводу за патенте.
  За потребе праћења индикатора подаци се исказују као укупан број патентних пријава и као број пријава на милион становника.
9-40-intention: >-
  Индикатор се користи за праћење циља одрживог развоја 9, који је усмјерен на изградњу отпорне инфраструктуре, промовисање инклузивне и одрживе индустријализације и подстицање иновација. Патентне пријаве представљају једну од мјера инвентивне активности и пружају информације о способности земаља и њихових предузећа да резултате истраживања и знања претворе у потенцијалне иновације и економске користи.
  Захтјеви за заштиту проналаска могу се поднијети директно Европском патентном заводу (EPO) или путем поступка према Уговору о сарадњи у области патената (PCT), уз именовање EPO-а. У складу са методологијом индикатора, пријаве се распоређују према земљи пребивалишта проналазача.
9-40-intention_national: >-
  Индикатор пружа информације о патентној активности и представља једну од мјера инвентивне и иновацијске активности у Босни и Херцеговини.
  Праћење патентних пријава омогућава увид у активности усмјерене на заштиту нових проналазака и пружа информације о развоју иновацијске активности у земљи.
9-40-methodology: >-
  Индикатор омогућава праћење патентне активности кроз вријеме. За процјену дугорочног и краткорочног кретања користе се подаци о броју патентних пријава, док се број пријава на милион становника користи за поређење релативног нивоа патентне активности између земаља.
9-40-methodology_national: >-
  Агенција за статистику Босне и Херцеговине преузима податке о патентима од Института за интелектуалну својину Босне и Херцеговине, према дефинисаним табелама, и обрађује их у складу са међународном методологијом за статистику патената. Институт за интелектуалну својину Босне и Херцеговине је надлежна институција за патенте у Босни и Херцеговини.
  Аутоматски статус напретка израчунава се на основу промјене вриједности броја патентних пријава кроз доступну временску серију, уз примјену методологије аутоматског израчунавања напретка у оквиру Open SDG платформе. За процјену напретка користи се серија патентних пријава према земљи пребивалишта проналазача, исказана као укупан број пријава. Будући да је ријеч о позитивно усмјереном индикатору, повећање вриједности током времена представља кретање у повољном смјеру, док смањење вриједности представља кретање у супротном смјеру. Процјена напретка заснива се на смјеру и динамици промјене вриједности кроз временску серију и не представља оцјену достизања посебне националне циљне вриједности.
  Подаци за индикатор SDG 9.40 који се користе за међународно поређење заснивају се на подацима Европског завода за патенте (EPO) и Евростата, у складу са методологијом овог индикатора. Ова међународна серија представља засебан извор података у односу на националне податке које Агенција за статистику Босне и Херцеговине преузима од Института за интелектуалну својину Босне и Херцеговине.
9-40-long_term_objective: >-
  За овај индикатор на нивоу Европске уније није утврђена посебна политичка квантитативна циљна вриједност. У методологији која се користи за процјену овог индикатора као референтна дугорочна вриједност користи се 240 патентних пријава на милион становника.
9-40-long_term_objective_national: >-
  За овај индикатор није утврђена посебна квантитативна циљна вриједност на нивоу Босне и Херцеговине. Напредак се прати на основу промјене вриједности индикатора кроз вријеме, при чему се процјењују смјер и динамика промјене на основу доступне временске серије.
9-50-title: Удио аутобуса и возова у унутрашњем путничком превозу
9-50-definition: >-
  Овај индикатор мјери удио аутобуса, укључујући аутобусе и тролејбусе, и возова у унутрашњем путничком саобраћају, изражен у путничким километрима (пкм). Путнички превоз овде обухвата превоз путничким аутомобилима, аутобусима и вагонима и возовима, али не укључује унутрашње пловне путеве, ваздушни и поморски превоз. Сви подаци се заснивају на кретањима унутар националних територија, без обзира на националност возила. Подаци о путевима потичу из добровољног прикупљања и нису у потпуности усклађени на нивоу ЕУ. Системи трамваја и метроа нису укључени јер методологија прикупљања података за ова превозна средства није довољно усклађена између држава чланица.
9-50-intention: >-
  Индикатори који се користе за праћење напретка ка циљу одрживог развоја 9 о изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација и ка циљу одрживог развоја 11 о стварању градова и људских насеља инклузивним, безбедним, отпорним и одрживим, који су уграђени у приоритете Европске комисије 2024-2029. године у оквиру „Нове ере за европску одбрану и безбједност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: Безбједност хране, вода и природа“ и „Заштита наше демократије, очување наших вриједности“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 9.1.2 „Количине путника и терета, према начину превоза“.
9-50-methodology: >-
  Преиспитивање будуће мобилности укључује оптимизацију коришћења свих видова превоза, дијељење аутомобила и мултимодалну интеграцију између различитих видова колективног превоза као што су воз, трамвај, метро, аутобус и такси.
  Комисија је 2020. године усвојила „Стратегију одрживе и паметне мобилности“ заједно са Акционим планом од 82 иницијативе. Ова стратегија поставља темеље за то како транспортни систем ЕУ може да оствари своју зелену и дигиталну трансформацију и постане отпорнији на будуће кризе. Као што је наведено у Европском зеленом договору, циљ ће бити смањење емисија од 90% до 2050. године, које ће се остварити паметним, конкурентним, безбједним, приступачним и приступачним транспортним системом.
9-50-long_term_objective: >-
  Нема описа
9-60-title: Удио жељезнице и унутрашњих пловних путева у превозу робе унутар земље
9-60-definition: >-
  Овај индикатор мјери удио жељезнице и унутрашњих пловних путева у унутрашњем теретном саобраћају, изражен у тонским километрима (ткм).
  Унутрашњи теретни саобраћај обухвата друмски, железнички и унутрашњи пловни пут. Сви подаци се заснивају на кретању на националној територији; жељезнички и унутрашњи пловни путеви се прикупљају на основу кретања на националној територији, без обзира на националност воза или пловила.
  Дјелатност друмског превоза се прикупља према земљи регистрације возила, без обзира на територију на којој се обавља дјелатност. Активност се прерасподјељује на територију на којој се активност заправо обавља моделирањем вјероватног итинерера путовања на европској путној мрежи. Тренутно није укључен ни поморски ни ваздушни теретни саобраћај.
9-60-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у изградњи отпорне инфраструктуре, промовисању инклузивне и одрживе индустријализације и подстицању иновација које су уграђене у приоритете Европске комисије 2024-2029 у оквиру „Нове ере за европску одбрану и безбједност“.
  Индикатор се може сматрати сличним глобалном индикатору СДГ 9.1.2 „Количине путника и терета, према начину превоза“.
9-60-methodology: >-
  Иако је слободно кретање робе суштинска компонента унутрашњег тржишта ЕУ и важно за одржавање конкурентности европске индустрије и услуга, транспорт треба организовати на еколошки прихватљив начин.
  Ова стратегија поставља темеље за то како транспортни систем ЕУ може да оствари своју зелену и дигиталну трансформацију и постане отпорнији на будуће кризе. Као што је наведено у Европском зеленом договору, циљ ће бити смањење емисија од 90% до 2050. године, које ће се остварити паметним, конкурентним, безбједним, приступачним и приступачним транспортним системом.
9-60-long_term_objective: >-
  Нема описа
9-70-title: Интензитет емисијa у ваздух у индустрији
9-70-definition: >-
  Овај индикатор мјери интензитет емисија честица (ПМ10 и ПМ2.5) из производног сектора (НАЦЕ Рев. 2 сектор „Ц“). Емисије у ваздух се дефинишу као токови гасовитих и честица материјала који се емитују у атмосферу. 
  Ситне и крупне честице (ПМ10) су мање од 10 микрометара у пречнику и могу се пренијети дубоко у плућа, где могу изазвати упалу и погоршати стање људи који пате од болести срца и плућа. Фине честице (ПМ2,5) су пречника мањег од 2,5 микрометара и стога су подскуп честица ПМ10. Њихови негативни утицаји на здравље су озбиљнији од ПМ10 јер се могу увући даље у плућа и могу бити токсичнији. 
  Интензитет емисије се израчунава тако што се емисије ПМ сектора подјеле са његовом бруто додатом вриједношћу (БДВ), која се дефинише као производња (у основним цјенама) умањена за средњу потрошњу (у куповним цјенама)
9-70-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 9 у области индустрије, иновација и инфраструктуре, који је уграђен у приоритете Европске комисије за период 2024-2029. године под називом „Нова ера за европску одбрану и безбједност“.
9-70-methodology: >-
  СДГ 9 препознаје значај технолошког напретка и иновација за проналажење трајних решења за друштвене, економске и еколошке изазове као што су отварање нових радних мјеста и промоција ресурсне и енергетске ефикасности. Да би се подстакле иновације и предузетништво, СДГ 9 такође настоји да повећа приступ финансијским услугама за мала предузећа и да премости дигитални јаз повећањем приступа информационим и комуникационим технологијама.
  Са својим Чистим индустријским договором из фебруара 2025. године, Европска комисија износи конкретне акције за претварање декарбонизације у покретач раста европских индустрија. То укључује снижавање цјена енергије, стварање квалитетних радних мјеста и праве услове за напредак компанија.
9-70-long_term_objective: >-
  Дугорочни циљ индикатора је мјерење напретка ка циљу обезбјеђивања здравог живота и промовисања благостања за све у свим узрастима.
10-10-title: БДП по глави становника прилагођен куповној моћи
10-10-definition: >-
 Бруто домаћи производ (БДП) је мјера економске активности и односи се на вриједност укупне производње роба и услуга које производи економија, умањену за интермедијарну потрошњу и увећану за нето порезе на производе и увоз. БДП по глави становника израчунава се као однос БДП-а и просјечног броја становника у одређеној години.
 БДП по глави становника изражава се у стандардима куповне моћи (PPS), који представљају заједничку валутну јединицу којом се елиминишу разлике у нивоима цијена између земаља и омогућавају смислена поређења обима економске активности. Вриједности су доступне и као индекс у односу на просјек Европске уније, који је постављен на 100. Вриједност изнад 100 означава ниво БДП-а по глави становника изнад просјека ЕУ, док вриједност испод 100 означава ниво испод просјека ЕУ. Овај индекс намијењен је поређењу између земаља, а не поређењу кроз вријеме.
10-10-definition_national: >-
 Бруто домаћи производ (БДП) је мјера економске активности и односи се на вриједност укупне производње роба и услуга које производи економија, умањену за интермедијарну потрошњу и увећану за нето порезе на производе и увоз. БДП по глави становника израчунава се као однос БДП-а и просјечног броја становника у одређеној години.
 БДП по глави становника у стандардима куповне моћи (PPS) омогућава поређење нивоа економске активности између земаља тако што се елиминишу разлике у нивоима цијена. Вриједност се може изразити и као индекс у односу на просјек ЕУ-27, који је постављен на 100. Овај индекс омогућава поређење релативног нивоа БДП-а по глави становника између земаља.
10-10-intention: >-
  Индикатор је дио скупа индикатора одрживог развоја Европске уније и користи се за праћење напретка према циљу одрживог развоја 10, који се односи на смањење неједнакости унутар и између земаља. Индикатор се може сматрати сличним глобалном индикатору SDG 8.1.1 „Годишња стопа раста реалног БДП-а по глави становника“. Истовремено, индикатор економских разлика између земаља ЕУ заснован на БДП-у по глави становника прилагођеном паритету куповне моћи пружа информације о конвергенцији нивоа економске активности међу државама чланицама.
  Индикатор је релевантан и у контексту Европског стуба социјалних права, који утврђује кључна начела за подршку праведним и добро функционалним тржиштима рада и системима социјалне заштите. Та начела обухватају питања повезана са неједнакошћу исхода и могућности, укључујући приходе и богатство, плате, социјалну заштиту, родну равноправност, социјалне услуге, бригу о дјеци, приходе у старости, здравствену заштиту и приступ становању.
10-10-intention_national: >-
  Индикатор пружа информацију о релативном нивоу економске активности у Босни и Херцеговини у односу на земље Европске уније и друге земље обухваћене међународним поређењима. Праћење БДП-а по глави становника у PPS омогућава сагледавање разлика у економском нивоу између земаља уз уважавање разлика у нивоима цијена.
  Индикатор је релевантан за праћење циља одрживог развоја 10, који се односи на смањење неједнакости унутар и између земаља. У контексту Босне и Херцеговине, подаци омогућавају праћење релативног економског нивоа земље и његових промјена кроз вријеме.
10-10-methodology: >-
  Индикатор прати БДП по глави становника изражен у стандардима куповне моћи (PPS), чиме се омогућава поређење нивоа економске активности између земаља уз уклањање разлика у нивоима цијена. За агрегате Европске уније, неједнакости у БДП-у по глави становника мјере се коефицијентом варијације националних вриједности. Ова мјера пружа информацију о конвергенцији економске активности међу државама чланицама ЕУ.
  Индикатор се ажурира једном годишње, а подаци се објављују за календарску годину. Подаци се заснивају на подацима Европског статистичког система (ESS), које земље достављају Евростату. Доступна је временска серија која почиње 2000. године, уз више од четири међусобно упоредива податка без методолошког прекида.
10-10-methodology_national: >-
  Индикатор прати БДП по глави становника изражен у стандардима куповне моћи (PPS). Подаци за Босну и Херцеговину објављују се кроз националну статистику коју производи Агенција за статистику Босне и Херцеговине (BHAS), а подаци се користе и у оквиру хармонизованих међународних поређења које објављује Евростат. У подацима за Босну и Херцеговину доступне су вриједности БДП-а по глави становника у PPS, као и индекс нивоа БДП-а по глави становника у односу на просјек ЕУ-27 = 100. Ове двије мјере пружају информације о апсолутном нивоу БДП-а по глави становника израженом у PPS и о релативном положају Босне и Херцеговине у односу на просјек ЕУ-27.
  За потребе праћења напретка на порталу, тренд се израчунава на основу промјене БДП-а по глави становника израженог у PPS. Повећање вриједности кроз вријеме представља позитиван смјер кретања индикатора. 
10-10-long_term_objective: >-
  За овај индикатор није дефинисана посебна квантитативна дугорочна циљна вриједност на нивоу Европске уније. Индикатор се користи за дугорочно праћење промјена у нивоу БДП-а по глави становника прилагођеног паритету куповне моћи и, на нивоу агрегата ЕУ, за праћење кретања економских разлика између држава чланица. Дугорочна анализа индикатора омогућава праћење конвергенције економске активности међу државама чланицама ЕУ.
10-10-long_term_objective_national: >-
  За овај индикатор у Босни и Херцеговини није утврђена посебна национална квантитативна циљна вриједност за 2030. годину. Индикатор се користи за дугорочно праћење промјена нивоа БДП-а по глави становника у Босни и Херцеговини и њеног релативног економског положаја у односу на земље Европске уније. Дугорочна анализа индикатора омогућава праћење промјена економског нивоа Босне и Херцеговине и економских разлика у односу на земље Европске уније. 
10-20-title: Разлике у дохотку домаћинстава по становнику
10-20-definition: >-
  Индикатор одражава куповну моћ домаћинстава и њихову способност да улажу у добра и услуге или штеде за будућност, обрачунавањем пореза и социјалних доприноса и новчаних социјалних давања у натури. Израчунава се као кориговани бруто расположиви доходак домаћинстава и непрофитних институција које опслужују домаћинства (НПИСХ) подељен са паритетима куповне моћи (ППП) стварне индивидуалне потрошње домаћинстава и са укупном резидентном популацијом.
10-20-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 10 о смањењу неједнакости унутар и између земаља и циљу одрживог развоја 1 о искорењивању сиромаштва у свим његовим облицима свуда, који је уграђен у приоритете Европске комисије под „Подршка људима, јачање наших друштава и нашег социјалног модела“.
10-20-methodology: >-
  Индикатор је укључен као главни индикатор у Табелу социјалних индикатора за Европски стуб социјалних права. Европски стуб за социјална права, усвојен 2017. године, поставља низ кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ти принципи се баве темама везаним за неједнакост, решавајући и неједнакост исхода (неједнакост прихода и богатства) и неједнакост могућности: од одређивања плата до система социјалне заштите (укључујући минимални доходак), родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
  Док се БДП по глави становника користи за мјерење економских перформанси земље, бруто расположиви доходак домаћинстава пружа индикацију просјечног материјалног благостања људи. Индикатор стога мјери да ли се државе чланице ЕУ конвергирају у смислу прихода људи.
10-20-long_term_objective: >-
  Нема описа
10-30-title: Релативни медијан ризика од сиромаштва
10-30-definition: >-
  Индикатор се израчунава као растојање између медијане еквивалентног укупног нето прихода лица испод прага ризика од сиромаштва и самог прага ризика од сиромаштва, изражено као проценат прага ризика од сиромаштва. Овај праг је постављен на 60% националног медијана еквивалентног расположивог дохотка свих људи у земљи, а не за ЕУ у цјелини.
10-30-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“.
   Европски стуб социјалних права утврђује 20 кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ови принципи се баве темама везаним за неједнакост рјешавањем и неједнакости исхода и неједнакости могућности: од одређивања плата до система социјалне заштите, родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
10-30-methodology: >-
  Акциони план за европски стуб социјалних права претвара принципе европског стуба социјалних права у конкретне акције у корист грађана. Предлаже главне циљеве у вези са стопом запослености, учешћем одраслих у учењу и ризиком од сиромаштва и социјалне искључености које ЕУ треба да достигне до 2030. године.
  Европски семестар је кључни алат за спровођење Стуба и координира економске и фискалне политике држава чланица ЕУ. У оквиру свог Зеленог договора, Европска комисија је најавила да ће европски семестар бити преусмерен на интеграцију циљева одрживог развоја и стављање одрживости и добробити грађана у центар економске политике.
10-30-long_term_objective: >-
  СДГ 10 позива нације да прилагоде политике и законодавство како би повећале приход доњих 40% становништва и смањиле неједнакости на основу прихода, пола, старости, инвалидитета, расе, класе, етничке припадности, религије и могућности.
10-41-title: Џинијев индекс - замјенски индикатор
10-41-definition_national: >-
  Индикатор приказује неједнакост у расподјели дохотка или потрошње међу појединцима или домаћинствима, изражену Gini индексом. Gini индекс представља мјеру неједнакости расподјеле, при чему вриједност 0 означава потпуну једнакост, а вриједност 100 потпуну неједнакост.
10-41-intention_national: >-
  Индикатор пружа информације о нивоу и кретању неједнакости у расподјели дохотка или потрошње у Босни и Херцеговини. Праћење индикатора омогућава праћење промјена у неједнакости кроз вријеме и доприноси праћењу напретка у смањењу неједнакости.
10-41-methodology_national: >-
  За потребе праћења циља 10 у Босни и Херцеговини користи се замјенски индикатор који представља Gini индекс као мјеру неједнакости у расподјели дохотка или потрошње. Подаци приказани за овај индикатор преузети су из базе World Development Indicators Свјетске банке и представљају процјене Свјетске банке. Према методолошким информацијама Свјетске банке, подаци се заснивају на примарним подацима из национално репрезентативних анкета домаћинстава које Свјетска банка добија од државних статистичких институција и својих регионалних канцеларија.
  Gini индекс је негативно усмјерен у односу на жељени смјер кретања, односно смањење вриједности представља повољно кретање, док повећање вриједности представља неповољно кретање. Аутоматски статус напретка израчунава се на основу смјера и динамике промјене вриједности индикатора кроз доступну временску серију, уз примјену методологије аутоматског израчунавања напретка у оквиру Open SDG платформе. За процјену напретка користи се негативни смјер, тако да смањење вриједности Gini индекса представља кретање у повољном смјеру. Приказани статус „Умјерен напредак“ представља резултат аутоматског израчунавања на основу доступних података и дефинисаног начина процјене напретка. Будући да је ријеч о замјенском индикатору, процјена напретка односи се на аспект неједнакости који мјери Gini индекс и не представља директну процјену свих димензија изворног индикатора.
10-41-long_term_objective_national: >-
  За овај замјенски индикатор није утврђена посебна национална циљна вриједност Босне и Херцеговине. Кретање индикатора прати се кроз промјене Gini индекса кроз вријеме, при чему смањење вриједности указује на смањење неједнакости у расподјели дохотка или потрошње.
10-50-title: Удио дохотка доњих 40% становништва
10-50-definition: >-
  Индикатор мјери удио прихода који је примило доњих 40% становништва. Коришћени концепт прихода је укупан расположиви доходак домаћинства.
10-50-intention: >-
  Циљ одрживог развоја 10 има за циљ смањење неједнакости унутар и између земаља; што је уграђено у приоритете Европске комисије под „Подршка људима, јачање нашег друштва и нашег социјалног модела“. 
  Индикатор се може сматрати сличним глобалном Индикатору СДГ 10.1.1 „Стопе раста трошкова домаћинстава или прихода по глави становника међу доњих 40 процената становништва и укупног становништва“.
  Индикатор је релевантан за мјерење укупне промене животног стандарда оних са најнижим приходима током више година.
  Европски стуб социјалних права утврђује 20 кључних принципа за подршку праведним и добро функционишућим тржиштима рада и системима социјалне заштите. Ови принципи се баве темама везаним за неједнакост рјешавањем и неједнакости исхода и неједнакости могућности: од одређивања плата до система социјалне заштите, родне равноправности, омогућавања социјалних услуга, бриге о дјеци и подршке дјеци, прихода од старости, здравствене заштите и приступа становању.
10-50-methodology: >-
  Акциони план за европски стуб социјалних права претвара принципе европског стуба социјалних права у конкретне акције у корист грађана. Предлаже главне циљеве у вези са стопом запослености, учешћем одраслих у учењу и ризиком од сиромаштва и социјалне искључености које ЕУ треба да достигне до 2030. године.
  Европски семестар је кључни алат за спровођење Стуба и координира економске и фискалне политике држава чланица ЕУ. У оквиру свог Зеленог договора, Европска комисија је најавила да ће европски семестар бити преусмерен на интеграцију циљева одрживог развоја и стављање одрживости и добробити грађана у центар економске политике.
  Европски социјални фонд (ЕСФ) је главни инструмент ЕУ за улагање у људе од усвајања Римског уговора. Помаже у борби против неједнакости, како у смислу исхода тако и могућности, финансирањем акција у областима запошљавања, социјалне инклузије, образовања, обуке и реформи административних капацитета. Ревидирани Европски социјални фонд плус (ЕСФ+), са буџетом од 101 милијарде евра у оквиру Вишегодишњег финансијског оквира 2021–2027, додатно ће помоћи у смањењу неједнакости.
10-50-long_term_objective: >-
  Нема описа
10-60-title: Захтjеви за азил
10-60-definition: >-
  Индикатор приказује број првих подносилаца захтјева за међународну заштиту на милион становника и број позитивних првостепених одлука на милион становника. Први подносилац захтјева за међународну заштиту је лице које први пут подноси захтјев за азил у посматраној земљи. Првостепене одлуке су одлуке које доноси надлежни орган који поступа као првостепени орган у административном или судском поступку за азил у земљи која прима захтјев.
10-60-definition_national: >-
  Индикатор приказује број првих подносилаца захтјева за међународну заштиту и број позитивних првостепених одлука о захтјевима за међународну заштиту, изражен на милион становника. Први подносилац захтјева за међународну заштиту је лице које први пут подноси захтјев за азил у Босни и Херцеговини. Позитивне првостепене одлуке су одлуке које доноси надлежни орган у првостепеном поступку и којима се одобрава међународна заштита у складу са важећим прописима Босне и Херцеговине.
10-60-intention: >-
  Индикатор се користи за праћење кретања у области међународне заштите у Европској унији. Омогућава праћење броја првих подносилаца захтјева за међународну заштиту и позитивних првостепених одлука у односу на број становника.
10-60-intention_national: >-
  Индикатор пружа информације о кретању броја првих подносилаца захтјева за међународну заштиту и позитивних првостепених одлука у Босни и Херцеговини. Праћење ових података доприноси разумијевању кретања у области међународне заштите и миграција.
10-60-methodology: >-
  Подаци се заснивају на административним подацима о међународној заштити које Евростату достављају национална министарства унутрашњих послова и друге повезане службене институције у оквиру Европског статистичког система (ESS). За израчунавање индикатора користе се подаци о првим подносиоцима захтјева, првостепеним одлукама и становништву. Вриједности се изражавају као број на милион становника. Индикатор обухвата двије одвојене временске серије: прве подносиоце захтјева за међународну заштиту и позитивне првостепене одлуке.
  Потребан је опрез при поређењу ове двије вриједности јер захтјеви примљени у једној години могу бити обрађени тек у каснијој години. Подаци се производе у складу са стандардима квалитета европске статистике и методолошким правилима која се примјењују на статистику међународне заштите.
10-60-methodology_national: >-
  Подаци за индикатор заснивају се на националним административним подацима о међународној заштити које обезбјеђује Министарство безбједности Босне и Херцеговине, Сектор за азил. Сектор за азил надлежан је за поступање по захтјевима за азил, доношење одлука у поступцима азила, регистрацију тражилаца азила и вођење службених евиденција и база података. За потребе индикатора SDG 10.60 подаци се приказују у складу са методолошким оквиром Евростата и изражавају као број на милион становника. Индикатор обухвата двије одвојене временске серије: прве подносиоце захтјева за међународну заштиту и позитивне првостепене одлуке. Ове двије серије не представљају исту групу лица у истој години, јер захтјев поднесен у једној години може бити ријешен у каснијој години.
  Подаци се прикупљају из административних евиденција и обрађују у складу са захтјевима за међународно упоредиву статистику. Методолошке дефиниције и правила за овај индикатор усклађени су са методологијом Евростата. За овај индикатор није примјењива процјена напретка према методологији ЕУ индикатора одрживог развоја, јер није утврђен одговарајући циљ политике на основу којег би се могао оцјењивати напредак.
10-60-long_term_objective: >-
  Индикатор се користи за праћење кретања у области међународне заштите у оквиру ЕУ индикатора одрживог развоја. За овај индикатор није утврђен циљ политике на основу којег би се могла примјењивати процјена напретка.
10-60-long_term_objective_national: >-
  За овај индикатор није утврђена посебна национална циљна вриједност Босне и Херцеговине. Индикатор се користи за праћење кретања у области међународне заштите кроз број првих подносилаца захтјева и позитивних првостепених одлука на милион становника.
11-11-title: Стопа тешке стамбене депривације
11-11-definition: >-
  Стопа тешке стамбене депривације дефинише се као проценат становништва које живи у стамбеној јединици која се сматра пренасељеном и истовремено показује најмање једну од следећих мера стамбене депривације: i) кров који цури, ii) нема каде/туша и нема тоалета у затвореном простору, iii) сматра се превише мрачном.
11-11-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и ка Циљу одрживог развоја 1 о вишедимензионалном сиромаштву. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање нашег квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 1 је уграђен у приоритете Европске комисије „Подршка људима, јачање наших друштава и нашег социјалног модела“.
11-11-methodology: >-
  Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, превозу, зеленим јавним површинама и још много тога, уз побољшање коришћења ресурса и смањење утицаја на животну средину. Циљ одрживог развоја 1, између осталог, позива на искорењивање екстремног сиромаштва и смањење релативног сиромаштва и уграђен је у приоритете Европске комисије у оквиру „Економије која ради за људе“.
11-10-long_term_objective: >-
  Нема описа
11-20-title: Становништво које живи у домаћинствима која трпе буку
11-20-definition: >-
  Индикатор мери удео становништва који пријављују да су погођени буком од комшија или са улице.
  Пошто је процена буке субјективна, треба напоменути да индикатор узима у обзир и нивое буке и стандарде људи о томе шта сматрају прихватљивим нивоима. Стога, повећање вредности индикатора не мора нужно указивати на слично повећање нивоа буке, већ на смањење нивоа које су европски грађани спремни да толеришу и обрнуто. У ствари, постоје емпиријски докази да перципирани квалитет животне средине од стране појединаца није увек у складу са стварним квалитетом животне средине процењеним коришћењем „објективних“ индикатора, посебно за буку.
11-20-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 11 о томе да градови и људска насеља буду инклузивни, безбедни, отпорни и одрживи, и Циљу одрживог развоја 3 о добром здрављу и благостању. Циљ одрживог развоја 11 је уграђен у приоритете Европске комисије „Нова ера за европску одбрану и безбедност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање квалитета живота: безбедност хране, вода и природа“ и „Заштита наше демократије, поштовање наших вредности“. Циљ одрживог развоја 3 је уграђен у приоритете Европске комисије „Подршка људима, јачање наших друштава и нашег социјалног модела“.
11-20-methodology: >-
  „Циљ одрживог развоја 11 има за циљ обнову и планирање градова и других људских насеља тако да нуде могућности за све, са приступом основним услугама, енергији, становању, превозу, зеленим јавним површинама и још много тога, уз побољшање коришћења ресурса и смањење утицаја на животну средину. Циљ одрживог развоја 3 има за циљ да обезбеди здравље и благостање за све у свим узрастима побољшањем репродуктивног, мајчиног и дечијег здравља; окончањем епидемија главних заразних болести; смањењем незаразних и менталних болести. Такође позива на смањење фактора ризика за здравље понашања и животне средине.
  Директива о буци у животној средини је главни инструмент ЕУ за идентификацију и борбу против загађења буком. Фокусира се на три области деловања: одређивање изложености буци у животној средини; осигуравање да су информације о буци у животној средини и њеним утицајима доступне јавности; спречавање и смањење буке у животној средини где је то потребно, посебно тамо где нивои изложености могу изазвати негативне ефекте на људско здравље, и очување квалитета буке у животној средини где је добар.“
11-20-long_term_objective: >-
  Нема описа
11-32-title: Индекс прекривања тла
11-32-definition: >-
  Овај индикатор мјери покривеност површине тла непропусним материјалима, што указује на непропусност. Агрегација вриједности непропусности с референтним јединицама, као што су урбана подручја, поплавне равнице, обалне зоне или заштићена подручја, врши се коришћењем интегрисане платформе просторних података EEA-е.
11-32-definition_national: >-
  Овај индикатор мјери покривеност површине тла непропусним материјалима, што указује на непропусност. Агрегација вриједности непропусности с референтним јединицама, као што су урбана подручја, поплавне равнице, обалне зоне или заштићена подручја, врши се коришћењем интегрисане платформе просторних података EEA-е.
11-32-intention: >-
  Индикатор се користи за праћење напретка према Циљу одрживог развоја 11 о томе да градови и људска насеља буду укључиви, сигурни, отпорни и одрживи, те према Циљу одрживог развоја 15 о заштити, обнови и промовисању одрживог коришћења земљишта. Циљ одрживог развоја 11 уграђен је у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбједност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање квалитета живота: безбједност хране, вода и природа“ и „Заштита наше демократије, очување наших вриједности“. Циљ одрживог развоја 15 уграђен је у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“.
11-32-intention_national: >-
  Индикатор се користи за праћење напретка према Циљу одрживог развоја 11 о томе да градови и људска насеља буду укључиви, сигурни, отпорни и одрживи, те према Циљу одрживог развоја 15 о заштити, обнови и промовисању одрживог коришћења земљишта. Циљ одрживог развоја 11 уграђен је у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбједност“, „Подршка људима, јачање наших друштава и нашег социјалног модела“, „Одржавање квалитета живота: безбједност хране, вода и природа“ и „Заштита наше демократије, очување наших вриједности“. Циљ одрживог развоја 15 уграђен је у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбједност хране, вода и природа“.
11-32-methodology: >-
  Подаци за Индекс покривености тла темеље се на подацима Европске агенције за животну средину (EEA) из слоја високе резолуције непропусности (Imperviousness High Resolution Layer), производа Copernicus Land Monitoring Service. Индекс покривености тла показује површину тла по становнику која је покривена непропусним материјалима усљед развоја и изградње, као што су зграде и грађевине, те потпуно или дјелимично непропусни вјештачки материјали попут асфалта или стакла. Вриједност се изражава у квадратним метрима по становнику. Подаци се објављују сваке три године.
11-32-methodology_national: >-
  Подаци за Индекс покривености тла преузимају се од Европске агенције за животну средину (EEA) и темеље се на подацима из слоја високе резолуције непропусности (Imperviousness High Resolution Layer), производа Copernicus Land Monitoring Service. Индекс покривености тла показује површину тла по становнику која је покривена непропусним материјалима усљед развоја и изградње, као што су зграде и грађевине, те потпуно или дјелимично непропусни вјештачки материјали попут асфалта или стакла. Вриједност се изражава у квадратним метрима по становнику. Подаци се објављују сваке три године, а временска серија за индикатор почиње 2006. године.
  Подаци за Босну и Херцеговину приказују се у оквиру методолошког оквира ЕУ индикатора одрживог развоја. За овај индикатор се на BHAS EU SDG порталу не израчунава прогрес, односно напредак. За израчунавање прогреса није утврђена одговарајућа нумеричка циљна вриједност која би се могла директно примијенити на вриједност Индекса покривености тла изражену у квадратним метрима по становнику.
11-32-long_term_objective: >-
  Стратегија за земљиште 2030 поставила је циљ нулте нето експлоатације земљишта до 2050. године.
11-32-long_term_objective_national: >-
  За овај индикатор није утврђена посебна национална циљна вриједност Босне и Херцеговине. Индекс покривености тла користи се за праћење обима и промјена површине тла покривене непропусним материјалима по становнику.
11-40-title: Смртни случајеви у друмском саобраћају
11-40-definition: >-
  Индикатор мјери број погинулих у саобраћајним незгодама, укључујући возаче и путнике у моторним возилима, возаче и путнике на бициклима, као и пјешаке. Лица која премину до 30 дана након настанка саобраћајне незгоде сматрају се погинулим у саобраћајним незгодама. Индикатор се може исказати као укупан број погинулих у саобраћајним незгодама и као број погинулих на 100 000 становника.
11-40-definition_national: >-
  Индикатор мјери број погинулих у саобраћајним незгодама у Босни и Херцеговини, укључујући учеснике у саобраћају који су смртно страдали као возачи, путници и пјешаци. Индикатор се исказује као укупан број погинулих у саобраћајним незгодама.
11-40-intention: >-
  Индикатор се користи за праћење напретка према Циљу одрживог развоја 11, који се односи на то да градови и људска насеља буду инклузивни, сигурни, отпорни и одрживи, као и према Циљу одрживог развоја 3, који се односи на обезбјеђивање здравља и благостања за све у свим животним добима. Индикатор је сличан глобалном индикатору Циљу одрживог развоја 3.6.1 „Стопа смртности усљед саобраћајних повреда“.
11-40-intention_national: >-
  Индикатор се користи за праћење безбједности саобраћаја и напретка према Циљу одрживог развоја 11, који се односи на сигурна, отпорна и одржива људска насеља, као и према Циљу одрживог развоја 3, који се односи на здравље и благостање.
11-40-methodology: >-
  Подаци се заснивају на подацима Европске комисије – Генералне дирекције за мобилност и транспорт (DG MOVE), из базе CARE, на основу података које достављају земље. Референтни период је календарска година, а индикатор се ажурира годишње. За потребе индикатора примјењује се дефиниција према којој се лица која премину до 30 дана након саобраћајне незгоде рачунају као погинула у саобраћајним незгодама. Подаци се могу исказивати као број погинулих и као број погинулих на 100 000 становника.
11-40-methodology_national: >-
  Податке о саобраћајним незгодама и погинулим лицима прикупљају и обрађују надлежни полицијски органи у Босни и Херцеговини, укључујући Федерално министарство унутрашњих послова, Министарство унутрашњих послова Републике Српске и Полицију Брчко дистрикта. Подаци се на државном нивоу достављају Министарству комуникација и транспорта Босне и Херцеговине, које има координациону улогу у области безбједности саобраћаја. Подаци се затим користе у оквиру Western Balkans Road Safety Observatory (WBRSO), којим управља Transport Community.
  Подаци за Босну и Херцеговину на BHAS EU SDG порталу преузети су из серије података Transport Community/WBRSO. Референтни период је календарска година, а подаци се приказују као укупан број погинулих у саобраћајним незгодама. За израчунавање напретка на BHAS EU SDG порталу користи се доступна временска серија за Босну и Херцеговину. Смјер напретка је негативан, односно смањење броја погинулих представља побољшање.
11-40-long_term_objective: >-
  Стратешки акциони план за безбједност саобраћаја и оквир политике безбједности саобраћаја ЕУ за период 2021–2030. постављају циљ смањења броја погинулих и тешко повријеђених за 50% до 2030. године у односу на 2019. годину. Дугорочна визија ЕУ је постизање нултог броја погинулих у саобраћају до 2050. године („Vision Zero“).
11-40-long_term_objective_national: >-
  За процјену напретка на BHAS EU SDG порталу користи се смјер промјене индикатора, при чему се смањење броја погинулих сматра напретком. Циљ политике безбједности саобраћаја ЕУ о смањењу броја погинулих за 50% до 2030. године у односу на 2019. годину представља европски референтни оквир и не третира се као посебно утврђен национални циљ Босне и Херцеговине.
11-52-title: Преране смрти због изложености финим честицама (PM2.5)
11-52-definition: >-
  Индикатор мјери процијењени број пријевремених смрти које се приписују дуготрајној изложености финим честицама PM2.5. Процјена се односи на изложеност концентрацијама PM2.5 изнад нивоа од 5 µg/m³. Индикатор се исказује као укупан број пријевремених смрти и као број пријевремених смрти на 100 000 становника.
11-52-definition_national: >-
  Индикатор мјери процијењени број пријевремених смрти у Босни и Херцеговини које се приписују дуготрајној изложености финим честицама PM2.5
11-52-intention: >-
  Индикатор прати здравствене посљедице дуготрајне изложености финим честицама PM2.5 и доприноси праћењу напретка у смањењу утицаја загађења ваздуха на здравље становништва.
11-52-intention_national: >-
  Индикатор омогућава праћење промјена процијењеног броја пријевремених смрти повезаних с дуготрајном изложеношћу PM2.5 у Босни и Херцеговини.
11-52-methodology: >-
  Податке припрема Европска агенција за животну средину (EEA). Број пријевремених смрти процјењује се на основу концентрација PM2.5 и методологије засноване на концентрацијско-одговорним функцијама за процјену здравствених посљедица изложености. Процјењује се само утицај изложености изнад 5 µg/m³. Подаци се исказују на годишњем нивоу.
11-52-methodology_national: >-
  Подаци за Босну и Херцеговину преузимају се од EEA и приказују у складу с методологијом EU индикатора. Подаци су доступни као укупан број пријевремених смрти и као број пријевремених смрти на 100 000 становника. За аутоматски обрачун напретка на порталу користи се серија изражена као укупан број пријевремених смрти. Напредак се израчунава на основу сложене просјечне годишње стопе промјене (CAGR), при чему је 2015. година почетна година обрачуна, јер су за ту годину доступни подаци. Смањење вриједности индикатора представља напредак.
11-52-long_term_objective: >-
  У оквиру Акционог плана ЕУ „Према нултом загађењу ваздуха, воде и земљишта“ постављен је циљ смањења здравствених посљедица загађења ваздуха за 55% до 2030. године у односу на 2005. годину.
11-52-long_term_objective_national: >-
  Босна и Херцеговина нема посебно утврђен квантитативни дугорочни национални циљ за овај индикатор. Циљ ЕУ смањења здравствених посљедица загађења ваздуха за 55% до 2030. године у односу на 2005. годину односи се на оквир политике ЕУ и не третира се као национални циљ Босне и Херцеговине.
11-60-title: Стопа рециклирања комуналног отпада
11-60-definition: >-
  Индикатор мјери количину комуналног отпада који се рециклира или припрема за поновну употребу у односу на укупну количину насталог комуналног отпада, изражену као проценат. Рециклирање обухвата материјално рециклирање, компостирање и анаеробну дигестију, као и припрему за поновну употребу.
11-60-definition_national: >-
  Индикатор за Босну и Херцеговину мјери удио рециклираног комуналног отпада у укупној количини насталог комуналног отпада, изражен у процентима, у складу са методолошким концептом ЕУ индикатора.
11-60-intention: >-
 Индикатор прати напредак у одрживом управљању комуналним отпадом, ефикаснијем коришћењу ресурса и преласку ка циркуларној економији. Већа стопа рециклирања указује на већи удио комуналног отпада који се усмјерава на рециклирање или припрему за поновну употребу.
11-60-intention_national: >-
 Индикатор омогућава праћење развоја рециклирања комуналног отпада у Босни и Херцеговини и сагледавање кретања у овој области у односу на методолошки и регулаторни оквир Европске уније.
11-60-methodology: >-
  Индикатор се израчунава као количина комуналног отпада који се рециклира или припрема за поновну употребу подијељена са укупном количином насталог комуналног отпада. Подаци се прикупљају на годишњем нивоу и односе се на календарску годину. Методолошки концепт заснива се на статистици Eurostata о комуналном отпаду.
11-60-methodology_national: >-
  Подаци за Босну и Херцеговину приказују се у складу са методолошким концептом ЕУ индикатора и подацима Eurostata. У доступној серији на порталу приказани су подаци за период 2022–2024, са вриједностима од 0,8%, 1,0% и 1,1%.
  За раније године за које Eurostat податке за Босну и Херцеговину означава као „Not available“, подаци се не третирају као нулте вриједности и нису укључени у приказану временску серију. Аутоматски обрачун напретка заснива се на доступној временској серији од 2022. године. Све доступне вриједности су позитивне, а повећање стопе рециклирања представља повољан смјер кретања. Због тога се напредак обрачунава у позитивном смјеру, у складу са методолошким оквиром Open SDG.
11-60-long_term_objective: >-
  На нивоу Европске уније постављен је циљ повећања припреме за поновну употребу и рециклирања комуналног отпада на најмање 60% до 2030. године. Ова вриједност представља референтни оквир ЕУ за праћење напретка у области рециклирања комуналног отпада.
11-60-long_term_objective_national: >-
  За Босну и Херцеговину циљ Европске уније од најмање 60% рециклирања и припреме за поновну употребу комуналног отпада до 2030. године не представља утврђени национални квантитативни циљ. Ова вриједност користи се као референтни оквир ЕУ за праћење и контекстуализацију развоја индикатора. Индикатор се користи за праћење развоја стопе рециклирања комуналног отпада у Босни и Херцеговини у складу са методолошким оквиром ЕУ индикатора одрживог развоја 
12-10-title: Потрошња опасних хемикалија
12-10-definition: >-
  Овај индикатор мери потрошњу токсичних хемикалија, изражену у милионима тона. Потрошња хемикалија се израчунава као збир производње (PRODCOM) и нето увоза хемикалија (COMEXT) према једначини: Потрошња = производња + увоз – извоз.
  Подаци о опасним и неопасним хемикалијама показују укупну потрошњу свих хемикалија. Две подкатегорије опасних хемикалија – опасне по људско здравље и опасне по животну средину – преклапају се по дефиницији и као резултат тога њихов збир није једнак укупној потрошњи опасних хемикалија.
12-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-10-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада.
  Оквир за регистрацију, евалуацију, одобравање и ограничавање хемикалија (REACH) има за циљ побољшање заштите људског здравља и животне средине кроз бољу идентификацију и управљање опасним хемикалијама. Оквир ће бити ажуриран, уз подршку Стратегије хемикалија за одрживост, која има за циљ побољшање заштите животне средине и нашег здравља од ризика које представљају хемикалије и подршку иновацијама за безбедне и одрживе хемикалије.
12-10-long_term_objective: >-
  Нема описа
12-21-title: Материјални отисак
12-21-definition: >-
  Материјални отисак, такође познат као потрошња сировина (RMC), представља глобалну потражњу за екстракцијом материјала (минерала, металних руда, биомасе, фосилних енергетских материјала) вођену потрошњом робе и услуга унутар географског референтног подручја. Подаци о материјалном отиску долазе из рачуна токова материјала, који моделирају токове природних ресурса из животне средине у економију. Они укључују домаћу екстракцију материјала мерену у тонама бруто материјала (на пример, бруто руда или бруто жетва), као и увоз и извоз мерени у смислу процењених еквивалената сировина тргованих производа (домаћа и страна екстракција потребна за производњу тргованих производа). RMC стога показује количину екстракције потребну за производњу робе коју траже крајњи корисници у географском референтном подручју, без обзира где у свету се екстракција материјала одвијала.
12-21-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, воде и природе“.
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада.
  Циљ одрживог развоја 8, између осталог, позива на промоцију радних права и безбедног и сигурног радног окружења.
  Индикатор се може сматрати сличним глобалном индикатору Циљева одрживог развоја 8.4.1 и 12.2.1 за елемент „Материјални отисак“.
12-21-methodology: >-
  Осми акциони програм за животну средину (EAP), усвојен у марту 2022. године, има за циљ да убрза прелазак на климатски неутралну, ресурсно ефикасну и регенеративну економију, препознајући да људска добробит зависи од здравих екосистема. Његови приоритетни циљеви укључују постизање климатске неутралности до 2050. године и обнављање биодиверзитета.
  Акциони план за циркуларну економију, усвојен 2020. године, има за циљ да удвостручи стопу коришћења циркуларних материјала у ЕУ током наредне деценије како би се подржало постизање климатске неутралности до 2050. године, одвојио економски раст од коришћења ресурса и стварања отпада и одржао потрошњу ресурса у оквирима еколошких граница. У марту 2022. године, Европска комисија је усвојила пакет мера о циркуларној економији како би одрживи производи постали норма у ЕУ и неговали циркуларне пословне моделе.
12-21-long_term_objective: >-
  Нема описа
12-31-title: Отисак потрошње
12-31-definition: >-
  Потрошачки отисак (КП) је модел процене животног циклуса (ЛЦА) који се користи за развој скупа од 16 индикатора животне средине ради процене утицаја образаца потрошње ЕУ и њених држава чланица на животну средину, а спроводи се комбиновањем података о интензитету потрошње са проценом утицаја репрезентативних производа на животну средину. Процена КП заснива се на комбинацији: (а) емисија у ваздух, земљиште и воду, као и ресурса који се користе током животног циклуса 164 репрезентативна производа, који припадају пет области потрошње (храна, мобилност, становање, кућни апарати и уређаји), (б) годишње потрошње (тј. интензитета потрошње) ових производа, израчунате из статистике потрошње, и (ц) методе процене утицаја еколошког отиска (ЕО), која претвара емисије и потрошњу ресурса у 16 потенцијалних утицаја на животну средину, који се могу објединити у један резултат, где је то прикладно. Индикатори утицаја ЕО могу се упоредити са скупом прагова заснованих на оквиру планетарних граница. Дакле, дати индикатор КП (на пример, климатске промене или еутрофикација мора) мери колико пута је утицај потрошње премашио повезану планетарну границу. Слично томе, индивидуални пондерисани CF резултат мери број пута када је пондерисана граница прекорачена.
12-31-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње, што је уграђено у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-31-methodology: >-
  Европска комисија је усвојила Акциони план за циркуларну економију (CEAP) у марту 2020. године. Прелазак ЕУ на циркуларну економију смањиће притисак на природне ресурсе и створити одрживи раст и радна места. Нови акциони план најављује иницијативе дуж целог животног циклуса производа. Он је усмерен на начин на који су производи дизајнирани, промовише процесе циркуларне економије, подстиче одрживу потрошњу и има за циљ да осигура да се спречи настанак отпада и да коришћени ресурси остану у економији ЕУ што је дуже могуће. Надовезујући се на постојеће политике и законодавство ЕУ, Пакет циркуларне економије утврђује акциони програм са мерама које покривају цео циклус, од производње и потрошње до управљања отпадом. Пакет укључује обавезе у вези са екодизајном, спречавањем настанка отпада и поновном употребом, циклусима чистих материјала и амбициозним квантитативним циљевима за повећање рециклаже и смањење одлагања отпада, обавезе за побољшање одвојеног сакупљања отпада, као и промоцију ефикасног коришћења био-ресурса.
12-31-long_term_objective: >-
  Нема описа
12-41-title: Степен кружне употребе материјала
12-41-definition: >-
  Стопа кружне употребе материјала, такође названа 'стопа кружности', мјери у процентима удио материјала рециклираног и враћеног у економију – чиме се штеди вађење примарних сировина – у укупној употреби материјала. Стопа кружности се стога дефинише као омјер кружне употребе материјала (U) и укупне употребе материјала (M).
12-41-intention: >-
  Индикатор се производи у складу са стандардима квалитета Европске статистике. Извор података: Европски статистички систем (ЕСС), изворна табела ENV_AC_CUR. Агенција за статистику Босне и Херцеговине не доставља табелу ENV_AC_CUR Евростату.
12-41-methodology: >-
  Европска комисија је усвојила Акциони план за циркуларну економију (CEAP) у марту 2020. године. Прелазак ЕУ на циркуларну економију смањиће притисак на природне ресурсе и створити одрживи раст и радна места. Нови акциони план најављује иницијативе дуж целог животног циклуса производа. Он је усмерен на начин на који су производи дизајнирани, промовише процесе циркуларне економије, подстиче одрживу потрошњу и има за циљ да осигура да се спречи настанак отпада и да коришћени ресурси остану у економији ЕУ што је дуже могуће. Надовезујући се на постојеће политике и законодавство ЕУ, Пакет циркуларне економије утврђује акциони програм са мерама које покривају цео циклус од производње и потрошње до управљања отпадом. Пакет укључује обавезе о екодизајну, спречавању настанка отпада и поновној употреби, циклусима чистих материјала и амбициозним квантитативним циљевима за повећање рециклаже и смањење одлагања на депоније, обавезе за побољшање одвојеног сакупљања отпада, као и промоцију ефикасног коришћења био-ресурсa.
  Акциони план за одрживу потрошњу и производњу и одрживу индустријску политику (SCP/SIP) укључује низ предлога о одрживој потрошњи и производњи који ће допринети побољшању еколошких перформанси производа и повећању потражње за одрживијем робом и производним технологијама. Осми акциони програм за животну средину (EAP), усвојен у марту 2022. године, има за циљ да убрза прелазак на климатски неутралну, ресурсно ефикасну и регенеративну економију, препознајући да људска добробит зависи од здравих екосистема. Међу његовим приоритетним циљевима су постизање климатске неутралности до 2050. године и обнављање биодиверзитета. Овај индикатор је такође укључен као главни индикатор и поставља циљ удвостручавања циркуларности употребе материјала до 2030. године у поређењу са 2020. годином.
12-41-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 30
12-51-title: Настанак отпада према опасности
12-51-definition: >-
  Индикатор се дефинише као укупна количина отпада настала у земљи. Обухвата отпад настао индустријском производњом, укључујући сектор управљања отпадом, као и отпад настао у домаћинствима. Укључени су велики токови минералног отпада, материјал из багеровања и земљиште. Због тога у земљама са значајним активностима у секторима као што су рударство и грађевинарство могу бити забиљежене велике количине насталог отпада.
12-51-definition_national: >-
  Индикатор за Босну и Херцеговину мјери укупну количину насталог отпада по становнику, изражену у килограмима по становнику, у складу са методолошким концептом ЕУ индикатора. Укупна вриједност обухвата опасни и неопасни отпад.
12-51-intention: >-
  Индикатор је дио скупа ЕУ индикатора одрживог развоја и користи се за праћење напретка према циљу одрживог развоја 12, који се односи на обезбјеђивање одрживих образаца потрошње и производње. Индикатор одражава напоре усмјерене на ефикасније коришћење ресурса, смањење настанка отпада и прелазак ка циркуларној економији.
  Индикатор се може посматрати и у контексту глобалног индикатора SDG 11.6.1, који се односи на управљање комуналним отпадом у урбаним подручјима. Повећање циркуларности европске економије представља важан приоритет Европске уније и један од кључних елемената Европског зеленог плана.
12-51-intention_national: >-
  Индикатор омогућава праћење количине насталог отпада у Босни и Херцеговини и сагледавање њеног кретања у контексту одрживе потрошње и производње, ефикасног коришћења ресурса и развоја циркуларне економије.
12-51-methodology: >-
  Индикатор мјери количину насталог отпада изражену у килограмима по становнику. Обухвата три категорије према опасности отпада: укупни отпад, односно опасни и неопасни отпад заједно, опасни отпад и неопасни отпад.
  Референтни период је календарска година. Подаци потичу из статистике отпада Европског статистичког система (ESS Waste Statistics), а Eurostat их објављује на основу података које достављају земље. Индикатор се ажурира сваке двије године.
12-51-methodology_national: >-
  Подаци за Босну и Херцеговину приказују се у складу са методолошким концептом ЕУ индикатора и подацима Eurostata. У доступној серији приказани су подаци за 2012, 2014, 2016, 2018, 2020. и 2022. годину. За обрачун напретка на порталу користи се укупна серија, која представља збир опасног и неопасног отпада. Серије се приказују као додатне категорије према опасности отпада, али се не користе за засебан обрачун напретка овог индикатора.
  Аутоматски обрачун напретка заснива се на временској серији доступној након 2015. године. Пошто за 2015. годину нема доступне вриједности, у складу са правилима Open SDG 2.4.0 као почетна година за обрачун користи се прва доступна година након 2015. године, односно 2016. година. За укупну серију вриједност је износила 1.744 kg по становнику у 2016. години, док је у 2022. години износила 2.047 kg по становнику. С обзиром на то да се код овог индикатора смањење количине насталог отпада сматра повољним смјером кретања, напредак се обрачунава у негативном смјеру. Овај обрачун напретка представља начин праћења кретања индикатора на порталу и не представља посебан национални квантитативни циљ.
12-51-long_term_objective: >-
  Индикатор нема посебно дефинисану нумеричку циљну вриједност у оквиру скупа ЕУ индикатора одрживог развоја. Његова улога је праћење развоја количине насталог отпада у контексту одрживе потрошње и производње, ефикасности коришћења ресурса и преласка ка циркуларној економији. Политике Европске уније у области циркуларне економије усмјерене су на спречавање настанка отпада, поновну употребу, рециклирање и ефикасније коришћење ресурса.
12-51-long_term_objective_national: >-
  За Босну и Херцеговину није утврђен посебан квантитативни национални циљ изражен у килограмима насталог отпада по становнику за овај индикатор. Индикатор се користи за праћење кретања количине насталог отпада и развоја одрживих образаца потрошње и производње, у складу са методолошким оквиром ЕУ индикатора одрживог развоја. Дугорочно унапређење одрживог управљања ресурсима подразумијева спречавање настанка отпада, ефикасније коришћење ресурса, поновну употребу и рециклирање, те развој циркуларне економије.
12-61-title: Бруто додата вриједност у сектору еколошких добара и услуга
12-61-definition: >-
  Сектор еколошких добара и услуга (EGSS) дефинисан је као онај део економије једне земље који производи добра и услуге које се користе у активностима заштите животне средине и управљања ресурсима, било на домаћем или међународном нивоу. Бруто додата вредност у EGSS-у представља допринос сектора еколошких добара и услуга БДП-у.
  Еколошки производи спречавају, смањују и елиминишу загађење или било коју другу деградацију животне средине и укључују мере предузете за обнову деградираних станишта и екосистема. Примери укључују електрична возила, катализаторе и филтере за смањење емисије загађивача, услуге третмана отпадних вода и отпада или радове на изолацији буке. Производи за управљање ресурсима штите залихе природних ресурса од исцрпљивања. Примери укључују производњу обновљиве енергије, енергетски ефикасне и пасивне зграде, десалинизацију морске воде или сакупљање кишнице.
12-61-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње и Циљу одрживог развоја 9 о изградњи отпорне инфраструктуре, промоцији инклузивне и одрживе индустријализације и неговању иновација, који су уграђени у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
12-61-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасном коришћењу ресурса и смањењу глобалног отпада. Циљ одрживог развоја 9 позива на изградњу отпорне и одрживе инфраструктуре и промоцију инклузивне и одрживе индустријализације. Такође препознаје важност истраживања и иновација у проналажењу трајних решења за друштвене, економске и еколошке изазове.
12-61-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 5,5.
13-10-title: Нето домаће емисије гасова са ефектом стаклене баште
13-10-definition: >-
  Индикатор мјери укупне националне емисије, односно емисије из сектора обухваћених системом ЕУ за трговину емисијама (ETS) и сектора изван ETS-а (ESD), такозване „Кјото корпе“ гасова са ефектом стаклене баште. Она обухвата угљен-диоксид (CO₂), метан (CH₄), азот-субоксид (N₂O) и F-гасове, односно хидрофлуороугљенике (HFC), перфлуороугљенике (PFC), азот-трифлуорид (NF₃) и сумпор-хексафлуорид (SF₆), из свих сектора инвентара емисија гасова са ефектом стаклене баште. Процијењене емисије из међународног ваздушног и поморског саобраћаја искључене су за појединачне земље. Индикатор се приказује као нето емисије са укљученим коришћењем земљишта, промјеном коришћења земљишта и шумарством (LULUCF), као и без LULUCF-а. Примјеном појединачних потенцијала глобалног загријавања (GWP) за сваки гас, емисије се обједињују у јединствени индикатор изражен у еквиваленту CO₂. Подаци се заснивају на годишњем извјештавању о инвентарима емисија гасова са ефектом стаклене баште у оквиру UNFCCC-а, а за Eurostat их обезбјеђује Европска агенција за животну средину (EEA).
13-10-definition_national: >-
  Индикатор за Босну и Херцеговину заснива се на подацима из Националног инвентарског документа (NID) Босне и Херцеговине, који се припрема и доставља Оквирној конвенцији Уједињених нација о промјени климе (UNFCCC). Национални подаци обухватају емисије гасова са ефектом стаклене баште изражене у тонама CO₂ еквивалента, у складу са методологијом националног инвентара емисија. За приказ на овом порталу користи се серија укупних емисија без понора из сектора коришћења земљишта, промјене коришћења земљишта и шумарства (LULUCF).
13-10-intention: >-
  Индикатор се користи за праћење напретка према Циљу одрживог развоја 13 о климатском дјеловању. Европски закон о клими утврђује циљ смањења нето емисија гасова са ефектом стаклене баште за најмање 55% до 2030. године у односу на 1990. годину и постизање климатске неутралности до 2050. године. Пакет „Fit for 55“ обухвата повезане мјере у области енергетике, саобраћаја, опорезивања и климатске политике.
13-10-intention_national: >-
  Индикатор омогућава праћење промјена укупних емисија гасова са ефектом стаклене баште у Босни и Херцеговини кроз вријеме и представља национални приказ индикатора EU SDG 13.10. Подаци се заснивају на званичном националном инвентару емисија који Босна и Херцеговина доставља UNFCCC-у. Посљедњи коришћени извор је 2024 National Inventory Document (NID) Босне и Херцеговине, достављен UNFCCC-у 13. августа 2026. године.
13-10-methodology: >-
  Индикатор се ажурира једном годишње. Eurostat наводи да се подаци за појединачне земље заснивају на извјештавању о инвентарима гасова са ефектом стаклене баште у оквиру UNFCCC-а, које за Eurostat обезбјеђује EEA. Временска серија почиње 1990. годином, а индикатор је доступан у три облика: милион тона CO₂ еквивалента, тона CO₂ еквивалента по становнику и индекс 1990=100.
13-10-methodology_national: >-
  Национални подаци преузети су из Националног инвентарског документа Босне и Херцеговине (NID) и изражени у тонама CO₂ еквивалента. За потребе праћења напретка на порталу израчунат је индекс емисија са базном 1990. годином, при чему је вриједност за 1990. годину постављена на 100. Индекс се израчунава као однос вриједности емисија у посматраној години и вриједности емисија у 1990. години, помножен са 100.
  За процјену напретка користи се серија I90 (1990=100). Будући да је код овог индикатора пожељан смјер смањење емисија, прогрес је конфигурисан са негативним смјером. На порталу је као почетна година за обрачун прогреса постављена 2015. година, а 2030. година као циљна година у конфигурацији индикатора. Смањење вриједности индекса представља повољан смјер кретања индикатора. Овај начин обрачуна прогреса представља конфигурацију коришћену за национални приказ индикатора на BHAS порталу и не представља посебну националну методологију Eurostata за Босну и Херцеговину.
13-10-long_term_objective: >-
  Смањење нето емисија гасова са ефектом стаклене баште за најмање 55% у односу на ниво из 1990. године до 2030. године и постизање климатске неутралности до 2050. године.
13-10-long_term_objective_national: >-
  Смањење емисија гасова са ефектом стаклене баште у односу на ниво из 1990. године, у складу са обавезама и циљевима Босне и Херцеговине у оквиру UNFCCC-а и националних климатских политика.
13-21-title: Нето емисије гасова стаклене баште у сектору LULUCF
13-21-definition: >-
  Овај индикатор мери нето уклањање угљеника из сектора коришћења земљишта, промена коришћења земљишта и шумарства (LULUCF), узимајући у обзир и емисије и уклањање из сектора. Подаци о LULUCF-у обухватају годишње токове CO2, CH4 и N2O са свих управљаних земљишта у ЕУ. Индикатор се изражава као еквивалент CO2 користећи потенцијал глобалног загревања (GWP) сваког гаса.
  Подаци о емисијама и уклањању, познати као инвентари гасова стаклене баште, годишње се извештавају од стране земаља чланица ЕУ и Оквирне конвенције Уједињених нација о климатским променама (UNFCCC). Европска агенција за животну средину (EEA) прикупља агрегиране податке ЕУ и објављује податке за ЕУ и све државе чланице. Евростат поново објављује податке EEA.
13-21-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 има за циљ спровођење обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем да се достигне 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-21-methodology: >-
  Европски закон о клими утврђује оквир за климатске акције и повећава амбиције ЕУ за 2030. годину, са новим циљем смањења нето емисија гасова стаклене баште (ГСГ) за најмање 55% до те године (у поређењу са 1990. годином) и постизања климатске неутралности до 2050. године. Европска комисија је такође увела пакет новог и ревидираног законодавства ЕУ о клими и енергетици – такозвани пакет „Спремни за 55“ – како би повећала своје амбиције за ублажавање климатских промена. Пакет обухвата међусобно повезан скуп мера у областима енергетике, транспорта, опорезивања и климатских политика, и укључује појачано и проширено одређивање цена угљеника, циљеве, стандарде и мере подршке. Такође поставља циљ за природне поноре угљеника од 310 милиона тона еквивалента CO2.
13-21-long_term_objective: >-
  Нема описа
13-31-title: Просjечне CO2 емисије по км нових путничких аутомобила
13-31-definition: >-
  Индикатор је дефинисан као просечна емисија угљен-диоксида (CO2) по км за нове путничке аутомобиле у датој години. Пријављене емисије се заснивају на хомологацији и могу се разликовати од стварних емисија CO2 нових аутомобила. Приликом праћења аутомобила и комбија, подаци о емисијама се приказују коришћењем протокола Новог европског циклуса вожње (NEDC) до 2019. године, коришћењем и NEDC и протокола Светски хармонизоване процедуре испитивања лаких возила (WLTP) у 2020. години, а од 2021. године само WLTP протокол.
13-31-intention: >-
  Индикатори који се користе за праћење напретка ка Циљу одрживог развоја 12 о обезбеђивању одрживих образаца потрошње и производње и ка Циљу одрживог развоја 13 о предузимању хитних мера за борбу против климатских промена и њихових утицаја. Ови циљеви одрживог развоја су укључени у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
13-31-methodology: >-
  Циљ одрживог развоја 12 позива на свеобухватан скуп акција од стране предузећа, креатора политике, истраживача и потрошача како би се прилагодили одрживим праксама. Он предвиђа одрживу производњу и потрошњу засновану на напредним технолошким могућностима, ефикасности ресурса и смањењу глобалног отпада.
  Циљ одрживог развоја 13 тежи да спроведе обавезу према Оквирној конвенцији Уједињених нација о климатским променама да се постигне климатски неутралан свет до средине века како би се ограничило глобално загревање на знатно испод 2°C, са циљем од 1,5°C (у поређењу са прединдустријским нивоима). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
  Пакет „Спремни за 55“ укључује међусобно повезан скуп законодавства ЕУ о клими и енергији, укључујући ажуриране стандарде емисије CO2 за нова возила.
13-31-long_term_objective: >-
  Нема описа
13-40-title: Економски губици повезани са климатским промjенама
13-40-definition: >-
  Индикатор мери економске губитке узроковане временским и климатским догађајима. Временски и климатски догађаји су дефинисани као метеоролошки догађаји (олује, лавине), хидролошки догађаји (поплаве) и климатолошки догађаји (топлотни таласи, хладни таласи, суше, шумски пожари) на основу класификације Међународног савета за науку (ICSU).
  Поред годишњих података, представљена је и изглађена временска серија заснована на 30-годишњим просецима. У складу са нормалним климатским периодом како га је дефинисала Светска метеоролошка организација, ови 30-годишњи просеци одражавају трендове искључујући значајну климатску варијабилност на краћим временским скалама услед природних фактора. Индикатор се заснива на подацима из CATDAT RiskLayer-а.
13-40-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 тежи спровођењу обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем од 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивних капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
  Овај индикатор се може сматрати сличним глобалним индикаторима Циљева одрживог развоја 1.5.2 и 11.5.2 „Директни економски губитак услед катастрофа у односу на глобални БДП“ (повезано са индикатором из Сендаија).
13-40-methodology: >-
  ЕУ ставља отпорност на катастрофе и климатске промене као централни циљ своје хуманитарне помоћи. Маркер отпорности ЕУ се користи у свим хуманитарним пројектима како би се дефинисали начини за смањење ризика од катастрофа и јачање капацитета људи да се носе са катастрофама и кризама. Акциони план за Сендајски оквир за смањење ризика од катастрофа 2015-2030 укључује снажан фокус на прилагођавање климатским променама, повезујући га са стратегијама за смањење ризика од катастрофа и њиховом кохерентном применом у земљама партнерима ЕУ.
  Нова Стратегија прилагођавања ЕУ подстиче паметније, брже и систематичније прилагођавање како би се испунила визија да ће ЕУ бити друштво отпорно на климатске промене 2050. године, потпуно прилагођено неизбежним утицајима климатских промена.
13-40-long_term_objective: >-
  Стратегија ЕУ за прилагођавање 2021; Референца политике: CLIM039; 8. Акциони програм за животну средину; Осигурање од климатских губитака; Економски губици; Катастрофе; Природне опасности.
13-50-title: Допринос међународној обавези од 100 милијарди америчких долара за издвајање средстава везаних за климатске промjене
13-50-definition: >-
  Индикатор мери укупан износ потрошен из годишњег буџета држава чланица ЕУ, као и Европске комисије и Европске инвестиционе банке, како би се допринело међународној обавези од 100 милијарди америчких долара за финансирање климатских промена у складу са Оквирном конвенцијом Уједињених нација о климатским променама (UNFCCC).
13-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 13 о климатским акцијама, који је уграђен у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати идентичним глобалном индикатору за Циљ одрживог развоја 13.а.1 „Износи обезбеђени и мобилисани у америчким доларима годишње ка текућем циљу мобилизације колективних обавеза од 100 милијарди америчких долара до 2025. године“.
13-50-methodology: >-
  Циљ одрживог развоја 13 има за циљ спровођење обавезе преузете Оквирном конвенцијом Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет, са циљем ограничавања глобалног загревања на знатно испод 2°C, са циљем достизања 1,5°C (у поређењу са прединдустријским периодом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-50-long_term_objective: >-
  Нема описа
13-70-title: Издавање зелених обвезница
13-70-definition: >-
  Зелене обвезнице су кредити које инвеститор даје зајмопримцу, а који се користе за финансирање пројеката или активности које промовишу ублажавање или прилагођавање климатским промјенама или друге циљеве заштите животне средине. Иако дефиниција зелене обвезнице може да варира, овај индикатор укључује обвезнице које су усклађене са четири основне компоненте Принципа зелених обвезница Међународног удружења тржишта капитала (ICMA) или су сертификоване од стране Иницијативе за климатске обвезнице (CBI). Издаваоци укључују корпорације као што су компаније или финансијске корпорације и издаваоце суверених обвезница које су националне владе. Суверене обвезнице које издају владе укључене су само ако имају рок доспећа дужи од годину дана.
13-70-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 13 о климатским акцијама, који је укључен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“. Циљ одрживог развоја 13 има за циљ спровођење обавезе према Оквирној конвенцији Уједињених нација о климатским променама да се до средине века постигне климатски неутралан свет како би се ограничило глобално загревање на знатно испод 2°C, са циљем да се достигне 1,5°C (у поређењу са прединдустријским временом). Такође има за циљ јачање отпорности и адаптивног капацитета земаља на природне опасности повезане са климом и катастрофе које из тога произилазе.
13-70-methodology: >-
  Као дио транзиције ка климатској неутралности и климатској отпорности, ЕУ настоји да преусмјери јавна и приватна улагања у области у којима ће подржати овај циљ. Из тог разлога, ЕУ је усвојила Таксономију ЕУ као систем класификације за одрживе економске активности и Европски стандард зелених обвезница као добровољни „златни“ стандард за тржиште зелених обвезница. На нивоу ЕУ, ублажавање и прилагођавање климатским променама интегрисани су у све главне програме потрошње, а ЕУ се такође обавезала да ће подржати међународне акције у области климе.
  Овај индикатор је главни индикатор за праћење напретка ка циљевима Осмог акционог програма за животну средину (8. ЕАП).
13-70-long_term_objective: >-
  Нема описа
14-10-title: Заштићена морска подручја
14-10-definition: >-
  Овај индикатор мери обим морских заштићених подручја (МПА) у морским водама ЕУ. МПА су жаришта биодиверзитета и могу служити различитим циљевима, укључујући заштиту врста и станишта, очување и обнављање биодиверзитета и коришћење ресурса унутар дефинисаних еколошких граница. МПА такође могу имати позитиван утицај на суседна подручја.
14-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору Циља одрживог развоја 14.5.1 „Покривеност заштићених подручја у односу на морска подручја“.
14-10-methodology: >-
  Директива ЕУ о птицама и Директива о стаништима имају за циљ да одрже или обнове повољан статус очувања заштићених станишта и врста, као и да заштите њихово одрживо коришћење и управљање. Директива о стаништима има за циљ да допринесе обезбеђивању биодиверзитета ЕУ, укључујући морску средину, и наводи девет типова морских станишта и 16 врста за које је потребно проглашење морског подручја, док Директива о птицама наводи додатних 60 врста птица чије очување захтева заштиту морског подручја.
  Стратегија ЕУ о биодиверзитету има за циљ да заштити најмање 30% европског копна и мора, укључујући национално одређена подручја и локације Натура 2000.
  Заштићена морска подручја могу служити различитим сврхама, укључујући заштиту врста и станишта, очување и обнављање биодиверзитета и коришћење ресурса унутар дефинисаних еколошких граница. Специфични циљеви управљања постављени су за сва заштићена морска подручја (МПА), која се често састоје од различитих зона са дозвољеном и забрањеном употребом.
  ЕУ је такође укључена у дискусије на Генералној скупштини Уједињених нација о међународном правно обавезујућем споразуму о очувању биодиверзитета у подручјима ван националне јурисдикције (BBNJ).
14-10-long_term_objective: >-
  Нема описа
14-21-title: Процјењени трендови у биомаси рибљег фонда
14-21-definition: >-
  Биомаса рибљег фонда је функција биолошких карактеристика као што су бројност и тежина и може указивати на статус рибљег фонда када се мери у односу на референтне вредности. Ово је индикатор заснован на моделу који се израчунава коришћењем резултата квантитативних процена фондова појединачних врста. Он приказује средњу вредност биомасе рибљег фонда у поређењу са 2003. годином. Пуна временска серија се ажурира годишње, понекад укључујући нова средства због новодоступних квантитативних процена, што може довести до малих разлика од једне године објављивања до друге.
14-21-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.4.1 „Удео рибљих залиха у оквиру биолошки одрживих нивоа“.
14-21-methodology: >-
  Заједничка рибарска политика има за циљ да обезбеди дугорочну одрживост сектора одржавањем репродукције рибљих залиха за високе дугорочне приносе, побољшањем расподеле риболовних могућности, очувањем морских ресурса и подржавањем профитабилности индустрије. Оквирна директива о морској стратегији предузима свеобухватан и интегрисан приступ заштити морске средине и природних ресурса са циљем постизања доброг еколошког статуса морских вода ЕУ које су еколошки разноврсне, чисте, здраве и продуктивне.
14-21-long_term_objective: >-
  Нема описа
14-30-title: Процјењени тренд у риболовном притиску
14-30-definition: >-
  Индикатор представља моделски заснован средњи риболовни притисак (F/Fmsy) у морским водама ЕУ североисточног Атлантика и суседних мора (FAO подручје 27) и Средоземног и Црног мора (FAO подручје 37) за које тренутни риболовни морталитет (F) премашује процењени риболовни морталитет који је у складу са постизањем максималног одрживог приноса (Fmsy). Риболовни морталитет је мера угинућа или уклањања рибе из популације услед риболова. Риболовни морталитет који је у складу са постизањем максималног одрживог приноса одређен је дугорочном просечном величином залиха која омогућава риболов на овом нивоу. Да би риболов био одржив, F не би требало да пређе Fmsy – тачку у којој се највећи улов може узети из рибљег залиха током неограниченог периода без наношења штете.
14-30-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.4.1 „Удео рибљих залиха у оквиру биолошки одрживих нивоа“.
14-30-methodology: >-
  Заједничка рибарска политика има за циљ да обезбеди дугорочну одрживост сектора одржавањем репродукције рибљих залиха за високе дугорочне приносе, побољшањем расподеле риболовних могућности, очувањем морских ресурса и подржавањем профитабилности индустрије. Оквирна директива о морској стратегији предузима свеобухватан и интегрисан приступ заштити морске средине и природних ресурса са циљем постизања доброг еколошког статуса морских вода ЕУ које су еколошки разноврсне, чисте, здраве и продуктивне.
14-30-long_term_objective: >-
  Нема описа
14-40-title: Купалишта са одличним квалитетом воде
14-40-definition: >-
  Индикатор показује удео купалишта у унутрашњости и на обали са одличним квалитетом воде у ЕУ и другим европским земљама. Квалитет воде за купање процењује се према стандардима за микробиолошке параметре (цревне ентерококе и ешерихија коли). Индикатор се израчунава на основу покретног просека од најмање 16 узорака у четири године како би се осигурало да се постигне реална класификација воде за купање.
  Директива о водама за купање (ДВК) захтева од држава чланица да идентификују и процене квалитет свих копнених и морских вода за купање и да класификују те воде као „лоше“, „задовољавајуће“, „добре“ или „одличне“ у зависности од нивоа откривених фекалних бактерија.
14-40-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, и ка Циљу одрживог развоја 6 о обезбеђивању доступности и одрживог управљања водом и санитацијом за све, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
14-40-methodology: >-
  Директива ЕУ о водама за купање једна је од успешних прича у политици ЕУ о водама, усмерена на заштиту људског здравља и животне средине допуњавањем Оквирне директиве о водама.
14-40-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 100.
14-50-title: Глобална средња киселост површинске морске воде
14-50-definition: >-
  Овај индикатор показује просечну годишњу концентрацију водоничних јона у површинској морској води североисточног Атлантика и суседних мора, изражену у наномолима по литру (nmol/l). Повећање концентрације водоничних јона одговара смањењу pH вредности и повећању киселости морске воде.
  Овај тренд је покренут повећањем атмосферског угљен-диоксида (CO2), што повећава унос CO2 у океан. Коперникус морска служба реконструише трендове у глобалној ацидификацији океана од 1985. године.
14-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.3.1 „Просечна киселост мора (pH) мерена на договореном скупу репрезентативних станица за узорковање“.
14-50-methodology: >-
  Циљ одрживог развоја 14 има за циљ заштиту и осигурање одрживог коришћења океана. То укључује смањење загађења мора и утицаја закисељавања океана, окончање прекомерног риболова и очување морских и приобалних подручја и екосистема. Циљ одрживог развоја 14 има јаке међузависности са широким спектром других циљева одрживог развоја, јер океани одржавају приобалне економије и средства за живот, доприносе производњи хране и функционишу као понор угљеника. Препознајући ограничења у решавању управљања океанима на нивоу држава чланица или Европе, ЕУ ради на обезбеђивању јачег система управљања океанима како би се постигло очување и одрживо коришћење регионалних и међународних вода. ЕУ такође има низ стратегија усмерених на ублажавање климатских промена и смањење емисије гасова стаклене баште, укључујући CO2.
14-50-long_term_objective: >-
  Нема описа
14-60-title: Морске воде погођене еутрофикацијом
14-60-definition: >-
  Индикатор показује удео еутрофичних морских вода у ексклузивној економској зони (ИЕЗ). Подручје се класификује као еутрофично ако су, током више од 25% дана посматрања у датој години, концентрације хлорофила а, као замена за еутрофикацију, изнад 90. перцентила референтне основне вредности из периода 1998–2017.
  Еутрофикација је процес којим вишак хранљивих материја – углавном фосфора и азота – доводи до повећаног раста биљног материјала, посебно цветања алги, у воденом телу, што резултира смањењем квалитета воде. То, заузврат, може изазвати смрт водених организама услед хипоксије. Антропогене активности, као што су пољопривреда, аквакултура, индустрија и канализација, главни су извори уноса хранљивих материја у проблематична подручја.
14-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 14 о очувању и одрживом коришћењу океана, мора и морских ресурса за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 14.1.1: (а) „Индекс еутрофикације обале“.
14-60-methodology: >-
  Циљ одрживог развоја 14 има за циљ очување и одрживо коришћење океана, мора и морских ресурса, што захтева, између осталог, спречавање и смањење загађења мора и утицаја закисељавања океана.
  Оквирна директива о морској стратегији (MSFD) захтева од држава чланица да извештавају о еутрофикацији за своја регионална мора сваких 6 година.
14-60-long_term_objective: >-
  Нема описа
15-11-title: Шумска површина
15-11-definition: >-
  Индикатор мјери удио шумских површина у поређењу са укупном површином земље. Подаци који се користе за овај индикатор потичу из Европских шумских рачуна (EFA) и у складу су са ФАО дефиницијом шума.
15-11-intention: >-
  Индикатор се користи за праћење напретка ка циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, што је уграђено у приоритете Европске комисије у оквиру „Одржавање квалитета живота : безбједност хране, вода и природа“. Индикатор се може сматрати идентичним глобалном индикатору циља одрживог развоја 15.1.1 „Шумска површина као удио у укупној површини земљишта“.
15-11-methodology: >-
  Циљ одрживог развоја 15 тежи заштити, обнови и промоцији очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. Ово укључује напоре за одрживо управљање шумама и заустављање крчења шума, борбу против дезертификације, обнављање деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
15-11-long_term_objective: >-
  Стратегија за шуме Европске комисије до 2030. године фокусира се на садњу најмање 3 милијарде додатних стабала до 2030. године.
15-20-title: Kopnena zaštićena područja
15-20-title: Заштићена копнена подручја
15-20-definition: >-
  Овај индикатор мјери обим и удио копнених заштићених подручја, која укључују национално одређена заштићена подручја и подручја Натура 2000. Национално одређено подручје је подручје заштићено националним законодавством.
  Натура 2000 подручја су одређена ради заштите европских врста и станишта, како је наведено у директивама ЕУ о стаништима и птицама.
15-20-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је укључен у Приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
  Индикатор се може сматрати сличним глобалним индикаторима Циљева одрживог развоја 15.1.2 „Удео важних локација за копнени и слатководни биодиверзитет који су покривени заштићеним подручјима, по типу екосистема“ и 15.4.1 „Покривеност важних локација за планински биодиверзитет заштићеним подручјима“.
15-20-methodology: >-
  Директива ЕУ о птицама и Директива о стаништима имају за циљ да одрже или обнове повољан статус очувања заштићених станишта и врста, као и да заштите њихово одрживо коришћење и управљање. Директива о птицама штити све врсте дивљих птица и њихова станишта. Директива о стаништима штити више од 1.300 других ретких, угрожених или ендемских врста дивљих животиња и биљака и 233 врсте природних станишта. Поред тога, мрежа заштићених подручја Натура 2000 обухвата подручја која су државе чланице ЕУ одредиле у складу са Директивама о птицама и Директивама о стаништима.
15-20-long_term_objective: >-
  Стратегија ЕУ за биодиверзитет има за циљ да заштити најмање 30% европског копна и мора, укључујући национално одређена подручја и локације Натура 2000.
15-42-title: Утицај суше на екосистеме
15-42-definition: >-
  Овај индикатор приказује површину погођену сушом праћењем негативних аномалија у продуктивности вегетације у подручјима са озбиљним дефицитом влажности земљишта током вегетационе сезоне (више од једне стандардне девијације од дугорочног просека - посматрано путем података даљинске детекције у резолуцији од 500×500 метара из Коперникус ЕМС Европске опсерваторије за сушу Заједничког истраживачког центра Европске комисије).
  Индикатор покрива само пољопривредне суше са дефицитом влажности земљишта који узрокује смањену продуктивност вегетације због недовољних падавина, за разлику од хидролошких суша, које се јављају када ниске залихе воде постану очигледне у потоцима, акумулацијама и нивоима подземних вода, обично након вишемесечне метеоролошке суше.
15-42-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је уграђен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
15-42-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање крчења шума, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
15-42-long_term_objective: >-
  Стратегија за земљиште 2030 поставила је циљ нулте нето експлоатације земљишта до 2050. године.
15-50-title: Површина у ризику од тешке ерозије земљишта од воде
15-50-definition: >-
  Индикатор процењује површину потенцијално погођену јаком ерозијом земљишта водом, као што су прскање кише, топљење снега и потоци (губитак земљишта > 10 тона/хектар/годишње). Ова површина је изражена у km2 и као проценат укупне неразместиве, ерозивне површине у земљи. Тамо где нема земљишта које је у ризику од ерозије земљишта водом веће од 10 тона по хектару, земља ће имати вредност нула. Ерозија земљишта се и даље може јављати у подручјима ових земаља, али брзином мањом од 10 тона по хектару.
  Ови бројеви се процењују коришћењем модификоване верзије Ревидиране универзалне једначине губитка земљишта (RUSLE 2015), која даје процене са резолуцијом од 100 m на основу рецензираних улазних слојева ерозивности кише, еродибилности земљишта, топографије, коришћења земљишта и управљања земљиштем. Укључене су следеће класе номенклатуре CORINE Land Cover (CLC): Пољопривредне површине (2), шуме и полуприродна подручја (3) искључујући плаже, дине, пешчане равнице (3.3.1), голе стене (3.3.2), глечере и стални снег (3.3.5). Генерално, вештачке, песковите, камените и залеђене површине, као и мочваре и водена тела, нису укључене.
15-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта и ка Циљу одрживог развоја 2 о искорењивању глади, постизању безбедности хране и побољшаној исхрани и промоцији одрживе пољопривреде, који су уграђени у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
15-50-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање дефорестације, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
  Циљ одрживог развоја 2 има за циљ да оконча глад и неухрањеност и обезбеди приступ безбедној, хранљивој и довољној храни. Остваривање овог циља ће у великој мери зависити од промоције одрживих производних система и повећања улагања у руралну инфраструктуру и пољопривредна истраживања и развој.
  Стратегија за земљиште до 2030. године препознаје ерозију као претњу земљишту у ЕУ. Заједничка пољопривредна политика Европе поставља захтеве за заштиту коришћених пољопривредних површина од ерозије и успоставља оквир стандарда који, између осталог, имају за циљ да допринесу спречавању ерозије тла.
15-50-long_term_objective: >-
  Нема описа
15-60-title: Индекс птица
15-60-definition: >-
  Индикатор је композитни вишеврсни индекс, који мери релативну бројност одабраних уобичајених врста птица повезаних са одређеним стаништима. Ретке врсте су искључене. Заступљене су три групе врста птица: уобичајене врсте пољопривредног земљишта (39 врста), уобичајене шумске врсте (34 врсте) и све уобичајене врсте птица (168 врста; укључујући врсте пољопривредног земљишта и шуме).
15-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта и ка Циљу одрживог развоја 2 о искорењивању глади, постизању безбедности хране и побољшаној исхрани и промоцији одрживе пољопривреде, који су уграђени у приоритете Европске комисије у оквиру „Одржавање квалитета живота: безбедност хране, вода и природа“.
15-60-methodology: >-
  Циљ одрживог развоја 15 има за циљ заштиту, обнављање и промоцију очувања и одрживог коришћења копнених, унутрашњих водених и планинских екосистема. То укључује напоре за одрживо управљање шумама и заустављање дефорестације, борбу против дезертификације, обнову деградираног земљишта и тла, заустављање губитка биодиверзитета и заштиту угрожених врста.
  Циљ одрживог развоја 2 има за циљ да оконча глад и неухрањеност и обезбеди приступ безбедној, хранљивој и довољној храни. Остваривање овог циља ће у великој мери зависити од промоције одрживих производних система и повећања улагања у руралну инфраструктуру и пољопривредна истраживања и развој.
  Птице и станишта угрожених и птица селица заштићена су Директивом о птицама. Многа станишта која користе птице такође су заштићена Директивом о стаништима. Стратегија ЕУ о биодиверзитету за 2030. годину посебно наводи да ове Директиве о природи треба у потпуности спровести у настојању да се зауставе и преокрену трендови губитка биодиверзитета.
15-60-long_term_objective: >-
  Нема описа
15-61-title: Индекс лептира на травнатим површинама
15-61-definition: >-
  Индекс лептира травнатих травњака ЕУ интегрише трендове популације 17 врста лептира које се прате широм ЕУ и израчунава се коришћењем података из свих 27 земаља чланица ЕУ. Почетна година националне временске серије креће се од 1990. до 2023. године, стога је индекс тренутно представљен као агрегирани подаци ЕУ са изравнаним вредностима. Податке је интегрисала и обезбедила организација Butterfly Conservation Europe, партнерство Европског програма за праћење лептира, пројекат EMBRACE.
15-61-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 15 о заштити, обнови и промоцији одрживог коришћења земљишта, који је уграђен у приоритете Европске комисије у оквиру „Одржавања квалитета живота: безбедност хране, вода и природа“.
15-61-methodology: >-
  Стратегија ЕУ за биодиверзитет до 2030. године има за циљ обнављање деградираних екосистема и заустављање и преокретање тренда смањења броја опрашивача. Директива о стаништима и Директива о птицама играју централну улогу у остваривању ових циљева. У јуну 2018. године, Европска комисија је усвојила прву иницијативу ЕУ о опрашивачима, укључујући лептире. Иницијатива поставља оквир за интегрисани приступ решавању проблема смањења броја опрашивача у ЕУ и за ефикасније коришћење постојећих алата и политика.
15-61-long_term_objective: >-
  Нема описа
16-10-title: Стандардизована стопа смртности због убистава
16-10-definition: >-
  Индикатор мери стандардизовану стопу смртности од убистава и повреда које је нанела друга особа са намером да повреди или убије на било који начин, укључујући „касне последице“ напада (кодови Међународне класификације болести (МКБ) X85 до Y09 и Y87.1). Не укључује смртне случајеве узроковане правним интервенцијама или ратом (кодови МКБ Y35 и Y36).
  Подаци о узроку смрти (УСС) односе се на основни узрок, који је - према Светској здравственој организацији (СЗО) - „болест или повреда која је покренула низ морбидних догађаја који су директно довели до смрти или околности несреће или насиља које је изазвало смртоносну повреду“. Подаци о УСС-у се изводе из извода из матичне књиге умрлих.
16-10-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, поштовање наших вредности“.
  Индикатор се може сматрати делом глобалног индикатора Циља одрживог развоја 16.1.2 „Смрти повезане са сукобима на 100.000 становника, по полу, старости и узроку“.
16-10-methodology: >-
  Европска комисија је 24. јула 2020. године усвојила Стратегију безбедносне уније ЕУ за период 2020–2025. Као кључну компоненту стратегије, Комисија је дефинисала нови пут напред у области унутрашње безбједности са акцијама у кључним областима: организовани криминал; тероризам и спречавање насилне радикализације; отпорност наше критичне инфраструктуре и јавних простора; сајбер криминал, укључујући борбу против сексуалног злостављања деце; сарадња у спровођењу закона и размена информација; и истраживање и иновације.
  Безбједност је кључни аспект живота људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који би потенцијално могли да угрозе физички интегритет појединца. Кривична дела су једна од најочигледнијих злоупотреба несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Као такав, овај индикатор доприноси разумевању безбедности друштва.
16-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност од 0,3.
16-20-title: Становништво које пријављује криминал, насиље или вандализам у својој заједници
16-20-definition: >-
  Индикатор показује удио становништва које је пријавило да има проблем са криминалом, насиљем или вандализмом у свом локалном подручју. Ово описује ситуацију у којој испитаник верује да криминал, насиље или вандализам у том подручју представљају проблем за домаћинство, иако се ова перцепција не заснива нужно на личном искуству.
16-20-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, који су уграђени у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, одржавања наших вредности“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 16.1.4 „Удио становништва које се осјећа безбједно шетајући само у свом комшилуку након мрака“.
16-20-methodology: >-
  Безбједност је кључни аспект у животима људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који потенцијално могу угрозити физички интегритет појединца. Кривична дела су једна од најочигледнијих злоупотреба несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Овај индикатор стога допуњује индикатор стопе убистава фокусирајући се на перцепцију несигурности.
  Стратегија Европске комисије „ProtectEU“ има за циљ да повећа капацитет држава чланица ЕУ да заштите друштва и демократије од онлајн и офлајн претњи терориста, криминалаца и непријатељских страних актера. Штавише, осигураће да се безбедносне импликације узму у обзир у свим будућим политикама ЕУ.
16-20-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вредност 4.
16-30-title: Укупна потрошња владе на судове
16-30-definition: >-
  Индикатор мјери укупне државне расходе за судове према Класификацији функција владе (COFOG). Ово укључује расходе за администрацију, рад или подршку грађанским и кривичним судовима и правосудном систему, укључујући спровођење новчаних казни и правних поравнања које изричу судови и рад система условног отпуста и пробације; правно заступање и саветовање у име владе или у име других које влада пружа у новцу или натури. Судови укључују управне трибунале, омбудсмане и слично, а искључују затворске управе.
  Приликом израчунавања индикатора по глави становника, као именилац се користе подаци о просјечном броју становника из Националних рачуна (НР) референтне године (израчунати као аритметичка средина броја становника на дан 1. јануара две узастопне године).
16-30-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-30-methodology: >-
  Добро функционисање правосудних система је важан структурни услов на којем државе чланице ЕУ заснивају своје политике за одрживи раст и социјалну стабилност. Без обзира на модел националног правосудног система или правну традицију на којој се он заснива, квалитет, независност и ефикасност су међу битним параметрима „ефикасног правосудног система“. Побољшање ефикасности правосудних система у државама чланицама идентификовано је као кључна компонента за структурне реформе у Европском семестру, годишњем циклусу за координацију економских политика на нивоу ЕУ. Извештај о владавини права процењује стање правосудних система држава чланица, а Табела о стању правосуђа ЕУ допуњује га праћењем ефикасности, квалитета и независности правосудних система држава чланица. Као кључни део Табеле о стању правосуђа ЕУ, овај индикатор помаже у процени квалитета правосудног система.
16-30-long_term_objective: >-
  Нема описа
16-40-title: Перципирана независност правосуђа
16-40-definition: >-
  Индикатор је осмишљен да истражи перцепцију испитаника о независности правосуђа у државама чланицама ЕУ, са посебним фокусом на перципирану независност судова и судија у одређеној земљи. Подаци о перципираној независности правосудног система потичу из годишњих истраживања Флеш Евробарометра, која су почела 2016. године у име Генералног директората Европске комисије за правосуђе и потрошаче. У овом истраживању, од испитаника се тражи да одговоре на следеће питање: „На основу онога што знате, како бисте оценили правосудни систем у (ОВОЈ ЗЕМЉИ) у погледу независности судова и судија? Да ли бисте рекли да је веома добар, прилично добар, прилично лош или веома лош?“
16-40-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-40-methodology: >-
  Поред довољних финансијских средстава, судије у судовима морају бити у могућности да доносе одлуке без мијешања или притиска политике или других економских актера, како би се осигурало да појединци и предузећа могу у потпуности уживати у својим правима. Поштовање владавине права је предуслов за заштиту свих основних вредности садржаних у Уговорима ЕУ, укључујући демократију и основна права. Побољшање ефикасности правосудних система у државама чланицама идентификовано је као кључна компонента структурних реформи у Европском семестру. Извештај о владавини права процењује стање правосудних система држава чланица, а Табела о стању правосуђа ЕУ га допуњује праћењем ефикасности, квалитета и независности правосудних система држава чланица.
16-40-long_term_objective: >-
  Нема описа
16-50-title: Индекс перцепције корупције
16-50-definition: >-
  Индикатор је композитни индекс заснован на комбинацији анкета и процена корупције из 13 различитих извора, и оцјењује и рангира земље на основу тога колико се јавни сектор у земљи доживљава као корумпиран, при чему резултат 0 представља веома висок ниво корупције, а резултат 100 представља веома чисту земљу. ИПЦ укључује само изворе који дају резултат за скуп земаља/територија и који мере перцепцију корупције у јавном сектору. Да би била укључена у рангирање, земља/територија мора бити укључена у најмање три извора података ИПЦ-а. ИПЦ објављује Транспаренси Интернешенел.
16-50-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 16 о миру, правди и јаким институцијама, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, поштовање наших вредности“.
  Индикатор се може сматрати сличним глобалном индикатору за Циљ одрживог развоја 16.5.2 „Удео предузећа која су имала барем један контакт са јавним службеником и која су платила мито јавном службенику или им је јавни службеник затражио мито у претходних 12 месеци“.
16-50-methodology: >-
  Корупција узрокује финансијску штету смањењем нивоа инвестиција, нарушавањем праведног функционисања унутрашњег тржишта и исцрпљивањем јавних финансија. Такође узрокује друштвену штету јер организоване криминалне групе користе корупцију за чињење других тешких кривичних дела, као што су трговина дрогом и људима. Пошто не постоји смислен начин да се процени апсолутни ниво корупције у земљама или територијама на основу чврстих емпиријских података, прикупљање перцепција о корупцији од оних који су у позицији да понуде процене корупције у јавном сектору је до сада најпоузданија метода поређења релативних нивоа корупције у различитим земљама.
16-50-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност од 88.
16-70-title: Жртве трговине људима по полу
16-70-definition: >-
  Индикатор је композитни индекс заснован на комбинацији анкета и процјена корупције из 13 различитих извора, и оцењује и рангира земље на основу тога колико се јавни сектор у земљи доживљава као корумпиран, при чему резултат 0 представља веома висок ниво корупције, а резултат 100 представља веома чисту земљу. ИПЦ укључује само изворе који дају резултат за скуп земаља/територија и који мере перцепцију корупције у јавном сектору. Да би била укључена у рангирање, земља/територија мора бити укључена у најмање три извора података ИПЦ-а. ИПЦ објављује Транспаренси Интернешенел.
16-70-intention: >-
  Индикатор се користи за праћење напретка ка остваривању Циља одрживог развоја 16 о миру, правди и јаким институцијама, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
16-70-methodology: >-
  Безбједност је кључни аспект у животима људи. Несигурност било које врсте је извор страха и бриге, што негативно утиче на квалитет живота. Физичка несигурност обухвата све спољне факторе који потенцијално могу угрозити физички интегритет појединца. Криминал је један од најочигледнијих узрока несигурности. Анализе физичке несигурности обично комбинују и субјективне и објективне аспекте – субјективну перцепцију несигурности и објективни недостатак безбедности мерен статистиком криминала. Овај индикатор стога допуњује индикатор стопе убистава фокусирајући се на перцепцију несигурности.
  Стратегија Европске комисије „ProtectEU“ има за циљ да повећа капацитет држава чланица ЕУ да заштите друштва и демократије од онлајн и офлајн претњи терориста, криминалаца и непријатељских страних актера. Штавише, осигураће да се безбедносне импликације узму у обзир у свим будућим политикама ЕУ.
16-70-long_term_objective: >-
  Дугорочни циљ за овај индикатор је вриједност 0.
17-10-title: Службена развојна помоћ као удио у бруто националном дохотку
17-10-definition: >-
  Званична развојна помоћ (ОДА) састоји се од грантова, кредита и капиталних инвестиција које врши званични сектор са циљем промоције економског развоја и благостања у земљама у развоју. Исплате евидентирају стварни међународни трансфер финансијских средстава или робе или услуга вреднованих по трошку донатора. ОДА је овде представљена као удео у бруто националном дохотку (БНД). БНД по тржишним ценама једнак је бруто домаћем производу (БДП) умањеном за примарни доходак који резидентне јединице плаћају нерезидентним јединицама, плус примарни доходак који резидентне јединице примају од остатка света. Списак земаља и територија које испуњавају услове за ОДА утврђује Комитет за развојну помоћ ОЕЦД-а.
17-10-intention: >-
  Нето примљена службена развојна помоћ (% БНД-а) у Босни и Херцеговини износила је 1,1206% у 2023. години, према збирци индикатора развоја Свјетске банке, прикупљених из службено признатих извора. Извјештај обједињује пет стубова статистичке успјешности: коришћење података, податковне услуге, податковне производе, изворе података и податковну инфраструктуру.
17-10-methodology: >-
  Европски консензус о развоју из јуна 2017. године истиче потребу да се висок удео званичне развојне помоћи додели најмање развијеним земљама и другим земљама са ниским приходима. Стога би 0,15-0,20% БНД-а требало доделити најмање развијеним земљама у кратком року, а овај износ би се повећао на 0,20% до 2030. године. Консензус заузима свеобухватан приступ имплементацији, комбинујући помоћ са другим ресурсима, са добрим политикама и ојачаним приступом кохерентности политика за развој.
17-10-long_term_objective: >-
  Дугорочни циљ за овај индикатор је 0,7% бруто националног дохотка (БНД).
17-20-title: Финансирање ЕУ земљама у развоју према извору финансирања
17-20-definition: >-
  Индикатор приказује укупно званично и приватно финансирање ЕУ земљама у развоју. Састоји се од нето исплата званичне развојне помоћи (ОДА), осталих званичних токова (ОЗТ), приватних токова (углавном страних директних инвестиција, СДИ) и грантова од приватних агенција и невладиних организација.
  ОДА се састоји од грантова или концесионих кредита које додељује званични сектор са главним циљем промоције економског развоја и благостања у земљама примаоцима. ОЗТ су трансакције које се не квалификују као ОДА, било зато што нису првенствено оријентисане на развој или зато што имају елемент гранта мањи од 25%. Приватни токови укључују директне инвестиције, обвезнице, извозне кредите и мултилатералне приватне токове.
  Грантови од приватних агенција и националних невладиних организација састоје се од развојне помоћи и средстава за помоћ, заједно са свим додатним доприносима у натури, укључујући, на пример, приходе од продаје божићних честитки у добротворне сврхе или посебне апеле (на пример, за помоћ у катастрофама).
17-20-intention: >-
  Индикатори који се користе за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, који је уграђен у приоритете Европске комисије у оквиру „Нове ере за европску одбрану и безбедност“ и „Заштите наших демократија, подржавања наших вредности“.
17-20-methodology: >-
  Циљ 17, Званична развојна помоћ и други финансијски ресурси, било јавни или приватни, домаћи или међународни, биће потребни.
  ЕУ примењује кохерентан и подржавајући приступ развоју, где сви финансијски токови ка земљама у развоју, укључујући помоћ, инвестиције и трговину, раде заједно са мобилизацијом домаћих ресурса и добрим политикама како би се помогло у изградњи капацитета и подршци самосталности у тим земљама. Индикатор стога допуњује индикатор о развојној помоћи.
17-20-long_term_objective: >-
  Нема описа
17-31-title: Увоз ЕУ из најмање развијених земаља
17-31-definition: >-
  Овај индикатор је дефинисан као удио укупног увоза ван ЕУ који долази из земаља које су УН класификовале као најмање развијене. Он показује у којој мјери производи из ових земаља приступају тржишту ЕУ. Информације за овај индикатор пружају компаније са обимом трговине изнад утврђеног прага и прикупљају се на основу царинских декларација. Ове информације затим државе чланице прилагођавају како би узеле у обзир утицај трговине испод овог прага.
17-31-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој, што је уграђено у приоритете Европске комисије у оквиру „Нова ера за европску одбрану и безбедност“ и „Заштита наших демократија, очување наших вредности“.
  Потенцијални допринос трговине одрживом развоју је одавно препознат. ЕУ предводи пут ка праведнијем глобалном партнерству са земљама у развоју заузимајући одговоран приступ трговинској и инвестиционој политици, на пример кроз стратегију „Трговина за све“ (2015) која има за циљ да помогне земљама у развоју да потпуније учествују на глобалном тржишту. Штавише, ЕУ олакшава увоз из земаља у развоју одобравањем смањења царина у оквиру своје Генерализоване шеме преференција и пружањем „Помоћи за трговину“ усмерене на подршку трговинској инфраструктури, помоћи везаној за трговину и развоју приватног сектора. Коначно, Споразум из Котонуа регулише односе ЕУ са 79 земаља Африке, Кариба и Пацифика (АКП), фокусирајући се на развојну сарадњу, политичку сарадњу, као и економску и трговинску сарадњу.
17-31-methodology: >-
  ЕУ је ажурирала своју Стратегију помоћи за трговину 2017. године, како би одражавала значајне промене политика и на глобалном нивоу - посебно Агенду 2030 - и на нивоу ЕУ, укључујући нови Европски консензус о развоју и трговини за све. Ажурирана стратегија има за циљ побољшање кохерентности помоћи за трговину са другим политикама и инструментима ЕУ, укључујући трговинске споразуме ЕУ и једностране шеме преференција. Фокус на најмање развијене земље је кључни део ажуриране стратегије. ЕУ је 2021. године ревидирала своју трговинску стратегију, са циљем да одражава свој нови, одрживији модел раста, као и циљеве одрживог развоја.
17-31-long_term_objective: >-
  Нема описа
17-40-title: Бруто дуг опште државе
17-40-definition: >-
  Индикатор је дефинисан у консолидованој верзији Уговора о функционисању Европске уније из 2012. године и даље развијен у Уредби Савета (ЕЗ) бр. 479/2009, са изменама и допунама, и Уредби (ЕУ) бр. 549/2013 Европског парламента и Савета (ЕСА 2010) и накнадним законским изменама, допуњен даљим тумачењима и смерницама Евростата, посебно Приручником о државном дефициту и дугу као односу укупног бруто државног дуга по номиналној вредности на крају године и БДП-а по текућим тржишним ценама. Државни дуг се дефинише као укупни консолидовани бруто дуг по номиналној вредности на крају године у следећим категоријама државних обавеза (како је дефинисано у ЕСА 2010): валута и депозити (АФ.2), дужничке хартије од вредности (АФ.3) и кредити (АФ.4). Сектор опште државе обухвата подсекторе централне владе, државне владе, локалне самоуправе и фондова социјалног осигурања.
17-40-intention: >-
  Централна банка Босне и Херцеговине доставила је податке Агенцији за статистику БиХ. Статистика бруто дуга опште владе саставља се према Мастришким критеријумима и у складу са ЕСА 2010. Изворни подаци су статистика спољног дуга ЦББХ, монетарна и финансијска статистика ЦББХ и база података о дугу Одјељења за статистику и публикације Централне банке Босне и Херцеговине (ЦББХ) – ГФС и јединица за финансијске рачуне. Бруто дуг опште владе обухвата дуг опште владе БиХ. Бруто дуг опште владе БиХ састоји се од спољног дуга и домаћег дуга. Спољни дуг састоји се од уговорених кредита БиХ (државе) и уговорених директних кредита ентитета. Домаћи дуг састоји се од домаћих дужничких хартија од вредности и кредита.
17-40-methodology: >-
  „Да би се помогло другима да побољшају своје економије, неопходно је да се економије саме ЕУ одрже на одрживом путу. Макроекономско управљање, које има за циљ да обезбеди финансијску стабилност у ЕУ, стога је један од стубова доприноса ЕУ спровођењу Циљева одрживог развоја. Државни дуг би стога требало да буде ограничен на управљив ниво и не би требало да прелази 60% БДП-а, како је наведено у Уговору о функционисању Европске уније. Ово чини основу Пакта стабилности и раста и Поступка прекомерног дефицита (ЕДП), који обезбеђује фискалну одрживост. Амбициозна реформа оквира економског управљања ЕУ ступила је на снагу 2024. године, са циљем јачања одрживости дуга држава чланица и промовисања одрживог и инклузивног раста у свим државама чланицама.“
17-40-long_term_objective: >-
  Нема описа
17-50-title: Удио еколошких пореза у укупним пореским приходима
17-50-definition: >-
  Индикатор мјери удио пореза на заштиту животне средине у укупним приходима од пореза и социјалних доприноса. Порези на заштиту животне средине су дефинисани као порези чија је пореска основица физичка јединица (или њена замена) нечега што има доказан, специфичан негативан утицај на животну средину. Приходи од пореза на заштиту животне средине долазе из четири врсте пореза: порези на енергију (који доприносе око три четвртине укупног износа), порези на транспорт (око једне петине укупног износа) и порези на загађење и ресурсе (око 4% укупног износа).
17-50-intention: >-
  Припремљена је листа еколошких пореза за Босну и Херцеговину. Сви идентификовани еколошки порези груписани су у четири категорије: порези на енергију, порези на транспорт, загађење и ресурсе. Списак пореза на CO2, као и осталих пореза на CO2, не постоји у Босни и Херцеговини за извјештајни период. Еколошки порези темеље се на постојећој Националној пореској листи (НТЛ) Централне банке Босне и Херцеговине и изведени су из административних података идентификованих у изворима пореских података. Сви подаци прикупљају се директно из административних извора: Управе за индиректно опорезивање Босне и Херцеговине, Пореске управе Републике Српске, Пореске управе Федерације Босне и Херцеговине и Дирекције за финансије Брчко Дистрикта.
17-50-methodology: >-
  У глобалном контексту, гдје обрасци потрошње у једном региону могу озбиљно утицати на обрасце производње у другим дијеловима свијета, посебно је важно да цијене одражавају стварне трошкове потрошње и производње. Стога би требало да укључују и плаћања за штету коју активности узрокују људском здрављу и животној средини. Политике ЕУ, попут Европског зеленог плана, позивају на прелазак са пореза на рад на порезе на енергију и животну средину као дио „озелењавања“ пореских система, што значи да би се приходи од пореза на животну средину требали повећати у односу на порезе на рад. Европски семестар прати напредак ка циљевима постављеним у европским стратегијама.
17-50-long_term_objective: >-
  Нема описа
17-60-title: Покривеност брзим интернетом према врсти подручја
17-60-definition: >-
  Индикатор мјери удио домаћинстава са фиксном везом на мрежу веома високог капацитета (VHCN). Мрежа веома високог капацитета је или електронска комуникациона мрежа која се у потпуности састоји од оптичких влакана барем до дистрибутивне тачке на локацији услуге, или електронска комуникациона мрежа способна да обезбеди, под нормалним условима вршног оптерећења, сличне мрежне перформансе у смислу расположивог низводног и узводног пропусног опсега, отпорности, параметара везаних за грешке и латенције и њених варијација.
  Подаци се односе и на оптичко влакно до просторија (FTTP) и на Спецификацију интерфејса за услуге преноса података преко кабла (DOCSIS) 3.1. DOCSIS омогућава додавање преноса података великог пропусног опсега постојећим системима кабловске телевизије.
  „Рурална подручја“ су дефинисана као она са мање од 100 људи по км².
17-60-intention: >-
  Индикатор се користи за праћење напретка ка Циљу одрживог развоја 17 о ревитализацији глобалног партнерства за одрживи развој и Циљу одрживог развоја 9 о индустрији, иновацијама и инфраструктури. Циљеви одрживог развоја 9 и 17 су уграђени у приоритет Европске комисије „Нова ера за европску одбрану и безбедност“. Циљ одрживог развоја 17 је такође уграђен у приоритет Европске комисије „Заштита наших демократија, одржавање наших вредности“. Припрема Европе за дигитално доба је стога један од шест приоритета Комисије за период 2019–2024. Циљ је да дигитална трансформација функционише за људе и предузећа, а истовремено помогне у постизању циља климатски неутралне Европе до 2050. године. Циљ одрживог развоја 17 препознаје важност приступа науци, технологији и иновацијама за одрживи развој. Број претплата на широкопојасни интернет на 100 становника један је од индикатора које УН користе за мерење напретка ка повезаном циљу. У својој Дигиталној стратегији за 2020. годину, Европска комисија је истакла посвећеност ЕУ развоју Глобалне стратегије за дигиталну сарадњу, која ће одражавати циљеве одрживог развоја.
17-60-methodology: >-
  У својој комуникацији из 2016. године под називом „Повезивање за конкурентно јединствено дигитално тржиште – ка европском гигабитном друштву“, Европска комисија је поставила визију за европско гигабитно друштво, операционализовану кроз три циља за 2025. годину. ЕУ тежи гигабитној повезаности за места која покрећу друштвено-економски развој, 5Г покривености за сва урбана подручја и све главне копнене саобраћајне руте и приступу интернет конекцији од најмање 100 Mbps за сва европска домаћинства. Стратегија „Од фарме до трпезе“ потврдила је овај циљ позивајући на убрзање увођења брзог широкопојасног интернета у руралним подручјима како би се постигао циљ од 100% приступа до 2025. године.
  У марту 2021. године, Комисија је – у свом Дигиталном компасу 2030 – представила визију и путеве за дигиталну трансформацију Европе до 2030. године, фокусирајући се на четири главне области: (1) вештине, (2) безбедна и одржива дигитална инфраструктура, (3) дигитална трансформација предузећа и (4) дигитализација јавних услуга.
17-60-long_term_objective: >-
  Надовезујући се на Саопштење из 2016. године, Дигитални компас дефинише циљ да до 2030. године сва европска домаћинства буду покривена гигабитном мрежом, а сва насељена подручја 5G мрежом.
