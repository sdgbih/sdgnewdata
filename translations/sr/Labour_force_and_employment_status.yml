Labour_force_and_employment_status: Радна снага и статус запослености
POP: Становништво
EMP: Запослене особе
NEMP: Незапослене особе
WANT: Особе које би жељеле да раде (траже запослење или не)
NWANT: Особе које не желе да раде
EMP_PT: Запослене особе које раде са скраћеним радним временом
EMP_TEMP: Запослене особе са привременим уговором
UEMP_PT: Недовољно запослене особе које раде са скраћеним радним временом
