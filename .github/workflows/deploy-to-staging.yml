# ****************************************************************************
# NOTES:
#
# In order for this to work, you must replace STAGING_ORGANISATION below
# with the name of your staging GitHub organisation, in line 53.
# You must also replace STAGING_SITE_REPOSITORY below with the name of your
# staging site repository.
#
# For example, if your staging organisation is "my-sdg-staging-org", and your
# staging site repository is "open-sdg-site-starter", then use:
#
# curl -X POST https://api.github.com/repos/my-sdg-staging-org/open-sdg-site-starter/dispatches
#
# ****************************************************************************

name: Deploy to staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
        
    - name: Locate Progress code
      run: |
        python - <<'PY'
        import os
        import glob
        import sdg

        root = os.path.dirname(sdg.__file__)
        print("SDG PACKAGE:", sdg.__file__)
        print("PROGRESS FILES:")
        for path in glob.glob(os.path.join(root, "**", "*Progress*.py"), recursive=True):
            print(path)
        PY
        
    - name: Inspect ProgressMeasure
      run: |
        python - <<'PY'
        import inspect
        import sdg.ProgressMeasure as pm

        print("PROGRESS MODULE:")
        print(inspect.getfile(pm))

        print("\nPROGRESS SOURCE:")
        print(inspect.getsource(pm))
        PY

    - name: Locate language method
      run: |
        python - <<'PY'
        import os
        import glob

        import sdg

        root = os.path.dirname(sdg.__file__)
        print("SDG PACKAGE:", root)
        print("LANGUAGE METHODS:")

        for path in glob.glob(os.path.join(root, "**", "*.py"), recursive=True):
            try:
                with open(path, "r", encoding="utf-8") as f:
                    for number, line in enumerate(f, 1):
                        if "def language(" in line:
                            print(f"{path}:{number}: {line.strip()}")
            except Exception:
                pass
        PY
        
    - name: Inspect Indicator language method
      run: |
        python - <<'PY'
        import inspect
        from sdg.Indicator import Indicator

        print("INDICATOR CLASS:")
        print(Indicator)

        print("\nINDICATOR SOURCE FILE:")
        print(inspect.getfile(Indicator))

        print("\nLANGUAGE METHOD SOURCE:")
        source = inspect.getsource(Indicator.language)
        print(source)
        PY
        
    - name: Locate translate method
      run: |
        python - <<'PY'
        import os
        import glob

        import sdg

        root = os.path.dirname(sdg.__file__)
        print("SDG PACKAGE:", root)
        print("TRANSLATE METHODS:")

        for path in glob.glob(os.path.join(root, "**", "*.py"), recursive=True):
            try:
                with open(path, "r", encoding="utf-8") as f:
                    for number, line in enumerate(f, 1):
                        if "def translate(" in line:
                            print(f"{path}:{number}: {line.strip()}")
            except Exception:
                pass
        PY
        
    - name: Inspect Indicator translate method
      run: |
        python - <<'PY'
        import inspect
        from sdg.Indicator import Indicator

        print("INDICATOR TRANSLATE METHOD:")
        print(inspect.getsource(Indicator.translate))
        PY
    - name: Inspect Progress calculation 5.61
      run: |
        python - <<'PY'
        from pathlib import Path
        import inspect
        import sdg.ProgressMeasure as pm

        path = Path(inspect.getfile(pm))
        source = path.read_text()

        needle = "            self.score = self.get_score()\n"

        addition = """            self.score = self.get_score()

            if self.inid in ('5-61', '5.61'):
                print("\\n===== PROGRESS DEBUG 5.61 =====")
                print("TAG:", self.tag)
                print("FILTERED DATA:")
                print(self.data.to_string(index=False))
                print("base_year:", self.base_year)
                print("base_value:", self.base_value)
                print("current_year:", self.current_year)
                print("current_value:", self.current_value)
                print("target:", self.target)
                print("target_year:", self.target_year)
                print("direction:", self.direction)
                print("progress_value:", self.progress_value)
                print("status:", self.status)
                print("score:", self.score)
                print("===== END PROGRESS DEBUG 5.61 =====\\n")
        """

        if needle not in source:
            raise Exception("Could not find insertion point in ProgressMeasure.py")

        source = source.replace(needle, addition, 1)
        path.write_text(source)

        print("Diagnostic code inserted into:", path)
        PY
    - name: Build data
      run: |
        python scripts/build_data.py
    - name: Place public files
      run: |
        cp public/robots-staging.txt _site/robots.txt
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: _site
        clean: true
    - name: Waiting 4 minutes for staging data deployment
      run: |
        sleep 240
    - name: Rebuild site
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.token }}"\
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/sdgbih/sdgnew/actions/workflows/deploy-to-staging.yml/dispatches \
          -d '{"ref":"develop"}'
